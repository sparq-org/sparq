# ast-grep rule (harness copy): find every `impl <Trait> for <T>` for the
# list-stratum A/B tasks, regardless of trait-path qualification. Mirrors
# .claude/skills/ast-grep/rules/impl-of-trait.yml (the SKILL's home copy). The harness
# keeps a self-contained copy so a measurement run does not depend on the skill tree.
# RETARGET: change the `regex:` final segment (Display / Default / Iterator / …).
id: impl-of-trait
language: rust
rule:
  kind: impl_item
  has:
    field: trait
    regex: '(^|::)Display$'
