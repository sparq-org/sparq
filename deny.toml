# cargo-deny supply-chain policy (sq-0sye) — practices mapped from
# prod-solid-server onto this Rust workspace. Run by:
#   - .github/workflows/supply-chain.yml          (gating, every push/PR)
#   - .github/workflows/dependency-monitoring.yml (daily advisories watchdog)
# Locally: `cargo deny check` (install: `cargo install --locked cargo-deny`).
#
# Schema targets cargo-deny >= 0.18 (advisories/licenses "version 2" — no
# vulnerability/unmaintained severity knobs, no copyleft/osi-fsf fields).
# [OPUS-4.8]

[graph]
# Check every target the workspace can build for, so a license/advisory that
# only appears on (e.g.) wasm or windows is still caught.
all-features = true

[advisories]
# RustSec advisory DB (the default source); pulled fresh in CI.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Refuse any dependency pinned to a version that has been YANKED from the
# registry — a yanked crate is an unbuildable / pulled release.
yanked = "deny"
# Advisory IDs to tolerate — each MUST carry a justification. The policy here is
# strict on what matters: a YANKED crate ALWAYS fails the gate, and every
# vulnerability fails UNLESS it is one of the explicitly justified `ignore` ids
# listed below. Four advisories are tolerated: two maintenance-status notices
# (`paste`, `bincode`) with no reported vulnerability, plus two quick-xml
# < 0.41 DoS advisories still present ONLY in a transitive copy. The gate re-flags
# anything else (any new advisory, or a yanked crate).
#
# RUSTSEC-2026-0194 (quick-xml < 0.41: quadratic run time checking a start tag for
# duplicate attribute names — a CPU/availability DoS, NOT memory-unsafety) and
# RUSTSEC-2026-0195 (quick-xml < 0.41: unbounded namespace-declaration allocation in
# `NsReader` — a memory-exhaustion/availability DoS, again NOT memory-unsafety). Both
# are fixed by the same upgrade (quick-xml >= 0.41.0) and both are reachable when
# parsing untrusted RDF/XML or SPARQL-Results-XML. Our OWN crates were bumped
# 0.40 -> the patched 0.41 (sparq-conformance / sparq-engine `service` / sparq-geo),
# so those parse paths are fixed for BOTH advisories. These two ignores tolerate ONLY
# the transitive `quick-xml 0.37.5` still pinned by the oxigraph 0.5.x stack
# (oxrdfxml 0.2.3 / sparesults 0.3.3 / spareval 0.2.6): oxigraph has published NO
# release that moves off quick-xml 0.37, so this transitive copy cannot be upgraded
# without an upstream oxigraph bump. Remove BOTH ignores once oxigraph ships a
# quick-xml >= 0.41 release (the gate then surfaces them as unmatched ignores).
# Announcements: https://github.com/tafia/quick-xml/issues/969 (0194) and
#                https://github.com/tafia/quick-xml/issues/970 (0195)
#
# [GPT-5.6] RUSTSEC-2024-0436 (unmaintained `paste` proc-macro) was removed with
# the old GPU closure (sq-l8bv), then reintroduced transitively by parquet 59 for
# sparq-arrow's default-OFF `parquet` feature. This is a maintenance notice, not a
# vulnerability, and parquet currently offers no paste-free release. Track removal
# in sq-cx4w2 and delete this ignore once parquet drops `paste`.
#
# [OPUS-5] RUSTSEC-2025-0134 (unmaintained `rustls-pemfile`) has NO ignore here, and
# must not regain one. It was dropped under sq-g2xs (ureq 2 → ureq 3 removed the crate
# from the tree), re-added when the solid-server-rs import brought it back for the mTLS
# PEM parse, and dropped again under sq-5ah3p — this time by migrating the parse itself:
# `sparq-lws-core/src/tls.rs` and `sparq-server/src/main.rs` decode PEM through
# `rustls-pki-types`' `PemObject` (reached via rustls' own `pki_types` re-export), which
# is the maintained API the archived crate had been a thin shim over since its 2.x line.
# No workspace crate declares it, it is absent from Cargo.lock, and the matching VEX
# statement + cargo-vet exemption were removed in the same change. Anything that
# reintroduces the crate now FAILS this gate, which is the intent.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is archived/unmaintained, an informational maintenance advisory with no reported vulnerability. It is reintroduced only through parquet 59 for sparq-arrow's default-OFF parquet feature, and parquet currently offers no paste-free release. Remove when parquet drops paste (follow-up bead sq-cx4w2)." },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is permanently unmaintained, but the advisory reports no vulnerability and the release is considered complete by its former maintainers. It is pulled transitively by qwt 0.4.0 through hdt 0.7.3; sparq does not deserialize untrusted bincode input. Remove when hdt/qwt replaces bincode (tracked in the worker follow-up)." },
  # quick-xml 0.37.5 (oxigraph 0.5.x transitive) — see the justification above.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 quadratic-time duplicate-attribute DoS. Our own crates are on the patched 0.41; this tolerates ONLY the transitive quick-xml 0.37.5 pinned by the oxigraph 0.5.x stack (oxrdfxml/sparesults/spareval), for which no fixed upstream release exists yet. Availability-only, not memory-unsafety. Remove when oxigraph bumps quick-xml >=0.41. https://github.com/tafia/quick-xml/issues/969" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 unbounded namespace-declaration allocation in NsReader — memory-exhaustion DoS. Same fix (>=0.41.0) and same scope as RUSTSEC-2026-0194: our own crates are on the patched 0.41; this tolerates ONLY the transitive quick-xml 0.37.5 pinned by the oxigraph 0.5.x stack (oxrdfxml/sparesults/spareval), for which no fixed upstream release exists yet. Availability-only, not memory-unsafety. Remove when oxigraph bumps quick-xml >=0.41. https://github.com/tafia/quick-xml/issues/970" },
]

[licenses]
# Confidence floor for SPDX detection from license text (cargo-deny default).
confidence-threshold = 0.8
# Allowlist — permissive licenses only. A dependency whose license is not on
# this list (and has no per-crate exception below) FAILS the gate.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BlueOak-1.0.0",
]
# Per-crate exceptions: a crate here may use a license NOT in `allow` above,
# scoped to that crate ONLY (so the broad allowlist stays permissive-only).
# Populated from the REAL tree via `cargo deny check licenses` — every license
# below is OSI-approved and/or FSF-Free; none is strong/network copyleft.
exceptions = [
  # --- sophia / HDT ecosystem (CeCILL-B — a French BSD-style permissive
  #     licence, FSF-Free). Pulled in only by `hdt` -> sparq-hdt (opt-in HDT
  #     archive support). Scoped per-crate rather than allowing CeCILL-B tree-wide.
  { crate = "mownstr@0.3.1",            allow = ["CECILL-B"] },
  { crate = "sophia@0.9.0",             allow = ["CECILL-B"] },
  { crate = "sophia_api@0.9.0",         allow = ["CECILL-B"] },
  { crate = "sophia_c14n@0.9.0",        allow = ["CECILL-B"] },
  { crate = "sophia_inmem@0.9.0",       allow = ["CECILL-B"] },
  { crate = "sophia_iri@0.9.0",         allow = ["CECILL-B"] },
  { crate = "sophia_isomorphism@0.9.0", allow = ["CECILL-B"] },
  { crate = "sophia_resource@0.9.0",    allow = ["CECILL-B"] },
  { crate = "sophia_rio@0.9.0",         allow = ["CECILL-B"] },
  { crate = "sophia_term@0.9.0",        allow = ["CECILL-B"] },
  { crate = "sophia_turtle@0.9.0",      allow = ["CECILL-B"] },
  # --- ntriple (AFL-3.0 — Academic Free License, OSI-approved + FSF-Free,
  #     permissive). Also only via `hdt` -> sparq-hdt.
  { crate = "ntriple@0.1.1", allow = ["AFL-3.0"] },
  # --- resiter (MPL-2.0 — Mozilla Public License, FILE-level weak copyleft,
  #     OSI-approved; safe to consume as an unmodified dependency). Via sophia.
  { crate = "resiter@0.5.0", allow = ["MPL-2.0"] },
  # --- target-lexicon (Apache-2.0 WITH LLVM-exception — strictly MORE
  #     permissive than the plain Apache-2.0 already on the allowlist; the SPDX
  #     `WITH` expression just isn't matched by the bare "Apache-2.0" entry).
  #     Build-dep of pyo3 -> sparq-py.
  { crate = "target-lexicon@0.13.5", allow = ["Apache-2.0 WITH LLVM-exception"] },
  # --- webpki-roots / webpki-root-certs (CDLA-Permissive-2.0 — Community Data License
  #     Agreement, a permissive data licence covering the bundled Mozilla CA root set).
  #     Pulled in by the rustls TLS stack (ureq 3, reqwest/hyper-rustls). [OPUS-4.8] sq-g2xs:
  #     ureq 3's rustls feature adds `webpki-root-certs` (the DER-encoded variant) alongside
  #     `webpki-roots`; the stale `webpki-roots@0.26.11` exception was dropped (no longer in tree).
  { crate = "webpki-roots@1.0.7",      allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-root-certs@1.0.8", allow = ["CDLA-Permissive-2.0"] },
  # --- libbz2-rs-sys (bzip2-1.0.6 — the "bzip2 and libbzip2 License v1.0.6", a
  #     BSD-style permissive licence; FSF-Free, freely redistributable, no
  #     copyleft). This is the pure-Rust libbz2 rewrite that `bzip2 0.6` links by
  #     default instead of the C libbz2; `bzip2 0.6.1` itself is MIT OR Apache-2.0
  #     (already allowed). Scoped per-crate so the broad allowlist stays
  #     permissive-only. [OPUS-4.8] PR #700 (dependabot bzip2 0.5 -> 0.6).
  { crate = "libbz2-rs-sys@0.2.5", allow = ["bzip2-1.0.6"] },
  # --- xxhash-rust (BSL-1.0 — the Boost Software License, OSI-approved + FSF-Free,
  #     permissive; no copyleft). Transitive of the `redis` client (solid-server-rs
  #     import pre-flight, sq-gg0qq.1) behind the opt-in `redis-replay` feature of the
  #     incoming crates. Scoped per-crate so the broad allowlist stays as-is. [FABLE-5]
  { crate = "xxhash-rust@0.8.16", allow = ["BSL-1.0"] },
]

[bans]
# Surface (but do not fail on) duplicate versions of the same crate — useful
# signal for dependency-tree bloat without blocking routine churn.
#
# DUPLICATE-VERSION BLOCKER REGISTRY (sq-98w7z.7, surveyed 2026-07-27, [OPUS-5])
# -----------------------------------------------------------------------------
# This is the single source of truth for WHY the duplicates this check reports
# are still here. It exists so the next person who reads a `multiple-versions`
# warning does not re-run the same survey. Duplicate versions are a COMPILE-TIME
# and BINARY-SIZE cost, not a runtime hot-path cost — keep that claim honest.
#
# Survey method (re-run any of these to re-verify):
#   cargo tree -d --workspace           # duplicates reachable on the host target
#   cargo tree -i <crate>@<version>     # who pulls a lagging version
#   cargo update --workspace --dry-run  # is a semver-compatible bump available?
#
# State at survey: 49 crate names carry more than one version in Cargo.lock, and
# `cargo update --workspace --dry-run` locks ZERO packages — the tree is already
# at its maximum semver-compatible resolution. Every workspace crate sits on the
# NEWEST side of every duplicate pair it participates in; each lagging version is
# held by a third-party crate that is itself at its latest published release. So
# no duplicate can currently be removed without either an upstream release or a
# major dependency bump that changes a public API (which needs its own bead).
#
# Per-family blockers for the families the epic named:
#
#  * hashbrown x4 (0.14.5 / 0.15.5 / 0.16.1 / 0.17.1) — the workspace is on 0.17.
#      0.14.5 <- dashmap 6.2.1 (<- oxigraph 0.5.9 <- sparq-bench) and hdt 0.7.3
#        (<- sparq-hdt). Both are the newest stable releases; dashmap 7 is
#        release-candidate only. Unblocks when dashmap cuts a stable 7 AND
#        oxigraph adopts it, or when hdt publishes past 0.7.3.
#      0.15.5 <- wasmparser 0.244.0 alone, via wit-bindgen 0.51 <- wasip2/wasip3
#        <- getrandom. That chain is `cfg(target_os = "wasi")`-only, so it is a
#        LOCK-ONLY entry: it is never compiled for any target sparq builds and
#        costs nothing today. Unblocks when wit-bindgen bumps its wasm-tools
#        major (0.244 is the ceiling of wit-bindgen 0.51's requirement).
#      0.16.1 <- gpu-allocator 0.28.0 and spade 2.15.1 (<- geo 0.33.1 <-
#        sparq-geo). Both are the newest releases.
#  * foldhash x2 (0.1.5 / 0.2.0) — 0.1.5 is reachable ONLY through hashbrown
#      0.15.5, i.e. the same WASI-only chain, and disappears with it. sparq's own
#      direct use (sparq-fedplan) is 0.2.
#  * rustc-hash x2 (1.1.0 / 2.1.3) — 1.1.0 <- naga / naga-types / wgpu-core
#      30.0.0 only, which is the newest wgpu. All 25 sparq crates are on 2.1.3.
#  * oxrdf x2 (0.2.4 / 0.3.3) and oxttl x2 (0.1.8 / 0.2.3) — DELIBERATE and
#      already documented in crates/sparq-canon/Cargo.toml. rdf-canon 0.15.3 (the
#      newest release, and the validated RDFC-1.0 implementation) speaks oxrdf
#      0.2, so sparq-canon carries the aliased `oxrdf02`/`oxttl01` bridge pair.
#      The git-pinned `solid-oidc-verifier` (see [sources] below) independently
#      pulls oxttl 0.1 -> oxrdf 0.2. BOTH must move before the pair collapses.
#  * quick-xml x2 (0.37.5 / 0.41.0) — 0.37.5 <- oxrdfxml 0.2.3 and sparesults
#      0.3.3, both the newest published releases. Every sparq crate is on 0.41.
#
# Why this stays "warn" and does not become "deny" + a skip list: the surveyed
# set is entirely upstream-blocked, so denying would add a ~49-entry allowance
# table and red this lane on routine churn without removing a single version.
# Revisit if a NEW duplicate ever appears that sparq itself introduced.
multiple-versions = "warn"
# When duplicates exist, highlight the whole dependency tree for each.
highlight = "all"
wildcards = "allow"

[sources]
# Crates from an unknown registry / git source are rejected — the supply-chain
# boundary. crates.io is the only allowed registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The workspace vendors spargebra via `[patch.crates-io]` with a PATH source
# (vendor/spargebra). A path patch is not a registry/git source, so it does not
# trip unknown-registry/unknown-git; this block documents the boundary and is
# the hook for any future git source we deliberately allow.
# [FABLE-5] sq-gg0qq.1 (solid-server-rs import pre-flight): `solid-oidc-verifier` is
# the maintainer's standalone, security-audited DPoP/Solid-OIDC verifier crate
# (github.com/jeswr — the SAME owner as this repo's upstream). It is consumed as a
# GIT dependency pinned to an exact rev (89c8962…, Cargo.lock committed) because no
# crates.io release exists yet; the handover (jeswr/solid-server-rs#14) directs
# "depend on it, don't absorb it". cargo-deny allows the ORIGIN here; the exact-rev
# pin lives in the consuming crate's Cargo.toml + the committed lockfile. Re-pin to
# a tagged release (and drop this entry for a registry dep) once the verifier cuts one.
allow-git = ["https://github.com/jeswr/solid-oidc-verifier"]
