[package]
name = "sparq-vcq-tee"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sparq-proved-evaluator-model = { path = "../../zk/sparql-evaluator/model", features = ["authenticated-rdf"] }
sparq-vcq-disclosed = { path = "../disclosed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ciborium = "0.2.2"
x509-cert = "0.2.5"
der = "0.7"
p384 = { version = "0.13", features = ["ecdsa"] }
const-oid = { version = "0.9", features = ["db"] }
# Enclave side: Nitro Secure Module and vsock.
aws-nitro-enclaves-nsm-api = { version = "0.5.2", optional = true }
vsock = { version = "0.5.4", optional = true }
serde_bytes = { version = "0.11", optional = true }

[features]
default = []
# The program that runs inside the enclave.
enclave = ["dep:aws-nitro-enclaves-nsm-api", "dep:vsock", "dep:serde_bytes"]
# The holder-side driver that talks to the enclave and measures Q1-Q5.
host = ["dep:vsock", "sparq-vcq-disclosed/fixtures"]

[dev-dependencies]
sparq-vcq-disclosed = { path = "../disclosed", features = ["fixtures"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { version = "0.10", features = ["oid"] }

[[bin]]
name = "sparq-vcq-tee-enclave"
path = "src/bin/enclave.rs"
required-features = ["enclave"]

[[bin]]
name = "sparq-vcq-tee-holder"
path = "src/bin/holder.rs"
required-features = ["host"]
