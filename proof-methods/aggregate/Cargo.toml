[package]
name = "sparq-verifiable-aggregate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "getrandom/js"]

[dependencies]
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "digest", "rand_core", "zeroize"] }
bulletproofs = { version = "=5.0.0", default-features = false }
merlin = { version = "=3.0.0", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "=0.12.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
getrandom = { version = "=0.2.17", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
wasm-bindgen = { version = "=0.2.122", optional = true, default-features = false, features = ["std"] }
