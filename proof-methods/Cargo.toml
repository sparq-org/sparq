# Detached workspace for proof methods that are not zero-knowledge circuits or
# zkVM programs, and for comparison baselines. It is not a member of the root
# workspace, so the engine, the default build and the wasm bundle are unchanged.
[workspace]
members = ["disclosed", "tee"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[patch.crates-io]
spargebra = { path = "../vendor/spargebra-shim" }

[profile.release]
debug = 0
