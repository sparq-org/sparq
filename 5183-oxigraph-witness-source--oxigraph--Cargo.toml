[package]
edition = "2024"
rust-version = "1.87"
name = "oxigraph"
version = "0.5.9"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SPARQL database and RDF toolkit"
homepage = "https://oxigraph.org/"
documentation = "https://docs.rs/oxigraph"
readme = "README.md"
keywords = [
    "RDF",
    "SPARQL",
    "graph-database",
    "database",
]
categories = ["database-implementations"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/oxigraph"
resolver = "2"

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["rocksdb"]
http-client = ["oxhttp"]
http-client-native-tls = [
    "http-client",
    "oxhttp/native-tls",
]
http-client-rustls-native = [
    "http-client",
    "oxhttp/rustls-ring-native",
]
http-client-rustls-webpki = [
    "http-client",
    "oxhttp/rustls-ring-webpki",
]
js = [
    "getrandom/wasm_js",
    "oxsdatatypes/js",
    "js-sys",
]
rdf-12 = [
    "oxrdfio/rdf-12",
    "spareval/sparql-12",
]
rocksdb = ["oxrocksdb-sys"]
rocksdb-debug = []
rocksdb-pkg-config = ["oxrocksdb-sys/pkg-config"]

[lib]
name = "oxigraph"
path = "src/lib.rs"

[[test]]
name = "store"
path = "tests/store.rs"

[[bench]]
name = "store"
path = "benches/store.rs"
harness = false
required-features = ["rocksdb"]

[dependencies.dashmap]
version = ">=5.4, <7.0"

[dependencies.oxiri]
version = "0.2.11"

[dependencies.oxrdf]
version = "=0.3.3"
features = [
    "oxsdatatypes",
    "rdfc-10",
]

[dependencies.oxrdfio]
version = "=0.2.5"

[dependencies.oxsdatatypes]
version = "=0.2.2"

[dependencies.rand]
version = ">=0.8,<0.10"

[dependencies.rustc-hash]
version = "2.1"

[dependencies.siphasher]
version = ">=0.3.10, <2.0"

[dependencies.sparesults]
version = "=0.3.3"

[dependencies.spareval]
version = "=0.2.6"
features = [
    "sep-0002",
    "sep-0006",
    "calendar-ext",
]

[dependencies.spargebra]
version = "=0.4.6"
features = [
    "sep-0002",
    "sep-0006",
]

[dependencies.thiserror]
version = ">=1.0.50, <3.0"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.getrandom]
version = "0.3.4"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.js-sys]
version = "0.3.85"
optional = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.rand]
version = "0.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies.libc]
version = "0.2.155"

[target.'cfg(not(target_family = "wasm"))'.dependencies.oxhttp]
version = "0.3"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.oxrocksdb-sys]
version = "=0.5.9"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.bzip2]
version = ">=0.4, <0.7"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.codspeed-criterion-compat]
version = ">=2.3.3,<5.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.csv]
version = "1.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.oxhttp]
version = "0.3"
features = ["rustls-ring-native"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.tempfile]
version = "3.1"

