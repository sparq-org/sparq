# [GPT-5.6] Issue #3675 — restore auto-merge arms GitHub drops after merge-group churn.
#
# NOT A GATE. This runs only on schedule / workflow_dispatch, never on a PR head. The
# review:pass label is the pipeline's attested verdict and remains mandatory; CI state
# alone can never make this workflow arm a PR. A null autoMergeRequest is insufficient:
# queued PRs expose a live mergeQueueEntry while autoMergeRequest is null and are skipped.
name: re-arm sweeper

on:
  schedule:
    # Offset from auto-arm's ten-minute cron so both policies do not start together.
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch:

# [OPUS-5] #3760 — `contents: write` IS THE FIX, and it is load-bearing.
#
# Enabling auto-merge is a repository WRITE operation. With `contents: read` this job's
# token is denied with
#     GraphQL: Resource not accessible by integration (enablePullRequestAutoMerge)
# which is exactly what run 30033315483 (2026-07-23T18:21Z) hit on PR #3454 — OPEN,
# non-draft, CLEAN, review:pass. auto-arm.yml armed two PRs 90 minutes earlier
# (run 30027010495, 16:52Z) on the SAME repository with the SAME plain GITHUB_TOKEN; its
# only difference was `contents: write`. This is NOT a maintainer-only setting:
# `allow_auto_merge` is already true and the `main` ruleset carries no integration
# restriction. Do not downgrade this back to `contents: read` — the wiring pin in
# scripts/tests/test_arm_capability_wiring.py reds if anyone does.
#
# The App token is still PREFERRED when configured (same identity batch-merge.yml uses,
# so a merge it triggers is attributed to the App rather than github-actions[bot]); the
# workflow token is the fallback and, with write, is sufficient to arm.
#
# [OPUS-5] #4548 added checks/issue write scopes for the original stuck-arm phase.
# [GPT-6 Astra] #6438 replaces that Checks rerequest with an Actions job rerun under
# the preferred App. The legacy checks grant is retained pending separate review.
# `issues: write` covers labels and recovery comments; `contents: write` also covers
# `PUT /pulls/{n}/update-branch` for the CONFLICTING class.
permissions:
  # [GPT-6 Astra] #6438: cancelled Actions recovery uses the preferred App's
  # actions:write, not this legacy checks grant. Grants remain unchanged here;
  # fallback GITHUB_TOKEN has no actions:write and is refused before any claim POST.
  contents: write
  pull-requests: write
  checks: write
  issues: write

concurrency:
  group: re-arm-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    name: restore dropped arms + sweep stuck arms
    runs-on: ubuntu-latest
    # 10 (was 5): headroom for the #3759 bounded transient-retry backoff (up to
    # 10s+30s per idempotent READ during a platform blip) without hitting the
    # job ceiling; the sweep itself is unchanged.
    # 15 (was 10) for #4548: the stuck-arm phase adds one live GraphQL read plus a
    # PAGINATED check-run read per ARMED PR, and heads here really do carry 800 check
    # runs (8 pages). The armed population is small (4 at the time of writing) but the
    # per-PR cost is not, so the ceiling has to allow for a backlog.
    timeout-minutes: 15
    env:
      # Secrets are not readable from step `if:` expressions — mirror the id into env
      # so the mint step can be skipped fail-soft when the App is not configured.
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
    steps:
      - name: Mint the sparq-orchestrator App token (arms must fire merge events)
        id: app-token
        if: env.ORCHESTRATOR_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}

      # Always execute the trusted default-branch policy, including on manual dispatch.
      - name: Checkout re-arm policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # [OPUS-5] #3776 — CHECK OUT THE WHOLE DIRECTORY, never a file-by-file manifest.
          # A file-by-file list has to be updated by hand every time a script gains a
          # sibling import; forgetting once is what bricked the GATING arm check on every
          # stale PR ref (#3776 — see auto-arm.yml for the full account). This sweep runs
          # only on schedule/dispatch so its workflow file and its `ref:` are always the
          # same commit, but the enumeration is the same latent trap; a directory pattern
          # cannot go stale. Cone mode (the actions/checkout default) is what makes
          # `scripts` recursive — do NOT reintroduce `sparse-checkout-cone-mode: false`.
          # Pinned by scripts/tests/test_arm_capability_wiring.py.
          sparse-checkout: scripts

      - name: Self-test policy
        run: |
          python3 scripts/gh_retry.py --self-test
          # [OPUS-5] #1135: the Release-PR exclusion this sweep consults. Its own
          # self-test runs FIRST so a regression in the shared predicate reds the
          # cron before any arm is attempted.
          python3 scripts/release_pr_guard.py --self-test
          python3 scripts/rearm-sweeper.py --self-test

      # [OPUS-5] #3760 — FAIL LOUD ONCE, AT THE START. Before this step existed, a token
      # that could not arm produced one per-PR SKIP line every ten minutes and nothing
      # else; the arm gap was only noticed by hand. This probe reds the job in seconds
      # with a single ::error naming the exact permission/setting/secret to change. It
      # MUST consume the same GH_TOKEN expression as the sweep step below, or it would
      # attest a token the sweep does not use (pinned by the wiring test).
      - name: Probe arm capability (one loud error, never per-PR)
        id: probe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/rearm-sweeper.py
          --repo "$REPO"
          --default-branch "$DEFAULT_BRANCH"
          --probe-arm-capability

      # A per-PR arm failure no longer aborts the sweep: failures are collected, every
      # remaining candidate is still considered, the run summarises them, and it exits
      # non-zero so a failed arm can never read as a green run.
      - name: Re-arm dropped reviewed PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/rearm-sweeper.py
          --repo "$REPO"
          --default-branch "$DEFAULT_BRANCH"
          --max-rearms 10

      # [OPUS-5] #4548 — THE OTHER DIRECTION. The step above restores a DROPPED arm; this
      # one is its dual, and it must run AFTER it so a PR re-armed seconds ago is inside
      # the grace window rather than immediately re-examined. `rearm` skips every PR with
      # a live autoMergeRequest, so until this existed an armed-but-unmergeable PR had NO
      # exit: it looked healthy, held its `area:` partition against the readiness
      # frontier, and nothing swept it. MEASURED 2026-07-27T10:45Z: queue depth 0, three
      # PRs armed, all three individually unmergeable for three DIFFERENT reasons, zero
      # merges in the preceding hour.
      #
      # It fails open on everything pending or unreadable and bounds its mutations per
      # tick — see scripts/rearm-sweeper.py's stuck-arm section. Pinned by
      # scripts/tests/test_arm_capability_wiring.py::TestStuckArmWiring.
      #
      # [OPUS-5] #4642 — WHY THIS STEP CARRIES AN `if:` AT ALL, when every other step here
      # is deliberately unconditional. A step with no `if:` is skipped the moment ANY
      # earlier step fails, so this terminal was skipped precisely when the step in front
      # of it broke — and the step in front of it is the one that breaks. MEASURED in #4642
      # over the 200 most recent runs of this workflow: 5 failed, and both retained failures
      # were the "Re-arm dropped reviewed PRs" step directly above. An armed-but-unmergeable
      # PR has no other exit, so the tick that most needs the sweep is the tick that skipped
      # it.
      #
      # NOT `always()`. This step MUTATES the repository (disarm / relabel / comment /
      # update-branch), and `always()` would run it through a cancellation. Two conditions,
      # each for one reason:
      #   * `!cancelled()` — a failed predecessor still runs the sweep; a cancelled run
      #     does not.
      #   * `steps.probe.outcome == 'success'` — preserves the probe's "fail loud ONCE, at
      #     the start" contract. A token that cannot arm cannot remediate either, so
      #     without this the sweep would trade one ::error for a per-PR wall of 403s.
      #     `outcome` (not `conclusion`) is the pre-`continue-on-error` result, so it
      #     cannot be laundered green by marking the probe continue-on-error.
      # The permitted expression is pinned EXACTLY, and every other `if:` on a sweep step
      # reds, in test_arm_capability_wiring.py::TestTheYamlSeamIsGating.
      - name: Sweep armed-but-unmergeable PRs to a counted terminal state
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/rearm-sweeper.py
          --repo "$REPO"
          --default-branch "$DEFAULT_BRANCH"
          --phase stuck-arm
          --max-stuck-actions 5
