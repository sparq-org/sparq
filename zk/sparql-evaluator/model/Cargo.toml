[package]
name = "sparq-proved-evaluator-model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
evaluate = ["dep:sparq-engine", "dep:sparq-core", "dep:spargebra", "dep:oxrdf", "dep:oxttl"]
graph-results = ["evaluate", "dep:sparq-canon", "sparq-engine/deterministic-blank-nodes"]
# [OPUS-5.5] Native-only V5 issuer-authenticated RDF model; no guest, host or proof use.
authenticated-rdf = ["graph-results", "dep:ed25519-dalek"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sparq-engine = { path = "../../../crates/sparq-engine", default-features = false, features = ["regex", "digest"], optional = true }
sparq-core = { path = "../../../crates/sparq-core", default-features = false, optional = true }
sparq-canon = { path = "../../../crates/sparq-canon", default-features = false, optional = true }
spargebra = { version = "=0.4.6", features = ["sparql-12", "sep-0006", "sparq-deterministic-paths"], optional = true }
oxrdf = { version = "0.3", features = ["rdf-12"], optional = true }
oxttl = { version = "0.2", features = ["rdf-12"], optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc"], optional = true }

# [GPT-6] Explicit native corpus adapter; no proof or default-feature claim.
[[example]]
name = "proof_bindings"
required-features = ["evaluate"]
