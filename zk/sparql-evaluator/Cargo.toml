# [GPT-6] Detached, opt-in full-evaluation research backend.
[workspace]
members = ["model", "host", "methods"]
default-members = ["model"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
risc0-zkvm = { version = "=3.0.6", default-features = false }

[patch.crates-io]
spargebra = { path = "../../vendor/spargebra" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "thin"
