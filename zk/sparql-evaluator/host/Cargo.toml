[package]
name = "sparq-proved-evaluator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# zkp-16.2: optional sparq-query-protocol adapter over the V3 relation.
# Off by default; the protocol crate is a dependency-free leaf, and enabling this
# feature changes neither the root workspace, the engine nor any wasm build.
[features]
default = []
vcq = ["dep:sparq-query-protocol", "sparq-proved-evaluator-model/graph-results"]
# zkp-14.5: low-level V5 authenticated-RDF API over its own separately
# pinned guest image. Off by default; the exact guest and its APIs are unchanged.
authenticated-rdf = [
    "dep:spargebra",
    "sparq-proved-evaluator-model/authenticated-rdf",
    "sparq-proved-evaluator-methods/authenticated-rdf",
]
# zkp-14.6: optional sparq-query-protocol adapter over the V5 relation.
# Off by default; only combines the two features above and adds no dependency.
vcq-authenticated = ["vcq", "authenticated-rdf"]
# Measurement only: also build the V5 image that reports per-phase cycles, for
# the `paper_sweep` example's `--phases`. Never a production image.
phase-cycles = ["authenticated-rdf", "sparq-proved-evaluator-methods/phase-cycles"]

[dependencies]
sparq-proved-evaluator-model = { path = "../model" }
sparq-query-protocol = { path = "../../../crates/sparq-query-protocol", optional = true }
sparq-proved-evaluator-methods = { path = "../methods" }
risc0-zkvm = { workspace = true, features = ["client", "std", "disable-dev-mode"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Same version and features as the model's parser; used for the V5 host query profile check.
spargebra = { version = "=0.4.6", features = ["sparql-12", "sep-0006", "sparq-deterministic-paths"], optional = true }

[dev-dependencies]
sparq-proved-evaluator-model = { path = "../model", features = ["graph-results"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc"] }
sparq-canon = { path = "../../../crates/sparq-canon", default-features = false }

# Exports the separate V5 guest; never overwrites an existing directory.
[[example]]
name = "export_authrdf_guest"
required-features = ["authenticated-rdf"]

# Paper measurements: issuer, holder and verifier costs per suite and mode.
[[example]]
name = "paper_sweep"
required-features = ["authenticated-rdf"]
