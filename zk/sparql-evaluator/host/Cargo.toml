[package]
name = "sparq-proved-evaluator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# [OPUS-5.5] zkp-16.2: optional sparq-query-protocol adapter over the V3 relation.
# Off by default; the protocol crate is a dependency-free leaf, and enabling this
# feature changes neither the root workspace, the engine nor any wasm build.
[features]
default = []
vcq = ["dep:sparq-query-protocol", "sparq-proved-evaluator-model/graph-results"]
# [OPUS-5.5] zkp-14.5: low-level V5 authenticated-RDF API over its own separately
# pinned guest image. Off by default; the exact guest and its APIs are unchanged.
authenticated-rdf = [
    "sparq-proved-evaluator-model/authenticated-rdf",
    "sparq-proved-evaluator-methods/authenticated-rdf",
]
# [OPUS-5.5] zkp-14.6: optional sparq-query-protocol adapter over the V5 relation.
# Off by default; only combines the two features above and adds no dependency.
vcq-authenticated = ["vcq", "authenticated-rdf"]

[dependencies]
sparq-proved-evaluator-model = { path = "../model" }
sparq-query-protocol = { path = "../../../crates/sparq-query-protocol", optional = true }
sparq-proved-evaluator-methods = { path = "../methods" }
risc0-zkvm = { workspace = true, features = ["client", "std", "disable-dev-mode"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
sparq-proved-evaluator-model = { path = "../model", features = ["graph-results"] }

# [OPUS-5.5] Exports the separate V5 guest; never overwrites an existing directory.
[[example]]
name = "export_authrdf_guest"
required-features = ["authenticated-rdf"]
