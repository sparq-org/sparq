[package]
name = "sparq-canon-check-guest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
sparq-canon = { path = "../../../../crates/sparq-canon", default-features = false }
sha2 = "0.10"

[patch.crates-io]
risc0-zkvm = { path = "../../../../vendor/zk-sdk/risc0-zkvm-3.0.6" }
risc0-zkos-v1compat = { path = "../../../../vendor/zk-sdk/risc0-zkos-v1compat-2.2.3" }
ark-crypto-primitives = { path = "../../../../vendor/zk-sdk/ark-crypto-primitives-0.5.0" }
ark-relations = { path = "../../../../vendor/zk-sdk/ark-relations-0.5.1" }

[profile.release]
debug = 0
lto = "thin"
