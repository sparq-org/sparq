[package]
name = "sparq-proved-evaluator-methods"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# zkp-14.5: also build the separately pinned V5 guest and generate
# SPARQ_AUTHRDF_GUEST_{ELF,ID} in their own file. Off by default; the exact
# guest's flags, target subdirectory, manifest, lock and constants never depend on it.
[features]
default = []
authenticated-rdf = []
# Also build the measurement-only V5 image with per-phase cycle reporting and
# generate SPARQ_AUTHRDF_PHASES_GUEST_{ELF,ID}. Never a production image.
# Also builds the separate canonicalisation regression image.
phase-cycles = ["authenticated-rdf"]

[build-dependencies]
risc0-build = { version = "=3.0.6", features = ["unstable"] }
risc0-binfmt = "=3.0.5"

# Guest workspaces are built by this crate's `build.rs`, not `embed_methods`.
# `guest-authrdf` needs `authenticated-rdf`; `guest-canon` needs `phase-cycles`.
[package.metadata.risc0]
methods = ["guest", "guest-authrdf", "guest-canon"]
