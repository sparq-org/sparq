[package]
name = "sparq_zk_compose_core"
type = "lib"
authors = ["sparq"]

[dependencies]
# Same tag as crates/sparq-zk/tests/fixtures/noir_poseidon2 — the commitment
# scheme's cross-vector chain depends on this exact library version.
poseidon = { git = "https://github.com/noir-lang/poseidon", tag = "v0.3.0" }
# SPARQL float comparisons (FILTER over xsd:double operands).
# [OPUS-4.8] sq-5reoy: switched from the in-tree path dep to the released face
# repo pinned by tag — the zk/ieee754 tree was externalized to sparq-org/noir_IEEE754
# (#1599). v0.10.0 was byte-identical to the last in-tree state (incl. the
# sq-25mgo deep-underflow fix); [FABLE-5] sq-dtmg9: v0.11.0 additively adds
# abs, named constants, and from_field/to_field (kernels untouched, same
# nargo 1.0.0-beta.21 pin). nargo fetches this git dep the same way it already
# fetches the poseidon dep above (precedent: poseidon v0.3.0).
sparq_ieee754 = { git = "https://github.com/sparq-org/noir_IEEE754", tag = "v0.11.0" }
# The V2 reserved-sentinel / lane-constant mirror (zk/dual-leaf-v2), shared with
# the host pin in crates/sparq-zk/tests/dual_leaf_v2_noir_pin.rs. A PATH dep on
# the sibling library keeps ONE copy of those constants.
sparq_dual_leaf_v2 = { path = "../../dual-leaf-v2" }
