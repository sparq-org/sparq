flate = "flate"          # flate2 crate name fragment (typos splits on the digit)
SELEC = "SELEC"          # "SELECT" wrapped mid-token in prose
UPDAT = "UPDAT"          # "UPDATE" wrapped
SER = "SER"              # SPARQL "SERVICE"/"SET" fragment in a plan table
