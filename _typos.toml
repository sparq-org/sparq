# typos (crate-ci/typos) config — HARD spell-check gate (bead sq-5fd1). [OPUS-4.8]
#
# `typos` is conservative by design (it only flags high-confidence misspellings),
# which makes it a sound HARD gate. The allowlist below pins the FALSE POSITIVES it
# raises on this codebase: SPARQL/RDF keyword fragments that appear split across
# table cells or wrapped lines, domain identifiers, author surnames, and short
# code-token abbreviations. Each entry is "as-typed = corrected-to-itself", which is
# typos' idiom for "this token is intentional, leave it".
#
# Genuine misspellings are fixed in the prose, NOT allowlisted — keep this list to
# real domain vocabulary so the gate keeps catching actual typos.

[files]
# Don't scan generated, vendored, or build output.
extend-exclude = [
  "target",
  "vendor",
  "**/vendor",
  "node_modules",
  "**/node_modules",
  "Cargo.lock",
  # [OPUS-4.8] sq-5reoy: the "zk/xpath/vendor" exclude was dropped — the zk/xpath tree
  # moved to the sparq-org/noir_XPath face repo (#1599); "**/vendor" above still covers
  # any remaining vendored subtree.
  "*.svg",
  # Vendored third-party ontologies (sparql-zkp-ontologies, ISWC 2025; MIT-licensed
  # as of 2026-06-21): reproduced verbatim with British spelling + many author
  # surnames; treat as vendored. [OPUS-4.8]
  "crates/sparq-trust/ontologies/zkp-sparql",
  # [OPUS-4.8] sq-2m6zm.2: the GENERATED PKG ingest graph projects verbatim bd issue
  # titles (incl. beads whose title is literally about a typo, e.g. "succee", and raw
  # commit SHAs like "ba9c281") + skill front-matter — projected source data, not
  # hand-written prose, so it is excluded like other generated artifacts.
  "crates/sparq-kb/ingest/pkg-instances.ttl",
  # [SONNET-4.6] sq-3x7dl.14.2: the GENERATED xpath differential oracle. Its corpus is
  # deliberate non-prose — string FRAGMENTS ("hel", "llo", "ell", "zzz") and multibyte /
  # ligature codepoints chosen to exercise UTF-8 edges — emitted by
  # zk/xpath/differential/src/main.rs and marked DO NOT EDIT BY HAND. Excluded like the
  # other generated artifacts above; the generator's own prose IS still scanned.
  "zk/xpath/tests/differential_oracle",
]

[default]
# Keep typos' default checks; we only extend the dictionaries below.

# Ignore sparq bead IDs (`sq-<base36 suffix>`). typos splits these on the hyphen and
# flags the suffix (e.g. `sq-iy3p` → `iy3p`/`iy`, `sq-1gir` → `gir`). Beads are
# referenced by the dozen in compliance/research docs, so per-token allowlisting does
# not scale — match the whole bead-id token shape instead. [OPUS-4.8]
#
# [OPUS-4.8] (bead sq-hyzq, tightened in sq-uiie) Ignore the recurring "ALL-CAPS SPARQL
# keyword + lowercase English suffix" false-positive family: DELETEd, INSERTed, SELECTed,
# CONSTRUCTed, DESCRIBEd, CLEARed, LOADed, UNIONed, MATCHed, "3 OPTIONALs", … Authors write
# these in prose all the time; typos splits at the case boundary and flags the keyword-
# minus-tail (DELET→DELETE, OPTIONA→OPTIONAL) or the dangling 3-char fragment (Ded/Ned),
# forcing a pointless reword round-trip on every doc PR.
#
# The anchor is a CLOSED alternation of known SPARQL/SQL/RDF-update keyword roots — NOT a
# blanket `[A-Z]{3,}`. The original sq-hyzq form `\b[A-Z]{3,}[a-z]{1,3}\b` matched ANY run
# of >=3 capitals plus a 1-3 char lowercase tail, which silently shielded genuine misspelled
# roots written with a suffix (SEPERATEd, MULTIPLYed, OCURRed) — it suppressed the very
# misspelling class the gate exists to catch. (typos splits at the case boundary, so it sees
# `SEPERAT`/`MULTIPL`/`OCUR` and flags them against SEPARATE/MULTIPLE/OCCUR; the old regex hid
# exactly those hits. Note the glued mixed-case forms RECIEVEd/ADRESs are NOT a member of this
# class — typos never flags them in the first place, with or without the regex; only the bare
# all-caps RECIEVE/ADRES fire, and the keyword anchor leaves those untouched.) Pinning the
# prefix to a vetted keyword list closes the hole: a misspelled root is never in the list, so
# its suffixed form fires again, while every legitimate keyword-suffix split stays clean.
# (Acronym plurals like
# IRIs/APIs/SBOMs never needed shielding — typos already treats `<ACRONYM>s` as an acronym
# plural and does not flag them; verified by a both-config diff over the doc surface.)
extend-ignore-re = [
  "\\bsq-[0-9a-z]{3,}\\b",
  "\\b(?:SELECT|CONSTRUCT|DESCRIBE|ASK|INSERT|DELETE|LOAD|CLEAR|CREATE|DROP|COPY|MOVE|ADD|UNION|OPTIONAL|MINUS|GRAPH|SERVICE|BIND|FILTER|VALUES|GROUP|ORDER|HAVING|MATCH|JOIN|PROJECT|AND|OR|XOR|UPDATE|WHERE)[a-z]{1,3}\\b",
  # [FABLE-5] sq-gg0qq.2 (sparq-lws-core import): base64/JWT literal segments in test
  # fixtures (32+ char unbroken base64url runs are never prose — typos flags random
  # 3-grams inside them, e.g. "Jod").
  "[A-Za-z0-9+/_=-]{32,}",
  # [FABLE-5] sq-gg0qq.2: blank-node labels (`_:b0`, and the percent-style `_x20_`
  # escape-encoded fixtures like `_:ba_x20_b_x3E_`) — typos splits on `_` and flags
  # the 2-char fragments ("ba"). Label tokens, not prose.
  "_:[A-Za-z0-9_]+",
]

[default.extend-identifiers]
iy3p = "iy3p"            # [OPUS-4.8] bead id `sq-iy3p` — typos splits on `-`, flags "iy"->"it"
"1gir" = "1gir"           # [OPUS-4.8] bead id `sq-1gir` — typos splits on `-`, flags "gir"->"git"
# Author surnames + tool/library identifiers flagged as typos.
Hendler = "Hendler"      # Jim Hendler (BitMat paper author)
metrix = "metrix"        # [FABLE] "graph metrix" — the maintainer's verbatim #1613 directive spelling of Graphmetrix (research/ac-query-benchmark.md quotes it verbatim)
hax = "hax"              # [FABLE] Cryspen's `hax` Rust→F*/Coq verification toolchain (research/mechanized-proof-program.md §4.1) — a real tool name, not "hex"
# [FABLE-5] sq-gg0qq.2 (sparq-lws-core import) — short code tokens, not prose:
nce = "nce"              # format-string named arg holding the write-marker NONCE (store/sparql.rs)
bacl = "bacl"            # test-fixture blob key ("blob acl") in ldp/handler.rs unit tests
onn = "onn"              # deliberate near-miss garbage value in the tls.rs affirmative-env-parse test vector

[default.extend-words]
quikly = "quikly"      # [GPT-5.6] Intentional one-edit fuzzy-search query fixture in the public skill example.
ND = "ND"                # [OPUS-4.8] "NDAs" (Non-Disclosure Agreements) — typos splits camelCase NDAs into ND+As
GES = "GES"              # [FABLE-5] "PathGES" (CCS 2024 graph-encryption scheme, research/e2ee-queryable-options.md) — typos splits the camelCase name into Path+GES
