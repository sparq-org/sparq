# Deployment for sparq-server or sparq-lws-core
# [OPUS-4.8] sq-0d744 — cloud-deploy epic sq-3vjdr §3.5
# [GPT-5.6] R9: sparq-server is open-by-default at the image layer; this chart
# gates it with SPARQ_AUTH_TOKEN from an existing Secret. Do not remove that wiring.
#
# Secure-defaults enforced here:
#   R1/R2: SPARQ_AUTH_TOKEN wired from existing k8s Secret (never inlined)
#   R7:    livenessProbe/readinessProbe on per-server health path (sparq.livenessPath / sparq.readinessPath)
#   R8:    non-root securityContext, readOnlyRootFilesystem, no privilege escalation, no added caps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and (eq .Values.server "lws") .Values.persistence.enabled }}
  # Stop the previous process before opening the single-instance data directory.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "sparq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparq.selectorLabels" . | nindent 8 }}
        {{- /* [GPT-5.6] Reserved selector labels cannot be overridden by podLabels. */}}
        {{- $podLabels := omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sparq.serviceAccountName" . | quote }}
      # [GPT-5.6] R5: keep API credentials disabled even for an operator-supplied SA.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # [GPT-5.6] R8: required controls are chart invariants, not user-relaxable values.
      securityContext:
        runAsNonRoot: true
        # [GPT-5.6] Distroless nonroot GID; lets supported CSI drivers make /data writable.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "sparq.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # [GPT-5.6] R8: no root, privilege escalation, writable rootfs, or capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ include "sparq.containerPort" . }}
              protocol: TCP
          # [GPT-5.6] R7: startup probe prevents slow dataset loads from liveness restarts.
          startupProbe:
            httpGet:
              path: {{ include "sparq.livenessPath" . }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          # R7 — liveness probe: /health (sparq-server) or /livez (lws)
          livenessProbe:
            httpGet:
              path: {{ include "sparq.livenessPath" . }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          # R7 — readiness probe: /health (sparq-server) or /readyz (lws, deregisters on 503)
          readinessProbe:
            httpGet:
              path: {{ include "sparq.readinessPath" . }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- if eq .Values.server "sparq-server" }}
            # R1/R4: auth token from existing k8s Secret (NEVER inlined here)
            - name: SPARQ_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.tokenKey | quote }}
            {{- if .Values.auth.requireTokenForReads }}
            - name: SPARQ_AUTH_TOKEN_READ
              value: "1"
            {{- end }}
            {{- if .Values.sparqServer.corsAllowOrigin }}
            - name: SPARQ_CORS_ALLOW_ORIGIN
              value: {{ .Values.sparqServer.corsAllowOrigin | quote }}
            {{- end }}
            {{- if .Values.sparqServer.maxBodyBytes }}
            - name: SPARQ_MAX_BODY_BYTES
              value: {{ .Values.sparqServer.maxBodyBytes | quote }}
            {{- end }}
            {{- if .Values.sparqServer.maxConcurrent }}
            - name: SPARQ_MAX_CONCURRENT
              value: {{ .Values.sparqServer.maxConcurrent | quote }}
            {{- end }}
            {{- if .Values.sparqServer.queryTimeout }}
            - name: SPARQ_QUERY_TIMEOUT
              value: {{ .Values.sparqServer.queryTimeout | quote }}
            {{- end }}
            {{- if .Values.sparqServer.serviceAllow }}
            - name: SPARQ_SERVICE_ALLOW
              value: {{ .Values.sparqServer.serviceAllow | quote }}
            {{- end }}
            {{- if .Values.sparqServer.accessAudit }}
            - name: SPARQ_ACCESS_AUDIT
              value: {{ .Values.sparqServer.accessAudit | quote }}
            {{- end }}
            {{- else if eq .Values.server "lws" }}
            # LWS — activates once sq-lmz40 ships (image not yet published)
            # LWS is fail-closed by default (R2); no auth token needed — anonymous mutation
            # rejected, HTTPS-only WebIDs, DPoP required (all default-on in main.rs).
            # [GPT-5.6] The binary defaults to loopback, which is unreachable through a Service.
            - name: SOLID_SERVER_BIND
              value: "0.0.0.0:3000"
            {{- if .Values.persistence.enabled }}
            - name: SOLID_SERVER_DATA_DIR
              value: "/data"
            {{- end }}
            {{- if .Values.lws.trustedIssuer }}
            - name: SOLID_SERVER_TRUSTED_ISSUER
              value: {{ .Values.lws.trustedIssuer | quote }}
            {{- else }}
            {{- fail "lws.trustedIssuer must be set for server=lws (LWS requires an external OIDC IdP; see §1.3 in research/cloud-deploy-architecture.md)" }}
            {{- end }}
            {{- if .Values.lws.baseUrl }}
            - name: SOLID_SERVER_BASE_URL
              value: {{ .Values.lws.baseUrl | quote }}
            {{- else }}
            {{- fail "lws.baseUrl must be set for server=lws (the public https:// base URL)" }}
            {{- end }}
            {{- if .Values.lws.audience }}
            - name: SOLID_SERVER_AUDIENCE
              value: {{ .Values.lws.audience | quote }}
            {{- end }}
            {{- end }}
          {{- if and (eq .Values.server "sparq-server") (gt (len .Values.sparqServer.extraArgs) 0) }}
          args:
            {{- range .Values.sparqServer.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            # R8: /tmp writable scratch (required for distroless + readOnlyRootFilesystem)
            - name: tmp
              mountPath: /tmp
            {{- if or (eq .Values.server "sparq-server") .Values.persistence.enabled }}
            # [GPT-5.6] R8: /data stays writable while the image root remains read-only.
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or (eq .Values.server "sparq-server") .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.enabled }}
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-data" (include "sparq.fullname" .) | quote }}
          {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
