# [OPUS-4.8] Change-based CI test-selection — path -> crate/trigger ownership map.
# Bead sq-fmx4u.2 (epic sq-fmx4u). Design: research/change-based-test-selection.md
# §4 (fail-safe rules + the ownership map). Authored by Opus 4.8 (Fable
# unavailable; flag for re-review when Fable returns).
#
# WHO CONSUMES THIS: scripts/ci_select.py (the affected-set selector, bead .1)
# reads the `[[map]]` array. scripts/ci_audit_inputs.py (the out-of-crate-input
# audit, this bead) reads `[[map]]` AND the informational `[triggers]` mirror.
# Any OTHER top-level key is ignored by both — safe to add documentation tables.
#
# HOW THE SELECTOR USES A CHANGED PATH (design §4, order is normative):
#   1. §4.1 unconditional full-run trigger  (baked into ci_select `_FULL_TRIGGERS`)
#   2. crate-prefix ownership                (a path under crates/<c>/ belongs to c)
#   3. THIS map's `[[map]]` entries          (first match wins)
#   4. otherwise UNOWNED, UNMAPPED           => mode=full  (fail-safe, design §2)
# The map is consulted ONLY for a path that is neither a trigger nor inside a
# crate dir. It therefore EXTENDS the fail-closed set — it can never weaken it:
# a `safe=true` entry for a trigger/crate path is unreachable (steps 1-2 win
# first), and the map-validity + audit tests forbid such an entry anyway.
#
# VERDICT FORMS (design §4.2):
#   [[map]] pattern = "<glob>"  crates  = ["a", "b"]  # attribute an OUT-OF-CRATE path
#   [[map]] pattern = "<glob>"  safe    = true        # PROVEN inert for the Rust matrix
#   [[map]] pattern = "<glob>"  readers = ["a", "b"]  # ADDITIONAL-READERS (sq-m4bxc)
#   (an unmatched path falls through to the implicit mode=full default)
# `pattern` is repo-relative POSIX; `dir/**` matches the dir or anything beneath
# it, otherwise fnmatch. Every `crates`/`readers` name must be a live workspace
# member and every pattern root must exist on disk OR be a fetched/generated
# suite (the map-validity test uses a git-ignore + scripts/fetch-*.sh allowlist,
# #1392).
#
# ADDITIONAL-READERS (`readers`, sq-m4bxc [FABLE-5]) — the ONE verdict form the
# selector consults EVEN FOR A CRATE-OWNED PATH. `crates`/`safe` are consulted
# only for a path that is neither a trigger nor inside a crate dir (steps 1-2 win
# first); `readers` is different: it UNIONS the listed crates into the affected
# set IN ADDITION to the path's normal prefix owner, without changing the
# ownership verdict. It closes the case where crate R #[cfg(test)]-reads a
# SIBLING crate O's committed input but a real `R -> O` cargo dep would be a
# forbidden cycle (so no reverse-closure attribution can reach R). It is MONOTONE
# / fail-safe: adding a `readers` entry can only ENLARGE the run set (it never
# rescues an unowned/unmapped path from mode=full), so it never introduces an
# unsound skip (§2). The out-of-crate-input audit (scripts/ci_audit_inputs.py)
# treats a sibling read as covered iff the reader is listed here.

# ---------------------------------------------------------------------------
# [triggers] — INFORMATIONAL MIRROR of ci_select.py `_FULL_TRIGGERS` (§4.1).
# The selector does NOT read this table; it is the human-readable, drift-guarded
# statement of the unconditional full-run set. `test_path_ownership.py` asserts
# this list equals the selector's built-in patterns, so the two cannot diverge.
# A change to ANY of these forces the whole matrix — a skip here would be unsound
# (each feeds every build / redefines what "green" means for the whole repo).
# ---------------------------------------------------------------------------
[triggers]
patterns = [
  "Cargo.lock",             # resolved versions feed every build
  "Cargo.toml",             # ROOT manifest: members / [workspace.dependencies] / lints / profiles / [patch]
  "rust-toolchain",         # compiler pin affects all codegen
  "rust-toolchain.toml",    # compiler pin affects all codegen
  ".cargo/",                # global rustflags / registries / build config
  ".github/",               # the CI definition itself, incl. the selection wiring
  "scripts/",               # shared gate/coverage/check scripts executed by CI
  "deny.toml",              # cargo-deny config: redefines a supply-chain green
  "supply-chain/",          # cargo-vet / audit / SBOM config
  "ci/path-ownership.toml", # the selection policy (this file) itself
]

# ---------------------------------------------------------------------------
# [lanes] — INFORMATIONAL MIRROR of ci_select.py `_LANE_SEEDS` (design §5.2,
# beads sq-fmx4u.6 phase 2 + sq-mel85 phase 2b). The selector does NOT read this
# table; it documents, in the policy file, which SINGLETON CI lane maps to which
# SEED crates. A lane is a whole-job that always exercises a FIXED crate set (the
# fuzz smoke; the wasm bundle build; the perf-gate bench); it is skipped only when
# NONE of its seeds is in the affected reverse-dependency closure.
# `test_ci_select_wiring.py::test_ownership_toml_lanes_mirror_matches_lane_seeds`
# asserts this table equals ci_select.py `_LANE_SEEDS` so the doc + the code cannot
# diverge; the fuzz.yml + ci.yml `wasm` + bench.yml `bench` job `if:` guards
# reference exactly these crate names, also pinned by that test. Under-listing a
# seed would be a silent unsound skip; over-listing merely over-runs the lane
# (fail-safe).
# ---------------------------------------------------------------------------
[lanes]
# fuzz.yml — the cargo-fuzz targets; the out-of-workspace fuzz crate depends on:
fuzz = ["sparq-core", "sparq-engine", "sparq-shacl"]
# ci.yml `wasm` job — every browser bundle it builds (+ the rlib-only wasm smokes):
wasm = [
  "sparq-wasm",
  "sparq-reason-wasm",
  "sparq-rsp-wasm",
  "sparq-text-wasm",
  "sparq-shacl-wasm",
  "sparq-introspect",
  "sparq-solid",
  # [FABLE-5] sq-98c: rlib-only wasm smoke — memmap2 target-gated out on wasm32.
  "sparq-vectors",
]
# [SONNET-4.6] sq-mel85: bench.yml `bench` job — the perf regression gate.
# TRUE INVARIANT: every hard-gated metric measured on the PR/merge_group tier must have
# its source crate reach a bench seed. PR-tier hard-gated metrics today:
#   store/dict/parse (sparq-core) — reached via sparq-cli + sparq-bench (both bench seeds)
#   wasm_bundle_bytes (sparq-wasm) — DIRECT seed (a wasm-only diff does not flow up into
#     engine/cli/bench; omitting sparq-wasm would be an unsound skip)
# The four additional mode:auto ratchets (fts_bytes_per_doc / vectors_diskann_recall_at10
# / vectors_pq_recall_at10 / geo_compliance_deficit) need NO bench seed because
# ci-bench.sh measures them MAIN-tier-only (GITHUB_REF guards skip them on any non-main
# ref); every main-tier event is mode=full. Push-to-main always runs mode=full.
bench = ["sparq-engine", "sparq-cli", "sparq-bench", "sparq-wasm"]
# [FABLE-5] sq-0iqzw: fuzz.yml `differential-smoke` job — the PR-level BLOCKING
# sparq-vs-Oxigraph differential regression windows (sparq-bench in-process
# Oxigraph oracle): the engine under test + the harness/oracle crate itself.
differential-smoke = ["sparq-core", "sparq-engine", "sparq-bench"]

# ---------------------------------------------------------------------------
# [[map]] — attribution of OUT-OF-CRATE inputs to the crates that read them.
# Each entry below is an AUDIT-PROVEN finding: a repo-level path referenced from
# a crate's src/tests/benches/build.rs (include_str!/include_bytes! or an
# env!("CARGO_MANIFEST_DIR")-relative read). `crates` lists EVERY direct reader
# so a change to the input triggers each reader's reverse-dependency closure —
# under-listing a reader would be a silent unsound skip (that is what the audit
# scripts/ci_audit_inputs.py exists to prevent, fail-closed).
# ---------------------------------------------------------------------------

# The FO-bridge ingest compiles AGENTS.md + skills/*/SKILL.md front-matter into
# sparq-kb's vendored ingest/agents-findings.ttl. The current kb tests read that
# committed in-crate ttl (not the live docs), so this attribution is deliberately
# CONSERVATIVE: it keeps a charter/skill edit aligned with its ingest consumer
# (sparq-kb re-runs) instead of being silently skipped — an over-trigger, never
# a skip (design §4.2). No other crate reads these paths.
[[map]]
pattern = "AGENTS.md"
crates = ["sparq-kb"]

[[map]]
pattern = "skills/**"
crates = ["sparq-kb"]

# W3C/RDF conformance corpus — FETCHED (gitignored) by scripts/fetch-conformance.sh
# et al. into tests/w3c/. Read by sparq-conformance's suites via
# env!("CARGO_MANIFEST_DIR")/../../tests/w3c/... (smoke/inference/jsonld/d-entail),
# and by sparq-jsonld's crate-local W3C flatten harness (tests/flatten.rs).
[[map]]
pattern = "tests/w3c/**"
crates = ["sparq-conformance", "sparq-jsonld"]

# W3C ODRL test suite — FETCHED by scripts/fetch-odrl-suite.sh into
# tests/odrl-test-suite/. Read by sparq-policy's odrl_test_suite.rs.
[[map]]
pattern = "tests/odrl-test-suite/**"
crates = ["sparq-policy"]

# QLever "olympics" corpus (bench/qlever-olympics/olympics.nt). Read from the
# tests of the engine + the crates that evaluate over it. Every reader is listed.
[[map]]
pattern = "bench/qlever-olympics/**"
crates = ["sparq-engine", "sparq-introspect", "sparq-nlq", "sparq-sim", "sparq-vectors"]

# QLever synthetic query corpus (bench/qlever-synthetic/queries) — read by
# sparq-engine's dict-consolidation differential test.
[[map]]
pattern = "bench/qlever-synthetic/**"
crates = ["sparq-engine"]

# [GPT-5.6] GeoSPARQL function golden fixtures read by sparq-conformance's
# differential integration test.
[[map]]
pattern = "bench/geo/function-golden/**"
crates = ["sparq-conformance"]

# [GPT-5.6] OWL-RL golden-vector fixtures read by sparq-reason-diff's
# differential integration test.
[[map]]
pattern = "bench/reason-diff/rl/**"
crates = ["sparq-reason-diff"]

# [OPUS-5] sq-3xsx0: the competitor Datalog encodings (Nemo `.rls`, VLog `.dlog`)
# whose OWL-RL rules must stay set-identical to sparq's own closure. sparq-reason's
# datalog_intersection_arity.rs reads both files at runtime (an
# env!("CARGO_MANIFEST_DIR")-relative read) to assert `cls-int1` is the arity-generic
# list walk, so an encoding edit must re-run that guard.
[[map]]
pattern = "bench/reason-encodings/**"
crates = ["sparq-reason"]

# ZK-compose gate-count + SPARQL-feature catalog fixtures (committed JSON),
# include_str!'d by sparq-zk-compose's gate_count/sparql_catalog tests.
[[map]]
pattern = "bench/zk-compose/**"
crates = ["sparq-zk-compose"]

# [FABLE-5] sq-0iqzw: the ADJUDICATED cross-engine divergence allowlist, read at
# runtime by the sparq-bench differential fuzzer (crates/sparq-bench/src/fuzz.rs
# DivergenceAllowlist, via an env!("CARGO_MANIFEST_DIR")-relative path) AND by its
# unit test committed_allowlist_enables_exactly_the_adjudicated_classes. Editing an
# adjudicated class must re-run sparq-bench (the comparator that consumes it).
[[map]]
pattern = "bench/differential-divergences.json"
crates = ["sparq-bench"]

# [FABLE-5] sq-gum8.14: the machine-readable conformance-scoreboard export
# (regenerated by scoreboard_json()), read back by sparq-conformance's drift-guard
# test (tests/scoreboard_export.rs) to keep the committed export in sync.
[[map]]
pattern = "bench/conformance-scoreboard.generated.json"
crates = ["sparq-conformance"]

# [FABLE-5] sq-tonhr.2: the COMMITTED cargo-fuzz seed corpus (fuzz/seeds/<target>/),
# read via an env!("CARGO_MANIFEST_DIR")-relative path by sparq-conformance's parser
# differential harness (tests/parser_differential.rs) as a known-tricky-input corpus
# for the sparq-vs-oxttl line-syntax cross-check. sparq-canon reads one seed of the
# same corpus with `include_str!` (tests/fuzz_seed_dedup.rs), pinning the RDFC-1.0
# set-semantics reproducer in the stable `cargo test` gate. The out-of-workspace
# fuzz/ crate also consumes these seeds, but it is not a workspace member, so this
# map lists the workspace-crate readers only (the fuzz lane itself is seeded via
# [lanes]).
[[map]]
pattern = "fuzz/seeds/**"
crates = ["sparq-conformance", "sparq-canon"]

# [FABLE-5] sq-1s2.4 (PR #3622): the browser age-gate's precomputed `operand_enc`
# anchors, read at runtime by sparq-zk-compose's build-time drift guard
# (tests/site_age_enc_drift.rs) which pins the committed site constants against the
# native encode_int_literal encoder. FIRST-MATCH-WINS: these two file entries sit
# BEFORE the `site/**` safe entry below, so an anchor edit re-runs the drift guard
# while the rest of site/ stays inert for the Rust matrix.
[[map]]
pattern = "site/src/lib/zk-prover.ts"
crates = ["sparq-zk-compose"]

[[map]]
pattern = "site/scripts/capture-zk-manifest.mjs"
crates = ["sparq-zk-compose"]

# ---------------------------------------------------------------------------
# ADDITIONAL-READERS (`readers`, sq-m4bxc [FABLE-5]) — sibling-crate inputs read
# across a boundary where a real cargo dep edge would be a forbidden CYCLE, so no
# reverse-dependency closure can attribute them. Each is an AUDIT-PROVEN residual
# that used to be backstopped only by the nightly FULL run (design §6.1); the
# monotone union closes it directly. Listing the OWNER crate too is redundant
# (prefix-ownership already covers it) but harmless and documents every reader.
# ---------------------------------------------------------------------------

# [OPUS-5] sq-3705 RETIRED two `readers` entries here — the secprop vocabulary
# ones. They existed because sparq-zk and sparq-policy `include_str!`d
# sparq-trust's shared `secprop-ext.ttl` (and sparq-policy also read sparq-zk's
# `secprop-methods.ttl`) across package boundaries: sparq-trust DEPENDS ON
# sparq-zk, so the reverse edge was a cycle, and the lean sparq-policy could not
# take a sparq-trust edge at all. A statically unattributable out-of-crate read
# is exactly what the monotone readers union is for.
#
# The reads are gone. The vocabulary now lives in `crates/sparq-secprop-vocab`, a
# ZERO-dependency LEAF that sparq-trust, sparq-policy and sparq-zk each depend on
# (optionally, behind their own default-OFF secprop features), and the annotation
# graph's drift guard moved into sparq-zk, the crate that owns the graph. So a
# change to the vocabulary or to `crates/sparq-zk/ontologies/**` is attributed by
# the ORDINARY reverse-dependency closure over real cargo edges — the selector
# reaches all three without a map entry. Do not re-add them; re-adding one would
# mean a cross-package `include_str!` came back (see sq-3705).

# sparq-reason's compiled-vs-interpreted N3 equivalence + incremental tests read
# sparq-solid's WAC/ACP/ODRL-spike rule corpus READ-ONLY from ../sparq-solid/rules
# at runtime. sparq-solid DEPENDS ON sparq-reason (crates/sparq-solid/Cargo.toml),
# so a sparq-reason -> sparq-solid dep would be a cycle: additional-readers instead.
[[map]]
pattern = "crates/sparq-solid/rules/**"
readers = ["sparq-reason"]

# [OPUS-4.8] sq-oti9m: sparq-acbench's GENAI_RETRIEVAL_EXPRESSIBILITY grounding test
# reads sibling sparq-vectors / sparq-nlq Cargo.toml manifests at runtime to prove
# every cited provider feature (vec-predicate/filtered-ann/default, live/citations)
# still EXISTS — so a feature rename in those crates re-runs acbench and re-grounds
# the catalogue. A real acbench -> vectors/nlq dev-dep is unwanted coupling for a
# bench crate; additional-readers unions acbench in monotonically instead. Manifest
# scope (not dir/**) so only a Cargo.toml edit re-runs acbench.
[[map]]
pattern = "crates/sparq-vectors/Cargo.toml"
readers = ["sparq-acbench"]

[[map]]
pattern = "crates/sparq-nlq/Cargo.toml"
readers = ["sparq-acbench"]

# ---------------------------------------------------------------------------
# SAFE list — paths AUDIT-PROVEN inert for the Rust matrix (design §4.2). The
# list started EMPTY; each entry below was added only after the audit confirmed
# NO workspace crate reads it from src/tests/benches/build.rs. The audit
# re-verifies this every run (a crate that starts reading a safe path FAILS the
# audit, forcing a re-evaluation). Docs/site lanes still run — they are separate
# workflows, not gated by this selector.
#
# [OPUS-5] #5249: a `safe = true` verdict is now inert for BOTH selector layers.
# It always emptied the affected CLOSURE; since #5249 `ci_select.classify_change`
# reads this list too, so such a path also classifies `map-safe` (one of
# `_INERT_CLASSES`) instead of `engine` — which is what lets a merge_group batch
# confined to safe paths skip the rust_changed-only lanes and the CodeQL analysis.
# Adding an entry here therefore now affects the change CLASS as well: hold it to
# the same audit bar. FIRST-MATCH-WINS still applies (the sq-1s2.4 zk-anchor
# entries above keep `site/src/lib/zk-prover.ts` engine-classified), and a `safe`
# entry can still never rescue a §4.1 trigger or a `crates/`-owned path.
# ---------------------------------------------------------------------------

# Design records / research notes. No crate compiles or reads research/.
[[map]]
pattern = "research/**"
safe = true

# [OPUS-4.8] path-aware CI: top-level prose docs (docs/*.md — branch-protection,
# upstream-proposals, guides). AUDIT-PROVEN inert: no workspace crate include_str!/
# include_bytes!/reads docs/ (the audit re-verifies every run), and docs/ is all
# markdown (0 non-.md files). NOTE a *crate-owned* README.md/*.md is NOT covered by
# this — it stays crate-owned (doctest include_str! risk, design §3.2); this is the
# repo-level docs/ tree only. The docs-quality lane (markdownlint/links) is a
# separate workflow and still runs. Lets a docs-only PR skip the bench/fuzz seed
# lanes too (the wide ci.yml/feature-matrix legs already skip via rust_changed).
[[map]]
pattern = "docs/**"
safe = true

# The marketing/explanatory website (Next.js). Owns its own CI lane (pages.yml).
# EXCEPTION (first-match-wins): the two zk-anchor files attributed to
# sparq-zk-compose above (sq-1s2.4) are matched before this entry; NO other Rust
# crate reads site/ (the out-of-crate-input audit re-verifies every run).
[[map]]
pattern = "site/**"
safe = true

# The bead task database. Task-tracking only; no crate reads .beads/.
[[map]]
pattern = ".beads/**"
safe = true

# [OPUS-5] sq-g25hr: deployment manifests (k8s / helm / terraform / bicep / PaaS
# + their READMEs and smoke scripts). AUDIT-PROVEN inert for the RUST matrix: no
# workspace crate include_str!/include_bytes!/reads deploy/, and this safe entry
# makes that an ENFORCED claim — scripts/ci_audit_inputs.py fails the moment a
# crate starts reading a safe-listed path. deploy/ is NOT unowned in CI overall:
# deploy-lint.yml (yamllint/kubeconform), deploy-terraform-lint.yml,
# container-scan.yml, and the pure-python test_release_container_multiarch.py /
# test_dependabot_coverage.py checks all read it, and every one of those lives in a
# workflow this selector does not gate — so they still run on a deploy-only PR.
# Mirrored in ci_select.py `_DEPLOY_ONLY` (which also covers the two
# `.github/workflows/deploy-*.yml` files, unreachable from this map because
# `.github/` is a §4.1 full-run trigger that wins before the map is consulted).
[[map]]
pattern = "deploy/**"
safe = true

# [FABLE-5] sq-63ups: the formal-verification manifest (proof suites -> verified
# paths + the alarmed lanes). Consumed ONLY by the formal-verification.yml /
# formal-alarm.yml workflows via scripts/fv_select.py / check-fv-manifest.py /
# formal_lane_alarm.py — no workspace crate reads it, so it is inert for the Rust
# test matrix. It is NOT inert for the FV workflow itself: scripts/fv_select.py
# treats a change to this file as an FV full trigger (every pr_gate proof suite
# runs on that PR), so this safe-listing weakens nothing.
[[map]]
pattern = "ci/formal-verification.toml"
safe = true
