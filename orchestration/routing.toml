# Routing table for issue-native orchestration (PUBLIC — no account information).
# Maps a triaged issue's role/labels to a MODEL fallback-chain + the agent that implements it.
# The private account registry (jeswr/agent-account-registry) consumes `model_chain` to pick the
# first AVAILABLE account (respecting per-account limits + the lease + cache affinity).
# See research/issue-native-orchestration.md. Validated by scripts/routing-validate.py.
#
# PRECEDENCE (consumer contract): security-label overrides > explicit role > [defaults]. Rules are
# evaluated top-to-bottom, FIRST MATCH WINS, so the `[[route]]` blocks with `match_labels` (security
# surfaces) are listed FIRST and win over the role blocks below them.
#
# match_labels SEMANTICS: a rule matches if ANY of the issue's labels CONTAINS any listed keyword as
# a substring (so `zk` matches `area:sparq-zk`, `mpc` matches `area:sparq-mpc`, etc.). role rules
# match the exact `role:<r>` label.

# ---------------------------------------------------------------------------------------------------
# [models] — the catalog. A model alias resolves to a provider + harness + concrete provider model id
# + credential format. `codex` and `claude` are HARNESSES (CLIs), not models. The account selector +
# worker use these to pick the right account and restore the right credential.
#
# CREDENTIAL FORMAT (Anthropic): use `claude-oauth-token` — a long-lived, NON-rotating token from
# `claude setup-token`, designed for headless/CI. Do NOT use the interactive `claude-credentials-json`
# subscription blob for a worker: its refresh token ROTATES, so a copy seeded into a secret is
# invalidated the moment the interactive session (or another worker) refreshes — the worker then
# fails with an auth error. setup-token also creates a SEPARATE credential, so the worker never
# rotates the coordinating session's own login out from under it. (anthropic-api-key is also
# supported by the worker if a Console key is preferred over the subscription.)
# DEPRECATED ALIASES — `fable` (claude-fable-5) and `opus` (claude-opus-4-8) were REMOVED from this
# catalog on 2026-07-26 by maintainer directive ("deprecate the use of fable and opus entirely in
# favour of opus5"). They are no longer routing targets: `opus5` is the sole anthropic tier. The
# removal is enforced, not merely conventional — scripts/routing-validate.py DEPRECATED_ALIASES /
# DEPRECATED_PROVIDER_MODELS fail the build if either alias or either provider id reappears in a
# catalog entry or any model_chain, and scripts/route-resolve.py validate_routing() refuses to
# RESOLVE a table naming them (fail-closed at plan time, so a reintroduced alias can never route).
# Existing `[FABLE-5]` / `[OPUS-4.8]` authorship markers in the tree are accurate HISTORY and stay.
[models.haiku]
provider = "anthropic"
harness = "claude"
provider_model = "claude-haiku-4-5"   # NOT a routing target (2026-07-26): haiku no longer appears in
                                      # any model_chain — the maintainer moved DOCS WRITING off the
                                      # cheap anthropic tiers onto sol. The catalog entry is retained
                                      # because non-routing consumers still name it (the harness
                                      # `.claude/agents/*.md` mechanical roles: sparq-pkg-nl NL
                                      # retrieval, sparq-verify-mechanical, sparq-context-monitor)
                                      # and registry account records list it in `models`.
credential_format = "claude-oauth-token"
[models.sonnet]
provider = "anthropic"
harness = "claude"
provider_model = "claude-sonnet-4-6"  # NOT a routing target (2026-07-26): same as haiku above.
                                      # Non-routing consumers: sparq-rust-impl (bulk single-crate
                                      # implementation) + sparq-issue-sweeper (triage) agent configs.
credential_format = "claude-oauth-token"
[models.opus5]
provider = "anthropic"
harness = "claude"
provider_model = "claude-opus-5"       # Opus 5 — the SOLE anthropic routing tier since 2026-07-26.
                                       # It replaced fable (claude-fable-5) and opus (claude-opus-4-8)
                                       # as the primary tier on 2026-07-24; the 2026-07-26 directive
                                       # deprecated both entirely, so they are gone from this catalog
                                       # rather than retained as tail fallbacks. Chains that used to
                                       # end at fable/opus now either end at opus5 and DEFER on
                                       # exhaustion (retried next tick) or carry `escalate = true`
                                       # and take the bounded machine-park path described below —
                                       # never a silent degrade.
                                       # Probe-verified live 2026-07-26: `claude --model
                                       # claude-opus-5 -p` -> OK, modelUsage reports canonicalModel
                                       # "claude-opus-5" (1M context). ALWAYS pin the full id: the
                                       # bare `opus` alias tracked claude-opus-4-8 for days after
                                       # Opus 5 shipped. Mirrors the registry's routing.toml.
credential_format = "claude-oauth-token"
[models.terra]
provider = "openai"
harness = "codex"
provider_model = ""                    # EMPTY = omit --model (codex CLI default). The literal "TBD" placeholder
                                       # reached `codex exec --model TBD` in every terra fleet worker -> API 400 /
                                       # no-tool-call fallback (2026-07-18). Never ship a placeholder id here.
                                       # sentinel is load-bearing: dispatch/worker pass NO --model flag
credential_format = "codex-auth-json"
[models.sol]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-sol"         # Cross-provider REVIEW model (maintainer 2026-07-18): the registry
                                       # REVIEW_CHAIN routes reviews of anthropic-authored CONTENT to
                                       # `sol`. Distinct alias from `terra` (a different GPT model); id
                                       # probed working on the worker account type 2026-07-18.
credential_format = "codex-auth-json"
[models.luna]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-luna"        # Second tier of the unified fix ladder opus<luna<fable<opus5<sol
                                       # (maintainer 2026-07-18) + sol's review fallback; id probed
                                       # working on the worker account type 2026-07-18.
credential_format = "codex-auth-json"

[defaults]
model_chain = ["sol", "opus5"]
agent = "sparq-rust-impl"
escalate = true

# ---------------------------------------------------------------------------------------------------
# SECURITY-LABEL OVERRIDES (first-match; win over role). Soundness surfaces run on Opus 5 ALONE
# (2026-07-26: the opus-4.8 tail fallback was deprecated, so there is no weaker anthropic rung to
# degrade to). [GPT-5.6] CAPACITY-ESCALATION CONTRACT: for capacity exhaustion, `escalate = true`
# never writes `needs:user`.
# Registry CLAIM first keeps the item `status:deferred` during the bounded retry grace, then applies
# the machine-owned `status:parked` soft hold if zero headroom persists; a successful retry after
# recovery clears that hold.
# The executable cross-repo contract lives at stable symbols, not copied prose: this repo's
# `scripts/route-resolve.py::resolve()` propagates the flag into
# `scripts/dispatch-plan.py::plan_dispatch()`. The registry revalidates it in
# `jeswr/agent-account-registry/scripts/policy-resolve.py::resolve()`, then
# `scripts/dispatch-claim.py::escalate_starved()` and `::escalate_persist_decision()` enforce the
# zero-headroom observation and bounded grace. Its `::_park_source_issue()` delegates the label
# transition to `scripts/worker-issue.py::set_status(..., "parked")`; the same function's `"retry"`
# transition clears both `status:deferred` and `status:parked` when capacity recovers.
# This keeps the route fail-closed without turning provider capacity into a human-owned terminal.
# The separate post-review trust/soundness arm remains human-gated.
[[route]]
match_labels = ["zk", "mpc", "reasoner", "crypto", "auth", "e2ee"]
model_chain = ["opus5"]
agent = "sparq-reviewer"
escalate = true                        # capacity contract above; registry _park_source_issue(), never needs:user

# ---------------------------------------------------------------------------------------------------
# [SPARQ agent] ROLE ROUTES. The 2026-09-02 maintainer protocol separates responsibilities: GPT-5.6
# Sol is the primary implementation tier, while Opus 5 remains the review/soundness tier and
# reviews new Sol-authored PRs through the existing cross-provider inversion. Opus stays behind Sol as a
# continuity fallback for current Anthropic-authored repairs and total Sol unavailability. Each
# implementation route declares `escalate = true` so capacity exhaustion takes the registry's
# bounded retry path and then its visible, machine-owned `status:parked` soft hold.

# HISTORICAL CONTEXT (superseded by the 2026-09-02 protocol above): `role:impl` was Opus5-only
# beginning 2026-07-26. The measurements below explain that prior state; they are not current policy.
#
# MAINTAINER DECISION 2026-07-26, taken on the measurement in registry #738: "Remove sol from impl
# fallback." This is a deliberate change from PREFERENCE to EXCLUSION and it applies to `role:impl`
# AND NOTHING ELSE. The standing directive above still governs every other route: `role:site`,
# `role:ci` and `role:perf` keep sol as a cross-provider fallback, `role:docs` keeps its sol LEAD
# (the separate docs-writing directive), `role:gui` keeps its sol LEAD, and the review/soundness/
# security lanes are untouched.
#
# WHAT WAS MEASURED (registry #738; `worker.yml`, n=74 runs in a 3h24m window, each issue's labels
# reconstructed AS OF its run's timestamp so the #733 role-swap cannot manufacture the result):
#   * `role:impl` first-attempt yield, SAME route, same agent brief, same prompt:
#     sol 7/40 = 18%, opus5 12/14 = 86%.
#   * 4 of 4 issues where sol left the tree unchanged and opus5 later ran THAT SAME issue, opus5
#     produced a PR (#2411 -> PR #4271, #2639 -> #4234, #3110 -> #4294, #3210 -> #4226). No
#     counterexample in either direction.
#   * Every issue-side axis is ~4x weaker than the model axis. opus5 converted 6/7 on its own
#     shortest-body quartile, MEDIAN BODY LENGTH 26 CHARACTERS — so "the issues are
#     underspecified" does not explain the gap.
#   * Budget exhaustion is REFUTED: the longest no-diff model step in the window was 177s against a
#     90-minute worker timeout. sol stops VOLUNTARILY at ~60s median.
#
# WHY EXCLUSION RATHER THAN SECOND PLACE. The registry's `select-and-claim.choose_account` walks
# `model_chain` IN ORDER and claims the first AVAILABLE account, so a second rung is not a
# tie-break — it is what serves the request whenever the first rung is busy. opus5 holds an account
# ~17 minutes per run and sol clears in ~1 minute, so during any dispatch burst the low-yield rung
# served the majority of `role:impl` work. Re-ordering could not fix that; only removal can.
#
# THE EXIT — the same shape `role:research` uses, for the same reason. A single-rung chain with no
# `escalate` has NO exit: on an opus5 capacity outage the item defers, and defers again, forever,
# with nobody notified. So this route escalates. `escalate = true` is consumed by the registry's
# `dispatch-claim.escalate_starved` + `escalate_persist_decision`: the FIRST starved tick counts
# `escalate-tier-starved-transient`, keeps the issue `status:deferred`, and auto-retries as capacity
# recovers; only CONTINUOUS starvation past the bounded grace is promoted to the MACHINE-owned
# `status:parked` soft hold, which lifts by itself when capacity returns. It is NEVER `needs:user` —
# capacity starvation is not a human question.
#
# COST, STATED SO IT IS NOT A SURPRISE: this converts a fast-failing fallback into queueing pressure
# on a slower, scarcer tier. See the PR body for the measured opus5 concurrency and the honest
# steady-state projection.
[[route]]
role = "impl"
model_chain = ["sol", "opus5"]
agent = "sparq-rust-impl"
escalate = true

# Site/front-end implementation follows the Sol-first implementation protocol. scripts/triage.py
# derives role:site for UI-surface labels, so surface-labelled work lands here too.
# Deliberately a ROLE route, not match_labels: the review lane's arm-side security classifier
# unions ALL match_labels keywords, so UI keywords there would human-arm every UI PR.
[[route]]
role = "site"
model_chain = ["sol", "opus5"]
agent = "sparq-site"
escalate = true

# GUI implementation is Sol-first like every other implementation route. The exact `area:gui`
# selector and legacy preference declaration remain below for PLAN/CLAIM compatibility with older
# target revisions; on the current Sol-first chain they are deliberately idempotent.
#
# This also preserves the existing UI -> Codex/Sol original-builder steer (task #331) for the
# desktop GUI while bringing every other implementation surface onto the same default.
#
# HISTORICAL FAILURE MODE / WHERE THE CARVE-OUT ACTUALLY BINDS. This route alone is NOT sufficient
# and must not be mistaken
# for the mechanism: role routes are reached only via a `role:` LABEL, `role:gui` did not exist as a
# repo label until 2026-07-26, and `triage._role()` returns an EXPLICIT `role:*` before it consults
# any surface label — so all 35 open `area:gui` issues (33 role:impl, 1 role:perf, 1 role:research)
# resolved `role:impl` and took the then-opus5-first default, INVERTING the directive for the GUI
# backlog. The binding rule therefore lives in scripts/route-resolve.py `gui_carve_out()`: it reads
# the `area:gui` label the issues ALREADY carry, at plan time, and re-orders whatever chain they
# resolve to. This route is the declarative statement of the same preference for an issue that does
# carry `role:gui`; the two are asserted to agree.
#
# It is a ROLE route, not `match_labels`, for the same reason the site route is: the review lane's
# arm-side security classifier UNIONS every match_labels keyword, so putting "gui" there would
# human-arm every GUI PR. scripts/triage.py derives role:gui from `area:gui` alone (it used to
# fold area:gui into role:site).
#
# Opus 5 is retained behind Sol only as the continuity fallback described above.
[[route]]
role = "gui"
model_chain = ["sol", "opus5"]
agent = "sparq-site"
escalate = true

# [SPARQ agent] CI/infrastructure is implementation and therefore uses the same Sol-first lane. Opus 5
# reviews the resulting OpenAI-authored PR through the registry-owned review chain.
# The chain is deliberately frontier-only rather than floor-pinned. `escalate = true` uses the
# registry's `dispatch-claim.py::{escalate_starved, escalate_persist_decision,
# _park_source_issue}` path: retry first, then a visible machine-owned park, never `needs:user`.
# This is intentional for CI: exhaustion of both providers must not become an unbounded silent
# defer loop; `status:parked` remains machine-recoverable when capacity returns.
# scripts/triage.py derives role:ci for infra-surface labels (area:ci/area:ci-fragments/
# area:orchestration/area:workflows/area:release) so surface-labelled infra work lands here.
# Security overlap: the match_labels overrides above still WIN over this route (Opus-only review +
# a separate human post-review arm) — where role:ci and a security surface overlap, that lane wins.
[[route]]
role = "ci"
model_chain = ["sol", "opus5"]
agent = "sparq-ci-infra"
escalate = true

[[route]]
role = "perf"
model_chain = ["sol", "opus5"]
agent = "sparq-perf-engineer"
escalate = true

# [OPUS-5] research was ["opus5", "fable", "opus"] until 2026-07-26. Deprecating the two tail
# rungs left a ONE-RUNG chain with no `escalate`, i.e. no exit at all: on an opus5 capacity outage
# the item could only defer, and defer again, forever — a silent permanent stall with no human
# ever notified. Deprecating a fallback therefore has to come with an exit, so research now
# escalates like the other single-rung (review/soundness/security) chains: chain exhaustion takes
# the bounded defer -> machine-owned `status:parked` path documented above. Deliberately NOT solved
# by adding `sol`: research authorship stays on the anthropic side, and a cross-provider rung would
# have hidden the stall rather than surfaced it.
[[route]]
role = "research"
model_chain = ["opus5"]
agent = "sparq-researcher"
escalate = true

# DOCS WRITING -> SOL (maintainer directive 2026-07-26: "deprecate sonnet and haiku for docs
# writing in favor of gpt 5.6 sol"). haiku and sonnet LED this chain until 2026-07-26 and are now
# absent from it — and, since role=docs was their only routing consumer, absent from the routing
# table entirely. scripts/route-resolve.py validate_routing() REJECTS any table that names haiku or
# sonnet in ANY chain (NOT_A_ROUTING_TARGET), so the cheap tiers cannot creep back into docs or
# anywhere else. `terra` (the codex CLI default) remains docs-only: it is the same-provider
# fallback behind sol, and validate_routing() still rejects it outside role=docs. opus5 is the
# cross-provider tail so a total OpenAI outage does not stall documentation.
[[route]]
role = "docs"
model_chain = ["sol", "terra", "opus5"]
agent = "sparq-docs"
escalate = true

# Review / soundness: Opus 5 alone (the opus-4.8 tail fallback was deprecated 2026-07-26);
# on chain-exhaustion use the bounded machine-park contract above (do NOT fall to a weaker model).
[[route]]
role = "review"
model_chain = ["opus5"]
agent = "sparq-reviewer"
escalate = true

[[route]]
role = "soundness"
model_chain = ["opus5"]
agent = "sparq-reviewer"
escalate = true

# ---------------------------------------------------------------------------------------------------
# [SPARQ agent] LEGACY CHAIN-ORDER PREFERENCE — retained for PLAN/CLAIM compatibility with older
# target revisions.
# The current implementation routes are already Sol-first, so this rule is idempotent today. It
# remains declared as data because the dispatch decision is made twice, in two repositories:
#
#   PLAN   the registry's dispatch.yml clones THIS repo and runs THIS repo's scripts/dispatch-plan.py
#          -> scripts/route-resolve.py -> gui_carve_out().
#   CLAIM  registry `dispatch-claim.py` re-derives the same route with REGISTRY-owned
#          scripts/policy-resolve.py, reading THIS FILE from the protected default-branch tip, and
#          `_route_matches` then demands EXACT equality of model_chain / agent / escalate.
#
# A chain-order rule expressed only in target Python would make PLAN and CLAIM disagree. Keeping
# the declaration preserves exact agreement while older revisions or synthetic tests still carry
# mixed Sol/Opus implementation chains.
#
# CLAIM cannot import this repo's resolver — running target-authored CODE in the privileged claim
# step is the escalation registry #119 closed. But it already trusts this file, fetched from the
# PROTECTED tip; it is where `model_chain` itself comes from. So the rule crosses the repository
# boundary through that same channel, as DATA. The registry's scripts/chain_preference.py is the
# shared MECHANISM both resolvers import; this block is the RULE.
#
# CONTRACT (identical on both sides, and asserted equal to route-resolve.py's GUI_CARVE_OUT_*
# constants by `route-resolve --self-test`, so the two representations cannot drift):
#   labels    EXACT issue labels — ANY one of them selects. Never a substring: `"gui" in label`
#             would sweep `area:guide` / `area:guidance` into the carve-out.
#   lead      moved to the FRONT of the resolved chain. Every other rung keeps its relative order,
#             so this is PREFERENCE, NOT EXCLUSION and the chain still terminates cross-provider.
#   requires  the rule fires ONLY when the chain ALREADY contains all of these — the directive's
#             own "tasks for which they are BOTH possible implementors" qualifier. `lead` must be
#             one of them, which is what makes RE-ORDER the only effect available WITHOUT an
#             explicit `inject_roles` opt-in: the preference can never INJECT sol into
#             `role:research` (["opus5"], deliberately anthropic-side and escalating) and turn a
#             visible stall into a silent cross-provider hop.
#   inject_roles
#             the EXACT roles for which `lead` may be ADDED to a chain that lacks it, rather than
#             only re-ordered. Absent => none, i.e. the original re-order-only rule.
#
# `inject_roles = ["impl"]` is retained solely to reproduce the historical mixed-chain behavior
# when an older target revision is resolved. The current `role:impl = ["sol", "opus5"]` chain
# already has Sol in front and therefore does not activate injection. The registry parser still
# refuses research/review/soundness injection, so this compatibility declaration cannot widen
# those Opus-only lanes.
#
# A SECURITY-override route is exempt on both sides: `area:gui` + `area:sparq-zk` is a ZK issue
# first, and an implementor preference must never re-order OR extend a soundness chain.
[[chain_preference]]
labels       = ["area:gui"]
lead         = "sol"
requires     = ["sol", "opus5"]
inject_roles = ["impl"]
