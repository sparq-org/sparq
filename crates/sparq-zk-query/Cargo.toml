[package]
name = "sparq-zk-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Research bounded SPARQL query compiler for Noir"
publish = false

[features]
default = []
ordered-json = ["serde_json/preserve_order"]

[dependencies]
sparq-merkle-suite = { path = "../sparq-merkle-suite" }
oxttl = { workspace = true }
sparq-zk = { path = "../sparq-zk" }
blake3 = "1"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sparq-canon = { path = "../sparq-canon", default-features = false }
oxrdf = { workspace = true }
spargebra = { workspace = true }
sparq-query-protocol = { path = "../sparq-query-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sparq-zk-compose = { path = "../sparq-zk-compose" }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Select the browser entropy backends already used by the portable result host.
getrandom = { version = "0.2", features = ["js"] }
getrandom_current = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_latest = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
oxttl = { workspace = true }
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
num-bigint = "0.4"
num-traits = "0.2"
