[package]
name = "sparq-trust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Trust-graph authorisation PoC for sparq-solid: a default-OFF admission gate that admits issuer-signed, trusted-source-scoped credential facts ahead of the WAC/ACP materialiser (research prototype; NOT a security guarantee)"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Research-stage proof-of-concept (epic sq-pfae, issue #940). The ZK estate it
# composes with is externally UNAUDITED (sq-qhy4); this crate verifies an issuer
# signature but does NOT deliver unlinkable/anonymous presentation. [GPT-5.6]
# Published only as the default-off dependency used by sparq-server and sparq-solid.

[[example]]
name = "admission_cost"
required-features = ["cert-graph"]

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# OPT-IN by construction. NOTHING in the workspace's default build depends on this
# crate: `sparq-solid` pulls it in ONLY behind its default-OFF `trust-graph` feature,
# so the lean core (sparq-core / sparq-engine / sparq-reason) and the default
# sparq-solid build are byte-identical with or without it (the strict-additivity
# property G6 of research/solid-trust-graph-authz-design.md §2.2). It depends only on
# what the admission gate needs — RDFC-1.0 canon, the issuer-sig primitive, the SHACL
# validator, the N3 reasoner, and the shipped sparq-solid materialiser.
# DEFAULT-OFF features. The crate stays lean by default; `did` pulls the only extra
# dependency (`serde_json`, used solely to parse a fetched `did:web` DID document) and
# is OFF unless a caller explicitly opts in (sq-pfae.3). The `did:key`/`did:web` self-
# certifying decode (multibase/multicodec/base58/varint) is dependency-free hand-rolled,
# so the feature's whole cost is the JSON parser for the optional `did:web` path.
[features]
default = []
# DID resolution + issuer-key binding (`did:key` offline self-cert + pluggable `did:web`).
did = ["dep:serde_json"]
# [OPUS-4.8] sq-pfae.5 — the trust-document STORAGE/AUTHORING model: server-wide vs
# per-`.acr` documents (per-`.acr` NARROWS, never broadens), monotone document
# versioning + revocation, and the admission cache key (evidence hash + policy version)
# that composes with the sparq-solid epoch cache. Pure-Rust over the deps already
# present (sparq-zk commitment for the evidence hash, std hashing) — NO new dependency,
# so the lean default build is byte-identical with it OFF.
store = []
# The sparq sec-prop: EXTENSION vocabulary (`secprop` module + `secprop-ext.ttl`):
# the orthogonal proof-system dimensions + the assurance/audit-status axis the
# vendored `sec-prop:` ontology lacks (sq-5oru9; design §4.2). Dependency-free — it
# is `const &str` data + a TTL drift test, strictly additive (no new dep, no new edge
# onto the lean default build).
# [OPUS-5] sq-3705: those constants + the Turtle + the drift test now live ONCE in
# the ZERO-dependency `sparq-secprop-vocab` leaf (this crate depends on sparq-zk, so
# sparq-zk could not import them back — a cycle; sparq-policy could not either without
# giving up its lean graph). `secprop` re-exports the leaf, so the public surface
# `sparq_trust::secprop::SECX_…` is unchanged and the "no new dep on the lean default
# build" property still holds: the leaf has NO dependencies of its own and is pulled
# in only by this default-OFF feature.
secprop-vocab = ["dep:sparq-secprop-vocab"]
# [FABLE-5] sq-6syab.2 — the `trustx:` certification-scope vocabulary (`framework_vocab`
# module + `trust-framework.ttl`): the trust-expression program's layer for expressing
# framework-certified-issuer trust and issuer certification scope (issue #1592; design
# `research/trust-expression-spec.md` §3.4). It EXTENDS the `trust:` vocabulary and
# REFERENCES the vendored `sec-req:` eIDAS/UK-DVS individuals — it does not fork or
# duplicate them. Dependency-free — `const &str` data + a TTL drift test, strictly
# additive (no new dep, no new edge onto the lean default build).
framework-vocab = []
# [OPUS-4.8] sq-pfae.15 — the depth-bounded certification-edge trust-graph closure
# (`graph` module): a pure, FAIL-CLOSED, ATTENUATION-ONLY pre-processing step that derives
# additional TrustRules from signed `trustx:Certification` edges AHEAD of — and consumed
# verbatim by — the UNCHANGED admission gate. Every derived rule ⊆ (anchor ∩ cert scope ∩
# validity window); any unverifiable/expired/cyclic/over-depth/broadening edge contributes
# NOTHING; zero certifications ⇒ output is the direct rules byte-identical. Enables
# `framework-vocab` (it evaluates that vocabulary's `trustx:Certification` term). Pure Rust
# over the RDFC-1.0 signature primitive this crate already carries — NO new dependency,
# strictly additive (the lean default build is byte-identical with it OFF).
cert-graph = ["framework-vocab"]
# [FABLE-5] sq-6syab.4 — holder-side trust-expression contract evaluation, CLEAR path
# (`expression` module; issue #1592, design `research/trust-expression-spec.md` §3.1–3.5):
# parse the verifier→holder request (query + trust-requirements graph + nonce), generate
# the §3.1 normative reference rewrite Q→Q' (conjoining issuer membership / positive
# status-attestation validity at t / certification-scope conformance), evaluate Q' via
# `sparq-engine` over the holder's attested named-graph dataset, and assemble the
# provenance-encoded response (RDF 1.2 reifier normative form + the named-graph/PROV-O
# runnable-today mapping). REUSES (does not duplicate) the status-list positive-status
# machinery, the secprop/ODRL `admissible()` pre-check, the `did` issuer binding, and the
# `framework-vocab` trustx: terms — hence the implied features. Pulls `sparq-engine`
# (default-features OFF) + the vendored `spargebra` parser ONLY behind this default-OFF
# feature: the lean default build is byte-identical with it OFF. Fail-closed: no
# admissible derivation ⇒ no binding; the response provenance suffices for an independent
# verifier re-check (Q' over R).
expression = [
    "framework-vocab",
    "status-list",
    "did",
    "secprop-admissibility",
    "dep:sparq-engine",
    "dep:spargebra",
    "dep:getrandom",
]
# [OPUS-4.8] sq-ufsi9 — the N3 proof-admissibility ruleset over `sparq-reason` (the
# §4.3 ODRL → admissible-proof-set reduction: strongerThan-closure / atLeast /
# overDimension / satisfies, plus the Rust default-deny universal). Pure N3-text data
# + a thin driver over the `sparq-reason` edge this crate already carries — NO new
# dependency. Enables `secprop-vocab` (it reuses the secprop namespace constant). The
# lean default build is byte-identical with it OFF.
secprop-admissibility = ["secprop-vocab"]
# [OPUS-4.8] sq-dt5hv — the Phase 5 property-admissibility PRE-CHECK in the admission
# gate (`admit::admit_with_precheck`): before the existing sig/holder checks, consult
# the secprop reasoning to verify the presented proof method satisfies the requester's
# ODRL privacy preference; fail-closed (default-deny) on non-satisfaction. OPT-IN: with
# NO preference the gate is byte-identical to `admit` (strict additivity). Pure Rust over
# the `secprop-admissibility` reduction this crate already carries — NO new dependency.
# [OPUS-4.8] sq-nrwqs (Phase 5.1) — the pre-check now resolves the presented method's
# secprop annotation graph from the BUNDLED, drift-pinned sparq-zk `secprop-methods.ttl`
# (the canonical source of truth) instead of trusting caller-supplied N3, so the
# admissibility check is self-contained + tamper-resistant. That reads the bundled graph
# at the sparq-zk edge, so this enables `sparq-zk/secprop-annotations` (the loader).
# `oxttl` (its only dep) is already an optional sparq-zk dep the default build never
# pulls — NO new dependency on the lean default build; this hardens the INPUT trust
# boundary and makes NO new soundness claim (stays under sq-qhy4).
secprop-precheck = ["secprop-admissibility", "sparq-zk/secprop-annotations"]
# [OPUS-4.8] sq-pfae.6 — the delegation stratum's AUDIT half: render an invocation-bound
# delegation chain + effective capability as a minimal W3C PROV-O audit graph
# (`prov:actedOnBehalfOf` lineage + the effective grant as `auth:*` RDF), with the
# human/AI principal classification §4.2 names as an attested attribute on the delegate.
# Pure-Rust over `oxrdf` (already a dep) + the `delegation` module — NO new dependency and,
# deliberately, NO `sparq-prov` edge (that would drag `sparq-engine` onto this crate's dep
# graph; the audit is a small fixed triple set emitted directly). Strictly additive: the
# lean default build is byte-identical with it OFF.
delegation-prov = []
# [OPUS-4.8] sq-pfae.7 — live credential status / revocation over a W3C Bitstring Status
# List + a minimal PROV-O denial justification (the P6 status stratum). Fetch (pluggable
# `StatusListResolver`) + decode (hand-rolled multibase base64url/base58btc over a pluggable
# `GzipDecoder` seam) a status list, gate derivations **fail-closed on set/unknown/stale**,
# and render a minimal `prov:`/`trust:` justification per allow OR deny. The base layer is
# DEPENDENCY-FREE (the multibase decode + the PROV-O render are pure `oxrdf` over a
# caller-supplied decoder) — NO new dependency on the lean default build, strictly additive
# (byte-identical with it OFF).
status-list = []
# The built-in `flate2` GZIP decoder (`Flate2GzipDecoder`) for the spec-mandated GZIP
# `encodedList` payload. Nested under `status-list`: it pulls `flate2` ONLY when a caller
# opts into the convenience codec; the plain `status-list` feature stays dependency-free and
# decodes over a caller-supplied `GzipDecoder`.
status-list-flate2 = ["status-list", "dep:flate2"]

[dependencies]
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
sparq-reason = { path = "../sparq-reason", version = "0.1.1", default-features = false }
# RDFC-1.0 canonical unit the ZK estate already commits over (step 1 of the gate).
sparq-canon = { path = "../sparq-canon", version = "0.1.1" }
# The CHECKED issuer signature over the RDFC-1.0 commitment (step 2). The ZK estate
# is research-grade and externally UNAUDITED (sq-qhy4) — see the crate docs.
sparq-zk = { path = "../sparq-zk", version = "0.1.1" }
# The `forShape` statement-type primitive (forPredicate desugars to it; step 3).
sparq-shacl = { path = "../sparq-shacl", version = "0.1.1", default-features = false }
oxrdf.workspace = true
# OPTIONAL — `did` feature only. Parses a fetched `did:web` DID document (JSON). The
# `did:key` path needs no JSON; the default build pulls neither.
serde_json = { version = "1", optional = true }
# OPTIONAL — `status-list-flate2` feature only. The built-in GZIP decoder for the
# spec-mandated GZIP `encodedList` payload (`sq-pfae.7`). The plain `status-list` feature is
# dependency-free over a caller-supplied decoder; the default build pulls neither.
flate2 = { version = "1", optional = true }
# OPTIONAL — `expression` feature only (sq-6syab.4). The SPARQL engine that evaluates the
# §3.1 reference rewrite Q' over the holder's attested named-graph dataset, and the vendored
# SPARQL parser that fail-closed-scopes the supported query fragment (ASK/SELECT over one
# basic graph pattern). default-features OFF on the engine so the opt-in build stays as lean
# as the engine allows; the DEFAULT sparq-trust build pulls neither (strict additivity).
sparq-engine = { path = "../sparq-engine", version = "0.1.1", optional = true, default-features = false }
spargebra = { workspace = true, optional = true }
# OPTIONAL — `expression` feature only (issue #4621). The OS CSPRNG behind
# `ChallengeNonce::generate`, the verifier-side construction path for the
# challenge-response freshness binding. Same 0.4 line — and same `fill()` API — the
# `sparq-zk` salt mint already draws from, and `sparq-zk` is an UNCONDITIONAL
# dependency of this crate, so this adds no new edge to the workspace dependency
# graph at all; the default sparq-trust build pulls no new code either way.
getrandom = { version = "0.4", optional = true }
# OPTIONAL — `secprop-vocab` feature only (sq-3705). The shared `sec-prop:`/`secx:` IRI
# constants + the canonical `secprop-ext.ttl`, single-sourced in a ZERO-dependency leaf
# so `sparq-zk` (which this crate depends on) and the lean `sparq-policy` can share them
# without a cycle. It has no dependencies of its own, so the opt-in build grows by the
# `const &str` table alone and the default build pulls nothing.
sparq-secprop-vocab = { path = "../sparq-secprop-vocab", version = "0.1.1", optional = true }

# Test-only: parse-validate the published machine-readable vocabulary
# `ontologies/trust/trust.ttl` so the Turtle a working group reads stays valid
# Turtle (sq-pfae.2). Not a runtime dependency — the lean default build is unaffected.
[dev-dependencies]
oxttl.workspace = true

# [FABLE-5] sq-d9lzx: the runnable certification-edge closure DEMO an integrator/WG
# reviewer can execute end-to-end (framework certifies issuer → attenuated effective
# rule → fail-closed Broadening + NoAnchor rejects). Gated on `cert-graph`, so it is
# NOT built in the default (feature-OFF) state — mirrors the sparq-solid example gating.
[[example]]
name = "trust_graph_closure"
required-features = ["cert-graph"]
