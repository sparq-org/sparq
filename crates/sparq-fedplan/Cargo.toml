# [OPUS-4.8] sq-a35t (epic sq-3183): OPT-IN cost-based federated source selection +
# bind-vs-hash join planning. Plans over already-fetched source DESCRIPTORS (served
# VoID + mined characteristic-set stats) — pure, deterministic, NO network I/O.
[package]
name = "sparq-fedplan"
# Not in the crates.io publish set (release-plz.toml). Published crates reach this crate only
# through optional features, which scripts/publish-strip.py removes from their packaged
# manifests; see docs/release.md "crates.io publish set".
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cost-based federated source selection (HiBISCuS prune + CostFed cardinality) and bind-vs-hash join planning over served source descriptors — opt-in, no network I/O"
readme = "README.md"

# OPT-IN, lean core. NOTHING in the workspace's default build depends on this crate:
# it is a standalone member (like `sparq-canon` / `sparq-prov`), so `sparq-core`'s
# default build and the wasm artifact are byte-identical with or without it. The
# capability is therefore OFF BY DEFAULT at the dependency level — the leanest gating,
# with zero core overhead when absent.
# [OPUS-4.8] sq-a35t, branch feat-fedplan-cost-selection.

# [SONNET-4.6] sq-my8wd.3: Render README.md as the docs.rs front page.
[package.metadata.docs.rs]
all-features = true

[features]
# The whole planner is feature-gated so even a crate that DOES depend on sparq-fedplan
# pays zero for it unless `fedplan` is enabled. OFF by default.
default = []
fedplan = []
# [GPT-5.6] sq-ioeih: opt-in descriptor-map hasher A/B. Enabling the A/B arm
# also enables the planner it measures; the default build remains unchanged.
foldhash-maps = ["fedplan", "dep:foldhash"]
# [OPUS-4.8] sq-7s4z: live adaptive mid-execution re-planning. OFF by default; IMPLIES
# `fedplan` (it re-invokes the static planner on the remaining plan). A build that does not
# enable it compiles zero adaptive code — the adaptive module is `#[cfg]`-gated out.
adaptive-replan = ["fedplan"]

[dependencies]
# Term model (oxrdf 0.3 re-export) — used only to type the public IRI surface and to
# parse a served VoID+scs descriptor document. No sparq-core/engine dependency: this
# slice plans over descriptors, never over a live Graph.
oxrdf = { workspace = true }
oxttl = { workspace = true }
rustc-hash = { workspace = true }
foldhash = { version = "0.2.0", optional = true }

# [SONNET-4.6] sq-my8wd.3: criterion for the select_sources + plan_bgp micro-bench
# (dev-only, never reaches the lean default or wasm build). Pinned at "0.5" to match
# the workspace bench pattern (sparq-substrate). Transitive deps (anes, ciborium*,
# oorandom) are already covered by upstream imports (bytecode-alliance / google /
# mozilla) in supply-chain/imports.lock from when sparq-substrate added criterion.
[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Round-trip a descriptor parsed from the served N-Triples form.
oxttl = { workspace = true }

# [SONNET-4.6] sq-my8wd.3: The micro-bench exercises select_sources + plan_bgp
# over a 3-source, 3-pattern BGP at varying scales. Feature-gated on `fedplan`.
[[bench]]
name = "fedplan"
harness = false
required-features = ["fedplan"]

# [FABLE-5] sq-vw3ax.13: the site federation-capability capture harness runs the real
# select_sources + plan_bgp over a declared fixture and prints verbatim output for
# site/src/lib/federation.ts (the anti-fabrication discipline of sq-dwdm / sq-3was).
# Registering the requirement keeps `cargo build --all-targets` (default features)
# green — the example's whole file is `#![cfg(feature = "fedplan")]`-gated.
[[example]]
name = "capture_surface_federation"
required-features = ["fedplan"]
