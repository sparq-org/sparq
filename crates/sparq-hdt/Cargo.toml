[package]
name = "sparq-hdt"
version.workspace = true
edition.workspace = true
license.workspace = true
# The wrapped `hdt` crate's MSRV is 1.87. Historically this was ABOVE the workspace
# floor (then 1.85), so it was declared per-crate to keep the rest of the workspace's
# floor lower. The workspace floor is now 1.88 ([OPUS-4.8] sq-qmth — driven by
# geo@0.33.1), i.e. AT/ABOVE this, so this pin is now redundant; it is kept explicit
# (and the crate stays excluded from the `msrv` CI job) only to keep sparq-hdt's own
# documented floor visible and decoupled from future workspace-floor changes.
rust-version = "1.87"
description = "Opt-in HDT (Header Dictionary Triples) reader for the sparq RDF engine: load .hdt archives straight into a sparq Graph"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [OPUS-4.8] sq-jxl0: wire docs.rs to build all-features + the `docsrs` cfg so the README
# front page and every feature-gated item (`write`, `zlib-ng`) render on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [OPUS-4.8] sq-2te / [GPT-5] sq-2l1: HDT WRITE support (`save`: sparq `Graph` ->
# `.hdt`). Opt-in because the upstream crate gates `Hdt::read_nt` (N-Triples ->
# FourSectDict PFC + BitmapTriples) behind its experimental `nt` feature. Reading
# stays default and N-Triples-parser-free; only writers pay for it.
[features]
write = ["hdt/nt"]
# [GPT-5.6] sq-lsp7k.24: opt-in triple-pattern filtering at the one-shot HDT
# decode seam. `oxrdf` is already present through `sparq-core`; naming it as an
# optional direct dependency exposes the RDF term types without changing the
# default dependency graph.
load-filter = ["dep:oxrdf"]
# [OPUS-4.8] (sq-i3xc, lever H5) `zlib-ng`: opt-in, OFF by default, NATIVE-ONLY faster
# gzip backend (zlib-ng C library via flate2) for `.hdt.gz` inflate — a measured 1.5–3×
# at ~zero code change. SAFE because sparq-hdt is native-only and never in the sparq-wasm
# graph (`cargo tree -p sparq-wasm -e normal` shows no sparq-hdt), so the C dep can never
# reach the wasm bundle. The default flate2 backend stays pure-Rust miniz_oxide.
zlib-ng = ["flate2/zlib-ng"]

# Opt-in HDT ingestion (T24a). This is a SEPARATE crate so the core engine — and in
# particular the wasm build — carries zero HDT code or dependencies; HDT support is
# engaged only by depending on this crate. Native-only by design (the wrapped reader
# spawns threads and the use case is bulk ingest).
#
# Wrap-vs-implement: we WRAP the maintained `hdt` crate (KonradHoeffner/hdt, MIT)
# rather than reimplement the binary format (Plain/Log64 sequences, PFC dictionary
# sections, BitmapTriples). It reads the de-facto standard layout emitted by
# hdt-cpp / hdt-java: FourSectionDictionary (Plain Front Coding) + BitmapTriples in
# SPO order. `default-features = false` drops its sophia adapter — we translate at
# the id level, not through sophia terms. [GPT-5] sq-2l1: hdt 0.7 moves to qwt 0.4,
# whose aarch64 prefetch path uses stable inline assembly instead of a nightly-only
# intrinsic.

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1" }
oxrdf = { workspace = true, optional = true }
# Read path uses NO features (id-level translation, no sophia adapter). The `write`
# feature (above) turns on `hdt/nt` to reach `Hdt::read_nt`; `Hdt::write` is
# available on the lean read path too.
hdt = { version = "0.7", default-features = false }
# GZipped-HDT auto-detection (`.hdt.gz`): magic-byte sniff + streaming decode.
# The default backend (miniz_oxide) is pure Rust; flate2 is already used
# elsewhere in the workspace (sparq-cli, and previously this crate's dev-deps).
flate2 = "1"
# [OPUS-4.8] H5: extra compressed-HDT containers publishers ship. Both decode in a
# STREAMING fashion (the decompressed `.hdt` is never fully materialized), matching
# the existing gzip path; selection is by MAGIC BYTES, not file name.
#   zstd  — `.hdt.zst` (magic 28 B5 2F FD). `zstd::stream::read::Decoder`.
#   bzip2 — `.hdt.bz2` (magic "BZh").       `bzip2::read::MultiBzDecoder`.
zstd = "0.13"
bzip2 = "0.6"
# [OPUS-4.8] CRC8/CRC32-C verification in the direct decoder (decode.rs). Same
# crate (and the same CRC params) the wrapped `hdt` reader uses for the bitmap /
# sequence sections, so the direct path validates byte-for-byte identically.
crc = "3"
# [OPUS-4.8] sq-s506 (lever H6): decode the four PFC dictionary sections
# (shared / subjects / objects / predicates) concurrently on the rayon pool. Native
# only — sparq-hdt is never in the sparq-wasm graph (`cargo tree -p sparq-wasm` shows
# no sparq-hdt), so this can never reach the wasm bundle. Always-on (not feature
# gated): the read path here already spawns threads in the wrapped reader and the use
# case is bulk ingest, so unlike sparq-core there is no single-threaded build to keep.
rayon = { workspace = true }

[dev-dependencies]
# The `nt` feature provides hdt's (experimental) N-Triples -> HDT writer
# (`Hdt::read_nt`), used ONLY to build .hdt round-trip fixtures / benchmark inputs
# from N-Triples ground truth in-process.
hdt = { version = "0.7", default-features = false, features = ["nt"] }
# [OPUS-4.8] sq-117n: per-test unique, auto-cleaned scratch dirs. The roundtrip
# tests build `.hdt` archives by writing an N-Triples file to disk and reading it
# back with `Hdt::read_nt`; using FIXED `CARGO_TARGET_TMPDIR` subdir names let
# sibling tests race on the same `src.nt` (three rejection-oracle tests shared one
# `valid_corruptible_hdt()` helper -> one fixed scratch dir), flaking the suite
# under `cargo test` parallelism. `tempfile::tempdir()` hands each invocation a
# unique directory (auto-removed on drop), so no two tests can ever collide.
tempfile = "3"
# [GPT-5.6] sq-agrtc: generate bounded, duplicate-heavy RDF fixtures that witness
# HDT dictionary decode equivalence across explicit rayon thread counts.
proptest = "1"
# [OPUS-4.8] (sq-cxji) Test-only: PARSE the `examples/bench_load.rs` `--json` emit back
# to assert it is valid, well-shaped JSON. The emit itself stays serde-free (hand-built
# `format!`, mirroring `mpc_net_bench::cell_json`); serde_json is a dev-dependency so it
# never enters the crate's published graph.
serde_json = "1"
