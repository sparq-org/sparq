[package]
name = "sparq-solid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Solid Pod access control for the sparq RDF engine: pods as named graphs, WAC/ACP materialized to a queryable triples-native auth view by N3 rules, queries filtered to authorized graphs"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Opt-in Solid layer (the sparq-reason isolation pattern): a SEPARATE crate so the
# core engine carries zero Solid/access-control code, deps, or runtime cost — it is
# a dependency of NOTHING in the workspace. Design: research/solid-access-control-design.md.

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg (for #[cfg_attr(docsrs, ...)] gating).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
sparq-engine = { path = "../sparq-engine", version = "0.1.1", default-features = false }
# [SONNET-4.6] sq-zgbso.4 (epic sq-zgbso, issue #1582): the materializer evaluates the
# WAC/ACP rules on the id-level COMPILED evaluator (`sparq_reason::n3::compiled`), so the
# `compiled-rules` slice is REQUIRED, not optional — the rule text is lowered to the IR
# once per process and the facts enter as `[Id; 3]` straight from the source `Graph`, with
# no per-call N3 text round trip. It pulls only the `sparq-substrate` rows+join slices
# (an in-tree path dep, no new external crate); `sparq-core`/`sparq-engine` are untouched.
sparq-reason = { path = "../sparq-reason", version = "0.1.1", default-features = false, features = [
    "compiled-rules",
] }
# [OPUS-4.8] sq-h3uk: the ODRL→AUTH_GRAPH bridge. OPTIONAL + behind the `odrl-bridge`
# feature (OFF by default), so the default sparq-solid build carries zero ODRL code,
# deps, or runtime cost — sparq-policy is NOT forced onto the default build. Research
# track (the single-node bridge of epic sq-3183), NOT a production cutover.
sparq-policy = { path = "../sparq-policy", version = "0.1.1", default-features = false, optional = true }
# [OPUS-4.8] sq-pfae PoC (issue #940): the trust-graph admission gate. OPTIONAL +
# behind the `trust-graph` feature (OFF by default), so the default sparq-solid build
# carries ZERO trust-graph code, deps, or runtime cost — it behaves EXACTLY as WAC/ACP
# do now (strict additivity, design §2.2 G6). RESEARCH prototype (`sparq-trust` is
# publish=false; the ZK estate it composes with is externally unaudited, sq-qhy4), NOT
# a production cutover. Path-only (no crates.io version): the `trust-graph` feature is a
# research-only feature and is not part of sparq-solid's published feature set.
sparq-trust = { path = "../sparq-trust", version = "0.1.1", optional = true }
# [SONNET-4.6] sq-ysv3u (issue #2935): the TRUST-THE-ISSUER backend for ACP `acp:vc` —
# W3C Data Integrity (`eddsa-rdfc-2022`) verification of a presented credential. OPTIONAL +
# behind the `acp-vc` feature (OFF by default), so the default sparq-solid build carries ZERO
# credential-verification code or crypto deps. The `acp:vc` MATCHER SEMANTICS (fail-closed
# unless a verified holding is supplied) are unconditional and need no dependency — this dep
# only provides the verification that populates the trusted channel. Path-only (no crates.io
# version): `sparq-vc` is `publish = false`, so like `trust-graph` this is a research-only
# feature and is not part of sparq-solid's published feature set.
sparq-vc = { path = "../sparq-vc", version = "0.1.1", optional = true }
oxrdf.workspace = true
spargebra.workspace = true
rustc-hash.workspace = true

[features]
# [OPUS-4.8] sq-h3uk: materialize matched ODRL permissions into the AUTH_GRAPH so the
# existing graph-level WAC/ACP enforcement applies them. OFF by default (lean core);
# pulls in the optional sparq-policy ODRL evaluator only when enabled.
odrl-bridge = ["dep:sparq-policy"]

# [OPUS-4.8] sq-58mh: wire sparq-policy's STATEFUL `odrl:count` enforcement THROUGH the
# bridge so a bridged grant SELF-RETRACTS on exhaustion. OFF by default; implies
# `odrl-bridge` and turns on the `count-enforcement` feature of sparq-policy (the
# usage-counter store + the atomic `evaluate_and_exercise`). ACP is stateless — there
# is no per-session usage counter — so the count is enforced through the EXISTING
# refresh/retraction ledger (sq-dpk4): the count is consumed atomically at exercise and
# re-checked (read-only) on refresh, dropping the grant once the budget is spent.
count-enforcement = ["odrl-bridge", "sparq-policy/count-enforcement"]

# [OPUS-4.8] sq-pfae PoC (issue #940): the trust-graph admission stratum. OFF by
# default — with the feature off, sparq-solid is BYTE-IDENTICAL to WAC/ACP today (the
# strict-additivity property G6, design §2.2). With it on, `PodStore` gains ONE new
# feature-gated method ([`PodStore::admit_trust_credential_and_materialize`]) that runs
# the `sparq-trust` admission gate over a presented credential and injects the
# issuer-tagged admitted-fact-derived `auth:*` grants into `<urn:sparq:auth>` AHEAD of
# (on top of) the unchanged materialiser — exactly the ODRL-bridge grant-injection
# pattern. RESEARCH prototype, NOT a security guarantee; no privacy/unlinkability (the
# ZK estate is externally unaudited, sq-qhy4). See the crate README + the access-control
# SKILL for the honest scope.
trust-graph = ["dep:sparq-trust"]

# [OPUS-4.8] sq-pfae.3 (issue #940): forward `sparq-trust`'s OPT-IN `did` feature so a
# sparq-solid integrator can bind a trust rule's issuer key from a `trust:issuerDid`
# (`did:key` offline self-cert / pluggable `did:web`) via `sparq_trust::resolve_rule_keys`,
# narrowing the operator-asserted-key forgery vector D′. Default-OFF and additive over
# `trust-graph` — it adds only the resolver surface; no new runtime method. See the
# `sparq-trust` `did` rustdoc for the honest scope (self-cert ≠ trust anchor; did:web is
# only as strong as host/TLS control; no privacy).
trust-graph-did = ["trust-graph", "sparq-trust/did"]

# [FABLE-5] sq-lrtc3.3 (epic sq-lrtc3): pattern-scoped (sub-named-graph) result masking —
# an ODRL target as a set of allow/deny TRIPLE PATTERNS over a source graph, enforced by
# MATERIALIZING the masked sub-graph replica so masked triples are physically absent from
# the evaluated dataset (oracle-equivalent under OPTIONAL/EXISTS/MINUS/aggregates/COUNT by
# construction — no per-scan filtering, no engine change). OFF by default; adds NO
# dependency (public sparq-core/sparq-engine APIs only), so the default build carries zero
# pattern-scope code and stays byte-identical. Design + measured-envelope pointers:
# research/odrl-pattern-scoped-targets-2026-07.md; overhead JSONs in bench/pattern-scope/.
pattern-scope = []

# [OPUS-4.8] sq-gq28y (issue #1546, maintainer decision "spec compliant - empty by default"):
# a LEGACY escape hatch that restores the pre-flip union-always default-graph semantics.
#
# The DEFAULT read path (`query_as`/`query_json_as`/`ask_as`) is now SPEC-COMPLIANT per the
# *Access-Controlled SPARQL Query over a Solid Pod* Editor's Draft (jeswr/solid-sparql-query)
# §"The default graph is empty" + §"Union default graph mode": the standing default graph is
# EMPTY (a bare `{ ?s ?p ?o }` matches nothing) UNLESS the query opts in per-request with
# `FROM <http://www.w3.org/ns/solid/sparql#union-default-graph>` (the reserved IRI exposed as
# `UNION_DEFAULT_GRAPH_IRI`), which makes the default graph the RDF merge of the authorized
# named graphs FOR THAT REQUEST ONLY (no cross-request leak). The empty-default + explicit-union
# surface is ALWAYS ON (no feature needed) — it is the spec-conformant default.
#
# This feature is a CHEAP, OPT-IN migration escape hatch (OFF by default; adds NO dependency —
# a pure query-rewrite change). With it ON, `wrap_read` reverts to the always-on per-pattern
# GRAPH wrap (`wrap_for_view`) so a bare default-graph pattern once again ranges over the union
# of the session's authorized named graphs — byte-identical to the pre-flip default. It exists
# only so a downstream deployment that relied on the old union-always idiom can migrate on its
# own schedule instead of at once; new code should use `GRAPH ?g` or the spec-minted opt-in.
# SECURITY: both variants stay STRICTLY within the session's authorized named graphs — the
# escape hatch does NOT widen the readable set, it only reinstates the (more permissive-looking
# but equi-authorized) bare-pattern-scans-the-union convenience.
legacy-union-default-graph = []

# [SONNET-4.6] sq-ysv3u (issue #2935): the TRUST-THE-ISSUER backend for ACP `acp:vc`.
#
# READ THIS BEFORE ASSUMING THE FEATURE GATES THE SEMANTICS — it does not. `acp:vc` matcher
# evaluation is UNCONDITIONAL: an `acp:vc` matcher is satisfied only by an agent the caller
# has asserted (through the always-available `VerifiedCredentials` trusted channel) holds a
# verified credential for, and with no assertion it FAILS CLOSED. That correction ships in
# the default build because the previous behaviour was an over-grant — `acp:vc` was an
# unrecognized attribute, so a credential-gated matcher looked agent-unconstrained and
# granted auth:Public, i.e. everyone including anonymous.
#
# What this OPT-IN feature adds is only the machinery that POPULATES the channel:
# `VcRequirement` + `VerifiedCredentials::admit_data_integrity`, which verify a presented
# credential's W3C Data Integrity proof (`eddsa-rdfc-2022` = Ed25519 over RDFC-1.0) via
# `sparq-vc`, check the signer is an accepted issuer, and check the credential type and
# exact-match claims. OFF by default, so the default build carries no crypto dependency.
#
# HONEST SCOPE: trust-the-issuer only — authenticity, integrity, non-repudiation. It reveals
# the whole credential to the verifier and makes NO privacy, unlinkability, zero-knowledge or
# selective-disclosure claim. The zero-knowledge backend (prove an attribute without
# revealing the credential) is NOT wired here: it needs the ZK estate, whose external
# accredited-cryptographer audit is still PENDING (sq-qhy4). Revocation and credential expiry
# are not checked either — a holding lasts until the caller re-materializes.
acp-vc = ["dep:sparq-vc"]

# [OPUS-4.8] sq-gq28y (issue #1546): the vendored solid-sparql-query query-semantics
# conformance suite runner (tests/conformance_solid_sparql_query.rs) parses the pinned
# upstream manifest.json. serde_json is a DEV-only dependency — it does not enter the
# runtime or published graph (the default sparq-solid build stays dependency-light).
[dev-dependencies]
# [SONNET-4.6] sq-z1xv8 — the shared ratchet-floor constants. DEV-ONLY (zero-dep,
# `publish = false`): the conformance ratchet floor this crate's test runner enforces is
# the SAME `const` sparq-conformance's central scoreboard reports, so the two cannot
# drift, and the dep edge puts this crate in the floors crate's reverse-dependency
# closure (which is what makes CI test-selection sound for the floor — it replaces the
# guard test's old runtime read of this file's source).
sparq-conformance-floors = { path = "../sparq-conformance-floors" }
serde_json = "1"

# [OPUS-4.8] sq-zgbso.1 MEASURED SPIKE (issue #1582, design record
# research/odrl-n3-compiled-rules.md): ODRL permission evaluation as N3 rules
# (rules/odrl-spike.n3) differentially tested against the hand-written Rust path. Gated on
# `odrl-bridge` (it drives the real `sparq_policy::evaluate` + `odrl_bridge::materialize_policy`),
# so it is NOT built in the default (feature-OFF) state and adds zero default-build cost.
# Measurement-only: no production wiring, no new public API.
[[example]]
name = "odrl_n3_spike"
required-features = ["odrl-bridge"]

# [FABLE-5] sq-lrtc3.3: the pattern-scope measured-overhead driver (design record
# research/odrl-pattern-scoped-targets-2026-07.md §4; committed JSONs in
# bench/pattern-scope/, work-box numbers NON-canonical). Gated on `pattern-scope`,
# so it is NOT built in the default (feature-OFF) state. Measurement-only.
[[example]]
name = "pattern_scope_bench"
required-features = ["pattern-scope"]

# [OPUS-4.8] sq-pfae PoC: the trust-graph end-to-end test (tests/trust_graph.rs, fully
# `#![cfg(feature = "trust-graph")]`) drives the admission gate through the real
# PodStore. These are dev-only — they do not touch the default build or publish. Scoped
# to NON-wasm32 [OPUS-4.8 sq-7agop]: the `trust-graph` ZK estate (the arkworks stack →
# `rand 0.8 → getrandom 0.2`) is native-only and not wasm-portable, so excluding it from
# the wasm32 dev-graph lets `tests/wasm_materialize.rs` build under `wasm-pack test`
# without dragging a wasm-incompatible getrandom into the test graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sparq-trust = { path = "../sparq-trust" }
sparq-zk = { path = "../sparq-zk" }

# [OPUS-4.8] sq-7agop: wasm32 build+smoke check (regression guard for the cfg-gated
# `std::time::Instant` in `materialize_*`). `tests/wasm_materialize.rs` runs the REAL
# materialize path in a genuine wasm32 runtime via `wasm-pack test --node`, asserting it
# no longer traps (it panicked on `Instant::now()` before the fix). These are DEV-ONLY
# wasm32-target deps — they do NOT enter the runtime/published graph and native builds
# link none of them:
#  - getrandom/wasm_js: the crate's transitive `oxrdf → rand → getrandom` needs a wasm
#    RNG backend selected before it compiles for wasm32 (the workspace `.cargo/config.toml`
#    sets the matching `--cfg getrandom_backend="wasm_js"`). A downstream host bundle
#    selects the backend itself at runtime (see README §WASM support), as `sparq-wasm` does.
#  - wasm-bindgen-test: the headless test harness (pairs with the 0.2.x wasm-bindgen line).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-test = "0.3"
