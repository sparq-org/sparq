[package]
name = "sparq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "W3C-conformant HTTP server exposing the sparq query engine (SPARQL 1.1 Protocol + Graph Store HTTP Protocol read side)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] crate-local README so crates.io (package.readme) matches the docs.rs front
# page (lib.rs include_str!("../README.md")) — same content on both registries.
readme = "README.md"

# [OPUS-4.8] docs.rs builds the crate's library root (lib.rs) as the front page; build
# with every feature so the full server/time-travel/service/geo surface is documented,
# and pass --cfg docsrs so #[cfg_attr(docsrs, doc(cfg(...)))] feature badges can render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
# rlib so the protocol/serializer logic can be unit-tested and reused by the binary.
crate-type = ["rlib"]

[[bin]]
name = "sparq-server"
path = "src/main.rs"
required-features = ["server"]

[features]
# `server` pulls the async HTTP stack (axum/hyper/tokio). Default-on for the native
# build; the wasm build never compiles this crate (it depends only on sparq-core and
# sparq-engine directly — see crates/sparq-wasm/Cargo.toml), so the heavy async deps
# are never part of the bundle. Kept behind a feature so a consumer can depend on the
# pure serializer library (XML/CSV/TSV) without dragging in the runtime.
# [OPUS-4.8] (sq-oy1f.4, MAINTAINER-DIRECTED DEFAULT-ON EXCEPTION) `jsonld` is in the default
# set: the server speaks `application/ld+json` in BOTH directions (CONSTRUCT/DESCRIBE + GSP-read
# EMIT, GSP-write ACCEPT) out of the box (the user-prioritised sq-oy1f epic). Deliberate exception
# to opt-in-by-default — JSON-LD is the dominant linked-data interchange format and the server
# binary has no bundle-size floor. Still TOGGLEABLE: `--no-default-features --features server`
# (or just `server`) drops JSON-LD and `application/ld+json` becomes unrecognised (406/415) as
# before. The `--no-default-features` (pure serialiser library) build is unaffected.
# [FABLE-5] (sq-7d3dj.30.13) `algebra-rewrite` is in the default set too: the shipped server
# binary executes the same rewritten plans the CLI and the canonical benchmarks measure
# (#1735 — result-equivalent, zero new deps; see the feature's own comment below). Like
# `jsonld` it is a BINARY-crate default only — sparq-engine's LIBRARY default stays OFF, and
# `--no-default-features --features server,jsonld` drops it for an explicit rewrite-dark build.
# [OPUS-5] (sq-7d3dj.30.15) `dp-planner` joins it, for the same reason and by the same
# mechanism: sq-7d3dj.30.5 lit the DPccp join-order planner in sparq-cli ONLY, so the HTTP
# binary planned joins with greedy GOO while every CLI-measured build planned them with the
# cost-optimal DP — the two shipped surfaces disagreed on join order. See the feature's own
# comment below.
default = ["server", "jsonld", "algebra-rewrite", "explain-json", "dp-planner"]
# [FABLE-5] (sq-ixc3.19) `explain-json` (default ON): the STRUCTURED explain response —
# `Accept: application/x-sparq-explain+json` on `/sparql` answers with sparq-engine's typed
# plan tree (`explain_json::PlanNode`, sq-u4lgr/#902) as camelCase JSON
# (`operator`/`estimated`/`actual`/`nanos`/`qError`/`children` — the sq-jbqh4 schema
# contract) instead of the plan TEXT, powering the GUI plan explorer's endpoint mode
# (per-operator time / cardinality / q-error heat). BINARY-crate default like
# `algebra-rewrite` above: sparq-engine's LIBRARY default stays OFF, the feature pulls
# ZERO new dependencies (`explain-json = []` in the engine), and
# `--no-default-features --features server,jsonld` drops it — a lean build then answers a
# structured-explain request with 406 (the text explain surface is unaffected either way).
# The pure serialiser library build (`--no-default-features`) is unaffected.
explain-json = ["sparq-engine/explain-json"]
# [FABLE-5] (sq-7d3dj.30.13) `algebra-rewrite` (default ON, see above): forwards sparq-engine's
# opt-in pre-execution algebra rewrite pass (#1735 / sq-7d3dj.30.1) — the result-equivalent
# FILTER `?v = <iri>` constant substitution + `FILTER(!bound) → Minus` anti-join applied by
# `PreparedQuery::parse` before evaluation. IRI-constants only (the sq-lr2ii literal-equality
# avoidance contract); a non-matching shape is left verbatim. Pulls ZERO new dependencies
# (`algebra-rewrite = []` in sparq-engine) and no `unsafe`; the pass's soundness revert-witnesses
# run in the `sparq-engine (algebra-rewrite)` feature-matrix leg, and
# `tests/algebra_rewrite_default.rs` is this crate's tripwire that the default set keeps it lit.
# The pure serialiser library build (`--no-default-features`) is unaffected either way — this
# only changes which sparq-engine the QUERY path compiles against.
algebra-rewrite = ["sparq-engine/algebra-rewrite"]
# [OPUS-5] (sq-7d3dj.30.15) `dp-planner` (default ON, see above): forwards sparq-engine's
# opt-in DPccp join-order planner (sq-7d3dj.30.5 / #1732). Once compiled it is DEFAULT-ON in
# the engine (the `Install::Default` state), so every BGP a request evaluates that is connected,
# has 3..=63 patterns and fits the `DEFAULT_MAX_SUBGRAPHS` budget is planned by the cost-optimal
# bushy DP instead of greedy GOO — no `with_dp_planner` call is needed on the request path, and
# a caller can still opt out per-scope with `sparq_engine::without_dp_planner`.
#
# WHY default-on here: sq-7d3dj.30.5 enabled it in sparq-cli only, so the canonical CLI-measured
# benchmarks and the shipped HTTP binary planned joins DIFFERENTLY — an HTTP-measured number was
# not comparable to a CLI-measured one, and the server ran the greedy plan the DP's cost model is
# there to improve on for the shapes it accepts. (The n < 3 case is NOT one of them: greedy GOO is
# already Cout-optimal there, which is why sq-7d3dj.30.5 raised the threshold.) Same BINARY-crate
# default rationale as `jsonld` / `algebra-rewrite` / `explain-json` above: sparq-engine's LIBRARY
# default stays OFF, and `--no-default-features --features server,jsonld` still builds an
# explicitly greedy-GOO server.
#
# Result-EQUIVALENT: the planner only reorders joins, never changes the answer — the invariant is
# asserted by sparq-engine's `tests/query_features/dp_planner_differential.rs` in the
# `sparq-engine (dp-planner)` feature-matrix leg. Pulls ZERO new dependencies (`dp-planner = []`
# in sparq-engine) and no `unsafe`; `tests/dp_planner_default.rs` is this crate's tripwire that
# the default set keeps it lit. The pure serialiser library build (`--no-default-features`) is
# unaffected either way — this only changes which sparq-engine the QUERY path compiles against.
dp-planner = ["sparq-engine/dp-planner"]
# [OPUS-4.8] (sq-vpx4) Compiles internal TEST SEAMS — currently the durable-write
# failure-injection hook on the `--persist` seal path, exposed via
# `AppState::with_config_inject_durable_failure` for the graceful-degradation
# integration test. Production builds never enable it (the seam field + constructor
# vanish), so production behaviour is byte-identical to a build without this feature.
test-seams = []
# [SONNET-4.6] (sq-qsm5z) `query-registry` (default OFF): opt-in in-memory running-query
# registry: each executing SELECT/ASK/CONSTRUCT/DESCRIBE registers on start and deregisters on
# completion or error (RAII). [SONNET-4.6] (sq-m9prn) A SPARQL UPDATE registers the same way,
# from the sequenced writer thread as it starts applying, and is listed as `kind: "update"` —
# the row whose cancellation also releases the writer for every write queued behind it. A
# cancelled UPDATE is rejected WHOLE (the writer forks per batch and seals only on success),
# never partially applied. `GET /queries` lists active queries (id, kind, start timestamp, an
# FNV-1a fingerprint — never raw text per the #241 / sq-m9prn redaction posture; it is an
# UNKEYED checksum, so it is a stable correlation tag and NOT a confidentiality boundary — a
# reader can confirm a guessed query/update body offline, see `registry_fingerprint`,
# elapsed ms) behind the READ auth gate (fail-closed). `DELETE /queries/{id}` cooperatively
# cancels one query by flipping the `sq-kq9ia` cross-thread `Arc<AtomicBool>` cancel flag
# already wired into the engine's `QueryBudget`, behind the WRITE auth gate (fail-closed).
# Zero cost when compiled out: no fields in `AppState` or the writer's applier, no routes,
# byte-identical to before.
# Pulls no new dependencies beyond those already present via `server`.
query-registry = ["server"]
# [OPUS-4.8] (sq-0bxp) `audit-log` (default OFF): compiles the OPT-IN per-query access
# audit log (CDMC CD-2 / ISO 27001 A.8.15 / EU CRA logging). With the feature on, the
# server can emit a structured `tracing` record under target `sparq_server::audit` for
# every query / update / Graph-Store request — requester identity (a token fingerprint or
# `anonymous`, never the secret), operation class, a NON-reversible query fingerprint (NOT
# the full query text — the #241 info-leak posture), the access decision, the HTTP status /
# row count and the duration. STILL OFF AT RUNTIME by default even when compiled in: the
# operator must additionally set `--audit-log` / `SPARQ_AUDIT_LOG=1`
# (`ServerConfig::audit_log`). Without the feature the audit module + every call site is
# `#[cfg]`-stripped, so a request pays exactly ZERO — byte-identical to before. Needs the
# `server` feature (it works on the async HTTP `Response` + `tracing`).
audit-log = ["server"]
# [OPUS-4.8] (sq-gos8, epic sq-toze) `access-audit` (default OFF): compiles the OPT-IN RICHER
# STRUCTURED access-audit sink (ASVS V7 / ISO 27001 A.8.15 / CDMC CD-2 logging). Where
# `audit-log` emits a flat `tracing` event, this emits a TYPED, self-describing access RECORD
# (actor / action / resource / decision + policy-basis / timestamp / request fingerprint) as
# JSON-Lines through a PLUGGABLE sink (`access_audit::AuditSink`); the default sink writes to a
# configured file or stderr (heavy/external sinks — SIEM, OTel — stay out of core, an embedder
# implements the trait). STILL OFF AT RUNTIME by default even when compiled in: the operator
# must additionally configure a sink target (`--access-audit <file|stderr>` /
# `SPARQ_ACCESS_AUDIT`), so `AppState`'s sink is `None` unless deliberately turned on. PRIVACY
# BOUNDARY: it records identities (WebID / token fingerprint) + resource IRIs BY DESIGN (that is
# the audit trail) but the query CONTENT only as a NON-reversible fingerprint, never the raw
# text (the #241 / sq-toze.34 redaction posture). Without the feature the module + every call
# site is `#[cfg]`-stripped, so a request pays exactly ZERO. Needs `server` (it hooks the async
# enforcement seam) and reuses the already-present `serde_json` for the JSON-Lines records.
access-audit = ["server"]
# [OPUS-4.8] (sq-7cxr, gh-44) `server` turns on `sparq-core/mmap` so the binary can use the
# engine's durable directory-backed `Graph` (`Graph::open`/`save` + the per-graph write-ahead
# log + named-graph persistence) behind the `--persist <DIR>` flag — the QLever `--persist-updates`
# equivalent. Feature unification means the `sparq-core` `sparq-engine` resolves also gains `mmap`,
# so the WAL-durable `apply_delta` path is live on the shared graph. Without `--persist` the server
# is in-memory exactly as before (the flag, not the feature, selects durability).
server = ["dep:sparq-serve", "dep:axum", "dep:hyper", "dep:hyper-util", "dep:http-body", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:futures-util", "dep:serde_json", "dep:flate2", "sparq-core/mmap"]
# [GPT-5.6] (sq-abhuq) Opt-in outbound gzip/zstd negotiation for HTTP result bodies.
# The default build remains byte-identical: without this feature the response middleware is
# cfg-stripped and tower-http's compression codecs are not compiled. The middleware preserves
# streaming bodies and its default predicate excludes SSE and already-encoded responses.
response-compression = ["server", "tower-http/compression-gzip", "tower-http/compression-zstd"]
# [GPT-5.6] sq-oprna.6: opt-in HTTP/2 on the TCP listener. The feature switches only the
# connection builder from hyper's HTTP/1-only builder to hyper-util's h1+h2 auto builder and
# enables optional rustls termination with ALPN when --tls-cert/--tls-key are supplied. Without
# this feature the original HTTP/1-only accept loop and dependency graph are unchanged.
http2 = ["server", "axum/http2", "hyper/http2", "hyper-util/http2", "dep:rustls", "dep:tokio-rustls"]
# [GPT-5.6] sq-oprna.3: HTTP/3 is a second, encrypted UDP listener dispatching into the
# same Router as the unchanged plain-HTTP TCP listener. Every QUIC/TLS dependency remains
# absent from the normal dependency graph unless this default-off feature is selected.
http3 = ["server", "dep:quinn", "dep:rustls", "dep:sparq-http3"]
# [OPUS-4.8] (sq-i3xc, lever H5) `zlib-ng`: opt-in, OFF by default, NATIVE-ONLY faster
# gzip backend (zlib-ng C library) for the server's `Content-Encoding: gzip` request
# inflate (MultiGzDecoder) — a measured 1.5–3× at ~zero code change. The weak
# `flate2?/zlib-ng` only applies when flate2 is present (i.e. the `server` feature is on);
# with `--no-default-features` (pure serializer library) it is a no-op. SAFE because this
# crate is never in the sparq-wasm graph, so the C dep can never reach the wasm bundle.
# The default flate2 backend stays pure-Rust miniz_oxide.
zlib-ng = ["flate2?/zlib-ng"]
# `time-travel` (default OFF — opt-in is the contract, user-approved) lets a query pin
# a RETAINED generation: `?generation=N` on /sparql serves the store as of generation N
# (410 Gone once it ages out of the retention window), every /sparql response carries
# the `Sparq-Generation` header (the same generation-number token the horizontal-scaling
# ADR's read-your-writes shard_seq concept uses), and the ring's retention extends per
# `--time-travel-generations` / `--time-travel-max-age`. Off, the parameter handling is
# compiled out entirely (`?generation` is just an ignored unknown parameter, no header)
# and the ring keeps only its concurrency window. Non-default because the memory cost is
# real: each retained generation is a FULL Graph until the structural-fork follow-up
# lands (see sparq_serve::TimeTravelConfig).
time-travel = ["server"]
# [OPUS-4.8] (sq-4w18) `service` (default OFF) enables the engine's SPARQL 1.1 federated
# SERVICE clause (passthrough to sparq-engine/service: ureq + serde_json, native-only).
# It makes the host an SSRF surface, so it is gated behind a default-DENY-all egress
# allowlist (--service-allow / --service-allow-file / SPARQ_SERVICE_ALLOW). Off (default),
# no federation code compiles and a SERVICE clause errors at execution. See the README
# and skills/http-server/SKILL.md.
service = ["server", "sparq-engine/service"]
# `geo` (default OFF) installs sparq-geo's geof: extension-function registry
# (GeoSPARQL distance / sf* relations / envelope / boundary / convexHull) on the
# query, update and subscription paths — see docs/extension-functions.md. Off, the
# server compiles without sparq-geo or the georust stack and every engine call is
# the registry-free one (zero cost, byte-identical behaviour).
geo = ["dep:sparq-geo"]
# [OPUS-4.8] (sq-d3d8, epic sq-3183) `federation-descriptors` (default OFF) makes the
# server a *discoverable* federation node: it serves a W3C VoID dataset description at
# `GET /.well-known/void` and a SPARQL 1.1 Service Description for a `GET /sparql` with no
# `query` parameter. The descriptor generation lives in `sparq-introspect`
# (`Introspection::to_void`); this feature pulls that crate (light: it depends only on
# sparq-core + serde, no async/heavy deps) and mounts the routes. STILL OFF AT RUNTIME by
# default even when compiled in — the operator must additionally set
# `--federation-descriptors` / `SPARQ_FEDERATION_DESCRIPTORS=1` (config flag
# `ServerConfig::federation_descriptors`), so discovery is never exposed unless deliberately
# turned on. Without the feature, zero cost: no sparq-introspect dependency, no routes,
# byte-identical to before; sparq-core/sparq-engine untouched either way.
federation-descriptors = ["server", "dep:sparq-introspect"]
# [GPT-5.6] sq-lsp7k.5.2: `facets` (default OFF) exposes a grouped facet-count API at
# `POST /facets`. The JSON request selects a class / constraints / facet predicates and the
# response carries type, predicate, and value distributions computed by `sparq-introspect` over
# one pinned graph snapshot. It is DOUBLE opt-in: this build feature compiles the dependency +
# route, while `--facets` / `SPARQ_FACETS=1` enables the route at runtime. Without the feature,
# there is no introspection dependency or route and the default server binary stays unchanged.
facets = ["server", "dep:sparq-introspect"]
# [GPT-5.6] sq-lsp7k.9.3: `complete` (default OFF) exposes prefix completion at
# `GET /complete?q=<prefix>&limit=<k>`. The AppState-owned CompletionIndex is built lazily from
# one pinned generation and rebuilt after an update publishes a newer generation. It is DOUBLE
# opt-in: this build feature compiles the pure-index `sparq-text` dependency + route, while
# `--complete` / `SPARQ_COMPLETE=1` enables the route at runtime. `default-features = false` on
# the dependency keeps sparq-text's engine/parallel stack out of this feature.
complete = ["server", "dep:sparq-text"]
# [OPUS-4.8] (sq-bzh1, epic sq-3183) `tpf` (default OFF) exposes a Triple Pattern Fragments /
# Linked Data Fragments (Hartig LDF) READ-ONLY source endpoint at `GET /tpf?subject=&predicate=&
# object=`: a paged RDF fragment of the triples matching one triple pattern, with Hydra controls
# (`hydra:totalItems` from the cheap cardinality ESTIMATE, `hydra:next`/`hydra:previous` paging,
# and the `hydra:search` URI-template control). It makes the server a low-cost federation SOURCE a
# TPF client (Comunica / the LDF client) can drive a join against. The handler reuses the existing
# axum stack + the graph serialisers (Turtle / N-Triples) and the public `Graph::pattern` /
# `store.estimate` / `store.scan` / `dict.term` API — no new dependency, and sparq-core/sparq-engine
# untouched. STILL OFF AT RUNTIME by default even when compiled in — the operator must additionally
# set `--tpf` / `SPARQ_TPF=1` (`ServerConfig::tpf`), mirroring `federation-descriptors`. Without the
# feature, zero cost: no route, byte-identical to before.
tpf = ["server"]
# [OPUS-4.8] (sq-dxhb, epic sq-3183) `brtpf` (default OFF, implies `tpf`) extends the TPF
# endpoint to bindings-restricted Triple Pattern Fragments (brTPF — Hartig & Buil-Aranda,
# ODBASE 2016): a client may attach a SET of solution mappings (a `values` parameter on the
# GET, or a POST body) so the server returns ONLY the page of pattern matches that are
# COMPATIBLE with at least one supplied binding — pushing a bind-join's semi-join down to the
# source so far less data crosses the wire than re-fetching the whole pattern per binding. The
# fragment advertises the restriction through an extra `hydra:mapping` for the `values`
# variable, and the `hydra:totalItems` count plus the paging window reflect the
# bindings-restricted result, NOT the unrestricted pattern. Pure (no new dependency) — the
# binding compatibility test runs over the same `Graph::pattern` / `store.scan` / `dict.term`
# API. Without the feature the brTPF parsing + the `values` parameter handling are
# `#[cfg]`-stripped, so a `tpf`-only build is byte-identical to before (a stray `values`
# parameter is just an ignored unknown parameter — plain TPF). STILL governed by the same
# `--tpf` runtime flag (brTPF is the same endpoint, extended).
brtpf = ["tpf"]
# [OPUS-4.8] (sq-r868, from-pss gh-162 follow-up (c)) `shacl` (default OFF) mounts the
# OPT-IN HTTP SHACL validation endpoint `POST /shacl/validate`: the client POSTs a SHACL
# shapes graph (RDF, by `Content-Type`) and the server validates its CURRENTLY-LOADED data
# graph against it, returning a validation report — a JSON projection of
# `sparq_shacl::ValidationReport` (the same `{ conforms, results: [{ focusNode, path, value,
# sourceShape, sourceConstraintComponent, severity, message }] }` shape the wasm `shacl`
# binding (gh-162 part (a)) and the PSS Pod-Manager consume) by default, or the W3C SHACL
# report-vocabulary Turtle on `Accept: text/turtle`. This is the server-side / large-graph
# path from gh-162: the store is already in memory (no per-request data parse), and the
# 100k-node case where the JS `rdf-validate-shacl` OOMs is handled natively. The feature
# pulls `sparq-shacl` (which transitively pulls sparq-engine for `sh:sparql`); sparq-shacl
# follows the opt-in isolation pattern, so a build WITHOUT this feature carries ZERO SHACL
# code — byte-identical to before, and sparq-core/the wasm bundle are untouched either way
# (sparq-wasm depends on sparq-core/-engine directly, never on sparq-server). STILL OFF AT
# RUNTIME by default even when compiled in — the operator must additionally set `--shacl` /
# `SPARQ_SHACL=1` (`ServerConfig::shacl`), mirroring `tpf` / `federation-descriptors`;
# validation is a READ over the store, so it is gated by the read auth like any GET.
shacl = ["server", "dep:sparq-shacl"]
# [OPUS-4.8] (sq-hj4n, gh-916) `n3-patch` (default OFF) adds the OPTIONAL Solid-style N3-Patch
# (`solid:InsertDeletePatch`, media type `text/n3`) dialect to the Graph-Store-Protocol `PATCH`
# method. With it on, a `PATCH` carrying a `text/n3` body is parsed into its `solid:deletes` /
# `solid:inserts` / `solid:where` formulas and translated into ONE atomic graph-scoped SPARQL
# Update submitted through the SAME sequenced group-commit writer the `application/sparql-update`
# PATCH path uses (so it inherits atomicity + the auth gate). The N3 parsing rides the `oxttl`
# `N3Parser` — `oxttl` is ALREADY a server dependency (the GSP read-side Turtle serialiser), so
# this pulls NO new dependency. The OTHER PATCH dialect (`application/sparql-update` body) is
# ALWAYS-ON and is NOT behind this feature. Without the `n3-patch` feature the N3-Patch parser +
# its dispatch arm are `#[cfg]`-stripped: a `text/n3` PATCH body is then a plain `415` and the
# crate is byte-identical to before — sparq-core / sparq-engine / the wasm bundle untouched
# either way (sparq-wasm depends on sparq-core/-engine directly, never on sparq-server). STILL OFF
# AT RUNTIME by default even when compiled in — the operator must additionally set `--n3-patch` /
# `SPARQ_N3_PATCH=1` (`ServerConfig::n3_patch`), mirroring `tpf` / `shacl` / `federation-descriptors`.
n3-patch = ["server"]
# [OPUS-4.8] (sq-o5bi) `backup` (default OFF) mounts the OPT-IN ONLINE consistent-snapshot
# backup/restore admin routes: `POST /admin/backup` streams a single self-describing artifact
# of the CURRENTLY-PINNED generation (triples + per-pod epoch vectors + writer seq) WHILE
# SERVING (no stop-the-world — the export reads an already-immutable `Arc<Generation>`, so
# readers never block the writer and the writer never blocks readers), and `POST /admin/restore`
# atomically installs a freshly-built ring+writer rehydrated from such an artifact (fail-closed on
# a corrupt/mismatched artifact). A `--restore <FILE>` / `SPARQ_RESTORE` startup setting runs the
# same restore on start (the bootstrap primitive for horizontal-scaling stage-2 + the base of
# PITR). The feature turns on sparq-serve's own `backup` feature (the artifact format +
# export/import live there); it adds no new dependency beyond that. DISTINCT from the offline
# `sparq-cli save` (stop-the-world, index rebuild) and from the `--persist` per-graph WAL.
# At-rest ENCRYPTION of the artifact is a SEPARATE concern, out of scope. Both routes are
# WRITE/admin-gated (the existing `--auth-token` admin gate). Without the feature the routes +
# the restore setting are `#[cfg]`-stripped, so a build without it is byte-identical to before.
# Needs `server`.
# [OPUS-4.8] (sq-0g6g) `dep:arc-swap` is brought in ONLY here — the swappable serving core
# (`ArcSwap<ServingCore>`) that enables the atomic online restore exists solely under `backup`.
# The default `server` build holds the ring/writer directly (byte-identical to pre-#941) and
# never depends on arc-swap, so the default serving read path stays lean.
backup = ["server", "dep:arc-swap", "sparq-serve/backup"]
# [OPUS-4.8] (sq-oy1f.1, epic sq-oy1f) `jsonld` (default OFF) wires JSON-LD 1.1
# (`application/ld+json`) into the server's RDF content negotiation, both directions:
#   * EMIT — a SPARQL CONSTRUCT/DESCRIBE or a Graph-Store-Protocol GET with
#     `Accept: application/ld+json` is served as JSON-LD (the engine's *flattened* form),
#     participating in the existing q-value-aware Accept negotiation; and
#   * ACCEPT — a GSP PUT/POST (or the SHACL shapes-body reader, which shares the same media-type
#     matrix) with `Content-Type: application/ld+json` is parsed into the store via the engine's
#     JSON-LD parser.
# It turns on `sparq-core/jsonld` (the `oxjsonld` parser that `Graph::load_str` dispatches the
# "jsonld" token to) and `sparq-engine/serialize-rdf` (the `write_jsonld` serialiser). Both are
# native-pure (no wasm impact — sparq-wasm depends on sparq-core/-engine directly, never on
# sparq-server). Without the feature the `GraphFormat::JsonLd` variant, its negotiation arm and
# its write-body arm are `#[cfg]`-stripped, so an `application/ld+json` request gets the same
# 406/415 it did before and the default build is byte-identical. Needs `server`.
jsonld = ["server", "sparq-core/jsonld", "sparq-engine/serialize-rdf"]
# [OPUS-4.8] (sq-vczh2, epic sq-2m6zm, design research/llm-ergonomic-sparql-surface.md §4)
# `terse` (default OFF) mounts the OPT-IN, VERIFIABLE LLM-ergonomic transpiler endpoint
# `POST /terse/transpile`: the client POSTs a *terse* query (the `K:<name>` keyword layer +
# identity pass-through) and the server returns the CANONICAL, conformant SPARQL it expands to
# PLUS the keyword expansions / warnings / legend version — so the NETWORK CONTRACT is the
# verifiable EXPANSION the agent can inspect, never an opaque answer (it does NOT execute the
# query — the agent runs the returned canonical SPARQL through the normal `/sparql` path). The
# server compiles the LEAN default `sparq-terse` build (no `vectors` feature): the keyword layer
# is fully on, a `V("phrase")` construct loud-FAILS with a 400 rather than guessing (concept
# resolution needs a graph-bound resolver + an embedder — a future `vectors`-gated extension; the
# V() ambiguity caveat is tracked by sq-26fdp). It pulls `sparq-terse` (light: it depends only on
# `spargebra`, already a server dep, in this lean build) and mounts the route. STILL OFF AT
# RUNTIME by default even when compiled in — the operator must additionally set `--terse` /
# `SPARQ_TERSE=1` (`ServerConfig::terse`), mirroring `tpf` / `shacl` / `federation-descriptors`.
# Without the feature, zero cost: no `sparq-terse` dependency, no route, byte-identical to before;
# sparq-core / sparq-engine / the wasm bundle untouched either way (sparq-wasm depends on
# sparq-core/-engine directly, never on sparq-server). Needs `server`.
terse = ["server", "dep:sparq-terse"]
# [OPUS-4.8] (sq-2999l, gh-906) `change-stream` (default OFF) mounts the OPT-IN HTTP CDC poll
# endpoint `GET /streams` in the Amazon-Neptune-Streams `GetRecords` shape over the MERGED durable
# change-stream (sq-b4fns / #1223, in sparq-serve). The endpoint reads the segmented, fsync'd
# append-only `ChangeLog` and returns the ordered change records (op / quads / seq / generation /
# timestamp) as JSON from a given offset, with a continuation token, driven by `iteratorType` /
# `at` / `after` / `limit` parameters. The same feature also turns on RECORDING:
# [GPT-5.6] (sq-kqofk) with a configured log directory, every published group-commit generation
# appends one ordered record on the writer thread (possibly covering several concurrent SPARQL
# Updates), so the endpoint serves a live, resumable feed without serialising submitters. It turns on
# `sparq-serve/change-stream` (the segmented log + N-Quads same-lineage quad-set diff + the backup
# family's self-contained FNV-1a digest — std-only IO, NO new external dependency, no extra HTTP/
# async beyond the already-present axum + serde_json). STILL OFF AT RUNTIME by default even when
# compiled in — the operator must additionally point the server at a log directory via
# `--change-stream <DIR>` / `SPARQ_CHANGE_STREAM` (`ServerConfig::change_stream_dir`); with no dir
# the route is `404` and nothing is recorded, mirroring `tpf` / `shacl` / `federation-descriptors`.
# Without the feature the route + the recording hook are `#[cfg]`-stripped, so a build without it is
# byte-identical to before; sparq-core / sparq-engine / the wasm bundle untouched either way
# (sparq-wasm depends on sparq-core/-engine directly, never on sparq-server). At-rest encryption +
# cryptographic authenticity of the records are out of scope (same boundary as the backup family).
# Needs `server`.
change-stream = ["server", "sparq-serve/change-stream"]
# [FABLE-5] (sq-snopa.6, issue #992 FR-4) `solid-authz` (default OFF) mounts the OPT-IN Solid
# WAC/ACP HTTP authorization surface — `POST /authz/decide`, `POST /authz/wac-allow`,
# `POST /authz/query` — a THIN HTTP shell over the `sparq-solid` library authoriser
# (`PodStore::decide` / `wac_allow` / `query_json_as`). This is the NEW, deliberately-opt-in
# `sparq-server` -> `sparq-solid` workspace dependency the FR-4 architecture note flagged: the
# default server build carries ZERO Solid/access-control code (the dep is `optional`, so it is
# only compiled with this feature). Per the design record (`research/sparq-solid-scope.md` §4),
# `sparq-solid` is a LIBRARY-level authoriser with NO HTTP surface — this feature is exactly that
# missing HTTP shell: authentication (Solid-OIDC/DPoP -> a `(WebID, client)` session) stays the
# caller's job; the endpoints take an already-resolved session + the pod dataset per request and
# map the library verdict onto HTTP.
# [SONNET-4.6] (sq-snopa.8) The feature ALSO carries the STATEFUL lane: a request may set
# `"source":"server"` to authorise over the server's OWN loaded store instead of a body dataset.
# The materialised `PodStore` is a pure function of one published ring generation, so it is
# cached BESIDE the ring in `AppState` keyed by the generation number rather than threaded
# through the writer — which makes "re-materialise on ACL change" automatic (every commit
# publishes a new generation, staleing the cache) and keeps the writer ignorant of the auth
# view. The lane REFUSES (never silently un-enforces) an ODRL-carrying server store or a
# `trust` block, both of which it cannot evaluate faithfully.
# FAIL-CLOSED is the soundness invariant — every error path
# (unparseable dataset, materialize failure, unknown mode/view) DENIES (`allow:false`), never
# opens. STILL OFF AT RUNTIME by default even when compiled in — the operator must additionally
# set `--solid-authz` / `SPARQ_SOLID_AUTHZ=1` (`ServerConfig::solid_authz`), mirroring `tpf` /
# `shacl` / `terse`; without the flag the routes are `404`. Without the feature the module + the
# routes + the config field are `#[cfg]`-stripped, so a build without it is byte-identical to
# before; sparq-core / sparq-engine / the wasm bundle are untouched either way (sparq-wasm
# depends on sparq-core/-engine directly, never on sparq-server). Needs `server`. NOTE: the
# `Link: rel="acl"` response-header wiring is a SEPARATE follow-up (sq-snopa.7) — this feature
# already surfaces `governing_acl` / `aclLink` in the decision BODY, so that wiring only needs to
# lift it into a header.
solid-authz = ["server", "dep:sparq-solid"]
# [FABLE-5] (sq-lsp7k.10) `templates` (default OFF): the OPT-IN named-parameterized-template
# REST surface (`/templates` — list / PUT-GET-DELETE one definition / POST-invoke with typed
# JSON arguments). A THIN shell over `sparq_engine::templates` (which builds on the #901
# injection-safe `params` algebra binding): definitions are validated fail-closed at
# registration, invocations bind typed JSON arguments (fail-closed on unknown/missing/
# mistyped parameters), a QUERY invocation runs read-gated on the current generation, and an
# UPDATE invocation is WRITE-gated and executed through the SAME sequenced-writer path as a
# /sparql update — the gated-update posture is never widened. Even compiled in, the surface
# is OFF at runtime until `--templates` / `SPARQ_TEMPLATES=1` (the tpf/shacl/terse
# double-opt-in), and the store is in-memory unless `--templates-file` names a persistence
# file. Pulls NO new external dependency (sparq-engine is already a dependency; the feature
# just lights its `templates` module).
templates = ["server", "sparq-engine/templates"]
# [SONNET-4.6] (sq-pfae.17) `solid-authz-trust` (default OFF): extends the OPT-IN
# `POST /authz/decide` endpoint (from `solid-authz`) to accept a stateless trust block —
# presented credential graphs + a trust policy + signed certification edges IN THE REQUEST
# (stateless: no server-side trust store needed; the request carries the full trust graph).
# The handler derives effective rules via the cert-graph closure (`sparq_trust::derive_effective_rules`,
# `sq-pfae.15/16`) then runs the UNCHANGED WAC/ACP admission and decision gates; the response
# carries a minimal admission justification (which rule/edge admitted the deciding fact).
# FAIL-CLOSED is the soundness invariant: ANY malformed/unverifiable/stale/revoked/over-depth/
# broadening trust input => 403 DENY with justification; feature OFF => byte-identical to `solid-authz`.
# The trust extension is DOUBLE-OPT-IN: it activates only when BOTH this feature is compiled AND
# the request carries a "trust" JSON block (no trust block => falls through to the existing path).
# HONEST SCOPE: this is a clear-path admission mechanism (anchored-not-proven); it is NOT a ZK/MPC
# or unlinkability claim. The ZK estate it touches is internally re-audited but has NO external
# accredited-cryptographer sign-off (sq-qhy4 pending); sparq-mpc is semi-honest only.
# Needs `solid-authz` + enables sparq-trust with the `cert-graph` feature for the closure.
# [SONNET-4.6] POSITIONAL format args used throughout (CodeQL rust/unused-variable guard).
solid-authz-trust = ["solid-authz", "dep:sparq-trust", "dep:sparq-zk"]
# [FABLE-5] (sq-lrtc3.1 + sq-3mu76, epic sq-lrtc3) `odrl-authz` (default OFF): the ODRL lane on
# the OPT-IN `POST /authz/query`, `/authz/decide` and `/authz/wac-allow` endpoints (from
# `solid-authz`). When the request dataset carries
# ODRL policy rules (`odrl:permission` / `odrl:prohibition` predicates), the handler parses
# them (`sparq_policy::parse_policy` over the UNION of the dataset's graphs) and runs the
# sparq-solid ODRL->AUTH_GRAPH bridge (`PodStore::materialize_odrl_policy` — both the Permit
# allow side AND the matched-Prohibition deny side, deny-overrides) for the request's
# (party = session agent, action = odrl:read, target = each rule's target graph) BEFORE the
# access-controlled query / advisory decision / WAC-Allow advertisement runs — so an ODRL
# policy demonstrably gates a SPARQL query end-to-end over HTTP at NAMED-GRAPH granularity,
# and the advisory surfaces never report an allow the query lane would refuse to honour
# (sq-3mu76; they are READ-scoped while the lane evidences only odrl:read — sq-lrtc3.2 owns
# the wider action contract). FAIL-CLOSED is the soundness invariant:
# a malformed policy, an unimplementable `odrl:conflict` strategy, a rule without a concrete
# target (pattern targets are sq-lrtc3.3), a non-read mode, or an anonymous session is a
# 4xx refusal — NEVER a silent allow; a constraint the stateless lane cannot evidence
# (purpose / count / an undischarged duty) simply never grants. STATELESS-lane scope only
# (the dataset arrives in the request body). [SONNET-4.6] sq-snopa.8 landed the stateful
# loaded-store lane (`"source":"server"`) but did NOT extend this lane to it: an ODRL-carrying
# server store is REFUSED there (400) rather than un-enforced. Stateless scope is also
# why the ONE-SHOT bridge entry point is used: the per-request store dies
# with the response, so frozen-at-materialization semantics and per-session re-checked
# conditions coincide. OFF by default — a build WITHOUT this feature carries ZERO ODRL code
# (sparq-policy is never compiled) and `solid-authz` behaviour is byte-identical.
odrl-authz = ["solid-authz", "sparq-solid/odrl-bridge", "dep:sparq-policy"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1" }
# [OPUS-4.8] (sq-o5bi, sq-0g6g) The swappable serving core (ring + writer) lives behind an
# `ArcSwap` so an online restore can atomically install a rehydrated core while readers load
# lock-free — the same arc-swap the ring uses internally. `backup`-feature ONLY: the default
# serving path holds ring/writer directly (byte-identical to pre-#941), so without `backup` the
# server never depends on arc-swap. The serialiser-only build and the wasm graph never see it.
arc-swap = { version = "1", optional = true }
sparq-engine = { path = "../sparq-engine", version = "0.1.1" }
# The concurrent-serving core (Wave A, research/concurrent-serving.md §6): the
# lock-free generation ring pins read snapshots; the single sequenced writer
# group-commits SPARQL Updates. Server-feature only — the serialiser-only build
# and the wasm graph never see it (`cargo tree -p sparq-wasm -e normal | grep -c
# serve` must stay 0).
sparq-serve = { path = "../sparq-serve", version = "0.1.1", optional = true }
# [OPUS-4.8] (sq-d3d8) Behind the opt-in `federation-descriptors` feature only: the VoID /
# Service-Description generator (`Introspection::to_void`). Light — it depends only on
# sparq-core + serde (no async, no heavy deps), and is already in the workspace tree
# (sparq-engine / sparq-nlq use it). OFF by default, so it adds nothing to the standard build.
sparq-introspect = { path = "../sparq-introspect", version = "0.1.1", optional = true }
# [GPT-5.6] sq-lsp7k.9.3: pure prefix-completion index for the default-OFF `complete` HTTP
# feature. Disable sparq-text's defaults so this edge does not pull its engine rewrite or rayon;
# sparq-server already owns the queried Graph and needs only CompletionIndex.
sparq-text = { path = "../sparq-text", version = "0.1.1", optional = true, default-features = false }
# Behind the opt-in `geo` feature only (geof_registry; its own default `engine`
# feature is this same sparq-engine, so the graph gains just the georust stack).
sparq-geo = { path = "../sparq-geo", version = "0.1.1", optional = true }
# [OPUS-4.8] (sq-r868) Behind the opt-in `shacl` feature only: SHACL Core + SHACL-SPARQL
# validation (`sparq_shacl::validate` → `ValidationReport`) for the `POST /shacl/validate`
# endpoint. It transitively pulls sparq-engine (already a dependency here) for `sh:sparql`;
# its OWN `oxrdf` is the same workspace 0.3 the server resolves, so terms flow through. OFF
# by default — a build without the `shacl` feature carries zero SHACL code.
sparq-shacl = { path = "../sparq-shacl", version = "0.1.1", optional = true }
# [OPUS-4.8] (sq-vczh2) Behind the opt-in `terse` feature only: the verifiable LLM-ergonomic
# transpiler (`sparq_terse::terse_to_sparql` → `Expansion { canonical_sparql, keywords, ... }`)
# for the `POST /terse/transpile` endpoint. Pulled WITHOUT its `vectors` feature, so this is the
# LEAN build: it depends only on `spargebra` (already a server dependency) — no model, no
# sparq-core/-engine/-nlq/-vectors. OFF by default — a build without the `terse` feature carries
# zero terse code.
sparq-terse = { path = "../sparq-terse", version = "0.1.1", optional = true }
# [FABLE-5] (sq-snopa.6, issue #992 FR-4) Behind the opt-in `solid-authz` feature only: the Solid
# WAC/ACP library authoriser (`sparq_solid::PodStore::decide` / `wac_allow` / `query_json_as` ->
# `WacDecision`) for the `POST /authz/*` endpoints. It transitively pulls sparq-engine (already a
# dependency here) + sparq-reason; its OWN `oxrdf` is the same workspace 0.3 the server resolves,
# so terms flow through. OFF by default — a build WITHOUT the `solid-authz` feature carries ZERO
# Solid/access-control code (the standard server build never sees sparq-solid or sparq-reason).
sparq-solid = { path = "../sparq-solid", version = "0.1.1", optional = true }
# [SONNET-4.6] (sq-pfae.17) Behind the opt-in `solid-authz-trust` feature only: the trust-graph
# authorisation admission gate (`sparq_trust::derive_effective_rules` + `sparq_trust::admit`),
# with the `cert-graph` feature for the certification-edge closure. OFF by default — a build
# WITHOUT the `solid-authz-trust` feature carries ZERO trust-graph code.
sparq-trust = { path = "../sparq-trust", version = "0.1.1", optional = true, features = ["cert-graph"] }
# [SONNET-4.6] (sq-pfae.17) Behind `solid-authz-trust` only: the ZK signature primitive used to
# parse verifying keys from hex (`sparq_zk::sig::public_key_from_hex`). The `sparq-trust`
# crate already pulls `sparq-zk` transitively, but `sparq-server` needs it directly so the
# handler code can import `public_key_from_hex` without an extra re-export layer.
sparq-zk = { path = "../sparq-zk", version = "0.1.1", optional = true }
# [FABLE-5] (sq-lrtc3.1) Behind the opt-in `odrl-authz` feature only: the typed ODRL 2.2
# model/parser/evaluator (`sparq_policy::parse_policy` / `Request` / `conflict_admissibility`)
# the `/authz/query` ODRL lane feeds into the sparq-solid bridge. `sparq-solid/odrl-bridge`
# already pulls it transitively, but the handler names `sparq_policy` types directly (the
# bridge entry points take `&sparq_policy::Policy`), so the server needs the direct edge.
# OFF by default — the standard build never compiles sparq-policy.
sparq-policy = { path = "../sparq-policy", version = "0.1.1", optional = true }
oxrdf.workspace = true
# [OPUS-4.8] sq-rt6v: prefix-compacting Turtle + RDF/XML graph serialisation, and RDF/XML
# request-body parsing, for the GSP read/write + CONSTRUCT/DESCRIBE surface. Both crates are
# the oxigraph RDF I/O pair that already sits in the workspace tree (oxttl is the workspace
# Turtle parser; oxrdfxml is used by sparq-conformance), pinned to the same `oxrdf` 0.3 the
# server resolves so `oxrdf::Triple`/`TripleRef` flow through without conversion. The graph
# serialiser module is pure (no async), so — like `results` — these are NOT feature-gated:
# they compile in the serialiser-only build too and are unit-testable. The wasm graph does
# not depend on sparq-server (crates/sparq-wasm depends on sparq-core/-engine directly), so
# this adds nothing to the bundle.
oxttl.workspace = true
# `rdf-12` matches the oxrdf `rdf-12` feature already on (quoted triple terms), so an
# RDF-1.2 graph round-trips through RDF/XML consistently with the other serialisers.
oxrdfxml = { version = "0.2", features = ["rdf-12"] }
# Re-parse to classify the SPARQL query form (SELECT/ASK/CONSTRUCT/DESCRIBE) before
# dispatching to the engine — the engine's public API only runs SELECT.
spargebra.workspace = true

# --- async HTTP stack (feature-gated; native only) ---
# `ws` powers the /subscriptions endpoint (T23, SEPA-style SPARQL subscriptions).
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "query", "json", "ws"] }
# [OPUS-4.8] (sq-2gqr) Slow-loris guard: `axum::serve` builds hyper's connection `Builder`
# internally and never installs a timer, so hyper's HTTP/1 `header_read_timeout` is inert and a
# slow client holds a connection (and concurrency slot) open forever. `sparq_server::serve` owns
# the accept loop on hyper's `http1::Builder` directly (with a `TokioTimer` + `header_read_timeout`).
# Both are already in axum 0.8's own dependency graph, so this adds NO new transitive code — it
# only names them as direct deps so we can call `Builder`. http1-only (matches axum's config).
hyper = { version = "1", optional = true, default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["server", "tokio", "service"] }
# [SONNET-4.6] (sq-7d3dj.26) `http_body::{Body, Frame}` — the streamed SELECT-JSON body is a
# hand-written `Body` so it can emit an HTTP TRAILER (`X-Sparq-Complete` / `X-Sparq-Truncated`)
# after its last data frame; `axum::body::Body::from_stream` cannot express a trailers frame.
# Already in axum's and hyper's dependency graph (http-body 1.x), so this adds NO new transitive
# code — it only names the direct edge so we can implement the trait.
http-body = { version = "1", optional = true }
# [GPT-5.6] sq-oprna.6: TLS wrapping for the opt-in HTTP/2 TCP listener. Crypto and PEM parsing
# are shared with http3 when both features are selected; TLS 1.2 stays absent because the server
# config intentionally admits TLS 1.3 only.
tokio-rustls = { version = "0.26", optional = true, default-features = false }
# `sync` adds the watch channel that carries the commit generation to subscription tasks (T23).
# [OPUS-4.8] sq-toze.36: `io-util` adds AsyncReadExt/AsyncWriteExt for the in-binary --health-probe
# (health_probe::run_probe): the distroless image has no curl/wget, so the server probes its own
# loopback /health over a raw TcpStream for the Dockerfile HEALTHCHECK (cert gap GX-13).
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
# `limit` + `load-shed` power the max-concurrency guard (T15); `util` for ServiceBuilder combinators.
tower = { version = "0.5", optional = true, features = ["limit", "load-shed", "util"] }
# `catch-panic` turns a handler panic into a 500 instead of a dead connection (T15).
# [OPUS-4.8] (sq-lodb) `timeout` adds `RequestBodyTimeoutLayer` / `TimeoutBody` — the slow-BODY
# guard (an idle deadline between consecutive request-body frame polls) that complements
# sq-2gqr's connection header-read deadline. Pure-Rust; already in tower-http's graph behind the
# feature, so no new transitive code.
tower-http = { version = "0.7", optional = true, features = ["trace", "catch-panic", "timeout"] }
# Emits the TraceLayer request log when the binary runs with --verbose.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "env-filter"] }
# [OPUS-4.8] (sq-cz89/sq-j9zs) Detailed error diagnostics (the offending query/RDF/path) are
# emitted to the SERVER-SIDE `tracing` log instead of the HTTP response body, so they surface
# only via the operator's opt-in `--verbose` / RUST_LOG subscriber — never leaking to callers.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# `stream::iter` feeds the streamed SELECT body (T16) — already in axum's dependency
# graph, so this adds no new transitive code.
futures-util = { version = "0.3", optional = true, default-features = false }
# Subscription protocol messages + result diffs (T23) — already in axum's dependency
# graph (its `json` feature), so this adds no new transitive code.
serde_json = { version = "1", optional = true }
# [OPUS-4.8] (sq-ebii) Bounded gzip inflate for `Content-Encoding: gzip` request bodies
# (the GSP write / RDF-load path) under the decompression-ratio cap (zip-bomb guard). Same
# `flate2 = "1"` the CLI / parse / hdt crates already use, so the workspace gains no new
# transitive code. Server-feature only (the decode lives on the async HTTP body path).
flate2 = { version = "1", optional = true }
# [GPT-5.6] sq-oprna.3: owned by the default-off `http3` feature. Quinn and the shared
# bridge use the same rustls 0.23 aws-lc-rs provider. [OPUS-5] sq-5ah3p: the operator's certificate
# chain and private key are decoded through `rustls::pki_types::pem::PemObject` — rustls' own
# re-export of `rustls-pki-types` — so no separate PEM crate is needed and the archived
# `rustls-pemfile` (RUSTSEC-2025-0134) leaves the graph. Still no TLS path on the TCP listener.
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"], optional = true }
sparq-http3 = { path = "../sparq-http3", version = "0.1.1", optional = true, features = ["server"] }

mimalloc = "0.1"

[dev-dependencies]
# [SONNET-4.6] (sq-pfae.17) Trust/ZK test helpers for the admission-path integration tests
# (tests/solid_authz_trust.rs): construct valid Schnorr-signed credentials, verify the
# happy-path GRANT and injection-gate DENY. These are dev-only — the production path is
# behind the `solid-authz-trust` feature, which already enables sparq-trust/sparq-zk as
# optional deps; the dev-dep is unconditional so the test binary can import the helpers
# regardless of which feature set the dev ran (tests are #[cfg(feature="solid-authz-trust")]).
sparq-trust = { path = "../sparq-trust", version = "0.1.1", features = ["cert-graph"] }
sparq-zk = { path = "../sparq-zk", version = "0.1.1" }
oxrdf = { workspace = true }
oxttl = { workspace = true }
# [OPUS-4.8] Reference SPARQL-results parser (oxigraph's) for the serializer oracle
# (tests/serializer_oracle.rs): re-parses OUR XML/TSV output and asserts the round-trip
# result set equals the source QueryResult. Pinned to 0.3 so its `oxrdf` (0.3.3) is the
# SAME version sparq-server resolves — Term/Variable compare directly, no conversion.
# (sparesults intentionally REFUSES to parse CSV — declares it "lossy" — so the CSV arm
# of the oracle uses a self-contained RFC 4180 validator instead; see the test file.)
# `sparql-12` turns on the reference parser's RDF 1.2 / quoted-triple-term (`<<( … )>>`)
# support so the oracle can round-trip an rdf-star object through XML and TSV. [OPUS-4.8]
sparesults = { version = "0.3", features = ["sparql-12"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }
# In-process HTTP client for integration tests (spin the server, assert protocol shape).
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-manual-roots"] }
# WebSocket client for the /subscriptions integration tests (T23) — pinned to the SAME
# version axum 0.8's `ws` feature resolves to (0.29) so the dependency tree gains nothing
# new (no duplicate tungstenite/tungstenite-http). [OPUS-4.8] (sq-1qkm) Bumped 0.24 -> 0.29
# to re-deduplicate after axum 0.8 moved to tungstenite 0.29; the 0.26 break moved
# `Message::Text` to `Utf8Bytes` and `Ping/Pong/Binary` to `Bytes` — handled in
# tests/subscriptions.rs.
tokio-tungstenite = "0.29"
# `StreamExt::next` / `SinkExt::send` on the test client's WebSocket stream.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# [OPUS-4.8] (sq-ebii) The decompression-ratio-cap test gzips a request body (a high-ratio
# "zip bomb" and a benign small body) to assert the 413 guard fires before / not on each.
flate2 = "1"
# [GPT-5.6] sq-oprna.3: feature-gated integration client for the real QUIC listener.
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
