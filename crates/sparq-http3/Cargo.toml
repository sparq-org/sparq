[package]
name = "sparq-http3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in HTTP/3-over-QUIC transport bridge for sparq axum servers"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["web-programming::http-server"]
readme = "README.md"
# [GPT-5.6] Published to satisfy sparq-server's optional crates.io dependency closure.

[lib]
crate-type = ["rlib"]

[features]
default = []
# The crate remains dependency-free in a default workspace build. Downstream HTTP servers
# explicitly enable this feature when they add their own default-off `http3` feature.
server = [
    "dep:axum",
    "dep:bytes",
    "dep:futures-util",
    "dep:h3",
    "dep:h3-quinn",
    "dep:http-body-util",
    "dep:quinn",
    "dep:rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http-body-util = { version = "0.1", optional = true }
# 0.11.11 raises quinn-proto above the RUSTSEC-2026-0185 vulnerable range.
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"], optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["set-header"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
