# sq-oy1f.23 (epic sq-oy1f) originated the document-level W3C JSON-LD 1.1
# pipeline (research/jsonld-1.1-design.md §3). Later beads implemented expansion,
# flattening, compaction, from-RDF conversion, and framing.
[package]
name = "sparq-jsonld"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native, dependency-free W3C JSON-LD 1.1 document pipeline for sparq (Json AST + error registry + processing options + deny-by-default document loader)"
readme = "README.md"
# Native document algorithms are implemented; only the high-level `api` facade
# remains a documented placeholder. Publication is required by
# sparq-engine-serialize's crates.io dependency closure; maturity stays explicit in the API docs.

# Render the README as the docs.rs front page (src/lib.rs `#![doc = include_str!(...)]`).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# sq-w42s3 — the W3C JSON-LD 1.1 self-conformance scoreboard runner
# (per-operation pass-rate row over the pinned fetched suites; see the example's
# module docs). `test = true` so its hermetic comparator / N-Quads-reader unit
# tests run under plain `cargo test -p sparq-jsonld` (no suite checkout needed —
# the suite-driven paths themselves stay offline-green by SKIPping).
[[example]]
name = "jsonld_conformance"
test = true

[features]
default = []
# HTML script extraction is opt-in; native JSON processing and lean wasm stay dependency-free.
html = ["dep:html5ever", "dep:quick-xml"]

[dependencies]
html5ever = { version = "0.40.1", optional = true }
quick-xml = { version = "0.41", default-features = false, optional = true }

[dev-dependencies]
# Issue #3714 — keep the dependency-free runtime resolver pinned to
# oxiri's RFC 3986 behaviour without adding a mandatory/shipping dependency.
oxiri = "0.2"
