[package]
name = "sparq-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SPARQL query engine over sparq-core: algebra-to-physical-plan compilation, cardinality-based join planning, and parallel execution"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] crate-local README so crates.io (package.readme) matches the docs.rs front
# page (lib.rs include_str!("../README.md")) — same content on both registries.
readme = "README.md"

# [OPUS-4.8] Render this crate's README as the docs.rs front page (see src/lib.rs
# `#![doc = include_str!("../README.md")]`) and build the docs with all features so
# the optional service/zk/cs-planner items appear. `--cfg docsrs` enables any
# doc-cfg feature gating in the rendered output.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Forwards sparq-core's parallel index build. Default on for native; the wasm
# crate disables defaults so rayon is never pulled into the bundle.
# `regex` powers SPARQL REGEX/REPLACE; default-on for native, off for wasm (the wasm crate
# disables defaults) so the regex automata don't bloat the browser bundle.
# `digest` powers the SPARQL hash builtins (MD5/SHA1/SHA256/SHA384/SHA512); default-on
# for native, off for wasm (the wasm crate disables defaults) so the hash cores never
# enter the browser bundle.
default = ["parallel", "regex", "digest"]
parallel = ["dep:rayon", "sparq-core/parallel"]
regex = ["dep:regex"]
digest = ["dep:md-5", "dep:sha1", "dep:sha2"]
# Characteristic-set star-join cardinality estimation (Neumann & Moerkotte):
# `cs::CsTable` + `with_cs_table` make the greedy planner consult an injected CS
# table for star joins instead of the per-predicate independence model. OPT-IN and
# OFF by default (the wasm bundle and the default native build carry zero CS code);
# results are identical either way — only join order is affected.
cs-planner = []
# [FABLE-5] (sq-dzbg2) Persistent, explicitly-built planner statistics.  The
# catalog is stored beside a saved/mmap graph and contains deterministic
# per-predicate cardinalities plus equi-depth subject/object value histograms.
# OFF by default: ordinary planning and the lean wasm build are unchanged.
persistent-stats = []
# [FABLE-5] sq-7d3dj.32.2.7: forwards sparq-core's `spqcprm2` (SPQCPRM2 frame-of-reference
# on-disk format). OFF by default so the default engine build is unchanged; enabling it lets
# the storage cross-version differentials (`v2_saved_store_is_query_equivalent_to_v1`,
# `cross_version_resave_round_trips_losslessly`) drive `save_compressed` in V2 emit mode
# through the real open/query path. Implies `sparq-core/spqcprm2` (which implies mmap).
spqcprm2 = ["sparq-core/spqcprm2"]
# [FABLE-5] (sq-jnb1e) Characteristic-set ANCHOR-INCIDENCE metadata for the DISTINCT
# predicate-projection semijoin (SP2Bench q09). The default-on anchor+probe block scan
# (sq-7d3dj.30.10) proves each candidate predicate P relates NO anchor member by clipping
# and galloping P's join-value block against the anchor set — for q09's value-typed
# predicates (dc:title, foaf:homepage, rdfs:seeAlso …) that is a large no-hit scan
# (~250k rows/query touched to answer 4 predicates). This feature precomputes, per anchor
# join position, the SET of predicates that DO relate an anchor member (one range-restricted
# scan over the anchor's id window), so a candidate P absent from that set is pruned by an
# O(1) membership test instead of the block scan. RESULT-IDENTICAL: the set is exact, so it
# only ever prunes a PROVABLY-EMPTY existence check; a P in the set still takes the exact
# scan. Conservatively DECLINES on a graph with a pending update overlay (the derived set is
# built against the base index only — incremental maintenance is out of scope). OPT-IN and
# OFF by default: the default native build and the wasm bundle carry zero incidence code and
# pull in ZERO new dependencies. [FABLE-5]
cs-anchor-incidence = []
# [FABLE-5] (sq-lk3aw.4) EXACT-candidate spatial pushdown: adds the
# `SpatialProvider::candidates_exact` certification seam (`SpatialExactQuery`) and
# teaches the spatial FILTER pushdown to (a) recognise the previously-unpushable
# `geof:sfContains(REGION, ?g)` constant-region-first operand order and (b) SKIP the
# residual `geof:` DE-9IM refinement when the provider CERTIFIES an exact answer set
# AND every surviving row's binding is certified (a not-indexed binding always keeps
# the residual FILTER — see `apply_spatial_pushdown_exact`'s soundness argument).
# Result-identical by construction (differential vs the post-hoc path); driven
# end-to-end by sparq-geo's opt-in `topology_index` feature. OPT-IN and OFF by
# default: off, zero exact-seam code compiles and the existing superset pushdown +
# residual-FILTER behaviour is unchanged; pulls in ZERO new dependencies.
spatial-exact-pushdown = []
# zk-trace seam (research/zkp-query-proofs-plan.md §4.E): records per-obligation
# witness input sets (matched triples per BGP pattern, executed join order,
# FILTER operand bindings) for the sparq-zk derived-credential prover. OPT-IN
# and OFF by default, exactly like sparq-reason's `explain`: when off, zero zk
# code compiles (default native + wasm builds are byte-identical); when on but
# no recorder is installed, the cost is one thread-local bool read per scan —
# never anything on a per-row path.
zk = []
# SPARQL 1.1 federated query (SERVICE): evaluate `SERVICE <iri> { pattern }` by
# sending the inner pattern as a SPARQL SELECT to the remote endpoint over HTTP and
# joining the parsed SPARQL-Results solutions back into the surrounding query. OPT-IN
# and OFF by default. [OPUS-4.8]
# [OPUS-4.8] (sq-6vshe.4) Seam A2 of the facade split (RFC research/engine-split-rfc.md §4
# Option A / §7 Phase A2): the `service` module (federation SERVICE client — HTTP transport,
# SPARQL-Results JSON/XML parse, bound-join batching, SSRF egress policy) moved to the internal
# `sparq-engine-service` sub-crate. This feature now FORWARDS to that crate's own `service`
# feature (which pulls serde / serde_json / quick-xml + the native-only ureq client, all
# `cfg(not(wasm32))`-safe: SERVICE makes no sense in the browser). `sparq-engine-service` is an
# OPTIONAL dependency, so the DEFAULT + wasm builds — with `service` OFF — never compile it or
# its HTTP/TLS stack: the lean bundles + the byte-identical feature-off dependency graph are
# unchanged, and every public path (`sparq_engine::with_service_egress_allow`, …) + this feature
# NAME are preserved for external users. The executor references the client as
# `sparq_engine_service::service::*` (src/exec.rs), keeping the one allowlisted per-SERVICE-call
# `Box<dyn Transport>` install point — never a per-row crossing (#1303 / RFC §D4).
service = ["dep:sparq-engine-service", "sparq-engine-service/service"]
# [OPUS-5] (sq-lsp7k.2.2) LOCAL rows-returning SERVICE handlers — the table-function seam.
# Adds the `service_local` module (`LocalServiceRegistry` + `with_local_services`) and
# teaches the executor to answer `SERVICE <iri> { … }` from an in-process handler when the
# IRI is registered, joining the returned named-variable rows into the surrounding query
# exactly as `VALUES` / a remote SERVICE relation is joined. The intercept happens BEFORE
# the HTTP transport, so a handled SERVICE performs NO network I/O — it can only ever
# REMOVE outbound reach, never add it: an unregistered IRI falls through to the unchanged
# `service` path where the default-deny SSRF egress filter still applies in full (this
# feature does not enable `service`; the two are independent and compose). OPT-IN and OFF
# by default: when off, zero of this code compiles, the SERVICE dispatch is byte-identical
# to before, and ZERO new dependencies enter the graph (oxrdf + spargebra are already
# direct deps; no `unsafe`).
service-local = []
# [OPUS-4.8] (sq-678h) RDF serializer matrix: Turtle / TriG / N-Quads writers
# (`serialize` module). The base build can already *parse* every format but only
# *write* N-Triples (`triples_to_ntriples`, always on). This feature adds the missing
# writers. OPT-IN and OFF by default so a consumer that only needs N-Triples pays
# nothing — the writers reuse the existing oxrdf term/IRI/literal infrastructure and
# pull in ZERO new dependencies (oxrdf is already a direct dep), so the default build's
# dependency graph is byte-for-byte unchanged when this is off.
# [OPUS-4.8] (sq-6vshe.4) Seam 1 of the facade split (RFC research/engine-split-rfc.md §4
# Option A / §7 Phase A1): the `serialize` module moved to the internal `sparq-engine-serialize`
# sub-crate, re-exported here verbatim as `sparq_engine::serialize`. This feature now FORWARDS
# to that crate's own `serialize-rdf` (which pulls the zero-dependency `sparq-jsonld` crate for
# the JSON-LD writer's `Json` AST). `sparq-engine-serialize` is an OPTIONAL dependency, so the
# DEFAULT + wasm builds — with `serialize-rdf` OFF — never compile it or `sparq-jsonld`: the lean
# bundles + the byte-identical feature-off dependency graph are unchanged, and every public path
# (`sparq_engine::serialize::*`) + this feature NAME are preserved for external users.
serialize-rdf = ["dep:sparq-engine-serialize", "sparq-engine-serialize/serialize-rdf"]
# [OPUS-4.8] (sq-townn, survey §A7) Streaming Turtle / TriG serialisation. The buffered
# `write_turtle` / `write_trig` build a FULL in-memory `String` for the whole graph, so a
# CONSTRUCT/DESCRIBE over a large graph holds BOTH the materialised triples AND the fully
# rendered string at once. This adds `write_turtle_streaming` / `write_trig_streaming` (and
# the `graph_to_*_streaming` wrappers) that render the body directly into a `W: std::io::Write`,
# buffering only ONE subject block at a time (emitting on subject change) — enabling HTTP
# chunked CONSTRUCT/DESCRIBE responses without materialising the whole rendered output. The
# streamed bytes are BYTE-IDENTICAL to the buffered `write_turtle`/`write_trig` for the same
# graph (same used-prefix header, same subject grouping, same ordering). IMPLIES `serialize-rdf`
# (the whole writer matrix, incl. the shared rendering helpers it reuses, lives there). OPT-IN
# and OFF by default: when off, zero streaming code compiles and the existing buffered path is
# byte-identical to before. Pulls in ZERO new dependencies (std `io::Write` only) and contains
# no `unsafe`. [OPUS-4.8] (sq-6vshe.4) now also FORWARDS to the moved sub-crate's own
# `streaming-serialization` (see the `serialize-rdf` note above).
streaming-serialization = ["serialize-rdf", "sparq-engine-serialize/streaming-serialization"]
# [OPUS-4.8] (sq-5qz9) SPARQL window functions + custom aggregate registry.
# Two extension surfaces, OFF by default:
#   * a `CustomAggregateRegistry` whose named (IRI) user aggregates are callable in
#     real SPARQL `GROUP BY` (the vendored spargebra already parses a declared custom
#     aggregate IRI — `SparqlParser::with_custom_aggregate_function`); the engine
#     evaluates `AggregateFunction::Custom` against the installed registry.
#   * a programmatic window-function pass (`window` module) — ROW_NUMBER / RANK /
#     DENSE_RANK, the offset/positional LAG / LEAD / NTILE (sq-hqhc), + a windowed
#     aggregate over a result table, with PARTITION BY + ORDER BY window specs (and a
#     reusable named WINDOW clause on the inline OVER syntax). These are a
#     NON-STANDARD extension (no W3C-REC SPARQL
#     window syntax exists); the surface follows the SQL:2003 OVER (PARTITION BY …
#     ORDER BY …) window-spec model that Stardog/AnzoGraph expose.
# When off, ZERO window/custom-aggregate code compiles and the default build is
# byte-identical (no new dependencies — oxrdf is already a direct dep).
window-functions = []
# [OPUS-4.8] (sq-hvfe) Vectorized (columnar / vector-at-a-time) execution primitives —
# the first building block of the M4 plan (research/optimization-techniques.md). The
# `chunk` module's `DataChunk` columnar intermediate + a numeric FILTER comparison
# kernel + a selection/gather kernel, the vector-at-a-time analogue of the
# row-materialising evaluator's per-row FILTER. OPT-IN and OFF by default: when off,
# zero columnar code compiles and the default native + wasm builds are byte-identical.
# Pulls in ZERO new dependencies (sparq-core is already a direct dep) and contains no
# `unsafe` — the kernels are plain index loops the compiler auto-vectorises.
vectorized = []
# [OPUS-4.8] (sq-iywur) Opt-in DP join-order enumerator (`dp` module): a connected-
# subgraph-complement-pair (DPccp; Moerkotte & Neumann, VLDB 2006) dynamic program that
# finds a Cout-optimal BUSHY join tree for a BGP, with a greedy-GOO fallback ABOVE a
# connected-subgraph-count budget (and on disconnected BGPs) to bound planning blow-up.
# `with_dp_planner` / `with_dp_planner_budget` install it per-thread, exactly like
# `with_cs_table`. The default planner stays greedy GOO. ORDER-ONLY: a BGP is a
# commutative/associative natural join, so every tree yields the SAME bindings — the DP
# only changes join order, never the answer (asserted by tests/dp_planner_differential.rs
# in BOTH feature states). OPT-IN and OFF by default: when off, zero DP code compiles and
# the default native + wasm builds are byte-identical. Pulls in ZERO new dependencies
# (rustc-hash is already a direct dep) and contains no `unsafe`.
dp-planner = []
# [FABLE-5] (sq-7d3dj.30.14) Membership-cluster PRE-MATERIALISATION for the greedy BGP
# planner (SP2Bench q07, research/sp2bench-complex-shape-deficit.md §5). When a BGP has the
# q07 shape — one UNBOUND-predicate container-membership pattern (`?bag ?member ?doc`, the
# `rdf:_n` bag idiom) plus a small BOUND-predicate anchor (`?doc2 dcterms:references ?bag`)
# sharing exactly ONE variable with it — `cluster::detect` returns a partition and the
# executor evaluates that {anchor, membership} pair STANDALONE (bounding the shared variable
# from the small anchor → a few-thousand-row relation) and NATURAL-JOINS it to the rest,
# instead of letting greedy GOO bind-join the ~250k-row unbound-predicate relation per driver
# binding through the widest permutation. A BGP is a commutative/associative natural join, so
# partitioning into two connected sub-BGPs and joining yields the SAME row bag as any greedy
# order — this is a pure JOIN-ORDER choice, RESULT-IDENTICAL to the feature-off plan
# (differentially tested in BOTH feature states, tests/cluster_materialize_differential.rs; the
# thresholds never affect results). `detect` DECLINES (unchanged greedy plan) on any
# non-matching shape: not exactly one membership pattern, an anchor variable that leaks into
# the rest, a pushed-down scan filter on a cluster pattern, or the cost gate unmet. OPT-IN and
# OFF by default: when off, zero of this code compiles and the default native + wasm builds are
# byte-identical. Pulls in ZERO new dependencies and contains no `unsafe`. The end-to-end q07
# win is a measured HYPOTHESIS for the canonical perf host (sq-7d3dj.30.6), NOT a baked-in number.
cluster-materialize = []
# [OPUS-4.8] (sq-7d3dj.30.20) Anti-join STATIC decline: eliminate a redundant re-evaluation
# of the mandatory LEFT side when the correlated (theta) anti-join recogniser (`try_theta_antijoin`)
# must fall back to the cold `Filter{LeftJoin}` plan. Profiling SP2Bench q07 showed its dominant
# outer 5-pattern BGP evaluated TWICE: q07 rewrites to `Filter(!bound ?doc3, LeftJoin(A, B,
# Some(!bound ?doc4)))`; the recogniser passes its shape gate, eagerly evaluates `A` (the ~30ms
# outer BGP), partitions the OPTIONAL condition, finds NO seedable var-to-var correlation (a bare
# `!bound` negation), and DECLINES — discarding the computed `A`, so the cold fallback recomputes
# it. This feature adds a PURELY STATIC pre-check (`in_scope_vars(left)` + `certain_vars(right)`,
# no graph access) that decides "no seedable correlation" BEFORE the left side is evaluated, so the
# recogniser declines EARLY and the single cold evaluation is the only one. It is a pure evaluation-
# ORDERING change: when a correlation DOES exist the path is byte-identical, and every decline
# produces the identical cold-plan result — so it is BAG-RESULT-EQUIVALENT to the feature-off build
# (differentially tested in BOTH states, tests/antijoin_static_decline_differential.rs; the W3C
# ratchet runs with it ON). OPT-IN and OFF by default: when off, zero of this code compiles and the
# default native + wasm builds are byte-identical. Pulls in ZERO new dependencies and contains no
# `unsafe`. The end-to-end q07 win is a measured HYPOTHESIS for the canonical perf host, NOT baked in.
antijoin-static-decline = []
# [OPUS-4.8] (sq-a9cn) Materialised-view / query-result cache: a bounded, version-aware
# LRU (`cache::ResultCache`) that stores a SELECT/ASK `QueryResult` keyed by `(parsed
# query algebra, caller graph-version)`. Vendor-parity operational-perf feature for
# endpoints that re-serve the same read query against a slowly-changing graph. OPT-IN and
# OFF by default: when off, zero cache code compiles and the default native + wasm builds
# are byte-identical. Pulls in ZERO new dependencies (std `HashMap`/`Mutex`/`Arc` only)
# and contains no `unsafe`. Caching is SOUND only under the documented contract — the
# caller bumps the version on every mutation, and non-deterministic queries (NOW/RAND/
# UUID/SERVICE/custom fns, detected by `cache::is_cacheable`) are never stored.
result-cache = []
# [OPUS-4.8] (sq-it1x) MVCC / ACID multi-statement transaction isolation. A
# `txn::TransactionManager` providing SNAPSHOT-ISOLATION read transactions (a cheap
# `GraphSnapshot` of the current committed generation) and serialized write transactions
# with FIRST-COMMITTER-WINS write-write conflict detection (optimistic concurrency
# control), all built on the existing copy-on-write delta-overlay substrate
# (`Graph::fork`/`snapshot`/`apply_delta`). Per the design record
# (research/concurrent-serving-litreview-A-mvcc-benchmarks.md §A.1), a single-writer
# store with snapshot reads is trivially serializable (SI = serializability); the OCC
# conflict check additionally serializes concurrent writers safely. OPT-IN and OFF by
# default — when off, zero txn code compiles and the default native + wasm builds are
# byte-identical. Pulls in ZERO new dependencies (std `Mutex`/`Arc` + the crate's own
# `update_in_place_capturing` write-set capture; oxrdf/rustc-hash are already direct deps)
# and contains no `unsafe`.
txn = []
# [OPUS-4.8] (sq-xj29q) Oxigraph-shaped per-solution result accessor: a borrowed,
# zero-copy `QuerySolution` view over each `QueryResult` row, reachable through
# `QueryResult::solutions()`. It mirrors Oxigraph's `QuerySolution` API
# (`get` by name / `VariableRef` / position, `iter` over bound `(Variable, Term)`
# pairs, panicking `Index`) so a Rust consumer migrating from / interoperating with
# Oxigraph (#1124 oxrdf alignment, #1128 migration guide) can index a result
# per-solution instead of walking the columnar `{vars, rows}` table by hand. It is a
# pure VIEW: no second materialisation of the table, no per-row map, no cloned terms —
# the columnar layout the engine uses for perf is unchanged. OPT-IN and OFF by default:
# when off, zero of this code compiles and the default native + wasm builds are
# byte-identical. Pulls in ZERO new dependencies (oxrdf — `Term`/`Variable`/
# `VariableRef` — is already a direct dep) and contains no `unsafe`.
query-solution = []
# [OPUS-4.8] (sq-rp3um) Parameterized prepared queries — safe value binding to
# prevent SPARQL injection (#901). Adds `PreparedQuery::bind` and `PreparedUpdate`
# (the `params` module): a free placeholder `Variable` is substituted by a typed
# `oxrdf::Term` via a pure ALGEBRA REWRITE over the parsed AST (`Variable` ->
# `NamedNode`/`Literal`/`BlankNode`/triple-term) — never string concatenation — so a
# hostile bound value (e.g. an IRI/literal containing `> } INSERT ... {` or a `"`
# break-out) is carried as opaque DATA and cannot alter the query structure. Covers
# SELECT/ASK/CONSTRUCT/DESCRIBE + UPDATE. OPT-IN and OFF by default: when off, zero of
# this code compiles and the default native + wasm builds are byte-identical. Pulls in
# ZERO new dependencies (oxrdf + spargebra are already direct deps) and contains no
# `unsafe`.
params = []
# [FABLE-5] (sq-lsp7k.10) Named parameterized SPARQL templates — the shared
# definition + typed-JSON-binding layer under the server's REST template store and the
# MCP `template_invoke` tool (GraphDB "SPARQL templates" / Stardog "stored queries"
# parity). Builds ON `params` (#901): a template is parsed once, its declared parameters
# are validated as free bindable placeholders at registration, and an invocation binds
# typed JSON arguments through the injection-safe algebra rewrite — fail-closed on
# unknown/missing/mistyped parameters. OPT-IN and OFF by default: when off, zero of this
# code compiles and the default native + wasm builds are byte-identical. The only
# dependency delta is the workspace-ubiquitous `serde_json` (already this crate's
# dev-dependency), pulled in behind the feature.
templates = ["params", "dep:serde_json"]
# [OPUS-4.8] (sq-u4lgr, #902) Structured EXPLAIN: a typed `PlanNode` plan tree
# (`explain_json` module) with a hand-written JSON projection, per-operator q-error
# = max(est/actual, actual/est) attached from the existing ANALYZE trace, and a
# bounded `SlowQueryRing` of the worst-by-wall-time recent analyzed plans. The
# human-readable text EXPLAIN (`explain`/`explain_analyze`) stays the default. OPT-IN
# and OFF by default: when off, the `explain_json` module, the trace node's `est`
# field, and the planner-replay estimate helper (`exec::bgp_estimate`) all compile
# EMPTY, so the default native + wasm builds are byte-identical. Pulls in ZERO new
# dependencies — the JSON is hand-rolled like the existing `json`/`serialize` writers
# (serde_json is a DEV-dependency only, used to verify the round trip) — and contains
# no `unsafe`.
explain-json = []
# [OPUS-4.8] (sq-gr8mb, survey §A3) Exact-bitmap semi-join reducer on dense u32 ids
# (CIDR'26 "Not Yannakakis"; research/optimization-techniques.md §1.1/§2(a)). After the
# binary-join executor materialises a join's left side, it builds a membership filter
# (`semijoin::KeyFilter`) over the connecting variable's DISTINCT ids — a flat bitmap
# when the keys are dense (the common case, since the dictionary assigns dense u32 ids)
# and an exact hash set when they are sparse+huge — and passes it to the next pattern's
# scan, which DROPS a row whose join key is absent before it enters the join. The filter
# is membership-EXACT (no false positives), so it removes ONLY rows that would fail the
# downstream join: the RESULT is identical to the feature-off path, just fewer rows
# scanned. OPT-IN and OFF by default: when off, the `semijoin` module and its single call
# site compile EMPTY, so the default native + wasm builds are byte-identical. Pulls in
# ZERO new dependencies (sparq-core + rustc-hash are already direct deps) and contains no
# `unsafe`. The payoff (intermediate-row-count and end-to-end-latency reduction on
# star/snowflake workloads) is a measurable HYPOTHESIS to confirm on the canonical perf
# host (sq-0g6g), NOT a baked-in number.
semijoin-bitmap = []
# [OPUS-4.8] (sq-5zf8i, survey §A4) Yannakakis bottom-up FULL-semijoin PREPASS for acyclic
# BGPs (research/codebase-improvement-opportunities-2026-06-23.md §A4 +
# research/optimization-techniques.md §1.1/§2(a2)). BEFORE the main binary join, the
# executor reduces every relation against its neighbours in the acyclic join tree — a
# bottom-up (leaf->root) then top-down (root->leaf) semijoin sweep — so no "dangling" tuple
# (one that joins with nothing downstream) is ever materialised by the join. This attacks
# the materialising evaluator's #1 cost (intermediate-result blow-up). It REUSES the A3
# membership machinery (`semijoin::KeyFilter` — exact bitmap on dense ids / hash set on
# sparse+huge keys), hence IMPLIES `semijoin-bitmap`; it routes via the same GYO acyclicity
# test (`bgp_is_cyclic` / `bgp_uses_binary`) the executor already has — acyclic => semijoin-
# reduce then join; cyclic => existing LFTJ, unchanged. A semijoin is a pure FILTER (removes
# only rows the final join would itself drop), so the RESULT is IDENTICAL to the feature-off
# binary plan; the prepass is cost-gated so it is skipped when the intermediates are already
# tiny (pure-overhead guard). OPT-IN and OFF by default: when off, zero prepass code compiles
# and the default native + wasm builds are byte-identical. Pulls in ZERO new dependencies and
# contains no `unsafe`. The payoff (intermediate-row-count + end-to-end reduction on chain/
# snowflake workloads) is a measurable HYPOTHESIS for the canonical perf host (sq-0g6g), NOT a
# baked-in number.
yannakakis = ["semijoin-bitmap"]
# [OPUS-4.8] (sq-7d3dj.30.1) Pre-execution SPARQL ALGEBRA REWRITE pass (`rewrite` module):
# a result-equivalent transform applied to the parsed `spargebra` algebra by
# `PreparedQuery::parse` (and the EXPLAIN parse sites) BEFORE evaluation. Two rewrites:
#   (a) EQUALITY SUBSTITUTION — `FILTER(?v = <iri>)` (or `<iri> = ?v` / `sameTerm`) folds the
#       IRI constant into the group's triple patterns (`?v` re-bound via Extend when it stays
#       in scope), turning a post-join FILTER over all enumerated rows into an indexed
#       constant-seeded scan (SP2Bench q03b/q03c). RESTRICTED TO IRI (NamedNode) CONSTANTS:
#       `=` on IRIs is term-identity so the substitution is EXACT; literal `=` is value
#       equality (`"1"^^xsd:int = "01"^^xsd:integer`, and the open sq-lr2ii high-precision
#       xsd:decimal class) and is NEVER rewritten — this restriction is the stated sq-lr2ii
#       avoidance contract (research/sp2bench-complex-shape-deficit.md §4).
#   (b) ANTI-JOIN — `FILTER(!bound(?v), LeftJoin(A, B))` where `?v` is certain in `B`, absent
#       from `A`, and `A`/`B` share a certain variable, becomes `Minus(A, B)` (SP2Bench q07).
# Every rewrite is BAG-result-equivalent (validated by the W3C conformance suite run with the
# feature ON + tests/rewrite_pass.rs); a shape that does not exactly meet the conditions is
# left VERBATIM (conservative — unrewritten == current behaviour). OPT-IN and OFF by default:
# when off, zero rewrite code compiles, `PreparedQuery::parse` takes the algebra verbatim, and
# the default native + wasm builds are byte-identical. Pulls in ZERO new dependencies (oxrdf +
# spargebra are already direct deps) and contains no `unsafe`.
algebra-rewrite = []

# [FABLE-5] (sq-7d3dj.30.7) EQUALITY-FILTER → VALUE-JOIN unification (`exec::eqjoin`):
# a conjunctive group whose triple patterns form variable-DISJOINT connected components glued
# only by `FILTER(?a = ?b)` (SP2Bench q05a/q12a's star-intersection shape) evaluates each
# component separately and joins them with a hash join keyed on the equality, instead of
# materialising the cross product and evaluating `=` per row. SPARQL `=` is VALUE equality
# (numeric promotion across datatypes, type errors eliminate, high-precision xsd:decimal must
# not collapse through f64 — sq-lr2ii), so the key is NOT the dictionary id in general: the
# per-term-class keys mirror the evaluator's own dispatch (id for IRI/bnode/unknown classes,
# the `numeric_value` cache's f64 for numerics, value for strings/lang-tagged/booleans),
# value-comparable temporals and triple terms pair through the EXACT evaluator, and the
# original FILTER is re-applied verbatim over the joined rows as the exact recheck (key
# collisions eliminated by the same sq-lr2ii machinery that runs today). Anything not
# provably eligible — non-total filter expressions (function calls), quoted-triple patterns,
# an armed budget or zk trace, no cross-component equality conjunct — DECLINES to the
# verbatim path. OPT-IN and OFF by default: when off, zero of this code compiles and the
# conjunctive path is byte-identical. No new dependencies, no `unsafe`.
value-join = []
# [GPT-5.6] (sq-lsp7k.3.1) Programmatic full-path enumeration over one predicate.
# OFF by default and dependency-free; surface parsing is handled by a later bead.
paths = []

# [FABLE-5] (sq-7d3dj.30.11) ID-LEVEL TERM-IDENTITY FAST PATH for `=` / `!=` in the COMPILED
# FILTER evaluator (`exec::equal_compiled`). Two id-level short-circuits that skip the per-row
# term MATERIALIZATION #1718's `eval_compiled` left in place, without changing any result:
#   (a) STATIC non-literal operands — a variable that a `nonliteral_filter_cols` analysis proves
#       is bound ONLY in subject/predicate positions (never object / BIND / VALUES / SERVICE) can
#       never be a literal, and neither can a constant IRI operand; for two such operands SPARQL
#       `=` is exactly dictionary-id equality and `!=` id inequality (the canonicalising dict gives
#       each IRI/bnode one id, and `values_equal` already decides IRI/bnode pairs by identity).
#   (b) EQUAL ids of ANY kind — equal ids are the SAME term (canonicalising dict), so `=` is `true`
#       and `!=` `false`, exactly mirroring the `p == q` sameTerm short-circuit `values_equal` takes
#       today (safe even for ill-typed literals: sameTerm returns a boolean, never a type error).
# CAUTION mirrored in code: UNEQUAL ids of possible LITERALS do NOT imply value-inequality (numeric
# promotion `"1"^^integer` vs `"1.0"^^decimal`, whitespace-padded lexicals — the sq-lr2ii class) and
# `=` on two ill-typed literals can be a TYPE ERROR, not `false`; both DECLINE to the existing exact
# path unchanged. OPT-IN and OFF by default: when off, zero of this code compiles and the FILTER path
# is byte-identical. No new dependencies, no `unsafe`.
id-filter-fastpath = []

# [FABLE-5] (sq-7d3dj.30.21) LAZY STRING-LITERAL COLLATION KEY for the top-k ORDER BY
# selection path (`exec::order_bindings`). Profiling SP2Bench q11
# (`ORDER BY ?ee LIMIT 10 OFFSET 50` over 17663 `rdfs:seeAlso` objects — which are
# `xsd:string` LITERALS, not IRIs) attributes ~1/3 of the query to building the sort key: the
# default path calls `Dict::term`->`reconstruct_ref` (a `Literal` allocation) THEN `value_str`
# (a second `Box<str>` allocation of the collation key) for EVERY input row, when only 60
# survive. With this feature ON, a PLAIN `xsd:string` literal ORDER BY key becomes a
# zero-allocation `SortCell::StrId(Id)` carrying only the dictionary id; the heap comparator
# reads the literal's `value` slice via ZERO-COPY `Dict::term_parts` and byte-compares. Plain
# strings are ordered by their `value()` lexical bytes both in `compare_terms` and in the
# eager `SortCell::Val` key (proven byte-identical by the sq-7d3dj.30.12 differential test),
# so the top-k output is UNCHANGED — a q11 full-output witness + tie/LIMIT-boundary cases +
# the W3C ORDER BY conformance suite pin it. Only `xsd:string` literals take the lazy path;
# every other term kind (IRI, lang-tagged, numeric, temporal, blank, triple) keeps the exact
# existing key, so the total order is untouched. Trades N key allocations for ~O(N)
# cache-friendly dict reads in the quickselect. OPT-IN and OFF by default: when off, zero of
# this code compiles and the ORDER BY path is byte-identical. No new dependencies, no `unsafe`.
topk-lazy-strkey = []

# [OPUS-4.8] (sq-pntvh.1) M4 Phase 1 native FILTER/aggregate micro-bench over a synthetic
# numeric column — the perf baseline every later vectorized (M4) phase measures against.
# `required-features` gates it behind `vectorized`, so the DEFAULT build (and
# `cargo clippy --all-targets` with the feature off) never compiles it: byte-identical
# feature-OFF bundle preserved. Emits `metric_us` lines (the repo's bench idiom); registered
# in bench/benchmarks.toml as `vectorized-eval-micro` (featured = false).
[[example]]
name = "bench_vectorized"
required-features = ["vectorized"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
# [OPUS-4.8] sq-ev41x + sq-hknqs + sq-vezew (epic sq-qonbz): the shared id-level evaluation
# substrate — the numeric value tower (`Num` / `Dec` / `as_numeric` + XSD lexical helpers,
# Phase 2), the four id-tuple join kernels (merge / hash / bind / leapfrog-trie behind the
# `JoinKeys` descriptor, Phase 3) AND the SPARQL term total order (`compare::compare_terms` —
# the engine's `compare_values`, over a generic `CompareTerm` trait, Phase 4) — moved out of
# `exec.rs` into the `sparq-substrate` leaf crate so the engine AND the reasoners can share one
# definition with NO `Box<dyn>` on the hot path (research/shared-eval-substrate.md, Option C).
# The engine uses all three unconditionally (FILTER / BIND / ORDER BY arithmetic + comparison;
# every BGP/Join), so `numeric` + `join` (which also enables `rows`) + `compare` are enabled
# here, not optionally — `oxrdf` and `rustc-hash` (which `numeric`/`join` pull) are already in
# the engine's dep tree and `compare` is pure-`std`, so this pulls no new crate and the lean
# wasm bundle delta is only the moved code itself.
sparq-substrate = { path = "../sparq-substrate", version = "0.1.1", default-features = false, features = ["numeric", "join", "compare"] }
oxrdf.workspace = true
spargebra.workspace = true
# Relative-IRI resolution for IRI()/URI() against the query's BASE (already in the
# dependency tree via spargebra/oxrdf).
oxiri = "0.2"
rustc-hash.workspace = true
smallvec.workspace = true
rayon = { workspace = true, optional = true }
# [FABLE-5] (sq-lsp7k.10) The `templates` module's JSON wire + typed-argument format.
# OPTIONAL — pulled in ONLY by the `templates` feature (default off), so the default +
# wasm builds never compile it into the library (it is already this crate's
# dev-dependency and ubiquitous across the workspace tree — no supply-chain delta).
serde_json = { version = "1", optional = true }
# [OPUS-4.8] (sq-6vshe.4) Seam 1 of the facade split: the RDF `serialize` module (Turtle /
# TriG / N-Quads / JSON-LD writers) moved to this internal sub-crate, re-exported verbatim as
# `sparq_engine::serialize` (see src/lib.rs). OPTIONAL + pulled in ONLY by `serialize-rdf`
# (which forwards to its own `serialize-rdf`/`streaming-serialization`), so the default + wasm
# builds never compile it or its transitive `sparq-jsonld` dependency — the byte-identical
# feature-off contract is preserved. `default-features = false`: an empty (feature-off) build.
sparq-engine-serialize = { path = "../sparq-engine-serialize", version = "0.1.1", optional = true, default-features = false }
# [OPUS-4.8] (sq-6vshe.4) Seam A2 of the facade split: the SPARQL 1.1 federated-SERVICE client
# (`service` module — HTTP transport, SPARQL-Results JSON/XML parse, bound-join batching, SSRF
# egress policy) moved to this internal sub-crate, re-exported through the facade (src/lib.rs + the
# `service` feature above). OPTIONAL + pulled in ONLY by `service` (which forwards to its own
# `service` feature), so the default + wasm builds never compile it or its ureq/serde/serde_json/
# quick-xml stack — the byte-identical feature-off contract is preserved. `default-features = false`.
sparq-engine-service = { path = "../sparq-engine-service", version = "0.1.1", optional = true, default-features = false }
regex = { version = "1", optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }

# UUID()/STRUUID() need an OS RNG; depending on uuid from the wasm build would drag
# getrandom into the browser dependency graph, so the functions are native-only.
# [OPUS-4.8] (sq-6vshe.4) The SERVICE feature's blocking HTTP client (ureq) moved with
# the `service` module to the `sparq-engine-service` sub-crate (seam A2), where it keeps
# the same `cfg(not(wasm32))` gating so no HTTP/TLS stack ever enters the browser bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The dict-consolidation differential test compares the serial, sharded-parallel and
# external (out-of-core) build paths — the tests need sparq-core's mmap feature even
# though the library itself doesn't. `dict-spill` adds the spilled-dictionary build's
# byte-identity differential (tests/dict_spill_differential.rs).
sparq-core = { path = "../sparq-core", version = "0.1.1", features = ["mmap", "parallel", "dict-spill"] }
rayon.workspace = true
# [OPUS-4.8] (sq-7d3dj.30.1) DEV-only re-listing of the ALREADY-present `spargebra` dep so
# tests/rewrite_pass.rs can parse a query to RAW `spargebra` algebra (the un-rewritten
# baseline) and feed it through `PreparedQuery::from` — the on-vs-off oracle for the
# `algebra-rewrite` pass. `spargebra` is already a normal dependency (above), so this adds
# ZERO new crate to the lock/graph; it only makes the type visible to the integration-test
# crate. Normal library code never uses this entry.
spargebra.workspace = true
# The cs-planner q-error gate builds its characteristic-set tables through the
# dict-id accessor (dev-only; the library never depends on introspection).
sparq-introspect = { path = "../sparq-introspect", version = "0.1.1" }
# [FABLE-5] sq-3dyje.3: property-based eval tests (tests/proptest_eval.rs — engine ≡
# naive reference / join-order invariance / ORDER BY laws). DEV/TEST ONLY, exactly like
# the sparq-core + sparq-substrate proptest dev-deps: it never appears in [dependencies]
# or any feature, so the shipped crate and the wasm bundle are unchanged. Same version
# req as those crates (resolves to the already-attested proptest in supply-chain/).
proptest = "1"
# [FABLE-5] sq-ilweo — DEV-only ryu: the eval-proptest oracle's INDEPENDENT
# computed-xsd:double formatter (tests/proptest_eval.rs `fmt_double_oracle`) takes its
# shortest-round-trip digits from ryu instead of the std `{:E}` path the engine uses,
# keeping the oracle out of the §2.3 independence trap. ryu is already in the workspace
# tree (a serde_json dependency), so this adds ZERO new crates to the lock/graph.
ryu = "1"
# [OPUS-4.8] (sq-e3pj, sq-6vshe.4) DEV-only serde_json: the `explain_json` structured-EXPLAIN
# tests parse the hand-emitted JSON DOM back to assert every field round-trips (and `chunk`'s
# `impl PartialEq<serde_json::Value>` test helper), so the opt-in `explain-json` feature itself
# stays dependency-free (the production writer emits JSON by hand). NB: the JSON-LD writer's own
# round-trip tests moved WITH the writer to `sparq-engine-serialize` in seam 1 of the facade
# split. serde_json is already in the workspace tree (sparq-server / the `service` feature).
serde_json = "1"

# [SONNET-4.6] sq-sqtk2.3 — register the `kani` cfg so the `#[cfg(all(kani, feature =
# "vectorized"))]` bounded-proof harnesses in `reduce.rs` do not trip `-D warnings`
# (unexpected_cfgs) on the normal build. `cargo kani` sets this cfg itself when it
# model-checks; under a normal build the harness module is stripped. Mirrors
# crates/sparq-core/Cargo.toml and crates/sparq-vectors/Cargo.toml.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
