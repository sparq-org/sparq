# sparq-mpc — MPC over federated SPARQL (RQ2). Through M3.
# Native-only research crate. DELIBERATELY NOT a dependency of sparq-wasm:
# the WASM bundle must stay free of any MPC/crypto surface (verify with
# `cargo tree -p sparq-wasm` — sparq-mpc must NOT appear).
#
# Through M3 this builds: the invariant per-holder local sub-evaluation (M0); the
# disclosed-key global-IRI join (M2); and — M3 — a REAL honest-majority Shamir
# t-of-n MpcBackend (field.rs + shamir.rs) plus the hidden-value join over
# private keys via secret-shared equality (the circuit-PSI core). Q2 (trust
# model) is resolved for v1 = honest-majority semi-honest, configurable behind
# the MpcBackend trait. STILL deferred behind honest NotYetImplemented stubs:
# (Q1) the unsolved distributed-signature-over-secret-shared-witness inside the
# collaborative proof (M4), gated on the ZK-foundation remediation. No fake
# crypto: every deferred path names its gate. Shamir's masking RNG is now a
# CSPRNG (sq-1vt resolved): an OS-seeded, sparq-OWNED ChaCha20 keystream generator
# by default (sq-it50 — owned so its key schedule is ZeroizeOnDrop-scrubbed), with
# a deterministic seedable PRNG only behind the `insecure-test-rng` feature (off
# by default; tests use it). See chacha.rs + rng.rs + shamir.rs.
[package]
name = "sparq-mpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MPC over federated SPARQL (RQ2): per-holder local sub-evaluation + invariant trait boundaries for the MPC primitive, global-IRI join, and collaborative attested-source proof. Native-only research scaffold; crypto deferred."
publish = false

# The only reverse dependency is sparq-fedplan-mpc, behind its default-OFF
# `fedplan-mpc` feature. sparq-wasm does NOT depend on this crate, so the browser
# bundle is untouched (verify with `cargo tree -p sparq-wasm`). The only real dependency is the SPARQL engine, used for the
# invariant "each holder evaluates locally over its own graphs" core.

[features]
# sq-1vt: gate exposing the DETERMINISTIC, SEEDABLE masking RNG
# (`ShamirBackend::new_seeded` / `rng::InsecureTestRng`) outside `#[cfg(test)]`,
# e.g. for an external benchmark harness that needs reproducible masks. It is
# OFF by default, so a normal `sparq-mpc` build CANNOT construct a predictable
# masking RNG — the real protocol always uses the OS-seeded ChaCha20 CSPRNG.
# The feature name is the warning: turning it on opts into insecure randomness.
insecure-test-rng = []
# The per-protocol security-properties annotation graph (`secprop` module +
# `ontologies/secprop-mpc-methods.ttl`): each protocol's trust model as
# `secx:property`/`secx:level` claims on the ordered `secx:AdversaryModel` /
# `secx:CorruptionThreshold` dimensions, so an ODRL preference requiring malicious /
# dishonest-majority security is discharged by the SHARED admissibility reasoner
# (`sparq_trust::admissible`) instead of resting on the inert `secx:assumption`
# provenance (issues #3275 + #6186). OFF by default. Its only dependency is the
# ZERO-dependency `sparq-secprop-vocab` leaf, so the opt-in build grows by a
# `const &str` table plus the Turtle and the default build is byte-identical.
secprop-annotations = ["dep:sparq-secprop-vocab"]

[dependencies]
# The single-holder query engine. The MPC layer's whole point is to MINIMISE
# data sharing: each holder evaluates a query fragment over ITS OWN graphs
# locally via this engine and ships only partial results, never raw graphs.
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
# Term model — local partial results are carried as oxrdf terms (the same
# row shape sparq-engine's QueryResult uses), so a holder never has to
# re-encode its own data to hand a partial to the join layer.
oxrdf = { workspace = true }

# sq-1vt / sq-it50 / sq-8xug: OS-entropy seed for the secret-sharing /
# masking CSPRNG. The dealer's polynomial coefficients and the equality-test mask
# MUST be unpredictable — a non-crypto PRNG there is a real confidentiality
# weakness (sq-1vt). We own the ChaCha20 keystream generator (`crate::chacha`,
# correctness-pinned to the RFC 8439 vectors) so its key schedule is
# `ZeroizeOnDrop`-scrubbed (sq-it50) — ecosystem `rand_chacha::ChaCha20Rng`
# exposes no `zeroize`/`&mut`-key access, so its key schedule could not be
# scrubbed in place. We need ONLY a fresh 32-byte OS-entropy seed for that owned
# CSPRNG. Under the rand 0.10 ecosystem upgrade (sq-8xug), `rand_core` 0.10 no
# longer re-exports `OsRng` (it was removed), so the previous
# `rand_chacha::rand_core::OsRng` path is gone. We now draw the seed straight from
# `getrandom::fill`, which DROPS the `rand_chacha` dependency entirely (we never
# used its `ChaCha20Rng`). Minimal dependency surface; native-only / wasm-exclusion
# invariant intact. `getrandom` 0.4 is the workspace OS-entropy floor.
getrandom = "0.4"

# sq-u8a8 (epic sq-toze / from side-channel analysis sq-egx6, gap
# CR-G5): secret-memory hygiene (`zeroize`) + constant-time-equality PRIMITIVES
# (`subtle`) for the secret-bearing MPC types. HYGIENE ONLY — no protocol,
# algorithm, wire-format, or disclosure-minimisation behaviour changes. The
# analysis found every comparison on the protocol paths is over PUBLIC / opened
# values (masked products, the verdict bit, public threshold bits), so NO
# existing `==` is replaced with a CT compare; `subtle` is adopted so the
# secret-bearing field/share types CAN be compared in constant time if a future
# secret-vs-secret comparison is ever introduced, and `zeroize` zeroes the
# masking-RNG state, the cleartext MAC key α, the `[α]` / `[α·x]` shares, and the
# Fp / Share secret operands on drop. Mark for Fable crypto re-review.
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# sq-dl81: a vetted cryptographic hash for the domain-separated
# Term->Fp join-key encoder (`crate::term_encode`). The hidden-value join's
# secret-shared field-equality is a SOUND stand-in for RDF term equality ONLY
# if the encoding is injective on the join domain; a uniform-output hash makes
# a collision (a false match) a quantified birthday event over the field rather
# than the holder's untested responsibility. SHA-512 is already in the
# workspace tree (sparq-engine's `digest` feature), is native-only (the crate's
# wasm-exclusion invariant is intact), and gives a 64-byte uniform digest we
# fold into the 61-bit Mersenne field. Pinned to the same 0.11 line sparq-engine
# uses so the workspace resolves a single `sha2`/`digest` version.
sha2 = "0.11"

# OPTIONAL — `secprop-annotations` feature only (#3275/#6186). The shared
# `sec-prop:`/`secx:` IRI constants, single-sourced in a ZERO-dependency leaf so the
# annotation graph's dimension/level IRIs are pinned to the canonical
# `secprop-ext.ttl` by a real crate edge rather than a copied string table. The
# default build pulls nothing.
sparq-secprop-vocab = { path = "../sparq-secprop-vocab", version = "0.1.6", optional = true }

# Test-only: the SHARED N3 admissibility reasoner the per-protocol annotation graph
# is meant to be discharged by (#6186). The end-to-end test runs a real ODRL
# preference through `sparq_trust::admissible` over this crate's annotation graph, so
# the exclusion is demonstrated through the one shared reasoner — this crate ships no
# second, crate-local exclusion predicate. A DEV-dependency only: nothing in
# sparq-mpc's shipping graph depends on sparq-trust, and the edge direction is
# cycle-free (sparq-trust does not depend on sparq-mpc).
[dev-dependencies]
sparq-trust = { path = "../sparq-trust", version = "0.1.6", features = [
    "secprop-admissibility",
] }
