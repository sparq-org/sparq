[build-system]
requires = ["maturin>=1.14.0,<2.0"]
build-backend = "maturin"

# [OPUS-4.8] sq-8slf: the PyPI *distribution* name is `sparq-rdf` (owner-approved):
# the bare `sparq` distribution name is taken by an unrelated package (see docs/release.md
# §0a). This is the wheel / `pip install <name>` name ONLY. The *import* name stays `sparq`
# (pinned by [tool.maturin] module-name + the cdylib [lib] name + `#[pymodule] fn sparq`),
# so users still write `import sparq`. maturin keeps these two names independent.
[project]
name = "sparq-rdf"
description = "Python bindings for the sparq RDF + SPARQL engine (dictionary-encoded triplestore, SPARQL 1.1 query/update, opt-in RDFS/OWL-RL/N3 reasoning). Distributed on PyPI as `sparq-rdf`; the import name is `sparq` (`import sparq`)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rdf", "sparql", "semantic-web", "triplestore", "query-engine", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Scientific/Engineering",
]
# Version comes from the workspace Cargo.toml ([workspace.package] version).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sparq-org/sparq"
Repository = "https://github.com/sparq-org/sparq"
Documentation = "https://github.com/sparq-org/sparq#readme"
Issues = "https://github.com/sparq-org/sparq/issues"

[project.optional-dependencies]
test = ["pytest>=8.4.2"]
# [OPUS-4.8] sq-5jjei (gh-910): the `arrow` extra makes `pip install sparq-rdf[arrow]`
# pull in pyarrow — the CONSUMER side of the Arrow C Data Interface the opt-in
# `Graph.query_arrow() -> pyarrow.Table` surface uses (the binding hands the batch over a
# PyCapsule stream, no re-serialisation). This extra is necessary BUT NOT SUFFICIENT to
# use query_arrow: the
# method only EXISTS in a wheel compiled with the cargo `arrow` feature (`maturin build
# --features arrow`). Which PUBLISHED-PyPI wheels ship with `arrow` baked in is the
# broader sq-v286 release-matrix question (NOTE: not resolved here — see the README's
# "Arrow export" note); until that lands, install an `--features arrow` wheel yourself.
# Floor `pyarrow>=14`: the first release exposing the PyCapsule-based C Data Interface
# import path (a `pyarrow.Table` built from a stream capsule) this binding relies on.
arrow = ["pyarrow>=14"]

[tool.maturin]
# [OPUS-4.8] sq-8slf: pin the IMPORT/module name to `sparq` independently of the
# `[project] name` (the PyPI *distribution* name, now `sparq-rdf`). maturin derives
# the module name from `module-name` first, then the cdylib `[lib] name`, then the
# distribution name; without this pin it would normalise `sparq-rdf` → `sparq_rdf`
# and the build would fail because the cdylib `[lib] name` / `#[pymodule] fn` is
# `sparq`. With it pinned, `pip install sparq-rdf` installs an importable `sparq`.
module-name = "sparq"
# abi3 (set in Cargo.toml) makes the wheel one-per-platform.
# For RELEASE wheels use `maturin build --profile python-release` (release
# optimisation + unwinding panics; the workspace's plain release profile is
# panic=abort, which would turn any Rust panic into a hard interpreter abort).

[tool.pytest.ini_options]
testpaths = ["tests"]
# [OPUS-4.8] sq-th1u: also collect bench_*.py (pytest's default python_files is
# only test_*.py / *_test.py, so without this the FFI micro-bench file would be
# silently skipped by a plain `pytest tests/` directory run).
python_files = ["test_*.py", "bench_*.py"]
# Register the `bench` marker (the FFI-overhead micro-bench in tests/bench_py.py).
# CI selects it with `pytest -m bench` or skips it with `pytest -m "not bench"`;
# registering it here silences the "unknown mark" warning.
markers = [
  "bench: timed FFI-overhead micro-benchmarks (prints measurements; select/deselect with -m bench / -m 'not bench')",
]
