# [FABLE-5] sq-gum8.6 (epic sq-gum8, paper P2a): the metamorphic + differential
# logic-bug harness for SPARQL engines — TLP and NoREC re-derived for SPARQL's
# three-valued (true / false / error) effective-boolean-value semantics, a
# differential oracle over crates/sparq-difftest, a seeded deterministic query
# generator, SPARQL-protocol drivers for external engines, and the found-bug
# ledger format.
#
# OPT-IN UNIT: the crate itself. It is `publish = false` DEV/TEST + campaign
# tooling; nothing in the shipping graph depends on it, so the lean
# core/engine/wasm builds never link it (same posture as sparq-difftest).
# Depending on sparq-core / sparq-engine here is deliberate and adds nothing to
# any default build (both are already workspace members built everywhere): the
# TLP/NoREC oracles are SELF-referential (an engine is checked against itself),
# so the harness may know the engine under test. Cross-engine INDEPENDENCE
# lives one layer down, in sparq-difftest's engine-independent comparators —
# see that crate's load-bearing-constraint note.
[package]
name = "sparq-metamorph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# HTTP drivers for EXTERNAL engines over the SPARQL 1.1 Protocol (Fuseki,
# Virtuoso, Oxigraph, ... — the off-CI bug-hunting campaign). OFF by default so
# the default build of this crate carries no HTTP client; CI self-tests never
# touch the network (the drivers' pure request-building layer is unit-tested
# without sockets). ureq 3 with rustls+platform-verifier mirrors sparq-engine's
# `service` transport pin, so enabling this grows no new dependency tree.
protocol-drivers = ["dep:ureq", "dep:percent-encoding"]

[dependencies]
# Engine-independent result comparators (multiset equality, SPARQL-Results-JSON
# reader, neutral term model) — REUSED as a dependency only (sq-gum8.6 must not
# modify sparq-difftest).
sparq-difftest = { path = "../sparq-difftest" }
# The in-process engine under test (sparq itself is a campaign target; the
# mutation self-tests exercise the REAL engine, not a mock evaluator).
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
# Found-bug ledger serialisation (JSON Lines).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# See the `protocol-drivers` feature note above.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
# #3712: `driver::form_urlencode`'s encoder (protocol-drivers only; already in the tree via ureq).
percent-encoding = { workspace = true, optional = true }

# [GPT-5.6] sq-hgqza: self-relative generation + oracle-check throughput only;
# Criterion is dev-only and never enters the crate's lean dependency graph.
[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "metamorph_throughput"
harness = false
