# [OPUS-4.8] sq-leg8n (epic sq-2m6zm, design research/llm-ergonomic-sparql-surface.md
# §3/§6, PR #1074). An opt-in, LLM-ergonomic, VERIFIABLE SPARQL surface: a PRE-PARSE
# textual transpiler that always emits CANONICAL, conformant SPARQL — it never touches
# the vendored spargebra GRAMMAR. The single public contract is `terse_to_sparql`, which
# returns the canonical SPARQL the engine will run PLUS the resolutions/warnings, so the
# agent only ever executes standard SPARQL it can inspect ("a convenience that shows its
# work, never an oracle that hides it" — design §6). This is a SEPARATE crate so the core
# engine carries ZERO terse-surface code; nothing in the workspace's default build depends
# on it.

[package]
name = "sparq-terse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in LLM-oriented shorthand transpiler that emits canonical SPARQL with verifiable concept resolution"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Research prototype (epic sq-2m6zm dogfooding); broad adoption is gated on the
# design's §5 token/quality A/B verdict. [GPT-5.6] Published because sparq-cli and
# sparq-server expose it behind default-off features; maturity remains explicit.

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg so the `vectors`-gated
# items render on the docs.rs front page.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# OPT-IN by construction (strict additivity). The DEFAULT build is a lean transpiler:
# it depends only on `spargebra` (to RE-PARSE its own canonical output for the
# silent-rewrite canary — NOT to change the grammar) and the term model. The lexical
# `V()` concept resolution rides the existing, no-model, no-network sparq-nlq linker;
# the vector FALLBACK (and its mandatory staleness guard) is gated behind `vectors`,
# the only feature that pulls sparq-vectors into this crate's graph.
[features]
default = []
# Enables `V("phrase")` lexical-first concept resolution (design §3.3/§6): the
# deterministic, no-model sparq-nlq lexical linker is the PRIMARY path; the
# staleness-guarded vector fallback (sparq-vectors `nearest_term_exact_checked`) fires
# only when lexical returns nothing and the caller supplies a pre-embedded query vector.
# Pulls sparq-core (the Graph the resolution reads), sparq-nlq (the lexical linker) and
# sparq-vectors (the staleness-guarded search). OFF by default so the lean transpiler
# build carries zero resolution code and no engine dependency.
vectors = ["dep:sparq-core", "dep:sparq-nlq", "dep:sparq-vectors", "dep:oxrdf"]

[dependencies]
# Validation only: the transpiler RE-PARSES its own canonical output under the unmodified
# vendored parser, so the silent-rewrite canary can assert the expansion is conformant
# SPARQL. We never fork or extend this grammar. Always present (it is the canary's engine).
spargebra.workspace = true
# The engine graph the lexical/vector resolution reads (only behind `vectors`).
# default-features=false keeps it lean.
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false, optional = true }
# The deterministic, no-model, no-network LEXICAL entity linker reused for V() (design
# §6.4 "lexical-first"). Only behind `vectors`.
sparq-nlq = { path = "../sparq-nlq", version = "0.1.1", optional = true }
# The staleness-guarded nearest-term search (the §6.5 mandatory staleness guard) for the
# V() vector fallback. Only behind `vectors`.
sparq-vectors = { path = "../sparq-vectors", version = "0.1.1", optional = true }
# Term types for the resolution surface (Resolution.iri is an oxrdf NamedNode). Only
# behind `vectors`; workspace-pinned so the term type is byte-identical to sparq-core's.
oxrdf = { workspace = true, optional = true }

[dev-dependencies]
# [GPT-5.6] sq-v7li4 — deterministic metamorphic coverage for the lean keyword layer.
proptest = "1"

# [OPUS-4.8] sq-bzign — the deterministic transpile-and-echo tool the Phase-5 A/B harness
# (`bench/terse/`) calls. It needs `terse_to_sparql_with` + the `Graph`, so it is gated on
# `vectors` and only built with `--features vectors` (never in the lean default gate).
[[example]]
name = "terse-expand"
required-features = ["vectors"]
