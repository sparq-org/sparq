[package]
name = "sparq-forms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in headless SHACL-to-form derivation for the sparq RDF engine: DASH-compatible FormDescription JSON (widget scoring, property groups, nested sub-forms) with no GUI dependencies"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [FABLE-5] sq-lsp7k.1.1 (forms F1): OPT-IN crate (the sparq-shacl isolation pattern) —
# nothing in the default workspace depends on it, so sparq-core/sparq-engine carry zero
# forms code, deps, or runtime cost. Headless + wasm-able BY CONSTRUCTION: no GUI deps,
# and the sparq-core/sparq-shacl deps come in with default-features = false so the
# native-only `parallel` machinery (rayon) never enters a wasm32 build of this crate.
# Consumers: the Tauri workbench renderer (F2, sq-lsp7k.1.2) natively, the hosted /app
# via wasm, and sparq-mcp's describe_form tools (F6, sq-lsp7k.1.6).

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io.
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
# The SHACL shapes model (ShapesModel/Shape/Component/Path) + GraphView. Base features
# only: forms derivation needs no SHACL-AF rules and no SCS parser.
sparq-shacl = { path = "../sparq-shacl", version = "0.1.1", default-features = false }
oxrdf.workspace = true
serde = { version = "1", features = ["derive"] }

# oxrdf pulls `rand`/getrandom (blank-node ids). On wasm there is no OS RNG, so select
# getrandom's browser backend (crypto.getRandomValues) — exactly as sparq-wasm /
# sparq-shacl-wasm do. The matching `--cfg getrandom_backend="wasm_js"` is set in the
# workspace .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Golden-file tests serialize FormDescription to canonical pretty JSON.
proptest = "1"
serde_json = "1"
sparq-engine = { path = "../sparq-engine", version = "0.1.1", default-features = false }
