# sq-t999y — server-independent WAC/ACP decision test-vector oracle.
#
# DEV-ONLY corpus crate: `publish = false`. Nothing in the shipping graph depends on
# it (opt-in crate architecture — sparq-core/sparq-engine untouched); it is a leaf
# the PSS-parity suite and the future solid-server landing (epic sq-gg0qq) consume as
# a dev-dependency. The crate embeds protocol-agnostic WAC + ACP decision fixtures
# (N-Quads corpus + expected `(session, resource, mode) -> {allow, granted_modes,
# scope, status}` rows) and a `run_vectors` runner asserting `PodStore::decide` /
# `decide_batch` (crates/sparq-solid) matches every row. EXPERIMENTAL — the corpus
# may grow rows/fixtures; the row schema itself is stable-intent.
[package]
name = "sparq-wac-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Server-independent WAC/ACP decision test-vectors + a PodStore::decide oracle runner (sq-t999y)."
readme = "README.md"

[dependencies]
# Path-only (publish = false): the decision engine under test and the dataset loader.
# Heavy by nature (sparq-solid pulls sparq-core/engine/reason), but this crate is a
# dependency of NOTHING in the workspace, so the deps stay off every default build path.
sparq-core = { path = "../sparq-core", default-features = false }
sparq-solid = { path = "../sparq-solid", default-features = false }
# sq-x1ayt — the ODRL policy source for the time-windowed conditional-grant
# rows. OPTIONAL + behind the `odrl-bridge` feature (OFF by default): the live-clock
# `auth:notBefore`/`auth:notAfter` window is produced ONLY by sparq-solid's ODRL bridge
# (ACP has no native time vocabulary), so the default oracle build carries zero ODRL
# code or deps and the WAC/ACP corpus above is unchanged.
sparq-policy = { path = "../sparq-policy", default-features = false, optional = true }

[features]
# sq-x1ayt: the `window_corpus` module — decision rows whose verdict turns
# on `Session::now` against a persisted `auth:notBefore`/`auth:notAfter` window. Enables
# sparq-solid's own `odrl-bridge` feature, which is what mints the windowed grant.
odrl-bridge = ["dep:sparq-policy", "sparq-solid/odrl-bridge"]

# sq-39kps — register the `kani` cfg so the `#[cfg(kani)]` domain-coverage
# self-check in `escalation_corpus.rs` does not trip `-D warnings` (unexpected_cfgs) on
# the NORMAL build. `cargo kani` sets this cfg itself; under a normal build the harness is
# stripped. Mirrors crates/sparq-core/Cargo.toml.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
