# sq-6qw3 (W-reason): the tier-b WASM bundle for sparq-reason.
#
# A SEPARATE, lazy-loaded bundle (not folded into the lean `sparq-wasm` bundle): it
# carries the forward-chaining reasoner (`sparq-reason`) + the N-Triples serialiser
# (`sparq-engine`), which the lean default browser bundle deliberately does not. The
# showcase site loads it ONLY on /surface/inference (next/dynamic, client-only) so the
# landing page stays light. Mirrors the per-bundle-crate pattern of `sparq-wasm`.
[package]
name = "sparq-reason-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib for the wasm artifact; rlib so the pure helpers can be unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# No-default-features everywhere => no rayon: the wasm build has no threads and we keep
# the bundle minimal. `sparq-reason` with default-features off drops its `parallel`
# (rayon) feature; `sparq-engine`/`sparq-core` with defaults off drop rayon + the SPARQL
# regex/digest cores. The reasoner's OWN `regex` dep (the N3 `string:matches` builtin) is
# pure-Rust and compiles to wasm32 — the portability spike (sq-6qw3) confirmed regex,
# aho-corasick and memchr all build for `wasm32-unknown-unknown`; the only build blocker
# was getrandom's wasm backend (handled below, exactly as `sparq-wasm` does).
sparq-core = { path = "../sparq-core", default-features = false }
sparq-engine = { path = "../sparq-engine", default-features = false }
sparq-reason = { path = "../sparq-reason", default-features = false }
oxrdf.workspace = true
wasm-bindgen = "0.2"

# oxrdf pulls `rand`/getrandom (blank-node ids). On wasm there is no OS RNG, so select
# getrandom's browser backend (crypto.getRandomValues). The matching
# `--cfg getrandom_backend="wasm_js"` is set in the workspace .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = []
# sq-6qw3: expose `Reasoner::why(...)` — the derivation proof tree — by turning
# on `sparq-reason`'s non-default `explain` feature. OFF by default so the standard reason
# bundle carries zero proof-tree code; CI builds the bundle BOTH with and without it, and
# the headless wasm tests run with it on. Maps directly to the `why()` proof tree the
# /surface/inference page renders.
explain = ["sparq-reason/explain"]
# sq-e5atd: expose `Profile::D` (opt-in D-entailment / datatype value-space
# materialiser) to the bundle's `materialize`/`entailed`/`materializeStats` methods by
# turning on `sparq-reason`'s non-default `d-entail` feature. OFF by default. The `why()`
# proof tree is NOT available for D (it is a value-space materialiser, not a rule-based
# forward-chainer with a derivation DAG), so `why("d", …)` returns an explanatory error.
d-entail = ["sparq-reason/d-entail"]

[dev-dependencies]
# sq-6qw3 — headless wasm test harness, mirroring sparq-wasm: exercises the
# #[wasm_bindgen] JS-facing API in a REAL wasm runtime via `wasm-pack test --node`.
# Dev-only: it must NOT enter the non-dev wasm graph.
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
# Optimise the wasm for size (the regex automata are the bundle-size risk flagged in the bead).
wasm-opt = ["-Oz"]
# sq-7d3dj.15 — `js build:reason-wasm` now passes `--profile release-wasm`
# (NOT `--release`). wasm-pack only recognises the built-in `dev`/`profiling`/`release` profile
# keys; the above `release` block is IGNORED for `--profile release-wasm` and wasm-opt uses its
# default `-O` instead. The size win comes from the cargo `release-wasm` profile (opt-level "z"
# on cold parse crates + strip=symbols). `--config profile.release-wasm.strip=false` is passed
# in the build script so wasm-opt can read the wasm `target_features` custom section (which
# cargo's strip would otherwise discard) — wasm-opt does the final strip.
