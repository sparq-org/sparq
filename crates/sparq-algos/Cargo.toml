[package]
name = "sparq-algos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in graph analytics over a sparq RDF graph: PageRank, centrality, community detection, and directed topology"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [OPUS-4.8] Render README.md as the docs.rs front page (lib.rs uses include_str!).
[package.metadata.docs.rs]
all-features = true

# [OPUS-4.8] sq-mqvm (epic sq-3183): vendor-parity graph analytics (Neptune ships 25+;
# sparq shipped none). This is a SEPARATE, OPT-IN crate so the core engine carries ZERO
# analytics code — it consumes ONLY sparq-core's PUBLIC read API (the borrowing triple-id
# iterator + dict lookups), holds no graph state of its own, and nothing in the workspace
# depends on it (the default engine build does not even compile it). The algorithms project
# the RDF graph onto a directed adjacency view keyed by dictionary ids; PageRank, the
# centralities, and the connected-component / label-propagation community pass all run over
# that view, so the engine, planner and wasm bundle remain completely unaware of analytics.

[features]
default = []
# [GPT-5.6] sq-lsp7k.15: exact all-pairs centralities are opt-in because their
# O(V * (V + E)) running time and working set are materially heavier than degree.
centrality-extended = []
# [GPT-5.6] sq-lsp7k.20: directed SCC and topological-order algorithms stay
# default-OFF so consumers opt into the additional topology surface explicitly.
topology = []
# [OPUS-5] sq-lsp7k.9.4: dictionary-id-keyed score maps — the adapter that lets a ranker
# here feed a consumer keyed by sparq-core ids (e.g. `sparq_text::CompletionIndex`).
# Default-OFF like every other added surface in this crate; a consumer opts in explicitly.
ranking = []

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1" }
oxrdf.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
proptest = "1"
# [OPUS-5] sq-lsp7k.9.4 TEST-ONLY, and deliberately so: `tests/ranking.rs` proves the
# `ranking` map really does type-check as `CompletionIndex::complete`'s `scores` argument,
# so the two crates cannot drift apart silently. `default-features = false` keeps the
# engine (and rayon/regex/digest) out of the test build — the completion index needs none
# of it. There is NO normal dependency edge in either direction: sparq-text does not know
# about sparq-algos, and this crate still ships with only sparq-core, oxrdf and rustc-hash.
sparq-text = { path = "../sparq-text", default-features = false }
