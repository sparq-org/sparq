[package]
name = "sparq-reason-ql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EXPERIMENTAL opt-in OWL 2 QL query-rewriting reasoner (PerfectRef over DL-Lite_R) for the sparq RDF engine: sound certain-answer rewriting of conjunctive queries with a strict fail-closed CQ-shape gate"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] sq-t5bne: crate-local README so crates.io (package.readme) matches the docs.rs
# front page (lib.rs include_str!("../README.md")) — same content on both registries.
readme = "README.md"
# [OPUS-5.5] v0.1.4 release path: outside the crates.io core publish set (it is not a
# normal, optional, or versioned-dev dependency of any core crate). Kept workspace-only so
# the registry closure stays the 28 crates docs/release.md §4 bootstraps; flip back to
# publish in a reviewed change that also adds it to release-plz.toml's publish set.
publish = false

# [OPUS-4.8] sq-t5bne: build docs.rs with all features so the rewriter items render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# EXPERIMENTAL opt-in OWL 2 QL query rewriting (epic sq-pbz04, phase Q1 / "QL track" of
# research/owl2-el-ql-reasoning-spike.md + research/reasoner-suite-on-substrate.md §2.5).
# A SEPARATE crate so the core engine — and in particular the lean wasm build — carries
# ZERO QL code, deps, or runtime cost by default. QL is engaged ONLY by depending on this
# crate AND enabling the `experimental` feature (the rewriter is gated; depending on the
# crate alone gives only the CQ-shape gate types).
#
# OWL 2 QL (DL-Lite_R) is FO-rewritable: a conjunctive query is rewritten into a union of
# conjunctive queries that, evaluated over the UNMODIFIED data, returns the certain answers
# (Calvanese et al. PerfectRef, JAR 2007). It is a QUERY-REWRITER, not a materialiser — it
# reuses the engine's query path (the spargebra rewrite seam sparq-vectors already proves),
# NOT the materialisation substrate. The #1 unsoundness trap is PerfectRef applicability:
# the theory is for conjunctive queries ONLY, so the rewriter is FAIL-CLOSED — any query
# with OPTIONAL/FILTER/MINUS/UNION/property-paths/aggregation is REJECTED as OutOfScope
# rather than silently mis-answered.

[features]
# Default = nothing. Depending on this crate gives the CQ-shape gate (cheap, always present);
# the PerfectRef rewriter itself is behind the OFF-by-default `experimental` feature so the
# regime's EXPERIMENTAL, oracle-tested-only status is reflected in the build: a caller must
# opt in twice (dep + feature) to engage rewriting. No default features.
default = []

# [OPUS-4.8] sq-t5bne (Phase Q1): the PerfectRef rewriting pass (DL-Lite_R TBox extraction +
# rewrite/reduce saturation + UCQ emission). EXPERIMENTAL: oracle-tested against a hand-checked
# DL-Lite oracle, NOT graduated to a conformance floor (tree-witness + UCQ-containment
# minimisation are the deferred production path — separate bead). OFF by default so a bare
# dependency carries only the (cheap, dependency-light) CQ-shape gate. No new dependency —
# reuses spargebra + oxrdf + rustc-hash.
experimental = []

# [FABLE-5] sq-p6yb7 (design record research/owl2-ql-cq-gate-broadening.md §8): DL-Lite_R KB
# CONSISTENCY CHECKING by violation-query composition — for each captured negative inclusion
# (owl:disjointWith / owl:propertyDisjointWith, see `TBox::neg_incl`) compose the boolean
# violation CQ, rewrite it with the EXISTING PerfectRef machinery (hence the `experimental`
# dependency), and evaluate it over the data: the KB is INCONSISTENT iff some violation query
# matches. Fail-closed: a TBox that is not fully captured (or carries a structurally-uncaptured
# negative axiom, e.g. owl:complementOf) yields Unknown, never a guessed Consistent. OFF by
# default (double opt-in preserved: dep + feature), so neither the default build nor a bare
# `experimental` build carries the checker. No new dependency.
ql-consistency = ["experimental"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
spargebra = { workspace = true }
oxrdf.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# Turtle parser — used ONLY by the oracle tests to build readable TBox fixtures into
# `Vec<oxrdf::Triple>`. Not a runtime dependency: the rewriter takes triples from the caller,
# which sparq already parses via sparq-core. Keeps the runtime dep surface to spargebra/oxrdf.
oxttl.workspace = true
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
# [SONNET-4.6] sq-wxaas: the OWL 2 RL materialise-then-query BASELINE for the QL-track Q1
# acceptance oracle (`tests/rl_baseline_differential.rs`). TEST-ONLY — the rewriter itself never
# touches the materialiser (FO-rewritability is precisely the point), so this stays a
# dev-dependency and adds nothing to the shipped dep graph. No cycle: sparq-reason depends only
# on sparq-core/sparq-substrate, never on sparq-reason-ql.
sparq-reason = { path = "../sparq-reason", default-features = false }

# The DL-Lite-oracle differential tests are `#![cfg(feature = "experimental")]` — they exercise
# the gated rewriter. Without `experimental` they compile empty (and the default-build archive,
# which passes no `--features`, runs zero of them). The `opt-in sparq-reason-ql (experimental)`
# feature-matrix leg is the ONLY thing that executes them in CI.

# [OPUS-4.8] sq-t5bne: the QL-rewrite micro-benchmark calls the `experimental`-gated `rewrite`
# API, so it only builds with the feature on. `required-features` keeps a default
# `cargo build --all-targets` (which passes no features) from trying to compile it and failing on
# the missing import — mirrors sparq-reason-el's `hasse_bench`. It is the crate's registered G1
# benchmark (bench/benchmarks.toml: reason-ql-rewrite).
[[example]]
name = "ql_rewrite_bench"
required-features = ["experimental"]

# [GPT-5.6] sq-mg1wx: hermetic rewrite-then-execute correctness/measurement harness.
[[example]]
name = "ql_endtoend_bench"
required-features = ["experimental"]

# [SONNET-4.6] sq-hmd7l.9: the sparq leg of the NPD/Requiem rewriting comparison vs Ontop
# (scripts/bench/reason-ql-same-box.sh). Calls the gated `rewrite`/`rewrite_production` API,
# so `required-features` keeps the default (feature-less) `cargo build --all-targets` green.
# `test = true` (the sparq-jsonld `jsonld_conformance` precedent) so the witness-gate
# regression tests run under `cargo test --features experimental`: the per-disjunct
# frozen-instance witness must populate query-only predicates + multi-atom joins and must
# detect a wrongly-dropped UCQ disjunct (the gate is non-vacuous by construction, not by
# TBox-vocabulary coincidence).
[[example]]
name = "ql_npd_requiem_bench"
required-features = ["experimental"]
test = true
