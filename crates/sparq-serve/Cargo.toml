# sparq-serve: the concurrent-serving core (research/concurrent-serving.md §6).
#
# LIBRARY-FIRST RULE (§6.1): this crate is sync, runtime-agnostic, and exposes NO
# HTTP types and NO async-runtime types in its API. Consumers (sparq-server's axum
# endpoint, the QLever-compat endpoint mode, wasm/python bindings) wrap the sync
# core; async adapters, when they come, live behind a feature flag — never in core.
#
# DEPENDENCY DIRECTION: sparq-wasm must NOT be able to reach this crate (it would
# drag server-side machinery into the browser build). Nothing under crates/ may add
# sparq-serve as a dependency of anything in sparq-wasm's graph; CI-checkable with
#   cargo tree -p sparq-wasm -e normal | grep -c serve   # expect 0
[package]
name = "sparq-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Concurrent serving core for sparq: lock-free generation ring (arc-swapped immutable snapshots), bounded retention, per-pod epoch vectors"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] sq-ieqz: crate-LOCAL README is the crates.io/docs.rs front page (this
# crate is publishable). lib.rs mirrors it via `#![doc = include_str!("../README.md")]`,
# so the rustdoc front page == the crates.io README (parity, like sparq-server).
readme = "README.md"

[features]
# [OPUS-4.8] (sq-o5bi) `backup` (default OFF): compiles the ONLINE consistent-snapshot
# backup/restore surface (`backup::export` / `backup::import` + the `BackupMeta` /
# `BackupError` types). It exports an already-immutable pinned `Generation` to a single
# self-describing artifact WHILE SERVING (no stop-the-world) and re-hydrates a `Graph` from
# one (fail-closed on a corrupt/mismatched artifact). The serving core (the ring + the
# sequenced writer) is fully buildable WITHOUT it — the module + its one crate-private
# `PodEpochs::set` reconstruction hook are `#[cfg]`-stripped, so a build without the feature
# is byte-identical to before. No new dependency: the body uses the N-Quads serialiser already
# in sparq-engine and the loader already in sparq-core; the integrity digest is a self-contained
# (non-cryptographic) checksum. At-rest ENCRYPTION of the artifact is a SEPARATE concern, out of
# scope here. sparq-server's opt-in `backup` feature mounts the HTTP `/admin/backup` +
# `/admin/restore` routes on top of this.
default = []
# Pulls sparq-engine's (dependency-free) `serialize-rdf` so the artifact body can be written
# as N-Quads via `sparq_engine::serialize::graph_to_nquads`.
backup = ["sparq-engine/serialize-rdf"]
# [OPUS-4.8] sq-b4fns (gh-906): `change-stream` (default OFF) — a DURABLE, REPLAYABLE
# change-data-capture stream in the Neptune-Streams shape. Each commit emits an ordered,
# monotonically-sequenced change record (op, quad(s), commit seq/generation, timestamp)
# persisted to a segmented, fsync'd append-only log so a consumer can REPLAY from a given
# offset after restart (`ChangeLog::open` re-reads the segments; `ChangeLog::poll(from_seq)`
# streams onward) — not just an in-memory broadcast. The serving core (ring + sequenced
# writer) is fully buildable WITHOUT it: the `change_stream` module is `#[cfg]`-stripped, so
# a build without the feature is byte-identical to before. It is a LEAN feature: like
# `backup`, it adds NO new external dependency (the change-set is the same N-Quads quad-set
# diff via sparq-engine's dependency-free `serialize-rdf`; the digest reuses `backup`'s
# self-contained FNV-1a; framing/IO is std-only). No HTTP, no async runtime (library-first
# §6.1). sparq-server's `GET /streams` HTTP poll endpoint is a SEPARATE later opt-in.
change-stream = ["sparq-engine/serialize-rdf"]
# [OPUS-5] sq-l6zks (gh-3216): `change-sink` (default OFF) — the SEPARATE, HEAVIER opt-in the
# `change-stream` comment above defers: the external-broker seam over that durable log. It adds
# a `ChangeSink` trait, a stable JSON broker-message encoding (the same per-change entry shape
# `GET /streams` emits), a resumable `BrokerRelay` pump carrying a durable delivered-through
# watermark, and one in-tree `NatsSink` (core-NATS publish). "Heavier" is about CAPABILITY, not
# dependency weight: this is the only thing in the crate that can open a network socket (plain
# TCP, std-only), and pointing a relay at a broker is a data-egress decision — so it must never
# ride along with `change-stream`. It still adds NO external dependency (no broker client, no
# async runtime, no HTTP — library-first §6.1 holds), which is exactly why there is no in-tree
# KAFKA client: a correct Kafka producer means `rdkafka`'s C library (and `async-nats` means a
# tokio runtime), so Kafka — and TLS, SASL, retries, batching — is reached by implementing
# `ChangeSink` over the host's own client, the same posture sparq-server's `AuditSink` takes.
# Implies `change-stream` (the relay reads that log; the log stays the source of truth).
change-sink = ["change-stream"]
# [OPUS-4.8] sq-jluc: the response-bytes result cache (research/concurrent-serving.md
# §5 row 2 + §6.3) — OPT-IN and OFF by default. It is a LEAN feature: it adds NO new
# dependency (the cache key/map reuse the in-tree `rustc-hash` and `std::hash`; the
# values are `Arc<[u8]>` response bodies) and pulls in neither HTTP nor async machinery
# (library-first §6.1: the cache stores opaque bytes + a caller-derived visibility-scope
# key and never depends on `sparq-solid`). The default build carries zero cache code.
result-cache = []
# [SONNET-5] (sq-artifact-keeper-topk) `params` (default OFF): adds `PreparedGraphApplier`,
# an `ApplyUpdates` strategy over `sparq_engine::PreparedUpdate` instead of raw SPARQL Update
# text. `GraphApplier::apply` calls `sparq_engine::update_in_place`, which re-parses the
# update's FULL text on every single commit — for a recurring update template (the same
# claim/upsert-shaped query submitted repeatedly with only a bound value changing, e.g. a
# job-queue claim), that repeated parse is pure waste: measured ~13.5us of a ~21.2us total
# per-update cost on a representative claim template (~63%), because `PreparedUpdate::bind`
# (structural placeholder substitution over the already-parsed algebra, not text
# concatenation) costs under 1us. `PreparedGraphApplier` calls
# `sparq_engine::update_in_place_prepared` instead, so a caller that parses its update
# template ONCE (e.g. at startup) and binds a fresh value per submission pays only the bind +
# eval + apply cost. The serving core (ring + sequenced writer) is fully buildable WITHOUT
# this feature: `PreparedGraphApplier` is `#[cfg]`-stripped, so a build without it is
# byte-identical to before. Forwards to `sparq-engine/params` (already dependency-free).
params = ["sparq-engine/params"]

[dependencies]
# Lock-free current-generation pointer (§6.4): readers `load()` without blocking
# the writer. Deliberately a direct dependency of THIS crate only (not
# a workspace dependency) — no other crate should reach for it casually; the
# generation ring is the one sanctioned place for arc-swap in the tree.
arc-swap = "1"
# [OPUS-4.8] sq-xa15c (#1248): the embedding seam's named-graph existence probe
# (`embed::named_graph_exists`) names `oxrdf::Term` — the type `Graph::named_graph`
# already takes. Workspace dep (same version sparq-core/sparq-engine already pull
# in transitively); already vetted at the workspace level, so NO new cargo-vet
# exemption. No HTTP/async — does not break the library-first §6.1 guard.
oxrdf.workspace = true
rustc-hash.workspace = true
# Promoted from dev-dependencies by Wave A2 (as the A1 comment anticipated): the
# sequenced writer's production `ApplyUpdates` strategy (`GraphApplier`) applies
# SPARQL Updates to the real store — `sparq_engine::update` for the per-batch
# O(graph) fork, `update_in_place` for the O(batch) delta-overlay path. The ring
# and `Writer` stay generic over the snapshot/update types; only `GraphApplier`
# touches these. (This crate never enters sparq-wasm's graph — guard above.)
sparq-core = { path = "../sparq-core", version = "0.1.1" }
sparq-engine = { path = "../sparq-engine", version = "0.1.1" }
# Commutativity batching (Wave A2 §6.5): conservative write-footprint analysis of
# SPARQL Update text (`Footprint::of_sparql`). Workspace-patched to the vendored
# W3C-conformance fork, same as the engine — both parsers must agree on syntax.
spargebra.workspace = true
