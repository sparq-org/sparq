# [OPUS-4.8] sq-s1uy (epic sq-dnko / sq-3183): Phase 0 skeleton of the OPT-IN
# streaming federation CLIENT. This crate is the query *consumer* that fans out to
# heterogeneous remote RDF sources (full SPARQL endpoints, brTPF, TPF, the local
# engine), discovers each source's capability, plans a federated execution (REUSING
# sparq-fedplan), and streams results back. See research/federation-client-design.md
# (§4 architecture, §6 phased plan). This Phase-0 slice ships the COMPILING SKELETON
# + the public module layout + the load-bearing dependency-boundary proof ONLY — no
# federation logic yet.
[package]
name = "sparq-fedclient"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Streaming federation CLIENT over heterogeneous remote RDF sources (endpoint/brTPF/TPF/local) — opt-in, reuses sparq-fedplan planning + sparq-engine SERVICE transport"
# OPT-IN, lean core. NOTHING in the workspace's default build depends on this crate:
# it is a standalone member (like `sparq-fedplan` / `sparq-canon` / `sparq-prov`), so
# `sparq-core`'s default build and the wasm artifact are byte-identical with or without
# it. `publish = false` marks it an intentional Phase-0 stub (gate G1 escape hatch:
# exempt from the bench + SKILL artifact requirements; README still shipped). The
# dependency arrow points one-way INTO sparq-engine — the engine NEVER depends on the
# client — and that boundary is enforced by scripts/fedclient-boundary-guard.sh and the
# `boundary` integration test. [OPUS-4.8] sq-s1uy.
publish = false

[features]
# The whole client is feature-gated so even a crate that DOES depend on sparq-fedclient
# pays zero for it unless `fedclient` is enabled. OFF by default — a build that does not
# enable it compiles an empty crate (mirrors sparq-fedplan's `fedplan = []`).
default = []
# `fedclient` turns on the (currently stub) module surface. It pulls in sparq-fedplan's
# `fedplan` planner and sparq-engine's `service` transport — the two REUSE seams §4 names.
# Phase 0 ships the module layout only; the logic lands in Phases 1-7 (epic sq-dnko).
fedclient = [
    "dep:sparq-fedplan",
    "sparq-fedplan/fedplan",
    "dep:sparq-engine",
    "sparq-engine/service",
    "dep:oxrdf",
    "dep:oxttl",
    "dep:spargebra",
    "dep:rustc-hash",
    # [OPUS-4.8] sq-nfxl: ureq is the discovery client's blocking HTTP GET (Phase 1). It is
    # already in the tree (sparq-engine's `service` transport pulls the same crate), and is
    # native-only — the discovery module `#[cfg]`-excludes it from the wasm build.
    "dep:ureq",
    # [OPUS-4.8] sq-j27p: serde_json parses the SPARQL-Results-JSON the Phase-2 adapter's
    # `execute` returns, in the Phase-3 materialised interpreter's SRJ parser. Already in the
    # tree — `fedclient` enables `sparq-engine/service`, which pulls the SAME serde_json — so
    # this adds NO new crate to the resolved dependency graph.
    "dep:serde_json",
    "dep:serde",
    # #3712: the one RFC 3986 query-value encoder (source::pct_encode). Already in the tree
    # via ureq, so no new crate on a fedclient build.
    "dep:percent-encoding",
]
# [OPUS-4.8] sq-ij5x (epic sq-dnko, FINAL phase): Phase-7 client-side ADAPTIVE re-planning.
# OFF by default; IMPLIES `fedclient` (it is the streaming client's execution loop) AND
# `sparq-fedplan/adaptive-replan` (it DRIVES that planner's AdaptiveExecutor/RuntimeStats/
# ReplanPolicy on the unjoined remainder — the re-plan DECISION engine lives in the planner,
# the client just feeds it real observed cardinalities). A build that does not enable this
# compiles ZERO adaptive code — the `adaptive` module is `#[cfg]`-gated out, and the
# `adaptive-replan` edge into `sparq-fedplan` is not pulled. The dependency arrow still points
# one-way INTO the engine (never the reverse), so the boundary guard is unaffected.
fedclient-adaptive = ["fedclient", "sparq-fedplan/adaptive-replan"]
# [GPT-5.6] sq-fx5id: bounded, per-query pattern-level ASK/cardinality probing. OFF by
# default and implies the client surface whose SSRF-guarded Fetcher + planner bridge it reuses.
pattern_probe = ["fedclient"]

[dependencies]
# REUSE: the cost-based planner + StreamJoin operator (planner-bridge §4.2, physical
# exec §4.4). Optional + only enabled by `fedclient` so the default build pulls nothing.
sparq-fedplan = { path = "../sparq-fedplan", optional = true }
# REUSE: the SERVICE SRJ transport + VALUES bind-join + SSRF egress guard + local BGP
# eval (source adapters §4.1, pushdown §4.3). The arrow points INTO the engine only.
sparq-engine = { path = "../sparq-engine", optional = true }
# Term model + SPARQL algebra (already in the tree) for the source/query surface.
oxrdf = { workspace = true, optional = true }
spargebra = { workspace = true, optional = true }
# [OPUS-4.8] sq-nfxl: N-Triples parsing for the Service-Description / VoID discovery
# documents, and the small hash maps the SD parser builds. Both already in the workspace.
oxttl = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
# [OPUS-4.8] sq-j27p: SPARQL-Results-JSON parsing in the Phase-3 interpreter. serde_json is
# already resolved via `sparq-engine/service` (enabled by `fedclient`), so the default build
# is unaffected and the `fedclient` tree gains no new crate. Version pinned to match.
serde_json = { version = "1", features = ["raw_value"], optional = true }
percent-encoding = { workspace = true, optional = true }
# [GPT-5.6] sq-1rtc2: borrowed SRJ envelopes avoid a full serde_json::Value DOM. serde is
# already in the feature's resolved graph through serde_json; this only makes that existing
# dependency directly usable when `fedclient` is enabled.
serde = { version = "1", features = ["derive"], optional = true }
# [OPUS-4.8] sq-nfxl: the discovery client's blocking HTTP GET (SSRF-guarded). Native-only;
# the discovery module gates it out of wasm. Mirrors sparq-engine's `service` ureq config so
# the resolved dependency is the SAME crate/version (no new tree growth on a default build).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# [OPUS-4.8] sq-g2xs: ureq 3 (was 2) — drops the unmaintained `rustls-pemfile` (RUSTSEC-2025-0134).
# `rustls,platform-verifier` is the faithful successor of ureq 2's `tls,native-certs` (rustls TLS +
# OS-trust-store cert validation). Mirrors sparq-engine's `service` ureq config so the resolved
# dependency is the SAME crate/version (no new tree growth on a default build).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

# [OPUS-4.8] sq-j27p: the Phase-3 result-equivalence test
# (`tests/planner_result_equals_local_eval.rs`, gated on `fedclient`) builds an in-process
# `sparq_core::Graph`, serves each leaf sub-query from the REAL engine, and compares the
# materialised federated result against `sparq_engine::query`. These dev-deps exist ONLY for
# the test binary — they add NO edge to the shipped crate, and the dependency arrow still
# points one-way INTO the engine (never the reverse), so the boundary guard is unaffected.
[dev-dependencies]
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine", features = ["service"] }
# [OPUS-4.8] sq-my8wd.2: stand up a REAL in-process `sparq-server` loopback endpoint on
# `127.0.0.1:0` in `tests/endpoint_loopback_result_equals_local.rs` (gated on `fedclient`), so
# the `Endpoint` SRJ adapter + `discovery` are driven over the crate's own native `ureq` HTTP
# transport — closing the honest gap that the other result-equals-local tests only exercise the
# in-memory `Transport` seam. TEST-ONLY: dev-deps add NO edge to the shipped crate and are
# EXCLUDED from the boundary guard (`cargo tree -e no-dev`), so the one-way
# core <- engine <- client arrow is unaffected (`sparq-server` never depends on `sparq-fedclient`).
# `server` (not `service`) is all the loopback needs — it just answers `/sparql`; the fedclient
# does its own outbound HTTP. `tokio` runs the loopback accept loop on a background thread.
sparq-server = { path = "../sparq-server", default-features = false, features = ["server"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync"] }
