[package]
name = "sparq-zk-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ZK proof composition for sparq: ProofManifest + nargo/bb prover driver + verifier over the per-property Noir circuit family (stage 2)"
publish = false

# Like sparq-zk: NOTHING in the workspace depends on this crate, so default
# builds and the wasm artifact are byte-identical with or without it. The
# circuit family it drives lives at zk/compose/ (proved via nargo/bb
# subprocesses, not linked).

[features]
default = []
# [OPUS-4.8] sq-xojl + sq-cfmv: the DUAL-LEAF value lane — the
# `CircuitId::FilterValueDl` member id + `ProofInputs::FilterValueDl` public
# inputs (sq-xojl) AND the fail-closed `(commitment-method × circuit)` dispatch
# matrix (`dispatch` module, sq-cfmv). OFF by default: the default verifier
# surface is unchanged. Pulls in sparq-zk's `dual-leaf` host encoder so the
# value-lane public-input reconstruction matches the committed leaf. Carries the
# documented INV-VL downgrade (#769 accepted, CR-G8 / sq-qhy4); NOT externally
# audited. LEAN: adds NO new dependency.
dual-leaf = ["sparq-zk/dual-leaf"]
# [OPUS-4.8] sq-cfmv: passthrough of sparq-zk's `value-only` research dial so the
# dispatch matrix can be exercised against the `ValueOnlyV1` method. OFF by
# default; a benchmark/research dial only (never production). Enabling it also
# turns the value-lane on.
commitment-value-only = ["dual-leaf", "sparq-zk/commitment-value-only"]
# [FABLE-5]-era / [OPUS-4.8] sq-3kd2g.6: the WAVE-1 EXTENDED-FRAGMENT surface —
# the bounded-depth property-path circuit-family member id
# (`CircuitId::PathReach` / `ProofInputs::PathReach`, over `zk/compose/`'s
# `path_reach_d{d}_k{k}_n{n}` family, sq-3kd2g.2), the per-solution UNION
# branch-attribution + VALUES row-index disclosure schema
# (`manifest::BranchWitness`), and the FAIL-CLOSED fragment dispatch gate
# (`verifier::dispatch_fragment`) that routes a manifest to the right member and
# REFUSES anything outside the proven-sound fragment. OFF by default: the default
# verifier surface is byte-unchanged. LEAN — adds NO new dependency (it consumes
# `sparq-zk`'s already-present `verify::fragment_query`). Soundness posture
# UNCHANGED: the verifier is internally re-audited but NOT externally audited
# (sq-qhy4 pending); no soundness/privacy claim.
extended-fragment = []
# [OPUS-4.8] sq-rsd3v.1: the single-use NULLIFIER primitive — the host witness +
# Prover.toml renderer for the (sq-wvne) nullifier member and the verifier-side
# per-epoch DOUBLE-SPEND seen-set gate (`SeenNullifiers`, reusing the audit-#4
# durable store). The in-circuit gadget itself is
# `sparq_zk_compose_core::nullifier` (compiled + constraint-tested in tests.nr).
# OFF by default: the default verifier surface is byte-unchanged. LEAN — adds NO new
# dependency (it consumes `sparq-zk`'s already-present `sig::nullifier` +
# `poseidon2`). Per-holder-per-epoch RATE-LIMIT granularity, NOT a per-presentation
# single-use token; NEW in-circuit soundness surface, NOT-yet-sound (sq-qhy4). The
# compiled/provable member + ProofManifest verify-pipeline wiring (an unlinkable
# presentation) is the larger sq-wvne follow-up.
zk-nullifier = []

[dependencies]
sparq-zk = { path = "../sparq-zk" }
oxrdf = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# [OPUS-4.8] sq-aih (audit #4 durability): advisory file locking (`flock`) for the
# DURABLE single-use nonce store (`FileSeenNonces`). Cross-process atomic
# check-and-append. This crate is native-only (it drives nargo/bb subprocesses and
# nothing in the workspace depends on it), so `libc` never reaches the wasm build.
libc = { workspace = true }

[dev-dependencies]
# Deterministic temp dirs for prove/verify e2e.
