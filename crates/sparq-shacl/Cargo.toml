[package]
name = "sparq-shacl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in SHACL validation for the sparq RDF engine (Core constraints plus SHACL-SPARQL sh:sparql): shapes-graph parsing, constraint evaluation and W3C-vocabulary validation reports"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Opt-in SHACL (the sparq-reason isolation pattern): a SEPARATE crate so the core
# engine carries zero SHACL code, deps, or runtime cost by default — validation is
# engaged only by depending on this crate. Off the wasm path by default; opted into
# the wasm graph ONLY by `sparq-wasm`'s non-default `shacl` feature (sq-yqi1, #162),
# in which case the wasm32 dep rows below keep the bundle lean (no rayon/regex/digest).

# [OPUS-4.8] sq-jxl0: wire docs.rs to build all-features + the `docsrs` cfg so the README
# front page and every feature-gated item (e.g. `shacl-af`) render on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
oxrdf.workspace = true
oxttl.workspace = true
# Algebra-level pre-binding of $this (a VALUES injection on the parsed sh:select) — more
# robust than textual substitution. The same vendored spargebra the engine parses with.
spargebra.workspace = true
rustc-hash.workspace = true
# sh:pattern / sh:flags. Pure Rust (wasm-compatible) and small; kept in the wasm
# graph for full sh:pattern parity (it is NOT one of the wasm-deps-guard forbidden
# native-only crates).
regex = "1"

# [OPUS-4.8] sq-yqi1 (#162): SHACL-SPARQL (sh:sparql, W3C SHACL §5.2) routes its
# sh:select/sh:ask query and SHACL-AF rules through the SPARQL engine. On NATIVE the
# engine keeps its defaults (parallel/regex/digest). On wasm32 — the only build that
# enters the browser bundle, via `sparq-wasm`'s opt-in `shacl` feature — defaults are
# OFF so rayon never leaks in (wasm-deps-guard) and the bundle stays lean. sparq-engine
# does NOT depend on sparq-shacl, so there is no dependency cycle either way.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sparq-engine = { path = "../sparq-engine", version = "0.1.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sparq-engine = { path = "../sparq-engine", version = "0.1.1", default-features = false }

[features]
default = []
# [OPUS-4.8] sq-d1dw: SHACL Advanced Features (SHACL-AF) rules — `sh:rule`
# (sh:TripleRule + sh:SPARQLRule). OPT-IN: the base SHACL Core + SHACL-SPARQL
# validation path is entirely unaffected when this is off (no extra shape parsing,
# no rule code compiled in). Reuses the same `sparq-engine` SPARQL machinery the
# `sh:sparql` path already depends on (CONSTRUCT for sh:SPARQLRule, ASK for
# sh:condition gating). See `skills/shacl-validation/SKILL.md` and the crate README.
shacl-af = []
# [OPUS-4.8] sq-v0b8 (#796): SHACL Compact Syntax (SCS) PARSER — text → SHACL
# shapes triples (the parse direction of the SCS surface; the display direction
# ships client-side in the site). OPT-IN: a hand-rolled lexer + recursive-descent
# parser over `oxrdf` term construction the crate already pulls in, so this adds
# ZERO new dependencies and the base validation path (plus the default + wasm
# bundles) carry no parser code when off. See the crate README and
# `skills/shacl-validation/SKILL.md`.
scs = []
# [FABLE-5] sq-uz0 (#3405): sh:shapesGraph / owl:imports shapes-graph ASSEMBLY
# (W3C SHACL §§3.1/3.3 (shapes-graph)) — discovers the data graph's `sh:shapesGraph` references and
# unions them with their transitive, cycle-guarded `owl:imports` closure via a
# caller-supplied IRI → Graph loader (the engine itself never dereferences the
# network). OPT-IN: a pure-traversal module over `GraphView` + `Dict` the crate
# already uses (zero new dependencies); the base validation path carries no
# assembly code when off.
imports = []

[dev-dependencies]
# [SONNET-4.6] sq-z1xv8 — the shared ratchet-floor constants. DEV-ONLY (zero-dep,
# `publish = false`): the conformance ratchet floor this crate's test runner enforces is
# the SAME `const` sparq-conformance's central scoreboard reports, so the two cannot
# drift, and the dep edge puts this crate in the floors crate's reverse-dependency
# closure (which is what makes CI test-selection sound for the floor — it replaces the
# guard test's old runtime read of this file's source).
sparq-conformance-floors = { path = "../sparq-conformance-floors" }
# [OPUS-4.8] sq-55c1: the differential-fuzz harness (tests/diff_fuzz.rs) talks to
# the pluggable reference-engine adapter over JSON (request out, normalised report
# in). serde derive on the report structs; serde_json for (de)serialisation — the
# same `serde_json = "1"` direct-dep convention sparq-bench / sparq-conformance use.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
