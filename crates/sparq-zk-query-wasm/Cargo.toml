[package]
name = "sparq-zk-query-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Research-grade JSON adapter for bounded query proofs; not externally audited"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sparq-zk-query = { path = "../sparq-zk-query" }
sparq-merkle-suite = { path = "../sparq-merkle-suite" }
sparq-query-protocol = { path = "../sparq-query-protocol" }
sparq-zk-compose = { path = "../sparq-zk-compose" }
sparq-zk = { path = "../sparq-zk" }
sparq-core = { path = "../sparq-core" }
oxrdf.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.122"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_current = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_latest = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom_latest = { package = "getrandom", version = "0.4" }

# The native package contract is selected explicitly by the live-toolchain lane.
[[test]]
name = "live"
path = "tests/live.rs"
test = false
