[package]
name = "sparq-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Compressed (multi-member gzip / multi-frame zstd) serialization of sparq query results; design gated on the measured baseline in research/custom-parsers-baseline.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] sq-ieqz: surface the crate-LOCAL README, not the root one. Harmless here
# (publish = false, never reaches crates.io) but kept consistent with sparq-serve;
# lib.rs mirrors it via `#![doc = include_str!("../README.md")]` for rustdoc parity.
readme = "README.md"
publish = false

# Codec deps live HERE and nowhere closer to the engine: this crate must never
# enter the sparq-wasm dependency graph (guard: `cargo tree -p sparq-wasm -e
# normal` shows no sparq-parse/zstd/flate2). Same flate2/zstd versions the CLI
# pins, so the lockfile stays single-versioned.

# [OPUS-4.8] (sq-i3xc, lever H5) `zlib-ng`: opt-in, OFF by default, NATIVE-ONLY
# faster gzip backend (zlib-ng C library via flate2) — a measured 1.5–3× inflate at
# ~zero code change. SAFE here because this crate is never in the sparq-wasm graph
# (`cargo tree -p sparq-wasm -e normal` shows no sparq-parse), so the C dep can never
# reach the wasm bundle. The default flate2 backend stays pure-Rust miniz_oxide.
[features]
zlib-ng = ["flate2/zlib-ng"]
# [GPT-5.6] (sq-98w7z.2) Pure-Rust zlib-rs encoder backend, opt-in and OFF by
# default so the existing miniz_oxide default and lean/wasm graphs are unchanged.
# [OPUS-5] (sq-98w7z.2) MEASURED, not taken on faith: a large encoder win at
# gzip -6 for a negligible ratio cost, but at -1 it trades ratio for speed — see
# the "Gzip encoder backend" rustdoc section before enabling it. NOTE the flate2
# precedence rule: `zlib-ng` (C) outranks `zlib-rs` outranks `miniz_oxide`, so
# enabling both gives zlib-ng and `--all-features` does NOT exercise this one.
zlib-rs = ["flate2/zlib-rs"]

[dependencies]
# Multi-member gzip (one RFC 1952 member per result chunk).
flate2 = "1"
# Multi-frame zstd + dictionary training/compression (zdict_builder is a default feature).
zstd = "0.13"
# Parallel chunk compression (CompressedSink Mode::Parallel).
rayon = { workspace = true }

[dev-dependencies]
# Property tests for codec/member round-trip and concatenation invariants. This
# stays test-only and uses the workspace's existing proptest supply-chain
# exemption.
proptest = "1"
