[package]
name = "sparq-lws-ysync"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Internal Yjs room relay and append-only room log"
publish = false

[dependencies]
# yrs >=0.27 uses if-let guards requiring Rust 1.95; keep the Rust 1.88 MSRV.
yrs = { version = ">=0.26.0, <0.27.0", features = ["sync"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
