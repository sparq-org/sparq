[package]
name = "sparq-shaclc"
# Not in the crates.io publish set (release-plz.toml). Published crates reach this crate only
# through optional features, which scripts/publish-strip.py removes from their packaged
# manifests; see docs/release.md "crates.io publish set".
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in SHACL Compact Syntax (1.2 + extended) parser for the sparq RDF engine: rdf-shuttle-generated strict/extended parsers emitting oxrdf shapes triples"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Opt-in SHACL Compact Syntax (epic sq-tonhr, child sq-tonhr.6): a SEPARATE crate
# (the sparq-reason / sparq-shacl isolation pattern) so the core engine and the
# existing sparq-shacl validation path carry ZERO SCS-parser code, deps, or runtime
# cost unless a consumer depends on this crate. No cargo features: the whole crate
# is the opt-in unit (cf. sparq-algos), so the workspace default lane exercises its
# entire surface and no feature-matrix leg is needed.
#
# The parsers in src/raw/ are GENERATED by rdf-shuttle's gen-rs backend from
# grammar/shaclc12ext.shuttle (vendored; provenance pinned in src/provenance.rs) and
# checked in — no build-time codegen, no Node in the build graph. Regenerate with
# scripts/regen-shuttle-parsers.sh; the tests/provenance_drift.rs test fails if the
# vendored grammar drifts from the recorded pin. [FABLE-5]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The only runtime dependency: the generated parsers themselves are std-only, and
# the public API converts their term model into the same `oxrdf` shapes triples
# the rest of the SHACL stack consumes (rdf-12 for triple terms + dir-lang).
oxrdf.workspace = true

[dev-dependencies]
# Independent .ttl oracle for the vendored conformance corpus (NOT the code under
# test): the same parser family the sparq-shacl suites trust.
oxttl.workspace = true
# Differential oracle: the hand-rolled standard-SCS parser this crate coexists
# with (sq-tonhr.6 acceptance: identical triple sets on every fixture both accept).
sparq-shacl = { path = "../sparq-shacl", features = ["scs"] }
# Grammar-drift check: recompute the vendored grammar's SHA-256 against the pin
# recorded at generation time (same crate+version sparq-canon already vets).
sha2 = "0.10"
