[package]
name = "sparq-lws-authn"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The interface between the Linked Web Storage authorization server and its authentication suites, and the JOSE and time helpers the suites share."
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["solid", "lws", "authentication", "oauth"]
categories = ["authentication"]
readme = "README.md"
publish = false

[dependencies]
async-trait = "0.1"
aws-lc-rs = "1"
base64 = "0.22"
getrandom = "0.2"
oxiri = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "jwk", "std"] }
serde_json = "1"
sha2 = "0.10"
