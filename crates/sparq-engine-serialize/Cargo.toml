# [OPUS-4.8] (sq-6vshe.4) Seam 1 of the sparq-engine facade split (RFC
# research/engine-split-rfc.md §4 Option A / §7 Phase A1). This crate holds the RDF
# writer matrix (Turtle / TriG / N-Quads / JSON-LD, buffered + streaming) peeled out of
# `sparq-engine`. `sparq-engine` re-exports it verbatim as `sparq_engine::serialize`, so
# the public API + the `serialize-rdf` / `streaming-serialization` feature names are
# unchanged for external users. This remains an implementation crate rather than a
# supported front door, but it must be published because Cargo registry packages cannot
# depend on workspace-only crates. Depend on the `sparq-engine` facade, not this crate.
[package]
name = "sparq-engine-serialize"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Implementation crate for sparq-engine's RDF serializer matrix, re-exported as sparq_engine::serialize"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# [GPT-5.6] Published only to satisfy sparq-engine's crates.io dependency closure.

# Render the README as the docs.rs front page and document with all features so the
# `serialize-rdf` writer surface appears (mirrors sparq-engine).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The whole writer matrix is behind `serialize-rdf`, mirroring the gating this code had
# inside sparq-engine (`#[cfg(feature = "serialize-rdf")] pub mod serialize;`). When off
# (the default), the crate compiles EMPTY and pulls in ZERO dependencies (`sparq-jsonld`
# is optional and only enters via this feature) — the byte-identical feature-off contract.
serialize-rdf = ["dep:sparq-jsonld"]
# Streaming Turtle / TriG serialisation (the `#[cfg(feature = "streaming-serialization")]`
# sites in serialize.rs). IMPLIES `serialize-rdf` (it reuses the shared writer helpers),
# exactly like the original sparq-engine feature.
streaming-serialization = ["serialize-rdf"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (the path is used locally and the version is used on crates.io).
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
oxrdf.workspace = true
# [OPUS-4.8] The JSON-LD writer's `Json` AST lives in the zero-dependency `sparq-jsonld`
# crate; the writer re-exports it. OPTIONAL + pulled in ONLY by `serialize-rdf`, so an
# empty (feature-off) build never compiles it — preserving the writer's dep-free contract.
sparq-jsonld = { path = "../sparq-jsonld", version = "0.1.1", optional = true, default-features = false }

[dev-dependencies]
# The round-trip / isomorphism tests parse the emitted document back to RDF, so they need
# sparq-core's parser (`Graph::load_str` / `load_dataset`) with default features on.
# [GPT-5.6] (sq-lzaw6) JSON-LD is needed only by the round-trip integration tests:
# the production dependency above remains default-feature-free and lean.
sparq-core = { path = "../sparq-core", version = "0.1.1", features = ["jsonld"] }
# The JSON-LD writer's round-trip tests parse the emitted JSON DOM with serde_json — a
# DEV-only dependency, so the opt-in `serialize-rdf` feature itself stays dependency-free
# (the native writer emits JSON by hand). serde_json is already in the workspace tree.
serde_json = "1"
# [GPT-5.6] (sq-wruhj) Property generators for writer/parser round-trip tests only.
proptest = "1"

# [FABLE-5] (sq-hmd7l.14) The bench/serialize/ comparative-harness runner. Gated on the
# writer features it exercises, so the default (feature-off) build never compiles it —
# `cargo build --release -p sparq-engine-serialize --features
# serialize-rdf,streaming-serialization --example serialize_bench`.
[[example]]
name = "serialize_bench"
required-features = ["serialize-rdf", "streaming-serialization"]
