[package]
name = "sparq-lws-crypt"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native key providers and the e1 blob envelope for Linked Web Storage"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
aws-lc-rs = "1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
