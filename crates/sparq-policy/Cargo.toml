[package]
name = "sparq-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ODRL usage-control policy evaluator for the sparq RDF engine: parse ODRL Permission/Prohibition/Duty rules from RDF and evaluate an access request to a fail-closed ALLOW/DENY decision (single-node base case)"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [OPUS-4.8] sq-r06h. OPT-IN policy layer (the sparq-reason / sparq-solid isolation
# pattern): a SEPARATE crate so the core engine carries zero ODRL/usage-control code,
# deps, or runtime cost — it is a dependency of NOTHING in the workspace. It builds ON
# the existing N3/EYE reasoner + the sparq-solid WAC/ACP allow/deny enforcement model.
# Design: research/feature-research-odrl-policy.md (epic sq-3183, candidate #1).
#
# The single-node ODRL base case is complete; the headline federated-disclosure /
# ODRL→MPC composition (research doc §2) remains deferred. [GPT-5.6] This crate is
# published because sparq-server and sparq-solid expose it behind default-off features.

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io.
sparq-core = { path = "../sparq-core", version = "0.1.1", default-features = false }
sparq-engine = { path = "../sparq-engine", version = "0.1.1", default-features = false }
oxrdf.workspace = true
# OPTIONAL — `secprop-leftoperands` feature only (sq-3705). The shared `secx:` IRI
# constants, single-sourced in a ZERO-dependency leaf so this crate's `DIM_*` are the
# SAME strings `sparq-trust` and `sparq-zk` use without any of them depending on each
# other. It has no dependencies of its own, so the lean graph above is unchanged.
sparq-secprop-vocab = { path = "../sparq-secprop-vocab", version = "0.1.1", optional = true }

[features]
# [OPUS-4.8] sq-zi5w: STATEFUL `odrl:count` constraint enforcement — a usage-counter
# store + an atomic exercise path that increments per use and denies once the limit is
# reached. OFF by default (lean core): the default evaluator treats `odrl:count` as the
# stateless numeric constraint it always was (the caller supplies the count in the
# request context). Turning this on adds the `count` module (an injectable
# `UsageCounterStore` trait + an in-memory `Mutex`-backed default impl), the `count_file`
# module ([OPUS-4.8] sq-5z1q: a cross-process file+lockfile store), and the `count_backend`
# module ([OPUS-4.8] sq-u3yo: the `AtomicCounterBackend` Redis/SQL seam + `BackendCounterStore`
# adapter). ALL std-only — no new deps (the operator brings their own Redis/SQL client); it
# does NOT change the stateless `evaluate` path.
count-enforcement = []

# [OPUS-4.8] sq-uor3g (epic sq-0dksu, Phase 4): the sparq security-property ODRL
# PROFILE — the custom `secx:requires…` leftOperands made FIRST-CLASS (their IRIs as
# Rust constants + the leftOperand→dimension map + a recogniser + the published
# `odrl:Profile` IRI). OFF by default (lean core): the default evaluator already
# parses + evaluates such a constraint as an opaque custom leftOperand; this feature
# adds the `secprop` module + the published profile document
# (`ontologies/odrl-secprop-profile.ttl`) so a conforming ODRL processor admits the
# leftOperands and a host can recognise them. Std-only — NO new dep (`const &str` data
# + a TTL drift test, strictly additive); it does NOT change the `evaluate` path. The
# bridge NAMES the requireable security-property dimensions; it asserts NO security
# property of any method (sparq's ZK estate is research-grade + externally UNAUDITED,
# sq-qhy4 — the admissibility reduction itself is Phases 2/5, not this profile).
#
# [OPUS-5] sq-3705: the dimension IRIs this profile ranges over are no longer a fourth
# hand-kept copy — `DIM_*` are `pub use` aliases of `sparq-secprop-vocab`, the
# ZERO-dependency leaf that owns the `secx:` constants, the canonical `secprop-ext.ttl`
# and the single drift test. This crate could never take the `sparq-trust` edge (it
# would drag sparq-zk + sparq-canon + sparq-shacl + sparq-reason onto a deliberately
# lean graph) and so pinned its copies with a cross-package `include_str!` instead; the
# leaf costs it a `const &str` table and nothing else, so the lean posture is intact and
# the copies + the file reads are gone.
secprop-leftoperands = ["dep:sparq-secprop-vocab"]

# [GPT-5.6] sq-mu4au: deterministic, read-only aggregation of already-computed
# authorization decisions. OFF by default and std-only; does not alter evaluation.
decision-report = []

[dev-dependencies]
# [SONNET-4.6] sq-z1xv8 — the shared ratchet-floor constants. DEV-ONLY (zero-dep,
# `publish = false`): the conformance ratchet floor this crate's test runner enforces is
# the SAME `const` sparq-conformance's central scoreboard reports, so the two cannot
# drift, and the dep edge puts this crate in the floors crate's reverse-dependency
# closure (which is what makes CI test-selection sound for the floor — it replaces the
# guard test's old runtime read of this file's source).
sparq-conformance-floors = { path = "../sparq-conformance-floors" }
