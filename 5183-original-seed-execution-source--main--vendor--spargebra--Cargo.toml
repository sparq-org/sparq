[workspace]

[package]
edition = "2024"
rust-version = "1.87"
name = "spargebra"
version = "0.4.6"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SPARQL parser"
documentation = "https://docs.rs/spargebra"
readme = "README.md"
keywords = ["SPARQL"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/spargebra"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = []
sep-0002 = []
sep-0006 = []
sparql-12 = ["oxrdf/rdf-12"]
standard-unicode-escaping = []

[lib]
name = "spargebra"
path = "src/lib.rs"

# [OPUS-4.8] The upstream manifest sets `autotests = false` (the published crate
# ships no `tests/` dir; oxigraph validates it via an external suite). The vendored
# fork adds a regression test for the recursion-depth cap (SPARQ-PATCHES.md §8,
# bead sq-v5dg), so the target must be declared explicitly. Not an upstream change.
[[test]]
name = "recursion_depth"
path = "tests/recursion_depth.rs"

# [OPUS-4.8] Regression test for the custom-aggregate DISTINCT parse fix
# (SPARQ-PATCHES.md §9, bead sq-fldo). Declared explicitly for the same
# `autotests = false` reason as the recursion-depth target above. Not an
# upstream change.
[[test]]
name = "custom_aggregate_distinct"
path = "tests/custom_aggregate_distinct.rs"

[dependencies.oxilangtag]
version = "0.1"

[dependencies.oxiri]
version = "0.2.11"

[dependencies.oxrdf]
version = "=0.3.3"

[dependencies.peg]
version = "0.8"

# Upstream's range is ">=0.8,<0.10" — narrowed to 0.9 (what the crates.io
# spargebra 0.4.6 artifact actually resolves to). As a path patch this manifest
# re-resolves inside OUR workspace, where cargo unifies the range onto the
# pre-existing rand 0.8 lock entry (tungstenite's) — and rand 0.8's getrandom
# 0.2 has no enabled wasm32-unknown-unknown backend, which breaks the
# sparq-wasm build (sparq-wasm configures getrandom 0.3's wasm_js backend
# only). Pinning 0.9 keeps the dependency graph identical to the published
# crate. See SPARQ-PATCHES.md §7.
[dependencies.rand]
version = "0.9"

[dependencies.thiserror]
version = ">=1.0.50, <3.0"

