# [SONNET-4.6] sq-hmd7l.13 — smoke fixture in the LDBC Graphalytics dataset format.
#
# NOT an LDBC-distributed dataset. This is a sparq-authored 10-vertex / 11-edge graph
# written in the Graphalytics on-disk format so the harness exercises the REAL format
# parser and the REAL validation gate without a multi-gigabyte download. Point
# GRAPHALYTICS_DATA_DIR + GX_DATASET at a genuine LDBC dataset for a real run — see
# bench/graphalytics/README.md.
#
# Shape chosen to exercise the parts of the spec that are easy to get silently wrong:
#   * vertices 7 and 10 are DANGLING (out-degree 0) -> the PageRank dangling-mass
#     redistribution term is load-bearing, not dead code.
#   * vertex 10 is ISOLATED (present in the .v file, in no edge) -> it must survive the
#     RDF projection as a degree-0 node and form its own WCC.
#   * three weakly connected components: {1..6}, {7,8,9}, {10}.

graph.smoke-directed.directed = true
graph.smoke-directed.vertex-file = smoke-directed.v
graph.smoke-directed.edge-file = smoke-directed.e
graph.smoke-directed.number-of-vertices = 10
graph.smoke-directed.number-of-edges = 11

# The algorithms this fixture ships reference outputs for. BFS / LCC / SSSP are absent
# because sparq-algos does not implement them — the harness reports those as FEATURE GAP
# rows rather than shipping a reference nothing can be validated against.
graph.smoke-directed.algorithms = pr, wcc, cdlp

graph.smoke-directed.pr.damping-factor = 0.85
graph.smoke-directed.pr.num-iterations = 10
graph.smoke-directed.cdlp.max-iterations = 5
