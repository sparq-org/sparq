# [OPUS-4.8] (sq-ustq, design §3.4) FULL-TEXT-SEARCH suite — exercises sparq-text (BM25 inverted
# index + text: magic predicates: matches/matchesAny/prefix/phrase/near). Two axes: a deterministic
# latency-axis STRUCTURE gate (per-commit) + an IR-quality BEIR axis (gather-only, not yet wired).
[[benchmark]]
id          = "text-index-bench"
name        = "Full-text search — synthetic BM25 corpus (text:matches/phrase/near)"
category    = "query"
measures    = "per-workload query latency (us) for and_terms/or_terms/prefix4/phrase/near_slop2 over a synthetic BM25 index, plus the advisory index build time. run.sh carries a HARD self-asserting gate: each workload's TOTAL hit count (summed over a FIXED 200-query set, drawn from an independent seed) AND the integer index bytes-per-doc are asserted vs expected.tsv (deterministic at the pinned corpus; exit 1 on drift). The bytes-per-doc additionally has a mode:auto ratchet (fts_bytes_per_doc in bench/perf-baseline.json). Timing is ADVISORY (mode:noise, trend-only)"
invoke      = "cargo build --release -p sparq-text --example bench_text && bench/fts/run.sh   # self-contained: synthetic in-process corpus (N=100000 seed=0), assert hit counts + bytes_per_doc vs expected.tsv; CI runs it via scripts/ci-bench.sh -> text_<workload>_us + fts_bytes_per_doc"
source      = "bench/fts/{gen.sh,run.sh,expected.tsv,README.md}; crates/sparq-text/examples/bench_text.rs (the G1 TSV-emitting runner); scripts/ci-bench.sh (fts hook); competitors bench/competitors.json (jena-text http-sparql / lucene-anserini python-lib)"
dataset     = "SYNTHETIC, generated in-process (no external generator): N seeded 8-word literals over a ~10k-term Zipf-skewed vocab, loaded as N-Triples; per-commit N=100000 seed=0, heavy/latency tier N=1000000. The hit counts + bytes-per-doc are deterministic constants at the pinned (N, seed); the FIXED query set is drawn from an INDEPENDENT seed so counts shift only on search-semantics changes. IR-quality (BEIR Recall@100/nDCG@10) axis is gather-only, not yet wired (follow-up bead)"
quiet_box_sensitive = true  # wall-clock query/build time trend-only, NOT in scripts/perf-gate.py; the hit-count + bytes_per_doc diff IS a hard gate (deterministic, load-robust)
pinning     = "N=100000 seed=0 (the corpus PIN; expected.tsv binds to it); FIXED 200-query set seeded independently; fts_bytes_per_doc floor in bench/perf-baseline.json. Solr/ES are NOT SPARQL competitors and are kept off the dashboard; surface peer is Fuseki+jena-text (http-sparql), kernel ref is Lucene/Anserini (labelled sub-component, not an RDF benchmark)"
records_to  = "stdout (TSV); CI emits text_<workload>_us + text_build_s (advisory) and fts_bytes_per_doc (gated) into benchmark-data via scripts/ci-bench.sh; deterministic gates in bench/fts/expected.tsv"
status      = "ok"

# [OPUS-4.8] sq-v02y — Vector / ANN suite (the 4th capability-surface suite, after SHACL/FTS;
# design §3.3). Promotes the crate recall gate tests into a tracked recall-DEFICIT metric.
[[benchmark]]
id          = "vector-ann-bench"
name        = "Vector / ANN — recall@10 vs exact-kNN (HNSW / Vamana / PQ), as a deficit"
category    = "query"
measures    = "per-searcher recall@10 vs nearest_exact emitted as a DEFICIT (recall_deficit_milli = round((1-recall)*1000); design G4 — smaller-is-better, slots into mode:auto with zero perf-gate change), plus advisory per-query latency + HNSW build time. run.sh carries a HARD self-asserting gate: diskann/pq deficits are EXACT-gated vs expected.tsv (single-threaded fixed-seed builds => byte-deterministic) AND clear their floors; hnsw is FLOOR-gated only (instant-distance build is rayon-parallel => +/-1 deficit jitter, so exact equality would flake). The diskann/pq deficits additionally have a mode:auto ratchet (vectors_diskann_recall_at10 / vectors_pq_recall_at10 in bench/perf-baseline.json). Timing is ADVISORY (mode:noise, trend-only)"
invoke      = "cargo build --release -p sparq-vectors --example bench_vectors --features approx-ann && bench/vector/run.sh   # --features approx-ann is required (the example links the HNSW VectorIndex; the example declares required-features); self-contained: synthetic in-process corpus (N=50000 seed=0), assert recall deficits vs expected.tsv; CI runs it via scripts/ci-bench.sh -> vectors_<searcher>_recall_at10 + vectors_<searcher>_query_us"
source      = "bench/vector/{gen.sh,run.sh,expected.tsv,README.md}; crates/sparq-vectors/examples/bench_vectors.rs (the G1 TSV-emitting runner; same recall measurement as tests/{recall,diskann,quant}.rs); scripts/ci-bench.sh (vector hook); competitors bench/competitors.json (ann-benchmarks python-lib: hnswlib/faiss/scann/diskann-ref)"
dataset     = "SYNTHETIC, generated in-process (no external generator): N seeded 32-d vectors (splitmix64), HNSW/DiskANN substrate scales with N; PQ on a FIXED 10k clustered set (quant.rs regime). Per-commit N=50000 seed=0 (the same 50k x 32 set the crate recall gates use). recall@10 vs the nearest_exact brute-force ground truth is deterministic at the pinned (N, seed) for diskann/pq; hnsw has +/-1 parallel-build jitter. The big published ANN datasets (SIFT1M / GloVe-100-angular) recall-QPS Pareto is gather-tier (follow-up bead)"
quiet_box_sensitive = true  # wall-clock query/build time trend-only, NOT in scripts/perf-gate.py; the recall-deficit diff IS a hard gate (deterministic for diskann/pq, floor-gated for hnsw)
pinning     = "N=50000 seed=0 (the corpus PIN; expected.tsv binds to it); FIXED 100-query set seeded independently; vectors_diskann_recall_at10 / vectors_pq_recall_at10 floors in bench/perf-baseline.json (DERIVED BY RUNNING). Competitor harness is ann-benchmarks-style: recall-QPS Pareto at MATCHED recall (NEVER a single latency); kernel peers hnswlib/FAISS/ScaNN/DiskANN-ref (python-lib + exact-kNN oracle); Qdrant/Milvus/Weaviate loose-only. No competitor does ANN-inside-SPARQL over dict-encoded ids (uncontested surface)"
records_to  = "stdout (TSV); CI emits vectors_<searcher>_recall_at10 (deficit) + vectors_<searcher>_query_us + vectors_build_s into benchmark-data via scripts/ci-bench.sh; deterministic gates in bench/vector/expected.tsv"
status      = "ok"

