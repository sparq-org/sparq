# [OPUS-4.8] sparq benchmark registry — authored by Opus 4.8 (Fable unavailable;
# flag for re-review when Fable returns). Machine-readable catalog of EVERY
# benchmark/measurement in the repo. Companion human guide: bench/CATALOG.md.
# Companion results doc: research/BENCHMARKS.md ("what we measured"); this file
# is "what benchmarks exist + how to run them". Invocations are verified against
# the actual code/scripts as of 2026-06-13 — do not edit a command without
# re-checking the source it cites.
#
# Field semantics:
#   id                  stable slug
#   name                human title
#   category            parse | ingest | query | serve | inference | zk |
#                       compression | scaling | conformance
#   measures            what + units
#   invoke              EXACT command(s); paths relative to repo root unless noted
#   source              file(s) the invocation is defined in (provenance)
#   dataset             source + how to obtain/regenerate + approx size
#   quiet_box_sensitive true  => wall-clock throughput/latency (needs idle box)
#                       false => gate-counts/byte-identity/correctness (load-robust)
#   pinning             SHA/seed/dataset-version that must be fixed, if any
#   records_to          where results land
#   status              ok | stale | broken | external-cost | planning
#   featured            OPTIONAL bool. Set `featured = false` to mark a suite an
#                       intentionally-UNFEATURED capability suite (internal harness
#                       / micro-bench / external-cost / spike) so the merge-time
#                       gate G3 (scripts/check-new-bench-registered.py, soft-launch
#                       advisory) does NOT require a FEATURED_SUITES row in
#                       bench/dashboard/dashboard.js for it. Omit it (the default)
#                       for a capability suite that SHOULD be promoted on the
#                       dashboard. Non-capability families (cli-*/hw/ci/serve/
#                       memtier/parse/compress/wikidata/…) are exempt from the
#                       dashboard requirement without needing this flag. [OPUS-4.8]

# =============================================================================
# QUERY — engine compute + differential correctness vs reference engines
# =============================================================================

# [GPT-5.6] sq-1rg2q M1 — deterministic public-API smoke for the opt-in OO wrapper.
[[benchmark]]
id          = "sparq-wrapper-smoke"
name        = "Rust-native RDF object traversal correctness smoke"
category    = "conformance"
measures    = "correctness: outgoing traversal plus typed string access over a fixed two-triple graph; self-asserting, emits wrapper_smoke=ok"
invoke      = "cargo run -p sparq-wrapper --example wrapper_smoke"
source      = "crates/sparq-wrapper/examples/wrapper_smoke.rs"
dataset     = "fixed two-triple Turtle fixture embedded in the example"
quiet_box_sensitive = false
pinning     = "fixture and expected value are source-pinned"
records_to  = "stdout; nonzero exit or assertion panic on mismatch"
featured    = false
status      = "ok"

# [GPT-5.6] Flow-on reconciliation for seven merged suite directories that predated a registry
# disposition. Comparative suites omit `featured`; internal/reference micro-harnesses use the G3
# escape hatch. The two other flow-on suites (reason-deletion and trust-graph-closure) are already
# registered elsewhere in this catalog with `featured = false`.

