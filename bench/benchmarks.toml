# [OPUS-4.8] sq-evb1: EL classification micro-bench for the opt-in sparq-reason-el crate. The
# EL-fragment analogue of deep-taxonomy/owl-sameas (those gate the RL reasoner; this gates the
# consequence-based EL classifier). Two closed-form workloads over the SAME public
# Classifier::classify API: a deep subClassOf chain (transitive lattice, d·(d+1)/2 subsumptions)
# and a CR4 existential-traversal chain (d+1 A_i⊑B subsumptions OWL 2 RL CANNOT reach). Both are
# SELF-ASSERTING (the example asserts the closed-form closure sizes), so a silent classifier
# under-derivation fails LOUDLY — the deterministic, load-robust correctness gate; wall-clock is
# trend-only. Hermetic: the TBox is generated in-process (pure function of DEPTH, no dataset).
