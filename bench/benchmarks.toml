# [OPUS-4.8] sq-ca4 — one query per SPARQL operator family; trend-only latency coverage.
[[benchmark]]
id          = "operator-coverage"
name        = "SPARQL operator-coverage latency suite"
category    = "query"
measures    = "per-operator min-of-iters latency (us) across count/materialize/json for one query per operator family (BGP/star/chain/triangle, UNION, OPTIONAL/!bound, MINUS, FILTER {numeric,string,IN,EXISTS}, BIND, VALUES, aggregates+GROUP BY+HAVING, DISTINCT, ORDER BY+LIMIT/OFFSET, property paths {+,*,?,seq,alt,inverse,negated-set}, subquery, ASK/CONSTRUCT/DESCRIBE); each query returns a small stable non-empty result"
invoke      = "cargo build -p sparq-cli sparq-bench --release && ./target/release/sparq-bench dump 2000 /tmp/op.nt && ./target/release/sparq-cli bench /tmp/op.nt ntriples bench/operators/queries 3 count   # also materialize|json; CI runs all three via scripts/ci-bench.sh -> op_<query>_<mode>_us"
source      = "bench/operators/queries/*.rq; crates/sparq-cli/src/main.rs (run_query_suite — routes CONSTRUCT/DESCRIBE to construct_or_describe via PreparedQuery::is_graph_form); scripts/ci-bench.sh"
dataset     = "sparq-bench synthetic dump (deterministic WatDiv-flavoured social graph); queries hit fixed subjects/cities so row counts are stable across scales"
quiet_box_sensitive = true  # wall-clock latency; trend-only, NOT in the deterministic perf-gate (scripts/perf-gate.py)
pinning     = "query dir + mode; dataset deterministic; queries pinned to fixed subjects so result counts are scale-stable"
records_to  = "stdout (TSV); CI emits op_<query>_<mode>_us into benchmark-data (dev/bench) via scripts/ci-bench.sh"
# [OPUS-4.8] sq-5o5.2: trend-only operator-latency coverage, not a head-to-head competitor
