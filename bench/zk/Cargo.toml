# Criterion throughput benches for the sparq-zk commitment pipeline
# (RDFC10 canonicalization, leaf encoding, Poseidon2-BN254 folds).
# Deliberately a STANDALONE cargo project (own [workspace] table, same
# isolation pattern as bench/parse and bench/serve) so criterion and its
# dependency tree never touch the root workspace or the wasm build.
# Baselines are recorded in README.md next to this file.
[package]
name = "zk-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# The root workspace patches spargebra with the vendored W3C-conformance
# fork; sparq-zk's graph depends on it, so this detached project must apply
# the same patch.
[patch.crates-io]
spargebra = { path = "../../vendor/spargebra", package = "sparq-spargebra" }

[dependencies]
sparq-zk = { path = "../../crates/sparq-zk" }
oxrdf = { version = "0.3", features = ["rdf-12"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "zk_throughput"
harness = false

# Match the root workspace release profile (what production builds ship).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
