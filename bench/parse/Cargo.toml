# BASELINE MEASUREMENT harness for the custom-parsers design
# (research/custom-parsers-baseline.md). Deliberately a STANDALONE cargo project
# (own [workspace] table, same isolation pattern as bench/serve) so the heavy
# codec deps (flate2/zstd) never touch the root workspace or the wasm build.
# Nothing here is production code; each measurement's numbers are recorded in
# the research document.
[package]
name = "parse-baseline"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# The root workspace patches spargebra with the vendored W3C-conformance fork;
# sparq-core's build depends on the same graph, so this detached project must
# apply the same patch.
[patch.crates-io]
spargebra = { path = "../../vendor/spargebra", package = "sparq-spargebra" }

[dependencies]
# The incumbent ingestion path under test.
sparq-core = { path = "../../crates/sparq-core", features = ["parallel"] }
# Produces the SPARQL-JSON result chunks the D4 compress-bench compresses.
sparq-engine = { path = "../../crates/sparq-engine" }
# The D4 deliverable under test (CompressedSink, dictionaries).
sparq-parse = { path = "../../crates/sparq-parse" }
# [OPUS-4.8] HDT load path under test (bench-hdt / bench-hdt-zip): the direct
# sparq-side SPO decoder (`graph_from_reader`) vs the upstream wavelet-building
# path (`load_reader_via_upstream`). The `hdt` `nt` feature lets the bench build a
# realistic `.hdt` fixture from N-Triples in-process (no external rdf2hdt needed).
# [GPT-5] sq-th5i: keep the benchmark oracle on the same upstream release and
# feature set as sparq-hdt's decode-parity tests.
sparq-hdt = { path = "../../crates/sparq-hdt" }
hdt = { version = "0.7", default-features = false, features = ["nt"] }
# Reference parsers (same versions the workspace pins).
oxttl = { version = "0.2", features = ["rdf-12"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
# Codecs under test (same crates/versions sparq-cli ingest uses).
flate2 = "1"
zstd = "0.13"
bzip2 = "0.4"
# Thread-count control for the serial-vs-parallel comparisons.
rayon = "1"
# Match the production CLI environment: sparq-cli ingest runs under mimalloc.
mimalloc = "0.1"

[features]
# [FABLE-5] (sq-tonhr.2) Compiles the DEMO candidate parser row (a serial oxttl
# wrapper) into the pluggable candidate registry (src/candidate.rs) — the slot an
# rdf-shuttle generated parser (sq-tonhr.8/.9) drops into. OFF by default: the
# default build has zero candidate rows and byte-for-byte unchanged output.
candidate-demo = []

[dev-dependencies]
# [OPUS-4.8] (sq-ghjc) Test-only: PARSE the dependency-free `--json` emit back to
# assert it is valid JSON with the documented shape. The emit itself stays
# serde-free (hand-built `format!`, mirroring mpc_net_bench::cell_json); serde_json
# is a dev-dependency so it never enters the bench binary or the production build.
serde_json = "1"

[[bin]]
name = "parse-baseline"
path = "src/main.rs"

# D4 (zipped result serialization) measurements: research/custom-parsers-D4-*.md.
[[bin]]
name = "compress-bench"
path = "src/compress.rs"

# Match the root workspace release profile (sparq-cli ships with fat LTO).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
