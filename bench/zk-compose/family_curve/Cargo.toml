# [OPUS-4.8] sq-pn2: full-family prove/verify cost-curve harness.
# A STANDALONE cargo project (own [workspace], same isolation pattern as
# bench/zk and bench/parse) so nothing here touches the root workspace or the
# wasm build. It drives the sparq-zk-compose prover (nargo + bb subprocesses)
# once per circuit-family member and emits a (k, n, r, d) cost curve: prove
# time, verify time, proof size. NOT a criterion bench (each prove is ~1-2s of
# bb; criterion's repeated sampling would be wildly too slow) and NOT gated in
# CI — see README.md for how to run it.
[package]
name = "zk-compose-family-curve"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# The root workspace patches spargebra with the vendored W3C-conformance fork;
# sparq-zk's graph depends on it, so this detached project applies the same
# patch.
[patch.crates-io]
spargebra = { path = "../../../vendor/spargebra", package = "sparq-spargebra" }

[dependencies]
sparq-zk = { path = "../../../crates/sparq-zk" }
sparq-zk-compose = { path = "../../../crates/sparq-zk-compose" }
oxrdf = { version = "0.3", features = ["rdf-12"] }

[[bin]]
name = "family_curve"
path = "src/main.rs"

# Match the root workspace release profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
