# Feature-matrix fragment for `sparq-cli`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# sparq-cli: the `dump` re-serializer (forwards sparq-engine/serialize-rdf).
- name: "sparq-cli (serialize-rdf)"
  crate: "sparq-cli"
  features: "serialize-rdf"
  test: true

# [OPUS-4.8] sq-vczh2 (epic sq-2m6zm): the `terse` subcommand (forwards the LEAN
# `sparq-terse` build). The `cmd_terse` / `terse_expansion_to_json` dispatch + the
# `tests/terse_cli.rs` integration suite are `#[cfg(feature = "terse")]`, so the default CLI
# build never compiled, clippy'd or ran them. This leg builds the subcommand, runs
# `clippy --all-targets -D warnings` with the feature ON, and runs the gated `terse_cli`
# suite (keyword-echo, identity pass-through, unknown-keyword + V() loud-fail, stdin). No new
# heavy dep — sparq-terse's lean build depends only on spargebra, already in the CLI's tree.
# Verified: `cargo nextest list -p sparq-cli --features terse` shows the 5 terse_cli tests.
- name: "sparq-cli (terse)"
  crate: "sparq-cli"
  features: "terse"
  test: true

# [FABLE-5] sq-8ju74: the HDT loader hook (`hdt`) + the `to-hdt` exporter (`hdt-write`,
# which implies `hdt`). Both suites were SILENT GAPS before this leg: tests/hdt_cli.rs
# (`#[cfg(feature = "hdt")]`) and tests/hdt_write_cli.rs (`#[cfg(feature = "hdt-write")]`)
# never ran in CI because no leg enabled the features (the workflow's old SCOPE note
# excluded them for an MSRV reason that is now stale — sparq-hdt declares 1.87, at/below
# the 1.88 workspace floor, so the stable lane covers it). One combined leg: `hdt-write`
# co-enables cleanly with (and implies) `hdt`, so both suites run together.
# Verified: `cargo test -p sparq-cli --features hdt,hdt-write -- --list` shows the 2
# hdt_cli + 5 hdt_write_cli tests.
- name: "sparq-cli (hdt, hdt-write)"
  crate: "sparq-cli"
  features: "hdt,hdt-write"
  test: true

# [FABLE-5] sq-lsp7k.8: the `tabular` subcommand — materializing tabular→RDF import (CSV
# direct mapping + the R2RML materializing subset over CSV logical tables). The module,
# its inline unit tests, and tests/tabular_cli.rs (incl. the data-driven W3C-adapted R2RML
# fixture suite under tests/fixtures/r2rml/) are all `#[cfg(feature = "tabular")]`, so the
# default build never compiles or runs them — this leg is what keeps them lit in CI.
# Zero new deps (first-party RFC-4180 reader; mappings parse via sparq-core's Turtle path).
# Verified: `cargo test -p sparq-cli --features tabular -- --list` shows the 29 inline
# tabular::tests + 9 tabular_cli tests.
- name: "sparq-cli (tabular)"
  crate: "sparq-cli"
  features: "tabular"
  test: true

# [GPT-5.6] sq-lsp7k.28: the deterministic RDF triple-set `diff` subcommand and its
# subprocess contract suite are compiled only when this default-OFF feature is enabled.
- name: "sparq-cli (diff)"
  crate: "sparq-cli"
  features: "diff"
  test: true

# [FABLE-5] sq-0kq6k: `streaming-serialization` — `dump … turtle|trig` writes straight to
# stdout through the engine's streaming writers. Under the feature the BUFFERED turtle/trig
# match arms in `cmd_dump` are compiled OUT, so this leg is the only thing that builds and
# clippies the streaming dispatch + `dump_streaming`, and it runs tests/dump_streaming_cli.rs
# (`#[cfg(feature = "streaming-serialization")]`), which pins streamed output byte-equal to the
# buffered writers. Without the leg both would be silent gaps.
# Verified: `cargo test -p sparq-cli --features streaming-serialization -- --list` shows the
# 8 dump_streaming_cli tests.
- name: "sparq-cli (streaming-serialization)"
  crate: "sparq-cli"
  features: "streaming-serialization"
  test: true

# [OPUS-5] sq-2ch27 (Phase E6): the OWL 2 EL classifier surface — `--reason el` on `query`,
# `reason <f> <fmt> el`, and the `classify` subcommand (forwards `sparq-reason-el` WITH its
# `rbox` feature, i.e. the E1+E2 capability this bead depends on). Same gap as the legs above:
# the `classify` dispatch arm, `el_classify_parts` / `load_el_classified` / `cmd_classify`, and
# the whole `tests/el_cli.rs` suite are `#[cfg(feature = "el")]`, so the default build (and
# ci.yml's `--workspace --all-targets` archive, which passes NO `--features`) compiles them
# EMPTY and runs ZERO of them — this leg is the ONLY thing that executes them. The
# complementary feature-OFF assertions (a `--reason el` that refuses to fall back to `owl`; an
# absent `classify` subcommand) are `#[cfg(not(feature = "el"))]` in tests/error_paths_cli.rs
# and run in the DEFAULT lane, so both feature states are pinned. No new third-party dep —
# sparq-reason-el rides sparq-core + oxrdf + rustc-hash, already in the CLI's tree.
- name: "sparq-cli (el — OWL 2 EL classify / --reason el)"
  crate: "sparq-cli"
  features: "el"
  test: true

# [SONNET-4.6] sq-p4zci: the stratified-Datalog surface — `--reason datalog:<rules.dlog>` on
# `query` and `reason <f> <fmt> datalog:<rules.dlog>` (forwards `sparq-reason/datalog`). Same
# gap as the legs above: `load_datalog` and the whole `tests/datalog_cli.rs` suite are
# `#[cfg(feature = "datalog")]`, so the default build (and ci.yml's `--workspace --all-targets`
# archive, which passes NO `--features`) compiles them EMPTY and runs ZERO of them — this leg is
# the ONLY thing that executes them. The complementary feature-OFF assertions (a
# `--reason datalog:…` that refuses to fall back to a monotone profile, and the argument-less
# `datalog` syntax error) are `#[cfg(not(feature = "datalog"))]` in tests/error_paths_cli.rs and
# run in the DEFAULT lane, so both feature states are pinned. No new third-party dep —
# sparq-reason is already a plain CLI dep and its `datalog` feature pulls only the
# sparq-substrate rows+join slices.
# The check-run name deliberately avoids `<`/`>` (the rules-file placeholder): the leg name is
# echoed into shell steps and discovered as a REQUIRED check by name, and no existing leg name
# carries shell metacharacters.
- name: "sparq-cli (datalog — stratified Datalog reasoning profile)"
  crate: "sparq-cli"
  features: "datalog"
  test: true
