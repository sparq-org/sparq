# Feature-matrix fragment for `sparq-reason`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# sparq-reason: derivation explanations ("proof trees").
- name: "sparq-reason (explain)"
  crate: "sparq-reason"
  features: "explain"
  test: true

# [GPT-5.6] Exercise the standalone d-entail and rif-core feature-on states.
- name: "sparq-reason (d-entail)"
  crate: "sparq-reason"
  features: "d-entail"
  test: true

- name: "sparq-reason (rif-core)"
  crate: "sparq-reason"
  features: "rif-core"
  test: true

# [SONNET-4.6] sq-pbz04.5.3: RIF/XML presentation-syntax importer. rif-xml is opt-in
# (off by default); enables `sparq_reason::rif_xml::import` and pulls in quick-xml.
# Wired here post-Opus adversarial-verify so CI covers capture-avoidance + fail-closed
# + xsd:string whitespace tests in the feature-ON state.
- name: "sparq-reason (rif-xml)"
  crate: "sparq-reason"
  features: "rif-xml"
  test: true

# [FABLE-5] sq-pbz04.1.1: the shared substrate-join sweep (the rdfs2/3/7 predicate join,
# sq-yk6or, + the rdfs9 type join). DISCOVERED GAP closed here: sq-yk6or (#1301) landed the
# feature and its behaviour-neutrality equivalence tests but wired NO matrix leg, so
# `substrate_join_emits_identical_plain_branch` ran in NO CI lane. This leg builds + tests +
# clippies the feature-ON state (the per-branch equivalence tests + the whole-closure
# byte-identity pin).
- name: "sparq-reason (substrate-join)"
  crate: "sparq-reason"
  features: "substrate-join"
  test: true

# [FABLE-5] sq-pbz04.1.2: the shared substrate-compare seam (substrate seam 3 — the
# reasoner-side CompareTerm adoption for dictionary ids). This leg builds + tests +
# clippies the feature-ON state: the comparator unit tests AND tests/compare_parity.rs
# (the REAL-engine `ORDER BY` byte-identity oracle — a `required-features` target that
# would otherwise run in NO CI lane, the exact gap the substrate-join leg above closed).
- name: "sparq-reason (substrate-compare)"
  crate: "sparq-reason"
  features: "substrate-compare"
  test: true

# [FABLE-5] sq-zgbso.3 (epic sq-zgbso, issue #1582): the id-level COMPILED-rule
# evaluator for the scoped access-control N3 subset (n3::compiled — rule IR with
# pre-interned symbols over the shared sparq-substrate join kernels). This leg builds +
# tests + clippies the feature-ON state: the compile/eval unit suite AND
# tests/compiled_equivalence.rs (the closure set-equality oracle vs reason_n3 over the
# sparq-solid WAC/ACP/ODRL-spike rule corpus — a `required-features` target that would
# otherwise run in NO CI lane).
- name: "sparq-reason (compiled-rules)"
  crate: "sparq-reason"
  features: "compiled-rules"
  test: true

# [GPT-5.6] The existing default-OFF `datalog` surface includes incremental
# maintenance plus the stratified NAF, comparison, and arithmetic extensions; exercise
# their feature-gated implementations and tests.
- name: "sparq-reason (datalog)"
  crate: "sparq-reason"
  features: "datalog"
  test: true

# [Kern] kern/quoted-triple-infer (first increment): the opt-in quoted-triple
# (RDF 1.2 reifier) RL rules — reif-dtr destructure / reif-ctr construct with the
# finite-Herbrand-base restrictions (src/reify.rs docs). This leg builds + tests +
# clippies the feature-ON state: the in-module unit suite AND tests/owl_reify.rs
# (the Turtle-1.2 end-to-end fixtures + MaterializedOwlGraph Fallback parity — a
# `required-features` target that would otherwise run in NO CI lane, per the C1
