# Feature-matrix fragment for `sparq-mpc`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze).
# SCOPE (issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT: each leg's emitted check-run NAME is `opt-in <name>` (pinned by the golden
# leg-name file). Keep `name` free of the whole words "advisory"/"informational", which
# mark a check as non-blocking.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# sparq-mpc: the deterministic/seedable masking RNG seam (insecure-by-name).
- name: "sparq-mpc (insecure-test-rng)"
  crate: "sparq-mpc"
  features: "insecure-test-rng"
  test: true

# sparq-mpc: the per-protocol security-properties annotation graph (#3275/#6186).
# Both the module's own drift/honesty tests and the end-to-end
# `tests/secprop_admissibility.rs` (whole file `#![cfg(feature =
# "secprop-annotations")]`) compile out in the default state, so without this leg they
# never execute on CI.
- name: "sparq-mpc (secprop-annotations — per-protocol trust-model annotation graph)"
  crate: "sparq-mpc"
  features: "secprop-annotations"
  test: true
