# Feature-matrix fragment for `sparq-mpc`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# sparq-mpc: the deterministic/seedable masking RNG seam (insecure-by-name).
- name: "sparq-mpc (insecure-test-rng)"
  crate: "sparq-mpc"
  features: "insecure-test-rng"
  test: true

# [OPUS-5] sq-dz10l (epic sq-0dksu, Phase 6): the per-protocol security-properties
# ANNOTATION GRAPH + over-claim guards in sparq-mpc — the sibling of the sparq-zk
# `secprop-annotations` leg. The `secprop` module (`#[cfg(feature =
# "secprop-annotations")] pub mod secprop;` in lib.rs) and its 11-test integration
# suite `tests/secprop_annotations.rs` (`#![cfg(feature = "secprop-annotations")]`)
# are BOTH behind the default-OFF feature, so ci.yml's default-feature lane compiles
# them EMPTY and runs ZERO of them — the silent-skip gap this leg closes, and exactly
# what the structural C1 guard (scripts/check-feature-test-execution.py) reports as
# UNMAPPED until an executor exists. The feature pulls the optional `oxttl` Turtle
# parser (already a workspace dep) plus the ZERO-dependency `sparq-secprop-vocab` leaf
# for the `secx:` IRI constants; the crate declares no `default` feature set, so a
# default build links neither and compiles `secprop` out.
#
# The suite ASSERTS what the annotation graph records (protocol -> assumption/assurance
# claims and the four over-claim + descriptor-drift guards); it establishes NO
# soundness or privacy property of the MPC protocols themselves, which remain
# research-grade, semi-honest-only and NOT externally audited (sq-qhy4).
- name: "sparq-mpc (secprop-annotations — per-protocol annotation graph + over-claim guards)"
  crate: "sparq-mpc"
  features: "secprop-annotations"
  test: true
