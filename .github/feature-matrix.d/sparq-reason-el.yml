# [SONNET-4.6] sq-vkq9u: the COMBINED abox+cdomain leg — the `DataPropertyAssertion` POINT-RANGE
# RESCUE (`a q 5` ⇒ `{a} ⊑ ∃q.{5}`). Its OWN leg per rule (b) of feature-matrix.yml's guard: the
# rescue exists ONLY in the CONJUNCTION of the two features, so neither leg above runs a line of
# it — tests/abox_cdomain.rs is `#![cfg(all(feature = "abox", feature = "cdomain"))]` and the
# `cfg(all(…))` arms in extract.rs (`abox_data_literals`, the `cd_abox_point` map, the `abox_point`
# rescue branch) compile out on BOTH single-feature legs. It also pins the OTHER direction: the
# `#[cfg(feature = "cdomain")]` half of `src/abox.rs`'s `data_property_assertion_is_a_counted_skip`
# (the plain `abox` leg runs the `not(cdomain)` half). No new dep beyond `cdomain`'s existing
# optional sparq-substrate. Verified locally: `cargo test -p sparq-reason-el --features abox,cdomain`
# green, and green in each single-feature state.
- name: "sparq-reason-el (abox+cdomain — DataPropertyAssertion point-range rescue)"
  crate: "sparq-reason-el"
  features: "abox,cdomain"
  test: true

# [FABLE-5] sq-wy3i6 (Phase E4): sparq-reason-el's `par` feature — deterministic parallel
# (bulk-synchronous scoped-worker) CR saturation: `Classifier::classify_par` /
# `classify_graph_par`. Same gap as the legs above: tests/par_differential.rs is
# `#![cfg(feature = "par")]` (par-vs-sequential closure differentials over the CR1–CR6 +
# CR-Self fixture corpus incl. el_smoke.ttl, the delayed-filler CR4 / CRs1-reflexive-link
# mutation-witness fixtures, a multi-chunk synthetic-scale case, and the repeated-run
# determinism stress) and the whole par engine in classify.rs is `#[cfg(feature = "par")]`,
# so the default build compiles them EMPTY and runs ZERO of them. This leg is also the ONLY
# thing that exercises the par-WITHOUT-rbox link-apply arm (a `not(feature = "rbox")` code
# path). No new dep (`par = []`, std scoped threads only). The W3C-corpus differential is
# the ci.yml el-suite lane (`--features el-suite,el-suite-par`).
- name: "sparq-reason-el (par — E4 deterministic parallel saturation)"
  crate: "sparq-reason-el"
  features: "par"
  test: true

# [FABLE-5] sq-wy3i6: the COMBINED par leg — `par` composed with `rbox` (CR10/CR11) and
# `cdomain` (CR7–CR9). Its OWN leg per rule (b) of feature-matrix.yml's guard: `par`+`rbox`
# swaps the parallel apply phase onto the `add_link_rbox` role-closure arm (a
# `not(feature = …)` split from the plain-par leg above), and the
# `cfg(all(feature = "par", feature = "rbox"))` / `…"cdomain"` fixtures in
# tests/par_differential.rs (property chains / transitivity / faceted ranges under the
# parallel engine) compile EMPTY on the plain `par` leg — this leg is the only thing that
# runs them.
- name: "sparq-reason-el (par+rbox+cdomain — parallel saturation, full rule set)"
  crate: "sparq-reason-el"
  features: "par,rbox,cdomain"
  test: true

# [SONNET-4.6] sq-clsv6 (Phase E5): sparq-reason-el's `incremental` feature — incremental
# classification under TBox edits (`IncrementalClassifier`, the delta-seeded resume of a live
# CR1–CR6 saturation). Same gap as the legs above: tests/incremental.rs uses
# `sparq_reason_el::IncrementalClassifier`, which only EXISTS under this feature, and the whole
# incremental.rs module + `classify::resaturate` + the extract.rs delta helpers are
# `#[cfg(feature = "incremental")]` — so the default build (and ci.yml's `--workspace
# --all-targets` archive, which passes NO `--features`) compiles them EMPTY and runs ZERO of them.
# This leg is the ONLY thing that runs the acceptance oracle: the ELK-derived edited-TBox closure
# fixtures plus the randomized add / add-and-retract / triple-at-a-time streams that pin every
# post-edit hierarchy equal to a full re-classification. No new dep (`incremental = []`, reuses
# sparq-core + rustc-hash + oxrdf).
- name: "sparq-reason-el (incremental — E5 classification under TBox edits)"
  crate: "sparq-reason-el"
  features: "incremental"
  test: true

# [SONNET-4.6] sq-clsv6: the COMBINED incremental leg — `incremental` composed with `rbox`
# (CR10/CR11) and `cdomain` (CR7–CR9). Its OWN leg per rule (b) of feature-matrix.yml's guard:
# `incremental`+`rbox` swaps the resume onto the role-box-rebuilding arm (a `not(feature = "rbox")`
# split from the plain leg above) AND turns on the rbox_non_regular report-parity assertion, while
# `incremental`+`cdomain` is the ONLY configuration that exercises the concrete-domain fast-path
# EXCLUSION (`FullReason::ConcreteDomain` + the literal-`hasValue`/`rdf:first` whitelist arms),
# which compile out entirely on the plain `incremental` leg.
- name: "sparq-reason-el (incremental+rbox+cdomain — E5 edits, full rule set)"
  crate: "sparq-reason-el"
  features: "incremental,rbox,cdomain"
  test: true
