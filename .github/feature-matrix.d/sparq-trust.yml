# `graph` module (`derive_effective_rules` + `certification_message` + the target-set-
# contravariant / conformance-covariant shape-containment matcher) + its `graph::tests` unit
# suite + the `tests/certification_graph_e2e.rs` adversarial matrix
# (`#![cfg(feature = "cert-graph")]`) are behind the default-OFF `cert-graph` feature (which
# enables `framework-vocab`), so ci.yml's default-feature `nextest archive --workspace
# --all-targets` (which passes NO `--features`) compiles them EMPTY and runs ZERO of the
# graph unit tests + the 27-case e2e forgery/broadening matrix — the silent-skip gap (#1171)
# this leg closes. `cert-graph` is dependency-free (pure Rust over the RDFC-1.0 signature
# primitive the crate already carries — NO new dep, strictly additive), so this is a fast
# leg. The leg runs `clippy --all-targets -D warnings` with the feature ON (the real gate) +
# `cargo test`, which drives the REAL closure and the load-bearing SAFETY invariant
# (attenuation-only: a certification can only NARROW; an additive-target / partial / disjoint
