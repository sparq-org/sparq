# contract evaluation, clear path. The whole `expression` module (request parsing,
# the §3.1 normative reference rewrite Q→Q', sparq-engine evaluation over the
# holder's attested named-graph dataset, the RDF 1.2 reifier + named-graph/PROV-O
# provenance-encoded response, the independent verifier re-check, and the
# status-list bridge `mint_status_attestation`) + its 41 in-module unit tests are
# behind the default-OFF `expression` feature, so ci.yml's default-feature `nextest
# archive` (no `--features`) compiles them EMPTY and runs ZERO of them — the
# silent-skip gap (#1171) this leg closes. `expression` enables `framework-vocab` +
# `status-list` + `did` + `secprop-admissibility` (the surfaces it REUSES) and pulls
# `sparq-engine` (default-features OFF; already a transitive dep of the default
# build via sparq-reason/sparq-zk) + the vendored `spargebra` parser. The leg runs
# `clippy --all-targets -D warnings` with the feature ON (the real gate) + `cargo
# test`, which drives the REAL rewrite → engine → response → re-check path and the
# load-bearing FAIL-CLOSED invariants: no admissible derivation (untrusted issuer /
# stale or missing status window / scope violation / expired or status-uncovered
