# fails the independent Q'-over-R re-check; a non-Live status verdict can never mint
# a positive attestation. Verified locally: `cargo test -p sparq-trust --features
# expression expression` runs the 41 unit tests; build/test green in default and
# feature-ON states, rustdoc `--all-features -D warnings` clean.
#
# [SONNET-4.6] sq-6syab.6 also rides this leg: `tests/trust_expression_conformance.rs`
# (`#![cfg(feature = "expression")]`) drives the ten-entry W3C manifest under
