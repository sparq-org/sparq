# [OPUS-4.8] sq-pfae.13 (epic sq-pfae P6 follow-up): the VERIFIED status-list issuer
# signature. The `status_list::VerifyingLiveStatusCheck` path verifies the status-list
# VC's OWN issuer signature (the same sparq-zk Schnorr-over-RDFC-1.0 path `admit` uses)
# against a trusted status-authority key BEFORE trusting its bits — fail-closed on
# unsigned/bad-sig/wrong-key/unresolvable. Its DID-BOUND constructor
# (`VerifyingLiveStatusCheck::with_did_issuer`) + the two `verified_with_did_issuer_*`
# unit tests are `#[cfg(all(feature = "status-list", feature = "did"))]` — covered by NO
# single existing leg (`status-list-flate2` has `did` OFF; there is no `did` leg for this
# crate), so without this leg the DID-bound verified path runs ONLY under the
# clippy/rustdoc `--all-features` lane, never under a `cargo test` leg. This leg's
# `status-list-flate2,did` feature set is a SUPERSET of `status-list`, `status-list-flate2`,
# and the `status-list + did` combo, so a single leg reaches EVERY status-list + did test
# in the crate (the clear-key verified tests AND the DID-bound ones AND the `did` module's
# own resolver tests). The leg runs `clippy --all-targets -D warnings` with both features ON
# (the real gate) + `cargo test`, driving the REAL verify path (commit_triples →
# commitment_message → verify) and the load-bearing SAFETY invariant: a tampered/unsigned
# status-list VC is rejected (Unknown/deny), a validly-signed one accepted. Verified: `cargo
# test -p sparq-trust --features status-list-flate2,did` runs the status_list verified-sig
# unit tests (incl. the two did-bound ones) + the did module tests; clippy clean in every state.
- name: "sparq-trust (status-list-flate2,did — verified status-list issuer signature)"
  crate: "sparq-trust"
  features: "status-list-flate2,did"
  test: true

# [OPUS-4.8] sq-dt5hv (epic sq-0dksu, Phase 5) + sq-nrwqs (Phase 5.1): the opt-in
# property-admissibility PRE-CHECK in the admission gate. The `admit::precheck` module
# (`admit_with_precheck` + `AdmissibilityPreference` + `PrecheckOutcome`), its
# `admit::precheck::tests` unit tests, and the `secprop_precheck_e2e.rs` golden
# integration suite (`#![cfg(feature = "secprop-precheck")]`) are ALL behind the
# default-OFF `secprop-precheck` feature, so ci.yml's default-feature `nextest archive`
# compiles them EMPTY and runs ZERO of them — the silent-skip gap (#1171) this leg
# closes. The feature enables `secprop-admissibility` (it drives the merged Phase-2
# reduction) AND, since sq-nrwqs, `sparq-zk/secprop-annotations` — the pre-check now
# resolves the presented method's secprop annotation graph from the BUNDLED, drift-pinned
# `sparq-zk` `secprop-methods.ttl` (tamper-resistant) instead of caller-supplied N3;
# `oxttl` (its only dep) is already an optional sparq-zk dep the default build never
# pulls, so this adds NO new dependency to the lean default build. The leg runs `clippy
# --all-targets -D warnings` with the feature ON (the real gate) + `cargo test`, which
# drives the REAL admit path behind the pre-check and the load-bearing SAFETY invariants:
# with NO preference the gate is byte-identical to `admit`; a caller cannot widen a
# method's recorded posture — the annotations come from the bundled graph AND the requester
# supplies STRUCTURED constraints (validated IRIs), not raw N3, so there is no
# `secx:hasProperty`/`atLeast`/`satisfies` injection sink (the residual-channel review);
# an unknown method FAILS CLOSED (`UnknownMethod`); and an unsatisfied ODRL preference
# (e.g. `requiresAssurance gteq Proven` while sq-qhy4 is open) FAILS CLOSED — admits
# nothing, derives no grant — despite a perfectly valid credential. Verified locally:
# `cargo test -p sparq-trust --features secprop-precheck` runs the 12 precheck unit tests
# (incl. the policy-injection negative test) + the 5 `secprop_precheck_e2e.rs` golden
# tests; `clippy --all-targets -D warnings` is clean in every state.
- name: "sparq-trust (secprop-precheck — property-admissibility pre-check in admit)"
  crate: "sparq-trust"
  features: "secprop-precheck"
  test: true

