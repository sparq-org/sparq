# (#1171) this leg closes.
#
# [OPUS-5] sq-3705 moved the vocabulary itself OUT of this crate: the IRI
# constants, `secprop-ext.ttl` and the drift tests (5 unit + 4 integration)
# now live in the ZERO-dependency `sparq-secprop-vocab` leaf, which has NO
# features — so ITS tests run in the ordinary default `cargo test` lane and
# need no matrix leg. What is left here is a re-export shim, so this leg is
# now cheap in the strongest sense. It is still REQUIRED: the shim, the
# `dep:sparq-secprop-vocab` edge the feature turns on, and the guard that the
# re-export really is the leaf's data are all compiled out by default.
# Verified locally: `cargo test -p sparq-trust --features secprop-vocab`
# runs 1 `secprop::tests` unit test (the crate total is 26 in this state);
# `clippy --all-targets -D warnings` is clean in every state.
- name: "sparq-trust (secprop-vocab)"
  crate: "sparq-trust"
  features: "secprop-vocab"
  test: true

