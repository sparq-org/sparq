# Feature-matrix fragment for `sparq-zk-compose`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py.
# Adding a leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs
# for DIFFERENT crates never textually conflict (bead sq-ibrze).
# SCOPE (issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT: each leg's emitted check-run NAME is `opt-in <name>` (pinned by the golden
# leg-name file). Keep `name` free of the whole words "advisory"/"informational", which
# mark a check as non-blocking.

# sq-5xdlk: the default-OFF `dual-leaf` VALUE LANE of sparq-zk-compose.
# ci.yml's workspace lane passes no `--features`, so the value-lane surface — the
# `CircuitId::FilterValueDl{,F64,Decimal}` members, the `dispatch` fail-closed
# `(method × circuit)` matrix, the dedicated `filter_value_dl_*_prover_toml`
# renderers, and the `#![cfg(feature = "dual-leaf")]` integration suite
# `tests/dual_leaf_boolean_lane.rs` (the V1 xsd:boolean lane cross-vectors) and
# `tests/dual_leaf_v2_lanes.rs` (the DualLeafV2 lanes + the dedicated bit-domain
# `filter_value_dl_bool` member) — compiles
# EMPTY there and runs ZERO of those tests. This leg is the executor that makes them
# actually run, closing the same silent-skip class (#1171) the sparq-zk legs close.
# The feature adds NO new dependency (it only turns on sparq-zk's `dual-leaf`).
# The lane is research-grade and NOT externally audited (INV-VL downgrade, CR-G8 /
# sq-qhy4); this leg gates its BUILD/TEST/CLIPPY health, not any soundness claim.
- name: "sparq-zk-compose (dual-leaf — value-lane members + dispatch matrix + boolean-lane cross-vectors)"
  crate: "sparq-zk-compose"
  features: "dual-leaf"
  test: true

# Ordinary CI must execute this default-off result contract's host tests.
# The pinned zk-toolchain workflow separately executes its real proof tests.
- name: "sparq-zk-compose (successful-results — selected answers and private witnesses)"
  crate: "sparq-zk-compose"
  features: "successful-results"
  test: true

# sq-h732x / sq-ygk6x: the default-OFF `extended-fragment` wave-1 lane. ci.yml's
# workspace lane passes no `--features`, so `verifier::dispatch_fragment`,
# `verify_fragment_manifest` and the four branch-local binding layers — with the
# whole `fragment_dispatch_tests` module of `src/verifier.rs` — compile EMPTY
# there and run ZERO of those tests. The other two legs above do not cover them
# either (neither turns this feature on), and the zk-toolchain workflow enables
# only `dual-leaf`, so this leg is the only executor for the lane's regression
# tests. `dual-leaf` rides along because the lane's encoding-policy and
# method-aware cases are themselves `dual-leaf`-gated, and the two features are
# independent (neither implies the other).
# The lane is research-grade and NOT externally audited (sq-qhy4); this leg gates
# its BUILD/TEST/CLIPPY health, not any soundness claim.
- name: "sparq-zk-compose (extended-fragment + dual-leaf — wave-1 routing, binding layers and encoding policy)"
  crate: "sparq-zk-compose"
  features: "extended-fragment,dual-leaf"
  test: true
