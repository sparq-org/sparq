# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# [GPT-5.6] The exact all-pairs centrality algorithms are default-OFF; exercise the
# feature-gated implementation and differential/property tests in CI.
- name: "sparq-algos (centrality-extended)"
  crate: "sparq-algos"
  features: "centrality-extended"
  test: true
# [OPUS-4.8] Directed topology (SCC + topological sort) is default-OFF; exercise its
# feature-gated tests (topology.rs, topology_oracles.rs) in CI — leg was missing after #2193.
- name: "sparq-algos (topology)"
  crate: "sparq-algos"
  features: "topology"
  test: true
# [OPUS-5] sq-lsp7k.9.4: dictionary-id score maps are default-OFF; exercise the
# feature-gated cross-crate composition tests (ranking.rs) in CI.
- name: "sparq-algos (ranking)"
  crate: "sparq-algos"
  features: "ranking"
  test: true
