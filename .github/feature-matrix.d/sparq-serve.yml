# Feature-matrix fragment for `sparq-serve`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# [OPUS-4.8] sq-b4fns (gh-906): the DURABLE, REPLAYABLE change-data-capture stream
# (Neptune-Streams shape). The whole `change_stream` module + its `change_stream::tests`
# unit suite (the load-bearing `replay_from_offset_after_restart_is_exact`,
# segment-roll/recover, torn-tail recovery, and the fail-closed corruption/discontinuity
# checks) are ALL behind the default-OFF `change-stream` feature, so ci.yml's
# default-feature `nextest archive --workspace --all-targets` (which passes NO `--features`)
# compiles them EMPTY and runs ZERO of them — the silent-skip gap (#1171) this leg closes.
# The feature is dependency-free (it reuses sparq-engine's `serialize-rdf` N-Quads diff +
# the backup family's self-contained FNV-1a digest + std file IO; no new external dep, no
# HTTP/async), so this leg is cheap and reaches every change-stream test. The leg runs
# `clippy --all-targets -D warnings` with the feature ON (the real gate) + `cargo test`,
# which drives the REAL durable round-trip: write commits → drop the handle (restart) →
# reopen from disk → poll from an offset and assert the EXACT ordered change sequence, plus
# the SAFETY invariants (fail-closed on a non-forward/discontinuous commit and on
# mid-stream corruption; torn-tail recovery resumes from the last complete record).
# Verified locally: `cargo test -p sparq-serve --features change-stream --lib change_stream`
# runs the 8 change_stream unit tests; `clippy --all-targets -D warnings` is clean in the
# default, change-stream, and all-features states.
- name: "sparq-serve (change-stream — durable replayable CDC stream)"
  crate: "sparq-serve"
  features: "change-stream"
  test: true

# [OPUS-5] sq-l6zks (gh-3216): the EXTERNAL-BROKER sink seam over that durable log — the
# `ChangeSink` trait, the JSON broker-message encoding, the resumable `BrokerRelay` pump (durable
# delivered-through watermark) and the in-tree std-only `NatsSink`. The whole `change_sink` module
# and its `change_sink::tests` unit suite are behind the default-OFF `change-sink` feature, so the
# default-feature workspace test run compiles them EMPTY and runs ZERO of them — the same
# silent-skip gap (#1171) the `change-stream` leg above closes, for the new surface. `change-sink`
# implies `change-stream` and adds NO new external dependency (no broker client, no async runtime,
# no HTTP), so this leg stays cheap. It runs `clippy --all-targets -D warnings` with the feature ON
# plus `cargo test`, which drives the load-bearing invariants: the at-least-once watermark is
# DURABLE (a restarted relay resumes instead of replaying), a sink failure never advances the
# watermark past the record the broker refused, a watermark that retention has trimmed past fails
# the pump CLOSED, a re-base gap record reaches the broker as an explicit REBASE marker (never an
# empty commit), and the NATS publisher's protocol framing (byte-length PUB, PING/PONG flush
# barrier, `-ERR` surfaced, unpublishable subjects rejected before anything is written).
- name: "sparq-serve (change-sink — external-broker CDC sink seam)"
  crate: "sparq-serve"
  features: "change-sink"
  test: true

# [SONNET-5] (sq-artifact-keeper-topk) `PreparedGraphApplier` — an `ApplyUpdates` strategy
# over `sparq_engine::PreparedUpdate` (parsed once, bound per submission) instead of raw
# SPARQL Update text, avoiding `GraphApplier`'s per-commit re-parse for a repeatedly
# resubmitted template. The whole type and its `tests/prepared_applier.rs` integration
# suite are behind the default-OFF `params` feature (forwarding to sparq-engine's
# already-dependency-free `params`), so the default-feature workspace test run compiles
# `prepared_applier.rs` EMPTY and runs ZERO of its tests — the same silent-skip gap the
# change-stream/change-sink legs above close, for this surface. No new external
# dependency. The leg runs `clippy --all-targets -D warnings` with the feature ON plus
# `cargo test`, which drives the real correctness invariants through the ACTUAL sequenced
# writer (not a mock): a bound `PreparedUpdate` applies through the same structural-fork +
# delta-overlay + threshold-compaction path `GraphApplier` uses, and repeated submissions
# of the same parsed-once template drain a queue across many generations with no
# duplicate/lost claims.
# Verified locally: `cargo test -p sparq-serve --features params --test prepared_applier`
# runs both tests; `clippy --all-targets -D warnings` is clean in the default, params, and
# all-features states.
- name: "sparq-serve (params — prepared-update applier)"
  crate: "sparq-serve"
  features: "params"
  test: true
