# Feature-matrix fragment for `sparq-reason-diff`. Same contract as every fragment here
# (see sparq-cli.yml / scripts/assemble-feature-matrix.py): each leg's check-run name is
# `opt-in <name>` and GATES via the ci-summary aggregator.
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.

# [FABLE-5] sq-xg6uu: the OWL 2 RL differential-vs-external-oracle harness. The whole
# crate (deps included) is behind `rl-oracle` — a default build is an empty lib, so this
# leg is the ONLY place the rl_differential test (sparq-reason RL closure vs the
# pre-captured owlrl golden vectors + disposition ledger in bench/reason-diff/rl/) runs.
# Pure re-diff against committed fixtures: no network, no Python, owlrl never runs in CI.
- name: "sparq-reason-diff (rl-oracle)"
  crate: "sparq-reason-diff"
  features: "rl-oracle"
  test: true
