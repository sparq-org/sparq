# Feature-matrix fragment for `sparq-engine-serialize`.
#
# [OPUS-4.8] (sq-6vshe.4) Seam 1 of the sparq-engine facade split (RFC
# research/engine-split-rfc.md §4 Option A / §7 Phase A1): the RDF writer matrix — and its
# in-src tests — moved OUT of `sparq-engine` into this internal sub-crate. So the two legs
# that used to run `cargo test -p sparq-engine --features {serialize-rdf,streaming-serialization}`
# would now run ZERO writer tests (the tests live here). These legs re-target the moved tests to
# their new home so they keep RUNNING every PR. `sparq-engine` re-exports the crate verbatim as
# `sparq_engine::serialize`, so the public API + the forwarded feature NAMES are unchanged.
#
# CONTRACT (gate-critical, see sparq-engine.yml header): each leg's emitted check-run NAME is
# `opt-in <name>`, discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME
# and pinned in scripts/tests/feature-matrix-legnames.golden.txt. Keep `name` free of the whole
# words "advisory"/"informational" or the leg stops gating.
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.

# The whole writer matrix is behind `serialize-rdf`; `cargo test -p sparq-engine-serialize
# --features serialize-rdf` runs the Turtle/TriG/N-Quads/JSON-LD writer + round-trip tests.
- name: "sparq-engine-serialize (serialize-rdf)"
  crate: "sparq-engine-serialize"
  features: "serialize-rdf"
  test: true

# `streaming-serialization` (implies `serialize-rdf`) additionally compiles the streaming
# Turtle/TriG writers + their `serialize::tests::streaming::*` streamed==buffered byte-equality
# tests. `cargo test -p sparq-engine-serialize --features streaming-serialization` runs them.
- name: "sparq-engine-serialize (streaming-serialization)"
  crate: "sparq-engine-serialize"
  features: "streaming-serialization"
  test: true
