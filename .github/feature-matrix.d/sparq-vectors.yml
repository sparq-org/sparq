# --all-targets` archive, which passes NO `--features`) compiled it EMPTY and ran ZERO of its
# 6 unit tests — the silent gap this leg closes. `neuro-symbolic` IMPLIES `structure-shacl`
# (and thus `structure`), so it reuses the sparq-shacl + sparq-reason + sparq-introspect deps
# those features already pull and adds NO new dependency. This leg builds the module, runs
# `cargo test` (the 6 verify tests run only with the feature ON), and `clippy --all-targets
