# Feature-matrix fragment for `sparq-hdt`. Same contract as every fragment here (see
# sparq-cli.yml / scripts/assemble-feature-matrix.py): each leg's check-run name is
# `opt-in <name>` and GATES via the ci-summary aggregator.
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.

# [FABLE-5] sq-8ju74: the HDT WRITE path (`save` — Graph -> standard-layout .hdt via the
# direct in-memory encoder, src/write.rs + src/encode.rs). The whole tests/write_roundtrip.rs
# suite is `#![cfg(feature = "write")]`, so the default workspace test lane never ran it —
# a SILENT GAP (the byte-for-byte upstream-oracle equality proof included). The old
# feature-matrix SCOPE note excluded sparq-hdt legs for an MSRV reason that is now stale:
# sparq-hdt declares rust-version 1.87, at/below the 1.88 workspace floor, so the stable
# lane covers it. Verified: `cargo test -p sparq-hdt --features write -- --list` shows the
# write_roundtrip suite.
- name: "sparq-hdt (write)"
  crate: "sparq-hdt"
  features: "write"
  test: true

# [GPT-5.6] sq-lsp7k.24: the filtered-load integration suite is compiled only when
# `load-filter` is enabled, so give the default-OFF public API a full test executor.
- name: "sparq-hdt (load-filter)"
  crate: "sparq-hdt"
  features: "load-filter"
  test: true
