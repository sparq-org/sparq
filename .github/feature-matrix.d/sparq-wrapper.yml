# Feature-matrix fragment for `sparq-wrapper`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py.
# Each emitted check-run name is `opt-in <name>` and is discovered by the
# ci-summary gate aggregator, so names must remain unique and stable. [GPT-5.6]
#
# Implemented proposal features are default-OFF. Their code and integration tests
# therefore need explicit feature legs instead of relying on the workspace's
# default-feature lane. [SONNET-4.6] sq-1rg2q
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
- name: "sparq-wrapper (proposed-async-store)"
  crate: "sparq-wrapper"
  features: "proposed-async-store"
  test: true

- name: "sparq-wrapper (proposed-cardinality)"
  crate: "sparq-wrapper"
  features: "proposed-cardinality"
  test: true

- name: "sparq-wrapper (proposed-codecs)"
  crate: "sparq-wrapper"
  features: "proposed-codecs"
  test: true

- name: "sparq-wrapper (proposed-distinct)"
  crate: "sparq-wrapper"
  features: "proposed-distinct"
  test: true

- name: "sparq-wrapper (proposed-observe)"
  crate: "sparq-wrapper"
  features: "proposed-observe"
  test: true

- name: "sparq-wrapper (proposed-typed-focus)"
  crate: "sparq-wrapper"
  features: "proposed-typed-focus"
  test: true

# [GPT-5.6] sq-kf56o: compile and test the five proposals in composition.
- name: "sparq-wrapper (proposed-composition)"
  crate: "sparq-wrapper"
  features: "proposed-distinct,proposed-cardinality,proposed-codecs,proposed-observe,proposed-typed-focus"
  test: true

- name: "sparq-wrapper (proposed-graph-scope)"
  crate: "sparq-wrapper"
  features: "proposed-graph-scope"
  test: true

# [SONNET-4.6] sq-1rg2q.11: tests/json.rs is `#![cfg(feature = "proposed-json")]`,
# so ci.yml's default-feature lane compiles it EMPTY. This leg is its only executor.
- name: "sparq-wrapper (proposed-json)"
  crate: "sparq-wrapper"
  features: "proposed-json"
  test: true
