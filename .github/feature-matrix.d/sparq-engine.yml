# are `#[cfg(feature = "paths")]`, so the default build (and ci.yml's `--workspace
# --all-targets` archive, which passes NO `--features`) compiles them EMPTY and runs
# ZERO of the tests — the silent "compiled EMPTY ... tests never ran" gap this lane
# exists to close (tripped the C1 structural guard on #2007). No new dep and no
# `not(feature=…)` divergence, so a single isolated leg covers it.
- name: "sparq-engine (paths)"
  crate: "sparq-engine"
  features: "paths"
  test: true

# [GPT-5.6] sq-lk3aw.4: exact-certified spatial FILTER pushdown is default-OFF,
# and tests/spatial_exact_pushdown.rs is compiled only with this feature.
- name: "sparq-engine (spatial-exact-pushdown)"
  crate: "sparq-engine"
  features: "spatial-exact-pushdown"
  test: true
