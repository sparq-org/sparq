# Feature-matrix fragment for `sparq-lws-core` (imported from jeswr/solid-server-rs,
# bead sq-gg0qq.2). [FABLE-5]
#
# One self-contained leg mapping per opt-in feature. Assembled into the feature-matrix
# `opt-in-features` strategy by scripts/assemble-feature-matrix.py; adding a leg for
# THIS crate edits no OTHER crate's fragment (bead sq-ibrze).
# SCOPE ([SONNET-4.6] issue #2384): adding/removing/renaming a leg changes the emitted
# leg-name set, and THAT is a TWO-FILE change — this fragment AND
# scripts/tests/feature-matrix-legnames.golden.txt. Every other edit here (features,
# test, tier, tier-reason, comments) leaves the name set alone and is a SINGLE-file
# change. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.

# The IN-PROCESS embedded SPARQ backend (src/store/embedded.rs) — in-workspace path
# deps on sparq-core/sparq-engine. DEFAULT-ON since sq-gg0qq.3 (the first-class
# in-workspace backend), so the default ci.yml lanes now also cover it; this leg keeps
# the EXPLICIT `--features embedded-sparq` spelling green in the matrix lane
# (tests/store_embedded.rs + tests/embedded_read_counters.rs + the full ldp_http suite
# against the embedded backend).
- name: "sparq-lws-core (embedded-sparq)"
  crate: "sparq-lws-core"
  features: "embedded-sparq"
  test: true

# [GPT-5.6] sq-r1ei8: explicit compile/test coverage for the default-on full
# tier. The complementary core tier cannot be expressed by this additive matrix;
# `feature-matrix.yml` gates it in a dedicated `--no-default-features` job.
- name: "sparq-lws-core (sparql-endpoint)"
  crate: "sparq-lws-core"
  features: "sparql-endpoint"
  test: true

# The live REMOTE SPARQL-over-HTTP backend (src/store/http.rs), opt-in `http-sparq`
# since sq-gg0qq.3 (in-workspace builds bind the engine in-process instead).
# tests/http_sparq_client.rs is entirely feature-gated on it; without this leg the
# remote HTTP data path never compiles or runs in CI.
- name: "sparq-lws-core (http-sparq)"
  crate: "sparq-lws-core"
  features: "http-sparq"
  test: true

# [GPT-5.6] sq-oprna.2: the encrypted HTTP/3 listener over the same hardened
# LDP router. The feature-gated integration test drives real TLS TCP + QUIC
# sockets, response parity, and peer ConnectInfo-backed rate limiting.
- name: "sparq-lws-core (http3)"
  crate: "sparq-lws-core"
  features: "http3"
  test: true

# The distributed Redis-backed DPoP-`jti` replay store (src/redis_replay.rs).
# tests/redis_replay.rs is feature-gated on it; this leg compiles + runs the suite's
# in-process tests. The LIVE-Redis tests inside stay `#[ignore]` + env-gated on
# `PSS_IT_REDIS_URL` (no Redis service in this lane), matching the live-SPARQ IT
# pattern — the leg still keeps the opt-in ON path compiling and its unit surface run.
- name: "sparq-lws-core (redis-replay)"
  crate: "sparq-lws-core"
  features: "redis-replay"
  test: true

# The wasm request-handling core: real axum routing, LDP handlers, WAC, and in-memory storage with
# native listener/runtime/crypto/network dependencies excluded by target cfg. The feature-gated
# dependency-boundary test proves those exclusions against the wasm32 normal dependency graph.
- name: "sparq-lws-core (wasm)"
  crate: "sparq-lws-core"
  features: "wasm"
  test: true

# [OPUS-5] sq-hed3q: the opt-in trust-graph admission seam (src/authz/trust_admit.rs) — the
# library adapter from the sparq-trust admission gate onto this crate's AccessMode/Decision
# vocabulary. tests/lws_trust_admit.rs is entirely `#![cfg(feature = "trust-graph")]`, so without
# this leg the seam's signed-credential positive path, its fail-closed cases, and its adversarial
# never-flips-a-WAC-denial invariants never compile or run in CI.
- name: "sparq-lws-core (trust-graph)"
  crate: "sparq-lws-core"
  features: "trust-graph"
  test: true

# [OPUS-5] sq-gg0qq.11: the opt-in ODRL policy gate on the LDP read / SPARQL query path
# (`src/authz/odrl.rs`, sq-elg47). THIS LEG WAS MISSING: `tests/odrl_gate.rs` is entirely
# `#![cfg(all(feature = "odrl-authz", not(target_arch = "wasm32")))]`, and `odrl-authz` is
# default-OFF, so ci.yml's `cargo nextest archive --workspace --all-targets` (whose only
# `--features` are the three sparq-vectors ones) compiled the file EMPTY and no leg here
# enabled it — the suite's four
# invariants (deny-overrides on a WAC-public target, permit-extends on a WAC-private target,
# graph granularity, and unattached-gate ⇒ behaviour-identical) ran NOWHERE. That is the
# sq-vya1 silent gap this lane exists to close.
#
# The gap survived `feature-matrix-tiers.py --enforce` because invariant (2) only classifies
# (crate, feature) pairs that ALREADY APPEAR IN A LEG: a declared cargo feature with ZERO legs
# is never handed to the detector, so it is invisible to the guard rather than sensitive-and-
# uncovered. Closing that hole repo-wide is a separate change: 23 OTHER crates still declare at
# least one feature with no leg. Not all of those are gaps — ci.yml's
# `cargo clippy --workspace --all-targets --all-features` keeps every feature COMPILING; what a
# missing leg costs is test EXECUTION, which is only lost when a suite is cfg-gated on it.
#
# The seam composes at the decision layer, not the store backend, so the leg needs no
# `embedded-sparq` addition — the suite runs on the in-memory store doubles with the crate's
# default features on.
- name: "sparq-lws-core (odrl-authz)"
  crate: "sparq-lws-core"
  features: "odrl-authz"
  test: true
