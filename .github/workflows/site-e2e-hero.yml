# [SONNET-4.6] sq-ymr2e.3 — ADVISORY CI lane for the home hero-runner E2E journeys.
#
# Runs the five P1 journeys in site/e2e/home-runner.spec.ts against a real headless Chromium
# with the lean wasm bundle built from source — so the "engine-computed rows" and "zero-network
# invariant" are verified against the actual Rust engine on every site/ change.
#
# ADVISORY (continue-on-error: true on both Playwright steps; the whole word `advisory` in the job
# NAME also excludes it from the `ci-summary` aggregator). The heroic run of all five journeys +
# the stress (--repeat-each=5) needs a full wasm build with a warm cache. Making it advisory keeps
# PR CI snappy on Rust-only changes while surfacing failures as a visible check the maintainer can
# inspect. Promotion to a required check is governed by `.github/E2E-GATING-POLICY.md` (probation
# bar + flake-quarantine — bead sq-ymr2e.12; design research/web-gui-test-program.md §6.3); it is
# the one-line flip in §4 (drop ` (advisory)` from the job name + the step `continue-on-error`).
#
# SCOPE: path-scoped to site/**, the root lock files (same reasoning as site-e2e.yml — npm ci
# resolves from the root lockfile, so a lockfile bump can break the install), and this workflow.
# A Rust-only or docs-only PR never triggers this lane.
name: site-e2e-hero

on:
  pull_request:
    # [FABLE-5] Draft-tier CI: + ready_for_review so the un-draft moment re-runs
    # this gate-feeding lane (docs/branch-protection.md §Draft-tier CI).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-hero.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-hero.yml"

# Least-privilege default (Scorecard TokenPermissions): read-only; this lane never writes.
permissions:
  contents: read

# One in-flight run per PR/branch; cancel a superseded run.
concurrency:
  group: site-e2e-hero-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-e2e-hero:
    name: home hero-runner journeys (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Node 22 — npm cache keys off the REPO-ROOT lockfile (site/ is a workspace member;
      # the per-member site/package-lock.json was dropped when workspaces were introduced).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies (from the repo-root workspace lock)
        run: npm ci

      # Rust stable + wasm32 target + wasm-pack — needed to build the lean wasm bundle.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [FABLE-5] CI-economy (2026-07-18 directive 2b): this wasm lane compiles
          # the same sparq-wasm dependency stack as the other js/pages/gui/site wasm
          # lanes — ONE shared dependency cache across them keeps demand inside the
          # 10 GB Actions-cache budget (sq-3sbrr doctrine: save on push-to-main
          # only, so PR runs are restore-only and never churn the shared budget).
          shared-key: site-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # [OPUS-5] #5776 — prebuilt, SHA-pinned, exactly-versioned wasm-pack (sq-khm3f):
      # a `cargo install` here recompiles it from crates.io and flakes on a registry blip.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0

      # [FABLE-5] PR #3511 review finding 5: redundant second cargo cache REMOVED —
      # the Swatinem/rust-cache above (shared-key: site-wasm) already caches
      # ~/.cargo/registry + ~/.cargo/git + the workspace target/ across the js/pages/
      # gui/site wasm lanes, restore-only off main. The former PR-scoped
      # `actions/cache` (site-e2e-hero-wasm-…-hashFiles(Cargo.lock)) covered the same
      # paths and only churned the shared 10 GB Actions-cache budget. (The Playwright
      # browser cache below is a DIFFERENT path — ~/.cache/ms-playwright — and stays.)

      # Build the lean wasm bundle (wasm-pack → crates/sparq-wasm/pkg → js/wasm/).
      # Run from js/ (one level above site/) so the relative Cargo.toml path is correct.
      - name: Build lean wasm bundle
        run: cd ../js && npm run build:wasm:lean

      # Copy the built bundle into site/public/wasm/ (the path next dev serves it from).
      - name: Sync wasm bundle into site/public/wasm/
        run: npm run sync-wasm

      # Cache Playwright browsers keyed on the resolved @playwright/test version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      # [OPUS-5] #3773 — the determinism grep gate is HARD-gated in site-e2e-foundation.yml's
      # `determinism-gate` job (same `site/**` path filter). It used to run HERE too, inside
      # this advisory job, where the "HARD — must pass" comment it carried was simply false;
      # re-running it in a non-gating job gates nothing, so it is not duplicated.

      # Run the five P1 home hero-runner journeys. Advisory: failures surface as a visible check
      # but do not block the PR while wasm/CI flakiness is worked out.
      - name: Home hero-runner E2E journeys
        run: npm run test:e2e -- home-runner.spec.ts
        continue-on-error: true

      # Stress run (--repeat-each=5 --retries=0): 25 runs with zero retries prove the suite is
      # deterministic — any flake appears as a failure across 25 iterations. Advisory.
      - name: Home hero-runner stress test (--repeat-each=5 --retries=0)
        run: npm run test:e2e:stress -- home-runner.spec.ts
        continue-on-error: true
