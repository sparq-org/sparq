# [OPUS-4.8] sq-ymr2e.1 — site E2E-foundation lane: TWO HARD jobs + one advisory one.
#
# WHAT: the shared E2E foundation smoke (site/e2e/support/foundation.smoke.spec.ts) — the
# determinism-harness + hermetic-network demo — the deterministic no-timeout grep gate, and the
# axe-core a11y ratchet. The smoke drives a WASM-FREE, deterministic surface (the home hero
# runner's server-rendered idle-preview state), so this lane needs NO wasm bundle and NO Typst —
# it is fast and self-contained (contrast site-e2e.yml, which builds spec fragments for its
# ReSpec smoke).
#
# [OPUS-5] #3773 — GATING vs ADVISORY, corrected. Advisory status is now DECLARED in
# `.github/advisory-registry.json`, NOT inferred from a job name; a check with no declaration
# GATES. This workflow used to put THREE things in one advisory-named job, so two of them
# gated NOTHING while this header claimed they were "hard":
#   * `determinism-gate` (HARD, no declaration) — the no-waitForTimeout grep gate, ~15 s of
#     pure grep with no npm install and no browser. Its previous home was the advisory job, so
#     a `page.waitForTimeout` under site/e2e/ was mergeable. It gates now.
#   * `a11y-ratchet` (HARD, no declaration) — the axe-core WCAG 2.1 AA scan + the committed
#     bench/a11y-baseline.json ratchet. Deterministic given a successful scan, and non-vacuous
#     (the suite's last test injects an unlabelled icon-button and asserts axe CATCHES it), so
#     it is split OUT of the browser-smoke job and gates on its own.
#   * `foundation-smoke` (DECLARED advisory) — the real-browser foundation smoke, which stays
#     non-gating on the sq-ymr2e.12 probation bar (`.github/E2E-GATING-POLICY.md` §3).
# Promotion of the advisory job = DELETE its registry entry (§4 of that policy).
name: site-e2e-foundation

on:
  pull_request:
    # [FABLE-5] Draft-tier CI: + ready_for_review so the un-draft moment re-runs
    # this gate-feeding lane (docs/branch-protection.md §Draft-tier CI).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-foundation.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-foundation.yml"

# Least-privilege default (Scorecard TokenPermissions): read-only; this lane never writes.
permissions:
  contents: read

# One in-flight run per PR/branch; cancel a superseded run. Not a merge-queue lane.
concurrency:
  group: site-e2e-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # [OPUS-5] #3773 — HARD determinism gate, split out of the advisory smoke job it used to
  # hide inside. Pure grep over site/e2e/**/*.ts (site/e2e/support/no-timeout-gate.sh): no npm
  # install, no browser, no toolchain, ~15 s. NOT declared in
  # `.github/advisory-registry.json`, so `ci-summary / gate` waits on it — which is what
  # `.github/E2E-GATING-POLICY.md` §1.1 always claimed and, until now, was not true.
  #
  # [OPUS-5] sq-6vshe.7(e) / issue #5692 — CONSOLIDATION FOLD EVALUATED AND **DECLINED**.
  # Do not re-file: this job is a one-grep runner claim, which is the shape the runner-
  # consolidation sweep looks for, but its only unconditional gating sibling is
  # `a11y-ratchet` and folding into it is a net LOSS. Both jobs GATE (neither is declared
  # in the registry), so the fold would merge two distinct gate identities — each a
  # separately-named row of `.github/E2E-GATING-POLICY.md` §2 — into one check-run whose
  # name would misdescribe half the failures it reports. It would also force a choice
  # between two regressions that do not exist today: grep-first fail-fast suppresses the
  # a11y result on a determinism failure, and the `if: ${{ !cancelled() }}` fix for that
  # withholds the sub-minute determinism verdict until the browser lane concludes. The
  # saving is ONE claim on `site/**` events (this workflow has no merge_group leg).
  # Full rationale + the criterion it refines: `research/ci-runner-consolidation-2026-07.md` §8.
  determinism-gate:
    name: site e2e determinism gate (no waitForTimeout calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Invoked directly rather than through `npm run test:e2e:grep-gate` so the gate needs
      # no node_modules at all — the script resolves site/e2e relative to itself.
      - name: Determinism grep gate (zero page.waitForTimeout under site/e2e)
        run: bash site/e2e/support/no-timeout-gate.sh

  # DECLARED advisory (`.github/advisory-registry.json`): a REAL browser smoke on the
  # sq-ymr2e.12 probation bar. Renamed from "determinism gate + foundation smoke (advisory)"
  # now that the determinism gate + a11y ratchet are their own HARD jobs — the old name
  # advertised a gate this job no longer contains.
  foundation-smoke:
    name: foundation smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Repo-root npm workspaces: `site/` is a member; `npm ci` run FROM site/ installs the site
      # member's closure from the root lock and does NOT trigger sibling members' lifecycle scripts
      # (verified in site-e2e.yml — js/'s wasm `prepare` is not run, so no Rust/wasm toolchain here).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies (from the repo-root workspace lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      # [OPUS-5] #3773 — the determinism grep gate MOVED to the HARD `determinism-gate` job
      # above. Running it here as well would only re-run it inside a non-gating job.

      # Cache the Playwright browser download keyed on the resolved @playwright/test version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      # ADVISORY: a browser flake never blocks a PR (§6.3). The spec is engineered to be
      # deterministic (frozen clock, seeded random, hermetic network, web-first waiters); its
      # anti-flake bar is `npm run test:e2e:stress` (--repeat-each=5 --retries=0), run pre-merge.
      - name: Foundation smoke (headless Chromium)
        continue-on-error: true
        run: npm run test:e2e -- support/foundation.smoke.spec.ts

  # [OPUS-4.8] sq-ymr2e.4 / [OPUS-5] #3773 — axe-core WCAG 2.1 AA a11y RATCHET, now its own
  # HARD job. It used to be a `continue-on-error` step inside the advisory smoke job, i.e.
  # double-swallowed: the committed ratchet in bench/a11y-baseline.json could not fail anything.
  # WHY IT MAY GATE while the smoke beside it may not: the assertion set is a ratchet over
  # axe's own rule output (serious+critical = ZERO on the ZERO-tier surfaces, a known-gap
  # regression guard on the beaded colour-contrast surfaces, and a moderate/minor ceiling that
  # may only fall), and the suite is non-vacuous by construction — its last test injects an
  # unlabelled icon-button and asserts axe CATCHES it, so a green run proves the scanner ran.
  # This lane builds no wasm bundle, so the engine-dependent states self-SKIP; the wasm-free
  # states (home:idle, /download release+no-release) run — the same set as before.
  # Design of record: research/web-gui-test-program.md §3.1.
  a11y-ratchet:
    name: site a11y ratchet — axe WCAG 2.1 AA (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies (from the repo-root workspace lock)
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      # NO continue-on-error: an axe regression is a real failure and now REDs `gate`.
      - name: A11y — axe WCAG 2.1 AA + baseline ratchet (headless Chromium)
        run: npm run test:e2e -- a11y.spec.ts
