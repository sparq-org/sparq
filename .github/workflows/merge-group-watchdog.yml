# [OPUS-5] sparq-org/sparq#4652 — recover a merge-group ref GitHub Actions never
# dispatched, in minutes instead of the ruleset's 60-minute CI_TIMEOUT.
#
# WHY: measured 2026-07-27/28, PR #4534's merge-group ref was created at 23:04:37Z with
# ZERO check-suites and deleted at 00:05:04Z when the queue timed it out. It held
# position 1 in AWAITING_CHECKS the whole time — the queue merges strictly in order and
# each entry needs its OWN group's required check, so three PRs with already-green
# groups could not land. Total cost: 73 min 41 s of zero merges and ~66 min of group CI
# thrown away on the rebuild. The full diagnosis is on #4652.
#
# NOT A GATE. Schedule / workflow_dispatch only — it never runs on a PR head, never
# produces a check-run the `ci-summary` aggregator can see, and can therefore never
# block a merge. Its only mutations are (a) a marker comment and (b) a dequeue +
# re-enqueue of an entry it has POSITIVELY established has zero check-suites. Every
# ambiguous reading is a refusal, not an action (see the script header).
#
# ── [OPUS-5] THE CRON IS NOW THE BACKSTOP, NOT THE PRIMARY PATH ──────────────────
# `.github/workflows/merge-group-doorbell.yml` rings this workflow via
# `workflow_dispatch` on every `pull_request_target` [enqueued, dequeued] — the two
# events that between them cause every merge-group ref to be built. Read that file for
# the measurement showing why `merge_group` itself CANNOT be the producer (it would put
# a 9th check-suite on every group head and mask the `total_count == 0` predicate
# outright, and it is dispatched by exactly the delivery that failed).
#
# The cron below is DELIBERATELY RETAINED as the independent second path. It is not
# redundant and it is not the primary: MEASURED 2026-07-28 on this workflow, the
# 5-minutely schedule produced 3 fires between 13:19:03Z and 17:07:52Z against ~45
# expected (93% loss, largest gap 140 min). The dead ref `38a9d875` was built at
# 15:58:00Z and the next scheduled fire was 17:07:52Z — 69.9 min later, past the
# ruleset's own 60-minute CI_TIMEOUT. Two independent paths is the whole point: the
# doorbell covers queue transitions, the cron covers everything else (notably a direct
# push to `main` that rebases the queue without any PR-level queue event).
#
# Cadence is every 5 minutes — the GitHub scheduler minimum — against a 120 s grace, so
# worst-case detection is ~10 min and typical is ~5, against the 60-minute ruleset
# timeout it replaces. The grace is 30x the MEASURED maximum create->first-suite latency
# on this repo (N=209, max 4 s; see the script's DEFAULT_GRACE_SECONDS note) and sits
# below the tick interval so it never costs an extra tick. Minutes are offset from
# auto-arm.yml's and rearm-sweeper.yml's crons so the three sweeps do not start together.
#
# BASE RATE, measured rather than assumed: THREE zero-dispatch refs on three
# consecutive days — #4331 (07-26), #4534 (07-27), #4709 (07-28) — against 211 merge
# groups sampled over the same period. Each held position 1 for ~60 min. #4709 was
# caught live by this script's own `sweep --dry-run` while its four siblings in the
# same chain all had 8 suites. This is a recurring platform event, not a one-off.
name: merge-group watchdog

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Emit decisions without dequeuing/re-enqueuing anything"
        type: boolean
        default: false

# Least privilege, mirroring rearm-sweeper.yml (the sibling queue sweeper):
#   contents: read       — the repository ACTIVITY api (branch_creation timestamps),
#                          which is the only exact merge-group build-time anchor.
#   checks: read         — the load-bearing predicate: check-SUITE count on the group head.
#   pull-requests: write — the marker comment + the dequeue/enqueue mutations.
#
# This is the DEFAULT for jobs in this workflow, and it is exactly the `watch` job's
# need. The `reap` job below needs a DIFFERENT and disjoint capability (`actions: write`
# and no PR write at all), so it declares its own job-level block, which REPLACES this
# one rather than adding to it. Neither job can use the other's token scope.
permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: merge-group-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: recover zero-dispatch merge groups
    runs-on: ubuntu-latest
    # Raised from 10 for the resweep loop: 4 x 60 s of sleep plus five sweeps plus the
    # checkout and self-test. Still a hard ceiling — the job cannot sit on the shared
    # `merge-group-watchdog` concurrency slot indefinitely.
    timeout-minutes: 15
    env:
      # Secrets are not readable from step `if:` expressions — mirror the id into env
      # so the mint step can be skipped fail-soft when the App is not configured.
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
    steps:
      - name: Mint the sparq-orchestrator App token (re-enqueue must fire queue events)
        id: app-token
        if: env.ORCHESTRATOR_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}

      # Always execute the trusted default-branch policy, including on manual dispatch.
      - name: Checkout watchdog policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # gh_retry.py is the watchdog's bounded transient-retry dependency — the
          # self-test below imports it, so a missing path fails BEFORE the live sweep.
          sparse-checkout: |
            scripts/merge-group-watchdog.py
            scripts/gh_retry.py
          sparse-checkout-cone-mode: false

      - name: Self-test policy
        run: |
          python3 scripts/gh_retry.py --self-test
          python3 scripts/merge-group-watchdog.py --self-test

      # ── WHY THIS IS A LOOP AND NOT A SINGLE SWEEP ────────────────────────────
      # One fire must outlive the grace period, because the event that STARTS this run
      # precedes the thing it has to observe. On the doorbell path the ordering is:
      # queue transition at T -> group ref built at T+0..19 s (MEASURED over the three
      # dead refs of 2026-07-28 and five live rebuilds) -> the group only becomes
      # actionable at T+build+120 s of grace. A run that swept once at start would
      # decide WAIT on the very group it was rung for and exit, and the next look would
      # be whenever the unreliable cron next fires.
      #
      # The loop is UNCONDITIONAL — no `if:`, no per-trigger branching, no input that
      # selects between "sweep once" and "sweep repeatedly". That is deliberate: a
      # conditional here would be a YAML seam, and on this estate a seam is where an
      # inert-but-innocent-looking mutation survives. The cron path simply gets the same
      # coverage, which is strictly better than the single sweep it did before.
      #
      # STICKY EXIT CODE. A failed recovery in sweep 1 followed by clean sweeps 2-5 must
      # still FAIL the run: `rc` is only ever raised, never reset, and the step exits on
      # it after the loop. This repo has shipped the opposite defect three times in one
      # day (a later transient discarding an earned hard failure), so the interleaved
      # fail-then-succeed sequence is asserted by executing this very block in
      # scripts/tests/test_merge_group_watchdog.py, not by reading it.
      - name: Sweep the merge queue for zero-dispatch groups
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          # 5 sweeps 60 s apart => ~4 min of cover per fire. Against a doorbell ring at
          # T that puts the first sweep at ~T+30 s, a group built at T+19 s clears its
          # 120 s grace at T+139 s and is recovered by the sweep at ~T+150 s.
          RESWEEPS: "4"
          RESWEEP_INTERVAL_SECONDS: "60"
          # BLAST RADIUS, stated as it actually is. `--max-recoveries-per-run` is
          # PROCESS-local, so looping five sweeps in one job silently multiplied the
          # script's own "one tick may never churn the whole queue" bound by 5 (2 -> 10).
          # Tightening the per-sweep budget to 1 puts the per-FIRE worst case at 5.
          #
          # That is still ABOVE the pre-loop 2, and it is a disclosed residual rather
          # than a fix: restoring exactly 2 needs a budget shared ACROSS sweeps, which
          # lives in the script's CAP path — decision logic this change deliberately does
          # not touch. The residual is bounded and, on the measured base rate (3 dead
          # refs in a DAY), reaching it needs 5 DISTINCT zero-suite entries inside 4
          # minutes, which is a repo-wide dispatch outage in which recovering them is the
          # correct action. Per-PR cap (2 per 6 h) and same-head idempotence are
          # unaffected and still prevent the same entry being churned twice.
          MAX_RECOVERIES_PER_SWEEP: "1"
        run: |
          set -euo pipefail
          # Built as an array so the optional flag is passed as ONE argv element and
          # never word-split (shellcheck SC2086 — the folded one-liner this replaced
          # relied on unquoted splitting).
          sweep_args=(sweep --repo "$REPO" --branch "$DEFAULT_BRANCH"
                      --max-recoveries-per-run "$MAX_RECOVERIES_PER_SWEEP")
          if [ -n "$DRY_RUN" ]; then
            sweep_args+=("$DRY_RUN")
          fi
          rc=0
          for i in $(seq 0 "$RESWEEPS"); do
            if [ "$i" -gt 0 ]; then
              sleep "$RESWEEP_INTERVAL_SECONDS"
            fi
            echo "::group::sweep $((i + 1))/$((RESWEEPS + 1))"
            if ! python3 scripts/merge-group-watchdog.py "${sweep_args[@]}"; then
              rc=1
              echo "::warning title=merge-group-watchdog::sweep $((i + 1)) exited non-zero; the loop continues but this run will fail"
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  # ── [OPUS-5] sparq-org/sparq#6068 — the STALE-RUN REAP ──────────────────────────
  # A SECOND failure mode of the same queue. When an entry times out and GitHub rebuilds
  # the entries behind it, the workflow runs of the SUPERSEDED `gh-readonly-queue/main/pr-*`
  # refs stay queued / in progress and hold the capacity the replacement groups need.
  # REPORTED from the live merge train on #6068 (that issue's observation, not a
  # measurement taken here): three obsolete group refs retained resident `ci-summary`
  # waiters plus queued `ci` and feature-matrix runs while the replacement group waited.
  # The nine run ids are recorded on the issue and in the DEFAULT_REAP_GRACE_SECONDS
  # block of the script. Cancelling them by hand released the capacity — this job does
  # that automatically.
  #
  # SEPARATE JOB, NOT A STEP, for exactly one reason: the capability. Cancelling a run
  # needs `actions: write`, and the recovery job must never hold it (nor this job hold
  # `pull-requests: write`). A job-level `permissions:` block REPLACES the workflow-level
  # one, so the two capabilities are disjoint by construction rather than by convention.
  #
  # It carries NO `needs:` on `watch`, so a recovery failure cannot delay or suppress the
  # reap: the two passes fix different problems and neither is a precondition of the other.
  #
  # TRIGGERING is inherited, and that is the point: this workflow is rung by
  # merge-group-doorbell.yml on every `pull_request_target` [enqueued, dequeued] — the two
  # events that between them cause every queue rebuild — and the cron above is retained as
  # the independent backstop for the rebuilds no PR-level queue event announces (notably a
  # direct push to `main`). The doorbell needs no change: it dispatches the WORKFLOW.
  #
  # NEVER EXECUTES OR CHECKS OUT A MERGE REF. The checkout is pinned to the default branch
  # exactly like `watch`'s, sparse to the two policy files, with `persist-credentials:
  # false`. What the job learns about a merge-group ref is its NAME, head SHA and status
  # from the Actions API, and the commit its ref points at from the git-ref API. It never
  # fetches, checks out or executes a merge ref's CONTENTS.
  reap:
    name: cancel obsolete merge-group runs
    runs-on: ubuntu-latest
    # 5 passes with 4 x 60 s of sleep between them, plus the checkout and the self-test,
    # with headroom. A hard ceiling: the job may not sit on the shared concurrency slot
    # indefinitely.
    timeout-minutes: 10
    # LEAST PRIVILEGE, and disjoint from `watch`'s:
    #   contents: read  — the default-branch policy checkout, and the git-ref read that
    #                     corroborates obsolescence against the group ref itself.
    #   actions: write  — POST /actions/runs/{id}/cancel, the job's ONE mutation. It also
    #                     covers listing workflow runs, which is a READ on that same scope.
    # In particular NO `pull-requests` and NO `checks`: this job must not be able to
    # comment, label, dequeue or re-enqueue anything.
    permissions:
      contents: read
      actions: write
    steps:
      # No App token. `GITHUB_TOKEN` with `actions: write` can cancel a workflow run, so
      # minting an App credential here would add blast radius for no capability.
      - name: Checkout reap policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-group-watchdog.py
            scripts/gh_retry.py
          sparse-checkout-cone-mode: false

      - name: Self-test policy
        run: |
          python3 scripts/gh_retry.py --self-test
          python3 scripts/merge-group-watchdog.py --self-test

      # ── WHY THIS IS A LOOP, AND IT IS NOT THE SAME REASON AS `watch`'s ──────────
      # `watch` loops because its target has to AGE past a grace. This one loops because
      # its target has to APPEAR: the doorbell rings on the queue transition, and the
      # rebuild that orphans the old groups lands seconds later. A single pass fired at
      # the ring would read a queue that still contains the outgoing groups, correctly
      # call every run CURRENT, and exit — leaving the reap to a cron this repo has
      # MEASURED at a 93% firing deficit (see the header). Five passes a minute apart
      # cover the rebuild from the ring that announced it.
      #
      # STICKY EXIT CODE, same discipline as `watch`: `rc` is only ever raised, never
      # reset, so a failure in pass 1 survives four clean later passes. This repo has
      # shipped the opposite defect, so the interleaved sequence is asserted by EXECUTING
      # this block in scripts/tests/test_merge_group_watchdog.py.
      - name: Reap merge-group runs of superseded queue groups
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          REAP_PASSES: "4"
          REAP_INTERVAL_SECONDS: "60"
        run: |
          set -euo pipefail
          # Array form so the optional flag is ONE argv element and is never word-split
          # (shellcheck SC2086); appended only when set, because an unconditional append
          # would pass an EMPTY element that argparse rejects on every non-dry-run pass.
          reap_args=(reap --repo "$REPO" --branch "$DEFAULT_BRANCH")
          if [ -n "$DRY_RUN" ]; then
            reap_args+=("$DRY_RUN")
          fi
          rc=0
          for i in $(seq 0 "$REAP_PASSES"); do
            if [ "$i" -gt 0 ]; then
              sleep "$REAP_INTERVAL_SECONDS"
            fi
            echo "::group::reap $((i + 1))/$((REAP_PASSES + 1))"
            if ! python3 scripts/merge-group-watchdog.py "${reap_args[@]}"; then
              rc=1
              echo "::warning title=merge-group-watchdog::reap $((i + 1)) exited non-zero; the loop continues but this run will fail"
            fi
            echo "::endgroup::"
          done
          exit "$rc"
