# [FABLE-5] registry jeswr/agent-account-registry#563 item 3 — durable fix for
# registry#556 (invisible merge-group failures). 🤖 SPARQ agent.
#
# WHY: when the merge queue drops a PR (a failed/timed-out merge-group run, a queue
# clear, a conflict), GitHub silently disables nothing and notifies nobody — the PR
# sits green-looking with a dead arm until an orchestrator sweep happens to re-derive
# its state from the live rollup (registry#556). The merge queue's `dequeued`
# pull_request activity type is a PUSH signal for exactly this edge, so this workflow
# converts every genuine (non-merge) dequeue into the fix lane's admission shape:
# auto-merge disabled, review:pass swapped for `review:changes`, and a self-identified
# comment linking the failed merge-group run — the registry's fix-enumeration then
# admits the PR on its next tick instead of never.
#
# ── pull_request_target (NOT pull_request) ────────────────────────────────────────
# [FABLE-5] #3759 finding 2. This workflow only WRITES (disable-auto, relabel,
# comment) and needs NO checkout of the PR's code. On `pull_request` a fork PR's run
# gets a READ-ONLY token (so the label/comment writes would fail) and the event may
# not even fire on a conflict-dequeue. `pull_request_target` runs in the BASE-repo
# context with the base repo's write token, so the writes succeed on fork PRs too and
# the trigger is reliable.
#
#   SECURITY — pull_request_target runs with a REPO-WRITE token in the trusted base
#   context. The classic pull_request_target pitfall is executing untrusted PR HEAD
#   code with that token. This job does NEITHER of the dangerous things:
#     * it NEVER checks out the PR head (`actions/checkout` is not used at all), and
#     * it NEVER executes any code, script, or path from the PR — every step is a
#       plain `gh` call keyed only on github.event fields (the PR NUMBER + the
#       dequeue reason) and gh-api reads by that number.
#   No PR-controlled value is ever interpolated into a shell command (the reason is
#   passed through env and only echoed/switched on a fixed allow-list). If this
#   workflow is ever extended to build/test PR code, it MUST move that work to a
#   separate `pull_request`-triggered job — do not add a checkout of the PR head here.
#
#   [OPUS-5] #4652 adds ONE checkout — pinned to `ref: <default_branch>` with
#   `persist-credentials: false` — solely to obtain the trusted, default-branch copy of
#   `scripts/merge-group-watchdog.py`. That is the base repo's own reviewed code, NOT
#   the PR head, so the rule above is intact: this workflow still never checks out or
#   executes anything a PR contributed. Do not change that `ref:`.
#
# GATE INTEGRATION: the job name carries the whole-word `advisory` token, so the
# ci-summary gate's discovery excludes it from the gating set (a dequeue-feedback
# hiccup on a PR head must never red a later gate evaluation on that same SHA). The
# labels/comments it writes are exactly the fix lane's normal inputs.
#
# FLAKE-CLASSIFIED failures: an infra-flavoured dequeue reason (e.g. QUEUE_CLEARED,
# ROLL_BACK) is noted in the comment but STILL routes to review:changes — the fix lane's
# ci-flavour owns re-runs, so the routing is identical by design.
#
# ── [OPUS-5] #4652: the FIRST exception — a CI_TIMEOUT with ZERO check-suites ─────
# (sq-fnr85 later added a second: a QUEUE_CLEARED / ROLL_BACK removal, which is the
# queue acting on itself and carries no verdict about the diff even when the group had
# already gone green. Same classifier, same `route=preserve` output, same fail-safe
# default — see GREEN_DROP_REASONS in scripts/merge-group-watchdog.py.)
# A `CI_TIMEOUT` has two utterly different causes and until now both got the same
# treatment. (1) Checks genuinely ran long / hung — a legitimate signal, keep demoting.
# (2) GitHub Actions NEVER DISPATCHED the `merge_group` event, so the group ref sat with
# zero check-suites until the ruleset's 60-minute timeout fired. Measured on #4534
# (2026-07-27): ref built 23:04:37Z, 0 check-suites / 0 check-runs / 0 workflow runs,
# dequeued CI_TIMEOUT at 00:05:03Z. Demoting THAT strips `review:pass` and manufactures
# a full re-review of code nobody found fault with — the same defect class as the
# machine-manufactured `needs:user` escalations this repo has already fixed twice.
#
# The two are separated by the SUITE COUNT, never by the reason alone:
# `scripts/merge-group-watchdog.py classify-dequeue` re-derives the live check-suite
# count for the recorded group head and prints `route=preserve|demote`. FAIL-SAFE in
# every direction — a missing marker, an unreadable count, a non-zero count, a stale
# observation, or a crashed classifier all yield `demote`, i.e. today's behaviour. The
# `if:` on the routing step below is written as `route != 'preserve'` so an EMPTY or
# MISSING output (the classifier step failed, the output was lost) still demotes.
#
# The same classifier also recognises the watchdog's OWN recovery: the watchdog
# re-enqueues via dequeue+enqueue, which itself fires `pull_request.dequeued`, and
# without that arm the watchdog would demote every PR it just rescued. MEASURED on
# #4709: `review:pass` was swapped for `review:changes` 17 SECONDS after a `MANUAL`
# dequeue. `MANUAL` conflates "a reviewer withdrew this" (verdict SHOULD fall) with
# "infrastructure moved it" (it should not), so the split is on EVIDENCE — a fresh
# watchdog marker for that exact group head — never on the reason string.
#
# AND, on every preserve route: the verdict may only survive if the PR head has NOT
# moved since `review:pass` was granted. A commit, a force-push, or a revoked label
# after the grant forfeits it — never restore a verdict onto a tree it was not given
# for. A genuine human dequeue has no fresh marker and still demotes; that control is
# what stops this from becoming a verdict-preservation hole.
#
# No third-party actions (nothing to SHA-pin); every step is plain `gh` against the
# workflow token, least-privilege scoped below.
name: merge-queue feedback

on:
  pull_request_target:
    types: [dequeued]

# Least-privilege: pull-requests: write covers the disable-auto / relabel / comment
# writes; actions: read lists this repo's merge_group runs to find the failed run;
# [OPUS-5] #4652 contents: read is the DEFAULT-BRANCH checkout of the classifier script
# (read-only, never the PR head) and checks: read is the classifier's load-bearing
# predicate — the check-SUITE count on the group head. NO contents WRITE is needed —
# nothing is pushed (see the pull_request_target safety note above).
permissions:
  contents: read
  checks: read
  pull-requests: write
  actions: read

# One feedback job per PR at a time; never cancel a half-posted notification.
concurrency:
  group: merge-queue-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  feedback:
    name: merge-queue dequeued feedback (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The dequeued activity payload carries the queue's removal reason (e.g.
      # CI_FAILURE, CI_TIMEOUT, MERGE_CONFLICT, QUEUE_CLEARED, MANUAL, ROLL_BACK).
      DEQUEUE_REASON: ${{ github.event.reason || 'UNKNOWN' }}
    steps:
      # [FABLE-5] #3759 finding 3: a dequeue caused by a SUCCESSFUL queue merge is not
      # a failure — GitHub emits pull_request.dequeued with merged==true when the PR
      # landed. Exit 0 immediately; disabling the (already-consumed) arm, relabeling a
      # merged PR, or commenting "dequeued — please fix" would be wrong and noisy.
      - name: Skip successful-merge dequeues
        if: github.event.pull_request.merged == true
        run: |
          echo "PR ${PR_NUMBER} dequeued via successful merge - no action."

      # [OPUS-5] #4652. TRUSTED, DEFAULT-BRANCH checkout of the classifier only — never
      # the PR head (see the pull_request_target safety note in the header). No PR code
      # is fetched, and nothing from the PR is executed.
      - name: Checkout the dequeue classifier (default branch, never the PR head)
        if: github.event.pull_request.merged != true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-group-watchdog.py
            scripts/gh_retry.py
          sparse-checkout-cone-mode: false

      # [OPUS-5] #4652. Splits CI_TIMEOUT by the SUITE COUNT of the group head, not by
      # the reason. Always exits 0 and always prints a row; every unprovable case
      # yields route=demote (today's behaviour), so a failure here cannot preserve a
      # verdict it did not establish.
      - name: Classify the dequeue (zero-dispatch vs a real timeout)
        id: classify
        if: github.event.pull_request.merged != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >-
          python3 scripts/merge-group-watchdog.py classify-dequeue
          --repo "$REPO"
          --pr "$PR_NUMBER"
          --reason "$DEQUEUE_REASON"

      # The verdict-preserving route. It deliberately does NOT touch labels — preserving
      # the review verdict IS leaving `review:pass` where it is — and does NOT disable
      # the arm. `rearm-sweeper.yml` is the durable backstop if the direct re-arm below
      # fails, because a PR carrying review:pass with no live arm is exactly what that
      # sweep restores.
      #
      # The classifier has three preserve arms (zero-dispatch CI_TIMEOUT, the watchdog's
      # own recovery, and the sq-fnr85 queue-level drop) and this step is deliberately
      # agnostic about WHICH one fired: the arm-specific account lives in
      # `steps.classify.outputs.detail`, which is quoted verbatim into the comment below.
      # Do not re-introduce an arm-specific claim into this step's prose — it went stale
      # the moment a second arm existed, and a wrong explanation posted on a PR is worse
      # than none.
      - name: Preserve the verdict and re-enqueue (the diff is not at fault)
        # Deliberately NOT `!cancelled()`: preserving a verdict requires the classifier
        # to have SUCCEEDED and positively returned `preserve`. The implicit `success()`
        # is the correct default here — do not harmonise this with the step below.
        if: github.event.pull_request.merged != true && steps.classify.outputs.route == 'preserve'
        env:
          CLASSIFY_DETAIL: ${{ steps.classify.outputs.detail }}
          CLASSIFY_REENQUEUE: ${{ steps.classify.outputs.reenqueue }}
        run: |
          set -euo pipefail

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state -q .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is ${STATE} — nothing to preserve; exiting 0."
            exit 0
          fi

          if [ "$CLASSIFY_REENQUEUE" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --auto \
              || echo "::warning::re-arm of PR #${PR_NUMBER} returned non-zero — rearm-sweeper.yml is the backstop."
          else
            echo "Re-enqueue owned by the watchdog itself — not re-arming here."
          fi

          body_file=$(mktemp)
          {
            printf '%s\n\n' "> 🤖 SPARQ agent — merge-queue feedback."
            printf '%s\n\n' "This PR was dequeued (reason \`${DEQUEUE_REASON}\`), but the classifier established that the removal was a **queue-side or platform event, not a verdict about this diff** — either the merge-group ref never had the \`merge_group\` event dispatched to it (sparq-org/sparq#4652), or the queue removed a healthy entry for a queue-level reason (sq-fnr85). The exact arm is quoted below."
            printf '%s\n\n' "**Nothing is wrong with this PR's diff, so its review verdict is preserved** and it is re-queued rather than demoted to \`review:changes\`."
            printf '%s\n' "Classifier: \`${CLASSIFY_DETAIL}\`"
          } > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body_file" \
            || echo "::warning::could not comment the zero-dispatch notification on PR #${PR_NUMBER} (routing is intact)."
          echo "PR #${PR_NUMBER}: zero-dispatch ${DEQUEUE_REASON} — verdict preserved."

      # FAIL-SAFE `if:` — written as `!= 'preserve'` so an EMPTY or MISSING classifier
      # output (step failed, output lost) still routes to the fix lane exactly as it did
      # before #4652. Never invert this to `== 'demote'`.
      - name: Route genuine dequeue to the fix lane
        # `!cancelled() &&` is LOAD-BEARING. A step `if:` with no status function
        # defaults to `success()`, so a FAILED or TIMED-OUT classify step would SKIP
        # this one — keeping `review:pass` and leaving the arm enabled, i.e. the exact
        # opposite of fail-closed. The empty-output case was handled; the failed-step
        # case was not, and a string-matching test could not see the difference.
        if: "!cancelled() && github.event.pull_request.merged != true && steps.classify.outputs.route != 'preserve'"
        run: |
          set -euo pipefail

          # ── state read (finding 4) ──────────────────────────────────────────────
          # A gh pr view failure has TWO very different causes we must not conflate:
          #   * the PR is genuinely CLOSED/MERGED (a race between the dequeue event and
          #     this job) — benign, exit 0; there is nothing to route.
          #   * the state read itself FAILED (transient 5xx / API blip) — we CANNOT
          #     prove the routing happened, so we must NOT masquerade it as a benign
          #     skip. We read with an explicit success-vs-error distinction and a
          #     bounded transient retry (the scripts/gh_retry.py 10s+30s schedule); on
          #     a genuine read failure we exit NON-zero so the run is visibly red.
          read_state() {
            gh pr view "$PR_NUMBER" --repo "$REPO" --json state -q .state
          }

          is_transient() {
            printf '%s' "$1" | grep -qiE 'HTTP (50[234])|Bad Gateway|Service Unavailable|Gateway Timeout|connection reset|connection refused|i/o timeout|TLS handshake timeout|context deadline exceeded|temporary failure in name resolution|unexpected EOF'
          }

          # Bounded transient retry, printing the state on success (rc 0) or leaving
          # STATE empty on a genuine read failure (rc 1).
          retrying_state_read() {
            local attempt err
            for attempt in 1 2 3; do
              if STATE=$(read_state 2>/tmp/pr_view_err); then
                return 0
              fi
              err=$(cat /tmp/pr_view_err 2>/dev/null || true)
              echo "gh pr view attempt ${attempt}/3 failed: ${err}"
              if is_transient "$err" && [ "$attempt" -lt 3 ]; then
                if [ "$attempt" -eq 1 ]; then sleep 10; else sleep 30; fi
                continue
              fi
              return 1
            done
            return 1
          }

          STATE=""
          if ! retrying_state_read; then
            echo "::error::could not read PR #${PR_NUMBER} state (gh pr view failed on every attempt) — the dequeue may not have been routed to the fix lane. Failing the run so it is visibly red rather than a silent benign-skip."
            exit 1
          fi

          if [ "$STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is ${STATE} (merged/closed race between the dequeue event and this job) — nothing to route; exiting 0."
            exit 0
          fi

          # ensure_open_or_exit: re-read AFTER a write fails to classify a race vs a
          # real write failure. A read failure here is NOT benign — it must not turn a
          # failed write into a silent success (finding 4).
          ensure_open_or_exit() {
            if ! retrying_state_read; then
              echo "::error::state re-read for PR #${PR_NUMBER} failed after a write error — cannot prove the PR is closed, so cannot treat the write failure as benign."
              exit 1
            fi
            if [ "$STATE" != "OPEN" ]; then
              echo "PR #${PR_NUMBER} is ${STATE} (merged/closed race) — nothing to route; exiting 0."
              exit 0
            fi
          }

          # (a) Disable the now-dead auto-merge arm. Best-effort: GitHub sometimes
          # clears it on dequeue already, and a raced merge/close makes it moot.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto \
            || echo "disable-auto returned non-zero (already disabled, or raced) — continuing."

          # (b) Route to the fix lane — ATOMICALLY. [FABLE-5] #3759 finding 1: add
          # review:changes AND remove review:pass / review:needs-user in the SAME
          # `gh pr edit` so the 10-min auto-arm sweep can never observe a window where
          # review:pass still coexists with review:changes and re-arm the dequeued PR
          # before remediation. (auto-arm.py ALSO treats review:changes as a hard
          # exclusion — belt-and-suspenders.) --remove-label is idempotent: gh does not
          # error when a label to remove is already absent.
          if ! gh pr edit "$PR_NUMBER" --repo "$REPO" \
                --add-label "review:changes" \
                --remove-label "review:pass" \
                --remove-label "review:needs-user"; then
            ensure_open_or_exit
            echo "::error::failed to swap review:pass -> review:changes on open PR #${PR_NUMBER} — the fix lane will not see this dequeue until the next label sweep."
            exit 1
          fi

          # (c) Best-effort discovery of the failed merge-group run: merge_group runs
          # execute on the transient gh-readonly-queue/<base>/pr-<N>-<sha> branch,
          # which is deleted on dequeue — but the WORKFLOW RUNS persist and keep that
          # head_branch, so the Actions API finds them after the fact.
          runs_json=$(gh api "repos/$REPO/actions/runs?event=merge_group&per_page=100" \
            --jq "[.workflow_runs[]
                   | select(.head_branch != null)
                   | select(.head_branch | test(\"^gh-readonly-queue/.*/pr-${PR_NUMBER}-\"))]" \
            2>/dev/null || echo "[]")
          failed_runs=$(jq -r '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")]
                               | sort_by(.run_started_at) | reverse | .[:3][]
                               | "- [\(.name) (\(.conclusion))](\(.html_url))"' <<<"$runs_json")
          if [ -n "$failed_runs" ]; then
            run_lines="Failed merge-group run(s) for this PR's queue branch:"$'\n'"$failed_runs"
          else
            run_lines="The failed merge-group run was not discoverable from the Actions API at notification time (no non-success \`merge_group\` run recorded for \`gh-readonly-queue/*/pr-${PR_NUMBER}-*\`) — check this PR's checks tab for the queue history."
          fi

          # Infra-flake note: a timeout/queue-side reason is flagged, but the routing
          # is deliberately IDENTICAL — the fix lane's ci-flavour handles re-runs.
          # Reaching this step at all with one of these reasons means the classifier
          # REFUSED to preserve (the verdict no longer describes this tree, or the
          # re-queue budget is spent), so the note says only what is provable here.
          flake_note=""
          case "$DEQUEUE_REASON" in
            CI_TIMEOUT|QUEUE_CLEARED|ROLL_BACK)
              flake_note=$'\n'"Reason \`${DEQUEUE_REASON}\` is queue/infra-flavoured (likely not a fault in this PR's diff), but the classifier could not establish that the review verdict still applies, so it is routed to \`review:changes\` and the fix lane's ci-flavour owns the re-run."
              ;;
          esac

          body_file=$(mktemp)
          {
            printf '%s\n\n' "> 🤖 SPARQ agent — autonomous orchestration."
            printf '%s\n\n' "This PR was **dequeued from the merge queue** (reason: \`${DEQUEUE_REASON}\`). Its auto-merge arm has been disabled and \`review:pass\` swapped for \`review:changes\`, so the fix pipeline admits it on the next enumeration tick (durable feedback loop for registry#556)."
            printf '%s\n' "$run_lines"
            printf '%s\n' "$flake_note"
          } > "$body_file"

          if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body_file"; then
            ensure_open_or_exit
            echo "::error::failed to comment the dequeue notification on open PR #${PR_NUMBER} (label was applied — routing is intact, the explanation is missing)."
            exit 1
          fi
          echo "PR #${PR_NUMBER}: dequeue (reason ${DEQUEUE_REASON}) routed to review:changes with notification."
