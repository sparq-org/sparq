# [OPUS-4.8] Differential SHACL fuzz gate (beads sq-55c1 + sq-evws + sq-vz2v).
#
# WHAT: generates random but VALID SHACL shapes + data graphs, validates each
# through `sparq-shacl` AND through every reference SHACL engine that resolves, and
# asserts the reports agree on the `sh:conforms` bit and the per-focus-node
# violated-constraint set. Three reference families are wired:
#   - pySHACL — the canonical Python reference implementation (sq-55c1).
#   - Apache Jena SHACL — a second, independent reference (sq-evws), driven via the
#     Java single-file source launcher over its `org.apache.jena.shacl` validator.
#   - Node / RDF-JS — a third family (sq-vz2v) driving the Zazuko `shacl-engine`
#     validator over an RDF-JS dataset, via tests/diff_fuzz/node_shacl_adapter.mjs.
#     (`rdf-validate-shacl` is the same adapter behind SHACL_DIFF_NODE_ENGINE; the
#     lane runs shacl-engine, the actively-maintained SHACL-AF one.)
# A disagreement is a candidate sparq-shacl correctness bug; the harness prints the
# seed + the reproducing Turtle so it replays deterministically. Independent engines
# catch bugs where sparq and ONE reference happen to agree but are both wrong. See
# crates/sparq-shacl/tests/diff_fuzz.rs.
#
# TRIGGER — NIGHTLY/HEAVY tier ONLY. Deliberately NOT on pull_request / push /
# merge_group: it installs reference engines and runs thousands of validations,
# which is too heavy + too slow for the per-PR fast path, and the `#[ignore]`d test
# is excluded from `cargo nextest run` anyway. Running only on `schedule` +
# `workflow_dispatch` means this workflow never produces a check-run on a PR head
# commit, so the `ci-summary / gate` aggregator never sees it and the per-PR gate
# is unaffected (the intended heavy-lane isolation).
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening); the
# trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin. The pins
# here match those already used by .github/workflows/fuzz.yml / ci.yml. The Jena
# tarball is fetched from the Apache archive and verified against a pinned SHA-512
# (the published apache-jena-5.2.0 checksum) before use — a tampered or substituted
# artifact fails the job rather than silently feeding a bad reference engine.
name: shacl-diff-fuzz

on:
  workflow_dispatch:
    inputs:
      count:
        description: "number of seeds (cases) to run"
        required: false
        default: "2000"
  # Daily heavy tier. 05:11 UTC — offset from fuzz.yml (04:23) and ci.yml's coverage
  # cron (03:17) so the heavy nightly lanes do not contend for the same runner window.
  schedule:
    - cron: "11 5 * * *"

permissions:
  contents: read

concurrency:
  group: shacl-diff-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # pySHACL release pinned so the reference engine is reproducible and a future
  # pySHACL change cannot silently break (or silently "fix") the differential; bump
  # deliberately. rdflib comes in as its dependency.
  PYSHACL_VERSION: "0.31.0"
  # Apache Jena release pinned (binary tarball) with its published SHA-512 so the
  # second reference engine is reproducible AND the artifact is verified before use;
  # bump both together (the .sha512 is alongside the tarball on the Apache archive).
  JENA_VERSION: "5.2.0"
  JENA_SHA512: "9a66044573ca269c0a9a1191fe7a8e1925f2d77e2e0bdadddd68616a1bafed1d9819c0b2988dd03614ec778a3882ccb091d825976fc0837406916f9f001b701c"

jobs:
  diff-fuzz:
    name: SHACL differential fuzz (sparq-shacl vs pySHACL + Jena + Node RDF-JS)
    runs-on: ubuntu-latest
    # Generous ceiling: ~thousands of cases × a per-case reference subprocess, now
    # across three engines (each case spawns a fresh interpreter/JVM/Node). A hung
    # run fails with a clear timeout rather than running away.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Java (for the Jena reference engine)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node (for the RDF-JS reference engine)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install pySHACL (reference engine) in a venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/shacl-ref-venv"
          "$RUNNER_TEMP/shacl-ref-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/shacl-ref-venv/bin/pip" install --quiet "pyshacl==${PYSHACL_VERSION}"
          "$RUNNER_TEMP/shacl-ref-venv/bin/python" -c "import pyshacl, rdflib; print('pyshacl', pyshacl.__version__, 'rdflib', rdflib.__version__)"
          echo "SHACL_DIFF_PYTHON=$RUNNER_TEMP/shacl-ref-venv/bin/python" >> "$GITHUB_ENV"
      # Cache the unpacked Jena dist across runs (keyed on the pinned version) so the
      # nightly lane does not re-download ~24 MB every day. A cache miss falls
      # through to the download+verify step below.
      - name: Cache Apache Jena
        id: jena-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apache-jena
          key: apache-jena-${{ env.JENA_VERSION }}
      - name: Install Apache Jena (reference engine), SHA-512 verified
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/apache-jena"
          if [ ! -x "$dest/bin/shacl" ]; then
            tarball="$RUNNER_TEMP/apache-jena.tar.gz"
            url="https://archive.apache.org/dist/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz"
            curl -fsSL --retry 3 -o "$tarball" "$url"
            echo "${JENA_SHA512}  ${tarball}" | sha512sum --check --strict -
            mkdir -p "$dest"
            tar -xzf "$tarball" -C "$dest" --strip-components=1
          fi
          # The harness derives ${JENA_HOME}/lib/* when JENA_HOME is set.
          echo "JENA_HOME=$dest" >> "$GITHUB_ENV"
          "$dest/bin/shacl" --help >/dev/null 2>&1 && echo "Jena shacl CLI OK ($JENA_VERSION)"
      # Cache the Node reference adapter's node_modules across runs (keyed on the
      # committed lockfile) so the nightly lane doesn't reinstall the RDF-JS trees
      # every day. A cache miss falls through to the `npm ci` step.
      - name: Cache Node reference adapter node_modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/sparq-shacl/tests/diff_fuzz/node_modules
          key: shacl-node-adapter-${{ hashFiles('crates/sparq-shacl/tests/diff_fuzz/package-lock.json') }}
      - name: Install the Node / RDF-JS reference engine (pinned via lockfile)
        run: |
          set -euo pipefail
          # `npm ci` installs exactly the committed package-lock.json so the
          # reference engine is reproducible (a pinned shacl-engine, like the pinned
          # pySHACL/Jena). The Rust harness auto-resolves this adapter-local
          # node_modules; SHACL_DIFF_NODE_MODULES makes that explicit + robust.
          npm ci --prefix crates/sparq-shacl/tests/diff_fuzz
          node crates/sparq-shacl/tests/diff_fuzz/node_shacl_adapter.mjs --selftest \
            && echo "Node RDF-JS SHACL adapter selftest OK"
          echo "SHACL_DIFF_NODE_MODULES=$PWD/crates/sparq-shacl/tests/diff_fuzz/node_modules" >> "$GITHUB_ENV"
          # Run the default engine (shacl-engine); rdf-validate-shacl is the same
          # adapter behind the switch and is exercised by the Rust unit selftest.
          echo "SHACL_DIFF_NODE_ENGINE=shacl-engine" >> "$GITHUB_ENV"
      - name: Pick seed count for this trigger
        id: budget
        run: |
          set -euo pipefail
          # workflow_dispatch carries an input; schedule uses the nightly default.
          count="${{ github.event.inputs.count }}"
          if [ -z "$count" ]; then count=2000; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "SHACL diff-fuzz seed count for '${{ github.event_name }}': $count"
      # Build the test binary first so a compile error is reported distinctly from a
      # fuzzing disagreement.
      - name: Build the differential test
        run: cargo build -p sparq-shacl --test diff_fuzz
      - name: Run the differential fuzz (bounded; fails on any disagreement)
        env:
          SHACL_DIFF_SEED_START: "0"
          SHACL_DIFF_COUNT: ${{ steps.budget.outputs.count }}
        run: |
          cargo test -p sparq-shacl --test diff_fuzz -- --ignored --nocapture
