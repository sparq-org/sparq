# [OPUS-4.8] sq-h0tr — mdBook docs-guide BUILD + VALIDATE lane.
#
# SCOPE (a non-publishing validate gate — deliberately, and PERMANENTLY):
#   This workflow installs a PINNED mdbook, builds book/ through the shared
#   scripts/build-guide.sh (which carries the broken-include "[ERROR]" log grep), runs
#   `mdbook test`, and uploads the rendered book as a CI artifact. It runs on PRs that
#   touch the guide or ANY source the guide embeds, so a broken include is caught before
#   it can ship.
#
# WHERE THE GUIDE IS ACTUALLY PUBLISHED ([OPUS-5] issue #5022 — decided, no longer a blocker):
#   GitHub Pages exposes exactly ONE deploy slot, and pages.yml owns it (the Next.js
#   showcase at /, the benchmark dashboards overlaid at /dev/bench*, the operational GUI at
#   /app/). So this lane still ships NO deploy job: a SECOND `actions/deploy-pages` here
#   would race pages.yml last-writer-wins. Instead, per
#   research/docs-site-single-sourcing-anti-drift.md §7 option (a), pages.yml BUILDS AND
#   OVERLAYS this same guide into its single artifact at **out/guide/**, published at
#   https://sparq.jeswr.org/guide/ . One producer, one deploy slot, no race, no live URL
#   moves. Options (b) guide-at-root and (c) two deploy workflows are rejected there.
#
#   The two lanes must stay equivalent — this one is only a meaningful gate if it builds
#   what pages.yml ships. Both therefore call the SAME scripts/build-guide.sh and pin the
#   SAME mdbook version below, and scripts/check-guide-publish-wiring.py fails CI if either
#   invariant drifts (it also binds the /guide/ mount to book.toml's `site-url`).
#
# [OPUS-4.8] sq-zngy — NOTE: the live Pages producer is pages.yml, not this lane. The
# `dev/bench*` dashboard fold (bench.yml's dev/bench + bench-ec2.yml's dev/bench-ec2, both
# on the benchmark-data branch), the guide overlay, and the assembled-artifact smoke check
# all live in pages.yml's build job. Do not re-derive them here.

name: docs

on:
  # [OPUS-4.8] sq-5f1s4 / sq-im8u / sq-g4h0c — self-guarding path filter: the build embeds
  # source it does NOT live next to. `book/src/getting-started/install.md` does
  # `{{#rustdoc_include ../../../crates/sparq-engine/examples/quickstart.rs:quickstart}}`;
  # (as of sq-im8u) the guide pages `{{#include}}` canonical prose from `README.md`
  # (`lead`/`quickstart-cli` anchors) and `skills/{zk-query-proofs,mpc}/SKILL.md`
  # (`scaffold-caveat` anchors); and (as of sq-g4h0c) `capabilities.md` `{{#include}}`s the
  # README `features-core`/`interfaces` anchors, whose repo-relative links are then rewritten by
  # the `link-fixup` preprocessor `scripts/mdbook-rewrite-links.py` (wired in book.toml).
  # `mdbook build`/`mdbook test` resolve every anchor AND run the preprocessor, so if an anchor
  # were renamed/removed (or the example stopped compiling, or the preprocessor regressed) and
  # the filter only watched `book/**`, the break would land on main undetected — no
  # `book/`-touching commit would re-run this lane to catch it (the gui.yml/#1081 blind-spot
  # class). So every embedded source AND the preprocessor are listed too. (mdBook EXITs 0 on a
  # broken include — the build step greps the log for `[ERROR]` — so re-running THIS lane on a
  # source/preprocessor edit is the only thing that catches it.)
  push:
    branches: [main]
    paths:
      - "book/**"
      - "scripts/mdbook-rewrite-links.py"
      - "scripts/build-guide.sh"
      - "crates/sparq-engine/examples/quickstart.rs"
      - "README.md"
      - "skills/zk-query-proofs/SKILL.md"
      - "skills/mpc/SKILL.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "scripts/mdbook-rewrite-links.py"
      - "scripts/build-guide.sh"
      - "crates/sparq-engine/examples/quickstart.rs"
      - "README.md"
      - "skills/zk-query-proofs/SKILL.md"
      - "skills/mpc/SKILL.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least-privilege (Scorecard TokenPermissions): read-only — this lane neither
# pushes nor deploys.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pinned, prebuilt mdbook (GitHub Releases binary — reproducible + fast, no
      # cargo compile). Explicit `tool:` is required by the sq-ur7o install-action lint.
      - name: Install mdbook (pinned)
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: mdbook@0.4.40

      # [OPUS-5] issue #5022 — the build itself moved into scripts/build-guide.sh so this
      # VALIDATE lane and pages.yml's PUBLISH lane build the guide identically (see header).
      # The script keeps the load-bearing detail this step used to carry inline: mdBook EXITS 0
      # even on a broken {{#include}}/anchor (rust-lang/mdBook#1094), so it captures the log and
      # FAILS on any "[ERROR]" line in addition to the process exit code.
      - name: Build guide
        run: |
          set -euo pipefail
          bash scripts/build-guide.sh book
          echo "OK: mdbook build clean (no [ERROR] lines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test guide (compile-check rust fences)
        run: |
          set -euo pipefail
          mdbook test book
          echo "OK: mdbook test passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered guide (CI artifact only — NOT a Pages deploy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-guide
          path: book/book
          if-no-files-found: error
