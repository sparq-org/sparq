# GitHub Release pipeline (T20): tag `vX.Y.Z` -> build, package, checksum, release, docker.
#
# [OPUS-4.8] sq-v286.2: the per-hardware-tier build matrix is no longer inlined here. It is
# defined ONCE in the reusable workflow `build-matrix.yml` and invoked below with
# `mode: archive` (the `package` job is a `workflow_call`). release.yml remains THE entry point
# for cutting a release (it fires on a `v*` tag and is the path the release-plz tag flow will
# drive — research/release-ci-design.md §6 item 4); dist.yml is now dispatch-only and calls the
# same reusable matrix with `mode: binary`. This ends the hand-synced double-matrix +
# double-build the design record flags (§5 "Reuse, do not duplicate"; §6 item 2 "Unify the
# duplicated build matrix via workflow_call; drop dist.yml's tags trigger").
#
# Release artifacts keep their distinct shape vs dist's bare binaries: versioned archives
# (tar.gz / zip) containing the binary + README + LICENSE + CHANGELOG, plus a SHA256SUMS
# manifest — produced by the reusable workflow's `archive` mode + the `release` job below.
#
# Triggers: version tags AND manual workflow_dispatch — both are deliberate releasing acts. NO
# schedule, NO pull_request, so this workflow NEVER runs as a PR check and never gates a PR (the
# required branch-protection check is `ci-summary / gate`, which only ever evaluates PR/main
# events — release.yml has no `pull_request` trigger, so it is invisible to that aggregator).
#
# [OPUS-4.8] sq-gl3cf: a `v*` tag push is the canonical release; `workflow_dispatch` is the
# developer/test path that builds + attaches the SAME assets (GUI bundles, archives, SBOM/VEX,
# docker image) WITHOUT pushing a real `v*` tag. On dispatch, `github.ref_name` is the BRANCH the
# dispatch ran on (NOT a version), so every place asset identity / the release tag was derived
# from `github.ref_name` is now threaded from the `setup` job's single `version` output
# (`inputs.tag` on dispatch, `github.ref_name` on tag push). Dispatch builds are pre-release by
# default. There is NO double-build on tag: a single event fires exactly one trigger, and `setup`
# resolves the version for whichever fired.
name: release

on:
  push:
    tags: ["v*"]
  # [OPUS-4.8] sq-gl3cf: manual path to build + attach the release assets (incl. the UNSIGNED
  # Tauri desktop GUI bundles) without cutting a real `v*` tag — for developer/test releases.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag the built assets attach to (e.g. v0.1.0-dev). MUST be a vX.Y.Z release tag —
          the publish-cadence guard (#2552) refuses anything else, because it cannot tell which tag
          to exclude from the interval sources. A developer/test dispatch SHOULD use a -dev /
          pre-release suffix so it is never mistaken for a canonical release.
          This is the single source of asset naming + the GitHub Release tag on the dispatch path.
        required: true
        type: string
      prerelease:
        description: "Mark the created GitHub Release as a pre-release (default true for dispatch builds)."
        required: false
        type: boolean
        default: true

# Default: read-only. Jobs that need more (release: contents, docker: packages) opt in below.
permissions:
  contents: read

jobs:
  # ---- 0. resolve the single version string used for asset identity + the release tag ----
  # [OPUS-4.8] sq-gl3cf: ONE source of truth for the version, consumed by EVERY job that names an
  # asset or attaches to a tag. On a `v*` tag push, `inputs.tag` is empty and `github.ref_name` is
  # the tag (e.g. `v0.1.0`). On `workflow_dispatch`, `inputs.tag` is the developer-supplied release
  # tag and `github.ref_name` is the BRANCH (wrong for asset identity) — so `${{ inputs.tag ||
  # github.ref_name }}` picks the dispatch input when present and the tag otherwise. This output is
  # threaded into `gui-bundle`, `sbom`, `package` (via build-matrix.yml's `version` input), and
  # `release` (tag_name + body links) so BOTH triggers name assets + tag the Release identically.
  setup:
    name: resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      # [OPUS-5] issue #2552 — THE CADENCE GUARD ON THE TAG-PUSH PATH. LOAD-BEARING.
      #
      # Maintainer, verbatim: "We need to make sure that we do not create many many
      # releases so please put a policy in place to ensure we do not do more than 1
      # release a day." The policy is ONE constant — `MIN_RELEASE_INTERVAL` (24h) in
      # scripts/release-interval-guard.py — enforced at BOTH points a release can start:
      #   * release-plz.yml's `release-plz-release` job (the Release-PR path), and
      #   * HERE, the `v*` tag push, which is the runbook's canonical instruction
      #     ("nothing publishes until you push a `v*` tag") and was previously UNCADENCED:
      #     a hand-pushed tag fires this workflow directly, never touching release-plz.
      #
      # WHY IN `setup` AND NOT ITS OWN JOB: every other job here depends on `setup`
      # (directly, or through it), so a refusal stops the archives, the SBOM/VEX, the
      # GitHub Release and the ghcr image. A separate `needs:` job would instead SKIP its
      # dependents on the dispatch path, which silently produces a release with no assets.
      #
      # WHY `--released-tag`: on a tag push, `v<workspace version>` is already in the tag
      # list, so the guard's "already tagged => `release-plz release` is a no-op" branch
      # would short-circuit to ALLOW and this step would be VACUOUS. `--released-tag`
      # excludes the tag being cut and suppresses that branch, so the interval is measured
      # against the PREVIOUS release. The `fetch-depth: 0` checkout below is a
      # PRECONDITION — on a shallow checkout the tag list is not authoritative and the
      # guard refuses rather than guessing.
      #
      # WHY UNCONDITIONAL — including `workflow_dispatch`. A dispatch build looks like a
      # developer/test path (pre-release, `dev-`-prefixed image tags), but the Release it
      # creates fires `release: published`, and publish.yml's `npm` job runs on ANY
      # `release` event. So a dispatch reaches a registry too: exempting it would leave the
      # loophole this guard exists to close. The escape hatch the guard's no-override
      # design reserves is a maintainer publishing BY HAND, outside CI — not dispatching a
      # workflow that publishes for them. Consequence, by design: `inputs.tag` must be a
      # `vX.Y.Z` release tag (a `-dev` suffix is fine); anything else refuses, because the
      # guard cannot tell which tag to exclude from the cadence sources.
      #
      # DO NOT add an `if:`, do not add `continue-on-error`, do not swap `--enforce` for
      # `--dry-run`, and do not append `|| true`.
      # scripts/tests/test_release_publish_guard.py parses THIS FILE structurally and
      # fails on each of those mutations.
      - name: Checkout (full history — the `v*` tag list must be authoritative)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Publish-cadence guard (fail-closed minimum release interval, #2552)"
        env:
          # Via env, never string-interpolated into the shell: a tag name is attacker-
          # controlled text and `run:` interpolation would splice it into the command.
          RELEASED_TAG: ${{ steps.v.outputs.version }}
        run: python3 scripts/release-interval-guard.py --enforce --repo-root . --released-tag "${RELEASED_TAG}"

  # ---- 1. build + package per hardware tier ----
  # [OPUS-4.8] sq-v286.2: invoke the shared reusable matrix in `archive` mode. The 10-tier
  # runner-label matrix + build steps + the sq-zqq6 SLSA archive attestation all live in
  # build-matrix.yml now (single source of truth); this caller only selects the artifact shape.
  # The reusable workflow's matrix job attests + uploads `pkg-<tier>`; the `release` job below
  # consumes those artifacts. `permissions:` here is the ceiling passed down to the called
  # workflow — it must grant the OIDC + attestation writes the attestation step needs.
  package:
    # [OPUS-4.8] sq-gl3cf: thread the resolved version into the reusable matrix so the per-tier
    # archives are named `sparq-cli-<version>-<tier>` on BOTH triggers (on dispatch, the matrix's
    # own `github.ref_name` is the branch and would mis-name every archive).
    needs: setup
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-matrix.yml
    with:
      mode: archive
      version: ${{ needs.setup.outputs.version }}

  # ---- 1a. ISOLATED trusted-builder SLSA provenance over the release archives ----
  # [OPUS-5] sq-toze.25 (GX-11 / SL-B3-b) — the SLSA **Build L3** lane for the release archives.
  #
  # THE GAP THIS CLOSES. `package` (above) already emits provenance with
  # `actions/attest-build-provenance`, but that step runs in the SAME job as
  # `cargo auditable build`: the OIDC token and the signing step share an execution context with
  # user-controlled build steps, so a compromised build step could in principle taint the inputs
  # the attestation describes. That ceiling is SLSA Build **L2**, and it is what
  # compliance/slsa/controls.md SL-B3-b records as the L3 blocker.
  #
  # THE BOUNDARY. `slsa-framework/slsa-github-generator`'s generic generator is a trusted
  # reusable workflow: it runs in its OWN job, mints its OWN OIDC token, and the only thing it
  # accepts from us is `base64-subjects` — a list of digests. No step of ours executes inside it,
  # and nothing inside it can be reached from `package`. So the provenance is generated by a
  # control plane the build steps cannot influence, which is the L3 property.
  #
  # WHAT THIS DOES *NOT* CLAIM. The subjects are the digests the build matrix reported. A build
  # step that produced a malicious archive still gets provenance over THAT archive — L3 makes the
  # provenance non-falsifiable, it does not make the build trustworthy. And the scope of THIS job
  # is the ARCHIVES ONLY — [OPUS-5] #4570 added the sibling `provenance-artifacts` job for the GUI
  # bundles / SBOM/VEX / conformance report and `dist.yml#provenance` for the tiered binaries, but
  # the ghcr image still attests in-band (L2). GX-11 therefore NARROWS; it does not close.
  #
  # WHY A TAG REF, NOT A SHA — the ONE documented exception to this repo's SHA-pin convention.
  # The generator derives the trusted-builder identity that ends up in the provenance (and that
  # `slsa-verifier` checks a consumer policy against) from its own `@ref`. Referenced by commit
  # SHA it cannot resolve a builder identity a verifier will accept, so the tag IS the trust
  # anchor here — pinning to a SHA would break the very property the job exists to provide.
  # Bump this tag deliberately (it is a trust decision, not a Dependabot bump).
  #
  # STATUS — DOCUMENTED-UNTESTED. release.yml is tag/dispatch-triggered, so this job does not run
  # on a PR. Its shape is pinned structurally by scripts/tests/test_release_slsa_l3_provenance.py;
  # its RUNTIME behaviour is first exercised on the next `v*` tag. Until a tag proves it green,
  # treat the L3 claim as WIRED, not VERIFIED (compliance/slsa/controls.md says exactly this).
  provenance:
    needs: [setup, package]
    permissions:
      actions: read # read the workflow definition the provenance records as the entry point
      id-token: write # mint the generator's OWN signing identity (never shared with `package`)
      contents: read # `upload-assets: false` below — the `release` job attaches the file, not this
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      # The ONLY input crossing the isolation boundary: digests, computed by `package`, of the
      # bytes it uploaded. Deliberately threaded — this job must never recompute them from
      # artifacts, which would drag the build's outputs back inside the trusted builder.
      base64-subjects: ${{ needs.package.outputs.hashes }}
      # `upload-assets: false`: the generator's own uploader attaches to `github.ref`'s release,
      # which on a workflow_dispatch is a BRANCH (the same trap sq-gl3cf fixed everywhere else),
      # and the `release` job below is the single place this pipeline creates the Release. We
      # download the provenance artifact there instead, so it lands in SHA256SUMS for free.
      upload-assets: false
      provenance-name: sparq-cli-${{ needs.setup.outputs.version }}.intoto.jsonl

  # ---- 1b. per-release CycloneDX SBOM + VEX ----
  # [OPUS-4.8] sq-toze.3 (GX-2): emit a CycloneDX SBOM for each released binary plus a VEX
  # (the checked-in supply-chain/vex.cdx.json, version-stamped) justifying the advisories
  # cargo-deny is configured to ignore. Both are uploaded as an artifact for the `release`
  # job to attach to the GitHub Release, and SLSA-attested here (binding their digests to
  # this workflow run; verifiable with `gh attestation verify`).
  sbom:
    name: CycloneDX SBOM + VEX
    # [OPUS-4.8] sq-gl3cf: needs the resolved version so the per-release SBOM/VEX filenames carry
    # the dispatch tag (on dispatch the scripts' GITHUB_REF_NAME fallback is the branch).
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-cyclonedx
      # [OPUS-4.8] sq-toze.27 (GS-3): Node for the JS/npm SBOM of the published WASM client.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # [OPUS-4.8] sq-gl3cf: pass VERSION explicitly. gen-sbom-vex.sh honors $VERSION (falling
      # back to GITHUB_REF_NAME), but on a workflow_dispatch GITHUB_REF_NAME is the BRANCH, so the
      # SBOM/VEX filenames would be mis-stamped — thread the resolved version instead.
      - name: Generate per-release SBOM + VEX
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: scripts/gen-sbom-vex.sh
      # [OPUS-4.8] sq-toze.27 / [GPT-5.6] sq-epbw4: per-release CycloneDX SBOMs for
      # `@sparq-org/sparq` and the shared `@sparq/client` code bundled into browser artifacts.
      # Runtime + full build trees land in sbom/, so the attestation glob below covers all four.
      # [OPUS-4.8] sq-gl3cf: gen-js-sbom.sh ALSO reads GITHUB_REF_NAME for the version-stamped
      # filenames, so it needs the same VERSION thread for the dispatch path to name JS SBOMs right.
      - name: Generate per-release JS/npm SBOMs (WASM + shared browser clients)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: scripts/gen-js-sbom.sh
      - name: Attest build provenance (SBOM + VEX)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            sbom/*.sbom.cdx.json
            sbom/*.vex.cdx.json
      # [OPUS-5] #4570 (GX-11 residual): publish the SBOM/VEX digests as data for the ISOLATED
      # trusted builder (`provenance-artifacts` below). The in-band attestation above stays — it
      # is what `gh attestation verify` reads — but it shares this job's execution context with
      # the generator scripts, which is the L2 ceiling. Digests are taken over the SAME set the
      # `sbom-vex` artifact uploads (`sbom/*.json`), so every byte that reaches the Release is a
      # subject. `cd sbom` so each subject name is the RELEASED asset name, not a path.
      # ubuntu-only job, so GNU `sha256sum` is always present (unlike the matrix lanes).
      - name: Record SBOM/VEX digests (subjects for the isolated provenance builder)
        shell: bash
        run: |
          set -euo pipefail
          cd sbom
          shopt -s nullglob
          files=( *.json )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: SBOM/VEX generation produced no artifact to attest" >&2
            exit 1
          fi
          sha256sum -- "${files[@]}" > subject-hashes-sbom.txt
          cat subject-hashes-sbom.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `subject-hashes-*` is the collector's download pattern and is deliberately DISJOINT
          # from both `pkg-*` (published release assets) and `archive-hashes-*` (the archives'
          # own subjects) — the two provenance bundles must not silently attest each other's set.
          name: subject-hashes-sbom
          path: sbom/subject-hashes-sbom.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-vex
          path: sbom/*.json
          if-no-files-found: error

  # ---- 1c. per-release served-surface SPARQL 1.1 Protocol conformance report ----
  # [OPUS-4.8] sq-ro6if (PSS #1415/#1478): publish the MACHINE-READABLE served-surface conformance
  # report for THIS release commit and attach it to the GitHub Release, so an HTTP consumer (e.g.
  # prod-solid-server, which consumes only the served /sparql surface) can trust the served WIRE
  # contract per released tag without re-verifying it against every SHA. Built by re-running the
  # EXISTING served-surface lanes (sq-jaj38 http-protocol + sq-1uuxz Service-Description/GSP)
  # in-process via the `served-conformance-report` binary — NO new conformance tests, publication
  # only. FAIL-CLOSED: the binary exits non-zero (failing this job, blocking the whole release) if a
  # lane produced zero assertions (the vacuous-artifact class), has any genuine failure, or
  # regressed below its ratchet floor. SLSA build-provenance attested + uploaded exactly like the
  # SBOM/VEX above, so the `release` job folds it into SHA256SUMS + the GitHub Release for free.
  served-conformance:
    name: served-surface conformance report
    # [OPUS-4.8] sq-ro6if: needs the resolved version so the per-release report filename carries the
    # release tag (mirrors the SBOM job's VERSION thread; on dispatch GITHUB_REF_NAME is the branch).
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Emit served-surface conformance report (JSON, fail-closed)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          SPARQ_CONFORMANCE_COMMIT: ${{ github.sha }}
          SPARQ_CONFORMANCE_VERSION: ${{ needs.setup.outputs.version }}
          SPARQ_CONFORMANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p conformance
          # Debug (no --release): the report is a quick in-process run against the loopback server,
          # so optimisation buys nothing and a debug compile is faster to produce the artifact.
          cargo run -p sparq-conformance \
            --features http-protocol,federation-descriptors \
            --bin served-conformance-report -- \
            --out "conformance/served-conformance-${VERSION}.json"
      - name: Attest build provenance (served-surface conformance report)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: conformance/served-conformance-*.json
      # [OPUS-5] #4570 (GX-11 residual): same digest hand-off as the SBOM lane — the conformance
      # report is a consumer-facing assurance artifact, so provenance a compromised build step
      # could restate is exactly the wrong property for it.
      - name: Record conformance-report digests (subjects for the isolated provenance builder)
        shell: bash
        run: |
          set -euo pipefail
          cd conformance
          shopt -s nullglob
          reports=( served-conformance-*.json )
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "ERROR: the conformance run produced no report to attest" >&2
            exit 1
          fi
          sha256sum -- "${reports[@]}" > subject-hashes-conformance.txt
          cat subject-hashes-conformance.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-hashes-conformance
          path: conformance/subject-hashes-conformance.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: served-conformance
          path: conformance/served-conformance-*.json
          if-no-files-found: error

  # ---- 1d. Tauri desktop GUI bundles (UNSIGNED) ----
  # [OPUS-4.8] sq-8n1c: build the cross-platform Tauri 2 desktop INSTALLERS — .dmg (+ .app)
  # on macOS, .msi + NSIS .exe on Windows, .deb + .AppImage on Linux — as ADDITIONAL release
  # artifacts on the same desktop platforms the `package` matrix already covers, per the GUI
  # design record (research/gui-design.md §3 "Releases"). They are SLSA build-provenance
  # attested here (subject-path below), uploaded as `pkg-gui-<label>`, and the `release` job's
  # `pattern: pkg-*` download then folds them into SHA256SUMS + the GitHub Release for free —
  # so the existing SBOM/VEX/provenance/checksum estate covers them with no bespoke wiring.
  #
  # UNSIGNED — and that is a deliberate, honest limitation, NOT an oversight:
  #   * macOS bundles are NOT codesigned/notarized (Apple Developer ID cert + notarytool key
  #     are maintainer-held) -> Gatekeeper will quarantine them on download.
  #   * Windows .msi/.exe are NOT Authenticode-signed (EV/OV cert is maintainer-held)
  #     -> SmartScreen will warn on download.
  # Real OS-level signing is the SEPARATE needs:user bead sq-v286.8 (Apple Developer ID +
  # Windows Authenticode); this job MUST NOT fabricate signing. The SLSA attestation below
  # proves WHO BUILT the bundle (build provenance), which is orthogonal to and NOT a substitute
  # for OS code-signing. Until sq-v286.8 lands, these are test-/developer-install bundles.
  #
  # SCOPE — desktop installers only. The matrix covers exactly the desktop (platform, arch)
  # pairs that produce a native installer, one row per pair (NOT per microarch tier — a .deb is
  # arch-keyed, not -Ctarget-cpu-keyed, so the x64-linux baseline/v2/v3/v4 split the `package`
  # matrix carries collapses to ONE Linux-x64 bundle row here). Runner labels are the EXACT set
  # proven in build-matrix.yml + gui.yml so the GUI and CLI/server matrices cannot drift.
  #
  # win-arm64 is DELIBERATELY ABSENT: build-matrix.yml produces the aarch64-pc-windows-msvc
  # CLI/server binaries by CROSS-LINKING from the x64 Windows runner, but the Tauri bundler runs
  # the host-arch installer toolchain (NSIS/WiX) and cannot reliably cross-bundle an arm64
  # Windows installer from an x64 host — so there is no win-arm64 GUI installer this pass (an
  # honest gap, not a silent drop). Mobile (Android .aab / iOS .ipa) is the separate net-new
  # bead sq-v286.9 — no rows here.
  #
  # ====================================================================================
  # [OPUS-4.8] sq-gl3cf: STABLE, PREDICTABLE per-OS asset names — the /download page can
  # hardcode these. The `Stage GUI bundles` step below maps each matrix `label` to ONE canonical
  # `{arch}` token and emits `sparq-gui_<version>_<arch>.<ext>` per produced bundle EXT (NOT the
  # old nested `sparq-gui-<ver>-<label>-<tauri's own sparq_<ver>_<arch>.<ext>>` double-version).
  # `<version>` is the resolved release tag (needs.setup.outputs.version: the `v*` tag on a tag
  # push, the dispatch `inputs.tag` on dispatch). EXACT emitted names per row:
  #
  #   label=arm64-darwin (macOS arm64):  sparq-gui_<version>_aarch64.dmg
  #   label=x64-darwin   (macOS x64):    sparq-gui_<version>_x86_64.dmg
  #   label=win-x64      (Windows x64):  sparq-gui_<version>_x64.msi
  #                                      sparq-gui_<version>_x64-setup.exe   (NSIS)
  #   label=x64-linux    (Linux x64):    sparq-gui_<version>_amd64.AppImage
  #                                      sparq-gui_<version>_amd64.deb
  #   label=arm64-linux  (Linux arm64):  sparq-gui_<version>_arm64.AppImage
  #                                      sparq-gui_<version>_arm64.deb
  #
  # A label maps to ONE arch token, but Windows/Linux emit TWO files (different ext) per label;
  # both carry the same `<arch>` token, differing only by ext (and `-setup.exe` disambiguates the
  # NSIS installer from any future plain `.exe`). The per-EXT glob + `found==0 -> fail` guard are
  # preserved. The SLSA attest `subject-path: gui-bundles/*` and the `pkg-gui-<label>` upload name
  # are UNCHANGED.
  # ====================================================================================
  gui-bundle:
    name: "GUI desktop bundle ${{ matrix.label }} (unsigned)"
    # [OPUS-4.8] sq-gl3cf: the resolved version is the asset-name token for every bundle.
    needs: setup
    runs-on: ${{ matrix.os }}
    # [OPUS-4.8] sq-gl3cf — a documented-untested platform's bundler MUST NOT fail the whole
    # release. `continue-on-error` is per-row (matrix.soft): Linux rows are BLOCKING (the full
    # frontend chain is reproduced locally + the GUI crate is proven green in gui.yml), while
    # macOS/Windows rows are SOFT this pass (their native .dmg/.msi/NSIS bundler steps are
    # documented-untested — see the job header). A soft row that fails reports `success` to the
    # `release` job's `needs`, and its `pkg-gui-<label>` upload is simply skipped — so the release
    # still ships every working bundle + its SLSA attestation, and `release`'s `pattern: pkg-*`
    # download tolerates the missing artifact. Any deferred platform is tracked HONESTLY in
    # sq-gl3cf (documented-WIP, NOT hidden). Flip a row's `soft` to `false` once it is proven green.
    continue-on-error: ${{ matrix.soft }}
    # SLSA build-provenance attestation over the produced bundles needs the OIDC token +
    # attestation write; read-only on the repo otherwise (uploads a workflow artifact, the
    # `release` job creates the Release).
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 60
    strategy:
      # One platform's bundler failure must not cancel the others — each desktop installer is
      # independent. A BLOCKING row (soft:false) that fails fails the `release` job via `needs`
      # (correct: a release should not silently ship missing a proven platform's installer); a
      # SOFT row (soft:true) is non-fatal (continue-on-error above).
      fail-fast: false
      matrix:
        include:
          # Linux: fully reproduced locally + proven green in gui.yml -> BLOCKING (soft:false).
          - { os: ubuntu-latest, label: x64-linux, soft: false }
          - { os: ubuntu-24.04-arm, label: arm64-linux, soft: false }
          # macOS/Windows: native bundlers documented-untested this pass -> SOFT (non-fatal).
          - { os: macos-14, label: arm64-darwin, soft: true }
          - { os: macos-15-intel, label: x64-darwin, soft: true }
          - { os: windows-latest, label: win-x64, soft: true }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The Tauri webview + bundler system libraries are LINUX-ONLY (macOS ships WKWebView,
      # Windows ships WebView2). This is the SAME apt set gui.yml installs to build the GUI
      # crate; the bundler additionally needs the deb/appimage tooling, which these packages
      # (+ patchelf, used by the AppImage bundler) provide.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # [OPUS-4.8] sq-gl3cf — the GUI frontend (gui/app) is a DISTINCT operational Next.js app
      # (repointed off the marketing site by PR #1003 / sq-ixc3.8). Its `prebuild` hook
      # (gui/app/scripts/sync-wasm.mjs) needs the lean shacl,jsonld wasm bundle present in js/wasm/.
      # Mirror gui.yml's proven-green `gui-app`/`tauri-e2e` jobs: build the wasm bundle FIRST.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm bundle (shacl,jsonld)
        working-directory: js
        run: npm run build:wasm

      # [OPUS-4.8] sq-gl3cf — the GUI frontend (gui/app) is a repo-ROOT npm-workspace member
      # (root package.json `workspaces` lists `gui/app`, alongside `packages/*`, `site`, `js`).
      # A workspace-aware repo-root `npm install` installs gui/app's deps (next, cross-env, …)
      # into the hoisted root node_modules — so the explicit `Build GUI frontend` step below
      # resolves `next`/`cross-env` from root .bin. This is EXACTLY the install the proven-green
      # gui.yml `gui-app` ("Install workspace dependencies") + `tauri-e2e` jobs use.
      # (`npm install`, not `npm ci`, matches gui.yml — tolerant of a not-yet-regenerated lock.)
      # The Windows `npm install` ENOENT/EPERM (run 27890097353) was the @sparq-org/sparq workspace
      # member's `prepare` hook (js/guardrails/prepare-build.mjs) calling `execFileSync('npm',…)`
      # WITHOUT `shell:true`, so `npm.cmd` did not resolve on Windows (`spawnSync npm ENOENT`),
      # whose crash then triggered npm's rollback `EPERM rmdir node_modules/next` cleanup warnings.
      # That root cause is fixed in prepare-build.mjs (shell:true) in the same change as this.
      - name: Install workspace dependencies (incl. gui/app)
        run: npm install

      # [OPUS-4.8] sq-gl3cf — BUILD THE FRONTEND EXPLICITLY here, instead of relying on Tauri's
      # `beforeBuildCommand` (`cd ../app && npm run build:tauri` in gui/src-tauri/tauri.conf.json).
      # Run 27890097353 failed EVERY Linux + macOS row at `sh: cd: can't cd to ../app`: Tauri runs
      # `beforeBuildCommand` from its inferred FRONTEND dir, NOT from gui/src-tauri (tauri-cli
      # helpers::run_hook -> cwd = frontend_dir()), so the config's `cd ../app` (which assumes
      # CWD=gui/src-tauri) resolves against the wrong base and ENOENTs. This is the EXACT pattern
      # gui.yml's `tauri-e2e` job uses (`(cd gui/app && npm run build:tauri)`) — proven green.
      # `cross-env` (a gui/app devDependency) keeps `build:tauri`'s `NEXT_PUBLIC_BASE_PATH=`
      # shell-portable across runners. Produces gui/app/out — the `frontendDist: "../app/out"`
      # the Tauri shell embeds. REPRODUCED locally on this work box (x64-linux): wasm build →
      # workspace install → `gui/app` `build:tauri` produces gui/app/out/index.html.
      - name: Build GUI frontend (static export -> gui/app/out)
        working-directory: gui/app
        run: npm run build:tauri

      # tauri-cli (the `cargo tauri build` driver). Installed via `cargo install … --locked`,
      # the SAME pattern gui.yml uses for wasm-pack / tauri-driver (a cargo install is not a
      # pinned GitHub Action, so no SHA pin applies); `^2` tracks the Tauri 2 line the crate
      # depends on (gui/src-tauri/Cargo.toml `tauri = { version = "2" }`).
      - name: Install tauri-cli (v2)
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # [OPUS-4.8] sq-gl3cf — write a CI-ONLY config overlay that EMPTIES `beforeBuildCommand`.
      # tauri-cli's run_hook treats an empty `beforeBuildCommand` as "skip" (HookCommand::Script(s)
      # if s.is_empty() => no-op; the official config docs list `"beforeBuildCommand": ""` as a
      # valid value). The frontend is already built by the explicit step above, so `cargo tauri
      # build` just bundles the existing `frontendDist` (gui/app/out) — it never runs the CWD-fragile
      # `cd ../app` hook that failed run 27890097353. We do NOT edit tauri.conf.json (the dev path
      # still uses its `beforeDevCommand`); this overlay is release-CI scoped. Written from a
      # `shell: bash` step so it is byte-identical on Windows runners (Git Bash) too.
      - name: Write CI tauri config overlay (skip beforeBuildCommand; frontend prebuilt)
        shell: bash
        working-directory: gui/src-tauri
        run: |
          set -euo pipefail
          printf '%s\n' '{ "build": { "beforeBuildCommand": "" } }' > tauri.ci.conf.json
          echo "overlay written:"; cat tauri.ci.conf.json

      # Build the UNSIGNED desktop bundle. `cargo tauri build` runs from gui/src-tauri, merges the
      # CI overlay (`-c tauri.ci.conf.json`) so the `beforeBuildCommand` hook is skipped (frontend
      # already exported to gui/app/out above), and enables the native capabilities promised by
      # the desktop release: HDT import, SERVICE federation, ODRL policy previews, and
      # SHACL-derived forms.
      # [SONNET-4.6] sq-b1hdb — keep these explicit because the crate defaults intentionally remain
      # lean; omitting them silently compiles the rebuild-hint stubs into shipped installers.
      # Keep this feature list in sync with gui.yml's "release feature union" clippy lane.
      # The command compiles the native Rust shell embedding gui/app/out (`frontendDist`) and
      # bundles installers for the host platform into
      # gui/src-tauri/target/release/bundle/<format>/. `--ci` disables interactive prompts;
      # no signing env vars are set, so the bundles are produced UNSIGNED (see the job header
      # — signing is needs:user sq-v286.8). [SONNET-4.6] sq-3w29b: release bundles explicitly
      # enable the native HDT importer, federated SERVICE client, and ODRL policy tool. These
      # native capabilities stay off for lean development builds; Forms remains opt-in until a
      # release explicitly selects its larger SHACL model stack. `--verbose` aids diagnosis.
      #
      # PROVEN vs DOCUMENTED-UNTESTED (honest status — this workflow is tag-triggered, so it
      # does NOT run on this PR; validate on the first real `v*` tag):
      #   * The frontend chain (wasm bundle → root `npm install` → gui/app `build:tauri` →
      #     gui/app/out) is REPRODUCED locally on this work box (x64-linux): it produces
      #     gui/app/out/index.html with ROOT-RELATIVE assets, the path `frontendDist` reads.
      #   * The empty-`beforeBuildCommand` skip is confirmed from tauri-cli source (run_hook).
      #   * The native capability feature set (`hdt,federation,odrl,forms`) is clippied and
      #     tested in debug mode by gui.yml's ADVISORY (non-gating) tauri-build job. HDT is
      #     compile-covered in that feature-on state; the combined-state tests exercise the
      #     federation, ODRL, and forms paths. `custom-protocol` is exercised only by jobs that
      #     first export gui/app/out for compile-time embedding.
      #   * Linux rows (ubuntu-latest, ubuntu-24.04-arm): gui.yml covers the GUI crate + webkit
      #     dependencies in advisory debug builds. The release profile (LTO, one codegen unit)
      #     and the .deb/.AppImage bundle step are first exercised here.
      #   * macOS rows: WKWebView ships with the OS; the .dmg/.app bundle is documented-untested.
      #   * Windows row: WebView2 ships with the OS; the prepare-hook ENOENT root cause is fixed,
      #     and the .msi/NSIS .exe bundle step itself is still documented-untested. If a platform
      #     still fails the bundler on first cut, its row is marked non-fatal (see `continue-on-error`
      #     on the matrix) so the release ships the working bundles + attestation; sq-gl3cf tracks it.
      - name: Build Tauri desktop bundle (unsigned)
        working-directory: gui/src-tauri
        run: cargo tauri build --ci --verbose -c tauri.ci.conf.json --features hdt,federation,odrl,forms

      # All optional native capabilities above have lean-build stubs with a developer-facing
      # rebuild hint (engine.rs, federation.rs, odrl.rs, and forms.rs). A successful bundle build
      # is insufficient evidence that the features were linked, so reject any release binary
      # that still contains the shared stub wording.
      - name: Verify native capabilities are compiled into the release binary
        shell: bash
        working-directory: gui/src-tauri
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          fi
          binary=""
          for candidate in "target/release/sparq${ext}" "target/release/sparq-gui${ext}"; do
            if [[ -f "$candidate" ]]; then
              binary="$candidate"
              break
            fi
          done
          if [[ -z "$binary" ]]; then
            echo "ERROR: no release binary found under target/release" >&2
            ls -la target/release >&2 || true
            exit 1
          fi
          echo "Checking native capabilities in $binary"
          if grep -aEq "rebuild (the )?desktop app with" "$binary"; then
            echo "ERROR: release binary contains a native-capability rebuild stub" >&2
            exit 1
          fi

      # Collect every produced installer into a flat staging dir under a STABLE, PREDICTABLE
      # per-OS name (the scheme the /download page hardcodes — see the documented names in the
      # job header). Tauri names bundles `<productName>_<version>_<tauri-arch>.<ext>` (e.g.
      # `sparq_0.1.0_amd64.deb`), which nests Tauri's OWN version + arch token; we DISCARD that
      # raw basename and re-emit `sparq-gui_<version>_<arch>.<ext>` where <version> is the
      # resolved release tag and <arch> is the matrix label mapped to a single canonical token.
      # The EXT selects the suffix; the label selects the arch token. Windows/Linux emit two
      # files (different ext) per label, both with the same arch token (NSIS gets `-setup.exe`).
      # `if-no-files-found: error` on the upload + this `set -e` glob guard mean a bundler that
      # silently produced nothing FAILS the job rather than shipping an empty release row.
      # [OPUS-4.8] sq-gl3cf: VERSION is the resolved release tag (threaded via env so the SAME
      # bash works on both the tag-push and workflow_dispatch paths).
      - name: Stage GUI bundles
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="gui/src-tauri/target/release/bundle"
          OUT="gui-bundles"
          mkdir -p "$OUT"
          shopt -s nullglob globstar

          # matrix label -> ONE canonical arch token for the emitted asset name.
          case "${{ matrix.label }}" in
            arm64-darwin) ARCH="aarch64" ;;
            x64-darwin)   ARCH="x86_64" ;;
            win-x64)      ARCH="x64" ;;
            x64-linux)    ARCH="amd64" ;;
            arm64-linux)  ARCH="arm64" ;;
            *)
              echo "ERROR: no arch mapping for label '${{ matrix.label }}'" >&2
              exit 1
              ;;
          esac

          found=0
          # Glob each bundle EXT directory; the directory (dmg/deb/appimage/rpm/msi/nsis) tells us
          # the ext + suffix. We re-name to sparq-gui_<version>_<arch>.<suffix> regardless of
          # Tauri's own basename. NSIS .exe gets a `-setup.exe` suffix to disambiguate it from any
          # future plain .exe; everything else uses its native extension.
          #   dir       suffix
          #   dmg       <arch>.dmg
          #   deb       <arch>.deb
          #   appimage  <arch>.AppImage
          #   rpm       <arch>.rpm            (not produced by default; kept for resilience)
          #   msi       <arch>.msi
          #   nsis      <arch>-setup.exe
          for f in "$BUNDLE_DIR"/dmg/*.dmg \
                   "$BUNDLE_DIR"/deb/*.deb \
                   "$BUNDLE_DIR"/appimage/*.AppImage \
                   "$BUNDLE_DIR"/rpm/*.rpm \
                   "$BUNDLE_DIR"/msi/*.msi \
                   "$BUNDLE_DIR"/nsis/*.exe; do
            case "$f" in
              *.dmg)      suffix="${ARCH}.dmg" ;;
              *.deb)      suffix="${ARCH}.deb" ;;
              *.AppImage) suffix="${ARCH}.AppImage" ;;
              *.rpm)      suffix="${ARCH}.rpm" ;;
              *.msi)      suffix="${ARCH}.msi" ;;
              *.exe)      suffix="${ARCH}-setup.exe" ;;  # NSIS installer
              *)
                echo "ERROR: unexpected bundle ext for '$f'" >&2
                exit 1
                ;;
            esac
            cp "$f" "$OUT/sparq-gui_${VERSION}_${suffix}"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: tauri build produced no installer bundles under $BUNDLE_DIR" >&2
            find "$BUNDLE_DIR" -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi
          echo "staged $found GUI bundle(s) for ${{ matrix.label }} (arch=$ARCH, version=$VERSION):"
          ls -1 "$OUT"

      # SLSA build-provenance over EVERY produced bundle (the subject-path) — this is the
      # "rides for free" claim made literal: the bundle digests are bound to this workflow run
      # and verifiable with `gh attestation verify <bundle> --repo <repo>`. (Provenance != OS
      # code-signing; see the job header.)
      - name: Attest build provenance (GUI bundles)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: gui-bundles/*

      # [OPUS-5] #4570 (GX-11 residual): this row's bundle digests, published as data for the
      # ISOLATED trusted builder (`provenance-artifacts` below). Two things this step must get
      # right, both of which fail only at release time:
      #   * WRITE OUTSIDE gui-bundles/ — that directory is uploaded WHOLESALE as `pkg-gui-*`,
      #     which the `release` job downloads with `pattern: pkg-*` straight into the published
      #     assets. A digest list written next to the installers would ship as a release asset.
      #   * PORTABLE DIGEST — this matrix has macOS rows, which have BSD `shasum` and no GNU
      #     `sha256sum`; a bare `sha256sum` would red exactly the rows marked `soft`, so it would
      #     not even fail loudly — it would silently drop those bundles from the subjects set.
      - name: Record GUI bundle digests (subjects for the isolated provenance builder)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gui-subjects
          OUT="../gui-subjects/subject-hashes-gui-${{ matrix.label }}.txt"
          cd gui-bundles
          shopt -s nullglob
          bundles=( * )
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "ERROR: no staged GUI bundle to attest for ${{ matrix.label }}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "${bundles[@]}" > "$OUT"
          else
            shasum -a 256 -- "${bundles[@]}" > "$OUT"
          fi
          cat "$OUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-hashes-gui-${{ matrix.label }}
          path: gui-subjects/subject-hashes-gui-${{ matrix.label }}.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-gui-${{ matrix.label }}
          path: gui-bundles/*
          if-no-files-found: error

  # ---- 1e. collect the NON-ARCHIVE release-artifact digests into ONE `base64-subjects` blob ----
  # [OPUS-5] #4570 (GX-11 residual). sq-toze.25 routed only the release ARCHIVES through the
  # isolated trusted builder; the GUI bundles, the SBOM/VEX and the served-surface conformance
  # report were left on in-band `actions/attest-build-provenance`, which signs inside the same job
  # that produced the bytes — the L2 ceiling. This job is the digest hand-off that lets them cross
  # the same boundary the archives already cross.
  #
  # WHY A SEPARATE COLLECTOR AND NOT ONE MERGED WITH `package`'s: keeping the archive lane's
  # subjects disjoint means the slow GUI matrix (60-min timeout, `soft` rows that may fail) can
  # never delay or fail-close the archives' provenance. Two bundles, two failure domains.
  #
  # It BUILDS nothing and holds NO signing identity (`contents: read`, no `id-token`) — it
  # downloads text, validates its shape, base64-encodes it. Signing happens one job further out.
  artifact-subjects:
    name: collect artifact digests
    needs: [sbom, served-conformance, gui-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # `subject-hashes-*` only: `archive-hashes-*` belongs to the archives' own bundle and
          # `pkg-*` are the published assets themselves.
          pattern: subject-hashes-*
          path: subject-hashes
          merge-multiple: true
      # FAIL-CLOSED, and specifically about COVERAGE, not just about well-formedness. A subjects
      # blob that silently lost a lane would still produce a valid signature over a smaller set,
      # and the release notes would go on claiming the lane is covered — the vacuous-artifact
      # class the compliance register exists to prevent. So each lane is required by name.
      # The `soft` macOS/Windows GUI rows may legitimately be absent (they are allowed to fail),
      # but the Linux rows are BLOCKING, so at least one GUI list must always be present.
      - name: Combine + base64-encode the subjects
        id: combine
        shell: bash
        run: |
          set -euo pipefail
          cd subject-hashes
          shopt -s nullglob
          for required in subject-hashes-sbom.txt subject-hashes-conformance.txt; do
            if [ ! -s "$required" ]; then
              echo "ERROR: '$required' missing or empty — a release artifact lane produced no subjects" >&2
              exit 1
            fi
          done
          gui=( subject-hashes-gui-*.txt )
          if [ "${#gui[@]}" -eq 0 ]; then
            echo "ERROR: no subject-hashes-gui-* list — every GUI bundle row failed to publish digests" >&2
            exit 1
          fi
          cat -- subject-hashes-sbom.txt subject-hashes-conformance.txt "${gui[@]}" > all.sha256
          while read -r digest name; do
            if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$' || [ -z "$name" ]; then
              echo "ERROR: malformed sha256sum record: '$digest  $name'" >&2
              exit 1
            fi
          done < all.sha256
          echo "subjects for the isolated provenance builder:"
          cat all.sha256
          echo "hashes=$(base64 -w0 all.sha256)" >> "$GITHUB_OUTPUT"

  # ---- 1f. ISOLATED trusted-builder SLSA provenance over the non-archive release artifacts ----
  # [OPUS-5] #4570 (GX-11 residual / SL-B3-b). Structurally identical to `provenance` above — a
  # BARE `uses:` of the trusted reusable builder, its own OIDC identity, no step of ours inside,
  # and exactly one input across the boundary (`base64-subjects`, threaded from the collector).
  # See `provenance`'s header for the full rationale, including WHY A TAG REF, NOT A SHA (the
  # builder identity `slsa-verifier` matches against is derived from the `@ref`) and WHAT THIS
  # DOES NOT CLAIM (unforgeable provenance about the bytes the build reported — not a hardened
  # build; the GENERIC generator attests, it does not build).
  #
  # A SECOND invocation rather than more subjects on the first: distinct `provenance-name`s keep
  # the two bundles' artifact names disjoint, and a consumer verifying an archive should not have
  # to reason about a bundle that also covers a .deb.
  #
  # THE ONE THING TO WATCH ON THE FIRST TAG: this is the first time the generator is invoked
  # TWICE in one workflow run. The two jobs are only safe to coexist because the generator names
  # its uploaded artifact from `provenance-name`, and the two names differ — the `release` job
  # never hard-codes either, it reads each job's own `provenance-download-name` output. If a
  # future generator version ever used a FIXED artifact name instead, the second upload would
  # collide and this job would red (fail-closed, which is the right direction) — that is the
  # residual to check on the first `v*` tag, not something verifiable from a PR.
  #
  # STILL NOT COVERED after this: the ghcr.io container image, which needs the generator's
  # separate `generator_container_slsa3.yml` (image-digest, not file-digest, subjects) — its own
  # migration. GX-11 narrows again; it does not close.
  #
  # STATUS — DOCUMENTED-UNTESTED, exactly as the archives lane: release.yml never runs on a PR,
  # so this first executes on the next `v*` tag. Shape pinned by
  # scripts/tests/test_release_slsa_l3_provenance.py.
  provenance-artifacts:
    needs: [setup, artifact-subjects]
    permissions:
      actions: read # read the workflow definition the provenance records as the entry point
      id-token: write # mint the generator's OWN signing identity (never shared with a build job)
      contents: read # not the uploader; the `release` job attaches the bundle
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.artifact-subjects.outputs.hashes }}
      upload-assets: false
      provenance-name: sparq-artifacts-${{ needs.setup.outputs.version }}.intoto.jsonl

  # ---- 2. checksums + GitHub Release ----
  release:
    name: create GitHub Release
    # [OPUS-4.8] sq-gl3cf: `setup` added so the Release attaches to the resolved tag (tag_name
    # below) on BOTH triggers — on dispatch, action-gh-release's default tag_name is `github.ref`,
    # which is the BRANCH, so we must override it explicitly.
    # [OPUS-5] sq-toze.25: `provenance` is a HARD dependency, not an optional extra. If the
    # isolated trusted builder fails, no Release is cut — a release that shipped without the
    # L3 provenance while the docs claim L3 is precisely the silent overclaim the compliance
    # register exists to prevent.
    # [OPUS-5] #4570: `provenance-artifacts` is a hard dependency on exactly the same grounds —
    # it covers the GUI bundles, SBOM/VEX and conformance report.
    needs: [setup, package, provenance, provenance-artifacts, sbom, gui-bundle, served-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets — the only write this pipeline needs
    steps:
      # [FABLE-5] sq-vw3ax.11.3: checkout FIRST (its default `clean` would wipe a pre-existing
      # assets/ dir) — the alias contract check below needs scripts/check-release-aliases.sh and
      # the /download page source it extracts the site-referenced alias set from.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-*
          path: assets
          merge-multiple: true
      # [OPUS-4.8] sq-toze.3 (GX-2): pull the SBOM + VEX in alongside the archives so they
      # are covered by SHA256SUMS and attached to the release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-vex
          path: assets
      # [OPUS-4.8] sq-ro6if (PSS #1415/#1478): pull the served-surface conformance report in
      # alongside the archives + SBOM so it is covered by SHA256SUMS and attached to the release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: served-conformance
          path: assets
      # [OPUS-5] sq-toze.25 (GX-11): pull in the in-toto bundle the ISOLATED trusted builder
      # signed (release.yml#provenance) so it is covered by SHA256SUMS and attached to the
      # Release. Consumers verify it with `slsa-verifier verify-artifact <archive>
      # --provenance-path <this file> --source-uri github.com/<owner>/<repo>`. The artifact name
      # comes from the generator's own output — hard-coding it would silently 404 the day the
      # generator changes its naming, and this download is fail-closed by default.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-download-name }}
          path: assets
      # [OPUS-5] #4570 (GX-11 residual): the SECOND isolated-builder bundle — the one covering the
      # GUI bundles, SBOM/VEX and served-surface conformance report. Same fail-closed download by
      # the generator's own output name, so it lands in SHA256SUMS and on the Release too.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance-artifacts.outputs.provenance-download-name }}
          path: assets
      # [FABLE-5] sq-vw3ax.11.3: stage version-STABLE alias assets. The /download page's direct
      # buttons target `releases/latest/download/<alias>` (static hrefs, no API dependency), but
      # every canonical asset name is versioned — so each release uploads alias COPIES of the
      # canonical bytes (GitHub release assets cannot be symlinked) per the NORMATIVE table in
      # research/site-home-app-download-residuals.md §3. Versioned names remain the
      # provenance/attestation subjects (aliases are staged AFTER every attest step ran, in this
      # job); SHA256SUMS is generated after this step so alias entries are appended alongside the
      # unchanged versioned entries. Multi-tier platforms map to the BASELINE tier
      # (portability-first). A missing SOURCE is skipped with a warning here — macOS/Windows GUI
      # rows are `soft` and may not have uploaded — and the CONTRACT check below then decides
      # fail-closed whether the gap blocks the release (site-referenced alias missing => FAIL;
      # extras like the arm64-linux pair are published but not site-required).
      - name: Stage version-stable alias assets
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          stage() { # stage <canonical-versioned-source> <version-stable-alias>
            if [ -f "$1" ]; then
              cp -- "$1" "$2"
              echo "alias staged: $2 <- $1"
            else
              echo "WARN: source asset '$1' absent; alias '$2' not staged" >&2
            fi
          }
          # GUI installers (alias <- sparq-gui_<version>_<arch>.<ext>)
          stage "sparq-gui_${VERSION}_aarch64.dmg"    sparq-gui-arm64-darwin.dmg
          stage "sparq-gui_${VERSION}_x86_64.dmg"     sparq-gui-x64-darwin.dmg
          stage "sparq-gui_${VERSION}_x64.msi"        sparq-gui-win-x64.msi
          stage "sparq-gui_${VERSION}_amd64.AppImage" sparq-gui-x64-linux.AppImage
          stage "sparq-gui_${VERSION}_amd64.deb"      sparq-gui-x64-linux.deb
          stage "sparq-gui_${VERSION}_arm64.AppImage" sparq-gui-arm64-linux.AppImage
          stage "sparq-gui_${VERSION}_arm64.deb"      sparq-gui-arm64-linux.deb
          # Combined CLI+server archives (alias <- sparq-cli-<version>-<tier>.<ext>; the archive
          # carries BOTH binaries, so there are deliberately NO sparq-server-* aliases).
          stage "sparq-cli-${VERSION}-arm64-darwin.tar.gz"  sparq-cli-arm64-darwin.tar.gz
          stage "sparq-cli-${VERSION}-x64-darwin.tar.gz"    sparq-cli-x64-darwin.tar.gz
          stage "sparq-cli-${VERSION}-x64-baseline.tar.gz"  sparq-cli-x64-linux.tar.gz
          stage "sparq-cli-${VERSION}-arm64-linux.tar.gz"   sparq-cli-arm64-linux.tar.gz
          stage "sparq-cli-${VERSION}-win-x64-baseline.zip" sparq-cli-win-x64.zip
      # [FABLE-5] sq-vw3ax.11.3: FAIL-CLOSED alias contract — the site's usage is the source of
      # truth. The script extracts every alias download-client.tsx references (its `file:`
      # literals + the sparq-cli-<token>.<ext> names cliTarget composes) and fails the release
      # if any is absent from the staged asset list, so a published release can never serve a
      # silent-404 direct-download button. Extra assets are allowed.
      - name: Check site-referenced alias contract (fail-closed)
        run: |
          set -euo pipefail
          ls -1 assets > "$RUNNER_TEMP/release-asset-list.txt"
          bash scripts/check-release-aliases.sh "$RUNNER_TEMP/release-asset-list.txt"
      # [FABLE-5] sq-vw3ax.11.3: runs AFTER alias staging, so SHA256SUMS carries the versioned
      # entries (unchanged) PLUS one appended entry per alias (same digest, alias name).
      - name: Generate SHA256SUMS
        run: cd assets && sha256sum -- * > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # [OPUS-4.8] sq-gl3cf: attach to the RESOLVED tag. The action defaults tag_name to
          # `github.ref`, which on a workflow_dispatch is the branch (wrong) — pin it to the
          # version the rest of the pipeline named assets with so dispatch + tag agree.
          tag_name: ${{ needs.setup.outputs.version }}
          # [OPUS-4.8] sq-gl3cf: dispatch builds are developer/test releases — mark them
          # pre-release by default (the dispatch `prerelease` input; true unless overridden). A
          # tag push has no such input, so `inputs.prerelease` is empty -> not a pre-release.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: assets/*
          generate_release_notes: true
          # CHANGELOG.md is the curated source of truth; point readers at it. Body links use the
          # resolved version (needs.setup.outputs.version), not github.ref_name, so dispatch
          # builds (where github.ref_name is the branch) link to the right tag.
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.setup.outputs.version }}/CHANGELOG.md) for the curated changelog.

            `SHA256SUMS` covers every attached archive plus the CycloneDX SBOM + VEX and the served-surface conformance report: `shasum -a 256 -c SHA256SUMS`.

            **Served-surface SPARQL 1.1 Protocol conformance.** This release attaches a machine-readable conformance report (`served-conformance-${{ needs.setup.outputs.version }}.json`) recording what the *served HTTP surface* (`sparq-server`'s `/sparql`) passes at this exact commit — the SPARQL 1.1 Protocol lane (GET/POST query+update, the QUERY method, dataset overrides, SRJ/SRX/CSV/TSV negotiation, status codes) and the Service-Description + Graph-Store-Protocol lane, with per-assertion pass/divergence/fail outcomes, per-suite counts + ratchet floors, and provenance (commit, date, CI run). Counts are conformance facts; documented divergences are reported separately and are never summed into the pass count. It is generated fail-closed (a vacuous, failing, or below-floor run blocks the release). See the [served-surface conformance page](https://github.com/${{ github.repository }}/blob/${{ needs.setup.outputs.version }}/site/src/app/assurance/served-conformance/page.tsx) for the rendered view.

            **Desktop GUI bundles (UNSIGNED).** This release also includes cross-platform [sparq GUI](https://github.com/${{ github.repository }}/tree/${{ needs.setup.outputs.version }}/gui) desktop installers (`sparq-gui_${{ needs.setup.outputs.version }}_*`): macOS `.dmg`, Windows `.msi` + NSIS `.exe`, and Linux `.deb` + `.AppImage`. **These bundles are NOT code-signed or notarized.** On macOS, Gatekeeper will quarantine them; on Windows, SmartScreen will warn — see [/download](https://github.com/${{ github.repository }}/tree/${{ needs.setup.outputs.version }}/gui) for the install bypass instructions (Gatekeeper/SmartScreen). OS-level code-signing (Apple Developer ID notarization + Windows Authenticode) requires maintainer-held credentials and is tracked separately — until then, treat the GUI bundles as developer/test installs. The SLSA attestation below proves *who built* each bundle (build provenance); it is not a substitute for OS code-signing. (No `win-arm64` GUI installer yet — the Tauri bundler cannot cross-bundle it from the x64 Windows runner; no mobile app bundles yet.)

            **Experimental — read before you rely on this.** sparq is a pre-1.0 research engine and the API is unstable. The zero-knowledge (`sparq-zk`) and multi-party-computation (`sparq-mpc`) surfaces are **research scaffolds shipped for experimentation only**: no external accredited cryptographer has reviewed them, the MPC protocols are honest-majority semi-honest only, and this release makes **no** soundness, security or privacy claim for either. Do not present their output as a production-grade guarantee. See [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ needs.setup.outputs.version }}/SECURITY.md) for the full scope and caveats. <!-- privacy-claims-allow: NEGATIVE caveat — states the ABSENCE of any soundness/privacy claim and that external audit is pending; issue #2552 -->

            **Supply chain:** each release carries a CycloneDX SBOM per binary (`*-${{ needs.setup.outputs.version }}.sbom.cdx.json`, including the GUI shell `sparq-gui-${{ needs.setup.outputs.version }}.sbom.cdx.json`), runtime + full-build CycloneDX SBOMs for the published npm/WASM client (`sparq-js-*`) and shared browser client (`sparq-js-client-*`), and a VEX (`sparq-${{ needs.setup.outputs.version }}.vex.cdx.json`) stating the exploitability of every advisory the dependency policy ignores. All artifacts (archives, GUI bundles, SBOMs, VEX) are SLSA build-provenance attested — verify with `gh attestation verify <file> --repo ${{ github.repository }}`. That in-band attestation is **SLSA Build L2**.

            **The archives, GUI bundles, SBOMs/VEX and conformance report additionally** carry provenance generated by the isolated `slsa-github-generator` trusted builder, in a job no build step of ours can reach, split across two in-toto bundles: `sparq-cli-${{ needs.setup.outputs.version }}.intoto.jsonl` covers the CLI/server archives, and `sparq-artifacts-${{ needs.setup.outputs.version }}.intoto.jsonl` covers the GUI bundles, the SBOMs/VEX and the conformance report. Verify: `slsa-verifier verify-artifact <file> --provenance-path <the matching bundle> --source-uri github.com/${{ github.repository }}` (matching is by digest, so the version-stable alias copies — `sparq-cli-x64-linux.tar.gz` and friends — verify against the same bundle as the versioned originals they were copied from). **Read that precisely:** it means the *provenance* is unforgeable by the build (SLSA's L3 SL-B3-b property), not that the artifacts were built inside a trusted builder — the `cargo`/`tauri`/SBOM steps still run in this repo's own jobs, and the generator attests the digests those jobs reported. So this is **not** a blanket "sparq is SLSA Build L3" claim. **Not covered by either bundle:** `SHA256SUMS` and the two `.intoto.jsonl` bundles themselves (trivially), and the ghcr.io container image — which is not a Release asset and so gets its own lane, below.

            **Container image.** `ghcr.io/${{ github.repository_owner }}/sparq-server` carries provenance from the isolated `slsa-github-generator` **container** builder (`release.yml#provenance-container`), attached to the image in the registry rather than shipped as a Release asset — an image is not a file, so it takes an image digest, not the file-digest bundles above. Verify: `slsa-verifier verify-image ghcr.io/${{ github.repository_owner }}/sparq-server@<digest> --source-uri github.com/${{ github.repository }}` (`ghcr.io` requires `GH_TOKEN` to be exported). The buildkit in-band attestation (`provenance: mode=max` + `sbom: true`, read by `cosign verify-attestation`) is unchanged and still present — the image carries both. **One honest difference from the file lanes:** those are fail-closed (`release` `needs:` its provenance jobs, so an unprovenanced archive is never published), whereas an image must be pushed before it has a digest to attest — so publication precedes attestation here, and a failure of that lane reds the run over an image already in the registry. See `compliance/slsa/controls.md` for the audited per-artifact levels.
          fail_on_unmatched_files: true

  # ---- 2b. post-publication provenance verification (the SL-B3-b evidence step) ----
  # [OPUS-5] issue #4571 / PR #4644 review: this MUST be driven from HERE, not from
  # release-verify.yml's `release: published` trigger. GitHub does not start a workflow run from
  # an event generated by the workflow's own GITHUB_TOKEN, and the `release` job above creates the
  # Release with exactly that token (action-gh-release defaults `token: ${{ github.token }}`), so
  # that trigger never fires on the normal `v*` path — it only covers a Release published
  # out-of-band by a human/PAT. Calling the SAME reusable workflow from a job that `needs: release`
  # is what actually makes a release produce the machine-checked verdict `compliance/slsa/`
  # `controls.md` SL-B3-b cites. Same definition either way: one workflow, two entry points.
  #
  # It runs AFTER the Release exists, deliberately: two of the three checks (bundles attached to
  # the Release, bundles listed in SHA256SUMS) are only observable then, so this cannot gate
  # publication — `release`'s `needs: [provenance, provenance-artifacts]` is what stops a Release
  # being cut when a trusted builder fails. A red run here means a PUBLISHED release does not carry
  # the provenance the compliance estate claims for it: a supply-chain incident, fix forward.
  # Do NOT add `continue-on-error` and do NOT add an `if:` — a swallowed failure would manufacture
  # the very evidence this job exists to produce. `test_verify_release_provenance.sh` pins it.
  verify-provenance:
    name: verify published provenance
    needs: [setup, release]
    permissions:
      contents: read # `gh release download` — the only API the called workflow touches
    uses: ./.github/workflows/release-verify.yml
    with:
      # The tag the rest of the pipeline named assets with (NOT github.ref_name, which is the
      # branch on a workflow_dispatch) — the same value the `release` job attached them to.
      tag: ${{ needs.setup.outputs.version }}

  # ---- 3. server container -> ghcr.io ----
  # Pushes ghcr.io/<owner>/sparq-server using the workflow's own GITHUB_TOKEN — ghcr needs no
  # extra secrets. This workflow only runs on `v*` tag pushes and manual `workflow_dispatch`
  # (both deliberate releasing acts — see the trigger notes at the top), so every run pushes,
  # including dispatch-driven developer/test releases; a maintainer who does not want container
  # publishing can delete this job (or add `if: false`) without affecting the binaries/release
  # jobs above.
  #
  # [OPUS-5] sq-w1dxx: the image tags are version-THREADED from `setup`, not derived from the git
  # ref. `docker/metadata-action`'s `type=semver` reads `github.ref` by default, which on a
  # `workflow_dispatch` is the BRANCH — so a dispatch used to produce NO semver tag and push only
  # the moving `:latest`, silently overwriting the canonical released image that `deploy/paas` and
  # `deploy/aws` pin (`ghcr.io/sparq-org/sparq-server:latest`) with a developer/test build. Now the
  # two trigger paths emit disjoint, unambiguous tag sets:
  #   * `v*` tag push (canonical release): `{{version}}`, `{{major}}.{{minor}}`, and `latest`.
  #   * `workflow_dispatch` (developer/test): ONLY `dev-<inputs.tag>` (e.g. `dev-v0.1.0-dev`).
  #     No `latest`, no moving `{{major}}.{{minor}}` — a dev build can never claim a tag a
  #     deployment follows, and is still pullable by its exact namespaced dispatch tag.
  #
  # [OPUS-5] the `dev-` prefix is what makes that disjointness hold for ANY input, not just a
  # well-behaved one. `inputs.tag` is a `required: true` free-form string: gating on the trigger
  # alone still let a dispatch with `tag: latest` (or `v1.2.3`, or a moving `1.2`) resolve
  # `type=raw,value=${{ needs.setup.outputs.version }}` straight onto the canonical tag it names
  # and overwrite the released image. Prefixing unconditionally makes the collision STRUCTURAL,
  # not a matter of developer discipline: every canonical tag is either the literal `latest` or
  # starts with a digit (metadata-action strips the leading `v` from `{{version}}`), so no
  # `dev-`-prefixed tag can ever be one. This is enforced over adversarial inputs by
  # `scripts/tests/test_release_container_multiarch.py`.
  # The dispatch path deliberately uses `type=raw` (not `type=semver`) so a non-semver `inputs.tag`
  # still yields a tag: metadata-action *warns and skips* an unparseable semver, which would leave
  # `tags:` empty and make the push meaningless.
  docker:
    name: build + push container (ghcr.io)
    runs-on: ubuntu-latest
    # [OPUS-5] sq-w1dxx: the resolved version is the single source of the image tags on both paths.
    needs: setup
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
      # [OPUS-4.8] sq-zqq6: buildkit attaches SLSA provenance + an SBOM to the
      # pushed image; the OIDC token is what signs the provenance attestation.
      id-token: write
      attestations: write
      # [OPUS-4.8] sq-p9xq: upload the released image's Trivy SARIF to the
      # code-scanning dashboard (Security tab) so a vuln in the published artifact
      # is visible there, not just in the run log.
      security-events: write
    # [OPUS-5] #4635 (GX-11 residual): the two values — and the ONLY two — that cross into the
    # isolated container generator (`provenance-container` below). `digest` is the OCI index
    # digest buildx REPORTED for the push, never a tag: a tag is mutable, so provenance keyed on
    # one would describe "whatever :latest happens to be", which is not provenance about anything.
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [GPT-5.6] sq-fvzi6: register the arm64 binfmt emulator before Buildx so the final
      # release push can build both target platforms on this native amd64 runner.
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels from the resolved release version)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sparq-server
          # [OPUS-5] sq-w1dxx: `value=` overrides metadata-action's default git-ref parsing with the
          # `setup` job's resolved version; the `enable=` guards keep the canonical (tag push) and
          # developer (dispatch) tag sets mutually exclusive — see the job header.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.setup.outputs.version }},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.setup.outputs.version }},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=dev-${{ needs.setup.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
      # [OPUS-4.8] sq-n6rv: SMOKE BEFORE PUSH. Build the image locally first, `docker run`
      # it, and prove it serves /health + a query — so a container that exits immediately on
      # boot (the sq-n6rv regression) can never reach ghcr.io. The build is cached to GHA, so
      # the subsequent push step is a cache hit (it does not rebuild from scratch).
      - name: Build image for smoke test (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          # [GPT-5.6] sq-fvzi6: keep the pre-push runtime and Trivy gate native/loadable;
          # the final step reuses this amd64 cache and adds the arm64 descriptor.
          platforms: linux/amd64
          tags: sparq-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (docker run + /health + ASK query)
        run: scripts/docker-smoke.sh sparq-server:smoke 3030
      # [OPUS-4.8] sq-p9xq: SCAN BEFORE PUSH. cargo-deny gates the Rust dependency tree, but
      # the distroless base layer (glibc / libgcc / CA certs) is outside that scope — a CVE
      # disclosed there would ship in the released image unscanned. Trivy scans the exact
      # `sparq-server:smoke` artifact built above (same bytes that get pushed) for OS-package
      # AND library vulns, and FAILS the release on a FIXABLE HIGH/CRITICAL so a vulnerable
      # image never reaches ghcr.io. `container-scan.yml` runs the same scan on PRs/main/weekly
      # against the Dockerfile; this is the release-gate copy that scans the published bytes.
      #   exit-code: 1   => fail the step (and the release) on a non-ignored match.
      #   ignore-unfixed => only FIXABLE vulns gate; a CVE with no upstream fix yet cannot
      #                     block a release (it is still surfaced in the SARIF pass below).
      #   trivyignores   => the shared .trivyignore allowlist for triaged/accepted CVEs.
      - name: Trivy scan released image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparq-server:smoke
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore
      # Second pass: SARIF for the code-scanning dashboard. exit-code 0 (the gating decision
      # is the table pass above) and includes unfixed findings so the Security tab shows the
      # full picture of the released image for triage.
      - name: Trivy scan released image (SARIF for code-scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparq-server:smoke
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore
      - name: Upload Trivy SARIF to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      # [OPUS-5] #4635: the image NAME the container generator attests, computed here rather than
      # inlined into the `provenance-container` call for two reasons. (1) The generator's `image`
      # input must carry NO tag and NO digest — it is the repository name alone — so it cannot
      # reuse `steps.meta.outputs.tags`. (2) ghcr rejects an uppercase path component, and
      # `github.repository_owner` preserves the account's case; `docker/metadata-action` lowercases
      # `images:` for us, but nothing lowercases a raw expression, so an owner like `JesWr` would
      # push fine and then attest against a name that does not resolve. Lowercase it explicitly.
      - name: Resolve the image name (no tag, no digest) for the isolated provenance builder
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/sparq-server" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # [GPT-5.6] sq-fvzi6: one OCI image index per metadata tag, with both supported
          # runtime descriptors. Buildx pushes the index only after both builds succeed.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # [OPUS-4.8] sq-zqq6: max-mode SLSA provenance + an embedded SBOM,
          # attached to the image in ghcr.io (verifiable via cosign / gh).
          provenance: mode=max
          sbom: true

  # ---- 3a. ISOLATED trusted-builder SLSA provenance over the pushed container image ----
  # [OPUS-5] #4635 (GX-11 residual / SL-B3-b) — the fourth and last isolated-provenance lane.
  #
  # WHY IT IS ITS OWN MIGRATION. The other three lanes (`release.yml#provenance`,
  # `release.yml#provenance-artifacts`, `dist.yml#provenance`) all call the GENERIC generator,
  # whose single boundary input is `base64-subjects` — a list of FILE digests. A registry image
  # is not a file: its provenance has to be attached to the image in ghcr.io, keyed by the OCI
  # index digest. That is a different reusable workflow (`generator_container_slsa3.yml`) with a
  # different interface (`image` + `digest`, no `base64-subjects`, no `upload-assets`), so it
  # could not reuse the digest-threading pattern #4570 established.
  #
  # THE BOUNDARY IS THE SAME PROPERTY. Still a bare `uses:` in its OWN job — no `steps:`/`run:`
  # of ours can execute inside it — minting its OWN OIDC identity, and receiving exactly two
  # values from `docker`: the image name and the digest buildx reported for the push. The
  # signing therefore does not share an execution context with `cargo`/`docker build`, which is
  # the SL-B3-b property.
  #
  # WHY A TAG REF, NOT A SHA: identical to the generic lanes — the builder identity baked into
  # the provenance (the thing a consumer's `slsa-verifier` policy matches) derives from the
  # `@ref`, so a SHA reference yields no identity a verifier will accept. All four lanes are held
  # on ONE tag by scripts/tests/test_release_slsa_l3_provenance.py; the policy record is
  # compliance/slsa/trusted-builder-pin-policy.md.
  #
  # THE IN-BAND ATTESTATION STAYS. `docker`'s buildkit `provenance: mode=max` is deliberately
  # NOT removed by this migration: it is a different predicate, attached differently, and it is
  # what `cosign verify-attestation` reads. The image therefore carries both — in-band buildkit
  # provenance (L2, describes the build) and this isolated bundle (the SL-B3-b property).
  #
  # WHAT THIS LANE CANNOT DO — and the honest difference from the file lanes. The file lanes are
  # FAIL-CLOSED: `release` `needs:` both provenance jobs, so an unprovenanced artifact is never
  # published. An image cannot work that way — it must be PUSHED before it has a digest to
  # attest, so the publication necessarily precedes the attestation. If this job reds, the run
  # reds, but the image is already in ghcr.io and must be dealt with by fixing forward (re-run,
  # or delete the pushed tags). Do not read this lane as the same guarantee as the archives'.
  #
  # `packages: write` is REQUIRED here and is not privilege creep: unlike the generic lanes
  # (`upload-assets: false`, where the `release` job is the uploader) the container generator IS
  # the uploader — it `cosign attach`es the attestation to the image in the registry. It still
  # holds no `contents: write`.
  #
  # STATUS — DOCUMENTED-UNTESTED, exactly as the other three lanes: release.yml never runs on a
  # PR, so this first executes on the next `v*` tag or dispatch. Shape pinned structurally by
  # scripts/tests/test_release_slsa_l3_provenance.py; runtime behaviour is not evidence until a
  # tag produces it. Verify a published image with (ghcr.io needs `GH_TOKEN` exported):
  #   slsa-verifier verify-image ghcr.io/<owner>/sparq-server@<digest> \
  #     --source-uri github.com/sparq-org/sparq
  provenance-container:
    needs: [docker]
    permissions:
      actions: read # read the workflow definition the provenance records as the entry point
      id-token: write # mint the generator's OWN signing identity (never shared with `docker`)
      packages: write # this generator IS the uploader — it attaches the attestation in ghcr.io
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      # The image REPOSITORY name only — the generator rejects a tag or digest here.
      image: ${{ needs.docker.outputs.image }}
      # The index digest buildx reported for the push, threaded across the boundary. Never a tag.
      digest: ${{ needs.docker.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
