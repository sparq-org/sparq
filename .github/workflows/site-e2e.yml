# sq-5q63 — site CI lane: lint + unit + the headless Playwright smoke test.
#
# WHY: the ZK car-hire prover pre-warms on route mount so the FIRST "Generate ZK proof"
# pays no cold start (prewarmProver() in site/src/lib/zk-prover.ts). That was previously
# argued only by code reasoning — no browser driver. site/e2e/zk-prewarm.spec.ts now
# proves it in a real headless Chromium: it awaits the "Prover ready" pill, then asserts
# the first proof does NOT re-pay the dynamic-import + Barretenberg.new cold start (the
# prover's `window.__zkProverColdStarts` counter stays at 1).
#
# SCOPE: PRs that touch site/** (or this workflow) — a Rust-/docs-only PR skips this lane
# It is path-
# scoped, not run on `merge_group`, so the heavy browser-download + real-proving cost is
# paid only on the PRs that actually change the site (matching js.yml / pages.yml, which
# are likewise not merge-queue lanes). It re-runs on push to main for post-merge cover.
#
# The Playwright config drives `next dev` directly (NOT the static export). `next dev`
# serves routes on demand and does NOT run the `dev`/`prebuild` npm-script chain, so its
# Typst prebuild step (build-specs.mjs) never fires. The ZK route needs no such artifacts,
# but e2e/specs-smoke.spec.ts (sq-rvgr2.1) asserts the REAL ReSpec render of a per-spec page
# — its <h1>/`nav#toc`/section anchors come from the build-time Typst fragment
# src/generated/specs/<slug>.html (git-ignored). So this lane installs the same pinned Typst
# the paper factory uses (mirroring pages.yml) and runs `npm run build-specs` BEFORE Playwright,
# so the fragment exists on disk for `next dev` to read and the ReSpec rendering is CI-covered.
# (Still no wasm-REPL bundle: neither the ZK smoke nor the specs smoke needs it.)
name: site-e2e

on:
  # sq-5f1s4 — self-guarding path filter: this lane's `npm ci` resolves the
  # `site` workspace member from the REPO-ROOT lockfile + manifest (site/ is an npm
  # workspace member; the per-member lock was dropped — see the install step). A change to
  # the root `package-lock.json`/`package.json` (e.g. a sibling member bumping a hoisted
  # dep, or a lock regeneration) can break `npm ci` here, but the old `site/**`-only filter
  # would NOT re-run the lane to catch it — and BOTH legs here are path-filtered, so there
  # is no unfiltered main-push catch-all either (unlike js.yml). That is the exact
  # gui.yml/#1081 blind-spot class, so the root workspace inputs are listed too.
  pull_request:
    # + ready_for_review so the un-draft moment re-runs this lane.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e.yml"

# Least-privilege default (Scorecard TokenPermissions): read-only; this lane never writes.
permissions:
  contents: read

# One in-flight run per PR/branch; cancel a superseded run.
concurrency:
  group: site-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-e2e:
    name: lint + unit + zk-prewarm smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # sq-jpki.1 — repo-root npm workspaces: `site/` is now a workspace member
      # and the per-member `site/package-lock.json` was dropped as redundant. The single
      # lockfile is the repo-root `package-lock.json`, so the setup-node npm cache keys off
      # THAT (the old `site/package-lock.json` path no longer exists). The `npm ci` below runs
      # in `site/` (the job's working-directory) and, finding the workspace root, installs the
      # site member's dependency closure FROM the root lock (it does NOT run sibling members'
      # lifecycle scripts — verified: js/'s wasm `prepare` is not triggered. Rust is provisioned
      # separately below only for the native sparq-policy parity fixture; wasm-pack is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The unit suite runs the native sparq-policy parity fixture.
      # Provision Rust explicitly instead of relying on the runner image, and cache its detached
      # fixture workspace.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: site/test/fixtures/policy-evaluator -> target
          shared-key: site-policy-fixture
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies (from the repo-root workspace lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm run test:unit

      # Cache the Playwright browser download keyed on the resolved @playwright/test
      # version, so a browser re-download only happens when the version changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      # sq-rvgr2.1 — install the SAME pinned, SHA-256-verified Typst the paper
      # factory uses (mirrors pages.yml's "Install Typst CLI" step) so `npm run build-specs`
      # below renders the REAL ReSpec spec fragments (src/generated/specs/<slug>.html, git-
      # ignored). Without this, e2e/specs-smoke.spec.ts sees only the "not built yet"
      # placeholder and the per-spec <h1>/`nav#toc`/section-anchor assertions fail. Absolute
      # paths only, so the job's `working-directory: site` default is irrelevant here.
      - name: Install Typst CLI
        run: |
          set -euo pipefail
          TYPST_VERSION=v0.15.0
          TYPST_SHA256=59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
          url="https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -sSfL -o /tmp/typst.tar.xz "$url"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xf /tmp/typst.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          cp /tmp/typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      # sq-rvgr2.1 — pre-bake the spec fragments (+ the honesty scan over the spec
      # sources) BEFORE Playwright boots `next dev`, so the per-spec route's build-time
      # readFileSync of src/generated/specs/<slug>.html reads the REAL ReSpec HTML (not the
      # placeholder) and the specs-smoke ReSpec-render assertions exercise the true output.
      - name: Build spec fragments (Typst → src/generated/specs)
        run: npm run build-specs

      # sq-ymr2e.8 — pre-bake paper HTML fragments so e2e/surface-sweep.spec.ts
      # sees the REAL in-site paper render (src/generated/papers/<slug>.html) rather than the
      # "not built yet" placeholder. Mirrors the build-specs step above. The paper HTML uses
      # the same paper-evidence.json evidence injection as the PDF build.
      - name: Build paper fragments (Typst → src/generated/papers)
        run: npm run build-papers

      - name: ZK prover pre-warm smoke test + site e2e (headless Chromium)
        run: npm run test:e2e
