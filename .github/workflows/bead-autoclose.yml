# [OPUS-4.8] Durable bead auto-close-on-merge (bead sq-84a8).
# Authored by Opus 4.8 (Fable unavailable; flag for re-review when Fable returns).
# [FABLE-5] Retargeted issue-native (issue #2475): the reconcile write now lands through the
# GitHub API instead of a commit-back to protected main.
#
# REPLACES the EPHEMERAL session-scoped "watcher b1kzhfxq5". That watcher was a
# per-session Monitor/Task: it did not persist, so once the arming session ended no
# automation closed a bead when its PR merged, and the orchestrator had to `bd close`
# every mapped bead by hand each tick (e.g. sq-v286.11/sq-4wo.2/sq-v286.10 stayed
# in_progress after PRs #818/#819/#821 merged). This COMMITTED workflow is durable.
#
# TRIGGER: a merged PR — `pull_request_target: [closed]` gated on `merged == true`.
# `pull_request_target`, NOT plain `pull_request` (PR #2528 review): on a `pull_request`
# event from a FORK, GitHub downgrades GITHUB_TOKEN to read-only regardless of the
# `permissions:` block below, so `gh issue close` would fail on every merged external
# contribution and the advertised durable reconcile would be silently lossy for exactly
# those PRs. `pull_request_target` runs in the BASE-repo context and keeps the declared
# `issues: write` token for fork PRs too. It is SAFE here because no PR-controlled code
# ever executes: the checkout below is pinned to trusted `main` (never the PR head /
# merge ref), and the only PR-derived values (number / title / merge SHA) flow as DATA
# through env vars into argv — keep it that way. A squash-merge carries the `(sq-XXXX)`
# bead token in the PR title (the repo's convention), so the title is the reliable
# extraction source; we additionally scan the merge-commit subject as a fallback.
#
# NOT A GATE. It runs AFTER merge (on `closed`), never on the PR head commit during the
# PR's open lifecycle, so `ci-summary / gate` (which polls check-runs on the PR head while
# the PR is OPEN) never sees it — it cannot register as a required/blocking check. The job
# name carries no `advisory`/`informational` token (so it stays visible in the UI) but,
# being post-merge, it is structurally non-gating. It also never blocks a merge (the merge
# already happened). flow-on.yml's `pull_request: [closed]` trigger is the same post-merge
# shape and likewise non-gating (it needs no write token, so it stays on plain pull_request).
#
# HOW THE RECONCILE PERSISTS (issue #2475 — supersedes the sq-roe3 fail-soft push).
# The original design committed a minimal .beads/issues.jsonl edit back to main. That
# write NEVER landed: the default GITHUB_TOKEN cannot push to protected `main` (ruleset
# GH013; only the repository-administrator role can bypass, not GITHUB_TOKEN — confirmed
# on the first real run, bead-autoclose.yml
# #27828093722 / PR #830), so every reconcile was silently lost and bead state drifted.
# A PR-based write from this token is equally dead: GITHUB_TOKEN-created events trigger
# NO workflows, so the required `ci-summary / gate` check would never report on such a PR
# and it would hang unmergeable forever. The write the token CAN durably land is the
# ISSUE-NATIVE one: the bd->issues migration (scripts/bd-to-issues.py) stamps every
# migrated issue with a `<!-- bd-id:sq-… -->` body marker plus the migration-owned
# `bd-migration` label (bodies are forgeable by any issue author; labels are not), so the
# script resolves each bead token to its mapped OPEN marker+label issue and closes it via
# `gh issue close --reason completed` — mutating the tracker with plain `issues: write`,
# no commit to main at all.
# Epic (`kind:epic`) / human-gated (`needs:*`) issues are never auto-closed (guardrail
# parity with reconcile-merged-beads.sh). A bead with NO marker-carrying open issue (not
# yet migrated, or already closed) is a logged no-op — exactly the (non-)outcome the
# rejected push produced, minus the misleading red run — and remains covered by the
# orchestrator's manual reconcile-merged-beads.sh sweep. No workflow triggers on
# `issues: [closed]` (retriage is cron), so the GITHUB_TOKEN no-downstream-trigger
# limitation costs nothing here.
#
# SAFETY: scripts/ci-close-merged-beads.py verifies the merge against the GitHub API,
# acts ONLY on beads whose exact sq-XXXX(.NN) id is a token in the PR title / merge
# subject, and is idempotent (an already-closed mapped issue is simply absent from the
# open-issue snapshot => no-op).
name: bead-autoclose

on:
  # Fork-safe privileged trigger — read the TRIGGER comment above before changing this:
  # safe ONLY while the job checks out pinned `main` and treats PR values purely as data.
  pull_request_target:
    types: [closed]

# Least privilege: the reconcile is an API-based issue close — no repo write at all.
permissions:
  contents: read # checkout for the script + the merge-commit-subject fallback
  issues: write # close the migrated issue(s) mapped to the merged PR

# Serialize per-merge so two near-simultaneous merges don't race the open-issue snapshot.
# `cancel-in-progress: false` — every merge must be processed; never drop one.
concurrency:
  group: bead-autoclose
  cancel-in-progress: false

jobs:
  close-merged-beads:
    name: close-merged-beads
    # Only act on a genuine MERGE (not a closed-unmerged PR). This is the authoritative
    # GitHub-side gate; the script re-verifies the merge via the API as defense-in-depth.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (latest script version + the merge-commit subject fallback)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # LOAD-BEARING for the pull_request_target trigger: always trusted `main`, never
          # the PR head — this job must not execute or read PR-controlled files.
          ref: main
          # No git write-back happens in this workflow; the API close uses GH_TOKEN below.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Self-test the close logic (hermetic; fail fast on a logic regression)
        run: python3 scripts/ci-close-merged-beads.py --self-test

      - name: Close the mapped issue(s) via the API (issue-native; no push to protected main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # Merge-commit subject as a token fallback (defensive; the title is primary).
          SUBJECT="$(git log -1 --format=%s "$MERGE_SHA" 2>/dev/null || true)"
          python3 scripts/ci-close-merged-beads.py \
            --pr "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --subject "$SUBJECT" \
            --close-issues \
            --repo "$GITHUB_REPOSITORY" \
            --skip-jsonl
