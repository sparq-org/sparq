# Coverage-guided fuzzing (threat-model T-PARSE-FUZZ + T-MMAP-FUZZ).
#
# WHAT: builds + runs the cargo-fuzz / libFuzzer targets in `fuzz/` against the RDF +
# SPARQL parsers and the mmap store loader. Each target's invariant is "hostile bytes
# must produce a clean Err or bounded behaviour, never a panic, OOM/overflow abort,
# or UB"; libFuzzer reports any crash and the run fails with the reproducer.
#
# WHEN: nightly (04:23 UTC, `NIGHTLY_SECS` of randomized fuzzing per target) and on
# manual dispatch (`MAIN_SECS` per target). It does not run on pull requests; the one
# required PR check is ci-fast (docs/branch-protection.md). To fuzz a branch before
# merging: `gh workflow run fuzz.yml --ref <branch>`.
#
# A nightly crash auto-files a P1 bead + GitHub issue via the least-privilege
# `file-demoted-fuzz-finding` job (scripts/ci-file-demoted-lane-failure.py).
#
# The fuzz crate is OUTSIDE the cargo workspace (root `Cargo.toml` `exclude = [...,
# "fuzz"]`) and needs NIGHTLY (libFuzzer codegen), so it never touches the stable
# workspace build.
#
# CORPUS PERSISTENCE: the accumulated libFuzzer corpus (fuzz/corpus/<target>,
# git-ignored) is cached across runs via actions/cache with a restore-keys prefix chain,
# so the nightly soak DEEPENS coverage night over night; a committed minimal seed corpus
# lives in fuzz/seeds/<target> and is passed as a second corpus dir on every run.
#
# DIFFERENTIAL SMOKE: the `differential-smoke` job runs fixed sparq-vs-Oxigraph
# differential regression windows through crates/sparq-bench/src/fuzz.rs (stable
# toolchain, in-workspace). The ADVANCING-window exploration lives in differential.yml.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening); the
# trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
name: fuzz

on:
  workflow_dispatch:
  # 04:23 UTC, offset from ci.yml's 03:17 so the two heavy nightly lanes do not contend.
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Per-target wall-clock budgets by trigger (seconds); libFuzzer's `-max_total_time`
  # caps each target hard.
  MAIN_SECS: "120"
  NIGHTLY_SECS: "600"
  # Build the fuzz targets for the GNU triple. On x86_64 Linux cargo-fuzz defaults to
  # the MUSL target (static libc), which the address sanitizer rejects; the gnu target
  # links libc dynamically and is sanitizer-compatible. (On the runner this is the host
  # triple, so it is also the cheapest to build.)
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  fuzz:
    name: cargo-fuzz (parsers + mmap loader, bounded)
    runs-on: ubuntu-latest
    # LEAST-PRIVILEGE: this job compiles and executes the fuzz targets, so it holds no
    # elevated scope (top-level `contents: read`). The issue/bead filer that needs write
    # scopes is the separate `file-demoted-fuzz-finding` job below.
    # Generous ceiling above the worst case (nightly: 4 targets × 600s + build) so a
    # hung target fails with a clear timeout rather than running away.
    timeout-minutes: 60
    # PINNED-TOOLCHAIN ESCAPE. The repo root carries a `rust-toolchain.toml`
    # pinning STABLE, and rustup resolves that file (precedence 4) ABOVE the `rustup
    # default <toolchain>` that `dtolnay/rust-toolchain` performs (precedence 5). The
    # `cargo +nightly-2026-06-11 fuzz …` calls below are precedence 1 and were already
    # immune; this env var (precedence 2) restores the pre-pin behaviour for the rest of
    # the job. CORRECTION, measured on rustup 1.29.0: this env var is NOT what
    # protects the nested cargo that `cargo fuzz` spawns for the `fuzz/` sub-workspace.
    # rustup EXPORTS the resolved toolchain to child processes — `cargo +nightly-2026-06-11
    # <subcmd>` hands the child `RUSTUP_TOOLCHAIN=nightly-2026-06-11-<host>` (and
    # `RUSTUP_TOOLCHAIN_SOURCE=cli`), which is precedence 2 and so still outranks the root
    # file even when the nested cargo runs from `fuzz/`. Verified directly: with a root pin
    # in place, a `cargo +nightly-2026-06-11` subcommand invoked from a sub-directory saw
    # the nightly, while the same subcommand invoked as a PLAIN `cargo` saw the pin. So the
    # nested call was already safe; what this env var actually buys is the invocations that
    # carry NO `+toolchain` at all — `cargo install cargo-fuzz` and the `rustc -vV` that
    # Swatinem/rust-cache keys its cache on, which would otherwise re-key onto the pin. Note
    # this env is scoped to THIS job only — the `differential-smoke` job below is a
    # deliberate stable lane and correctly inherits the pin. Keep in sync with the
    # `toolchain:` input below.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-06-11
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Do NOT leave a credentialed remote in .git/config while building + running
          # fuzz targets. Nothing in this job fetches over
          # git — fuzz/ resolves against its own standalone fuzz/Cargo.lock, which carries
          # no `git+` source — and the filer that pushes now lives in its own job, which
          # supplies the token on the push URL explicitly.
          persist-credentials: false
      # sq-czlh: reclaim ~20-30 GB of pre-installed SDKs/toolchains BEFORE the
      # cargo-fuzz build. Each libFuzzer/sancov-instrumented target links a sanitizer
      # runtime + its own `fuzz/target` tree, on a runner that starts with only ~14 GB free
      # on `/` — the same `No space left on device` profile sq-c76x fixed in the load-aware
      # test lane. Same in-repo, SHA-pin-free, best-effort step (absent paths no-op). See
      # scripts/ci-free-disk.sh.
      - name: Free runner disk before build
        run: ./scripts/ci-free-disk.sh
      # cargo-fuzz REQUIRES nightly (libFuzzer sancov codegen / `-Zsanitizer`). Pin the
      # nightly channel by date so the lane is reproducible and a future nightly
      # regression cannot silently break it; bump the date deliberately.
      - name: Install Rust (nightly, pinned)
        # Same SHA-pinned dtolnay/rust-toolchain action the rest of CI uses; the
        # `toolchain:` input selects the NIGHTLY channel (the action reads the channel
        # from this input, not the pin), pinned by DATE so the lane is reproducible and
        # a future nightly regression cannot silently break it — bump the date
        # deliberately. cargo-fuzz REQUIRES nightly (libFuzzer sancov / `-Zsanitizer`).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly via toolchain input
        with:
          toolchain: nightly-2026-06-11
          components: rust-src
          # We build for the GNU triple explicitly (see FUZZ_BUILD_TARGET below): on an
          # x86_64 Linux runner cargo-fuzz DEFAULTS to `*-linux-musl`, whose statically
          # linked libc is incompatible with the sanitizer ("sanitizer is incompatible
          # with statically linked libc") and whose std is not installed — so we pin the
          # gnu target and ensure its std/core is present.
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The fuzz crate has its OWN target dir + lockfile under `fuzz/`; key the
          # cache on its manifests so it is not shared with the workspace build.
          workspaces: "fuzz"
          # sq-3sbrr save-if discipline: SAVE only from main; a branch-scoped save is
          # unreachable from main and only churns the shared 10 GB Actions-cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      # sq-0iqzw: persistent corpus. Without this, every run — including
      # the nightly 600s/target soak — restarted from an EMPTY corpus and coverage
      # never accumulated. actions/cache entries are immutable, so we use the
      # standard accumulation pattern: an always-unique primary key (never hits)
      # plus a restore-keys prefix chain that restores the most recent snapshot;
      # the paired SAVE step after the run persists the grown corpus. ONE cache
      # spans fuzz/corpus for ALL targets: `cargo fuzz list` auto-discovers
      # targets, so a hard-coded per-target key list would silently miss a newly
      # added target (and the per-target corpus dirs are tiny). Only main-scoped
      # runs save (see the save step's guard).
      - name: Restore the accumulated fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v1-
      # Per-target budget: the nightly schedule gets NIGHTLY_SECS, a manual dispatch
      # MAIN_SECS. (The run step still understands mode=replay, a deterministic
      # `-runs=0` corpus replay, for local use; CI always runs randomized search.)
      - name: Pick the per-target budget for this trigger
        id: budget
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule) secs="$NIGHTLY_SECS" ;;
            *)        secs="$MAIN_SECS" ;;
          esac
          echo "secs=$secs" >> "$GITHUB_OUTPUT"
          echo "mode=fuzz" >> "$GITHUB_OUTPUT"
          echo "Per-target fuzz for '${{ github.event_name }}': budget=${secs}s"
      # Build every target ONCE up front so a compile error is reported distinctly
      # from a fuzzing crash, and the per-target runs below reuse the artifacts.
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly-2026-06-11 fuzz build --target "$FUZZ_BUILD_TARGET"
      # Runs ALL targets even if an earlier one crashes (each crash is recorded in
      # `status`), then fails the gate at the end if ANY target crashed. This is
      # deliberately run-all-then-fail rather than break-on-first: one CI run then
      # surfaces EVERY crashing target + uploads EVERY reproducer in one pass, instead
      # of hiding later findings behind the first failure.
      - name: Run each target (replay or randomized; run all, fail at end if any crashed)
        working-directory: fuzz
        env:
          SECS: ${{ steps.budget.outputs.secs }}
          MODE: ${{ steps.budget.outputs.mode }}
          # Capture the combined per-target output so a randomized-run finding can hand
          # the log to the demoted-lane auto-bead filer (uploaded as the `fuzz-run-log`
          # artifact below and downloaded by the `file-demoted-fuzz-finding` job).
          RUN_LOG: ${{ runner.temp }}/fuzz-run-log.txt
        run: |
          set -euo pipefail
          # `cargo fuzz list` enumerates the targets so adding a new fuzz_target file
          # is picked up automatically (no list to keep in sync here).
          targets="$(cargo +nightly-2026-06-11 fuzz list)"
          echo "Targets: $targets"
          # Assemble the libFuzzer runner flags from the mode.
          #   replay : `-runs=0` executes each corpus/seed input EXACTLY ONCE and
          #            generates NO new inputs, then exits — a deterministic regression
          #            replay (seconds). A committed/cached known crasher still panics =>
          #            nonzero exit => the gate goes RED (validated locally, sq-6vshe.6).
          #   fuzz   : `-max_total_time=<secs>` runs randomized search for the budget.
          # -rss_limit_mb caps an allocator OOM so a hostile-bytes mega-allocation is a
          # finding not a runner kill; -print_final_stats surfaces coverage/exec counts.
          if [ "$MODE" = "replay" ]; then
            libfuzzer_args=(-runs=0 -rss_limit_mb=2048 -print_final_stats=1)
            echo "MODE=replay — deterministic corpus-replay (no randomized fuzzing)."
          else
            libfuzzer_args=(-max_total_time="${SECS}" -rss_limit_mb=2048 -print_final_stats=1)
            echo "MODE=fuzz — randomized fuzzing at ${SECS}s/target."
          fi
          : > "$RUN_LOG"
          status=0
          for t in $targets; do
            echo "::group::fuzz $t (mode=$MODE, args=${libfuzzer_args[*]})"
            # sq-0iqzw: pass the corpus dirs EXPLICITLY — the cached,
            # accumulating corpus/<t> first (libFuzzer replays/writes coverage there)
            # and the committed minimal seed corpus seeds/<t> second (read as
            # additional inputs). mkdir -p keeps a brand-new target (no cache, no
            # committed seeds yet) from failing on a missing dir. In replay mode BOTH
            # dirs are executed input-by-input; nothing is written.
            mkdir -p "corpus/$t" "seeds/$t"
            # FAIL LOUD on a VACUOUS replay (a target with no seeds and no cached corpus
            # would "pass" `-runs=0` having executed nothing). Randomized mode is exempt;
            # see scripts/ci-fuzz-replay-guard.sh.
            if ! bash ../scripts/ci-fuzz-replay-guard.sh "$MODE" "$t" "corpus/$t" "seeds/$t"; then
              status=1
              echo "::endgroup::"
              continue
            fi
            # A nonzero exit (a crash/leak/timeout) is a genuine finding: RECORD it in
            # `status` and keep going so the remaining targets still run, then fail the
            # gate once at the end (`exit "$status"`). Tee to $RUN_LOG so the
            # randomized-run failure path can auto-file the bead + issue.
            if ! cargo +nightly-2026-06-11 fuzz run --target "$FUZZ_BUILD_TARGET" "$t" \
                  "corpus/$t" "seeds/$t" -- \
                  "${libfuzzer_args[@]}" 2>&1 | tee -a "$RUN_LOG"; then
              echo "::error::fuzz target '$t' reported a crash/leak/timeout — see the log + the saved reproducer artifact."
              status=1
            fi
            echo "::endgroup::"
          done
          # Fail at the end iff ANY target above crashed (status was set to 1).
          exit "$status"
      # sq-0iqzw: persist the grown corpus — `if: always()` because a run that FOUND a
      # crash grew exactly the corpus worth keeping. Saved only from main-scoped runs: a
      # cache saved on another branch is unreachable from main (pure quota churn).
      - name: Save the accumulated fuzz corpus (main-scoped runs)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
      # Hand the captured run log to the separate `file-demoted-fuzz-finding` job (it
      # runs on its own runner). Uploaded only on the nightly failure path that files.
      - name: Upload the fuzz run log (input to the demoted-lane filer job)
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-run-log
          path: ${{ runner.temp }}/fuzz-run-log.txt
          if-no-files-found: ignore
      # On a crash, libFuzzer writes the reproducing input to fuzz/artifacts/<target>/.
      # Upload it so the failing case can be replayed locally with `cargo fuzz run
      # <target> <artifact>`.
      - name: Upload crash reproducers (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Nightly crash => auto-file a standing P1 bead + GitHub issue naming the lane + run
  # (deduped, append-only, fail-soft on the protected-main push; the issue is the
  # reliable channel). Split out of `fuzz` so the job that compiles and runs fuzz targets
  # keeps `contents: read`; this one runs only scripts/ci-file-demoted-lane-failure.py
  # plus git. `always()` because a job-level `if:` defaults to success().
  file-demoted-fuzz-finding:
    name: file demoted randomized-fuzz finding (P1 bead + issue)
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The ONLY elevated scope in this workflow:
    #   contents: write — append the bead line to .beads/issues.jsonl + best-effort push
    #   issues:   write — file/comment the standing GitHub issue (the reliable channel)
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The push below supplies the token on the remote URL explicitly, so no
          # credential needs to be persisted into .git/config.
          persist-credentials: false
      # The log was captured on the `fuzz` job's runner; pull it across as an artifact.
      # continue-on-error: a failure before the run step uploads nothing, and the filer
      # renders a missing log as "(no log captured …)" rather than dying — the issue is
      # still worth filing.
      - name: Download the fuzz run log
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-run-log
          path: ${{ runner.temp }}/fuzz-log
      - name: Auto-file demoted randomized-fuzz finding (P1 bead + issue, deduped)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/ci-file-demoted-lane-failure.py --self-test
          python3 scripts/ci-file-demoted-lane-failure.py \
            --lane fuzz-randomized \
            --full-form "randomized cargo-fuzz (${{ github.event_name }})" \
            --per-pr-form "none (nightly only)" \
            --bead-prefix fz \
            --log "${{ runner.temp }}/fuzz-log/fuzz-run-log.txt" \
            --jsonl .beads/issues.jsonl \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Commit the demoted-lane bead back to main (best-effort; fail-soft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .beads/issues.jsonl; then
            echo "no bead appended (deduped or filing skipped) — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .beads/issues.jsonl
          git commit -m "chore(beads): auto-file demoted fuzz-randomized P1 bead [skip ci]" \
                     -m "Randomized-run finding on the nightly fuzz lane."
          set +e
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=demoted-lane bead push declined::Could not push the auto-filed bead to protected main (git push exit ${push_rc}; likely GH013 ruleset rejection). The GitHub issue filed in the previous step is the durable record."
            exit 0
          fi
          echo "pushed the demoted-lane bead to main."

  # Differential smoke (bead sq-0iqzw): the sparq-bench differential fuzzer (in-process
  # Oxigraph 0.5 oracle, crates/sparq-bench/src/fuzz.rs) over FIXED regression windows:
  #   * seeds 0..2000 'all' — the canonical broad smoke;
  #   * seeds 4695..6895 'equality' + 'filter' — the sq-lr2ii known-catch windows
  #     (the sargable-decimal f64-collapse bug reproduces ONLY in these dense
  #     categories; 'all' misses it);
  #   * the same 0..2000 window through the mmap / block-compressed / dict-spill
  #     store rebuilds (env-selected read-path differentials).
  # Fixed windows => deterministic; the ADVANCING-window exploration is differential.yml.
  differential-smoke:
    name: differential smoke (sparq vs Oxigraph, fixed regression windows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # CI-economy: the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Share the nightly differential lane's cache key: both build the exact
          # same sparq-bench release-fast binary, and differential.yml's main-scoped
          # nightly save keeps it warm.
          shared-key: differential-nightly
          # sq-3sbrr save-if discipline: SAVE only from main; a branch-scoped save is
          # unreachable from main and only churns the shared 10 GB Actions-cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Build distinctly so a compile error is reported separately from a mismatch.
      - name: Build the differential fuzzer
        run: cargo build -p sparq-bench --profile release-fast
      - name: Run the fixed differential regression windows
        run: |
          set -euo pipefail
          b=./target/release-fast/sparq-bench
          # Canonical broad smoke (all categories, deterministic seeds).
          "$b" fuzz 0 2000 all
          # sq-lr2ii known-catch windows (category-dense; 'all' misses this class).
          "$b" fuzz 4695 2200 equality
          "$b" fuzz 4695 2200 filter
          # sq-j80vk: fixed per-category regression windows over the SPARQL 1.1
          # surfaces added to the generator (property paths, aggregates/GROUP BY/
          # HAVING, sub-selects, EXISTS, VALUES, BIND, GRAPH) — plus sq-avd75's
          # `antijoin` (the `OPTIONAL … FILTER(!bound)` idiom, i.e. rewrite (b) of the
          # `algebra-rewrite` pass #1735, which the fuzzer builds ON) — and sq-qcnn.6's
          # `typed` / `strfn` / `ask` / `construct` (the typed-literal columns, the
          # string functions, and the two non-SELECT RESULT FORMS, which are compared
          # by their boolean / canonical triple set rather than by a count). 'all'
          # picks ONE category per seed, so the 2000-seed broad window above leaves
          # each of the 21 categories only ~95 cases — too thin a net for a specific
          # evaluation path. These are deterministic REGRESSION windows, not
          # known-catch ones: no historical bug is pinned to these seeds yet, and if
          # the nightly lane finds one its window gets pinned here the way sq-lr2ii's
          # was. ~2 s per category at release-fast throughput.
          for c in path aggregate subquery exists values bind graph antijoin \
                   typed strfn ask construct; do
            "$b" fuzz 0 10000 "$c"
          done
          # Store-mode read paths over the fixed window: the same seeds re-run with
          # the store rebuilt through mmap / block-compressed / dict-spill (the
          # dict-spill external build is the slowest per seed — smaller window).
          SPARQ_FUZZ_MMAP=1 "$b" fuzz 0 2000 all
          SPARQ_FUZZ_COMPRESS=1 "$b" fuzz 0 2000 all
          SPARQ_FUZZ_DICTSPILL=1 "$b" fuzz 0 500 all
