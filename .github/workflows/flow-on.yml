# [OPUS-4.8] Merge-triggered flow-on engine (bead sq-ncvq.3, epic sq-ncvq).
# Authored by Opus 4.8 (Fable unavailable; flag for re-review when Fable returns).
#
# On every MERGED pull request, evaluate scripts/flow-on-rules.toml against the
# PR's changed files / labels / title and open a GitHub issue (labelled
# `flow-on` + `auto`, idempotent) for each triggered follow-on. The orchestrator
# reconciles those issues into beads — we do NOT touch `bd` / `.beads/` in CI.
#
# [FABLE-5] (#2474) flow-on.py ALSO applies role/priority/status routing labels at
# creation (via the shared scripts/triage.py static pass): issues created under
# `secrets.GITHUB_TOKEN` fire no `issues: opened` event (GitHub's recursion
# guard), so triage-issue.yml can never label them post-hoc — unrouted, they were
# invisible to the dispatch frontier. The retriage cron sweeps the pre-fix
# label-less backlog.
#
# This is NOT a gate: it never blocks a merge (it runs AFTER merge) and the job
# name carries no `advisory`/`informational` token so it stays visible. It only
# mints follow-on issues.
name: flow-on

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: flow-on-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  flow-on:
    name: flow-on
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the MERGED commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # [OPUS-5] (#2547) The engine reads repo state to decide whether a
          # follow-on is genuinely owed — `bench/benchmarks.toml` for the
          # dashboard rule, and (new) `crates/<x>/Cargo.toml` for the
          # public-vs-`publish = false` split on the new-crate follow-ons. It must
          # therefore see the POST-merge tree. On `pull_request: closed` the
          # default ref is `refs/pull/<n>/merge`, a pre-merge preview that GitHub
          # stops updating once the PR closes; `merge_commit_sha` is the actual
          # commit that landed on the base branch, so a crate added by this PR is
          # guaranteed present. The job already runs only `if merged == true`,
          # where this field is populated.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run flow-on engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flow-on.py --pr "${{ github.event.pull_request.number }}"
