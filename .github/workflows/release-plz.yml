      - name: Run release-plz (create v<version> tag on version commit)
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # Tagging is a forge operation. [OPUS-5] sq-iwnnf: same App-token || RELEASE_PLZ_TOKEN
          # || GITHUB_TOKEN chain as the Release-PR job — a privileged token also makes the
          # pushed tag actually trigger release.yml (see the mint step above).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (step b, continued). With
          # `publish = false`, no crates.io credential is passed (publish is skipped, only the
