# Automated semantic-release driver (release-plz) — epic sq-v286, item sq-v286.4.
#
# [OPUS-4.8] 🤖 SPARQ agent. Design record: research/release-ci-design.md
#   §2  (tool selection: release-plz, release-PR model, git-cliff changelog engine)
#   §6  item 4 ("Add the release-plz release-pr + release workflow … on merge tags
#       vX.Y.Z, which fires the EXISTING release.yml unchanged").
#
# WHAT THIS DOES — the two-step release-plz flow, anchored on release-plz.toml
# (#789 / sq-v286.3: the version_group over the 37 publishable crates that keeps the
# locked single-version model):
#
#   1. release-pr  — on every push to main, release-plz reads the conventional-commit
#                    history (+ cargo-semver-checks API-break detection), computes the
#                    next single workspace version, and opens/UPDATES one "Release-PR"
#                    that bumps the version across the version_group + rewrites
#                    CHANGELOG.md (git-cliff) + updates Cargo.lock. Nothing is released
#                    yet — a human reviews + merges that PR.
#
#   2. release     — when the Release-PR MERGES, its version-bump commit lands on main;
#                    this push re-runs the workflow and `release-plz release` detects the
#                    new version is not yet tagged and CREATES the `v<version>` git tag
#                    (name from release-plz.toml `git_tag_name = "v{{ version }}"`).
#
# THE HANDOFF — tag → reuse existing release.yml (the whole point; do NOT duplicate the
# build matrix here). The EXISTING release.yml triggers on `push: tags: ["v*"]`, so the
# tag this job creates fires release.yml unchanged → its proven build-matrix.yml archive
# — PROVIDED the tag is pushed with a privileged token: GitHub suppresses workflow triggers
# for events created with the workflow's own GITHUB_TOKEN, so this handoff needs the App
# token / RELEASE_PLZ_TOKEN wired below (sq-iwnnf / #3273; docs/release.md §8e) —
# matrix + CycloneDX SBOM/VEX + SLSA provenance + SHA256SUMS + GitHub Release + ghcr
# container path all run exactly as today. This workflow adds NO build/package steps.
#
# SCOPE / RECONCILIATION (design §6 item 4 "Reconcile the two crates.io paths"):
#   * GitHub Release ownership — release.yml's `release` job creates the GitHub Release
#     (archives + SBOM/VEX + SHA256SUMS). release-plz's own GitHub-release creation is
#     therefore DISABLED (`git_release_enable = false` in release-plz.toml) so the two do
#     not collide on the same tag. release-plz creates the TAG ONLY; release.yml owns the
#     Release. This is the "scope release-plz to the tag only" arm of design §6 item 4.
#   * crates.io publish — kept MANUAL for now (`publish = false` in release-plz.toml):
#     the `CARGO_REGISTRY_TOKEN` secret does not exist yet (it is the needs:user bead
#     sq-v286.5 "complete out-of-repo publish prerequisites"). With publish disabled,
#     `release-plz release` skips `cargo publish` and proceeds straight to tag creation —
#     without that, cargo-publish-before-tag would fail with no token and the tag (hence
#     the whole release) would never be cut. Flip to release-plz-driven publish once the
#     token lands (then publish.yml only ATTESTS .crate bytes — the point of adoption).
#
# CARE — this workflow does NOT run on this PR (its triggers are push:main and the
# Release-PR-merge push, never pull_request / merge_group), so it does NOT register on the
# `ci-summary / gate` aggregator and cannot block this PR. The trade-off: a defect surfaces
# only at release time, so trigger keys / action inputs / permissions / the tag→release.yml
# handoff were hand-verified (see the PR body).
name: release-plz

on:
  push:
    branches: [main]

# Default to no permissions; each job opts into exactly what it needs (least privilege).
permissions: {}

# Serialize release-plz runs on main so two quick pushes cannot race to open/update the
# same Release-PR. cancel-in-progress: false — never abort a run that may be cutting a
# tag/release mid-flight (matches release-plz's documented recommendation).
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. Release-PR: open/update the version-bump + changelog PR on every push to main.
  #
  # [FABLE-5] ADVISORY + 403 containment. The repo/org setting "Allow GitHub Actions to create
  # and approve pull requests" is DISABLED, so GITHUB_TOKEN cannot create PRs: every main push
  # failed with `ERROR Failed to open PR ... HTTP status client error (403 Forbidden) for url
  # (https://api.github.com/repos/sparq-org/sparq/pulls)` (live: run 29988505600), and the old
  # job name carried no "advisory" token, so the failure GATED the ci-summary `gate` red on main.
  # Containment: (1) the job name contains the whole word "advisory" AND it is DECLARED in
  # .github/advisory-registry.json, which is what excludes it (since #3773 the name token alone
  # does nothing) from the gating set (owner bead sq-lonae); (2) the KNOWN 403 (PR-creation
  # setting disabled) is tolerated loudly — a `::warning` naming the needed setting, exit 0 —
  # but ONLY when BOTH the CAPTURED release-plz output matches the exact blocked-PR-creation
  # signature (Failed to open PR + 403 on the /pulls URL) AND a side-effect-free live probe of
  # the same call returns 403 ([FABLE-5] round-1 review: signature + probe together, so a
  # coincidental 403 — e.g. a secondary-rate-limit response to the probe — can never launder an
  # unrelated failure, and a non-403 real error with a flaky probe can never be swallowed).
  #
  # [OPUS-5] sq-iwnnf / #3273 — THE DURABLE FIX, CI half. Containment stops the red; it does not
  # get a Release-PR opened, so the release automation the GUI download (sq-gl3cf) and the
  # multi-platform builds (sq-v286) depend on stays dead. Both fixes the bead offers are
  # needs:user (flip the repo setting, or provision a token). This job now takes the SECOND arm
  # and PRE-WIRES it, so provisioning is the ONLY remaining step — no follow-up CI edit:
  #
  #   forge token = App token (ORCHESTRATOR_APP_ID/_PRIVATE_KEY, minted per batch-merge.yml)
  #              || RELEASE_PLZ_TOKEN                        (a maintainer-provisioned PAT)
  #              || GITHUB_TOKEN                             (today's fallback; cannot open PRs)
  #
  # Neither privileged token is subject to the Actions PR-creation setting, so the moment EITHER
  # secret exists the Release-PR opens and this job goes green with no workflow change. Until
  # then the chain resolves to GITHUB_TOKEN and behaviour is exactly as before.
  #
  # The containment is NARROWED to match: it tolerates the 403 only when the UNPRIVILEGED
  # fallback was in use. A configured App/PAT token that still 403s means the token itself is
  # wrong (missing repo scope / App not installed / expired) — a real, actionable failure that
  # must stay loud rather than be laundered by a setting-disabled explanation that no longer
  # applies. See the `PRIVILEGED_TOKEN` branch in the containment step.
  #
  # STILL needs:user — neither privileged secret was configured as of the last observation
  # (batch-merge run 29990467905: ORCHESTRATOR_APP_ID empty, HAVE_APP_TOKEN=false), so today the
  # chain still lands on GITHUB_TOKEN and the Release-PR is still not opened. ANY ONE of three
  # unblocks it: provision ORCHESTRATOR_APP_ID + ORCHESTRATOR_APP_PRIVATE_KEY
  # (repo secrets; App needs `contents: write` + `pull_requests: write`), OR add a RELEASE_PLZ_TOKEN
  # secret (fine-grained PAT, same two permissions), OR enable Settings → Actions → General →
  # "Allow GitHub Actions to create and approve pull requests". Any one of the three fixes this.
  release-plz-pr:
    name: release-plz / Release-PR (advisory)
    # Guard against forks: release-plz needs repo write + would open PRs on a fork clone.
    # Mirrors bench-ec2.yml's `github.repository == 'sparq-org/sparq'` guard.
    if: github.repository == 'sparq-org/sparq'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the version bump + changelog onto the Release-PR branch
      pull-requests: write  # open / update the Release-PR
    env:
      # Secrets are not readable from a step `if:` expression — mirror the App id into env so
      # the mint step can be skipped fail-soft when the App is not configured (batch-merge.yml).
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
    steps:
      # [OPUS-5] sq-iwnnf — first arm of the token chain. Skipped (not failed) when the App
      # secrets are absent; `steps.app-token.outputs.token` is then empty and the `||` chain
      # below falls through to RELEASE_PLZ_TOKEN, then to GITHUB_TOKEN.
      - name: Mint the sparq-orchestrator App token (bypasses the PR-creation setting)
        id: app-token
        if: env.ORCHESTRATOR_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
      - name: Checkout (full history for changelog generation)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # release-plz / git-cliff walk the full commit history to build the changelog.
          fetch-depth: 0
          # Do not leave the default GITHUB_TOKEN in the local git config; release-plz uses
          # its own `token:` input for forge operations (release-plz docs recommendation).
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      # [FABLE-5] round-1 review: the release-pr invocation moved OUT of the composite
      # release-plz/action into a direct `run:` step, because the containment below must classify
      # the failure from release-plz's CAPTURED output — and a `uses:` step's output cannot be
      # tee'd. The tools are installed with the SAME taiki-e/install-action SHA pin the repo uses
      # everywhere (v2.83.4; explicit `with: tool:` per sq-ur7o), at the SAME versions the pinned
      # release-plz/action v0.5.131 installs internally (release-plz@0.3.160 via binstall,
      # cargo-semver-checks@0.48 — release-plz shells out to it for API-break detection), so the
      # behavior is unchanged; only the invocation is now wrapped and captured. The unchanged
      # `release` job below still uses the pinned release-plz/action (no containment needed there).
      - name: Install release-plz + cargo-semver-checks (pinned)
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: release-plz@0.3.160,cargo-semver-checks@0.48
      - name: Run release-plz release-pr (output captured for failure classification)
        id: releasepr
        # continue-on-error so the containment step below can classify the failure from the
        # captured log: the KNOWN 403 (Actions PR-creation setting disabled) is tolerated with a
        # ::warning; anything else re-fails the job. See the job-level comment.
        continue-on-error: true
        env:
          # [OPUS-5] sq-iwnnf — the token release-plz uses to open/update the Release-PR:
          # App token || RELEASE_PLZ_TOKEN || GITHUB_TOKEN (see the job-level comment). An
          # unset secret evaluates to the empty string, so `||` selects the first configured one.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # Which arm won — logged (never the token itself) so a run says why it can/cannot open a PR.
          TOKEN_SOURCE: ${{ steps.app-token.outputs.token != '' && 'sparq-orchestrator App token' || (secrets.RELEASE_PLZ_TOKEN != '' && 'RELEASE_PLZ_TOKEN (PAT)' || 'GITHUB_TOKEN (cannot open PRs while the Actions PR-creation setting is disabled)') }}
        run: |
          set -uo pipefail
          echo "release-plz forge token: ${TOKEN_SOURCE}"
          # The commit ident the release-plz/action's git-config sub-action would set for
          # GITHUB_TOKEN (release-plz commits the version bump onto the Release-PR branch).
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Same invocation the pinned action's release-pr branch runs; 2>&1 | tee captures
          # BOTH streams (release-plz logs errors to stderr) for the containment step.
          release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            -o json 2>&1 | tee /tmp/release-plz-pr.log
          exit "${PIPESTATUS[0]}"
      # [FABLE-5] Classify a release-plz failure: tolerate ONLY the known 403 (repo setting
      # "Allow GitHub Actions to create and approve pull requests" disabled — live: run
      # 29988505600), established by TWO independent conditions that must BOTH hold
      # (round-1 review — the probe alone could misclassify e.g. a rate-limit 403):
      #   (a) SIGNATURE — the captured release-plz output contains a "Failed to open PR" line
      #       carrying a 403 on the POST /repos/:repo/pulls URL (the exact live failure shape);
      #   (b) PROBE — re-running the same call NOW with this job's GITHUB_TOKEN returns 403.
      #       The probe is side-effect-free: head==base is invalid, so a token PERMITTED to
      #       create PRs gets 422 Validation Failed and no PR is ever created, while a token
      #       blocked by the Actions PR-creation setting gets the same 403 release-plz hit
      #       (the authorization check precedes body validation).
      # (a)+(b) => loud ::warning + exit 0. Anything else — signature mismatch (a different
      # release-plz error, even if the probe happens to 403), or a non-403 probe — keeps the
      # failure a real failure of this (advisory) job. Never silently swallow a different error.
      - name: Contain the known 403 (Actions PR-creation setting disabled)
        if: steps.releasepr.outcome == 'failure'
        env:
          # Probe with the SAME token release-plz used, or the probe proves nothing about it.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # [OPUS-5] sq-iwnnf — 'true' iff a privileged (setting-exempt) token was configured.
          # The whole tolerated-403 story is "GITHUB_TOKEN is blocked by a repo setting"; with an
          # App/PAT token that story is false by construction, so the failure must stay loud.
          PRIVILEGED_TOKEN: ${{ (steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN) != '' }}
        run: |
          set -euo pipefail
          log=/tmp/release-plz-pr.log
          if [ "${PRIVILEGED_TOKEN}" = "true" ]; then
            echo "::error::release-plz release-pr failed while using a PROVISIONED App/PAT token. That token is not subject to 'Allow GitHub Actions to create and approve pull requests', so the known blocked-setting condition cannot explain this — it is a real failure (check the App is installed on this repo with contents:write + pull_requests:write, or that RELEASE_PLZ_TOKEN is unexpired and carries those permissions). Captured output follows."
            sed 's/^/  | /' "$log" 2>/dev/null || echo "  | (no captured output at $log)"
            exit 1
          fi
          if [ ! -s "$log" ]; then
            echo "::error::release-plz release-pr failed but left no captured output at $log — cannot classify the failure; treating as a real failure."
            exit 1
          fi
          # (a) SIGNATURE: a single line must carry all three markers — "Failed to open PR",
          # a 403, and the POST /pulls URL for THIS repo. grep -F for the URL (dots literal).
          if ! grep "Failed to open PR" "$log" | grep -F "403" | grep -Fq "api.github.com/repos/${GITHUB_REPOSITORY}/pulls"; then
            echo "::error::release-plz release-pr failed, but the captured output does NOT match the known blocked-PR-creation signature (a 'Failed to open PR' line with a 403 on api.github.com/repos/${GITHUB_REPOSITORY}/pulls) — this is a DIFFERENT, real failure (even if a 403 probe would succeed, e.g. rate limiting). Captured output follows."
            sed 's/^/  | /' "$log"
            exit 1
          fi
          echo "captured output matches the known blocked-PR-creation signature; probing the live call."
          # (b) PROBE: the same POST /pulls with this job's token, side-effect-free (head==base).
          code=$(curl -sS -o /tmp/rp-probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
            -d '{"title":"release-plz 403 probe (never created: head==base is invalid)","head":"main","base":"main"}')
          echo "PR-creation probe HTTP status: ${code}"
          if [ "${code}" = "403" ]; then
            echo "::warning title=release-plz Release-PR blocked by repo setting::GITHUB_TOKEN cannot create pull requests: the repo/org setting 'Settings → Actions → General → Allow GitHub Actions to create and approve pull requests' is disabled, so the Release-PR was NOT opened (known condition, established by captured-output signature + live probe; tolerated as advisory). Durable fix (needs:user, ANY ONE of the three — the CI side is already wired, no workflow edit needed): enable that repo setting; OR add the ORCHESTRATOR_APP_ID/_PRIVATE_KEY App secrets; OR add a RELEASE_PLZ_TOKEN secret (fine-grained PAT with contents:write + pull_requests:write). This job already prefers a minted App token, then RELEASE_PLZ_TOKEN, over GITHUB_TOKEN, and neither privileged token is subject to that setting."
            exit 0
          fi
          echo "::error::release-plz release-pr failed with the blocked-PR-creation signature in its output, but the live PR-creation probe returned HTTP ${code} (not 403) — the blocked-setting condition is not reproducible right now, so this is treated as a real failure. Probe response body follows."
          cat /tmp/rp-probe.json || true
          exit 1
      # [OPUS-5] sq-lonae — PROMOTION SIGNAL. The promotion of this job back to gating is
      # needs:user (provision ORCHESTRATOR_APP_ID/_PRIVATE_KEY or RELEASE_PLZ_TOKEN, or enable
      # the Actions PR-creation setting — see the job comment and docs/release.md §8e), and
      # until this step nothing in the repo OBSERVED the moment that prerequisite landed: the
      # forge-token chain resolves silently, so a newly-provisioned token just makes this job go
      # quietly green and the `(advisory)` declaration in .github/advisory-registry.json rots.
      #
      # The registered promotion criterion is "PR-creation works with this job's forge token",
      # which is exactly what the containment step's side-effect-free probe answers — so re-use
      # it on the SUCCESS path (the failure path already probed, and already reported). head==base
      # is invalid, so a token PERMITTED to create PRs gets 422 Validation Failed and no PR is
      # ever created, while a token blocked by the Actions setting gets 403. The probe is needed
      # even on success because `release-plz release-pr` also exits 0 when there is simply
      # nothing to release, which says nothing about whether PR-creation is allowed.
      #
      # FAIL-SOFT BY CONSTRUCTION — this step must never fail the release path (no `set -e`, the
      # curl cannot propagate). Only the DEFINITIVE 422 (authorization passed, body rejected)
      # claims readiness; 403 means still blocked; anything else — including a probe that never
      # completed — is reported as inconclusive rather than misread as an unblock.
      - name: Promotion signal — has PR-creation unblocked? (sq-lonae)
        if: steps.releasepr.outcome == 'success'
        env:
          # Probe with the SAME token release-plz used, or the probe proves nothing about it.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
            -d '{"title":"release-plz PR-creation probe (never created: head==base is invalid)","head":"main","base":"main"}') || true
          echo "PR-creation probe HTTP status: ${code:-<probe did not complete>}"
          case "${code}" in
            422)
              echo "::warning title=release-plz Release-PR promotion unblocked (sq-lonae)::This job's forge token CAN now create pull requests — the side-effect-free probe returned 422 (authorization passed, only the head==base body was rejected), so the known blocked-PR-creation condition no longer holds. The advisory declaration is now STALE. Promote: drop the ' (advisory)' token from this job's name, delete the 'Contain the known 403' step and this step, and delete the 'release-plz / Release-PR (advisory)' entry from .github/advisory-registry.json (docs/release.md §8e)."
              ;;
            403)
              echo "PR-creation is still blocked for this forge token — the job stays advisory (sq-lonae)."
              ;;
            *)
              echo "PR-creation probe inconclusive (HTTP '${code}') — not claiming promotion readiness."
              ;;
          esac

  # ---- 2. release: when the Release-PR's version commit is on main, create the v<version>
  #         git tag. That tag fires the EXISTING release.yml (push: tags: ["v*"]) which does
  #         all the building/packaging/releasing. No build matrix here by design.
  release-plz-release:
    name: release-plz / tag (handoff to release.yml)
    if: github.repository == 'sparq-org/sparq'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create + push the v<version> git tag
      # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (step b of release-plz.toml's
      # `publish` note). UNCOMMENT the next line together with the auth-action step + the
      # CARGO_REGISTRY_TOKEN env below, and set `publish = true` in release-plz.toml:
      # id-token: write  # OIDC token crates-io-auth-action exchanges for a short-lived crates.io token
    env:
      # See the release-plz-pr job: secrets are not readable from a step `if:`.
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
    steps:
      # [OPUS-5] sq-iwnnf / #3273 — the SAME token chain as the Release-PR job, and it matters
      # here for a second, independent reason: GitHub suppresses workflow triggers for events
      # created with the workflow's own GITHUB_TOKEN, so a `v<version>` tag pushed with
      # GITHUB_TOKEN does NOT fire release.yml (`push: tags: ["v*"]`) — the tag→release.yml
      # handoff this file is built around. A minted App token / PAT is a normal actor and does
      # fire it. Skipped fail-soft when unconfigured; the chain then falls back as before.
      - name: Mint the sparq-orchestrator App token (tag push must fire release.yml)
        id: app-token
        if: env.ORCHESTRATOR_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
      - name: Checkout (full history for tag detection)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      # [OPUS-5] issue #1135 — THE PUBLISH-CADENCE GUARD. THIS STEP IS LOAD-BEARING.
      #
      # The maintainer's ask, verbatim: "can I make sure that there are protections in
      # place to prevent publishing too regularly, I don't want to spam the registry."
      # scripts/release_pr_guard.py stops the Release PR being ARMED; this is the belt to
      # that braces — enforced in the release path itself, so even a mistaken merge (by a
      # human, by a future automation, by a path nobody enumerated) cannot cut a release
      # more often than MIN_RELEASE_INTERVAL (24h; the constant carries its justification).
      #
      # It runs BEFORE the release-plz step below, which creates the `v<version>` tag and —
      # once release-plz.toml sets `publish = true` — runs `cargo publish`. A non-zero exit
      # here stops the job before either happens. A crates.io version can NEVER be
      # unpublished, so the guard REFUSES on every indeterminacy (shallow checkout,
      # unreadable tag list, unparseable date, unreachable crates.io, future-dated last
      # release, publishable crate outside the version_group).
      #
      # DO NOT add an `if:` to this step, do not set `continue-on-error`, do not move it
      # after the release-plz step, and do not swap `--enforce` for `--dry-run`.
      # scripts/tests/test_release_publish_guard.py parses THIS FILE structurally and
      # fails on each of those mutations — a text/substring assertion would not catch
      # `if: false`, which is exactly where vacuity has lived in this repo before.
      #
      # The `fetch-depth: 0` checkout above is a PRECONDITION: on a shallow checkout the
      # tag list is not authoritative and the guard refuses rather than guessing.
      - name: "Publish-cadence guard (fail-closed minimum release interval, #1135)"
        run: python3 scripts/release-interval-guard.py --enforce --repo-root .
      # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (continued). When flipping
      # `publish = true`, release-plz runs `cargo publish` BEFORE tagging and needs a crates.io
      # credential in CARGO_REGISTRY_TOKEN. crates.io Trusted Publishing (GA 2025-07, RFC 3691)
      # supplies a SHORT-LIVED token via OIDC — no long-lived secret. UNCOMMENT this step (it
      # must run BEFORE the release-plz step) and wire its `token` output into the env below:
      #   - name: Mint short-lived crates.io token (OIDC trusted publishing)
      #     id: cratesio-auth
