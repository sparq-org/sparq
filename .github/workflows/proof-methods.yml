# Tests for the detached proof-methods workspace.
name: proof-methods

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "proof-methods/**"
      - "zk/sparql-evaluator/model/**"
      - "vendor/spargebra-shim/**"
      - ".github/workflows/proof-methods.yml"
  push:
    branches: [main]
    paths:
      - "proof-methods/**"
      - "zk/sparql-evaluator/model/**"
      - "vendor/spargebra-shim/**"
      - ".github/workflows/proof-methods.yml"

permissions:
  contents: read

concurrency:
  group: proof-methods-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    # Off draft PR heads: ready_for_review runs this lane on the head that will merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: proof-methods tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Activate pinned Rust
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: proof-methods
          workspaces: proof-methods
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --manifest-path proof-methods/Cargo.toml -p sparq-vcq-disclosed -p sparq-vcq-tee -p sparq-verifiable-aggregate --check

      - name: Tests
        run: cargo test --locked --release --manifest-path proof-methods/Cargo.toml --all-features

      - name: Clippy
        run: cargo clippy --locked --release --manifest-path proof-methods/Cargo.toml --all-features --all-targets -- -D warnings

      - name: VOLE and ACIR scripts parse and unit tests
        run: |
          python3 -m py_compile proof-methods/vole/acir_to_sieve.py proof-methods/vole/circuits/gen.py proof-methods/vole/quicksilver_run.py
          bash -n proof-methods/vole/bench.sh
          python3 -m unittest proof-methods/vole/test_acir_to_sieve.py
          python3 -m py_compile proof-methods/acir/blake3_leaf.py proof-methods/acir/tamper.py
          bash -n proof-methods/acir/run.sh
          bash -n proof-methods/acir/gates.sh
          python3 -m unittest proof-methods/acir/test_blake3_leaf.py

      - name: Measurement example runs
        run: cargo run --locked --release --manifest-path proof-methods/Cargo.toml -p sparq-vcq-disclosed --example measure --features fixtures -- 3

      - name: Aggregate wasm build and clippy
        run: |
          cargo build --locked --release --manifest-path proof-methods/Cargo.toml -p sparq-verifiable-aggregate --target wasm32-unknown-unknown --features wasm
          cargo clippy --locked --manifest-path proof-methods/Cargo.toml -p sparq-verifiable-aggregate --target wasm32-unknown-unknown --features wasm -- -D warnings

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Aggregate Node smoke
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("proof-methods/aggregate/Cargo.toml", "rb"))["dependencies"]["wasm-bindgen"]["version"].removeprefix("="))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          python3 proof-methods/aggregate/tests/test_license_notices.py
          proof-methods/aggregate/build-node.sh "$RUNNER_TEMP/aggregate-node"
          mkdir "$RUNNER_TEMP/aggregate-dist"
          npm pack "$RUNNER_TEMP/aggregate-node" --offline --ignore-scripts --pack-destination "$RUNNER_TEMP/aggregate-dist"
          npm install --prefix "$RUNNER_TEMP/aggregate-install" --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/aggregate-dist/*.tgz
          AGGREGATE_PACKAGE="$RUNNER_TEMP/aggregate-install/node_modules/sparq-verifiable-aggregate" node --test proof-methods/aggregate/tests/node-smoke.cjs
