name: Benchmarks

# Cross-commit performance tracking. On every push to main, run the engine over a synthetic
# dataset, emit per-subsystem latencies, and store them with github-action-benchmark so the
# trend is graphed across commits and a large regression raises an alert/comment. Runs on free
# GitHub-hosted runners. Heavy/long benches that need real hardware are in the separate,
# manual-dispatch bench-ec2.yml.
#
# WHEN:
#   * push to main     — full suite; publishes the point to the benchmark-data history branch,
#                        runs the median-of-history hard zone, and keeps the regression
#                        alert/comment.
#   * nightly schedule — full suite as a verification run; publishes nothing.
#   * workflow_dispatch— full suite (publishes only when dispatched on main).
#   * pull_request     — ONLY when the PR carries the `bench` label: the full suite runs and
#                        github-action-benchmark comments the comparison against main's
#                        published series. PR runs never write the history branch.
#
# The history branch (benchmark-data) is also the source for the public GitHub Pages dashboard:
#
#   PUBLIC DASHBOARD — REPO-OWNER TOGGLE REQUIRED (one-time, can't be set from a workflow):
#   Settings → Pages → "Build and deployment" → Source = "Deploy from a branch",
#   Branch = `benchmark-data` / `/ (root)` → Save. The chart then renders at
#   https://sparq.jeswr.org/dev/bench (the action writes index.html + data.js under dev/bench
#   on the benchmark-data branch — see gh-pages-branch + benchmark-data-dir-path below).
on:
  push:
    branches: [main]
    # ANTI-LOOP: the auto-ratchet step below commits bench/perf-baseline.json back to main.
    # paths-ignore stops that floor-only commit from re-triggering this workflow (the [skip ci]
    # in the commit message is the second guard).
    paths-ignore:
      - 'bench/perf-baseline.json'
  # Opt-in per PR: add the `bench` label. `labeled` starts the run; `synchronize` re-runs it
  # on each push while the label stays on. The job `if:`s below skip every other PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # 05:29 UTC — offset from the other nightly lanes so they do not contend for runners.
  schedule:
    - cron: "29 5 * * *"

# Least-privilege default: read-only at the top; the writes the benchmark job needs (push to
# benchmark-data, deployment status, PR comment, bench-flake issue) are scoped to `bench`.
permissions:
  contents: read

# One run per ref; a newer run cancels an older one. A pull_request event that will NOT run
# the bench (PR without the `bench` label, or a different label being added) gets a unique
# group, so it can never cancel an in-flight labelled bench run.
concurrency:
  group: >-
    bench-${{ github.ref }}${{ github.event_name == 'pull_request'
    && !(contains(github.event.pull_request.labels.*.name, 'bench')
    && (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-light gate for the dashboard's readable labels (no rust/wasm build):
  # validates the JSON, runs the generator's --check drift gate, syntax-checks dashboard.js,
  # and runs the node smoke test (scripts/dashboard-smoke.js).
  dashboard-labels:
    name: dashboard labels (lint + drift)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate metric-labels.json
        run: python3 -c "import json; json.load(open('bench/dashboard/metric-labels.json')); print('metric-labels.json is valid JSON')"
      - name: Drift gate (regenerate + diff)
        run: python3 scripts/gen-metric-labels.py --check
      - name: Syntax-check dashboard.js
        run: node --check bench/dashboard/dashboard.js
      - name: Dashboard smoke test
        run: node scripts/dashboard-smoke.js

  bench:
    name: run + track benchmarks
    # Same opt-in rule as dashboard-labels: every non-PR event, or a PR labelled `bench`
    # (a `labeled` event for some other label does not start a run).
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ubuntu-latest
    # Job-scoped writes (least privilege; the rest of the workflow stays read-only):
    #   contents: write     — auto-ratchet commits bench/perf-baseline.json back to main and
    #                         github-action-benchmark pushes the point to the benchmark-data branch
    #   deployments: write  — github-action-benchmark records a GitHub deployment status
    #   pull-requests: write— comment-always posts the comparison table on (same-repo) PRs;
    #                         fork PRs get a read-only token, so the action skips the comment.
    #   issues: write       — the soft-zone triage step files/updates a deduped `bench-flake`
    #                         issue instead of @-mentioning anyone. Guarded to the canonical repo.
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown   # enables the wasm bundle-size metric in ci-bench.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # sq-3sbrr save-if discipline: SAVE only from main; a branch-scoped save is
          # unreachable from main and only churns the shared 10 GB Actions-cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # binaryen (wasm-opt) for the trend-only wasm_opt_bundle_bytes metric. ci-bench.sh guards
      # on `command -v wasm-opt`, so the metric is skipped when absent.
      - name: Install binaryen (wasm-opt for shipped-size trend metric)
        run: sudo apt-get update -q && sudo apt-get install -y binaryen
      # Well-known-suite toolchains (sp2b/dbpsb/watdiv/bsbm/lubm) — non-PR runs only. On a PR the
      # ci-bench.sh suite hooks (each guarded on `command -v <tool>`) skip these multi-minute
      # suites, so a `bench`-labelled PR gets the synthetic + operator + byte-count metrics.
      #   default-jdk = java (bsbm) + javac (lubm); libboost-all-dev = watdiv's Boost;
      #   raptor2-utils = lubm's `rapper`; unzip = bsbm's distribution unpack.
      - name: Install well-known-suite toolchains (non-PR runs)
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev default-jdk raptor2-utils unzip
      # Per-suite generator caches: each suite's gen.sh/fetch.sh builds its generator + fixed corpus
      # once under /tmp/<suite> (or the pinned slice under /tmp/dbpsb). Keyed on the generator
      # scripts so a generator/pinning change busts the cache.
      - name: Cache sp2b generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/sp2b
          key: bench-sp2b-${{ runner.os }}-${{ hashFiles('bench/sp2b/gen.sh') }}
      - name: Cache watdiv generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/watdiv
          key: bench-watdiv-${{ runner.os }}-${{ hashFiles('bench/watdiv/gen.sh', 'bench/watdiv/files/words.txt') }}
      - name: Cache bsbm generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bsbm
          key: bench-bsbm-${{ runner.os }}-${{ hashFiles('bench/bsbm/gen.sh') }}
      - name: Cache lubm generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/lubm
          key: bench-lubm-${{ runner.os }}-${{ hashFiles('bench/lubm/gen.sh') }}
      - name: Cache dbpsb pinned slice + cut
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dbpsb
          key: bench-dbpsb-${{ runner.os }}-${{ hashFiles('bench/dbpsb/fetch.sh') }}
      - name: Build release binaries
        run: cargo build --release -p sparq-cli -p sparq-bench
      # The full suite: the deterministic byte-count metrics (store/dict/wasm bytes) plus the
      # timing suite. Results land in bench-results.json for every step below.
      - name: Run benchmarks
        run: bash scripts/ci-bench.sh 200000 bench-results.json
      # HARD regression RATCHET on the gated metrics (store/dict bytes-per-{triple,term},
      # store_bytes_per_triple_small, wasm_bundle_bytes = DETERMINISTIC byte counts; parse_ns_per_byte =
      # TIMING, made noise-robust via best-of-N re-measure — see the Hard gate step below).
      # github-action-benchmark's fail-on-alert is a single GLOBAL switch that would also trip on the noisy
      # wall-clock latencies, so it stays false (alert-comment only, below). This step is the TRUE gate.
      #
      # sq-52e: the gate now compares each metric against its COMMITTED best-ever FLOOR in
      # bench/perf-baseline.json (the source-of-record ratchet, reviewed in diffs like the conformance
      # RATCHET in ci.yml) — NOT the drifting previous point. A sub-threshold creep every commit therefore
      # can no longer slow-drift unbounded past the floor ("boiling frog"): each creep is measured against
      # the FIXED floor and trips once cumulative drift exceeds the band. See scripts/perf-gate.py header.
      #
      # Runs on every event, including `bench`-labelled PRs (they gate against the same committed floor;
      # the baseline auto-update + benchmark-data push are main-only). DELIBERATE
      # increases (e.g. a wasm bump from a new feature): EITHER edit bench/perf-baseline.json to raise the
      # floor in the reviewed PR, OR set the workflow var PERF_GATE_ALLOW (e.g. 'wasm_bundle_bytes') — the
      # allowed metric passes AND is re-floored to the new value by the auto-ratchet step below.
      - name: Unit-test the hard-gate ratchet logic
        # Cheap (no build): asserts perf-gate.py fails on a real regression, on cumulative SLOW DRIFT
        # against the best-ever floor (the sq-52e adversarial test), and passes on noise / improvement /
        # missing-floor / deliberate-allow — and that improvements ratchet the floor DOWN while a one-off
        # noise-low does NOT. Catches a future edit that breaks the gate before it can silently let a
        # regression through.
        run: python3 scripts/perf-gate.py --self-test
      - name: Fetch previous benchmark series (for the noise-metric sustained-improvement check)
        id: prev_series
        # The committed floor lives in bench/perf-baseline.json (in this checkout) — the gate needs no
        # network. We still fetch data.js so the auto-ratchet step can damp the NOISE metric's floor with
        # the median of recent published points (never a one-off noise-low). Missing branch => skipped.
        run: |
          set -euo pipefail
          if git fetch --depth=20 origin benchmark-data 2>/dev/null; then
            git show FETCH_HEAD:dev/bench/data.js > prev-data.js 2>/dev/null \
              && echo "fetched previous benchmark-data/dev/bench/data.js" \
              || echo "benchmark-data branch has no dev/bench/data.js yet."
          else
            echo "benchmark-data branch not present yet (first run)."
          fi
      # (sq-dzfu) The DETERMINISTIC byte-count metrics are hard-gated strictly. The TIMING
      # metric (parse_ns_per_byte) is made robust to GitHub-runner noise via BEST-OF-N re-measure: if it
      # trips the band, the gate re-runs the CHEAP `ci-bench.sh --parse-only` path (no wasm build, no big
      # corpus, no well-known suites — ~sub-second using the binaries already built above) up to K times
      # and keeps the BEST (min) reading, only FAILING if the best of N still exceeds the band. Runner
      # noise only ever inflates a wall-clock reading, so a one-off spike is squeezed out while a real
      # parse regression (slow on EVERY reading) still fails. Mirrors PR #62's coverage re-measure fix.
      - name: Hard gate — perf regression (deterministic strict; timing best-of-N robust)
        env:
          # Deliberate-bump escape hatch: comma-separated metric names allowed to regress THIS run.
          # Leave empty normally; set to e.g. 'wasm_bundle_bytes' on a commit/run that intentionally
          # grows the bundle. The allowed metric passes here AND is re-floored by the auto-ratchet step.
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
        run: |
          python3 scripts/perf-gate.py bench-results.json bench/perf-baseline.json \
            --remeasure-cmd 'bash scripts/ci-bench.sh --parse-only /tmp/perf-remeasure.json >/dev/null 2>&1 && cat /tmp/perf-remeasure.json' \
            --remeasure-k 4
      # AUTO-RATCHET-DOWN (sq-52e): on push to main, AFTER the gate passes, lower any floor a
      # genuine improvement beat (auto metrics: current < floor; noise metric: only on a SUSTAINED
      # improvement — the median of recent published points below the floor, never a one-off noise-low),
      # and re-floor any PERF_GATE_ALLOW metric to its new value. If bench/perf-baseline.json changed,
      # commit it BACK to main so the floor (the source-of-record ratchet) only ever TIGHTENS automatically.
      #   ANTI-LOOP (two independent guards): (1) the commit message carries [skip ci]; (2) this workflow's
      #   on.push.paths-ignore excludes bench/perf-baseline.json, so a floor-only commit can't re-trigger it.
      # main only — PRs (esp. forks) get a read-only token and must never write to main. exit 3 = no change.
      #
      # FAIL-SOFT + FETCH-REBASE the commit-back (sq-llxc; sibling of sq-roe3 / PR #856). The
      # default GITHUB_TOKEN CANNOT push to protected `main`: this `push:main` run's HEAD is already
      # behind the remote tip (other merges land during the long bench job) so the direct `git push
      # HEAD:main` is rejected `! [rejected] HEAD -> main (fetch first)` (a non_fast_forward race), and
      # even past that race the `main` ruleset (id 17688455: pull_request + required_status_checks "gate"
      # + code_scanning + non_fast_forward; only the repository-administrator role can bypass)
      # rejects the non-administrator GITHUB_TOKEN with `GH013`. Confirmed RED on
      # Benchmarks runs #27827073571 and #27826231986 (both push:main):
      #     1 file changed, 2 insertions(+), 2 deletions(-)
      #     ! [rejected]        HEAD -> main (fetch first)
      #     error: failed to push some refs to 'https://github.com/sparq-org/sparq.git'
      # Under `set -euo pipefail` that turned the whole Benchmarks job RED on every improving push, AND
      # the floor never landed (the ratchet is silently a no-op on this path). Two changes below:
      #   (1) FETCH-REBASE: before the push, fetch the latest origin/main and rebase the floor-only commit
      #       onto it, so WHEN pushing is enabled the non_fast_forward race is survived (commit applies
      #       onto the current tip). bench/perf-baseline.json is touched by nothing else, so this rebase
      #       never conflicts.
      #   (2) FAIL-SOFT push: disable errexit only around the push, capture its exit code, and on non-zero
      #       emit a clear ::warning:: (naming the non_fast_forward / GH013 cause) and exit 0 so the job
      #       stays GREEN whether or not the push lands. The MEASUREMENT + perf-gate comparison above are
      #       UNTOUCHED — only this main-only commit-back is made non-fatal and race-safe.
      # RULESET-COMPATIBLE PATH (true floor-landing, deferred — same as sq-roe3/#856):
      #   Option A — add the github-actions bot to the `main` ruleset bypass list (owner-only → needs:user)
      #              so the rebased push actually lands; OR
      #   Option C — fold the baseline update into the periodic .beads / data-sync PR (sq-2xdg) through the
      #              normal PR → gate → merge flow.
      # The fail-soft is the immediate fix (stops the red runs); the floor-landing is deferred to that
      # decision.
      - name: Auto-ratchet the perf floor (commit improvements back to main)
        # sq-mel85: push-to-main ONLY (excludes the nightly `schedule`
        # backstop) so a scheduled full-run verifies the gate WITHOUT committing a new
        # floor — the source-of-record ratchet cadence stays tied to code-landing pushes.
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RECENT_ARG=()
          [ -f prev-data.js ] && RECENT_ARG=(--recent-data prev-data.js)
          set +e
          python3 scripts/perf-gate.py --update-baseline bench-results.json bench/perf-baseline.json "${RECENT_ARG[@]}"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "perf floor unchanged — nothing to commit."
            exit 0
          elif [ "$rc" != "0" ]; then
            echo "::error::perf-gate --update-baseline failed (exit $rc)"; exit "$rc"
          fi
          if git diff --quiet -- bench/perf-baseline.json; then
            echo "no diff in bench/perf-baseline.json despite update — nothing to commit."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bench/perf-baseline.json
          git commit -m "chore(bench): auto-ratchet perf floor to new best-ever [skip ci]" \
                     -m "Lowered by the bench workflow after a measured improvement (sq-52e perf ratchet)."
          # FETCH-REBASE the floor-only commit onto the latest origin/main tip so the push survives the
          # non_fast_forward race (main moves ahead during the long bench job). bench/perf-baseline.json
          # is written by nothing else, so this rebase never conflicts; if it somehow does, fail soft.
          if git fetch origin main 2>/dev/null && git rebase FETCH_HEAD 2>/dev/null; then
            echo "rebased the floor-only commit onto the latest origin/main tip."
          else
            git rebase --abort 2>/dev/null || true
            echo "::warning title=perf-floor rebase skipped::Could not rebase the floor commit onto origin/main (fetch or rebase failed); attempting push as-is."
          fi
          # Best-effort push. A protected-branch ruleset rejection (GH013) or a residual non_fast_forward
          # race must NOT fail this non-gating main-only commit-back. Disable errexit only around the push
          # so we can inspect its status and fail soft (the measurement + perf-gate above are untouched).
          set +e
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=perf-floor push declined::Could not push the tightened perf floor to protected main (git push exit ${push_rc}; likely a non_fast_forward race or the GH013 ruleset rejection — the bypass list contains only the repository-administrator role, not the github-actions bot). Best-effort no-op: the perf measurement + hard gate ran and the floor WAS computed, but the bench/perf-baseline.json update was NOT landed. Resolve by adding the github-actions bot to the main ruleset bypass list (owner-only; sq-llxc/sq-roe3 needs:user) or folding the baseline update into the periodic .beads / data-sync PR (sq-2xdg). The floor only tightens via a human/orchestrator commit in the meantime."
            exit 0
          fi
          echo "committed + pushed tightened perf floor to main."
      # First-run bootstrap: github-action-benchmark does
      # `git fetch origin benchmark-data:benchmark-data` and hard-fails with
      # "couldn't find remote ref benchmark-data" when the history branch does
      # not yet exist (it does NOT auto-create it — see its docs/write.ts). Create
      # the orphan branch on origin if missing so the very first run (and any run
      # after the branch is deleted) self-heals instead of failing. Idempotent.
      - name: Ensure benchmark-data history branch exists
        # main only: PRs (esp. from forks) get a read-only GITHUB_TOKEN and must never write the
        # history branch — they only compare against it.
        # sq-mel85: push-to-main ONLY (the nightly `schedule` backstop is a pure
        # verification run — it never writes the history branch, so it needs no bootstrap).
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin benchmark-data >/dev/null 2>&1; then
            echo "benchmark-data branch already exists on origin — nothing to do."
          else
            echo "benchmark-data branch missing on origin — creating an orphan branch."
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" checkout -q --orphan benchmark-data
            git -C "$tmp" -c user.name=github-actions[bot] \
                          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                          commit -q --allow-empty -m "chore(bench): initialise benchmark-data history branch"
            git -C "$tmp" push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              benchmark-data:benchmark-data
            echo "Created and pushed orphan benchmark-data branch."
          fi
      # HARD zone — deterministic median-of-history regression gate (replaces the action's
      # single-previous-point fail-on-alert, which flapped on runner environment shifts; see the
      # fail-on-alert comment on the Store step below). scripts/bench_hardzone.py compares each
      # metric in THIS run's bench-results.json against the MEDIAN of its last up-to-5 published
      # VALUES in prev-data.js (fetched by the "Fetch previous benchmark series" step above; absent
      # history = warn + pass, first-run safe). It FAILS if a gated metric is >= 2.0x its median
      # (direction-adjusted: `*_per_s` throughput is larger-is-better), fails CLOSED on
      # NaN/non-numeric/negative/zero-boundary measurements and on >30% of gated metrics
      # disappearing, and EXEMPTS a runner-environment scaling ONLY when four conditions ALL hold
      # (>=50% of compared metrics >=1.75x AND their ratios uniform (cv<=0.15) AND nothing >=4x
      # AND every deterministic byte/count metric within 1% of median) — see the script header for
      # why those four make a masked code regression implausible, not impossible (hence the loud
      # warning + table, never a quiet pass).
      #
      # ORDERING (round-1 review): this step runs BEFORE the Store step DELIBERATELY.
      # Store auto-pushes this run's point into the benchmark-data history (main pushes), so if the
      # gate ran after it, a REJECTED regression would already be published — and after a few red
      # runs the regressed points would BECOME the median, silently re-baselining the gate. Gating
      # first means a hard-zone failure publishes NOTHING. There is no data dependency on Store:
      # both inputs (bench-results.json, prev-data.js) exist before it. CONSEQUENCE: on a hard-zone
      # failure the run publishes nothing and Store's comparison comment/summary never fires — so
      # the script prints its own per-metric table to stdout AND to GITHUB_STEP_SUMMARY; that table
      # is the only visible evidence of what tripped.
      #
      # Guarded to the SAME main-push condition as auto-push: PR runs are gated by perf-gate.py
      # above and commented by the Store step, and the nightly `schedule` run verifies only.
      # The script self-tests first (repo convention: hermetic --self-test over inline fixtures).
      #
      # --report-out (round-2 review): floor-exempt (sub-noise-floor us/milli) metrics
      # never fail this gate, and once a few regressed points are accepted the median REBASES —
      # so any floor-exempt hit at >= 2.0x is written to bench-hardzone-report.json, which the
      # "Soft-zone triage" step below merges into the rolling deduped `bench-flake` issue
      # (tagged "floor-exempt hard-band"): the durable trail that survives the rebase. The file
      # is written on pass AND fail; triage runs `if: always()` and tolerates its absence.
      #
      # CONFIRM BEFORE FAILING (sq-jxeqz) — `--remeasure-cmd`. A timing row may only red
      # main if its breach REPRODUCES in an independent re-measurement. MEASURED motivation:
      # harvesting this step's own output from 153 Benchmarks runs on main (the run logs are the
      # only UNCENSORED record, since a failing run publishes nothing) gives 29 tripped runs — 19%
      # — carrying 60 fatal rows over 19 metrics, every one bracketed by GREEN runs on the same
      # metric with no revert in between, and co-moving within a run across metrics that share a
      # workload. That is a runner slow WINDOW, and it has no exemption here: the uniform-shift
      # carve-out needs >= 50% of the suite to move together and a slow window was observed moving
      # 1-8 of 438. Widening a band was measured and REJECTED (it needs 10-12 sigma to relieve a
      # majority, which stops catching a real 2x regression on 6-7% of gated metrics);
      # confirmation costs NO sensitivity instead, because a real regression is a property of the
      # built artifact and re-measures at the same ratio.
      #
      # The command re-runs the SAME full suite as the "Run benchmarks" step — deliberately the
      # identical invocation, so the confirmation measures what the gate measures — but writes to
      # a DIFFERENT path: bench-results.json is the artifact the Store step publishes and must
      # never be overwritten by a confirmation run (the trend must keep recording what was
      # actually measured, not a re-measured best). It is ONLY executed on a run that is already
      # about to FAIL on non-deterministic rows, so the steady-state cost is zero; a deterministic
      # byte-count breach is never re-measured and still fails on the first read. Mirrors the
      # perf-gate `--remeasure-cmd` wiring above (sq-dzfu).
      - name: Hard zone — median-of-history regression gate (main pushes only)
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 scripts/bench_hardzone.py --self-test
          python3 scripts/bench_hardzone.py \
            --results bench-results.json \
            --prev-data prev-data.js \
            --suite 'sparq engine' \
            --report-out bench-hardzone-report.json \
            --remeasure-cmd 'bash scripts/ci-bench.sh 200000 bench-results-remeasure.json' \
            --remeasure-out bench-results-remeasure.json \
            --remeasure-k 1
      # sq-owci — clean the working tree before github-action-benchmark switches branches.
      # ROOT CAUSE: the "Run benchmarks" step (scripts/ci-bench.sh) does `cd bench/zk && cargo bench`
      # and `cd bench/zk-trace && cargo bench` (two STANDALONE cargo projects, run WITHOUT --locked),
      # so Cargo re-resolves and REWRITES their committed bench/zk{,-trace}/Cargo.lock. That leaves the
      # working tree dirty. The Store step below then does `git fetch ... benchmark-data:benchmark-data`
      # + `git switch benchmark-data` internally, which ABORTS: "Your local changes to the following
      # files would be overwritten by checkout: bench/zk-trace/Cargo.lock, bench/zk/Cargo.lock ...
      # Aborting" (live: Benchmarks run 27867742598). That failed the whole Benchmarks job and masked
      # real CI signal.
      #
      # UNCONDITIONAL: github-action-benchmark fetches + switches to the benchmark-data branch to
      # READ the comparison history on EVERY event, regardless of auto-push, so the lockfile churn
      # would abort a schedule or PR run too. Restoring tracked churn is safe on every event:
      # bench-results.json is already written and the run outputs the later steps read
      # (bench-results.json, prev-data.js) are untracked and left intact.
      #
      # FIX MECHANICS (round-1 review): ALLOW-LIST restore, not `git checkout -- .`.
      # The ONLY tracked churn this bench run is known to induce is the bench/**/Cargo.lock
      # re-resolve (bench/zk + bench/zk-trace today; the glob future-proofs any standalone bench
      # project a future suite adds). Exactly those paths are restored; if ANY OTHER tracked path
      # is dirty, that is unknown churn — something wrote to the checkout that nothing should
      # write to — so the step prints the paths and FAILS loudly instead of silently discarding
      # evidence. Untracked run outputs (bench-results.json, prev-data.js) are never touched.
      - name: Clean bench-induced tracked churn before history switch
        run: |
          set -euo pipefail
          dirty="$(git diff --name-only)"
          if [ -z "$dirty" ]; then
            echo "Working tree clean — no tracked churn to restore."
          else
            unknown=0
            while IFS= read -r f; do
              case "$f" in
                bench/*/Cargo.lock)
                  echo "Restoring known bench-induced churn: $f"
                  git checkout -- "$f"
                  ;;
                *)
                  echo "::error title=unknown tracked churn::'$f' is modified but is NOT known bench-induced churn (bench/**/Cargo.lock) — refusing to discard it."
                  unknown=1
                  ;;
              esac
            done <<< "$dirty"
            if [ "$unknown" = "1" ]; then
              echo "::error::Unknown tracked modifications after the bench run (listed above). Unknown churn means something unexpected wrote to tracked paths — investigate; this step never silently discards it."
              git status --porcelain
              exit 1
            fi
          fi
          git status --porcelain
      - name: Store + compare against history
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: sparq engine
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # auto-push ONLY on main: pushes the new point to the benchmark-data history
          # branch (which feeds the public Pages chart). On a PR this is false, so the run COMPUTES
          # + COMPARES against the published series and COMMENTS, but does NOT write benchmark-data —
          # contributors get pre-merge feedback with zero pollution of the public trend.
          # sq-mel85: ALSO false on the nightly `schedule` backstop — a scheduled run
          # shares the last main commit's SHA, so pushing would append a DUPLICATE per-commit point
          # and pollute the "one entry per commit" trend. The backstop verifies the gate only; the
          # history + ratchet stay on the push-to-main path (design §6.1 continuity).
          auto-push: ${{ github.event_name != 'schedule' && github.ref == 'refs/heads/main' }}
          # The history branch doubles as the Pages source: the action writes index.html + data.js
          # under dev/bench here, so once the owner points Settings → Pages at branch benchmark-data
          # /(root) the dashboard renders at https://sparq.jeswr.org/dev/bench (see header).
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          # sq-3g6q: CAP the retained history. github-action-benchmark accumulates EVERY
          # commit's point with NO bound by default, so dev/bench/data.js grew unbounded (was 4.4 MB /
          # ~160k lines → slow dashboard load). max-items-in-chart slices entries["sparq engine"] to the
          # most-recent N COMMITS (one entry per commit; each entry carries ALL metrics, so N commits =
          # N points per metric for the trend charts). N is deliberately modest because each entry is
          # heavy: the suite now reports ~270 metrics/commit (~28 KB serialized), so the COMMIT COUNT —
          # not a notional total-point count — is what drives file size. N=20 keeps a 20-commit trend
          # window for every metric while holding data.js well under 1 MB (~0.74 MB). The dashboard
          # (bench/dashboard/dashboard.js) renders the latest values + trend sparklines from exactly
          # this bounded window. Matches the one-time prune of the existing benchmark-data history.
          max-items-in-chart: 20
          # Comment + job-summary on EVERY run (incl. `bench`-labelled PRs) so the comparison table
          # is always visible, not only when an alert fires.
          comment-always: true
          summary-always: true
          # TWO-ZONE self-monitoring thresholds (noise-reduction-bench-selfmonitor;
          # maintainer-directed). GitHub-hosted runners are noisy, so a single global switch would
          # either trip constantly on µs-scale wall-clock jitter or be so loose it catches nothing.
          #   * alert-threshold: '175%'  — SOFT zone. Emits an alert COMMENT but does NOT fail the
          #     step (comment-only for the soft band; the "Soft-zone triage" step below files/updates a
          #     deduped `bench-flake` issue for it — NO @mention of anyone). 175% ≈ p95 run-to-run
          #     timing swing (43.66%) + ~30pp headroom.
          # fail-on-alert is now FALSE — the HARD zone moved to the deterministic
          # median-of-history gate ABOVE (scripts/bench_hardzone.py, which runs BEFORE this Store
          # step so a rejected regression is never auto-pushed into the history it is judged by).
          # The action's fail-on-alert compared each metric against the SINGLE previous
          # benchmark-data point, so one slow-runner environment shift flipped 9+ unrelated
          # µs-scale metrics uniformly ~1.8-2.1x "worse" and hard-failed main pushes while
          # interleaved pushes stayed green (live flap over 24h: red at runs like 29988505852
          # between green runs, 2026-07-22/23) — the two-zone calibration's own worst-observed
          # noise swing (185.0%, below) was exceeded by pure runner variance. The bench_hardzone.py
          # step keeps a HARD gate on main pushes, but against the MEDIAN of each metric's last
          # up-to-5 published values (a single-point environment shift cannot move a median-of-5),
          # with a four-condition uniform-shift exemption (breadth + ratio uniformity + a 4x cap +
          # deterministic metrics unmoved — conditions that make a MASKED code regression
          # implausible, not impossible, so the exemption always warns loudly with a full table).
          # DERIVATION (no hard-coded perf numbers in markdown — the numbers live here + are recomputable):
          #   scripts/bench-thresholds.py recomputes the soft threshold from the benchmark-data
          #   history; over 20 commits × 322 timing metrics (6137 adjacent-pair samples) the pooled
          #   p95 run-to-run swing was 43.66% and the worst 185.0%; deterministic byte-count metrics
          #   are 0.00% noise. Re-run that script and refresh if the noise floor shifts.
          # The DETERMINISTIC byte-count ratchet remains the strict, separate "Hard gate" step ABOVE
          # (scripts/perf-gate.py) — the zones here govern only the NOISY timing metrics.
          # NO alert-comment-cc-users: the maintainer is never @-mentioned; soft-zone flakiness routes
          # to a deduped issue and hard-zone regressions fail the median gate for an agent to fix.
          alert-threshold: '175%'
          comment-on-alert: true
          fail-on-alert: false
      # SOFT-ZONE triage (noise-reduction-bench-selfmonitor). Runs AFTER the action —
      # `if: always()` so it still fires when the hard-zone gate above FAILED; it re-derives
      # the two zones from the SAME thresholds and files/updates a deduped `bench-flake` GitHub issue
      # for any SOFT-zone metric (>=175% and <200%), with NO @mention of anyone. It NEVER weakens the
      # hard gate: the median-of-history gate above (scripts/bench_hardzone.py) owns the
      # hard-zone failure; this step
      # only handles the soft (possible-flakiness) band and always exits 0 (its filing is best-effort).
      # --hardzone-report: additionally merges the median gate's floor-exempt hard-band
      # rows (bench-hardzone-report.json, written by the gate's --report-out on main pushes;
      # absent on PR/schedule = no-op) into the same deduped issue, tagged "floor-exempt
      # hard-band" — the gate never reds on those watch-only rows and their median rebases, so
      # this issue trail is their only durable record.
      # Canonical repo only — fork PRs get a read-only token, so no issue can be filed there.
      - name: Soft-zone triage (file a deduped bench-flake issue; no @mentions)
        if: always() && github.repository == 'sparq-org/sparq'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f bench-results.json ]; then
            echo "no bench-results.json (bench did not run to completion) — nothing to triage."
            exit 0
          fi
          # Build the normalized comparison from THIS run's results + the previously-published point
          # (prev-data.js fetched by the "Fetch previous benchmark series" step; absent on first run).
          python3 scripts/bench-triage.py --mode build-comparison \
            --results bench-results.json \
            --prev-data-js prev-data.js \
            --suite 'sparq engine' \
            --out bench-comparison.json || { echo "::warning::comparison build failed (non-fatal)"; exit 0; }
          # Thresholds MUST match the github-action-benchmark step above (derived by
          # scripts/bench-thresholds.py from the benchmark-data history).
          python3 scripts/bench-triage.py --mode soft \
            --comparison bench-comparison.json \
            --hardzone-report bench-hardzone-report.json \
            --soft 175 --hard 200 \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::soft-zone triage filer failed (non-fatal)"
      # Seed the custom Pages dashboard onto benchmark-data IF ABSENT (or stale).
      # github-action-benchmark only writes its DEFAULT index.html when one does NOT already exist
      # (fs.stat early-return) but OVERWRITES data.js every run — so a CUSTOM dashboard committed
      # once is preserved forever while the data refreshes. This step pulls the freshly-pushed
      # benchmark-data branch and copies bench/dashboard/{index.html,dashboard.js,dashboard.css}
      # into dev/bench/ when dev/bench/dashboard.js is missing OR differs, then commits + pushes.
      # Idempotent + MAIN ONLY (PRs/forks get a read-only token and never write the history branch),
      # mirroring the "Ensure benchmark-data history branch exists" bootstrap above.
      - name: Seed Pages dashboard onto benchmark-data (if absent)
        # Preserve main push/manual publishing; schedules verify only.
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Retry only a verified concurrent fast-forward. Rebuild
          # the asset-only commit on the fetched tip; never rebase/force-push data.js.
          export LC_ALL=C
          src="$GITHUB_WORKSPACE/bench/dashboard"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tmp" fetch -q --depth=1 origin benchmark-data
          tip="$(git -C "$tmp" rev-parse FETCH_HEAD)"
          for attempt in 1 2 3; do
            git -C "$tmp" checkout -q -B benchmark-data "$tip"
            mkdir -p "$tmp/dev/bench"
            changed=0
            # metric-labels.json (sq-ocuf) is part of the served dashboard — copy it
            # alongside index.html/dashboard.js/dashboard.css so dashboard.js can fetch it.
            # vendor/Chart.min.js (sq-0rv3) is loaded by index.html now that the
            # CDN dep is dropped — seed it (in its subdir) so the published Pages dashboard
            # doesn't 404. The path has a dirname, so mkdir -p before copying.
            # competitors.json (sq-kehk) is FETCHED by dashboard.js boot() (sq-rltn / #200)
            # as the single competitor-data sink — copy it alongside metric-labels.json so the live
            # fetch resolves instead of 404ing into the empty embedded COMPETITORS_DATA mirror.
            for f in index.html dashboard.js dashboard.css metric-labels.json competitors.json vendor/Chart.min.js; do
              if [ ! -f "$tmp/dev/bench/$f" ] || ! cmp -s "$src/$f" "$tmp/dev/bench/$f"; then
                mkdir -p "$(dirname "$tmp/dev/bench/$f")"
                cp "$src/$f" "$tmp/dev/bench/$f"
                changed=1
              fi
            done
            # root redirect (sq-pages-root): the bare Pages root would 404 because the
            # dashboard lives under dev/bench/. Seed bench/dashboard/root-redirect.html to the
            # benchmark-data branch ROOT as index.html so https://sparq.jeswr.org/ bounces to
            # dev/bench/. github-action-benchmark only writes data.js + dev/bench/index.html (never a
            # root index.html), so this coexists with its data and is preserved across runs.
            if [ ! -f "$tmp/index.html" ] || ! cmp -s "$src/root-redirect.html" "$tmp/index.html"; then
              cp "$src/root-redirect.html" "$tmp/index.html"
              changed=1
            fi
            if [ "$changed" = "0" ]; then
              echo "dev/bench dashboard already up to date — nothing to seed."
              exit 0
            fi
            git -C "$tmp" -c user.name='github-actions[bot]' \
                          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                          add index.html dev/bench/index.html dev/bench/dashboard.js dev/bench/dashboard.css \
                              dev/bench/metric-labels.json dev/bench/competitors.json dev/bench/vendor/Chart.min.js
            git -C "$tmp" -c user.name='github-actions[bot]' \
                          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                          commit -q -m "chore(bench): seed/update Pages dashboard (dev/bench + root redirect) [skip ci]"
            if git -C "$tmp" push --porcelain origin benchmark-data:benchmark-data \
                >"$tmp/.git/push.stdout" 2>"$tmp/.git/push.stderr"; then
              echo "Seeded/updated the custom Pages dashboard on benchmark-data."
              exit 0
            else
              push_rc=$?
            fi
            cat "$tmp/.git/push.stdout"
            cat "$tmp/.git/push.stderr" >&2
            # Porcelain's exact ref/status record excludes hook/auth/transport
            # failures. A changed tip alone never makes an arbitrary error retryable.
            push_status="$(grep $'\t' "$tmp/.git/push.stdout" || true)"
            case "$push_status" in
              $'!\trefs/heads/benchmark-data:refs/heads/benchmark-data\t[rejected] (fetch first)'|\
              $'!\trefs/heads/benchmark-data:refs/heads/benchmark-data\t[rejected] (non-fast-forward)') ;;
              *)
                echo "::error::Dashboard push failed without a single retryable non-fast-forward rejection."
                exit "$push_rc" ;;
            esac
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dashboard publication exhausted its bounded push attempts."
              exit "$push_rc"
            fi
            # Do not repeat --depth=1: retain the fetched ancestry back to tip so
            # the old snapshot must be an ancestor, not merely a different object.
            git -C "$tmp" fetch -q origin benchmark-data
            next_tip="$(git -C "$tmp" rev-parse FETCH_HEAD)"
            if [ "$next_tip" = "$tip" ] || ! git -C "$tmp" merge-base --is-ancestor "$tip" "$next_tip"; then
              echo "::error::Dashboard rejection was not followed by a verified branch advance."
              exit "$push_rc"
            fi
            tip="$next_tip"
            echo "::notice::Concurrent benchmark-data advance verified; rebuilding the dashboard commit."
          done
