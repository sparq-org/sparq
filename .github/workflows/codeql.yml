# CodeQL SAST — static security/quality analysis for the Rust workspace.
# Resolves the OpenSSF Scorecard `SAST` alert and is the security-quality SAST gate
# (the `analyze` job feeds the ci-summary aggregator; CodeQL findings also land in the
# code-scanning dashboard and the Copilot/CodeQL PR review). [OPUS-4.8]
#
# Rust CodeQL is GA, so we analyse the `rust` language. We use CodeQL's buildless
# extraction (`build-mode: none`): the Rust extractor reads the Cargo workspace +
# sources directly, so no `cargo build` step is needed and the analysis is not gated on
# the whole workspace compiling under instrumentation (which would duplicate ci.yml's
# build job and be slow). If a future CodeQL release needs a trace-based build for a
# query pack we rely on, switch this matrix entry to `build-mode: manual` + a
# `cargo build --workspace` step (see the CodeQL Rust docs).
#
# [FABLE-5] sq-6vshe.6 heavy-lane placement — CodeQL PLACEMENT DECISION (measured):
# KEEP per-push (per-PR) analysis; do NOT demote to merge_group + nightly.
# The bead's decision rule is CONDITIONAL: demote CodeQL to the merge queue + nightly
# ONLY IF it is a post-piapk wall-time POLE. It is NOT. MEASURED per-PR / merge_group
# wall time over 20+ recent runs is ~3.8–4.8 min (this workflow uses `build-mode: none`
# BUILDLESS extraction — the Rust extractor reads the workspace directly with no
# instrumented `cargo build`), comparable to the bench lane (~4 min) and FASTER than the
# fuzz lane (~6–8.5 min per-PR before its sq-6vshe.6 replay demotion). So per-push CodeQL
# is not on the critical path and demoting it would trade the earlier per-PR security
# signal (Copilot/CodeQL PR review + alerts-at-zero pre-merge) for essentially no wall-
# clock win — a net LOSS of security posture. The historical "CodeQL-rust ~20–40 min pole"
# concern predates the buildless migration (a trace-based `build-mode: manual` full-compile
# analysis); this config already fixed that. If a future query pack forces a return to
# trace-based build (see the `build-mode: manual` note below) and wall time regresses past
# the pole threshold, revisit the demotion — merge_group CodeQL still gates every merge, so
# alerts-at-zero would be preserved even then. This is the maintainer security-posture
# sign-off item (design §10.2); proceeding on the MEASURED "keep it" default per the
# proceed-and-document rule (steer issue filed).
#
# Third-party actions pinned by full commit SHA (supply-chain hardening); the trailing
# `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
name: codeql

on:
  push:
    branches: [main]
  # [FABLE-5] Draft-tier CI: default types + ready_for_review, so the un-draft
  # moment runs the analysis the draft head skipped (the `analyze` job below is
  # guarded off draft PR heads) BEFORE the PR can reach the merge queue.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # [OPUS-4.8] Merge queue: CodeQL surfaces a check on PRs, so it must also run on the
  # queue's merge_group ref or the required ci-summary would wait for a sibling that
  # never appears on that ref and time out. (Bare `merge_group` — it fires on every
  # enqueue against the base branch.)
  merge_group:
  # Weekly cadence so the latest CodeQL query packs are re-run against an otherwise
  # quiet default branch (catches newly-published queries on unchanged code).
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC (off-peak, odd minute)

# Top-level read-only; the analysis job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [OPUS-4.8] path-aware CI (maintainer ask): "CodeQL doesn't even need to run if
  # no Rust files are changed." CodeQL analyses the RUST workspace, so a PR whose
  # diff touches NO Rust (orchestration/workflow/docs-only — e.g. routing.toml +
  # triage.py) has nothing for CodeQL to analyse. This cheap pre-job computes
  # whether the diff touches Rust and the `analyze` job below `if:`s on it, exactly
  # mirroring ci.yml's `changes` (dorny paths-filter) mechanism.
  #
  # SOUNDNESS (identical to the draft-tier skip already in effect):
  #   * The single REQUIRED context is `ci-summary / gate`; `CodeQL analysis (rust)`
  #     is NOT individually required (docs/branch-protection.md §Required status
  #     checks). When it is `skipped`, ci-summary treats a `skipped` conclusion as
  #     NON-failing, so the gate resolves fast — the SAME behaviour as the existing
  #     draft-head skip of this very job.
  #   * The ruleset's `code_scanning` rule (CodeQL) is recorded as DEFENSE-IN-DEPTH
  #     ONLY (docs/branch-protection.md §Draft-tier CI, last paragraph): a draft head
  #     already carries no PR CodeQL analysis and the rule tolerates that absence.
  #     A non-Rust PR is the same posture — there is genuinely no Rust to analyse.
  #   * SAFE-BY-DEFAULT: rust_changed is forced 'true' on every event except a
  #     `pull_request` and a `merge_group` (push-to-main + the weekly schedule always
  #     run CodeQL in full), and the Rust path set is broad: any *.rs / **/Cargo.toml /
  #     Cargo.lock / rust-toolchain* / any build.rs (covered by *.rs? build.rs IS a .rs
  #     file) / the codeql wiring itself. If the diff cannot be computed, we never
  #     silently skip: off the PR/merge_group path we hard-force 'true'.
  #
  # [OPUS-5] sq-g25hr — MERGE-GROUP CHANGE-CLASS GATE (the path-filtered fast lane).
  # merge_group used to hard-force rust_changed=true here, so a queued batch with ZERO
  # Rust still paid the full CodeQL analysis on every enqueue — reported in the
  # sq-g25hr bead as the longest merge_group pole of the observed cloud-deploy drain
  # (7 deploy PRs whose diffs were manifests + prose only). ci.yml and
  # feature-matrix.yml already class-gate their merge_group batches; this job now does
  # the same, with the IDENTICAL mechanism (the batch's base_sha..head_sha diff
  # classified by `scripts/ci_select.py --classify-only`, the single source of truth —
  # no path list is re-encoded here).
  #
  # HONESTY NOTE: this workflow is currently OPERATIONALLY DISABLED
  # (`disabled_manually`, docs/branch-protection.md) — GitHub schedules no run on any
  # trigger, so this gate buys nothing today. It is the correct merge_group posture
  # for whenever CodeQL is re-enabled, and it costs nothing while disabled.
  #
  # WHY THE MERGE-GROUP SKIP IS SOUND (beyond the three bullets above, which already
  # cover the PR tier):
  #   * The class is computed from the AUTHORITATIVE queued diff, not from a label,
  #     a title or a PR body — there is no input a PR author controls that can make a
  #     Rust change classify inert. Every path outside the audited inert allowlists
  #     (incl. every crates/** path and everything the dorny `rust` filter above
  #     matches) classifies `engine`/`mixed` => the wildcard arm => full analysis.
  #   * CodeQL analyses the Rust workspace; an inert batch changes no Rust, so the
  #     analysis result is a pure function of inputs that did not move.
  #   * push-to-main still analyses every merged commit in full, so the default
  #     branch's code-scanning database never goes stale even if a batch skipped.
  #   * FAIL-SAFE at every step: the branch defaults rust=true, an unresolvable SHA
  #     pair or ANY classifier error falls back to `engine` => full analysis. Cost,
  #     never soundness.
  changes:
    name: detect rust changes (codeql)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_changed: ${{ steps.decide.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
      - name: Decide rust_changed (safe-by-default off the PR path)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "rust_changed=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "pull_request -> paths-filter says rust=${{ steps.filter.outputs.rust }}"
          elif [ "${EVENT_NAME}" = "merge_group" ]; then
            # [OPUS-5] sq-g25hr MERGE-GROUP CHANGE-CLASS GATE (see the job header note).
            rust=true
            ok=true
            # --depth=2147483647 (git's INFINITE_DEPTH; --unshallow that is also valid
            # on a complete repo): this checkout is depth-1, and the classifier's
            # three-dot diff needs the merge-base — a shallow SHA fetch leaves both
            # commits PRESENT (the cat-file guards pass) but unconnected, so the diff
            # dies and the fail-safe would force class=engine on EVERY batch, reducing
            # this gate to a no-op. Same rationale as ci.yml's decide step.
            git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" "${MG_HEAD_SHA}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" 2>/dev/null \
              || ok=false
            git cat-file -e "${MG_BASE_SHA}^{commit}" 2>/dev/null || ok=false
            git cat-file -e "${MG_HEAD_SHA}^{commit}" 2>/dev/null || ok=false
            if [ "${ok}" = "true" ]; then
              cls="$(python3 scripts/ci_select.py --classify-only --event merge_group \
                       --base "${MG_BASE_SHA}" --head "${MG_HEAD_SHA}")" || cls=engine
              # Lists ci_select.py `_INERT_CLASSES` verbatim (pinned by
              # scripts/tests/test_ci_select_wiring.py so the two cannot drift).
              # [OPUS-5] #5249: `map-safe` = every path resolves to an ownership-map
              # `safe = true` verdict (today site/** + ci/formal-verification.toml).
              case "${cls}" in
                docs-only|orchestration-only|deploy-only|map-safe|inert-mixed) rust=false ;;
                *) rust=true ;;
              esac
            else
              echo "::warning::could not resolve merge_group base/head SHAs for the batch diff — running the full CodeQL analysis (fail-safe)."
            fi
            echo "rust_changed=${rust}" >> "$GITHUB_OUTPUT"
            echo "merge_group -> change_class=${cls:-<unresolved>} rust_changed=${rust}"
          else
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME} -> forcing rust_changed=true (full CodeQL)"
          fi

  analyze:
    name: CodeQL analysis (rust)
    needs: changes
    # [FABLE-5] Draft-tier CI: SKIPPED on draft PR heads (this analysis is one of
    # the slowest per-push lanes and the fleet's draft review-fix churn re-ran it
    # on every push). VERIFIED before changing: CodeQL is NOT schedule/main-only —
    # it runs per-PR — but the pre-merge guarantee is preserved because the
    # ready_for_review full-tier run analyses the same head SHA (types above) and
    # the merge_group + push-to-main + weekly-schedule runs are untouched; the
    # branch-protection `code_scanning` alert rule therefore still sees a CodeQL
    # analysis of the head before any merge. Fail-open off the PR path: any
    # non-pull_request event satisfies the first disjunct => RUN.
    # [OPUS-4.8] path-aware CI: ALSO skipped when the diff touches no Rust
    # (needs.changes.outputs.rust_changed == 'false') — nothing for CodeQL to
    # analyse. [OPUS-5] sq-g25hr: that now covers a merge_group batch whose
    # change-class is proven inert as well as a non-Rust PR; rust_changed is still
    # forced 'true' on push-to-main + the weekly schedule, so the default branch is
    # always analysed in full (see the `changes` job header for the soundness case).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Read the workspace.
      contents: read
      # Needed by CodeQL on private repos / for some workflow events.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Initialise the CodeQL tooling + database for the matrix language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality runs the security queries plus the maintainability/
          # reliability quality queries — the SAST gate Scorecard's `SAST` check wants.
          queries: security-and-quality
          # [OPUS-4.8] Config file adds a query-filter that excludes exactly one
          # redundant, note-level quality query: `rust/unused-variable`. It is NOT a
          # security query (security coverage is unchanged) and is redundant with the
          # repo's real unused-variable gate — clippy `-D warnings` in ci.yml, which
          # understands `format!` captures. CodeQL's Rust analyzer false-positives on
          # variables used only inside `format!(...)` macro args (confirmed: positional
          # args in PR #311 did not stop the flags). Removes FP alerts #150/#151/#170.
          config-file: ./.github/codeql/codeql-config.yml

      # Buildless extraction (build-mode: none) above means no explicit build step is
      # required for Rust. If a build mode that traces compilation is adopted later,
      # add the `cargo build --workspace` here.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
