# Post-publication verification of the isolated-trusted-builder provenance (issue #4571).
#
# [OPUS-5] GX-11 residual / SL-B3-b. `release.yml#provenance` and `release.yml#provenance-artifacts`
# route the released artifacts' provenance through `slsa-github-generator`'s trusted reusable
# builder, and `scripts/tests/test_release_slsa_l3_provenance.py` pins that WIRING on every PR.
# Wiring is not evidence: release.yml is tag/dispatch-triggered, so until a release is actually
# cut nothing has executed, and compliance/slsa/controls.md records SL-B3-b as **AR** for exactly
# that reason. This workflow is the missing evidence step — it re-verifies the PUBLISHED release
# the way a consumer would, so the first `v*` tag produces a machine-checked result instead of the
# flip to **IV** depending on someone remembering to run three commands by hand.
#
# WHY POST-PUBLICATION AND NOT A GATE ON THE RELEASE. Two of the three checks (bundle attached to
# the Release, bundle listed in `SHA256SUMS`) are only observable once the Release exists, so this
# cannot block publication — release.yml already blocks it in the other direction (`release`
# `needs: [provenance, provenance-artifacts]`, so no Release is cut if the trusted builders fail).
# What this adds is the consumer-side half: the bundles verify against the bytes that shipped.
# A red run here means a PUBLISHED release does not carry the provenance the compliance estate
# claims for it — treat it as a supply-chain incident, fix forward, and do NOT relax the checks.
#
# HOW THIS ACTUALLY GETS RUN — read before changing the triggers. GitHub deliberately does NOT
# start a workflow run from an event generated by a workflow's own `GITHUB_TOKEN` (only
# `workflow_dispatch`/`repository_dispatch` are exempt), and `release.yml`'s `release` job creates
# the Release with exactly that token (`softprops/action-gh-release` defaults
# `token: ${{ github.token }}`). So the `release: published` trigger below CANNOT fire for a
# release cut by release.yml — the normal `v*` path. The automatic path is therefore the
# `workflow_call` entry point: `release.yml#verify-provenance` invokes this workflow from a job
# that `needs: release`, i.e. once the Release and its assets are observable. That is what makes a
# normal release self-verifying; the `release:` trigger is only the out-of-band safety net below.
# `scripts/tests/test_verify_release_provenance.sh` pins BOTH halves of that wiring, so deleting
# the caller (or reverting to trigger-only) reds on every PR.
#
# GATE INTERACTION: NONE. There is no `pull_request` / `merge_group` trigger, so this workflow
# never registers a check-run on a PR and the required `ci-summary / gate` aggregator never sees
# it. It therefore needs no `.github/advisory-registry.json` entry (that registry governs
# PR-visible check names only).
#
# SCOPE NOTE: a Release published by hand (not by release.yml) carries no isolated-builder bundle
# and will red here. That is the correct, honest signal — not a false positive.
name: release-provenance-verify

on:
  # PRIMARY, AUTOMATIC path — see the trigger note above. `release.yml#verify-provenance` calls
  # this after its `release` job, passing the tag that job resolved.
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify — release.yml passes its `setup` job's resolved version.
        required: true
        type: string
  # OUT-OF-BAND safety net only. A Release published by a human (or by a PAT/App token) is not
  # GITHUB_TOKEN-generated, so it CAN start a run — this catches a release cut outside
  # release.yml. It never double-runs alongside the caller above, because a release.yml Release
  # emits no run-starting event at all.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to verify (e.g. v0.1.1). Use this to re-verify an already-published
          release — the checks are read-only and idempotent.
        required: true
        type: string

# Read-only throughout: this workflow verifies, it never publishes or mutates a release.
permissions:
  contents: read

jobs:
  verify:
    name: verify isolated-builder provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read # `gh release download` — the only API this job touches
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # slsa-verifier is the reference consumer-side verifier; installing it from source at a
      # PINNED module version means the Go module checksum database (sum.golang.org) attests the
      # bytes we run. Bump this version deliberately. The ubuntu runner image ships a Go
      # toolchain, so no setup-go step is needed (and none is wanted — one less action in the
      # trust path); the guard below turns a future image change into a clear message rather
      # than a bare "go: command not found".
      # NOTE the module path: the command lives at `cli/slsa-verifier`, NOT `cmd/slsa-verifier`
      # (verified against proxy.golang.org for v2.7.1). The `cmd/` spelling installs nothing.
      - name: Install slsa-verifier (pinned)
        env:
          SLSA_VERIFIER_VERSION: v2.7.1
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 ||
            { echo "::error::no Go toolchain on the runner image — install one before slsa-verifier"; exit 1; }
          go install "github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@${SLSA_VERIFIER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The whole verification is in scripts/verify-release-provenance.sh so a maintainer can run
      # the IDENTICAL checks locally against any tag (docs/release.md §7) — CI and the runbook
      # cannot drift into two different definitions of "verified".
      - name: Verify published provenance (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
          # `github.event.release.tag_name` on the publish path; the dispatch input when
          # re-verifying an existing release by hand.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # `pipefail` is load-bearing: without it `| tee` would swallow a failed verification
          # and this step would go green on a release that carries no valid provenance.
          set -euo pipefail
          bash scripts/verify-release-provenance.sh \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1 | tee provenance-verification.log
      # The log IS the SL-B3-b evidence record — its run URL is what compliance/slsa/evidence.md
      # cites when the control flips from AR to IV. Uploaded even on failure, because a failed
      # verification is the more important record of the two.
      - name: Upload verification log (evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-verification-${{ inputs.tag || github.event.release.tag_name }}
          path: provenance-verification.log
          if-no-files-found: warn
