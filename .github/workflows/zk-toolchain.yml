# zk-toolchain — toolchain-gated lane for the ZK forge/anchor suite (sq-f9tl, re-audit NEW-1).
#
# WHY: the repo's STRONGEST correctness claim is ZK *verifier soundness* — the
# forge-and-verify negative suite (forge_pubinput_* in forge_gates.rs, the real
# bb prove/verify e2e cases) that proves a forged proof/manifest is REJECTED. Those
# tests need a real `nargo execute` + `bb prove`/`verify`, so they are `#[ignore]`d
# and DO NOT run in the default `cargo test` lane (ci.yml). That left the soundness
# claim with NO standing CI coverage: a regression in the hand-serialized public-input
# reconstruction (`verifier.rs::reconstruct_public_inputs`) — a field-order / endianness
# / arity slip — could re-open the whole estate without a single red check. This lane
# installs the PINNED Noir toolchain and runs those `#[ignore]`d tests, so a forge that
# verifies (or a serialization drift that breaks an empirical bb anchor) fails visibly.
#
# sq-5reoy (#1599): the zk/ieee754 and zk/xpath in-tree Noir trees were
# externalized to the sparq-org/noir_IEEE754 (v0.10.0) and sparq-org/noir_XPath (v0.2.0)
# face repos, which now own their own CI (nargo unit tests + the ieee754 differential
# oracle). The two jobs that ran those suites here (`nargo-unit-tests`, `differential-ieee754`)
# were RETIRED with the trees — the face-repo CI is the single source now. This lane keeps
# ONLY the sparq-specific `forge-suite` (the verifier-soundness estate over crates/sparq-zk*,
# which compiles zk/compose — and now transitively fetches the released sparq_ieee754 git dep).
#
# sq-3x7dl.14.2: the PROOF-M1 xpath differential oracle lives in its OWN
# workflow, `.github/workflows/xpath-differential.yml`, NOT here. Do not re-add an xpath job
# to this file: this lane's paths filter drives the ~60-minute `forge-suite`, so adding
# `zk/xpath/**` would run the whole forge suite on a PR that only touched that harness.
#
# TRIGGER (deliberately OFF the fast per-PR critical path — the toolchain install +
# real proving is slow):
#   • schedule (nightly 04:23 UTC)  — the standing safety net.
#   • workflow_dispatch             — on demand.
#   • pull_request / push to main RESTRICTED by a path filter to ZK-touching paths
#     (crates/sparq-zk*/**, zk/compose/**, this workflow) — so a ZK change DOES get the forge
#     suite run, while a non-ZK PR never triggers this workflow at all (it stays a nightly
#     safety net, not a per-PR tax).
#
# TOOLCHAIN PINNING (supply-chain): the Noir/Barretenberg toolchain is version-managed
# by `noirup` / `bbup` (there is no published GitHub Action for it). The bootstrappers
# themselves are fetched from a pinned source — the `noirup` binary from a TAGGED release
# and the `bbup` script from a SHA-PINNED ref — NOT via the upstream `install` helpers,
# which re-fetch the actual tool from a floating "latest"/`next` (see the env: block for
# why that silently defeats a pin). The tool versions are then pinned to the exact versions
# this repo's circuits were authored + anchored against (NARGO_VERSION / BB_VERSION below)
# — matching the box that captured the empirical bb anchors in verifier.rs. A toolchain
# bump is therefore an explicit edit here (and re-captures the anchors), never a silent
# floating "latest".
#
# sq-5reoy toolchain-drift note: sparq's pins (NARGO/BB below) and the two face
# repos' pins (nargo 1.0.0-beta.21) agree today but are now maintained independently — a face
# bump that sparq does not follow (or vice versa) recompiles the released circuits differently.
# When bumping NARGO_VERSION here, check the released sparq_ieee754 tag was cut on a compatible
# nargo, and re-run the forge suite (which now compiles the git dep).
name: zk-toolchain

on:
  schedule:
    # Nightly safety net at 04:23 UTC (offset from ci.yml's 03:17 coverage tier so
    # the two heavy nightly lanes don't contend for the same runner window).
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    # + ready_for_review so the un-draft moment re-runs this lane.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/sparq-zk/**"
      - "crates/sparq-zk-compose/**"
      # sq-5reoy: narrowed from zk/** to zk/compose/** — the zk/ieee754 and
      # zk/xpath trees were externalized to the sparq-org/noir_IEEE754 and
      # sparq-org/noir_XPath face repos (#1599), whose own CI covers their nargo tests
      # and the ieee754 differential oracle. zk/compose is the only in-tree Noir tree that
      # PROVES anything; zk/dual-leaf-v2 (the DualLeafV2 sentinel/constants mirror, no deps,
      # imported by no member) is the one other in-tree Noir package and runs its nargo tests
      # in this lane too.
      - "zk/compose/**"
      - "zk/dual-leaf-v2/**"
      - "bench/zk-compose/campaigns/**"
      - "bench/zk-bindings/**"
      - "crates/sparq-conformance/examples/proof_corpus.rs"
      - "zk/sparql-evaluator/model/**"
      - ".github/workflows/zk-toolchain.yml"
  # (2026-07-18 maintainer directive, merge-queue subset) merge_group
  # REMOVED: the forge suite already ran + gated on any zk-touching PR (paths filter
  # above), re-runs on zk-touching push-to-main below (post-merge detection), and
  # the daily schedule is the standing backstop. The sq-9jnj
  # `detect zk changes` step in `forge-suite` stays — it short-circuits to zk=true
  # on every remaining event, so paths-filtered behaviour is unchanged and the
  # merge_group branch is dead code kept for a cheap revert.
  push:
    branches: [main]
    paths:
      - "crates/sparq-zk/**"
      - "crates/sparq-zk-compose/**"
      # sq-5reoy: narrowed from zk/** to zk/compose/** (see the pull_request
      # paths note above — the ieee754/xpath trees moved to their face repos, #1599).
      - "zk/compose/**"
      - "zk/dual-leaf-v2/**"
      - "bench/zk-compose/campaigns/**"
      - "bench/zk-bindings/**"
      - "crates/sparq-conformance/examples/proof_corpus.rs"
      - "zk/sparql-evaluator/model/**"
      - ".github/workflows/zk-toolchain.yml"

# Least-privilege: this lane only reads the repo + runs tests.
permissions:
  contents: read

concurrency:
  group: zk-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned Noir toolchain — the versions the circuits were authored against and the
  # empirical bb public-input anchors in verifier.rs were captured from. Bump these
  # deliberately (and re-run the e2e `probe_*_public_inputs_hex` tests to re-capture
  # the anchors) — never float to "latest".
  NARGO_VERSION: "1.0.0-beta.21"
  BB_VERSION: "5.0.0-nightly.20260324"
  # Pinned bootstrap sources (supply-chain: avoid an unpinned `curl | bash` of a moving
  # branch). The noirup / bbup *bootstrappers* are version-managers, not the tools — they
  # then install the EXACT pinned NARGO_VERSION / BB_VERSION below.
  #
  # sq-f9tl (Copilot review): we deliberately do NOT run the upstream `install`
  # *helper* scripts, because each re-fetches the actual tool from a FLOATING source even
  # when the helper itself is pinned by SHA — silently defeating the pin:
  #   • noirup's `install` curls the `noirup` binary from `releases/latest/download/noirup`
  #     (a moving "latest"), and
  #   • bbup's `barretenberg/bbup/install` hard-codes
  #     `BBUP_URL=…/AztecProtocol/aztec-packages/next/barretenberg/bbup/bbup`, re-downloading
  #     the `bbup` script from the moving `next` branch.
  # Instead we fetch the *actual* tool from a pinned source directly:
  #   • the `noirup` binary from a TAGGED release (NOIRUP_BIN_URL @ NOIRUP_RELEASE), and
  #   • the `bbup` script from the SHA-pinned ref (BBUP_REF) — the real tool, not the helper
  #     that re-fetches it from `next`.
  # The two-level pin is now genuine end-to-end: pinned bootstrapper + pinned tool version.
  # (bbup then downloads the bb binary tarball from a release URL keyed by the exact
  # BB_VERSION, so the backend binary is version-pinned too.)
  NOIRUP_RELEASE: "v0.1.4" # noir-lang/noirup release tag (pins the noirup binary itself)
  NOIRUP_BIN_URL: "https://github.com/noir-lang/noirup/releases/download/v0.1.4/noirup"
  BBUP_REF: "e80a3ada0bdc5501ff74fb2df7c9c99a19167049" # AztecProtocol/aztec-packages @ next (the bbup script is pinned to this SHA)

jobs:
  forge-suite:
    # Off draft PR heads: ready_for_review runs this lane on the head that will merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: zk forge + anchor suite (nargo/bb)
    runs-on: ubuntu-latest
    # Toolchain install + real bb proving is the long pole; generous headroom.
    timeout-minutes: 60
    env:
      # The RUNTIME LEDGER. The shared gate in crates/sparq-zk*/tests/support/mod.rs
      # appends one line, the CALL SITE as `<file>:<line>`, each time it lets a live
      # body run; a skip or a panic appends nothing. The job's final step compares the
      # file against every gate call site in the ZK test sources, so a live test that no
      # step runs — or that returned before reaching the gate — is a RED check rather
      # than a silent pass. Set here, at JOB level, and read by that step as a literal
      # path. Evidence against the ACCIDENT, not a boundary against hostile test code:
      # the variable is in this environment and the path is right here, so a test that
      # set out to forge an entry could.
      SPARQ_ZK_LIVE_LEDGER: ${{ github.workspace }}/.zk-live-ledger-${{ github.run_id }}-${{ github.run_attempt }}.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # sq-9jnj — changed-files gate for the merge queue. The `merge_group`
      # event ignores `paths` filters, so without this the ~60min forge suite would run
      # on EVERY queue enqueue. This cheap step decides whether the queued batch touched
      # any ZK-relevant path; the heavy steps below are gated on its `zk` output.
      #
      # The path set MUST stay in lock-step with the `pull_request`/`push` paths filter
      # above (crates/sparq-zk/**, crates/sparq-zk-compose/**, zk/compose/**, zk/dual-leaf-v2/**, this workflow).
      #
      # SAFE-BY-DEFAULT: zk defaults to "true". Only the `merge_group` branch can flip it
      # to "false", and only after a SUCCESSFUL diff that found no ZK paths. So:
      #   • every non-merge_group event (pull_request / push / schedule / dispatch) →
      #     zk=true → full suite, behaviour UNCHANGED (those events are already
      #     paths-gated, so the workflow only triggers when zk paths changed anyway);
      #   • merge_group + zk paths changed → zk=true → full suite GATES (soundness kept);
      #   • merge_group + no zk paths     → zk=false → heavy steps skip → fast green check;
      #   • merge_group + any diff failure → falls through to zk=true → full suite (fail
      #     SAFE: we never silently skip the gate because the diff couldn't be computed).
      #
      # NOTE: this step ALWAYS runs and the job ALWAYS runs, so the
      # `zk forge + anchor suite (nargo/bb)` check-run ALWAYS appears on the merge_group
      # ref and goes green quickly on the skip path.
      - name: Detect zk changes (merge_group changed-files gate)
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Default: run the full suite (fail-safe — see step comment).
          zk=true
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            zk=false
            # Fetch both ends of the queued batch (the default checkout is shallow, so
            # the base may be absent). Best-effort: on any fetch/diff error we leave
            # zk=true via the `||` fallbacks below so the gate fails SAFE.
            ok=true
            git fetch --no-tags --quiet origin "${MG_BASE_SHA}" "${MG_HEAD_SHA}" 2>/dev/null \
              || git fetch --no-tags --quiet origin "${MG_BASE_SHA}" 2>/dev/null \
              || ok=false
            git cat-file -e "${MG_BASE_SHA}^{commit}" 2>/dev/null || ok=false
            git cat-file -e "${MG_HEAD_SHA}^{commit}" 2>/dev/null || ok=false
            if [ "${ok}" = "true" ]; then
              changed="$(git diff --name-only "${MG_BASE_SHA}" "${MG_HEAD_SHA}")"
              echo "Changed files in queued batch (${MG_BASE_SHA}..${MG_HEAD_SHA}):"
              printf '%s\n' "${changed}"
              # ZK-relevant paths — SAME set as the pull_request/push paths filter.
              # sq-5reoy: zk/ narrowed to zk/compose/ (ieee754/xpath externalized, #1599).
              if printf '%s\n' "${changed}" | grep -Eq \
                '^(crates/sparq-zk/|crates/sparq-zk-compose/|zk/compose/|zk/dual-leaf-v2/|bench/zk-compose/campaigns/|bench/zk-bindings/|crates/sparq-conformance/examples/proof_corpus\.rs$|zk/sparql-evaluator/model/|\.github/workflows/zk-toolchain\.yml$)'; then
                zk=true
              else
                zk=false
              fi
            else
              echo "::warning::could not resolve merge_group base/head SHAs for the diff — running the full forge suite (fail-safe)."
              zk=true
            fi
          fi
          echo "zk=${zk}" >> "$GITHUB_OUTPUT"
          if [ "${zk}" = "true" ]; then
            echo "ZK-relevant paths changed (or non-merge_group / fail-safe) — running the full forge suite."
          else
            echo "No ZK-relevant paths in this merge_group batch — fast-passing (forge suite skipped, check stays green)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install PyYAML (hash-pinned)
        if: steps.changes.outputs.zk == 'true'
        # Needed only to read this workflow's own steps in the gate check below.
        # HASH-pinned (Scorecard PinnedDependenciesID) against the same requirements
        # file the docs-quality / feature-matrix YAML jobs use — one pin to bump.
        run: python3 -m pip install --require-hashes -r .github/requirements/docs-quality.txt

      # Fail-closed checks on the live-toolchain gate, static and toolchain-free so a
      # violation is a fast RED rather than a 60-minute one. The gate in
      # crates/sparq-zk*/tests/support/mod.rs is the only way a ZK test may obtain
      # nargo/bb: `gate()` mints the token `live_tool()` needs, and the checker lints
      # the test trees for every other acquisition path (a Command::new on a tool
      # literal, a path or alias spelling of one, a shell, a non-literal executable, a
      # not-found arm, a `which` probe, a `cmd!`, a branch on a driver spawn error, a
      # prover route that never calls the gate). It also keeps the two per-crate copies
      # of the gate byte-identical, ratchets the reviewed allow annotations, and checks
      # that the ledger verify step at the end of this job cannot be skipped.
      #
      # Coverage is NOT checked statically: a step's command grammar cannot prove the
      # tests ran. That is the ledger's job — see the job-level env above and the final
      # step of this job.
      - name: Check the ZK live-toolchain gate (acquisition + lane coverage)
        if: steps.changes.outputs.zk == 'true'
        run: python3 scripts/check-zk-toolchain-gate.py --check

      - name: Rust (preinstalled stable)
        if: steps.changes.outputs.zk == 'true'
        # CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain

      - name: Cache cargo + target
        if: steps.changes.outputs.zk == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Distinct cache key: this lane builds sparq-zk* with the toolchain present.
          key: zk-toolchain
          # sq-3sbrr save-if discipline: SAVE only from main; a branch-scoped save is
          # unreachable from main and only churns the shared 10 GB Actions-cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Install nargo via noirup, pinned to NARGO_VERSION. We fetch the `noirup` binary
      # DIRECTLY from a tagged release (NOIRUP_BIN_URL) rather than running upstream's
      # `install` helper, because that helper curls noirup from `releases/latest` (a moving
      # target that defeats the pin — Copilot review, sq-f9tl). `noirup --version` then
      # installs the EXACT nargo. Two-level pinning: pinned noirup release + pinned nargo.
      - name: Install nargo (Noir) — pinned
        if: steps.changes.outputs.zk == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nargo/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "${NOIRUP_BIN_URL}" \
            -o "$HOME/.nargo/bin/noirup"
          chmod +x "$HOME/.nargo/bin/noirup"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup --version "${NARGO_VERSION}"
          nargo --version

      # Install Barretenberg (bb) via bbup, pinned to BB_VERSION. We fetch the `bbup` SCRIPT
      # DIRECTLY from the SHA-pinned ref (BBUP_REF) rather than running upstream's `install`
      # helper, because that helper re-downloads bbup from the moving `next` branch and so
      # defeats the SHA pin (Copilot review, sq-f9tl). `bbup --version "${BB_VERSION}"` then
      # downloads the bb binary tarball from a release URL keyed by that exact version, so
      # the backend binary is version-pinned. Two-level pinning: pinned bbup @ BBUP_REF +
      # pinned bb version. (The bbup script accepts `-v|--version <ver>`; `--version <ver>`
      # binds `<ver>` as its argument.)
      - name: Install bb (Barretenberg) — pinned
        if: steps.changes.outputs.zk == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bb"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/AztecProtocol/aztec-packages/${BBUP_REF}/barretenberg/bbup/bbup" \
            -o "$HOME/.bb/bbup"
          chmod +x "$HOME/.bb/bbup"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          export PATH="$HOME/.bb:$PATH"
          bbup --version "${BB_VERSION}"
          bb --version

      - name: Toolchain versions (record for the run log)
        if: steps.changes.outputs.zk == 'true'
        run: |
          echo "nargo: $(nargo --version | head -1)"
          echo "bb:    $(bb --version)"

      # LOAD-BEARING for this lane's whole purpose: the live tests in
      # crates/sparq-zk-compose/tests/ used to `return` early when nargo/bb were absent,
      # so if the two install steps above ever broke (a moved release URL, a bad pin) the
      # entire forge suite would self-skip and this lane would report PASS with nothing
      # proven. They now PANIC instead, naming the missing tool — unless
      # SPARQ_ZK_ALLOW_MISSING_TOOLCHAIN is set, which the toolchain-free lanes (ci.yml,
      # feature-matrix.yml) set at workflow level. This workflow must NEVER set it; this
      # step asserts it is unset so a stray export cannot silently restore the false green.
      - name: Assert the live-toolchain opt-out is NOT set in this lane
        if: steps.changes.outputs.zk == 'true'
        run: |
          set -euo pipefail
          if [ -n "${SPARQ_ZK_ALLOW_MISSING_TOOLCHAIN:-}" ]; then
            echo "::error::SPARQ_ZK_ALLOW_MISSING_TOOLCHAIN is set in the toolchain lane — the live ZK tests would SKIP instead of proving anything. Unset it."
            exit 1
          fi
          echo "opt-out unset: a missing nargo/bb will fail this lane loudly."

      # Build the ZK crates' test targets first so a compile failure is distinct from a
      # proving failure in the logs.
      - name: Build sparq-zk* test targets
        if: steps.changes.outputs.zk == 'true'
        run: cargo build -p sparq-zk -p sparq-zk-compose --all-targets

      # Dedicated invocation supplies inputs to the ignored adapter; the
      # generic result sweep below still runs every preexisting result test.
      - name: Replay complete bounded binding domains (native and real proofs)
        id: binding-corpus
        if: steps.changes.outputs.zk == 'true'
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          python3 -m unittest discover -s bench/zk-bindings -p 'test_*.py'
          cargo check --locked -p sparq-conformance --example proof_corpus
          cargo test --locked --manifest-path zk/sparql-evaluator/Cargo.toml -p sparq-proved-evaluator-model --features evaluate --example proof_bindings
          python3 bench/zk-bindings/ci.py --output "${RUNNER_TEMP}/proof-binding-evidence"

      - name: Retain binding corpus evidence including partial failures
        if: always() && steps.changes.outputs.zk == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-bindings-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-binding-evidence
          if-no-files-found: error
          retention-days: 30
      # sq-kep2 — recurrence guard for the STANDALONE family_curve harness.
      # `bench/zk-compose/family_curve` is a detached cargo project (own `[workspace]`,
      # `lto = "fat"` release profile) deliberately kept OUT of the root workspace so it
      # never taxes the fast `cargo build --workspace`/clippy/wasm gate. That isolation
      # means it is NOT covered by ci.yml — so when a `CircuitId`/`ProofInputs`/
      # `prover_toml_for` signature changes in sparq-zk-compose (e.g. FilterF64 going
      # unit→struct in sq-q7e/sq-tat), family_curve breaks SILENTLY. This zk-touching
      # lane already rebuilds on every sparq-zk-compose change and the deps are already
      # compiled above, so a plain `cargo build` of the harness here is near-free and
      # makes that schema drift a visible RED check on the PR that introduces it. (Build
      # only — no `cargo run`: catching the compile/API break needs no real bb proving.)
      #
      # sq-q134e — deliberately NOT `--locked`. The harness path-deps on
      # in-repo crates (sparq-zk → … → sparq-substrate) whose manifests bump
      # dependencies on lanes that do NOT trigger this zk lane, so the committed
      # harness Cargo.lock drifts SILENTLY on main and `--locked` then spuriously
      # failed the NEXT zk-touching PR (bit #1962 via a main-side hashbrown bump the
      # ZK PR never made). A plain `cargo build` keeps every still-compatible pin
      # from the committed lock (cargo re-resolves MINIMALLY) and only absorbs the
      # in-repo manifest bumps — so the guard still goes RED on a real schema/API
      # break in the harness, while pure lock drift becomes an advisory notice (with
      # the lock diff in the step summary) asking for a refresh commit instead of a
      # spurious failure on an innocent PR. sq-q134e
      - name: Build the standalone family_curve harness (schema-drift guard)
        if: steps.changes.outputs.zk == 'true'
        working-directory: bench/zk-compose/family_curve
        run: |
          set -euo pipefail
          cargo build
          if ! git diff --quiet -- Cargo.lock; then
            echo "::notice file=bench/zk-compose/family_curve/Cargo.lock::family_curve Cargo.lock drifted from an in-repo dep bump that landed on a lane which does not run this guard. The build used the minimally refreshed lock; commit the refreshed Cargo.lock to re-pin (sq-q134e)."
            {
              echo '### family_curve Cargo.lock drift (sq-q134e) — commit this refresh to re-pin'
              echo '```diff'
              git diff -- Cargo.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # sq-7pifo — run the NON-`#[ignore]`d, toolchain-gated regression gates.
      # The sq-c5f gate-count regression test (`gate_count::gate_count_regression`) is
      # deliberately NOT `#[ignore]`d — gate counts are cheap (compile + `bb gates`, no
      # proving) — so it can run in the normal suite WHEN the toolchain is present. But the
      # normal ci.yml lanes have no nargo/bb, so it skips there (declared, see below), and the ignored-suite
      # step below runs `-- --ignored`, which SKIPS every non-ignored test. Net result before
      # this step: `gate_count_regression` ran in NO CI lane, so its baselines went silently
      # stale (the sq-25mgo deep-underflow fix grew filter_f64 and filter_value_dl_f64 well
      # past the checked-in regression tolerance and nothing tripped, sq-3kd2g.2). This step runs
      # the non-ignored tests in the `gate_count` and `sparql_catalog` binaries WITH the
      # toolchain on PATH, so an intentional circuit change must re-baseline in the SAME PR.
      # Cheap: compile + `bb gates` only, no proving. (`sparql_catalog` needs no toolchain but
      # co-lives here as the snapshot-consistency guard; running it is near-free.)
      - name: Run the non-ignored gate-count + catalog regression gates (real bb gates)
        if: steps.changes.outputs.zk == 'true'
        run: |
          cargo test -p sparq-zk-compose --test gate_count --test sparql_catalog -- --test-threads=1

      # sq-j506 follow-up: the `dual-leaf` feature is OFF by default, so the lane
      # suites in crates/sparq-zk-compose/tests/ and crates/sparq-zk/tests/
      # (`#![cfg(feature = "dual-leaf")]`)
      # compile to NOTHING in every other lane — a lane test could regress with no red
      # check anywhere. Two further binaries (`method_auth_binding`,
      # `bb_gates_matrix`) are only PARTIALLY gated: they compile without the feature,
      # but their `#[cfg(feature = "dual-leaf")]` cases (the resolver cross-check of the
      # committed legality matrix among them) drop out, so they are listed here too.
      # `--features sparq-zk-compose/dual-leaf` is what turns on `sparq-zk/dual-leaf`
      # (the compose feature forwards it), which is what makes the two sparq-zk
      # binaries non-empty.
      # They are cheap (no proving; the in-circuit cases shell out to
      # `nargo execute` only, and the toolchain is on PATH here), so run them in this
      # lane, which already builds these crates. They run
      # ONLY when this workflow runs at all — the pull_request / push `paths:` filter
      # above restricts that to crates/sparq-zk*/**, zk/compose/** (and this file), so
      # these steps add NO runner load to an unrelated PR.
      - name: Run the dual-leaf lane suites (default-off feature, toolchain on PATH)
        if: steps.changes.outputs.zk == 'true'
        run: |
          cargo test -p sparq-zk -p sparq-zk-compose --features sparq-zk-compose/dual-leaf \
            --test dual_leaf_v2_lanes \
            --test dual_leaf_boolean_lane \
            --test dual_leaf_datetime_lane \
            --test value_lane_pin \
            --test method_auth_binding \
            --test bb_gates_matrix \
            --test dual_leaf_v2_noir_pin \
            --test dual_leaf_identity_guard \
            -- --test-threads=1

      # The Noir unit tests of the compose member crate. The step below runs the
      # per-module `result*::` suites for the additive result contract; this one runs
      # the WHOLE `sparq_zk_compose_core` package, so a member's own `#[test]`s (the
      # bit-domain boolean member's among them) cannot sit unrun. Compile + execute
      # only — no `bb prove`.
      #
      # The two V2 dual-leaf member packages carry their own `#[test]`s (honest-component
      # accept + a refusal case each) and are NOT part of `sparq_zk_compose_core`, so
      # they are run here as well — `nargo test` takes one `--package` per invocation.
      - name: Run the Noir unit tests of the compose member crate (nargo test)
        if: steps.changes.outputs.zk == 'true'
        working-directory: zk/compose
        run: |
          set -euo pipefail
          nargo test --package sparq_zk_compose_core
          nargo test --package scan_v2dl_k1_n16_r4
          nargo test --package join_eq_v2dl_na16_nb16

      # The DualLeafV2 sentinel/constants mirror (zk/dual-leaf-v2). A separate Nargo
      # package on purpose: every *.nr under zk/compose is sha256-pinned by the
      # bench/zk-compose measurement evidence, whose verifier requires the measured
      # inventory to equal the tree EXACTLY (verify_result_evidence.py), so a new file
      # there would invalidate a measurement that only dedicated hardware can redo.
      # Dependency-free, imported by no member: compile + execute only, seconds.
      - name: Run the DualLeafV2 constants-mirror Noir tests (nargo test)
        if: steps.changes.outputs.zk == 'true'
        working-directory: zk/dual-leaf-v2
        run: nargo test

      # The load-bearing step: run EVERY `#[ignore]`d test in the ZK crates. With the
      # toolchain on PATH the forge tests do a REAL bb prove and assert every forgery is
      # REJECTED (and the positive controls verify); the empirical bb anchors re-validate
      # the public-input serialization. --test-threads=1 keeps concurrent bb subprocesses
      # from contending for the runner; nextest is NOT used here because these are slow,
      # serialized, toolchain-bound cases (the retry/process-isolation nextest buys us on
      # the fast lane is not what this lane needs).
      #
      # sq-5reoy: compiling zk/compose here now transitively fetches the
      # released sparq_ieee754 git dependency (sparq-org/noir_IEEE754 @ v0.10.0) from
      # GitHub, exactly as it already fetches the poseidon v0.3.0 git dep — so this lane
      # needs network access to github.com on a cold ~/.nargo cache (the rust-cache above
      # does not cache ~/.nargo; nargo's own per-machine cache warms after the first fetch).
      - name: Run the ignored ZK forge + anchor + e2e suite (real bb)
        if: steps.changes.outputs.zk == 'true'
        run: |
          cargo test -p sparq-zk-compose -p sparq-zk -- --ignored --test-threads=1

      # The step above passes NO `--features`, so an `#[ignore]`d case that is also
      # `#[cfg(feature = "dual-leaf")]` compiles to nothing there, and the
      # feature-matrix `dual-leaf` leg has no toolchain and does not run ignored
      # cases — so such a case would execute in NO lane. This step is the executor
      # for that intersection: the ignored dual-leaf cases of `tests/e2e.rs`.
      #
      # The cases, by name:
      #   * the DEFERRED member resolution over a hidden-only commitment (a real
      #     `scan_k2` proof AND a real hidden-issuer proof) — the NEGATIVE case;
      #   * `hidden_issuer_in_set_*` / `hidden_issuer_only_*` — the POSITIVE
      #     controls for the deferred post-pass: an honest hidden-issuer
      #     presentation must still VERIFY with `dual-leaf` on, so the post-pass is
      #     not refusing everything it defers. Without `--features dual-leaf` the
      #     positive controls run in the step above with the whole resolution
      #     compiled out, which says nothing about it.
      #
      # `--exact` with one invocation per name, and the per-test result line is
      # CHECKED: a libtest name filter that matches nothing exits 0, so a renamed
      # or `cfg`-ed-out case would otherwise report PASS having run nothing.
      #
      # The log is ALSO checked for a declared SKIP: the shared toolchain gate
      # (`tests/support/mod.rs`) prints `SKIP <test>: ...` and RETURNS when a tool
      # is missing and skipping is allowed, so the case still reports `1 passed`
      # having proved nothing. In THIS lane a skip is a failure. The gate writes
      # that line straight to the terminal to escape libtest's output capture, so
      # it lands INTERLEAVED after libtest's `test <name> ... ` prefix rather than
      # at the start of a line — hence the alternation. (The job also errors out
      # earlier if `SPARQ_ZK_ALLOW_MISSING_TOOLCHAIN` is set at all, which is what
      # makes the gate panic instead of skip here; this check is the backstop for
      # a skip arriving by any other route.)
      - name: Run the ignored dual-leaf e2e cases (real bb, default-off feature)
        if: steps.changes.outputs.zk == 'true'
        run: |
          set -euo pipefail
          for t in \
            a_deferred_member_resolution_is_refused_after_the_hidden_issuer_gate \
            hidden_issuer_in_set_verifies_and_key_is_private \
            hidden_issuer_only_verifies_with_clear_key_absent \
            hidden_issuer_only_message_is_held_to_the_method_policy; do
            echo "::group::$t"
            cargo test -p sparq-zk-compose --features dual-leaf --test e2e \
              -- --ignored --exact --test-threads=1 "$t" 2>&1 | tee "/tmp/dl-e2e-$t.log"
            echo "::endgroup::"
            if ! grep -qE '^test result: ok\. 1 passed' "/tmp/dl-e2e-$t.log"; then
              echo "FAIL: $t did not run as exactly one passing test under --features dual-leaf" >&2
              exit 1
            fi
            if grep -qE '(^|\.\.\. )SKIP [A-Za-z0-9_]+: ' "/tmp/dl-e2e-$t.log"; then
              echo "FAIL: $t declared a SKIP in the toolchain lane — it reported a pass without proving anything" >&2
              exit 1
            fi
          done

      # The live tests that are NOT `#[ignore]`d (e2e forge-reject cases, the signed
      # filter bindings, the family members, the differential fuzz, the car-hire capture)
      # run in the default lanes only as declared skips, because those lanes have no
      # toolchain. This is the lane that has it, so run them here too.
      #
      # PACKAGE-WIDE, and `-p sparq-zk` was added:
      # `crates/sparq-zk/tests/poseidon2_noir_cross.rs` was the ONE gap this change
      # found — it gated itself with a private not-found arm that returned, so it passed
      # quietly, and no step ran sparq-zk's non-ignored tests here. It now goes through
      # the shared gate, and this step runs its package. The other live compose binaries
      # were already covered by this step before the change.
      #
      # DELIBERATELY no `if:`. The toolchain installs above share the `changes`
      # condition, so if it were ever false this step would fail for want of nargo/bb
      # rather than skip — which is the fail-closed direction. The ledger verify step at
      # the end of the job is what proves these tests ran.
      - name: Run the default-run live ZK tests (real nargo/bb)
        run: |
          cargo test -p sparq-zk-compose -p sparq-zk -- --test-threads=1

      # Rebuild the immutable foundation separately from the PR candidate.
      # This independently checks the provenance of all four legacy key goldens.
      - name: Rebuild fixed foundation result keys independently
        if: steps.changes.outputs.zk == 'true'
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          trap 'rm -rf "$baseline_dir"' EXIT
          git fetch --no-tags --depth=1 origin 713025dc0fcdcbdcd070ba4dcbde524be50ba055
          git archive 713025dc0fcdcbdcd070ba4dcbde524be50ba055 zk/compose | tar -x -C "$baseline_dir"
          python3 bench/zk-compose/scripts/verify_result_evidence.py --baseline-root "$baseline_dir"

      # The additive result contract is default-off, so it needs explicit
      # feature coverage: real private-witness rejection, ZK proofs and ABI anchors.
      # beadzkp-15.1: the ignored public-pattern proof test fails closed
      # without a NEW absolute evidence directory outside the checkout. runner.temp
      # is the existing per-job parent; the test itself creates the unique leaf.
      - name: Run selected-result private-witness and verifier tests (real bb)
        id: selected-result
        if: steps.changes.outputs.zk == 'true'
        env:
          SPARQ_PUBLIC_PATTERN_EVIDENCE: ${{ runner.temp }}/public-pattern-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo test -p sparq-zk-compose --features successful-results --lib result:: -- --include-ignored --test-threads=1 --skip result::proof_bindings::run_job
          python3 bench/zk-compose/campaigns/test_campaign.py
          cargo test -p sparq-zk-compose --features successful-results --example result_experiment
          cargo test -p sparq-zk-compose --features successful-results --lib driver::
          cd zk/compose
          nargo test --package sparq_zk_compose_core result::
          nargo test --package sparq_zk_compose_core result_integer::
          nargo test --package sparq_zk_compose_core result_signed_integer::
          nargo test --package sparq_zk_compose_core result_public::

      # beadzkp-15.1: evidence files are written only after every assertion
      # passes, so a failed step may leave the directory empty or absent; missing
      # files are an error whenever the step succeeded.
      - name: Retain public-pattern proof evidence including failed runs
        if: always() && steps.changes.outputs.zk == 'true' && steps.selected-result.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-pattern-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-pattern-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ${{ steps.selected-result.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      # The ledger check: the proof that the live tests above RAN.
      #
      # Every `gate()`/`require_toolchain()` call site in crates/sparq-zk*/tests/ AND in
      # those crates' `src/` test code is expected to have appended its key to
      # SPARQ_ZK_LIVE_LEDGER. A missing entry means the live body did not run — no step
      # covers it, or it returned before the gate — and this step fails naming each one.
      # A missing or empty ledger fails too, and so does an entry matching NO
      # inventoried call site, because that means the inventory missed a site. The path
      # is a LITERAL here, not `$SPARQ_ZK_LIVE_LEDGER`, so a step reordering or an
      # overridden variable cannot point this step at another file.
      #
      # It may carry ONLY `name:` and `run:`, and must stay the LAST step of this job;
      # the checker's own CHECK D reds on any other key, on a `defaults:` block at job
      # or workflow level, and on a non-bash `shell:` anywhere in this job. The ledger
      # proves the gate was REACHED for each call site; it does not prove what the
      # bodies asserted.
      - name: Verify every live ZK test ran
        run: python3 scripts/check-zk-toolchain-gate.py --verify-ledger "${{ github.workspace }}/.zk-live-ledger-${{ github.run_id }}-${{ github.run_attempt }}.txt"
