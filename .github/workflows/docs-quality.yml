  # ----------------------------- ADVISORY -----------------------------
  # [FABLE-5] sq-6vshe.20: the three former advisory jobs as step-groups on ONE
  # runner. The job NAME carries the advisory token (ci-summary exclusion +
  # advisory-registry entry `docs-quality quick-advisory (advisory)`), and every
  # finding is swallowed AT THE STEP exactly as before (`|| true`, step-level
  # continue-on-error on vale/reviewdog, lychee `fail: false`) so the check-run
  # concludes SUCCESS. Job-level continue-on-error stays as defence-in-depth only
  # (it alone would NOT stop the check-run from concluding failure — PR #42).
  # A step promotes to HARD by MOVING into quick-gates (registry criteria).
  quick-advisory:
    name: docs-quality quick-advisory (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # ---- former job: markdownlint-advisory (whole repo) ----
      - name: markdownlint-advisory (whole repo) — full-corpus visibility for the staged rollout
        run: |
          set -uo pipefail
          # The advisory config (same tuned rules) must be named with a supported
          # prefix so it's accepted by --config. Pass whole-repo globs explicitly.
          # [OPUS-4.8] sq-5reoy: dropped the "#zk/xpath/vendor" exclude — the zk/xpath
          # tree (and its vendored ieee754 copy) was externalized to sparq-org/noir_XPath
          # (#1599); the generic "#**/vendor" glob still covers any remaining vendor dir.
          npx --yes markdownlint-cli2@0.18.1 \
            --config advisory.markdownlint-cli2.jsonc \
            "**/*.md" "#node_modules" "#**/node_modules" "#target" "#**/target" \
            "#vendor" "#**/vendor" \
            > md-advisory.txt 2>&1 || true
          n=$(grep -cE ' MD[0-9]+/' md-advisory.txt || true)
          {
            echo "### markdownlint-advisory (whole repo): ${n} finding(s)"
            echo ""
            echo "Out-of-HARD-scope dirs (bench/, .claude/) — staged rollout. (research/ + zk/ are HARD as of sq-rqyo.)"
            echo ""
            echo '```'
            grep -oE ' (MD[0-9]+/[a-z0-9-]+)' md-advisory.txt | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- docs-duplication (jscpd copy/paste detection over the doc surface) ----
      # [OPUS-5] sq-lrju — a STEP, not a job: sq-6vshe.20 consolidated this workflow to two
      # runners precisely to stop sub-minute lints each claiming their own, and the registry
      # entry for `docs-quality quick-advisory (advisory)` already owns per-step promotion.
      #
      # WHY ADVISORY. Not a backlog — a measured precision problem in the tool, recorded here
      # because the next person will otherwise read the headline percentage as a defect count:
      #   * jscpd's per-fence sub-format classes are EXACT. Verified on a fixture: two ```rust
      #     blocks with identical bodies in two .md files report one `rust` clone with the
      #     matching span, and the same pair wrapped in `<!-- jscpd:ignore-start -->` /
      #     `<!-- jscpd:ignore-end -->` reports none.
      #   * the `markdown` block class is NOT exact. Verified by hand on this repo's
      #     research/ corpus with `--reporters console-full`: reported `markdown` pairs
      #     include ones whose own printed snippets are entirely different text (a prose
      #     paragraph plus a ```text fence, reported as a clone of unrelated prose plus a
      #     ```js fence — both spans inside research/autonomous-scheduler-design.md). The
      #     mechanism is NOT established here; what IS measured is that the whole class
      #     disappears under `--mode weak`, which the tool documents as dropping comment
      #     tokens, and that `mild` behaves like `strict`. So there is no middle setting:
      #     either the class is reported and cannot be trusted, or nothing is reported.
      # So the summary reports the two classes SEPARATELY instead of one blended number, and
      # the lane may only be promoted on the exact half. `threshold: 0` in the config is real
      # (the threshold reporter exits 1) and is swallowed here by `|| true` while advisory.
      #
      # jscpd 5.x is the Rust engine: the npm package is a launcher plus per-platform
      # optionalDependencies carrying a prebuilt binary — same shape as the prebuilt tools
      # taiki-e/install-action fetches for the gating steps above. Version pinned exactly.
      - name: docs-duplication (jscpd; copy/paste clones over README + skills + docs + research + book)
        run: |
          set -uo pipefail
          # Console reporter goes straight to the job log (where the full clone list lives —
          # the summary caps its own list); the json reporter writes the report the summary is
          # computed from, at target/jscpd/jscpd-report.json (under the gitignored /target), whose
          # directory jscpd creates itself. `|| true` swallows the threshold reporter exit 1.
          npx --yes jscpd@5.0.12 --config .jscpd.json --no-colors || true
          node -e '
            const fs = require("fs");
            const P = "target/jscpd/jscpd-report.json";
            let r = null;
            try { r = JSON.parse(fs.readFileSync(P, "utf8")); } catch (e) { r = null; }
            if (!r) {
              console.log("### docs-duplication (jscpd): NO REPORT PRODUCED");
              console.log("");
              console.log("jscpd wrote no `" + P + "`, so nothing was measured. This is a BROKEN");
              console.log("lane, not a clean one — the reason is in the step log.");
              process.exit(0);
            }
            const total = (r.statistics || {}).total || {};
            const dups = r.duplicates || [];
            const prose = dups.filter(function (d) { return d.format === "markdown"; });
            const code = dups.filter(function (d) { return d.format !== "markdown"; });
            console.log("### docs-duplication (jscpd): " + code.length + " fenced-code clone(s), " +
                        prose.length + " prose-class finding(s)");
            console.log("");
            if (!total.sources) {
              console.log("**Nothing was analysed** — 0 eligible blocks. The `path` scope in");
              console.log("`.jscpd.json` matched no markdown, so these zeros mean the lane is");
              console.log("vacuous, NOT that the docs are clone-free.");
              console.log("");
            }
            console.log("| class | findings | precision |");
            console.log("|---|---|---|");
            console.log("| fenced code blocks (`rust` / `bash` / `sparql` / …) | " + code.length +
                        " | exact — real copy/paste, fix these |");
            console.log("| `markdown` prose blocks | " + prose.length +
                        " | LOW — matches non-identical prose (see the step comment) |");
            console.log("");
            if (code.length) {
              console.log("Fenced-code clones:");
              console.log("");
              code.slice(0, 25).forEach(function (d) {
                console.log("- `" + d.format + "`, " + d.lines + " lines — `" + d.firstFile.name + ":" +
                            d.firstFile.start + "` ↔ `" + d.secondFile.name + ":" + d.secondFile.start + "`");
              });
              if (code.length > 25) { console.log("- … " + (code.length - 25) + " more, full list in the step log"); }
              console.log("");
            }
            console.log("Analysed " + (total.sources || 0) + " eligible block(s) — a block below");
            console.log("`minTokens` is not analysed at all, so that count moves when the knob does.");
            console.log("");
            console.log("Intentional repeats are allowlisted IN THE SOURCE with");
            console.log("`<!-- jscpd:ignore-start -->` / `<!-- jscpd:ignore-end -->` (verified working for");
            console.log("markdown). Reserve them for genuinely intentional duplication: wrapping a");
            console.log("prose-class finding hides a tool defect rather than a repeat.");
            console.log("");
            console.log("Reproduce locally: `npx jscpd@5.0.12` — the repo-root `.jscpd.json` is picked");
            console.log("up automatically. Add `--reporters console-full` to print the matched snippets");
            console.log("and judge a finding for yourself.");
          ' >> "$GITHUB_STEP_SUMMARY" \
            || echo "⚠️ docs-duplication: summary generation failed — see the step log." >> "$GITHUB_STEP_SUMMARY"

      # ---- former job: vale (prose, advisory) ----
      - name: vale (prose, advisory) — vendored styles, no network
        # [OPUS-4.8] STEP-level continue-on-error: reviewdog exits 1 on findings, and
        # JOB-level continue-on-error does NOT make the job's check-run conclude success
        # (it only stops the run from failing) — so ci-summary, which fails iff any
        # check-run concluded failure, would wrongly block on this advisory job. Swallowing
        # at the step makes the job conclude success while the findings still print.
        continue-on-error: true
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.9.1
          files: README.md AGENTS.md CONTRIBUTING.md SECURITY.md skills docs crates
          fail_on_error: false
          # `local` reporter prints to the job log — no PR-annotation write scope
          # needed (top-level permissions stay read-only). Advisory anyway.
          reporter: local
          token: ${{ github.token }}

      # ---- former job: external-links (lychee online, advisory) ----
      - name: external-links (lychee online; dead http(s) links — network-flaky → advisory)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200..=206,429
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
            './skills/**/*.md' './docs/**/*.md' './crates/**/*.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
