# ci-summary — the SINGLE required status check for branch protection on `main`
# (bead sq-prg4). [OPUS-4.8]
#
# WHY: sparq's gates live across many workflows + jobs (ci.yml's build/test/clippy/
# conformance/SHACL/inference/coverage/wasm/MSRV, supply-chain.yml, python.yml,
# js.yml, codeql.yml, scorecard.yml, …). Requiring each by name in the branch-
# protection ruleset is brittle: every job rename or added gate breaks the rule and
# silently weakens the gate. `needs:` cannot span workflows, so we cannot aggregate
# with a normal dependency edge. Instead this workflow contributes ONE check —
# `ci-summary / gate` — that the ruleset requires; it POLLS every OTHER check-run on
# the head commit and passes iff none failed. Add/rename jobs freely; the gate adapts.
# (Pattern ported from jeswr/prod-solid-server's pr-gate.yml, incl. its stability-
# window race fix.)
#
# SEMANTICS: success / skipped / neutral are non-failing; a genuine newest-run
# failure / timed_out / action_required / stale fails the gate. Cancelled runs are
# re-dispatched once, never treated as a test failure. The gate EXCLUDES ITSELF (no
# self-deadlock). It waits until EVERY discovered sibling check-run is terminal
# (pending == 0) AND that all-terminal state has HELD for a short settle window,
# bounded below by a startup-race floor and above by the job timeout. This converges
# FAST once the last sibling finishes — including a `build + test` MATRIX whose shards
# register/complete at staggered times — instead of repeatedly re-waiting a long
# unchanged-name window per late arrival (the thrash @jeswr saw after the test job was
# split into shards). A stable-empty set passes (e.g. a docs-only change that triggers
# no other workflow). [OPUS-4.8]
#
# STILL-SETTLING SET ROBUSTNESS (bead sq-ipkku). [OPUS-4.8] The settle is re-armed
# ONLY by genuinely-new PENDING work (`pending > 0`), NOT by a check-run that arrives
# already TERMINAL. Earlier the settle reset on ANY change to the sibling NAME set, so
# a flurry of late-but-already-green check-runs trickling in (observed on #997: the set
# grew 81 -> 86 mid-poll while every check was terminal+green) reset the settle on each
# injection, never let it reach the window, and the loop hit its cap and emitted a
# FALSE RED — even though nothing failed. Now an already-terminal injection cannot
# starve convergence: only unfinished work (pending) holds or re-arms the gate. And
# loop-budget exhaustion with everything terminal renders the REAL verdict on the full
# terminal set rather than blind-failing; a genuine hang is the only timeout RED.
#
# ADAPTIVE SATURATION BUDGET (bead sq-90cv4). [FABLE-5] This gate is a WAITER that
# occupies a runner slot while polling. Under org-pool saturation (many PRs → many
# concurrent gates), the waiters starve the very builds they wait on, the base budget
# expires with siblings still QUEUED, and the old unconditional timeout-RED emitted a
# FALSE gate=FAILURE on PRs whose real legs were green/pending (the 2026-07-02
# congestion collapse). Runner saturation is a THROUGHPUT signal, not a hang — so at
# base-budget exhaustion with work still pending, the loop now extends its wait (at a
# slower poll cadence) ONLY while the repo's Actions queue is deep or sibling
# completions are still landing, up to a hard absolute cap; an idle-queue/no-progress
# pending set still REDs immediately (genuine hang), and every verdict — including
# after an extension — is rendered by the SAME all-terminal gating semantics, so a
# real failure can never become a pass and the wait can never be infinite. The
# queue-depth signal needs `actions: read` (read-only) on the token.
#
# SLOTLESS SUCCESSOR, STAGED ALONGSIDE (bead sq-lfmvd). [FABLE-5] The deeper fix —
# moving the waiter OFF the build-runner slot entirely — now EXISTS as
# .github/workflows/ci-gate-status.yml: short-lived `workflow_run`-triggered
# evaluations that run the SAME brain (scripts/ci_summary_gate.py --evaluate, sharing
# render_verdict verbatim) and publish the verdict as the `ci-gate` COMMIT STATUS.
# THIS JOB IS STILL THE REQUIRED CHECK. The migration is deliberately STAGED, never
# an atomic swap: the branch-protection ruleset requires only `gate` today, the
# status runs in shadow, and dropping this job before the maintainer has moved the
# ruleset onto the `ci-gate` context would block every merge. See
# docs/branch-protection.md §Slotless gate evaluation for the three stages and their
# exit criteria; scripts/tests/test_ci_summary_gate.py::TestSlotlessEvaluationWiring
# ::test_the_required_check_migration_is_STAGED_not_swapped reds if this job is
# deleted while the shadow lane is the only evaluator.
#
# ADVISORY/INFORMATIONAL checks are NON-GATING — but ONLY WHEN DECLARED (#3773).
# [OPUS-5] A check-run is excluded from the gating set iff its name is EXPLICITLY
# DECLARED in `.github/advisory-registry.json`; every other check GATES, whatever it
# is called. Its conclusion (even `failure`) can then never fail the gate.
# THIS REPLACES the pre-2026-07-25 name rule (`\b(advisory|informational)\b` over the
# display name), which was a correctness hole in the one check that authorises merges:
# any job whose NAME happened to contain those words was dropped wholesale — no
# waiver, no entry, no record. An adversarial audit (#3773) found FOUR real gates
# neutralised that way (site determinism grep-gate, #1740 browserName tripwire,
# gui no-sleep-gate, axe a11y ratchet), two of them documented in-repo as HARD.
# Consequences, deliberately:
#   • a name token is now DIAGNOSTIC ONLY — `foo (advisory)` with no registry entry
#     GATES, and the gate summary prints a loud UNDECLARED note naming it;
#   • each declaration is BOUND to the job's stable identity (workflow file + job id)
#     and enforced by scripts/check-advisory-registry.py C4, so a RENAME cannot flip
#     gating status silently: a renamed declared job GATES and C4 REDs until the
#     declaration is deliberately updated;
#   • a MISSING/unparseable registry is an immediate LOUD exit 1 (fail-closed) — the
#     gate refuses to evaluate rather than guess, which is why the sparse-checkout
#     below must include the registry file.
# Promotion of a declared-advisory lane is therefore a two-line change (drop the
# registry entry; optionally drop the now-meaningless name token), and it is
# diff-visible in one file.
# [OPUS-5] PLATFORM-MANAGED companion rule (ci_summary_gate.py
#  PLATFORM_MANAGED_ADVISORY_NAMES / is_platform_managed_advisory). The registry
#  declares jobs THIS repo authors, keyed on the workflow job. A GitHub-MANAGED job
#  has no workflow file here, so it cannot be declared that way; it is excluded by an
#  EXACT, case-insensitive, whole-name allow-list — currently just:
#   • "Dependabot"   (GitHub's managed `Dependabot Updates` workflow, event=dynamic,
#                     path `dynamic/dependabot/dependabot-updates`; its only job name)
#  That check reports Dependabot's own ability to act on an UPSTREAM advisory — it REDs
#  on `security_update_not_possible`, where no reachable version clears every advisory
#  on the package — not this repo's code health, so it must not halt the line. Nothing
#  is suppressed: the Dependabot ALERT stays open, Dependabot keeps retrying, and the
#  actionable cargo dependency-vulnerability GATE (`cargo deny check advisories` inside
#  "supply-chain gates (…)") is untouched. Unknown/new names FAIL CLOSED (still gate).
# REQUIRED checks (gate / build+test / clippy / coverage / the conformance + perf
# ratchets / wasm / MSRV / supply-chain / …) are not declared, so they gate normally —
# and so does anything new, by default. Rationale for the exclusion existing at all:
# a genuinely environment-coupled advisory job that concludes `failure` (e.g.
# cargo-geiger erroring on the virtual workspace manifest) must never block a merge —
# the step-level `continue-on-error`/`|| true` in those jobs is a best-effort first
# line, and THIS declared-registry rule is the load-bearing backstop that makes
# DECLARED advisory failures strictly non-gating regardless of how the job concludes.
#
# CHANGE-BASED TEST-SELECTION semantics (bead sq-fmx4u.3). [FABLE-5] The wide
# per-crate lanes in ci.yml / feature-matrix.yml may now be SKIPPED (or, for the
# cross-crate bulk shards, narrowed) when the `select (change-based test
# selection)` pre-job (.github/workflows/ci-select.yml, reused by both workflows)
# proves their crate outside the affected closure. The gate's rule (design §5.3):
# a `skipped` conclusion is satisfied ONLY when every selection check-run on the
# commit concluded SUCCESS — a present-but-not-success select REDs the gate
# outright even if all other siblings are green, because the thing that decided
# the skips was never soundly observed. With select green (or absent — a
# pre-selection sibling set), `skipped` stays non-failing exactly as before, and
# a job that FAILED still fails the gate regardless (selection can never mask a
# real failure). [FABLE-5] sq-fmx4u.5: selection is now ENFORCED by default (the
# shadow rollout is flipped) — a not-affected crate's lane reports `skipped`, which
# the rule above counts as satisfied only under a successful select. This is safe
# because the ruleset requires exactly one check (this `gate`); no per-leg name is
# individually required, so a plain-skipped leg can never hang the merge queue
# (verified in bead sq-fmx4u.4). The `ci-full` PR label + the nightly cron full run
# are the permanent backstops; CI_SELECT_MODE=shadow is the report-only rollback.
#
# DRAFT-TIER CI (docs/branch-protection.md §Draft-tier CI). [FABLE-5] Draft PR
# heads run a REDUCED sibling set (coverage / bench / CodeQL / heavy shards /
# wasm-equality skipped; the crate legs stay change-scoped by ci-select) so the
# review-fix churn of many concurrent draft worker PRs stops saturating the runner
# pool. THE INVARIANT — a draft-tier gate result must NEVER admit a PR to the merge
# queue — is STRUCTURAL: the gate job's own check-run NAME is tiered. On a draft
# pull_request payload the job below is named `gate, draft-tier`, NOT `gate`, so a
# draft-tier run never produces the required `gate` context at all and the
# ruleset's required_status_checks entry ({context: "gate"}) is unsatisfiable by
# draft-tier results. From the un-draft moment until the full-tier run's fresh
# `gate` concludes, the required context is simply ABSENT — which branch protection
# treats as blocking — so there is no supersession window to race: GitHub event
# latency, a dropped ready_for_review event, or an Actions outage all leave the PR
# blocked, never admitted (`gh pr ready && gh pr merge --auto` arms and waits).
# scripts/ci_summary_gate.py adds defense-in-depth on top: each run knows its own
# tier from the trigger payload (PR_DRAFT below); a draft-tier run re-checks the
# PR's CURRENT draft state via the API before any SUCCESS (un-drafted => FAILURE,
# "stale draft-tier run, full run pending"); a full-tier pull_request run refuses
# to conclude while ANY draft-tier-marked ci-select INSTANCE lacks its own later
# full-tier successor (per-instance — ci/bench/feature-matrix/fuzz all expose the
# identical select check-run name); and stale `gate, draft-tier` check-runs are
# excluded from every sibling set as tier artifacts. `ready_for_review` below
# re-runs this gate (and every tiered sibling workflow) at the un-draft moment,
# producing the first (and only) `gate` check-run on the head SHA. merge_group
# behaviour is untouched (always full tier, on a fresh ref).
#
# FAIL-FAST + FAST-FIX RING (2026-07-17 maintainer directive). [FABLE-5]
# (1) FAIL-FAST: while polling, the moment any GATING leg has CONCLUDED failure the
# gate REDs immediately instead of waiting for every other leg — a genuine `failure`
# from the authoritative NEWEST workflow run/attempt is never forgiven, so
# every eventual render REDs anyway; the wait was pure latency on the verdict. A red
# PR learns its fate in roughly the time of its fastest failing leg (~2-4 min for
# clippy/fmt/test-compile classes) instead of the full sibling wall-clock (~30-40
# min). Soundness guards live in scripts/ci_summary_gate.py §FAIL-FAST: the mid-poll
# scan runs over the SAME forgiveness-filtered set the final render judges (a
# cancelled-then-rerun leg or race-loser select can never fire it), advisory legs
# never fire it, a red leg with a same-name rerun already in flight stands down, and
# one immediate grace re-poll must re-observe the failure before the red is emitted.
# (2) FAST-FIX RING: when this gate REDs on a pull_request run for a PIPELINE-OWNED
# PR (armed for auto-merge, or labeled review:pass / review:changes; never drafts or
# review:needs-user / needs:user holds), the fast-fix ring rings the
# jeswr/agent-account-registry dispatcher (the same REGISTRY_RING_TOKEN doorbell
# batch-merge.yml's ring job uses) so its repair sweep enumerates the red PR NOW
# instead of on the next cron tick. The registry's ci-fix admission is derived from
# the PR's GATE STATE (its PLAN snapshots per-PR CI status), so ringing is
# sufficient; deliberately NO needs:ci-fix label fallback — the registry enumerator
# treats needs:* PR labels as HUMAN-owned holds that EXCLUDE a PR from the repair
# loop, so a label would do the opposite of triggering a fix. Without the token
# (fork PR head / secret unconfigured) the ring skips with a notice and the registry
# cron remains the backstop. The ring LIVES IN ITS OWN WORKFLOW,
# .github/workflows/fast-fix-ring.yml, triggered via `workflow_run` on ci-summary's
# completion — NOT as a job in this file. That placement is a SECURITY REQUIREMENT
# (sparq-org/sparq#3474): the ring holds the cross-repo REGISTRY_RING_TOKEN, and a
# `pull_request`-triggered workflow takes its definition from the PR HEAD where
# same-repo agent branches receive repository secrets, so a job here could be edited
# by a PR to exfiltrate the token. `workflow_run` always runs the default-branch copy
# of the file, isolated from PR-head content — see that file's header for the full
# threat model + adversarial self-check.
#
# NEWEST WORKFLOW RUN WINS (#3505). [GPT-5.6] Check-run presence/name is not the
# authority for Actions attempts: concurrency cancellation leaves terminal job
# checks from an older run on the same SHA; re-runs reuse a run id; duplicate job
# names collide across workflows; and a disabled/rewritten job can evaporate its
# check-run even though the workflow run itself is green. The script therefore
# lists workflow-runs for this head SHA and selects the newest run by
# created_at/id and its newest run_attempt per workflow_id. Every older run is a
# NON-EVENT, regardless of cancelled/failure conclusion. It reads completed runs
# (and every re-run attempt) through the attempt-scoped Jobs API, then uses the
# workflow-run verdict as a run-level backstop when checks are missing. A newest
# FAILURE still REDs exactly as before.
# A newest CANCELLED run is auto-re-dispatched ONCE; run_attempt is the durable
# marker and an in-process attempted-set prevents repeated POSTs during API lag.
# If that retry is cancelled or does not advance, the gate fails loudly with
# "superseded-legs, re-run required" instead of misreporting a test failure or
# hanging. Total wait caps are unchanged; this remains a pure waiter/poller and
# never executes tests.
#
# IMPLEMENTATION (sq-90cv4). [FABLE-5] The poll loop + verdict live in
# scripts/ci_summary_gate.py (extracted from the previous inline bash so the
# semantics are UNIT-TESTED — scripts/tests/test_ci_summary_gate.py, run as a HARD
# step in docs-quality.yml's `ci-scripts` job). This file keeps the doctrine; the
# script keeps the mechanics.
name: ci-summary

on:
  # [FABLE-5] Draft-tier CI: the default types PLUS ready_for_review — without it
  # the un-draft moment would run NOTHING and the head would keep its draft-tier
  # gate result (the exact stale-green the integrity invariant forbids).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # [OPUS-4.8] Merge queue: GitHub runs the required check(s) on a temporary
  # `merge_group` ref before merging. ci-summary is the SINGLE required check, so it
  # MUST run here to produce the `ci-summary / gate` check on that ref. Without this
  # the queue would hang forever waiting for the check.
  #
  # [FABLE-5] TIERED / SUBSET MERGE-QUEUE CHECK-SET (2026-07-18 maintainer directive —
  # honesty fix, PR #3511 review finding 6a). The queue does NOT run an identical
  # check-set to a PR. By explicit maintainer direction the merge_group runs only the
  # PR-RELEVANT SUBSET: several heavy siblings dropped their `merge_group` trigger
  # because they already ran + gated on the PR head and the queue re-run added
  # wall-clock per enqueue with NO new signal — notably formal-verification.yml and
  # fuzz.yml (both now PR-head + post-merge-push only), and CodeQL, which is DISABLED
  # repo-wide by separate maintainer direction. The gate stays sound because it POLLS
  # whatever sibling check-runs actually exist on the ref (it never hard-codes a
  # required list): a sibling that does not trigger on merge_group is simply absent
  # (never "expected but missing"), and a docs/orchestration-only queued batch further
  # narrows the Rust lanes via the merge-group change-class gate (ci.yml/feature-
  # matrix.yml `changes` jobs). The SAFETY NET for a lane the queue skips is the
  # POST-MERGE push-to-main run of that lane (+ the nightly-full-sweep backstop and
  # the formal-/selection-alarm liveness monitors) — detection-after-merge with
  # revert / fix-forward, deliberately traded against per-enqueue wall-clock. This is
  # a maintainer-directed RISK POSTURE, not an accident; see docs/branch-protection.md
  # and each lane's header for the per-lane rationale.
  merge_group:
  push:
    branches: [main]

# The gate READS check-runs + commit statuses for the head commit, plus
# the repo's queued workflow-run count (the read side of `actions` — the sq-90cv4
# saturation signal; a permissions failure there degrades to the progress-only signal, it never
# fails the gate by itself), plus the PR's live draft state (`pull-requests: read`
# — the draft-tier conclusion-time re-check; a failure there fail-closes to RED,
# never to a pass). `actions: write` is narrowly required by #3505 for the bounded
# once-only POST that re-runs a newest cancelled workflow; it grants no source write
# and the gate remains test-execution-free.
permissions:
  checks: read
  statuses: read
  contents: read
  actions: write
  pull-requests: read

# One in-flight gate per PR (or per branch on push). Cancel a superseded run so a
# new push doesn't leave a stale, slowly-timing-out gate behind.
concurrency:
  group: ci-summary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # [FABLE-5] Draft-tier CI: the check-run name is TIERED (the same marker
    # expression ci-select.yml uses). A draft pull_request payload renders
    # `gate, draft-tier`; every other event/state (non-draft PR, merge_group,
    # push) renders EXACTLY `gate` — the branch-protection ruleset's required
    # context, which a draft-tier run therefore can never satisfy (the
    # structural half of the integrity invariant above). Pinned by
    # scripts/tests/test_ci_select_wiring.py::TestRequiredCheckAnchor.
    name: gate${{ github.event.pull_request.draft == true && ', draft-tier' || '' }}
    runs-on: ubuntu-latest
    # > the loop's ABSOLUTE budget: ~37 min base (unchanged from the pre-sq-90cv4
    # cap) + up to ~30 min of saturation extension + API overhead. The loop caps
    # itself under this wall-clock so it emits a clear timeout error first. In the
    # normal (unsaturated) case the gate converges exactly as fast as before —
    # the extension only ever activates at base-budget exhaustion under a
    # saturated/progressing queue.
    timeout-minutes: 80
    steps:
      # Sparse checkout of ONLY the gate script + the advisory registry it reads: the
      # gate needs no sources. (No partial-clone filter is configured — this is sparse
      # checkout only, not a blobless clone.) Same trust model as before — on
      # pull_request the workflow file itself already comes from the merge ref, so
      # scripting from the same ref does not widen anything. [FABLE-5] [SONNET-4.6]
      # [OPUS-5] #3773: `.github/advisory-registry.json` is LOAD-BEARING — it is the
      # ONLY thing that can make a check-run non-gating, and the gate exits 1 loudly
      # when it is absent. Pinned by scripts/tests/test_ci_summary_gate.py
      # ::TestAdvisoryRegistryWiring so this list cannot silently drop it again.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_summary_gate.py
            .github/advisory-registry.json
          sparse-checkout-cone-mode: false
      - name: Wait for all other checks, then aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # On pull_request the head commit is the PR head; on push AND on merge_group
          # it's github.sha (the merge_group ref's commit) — github.event.pull_request
          # is undefined there, so the fallback selects the right SHA automatically and
          # the check-run discovery reads the merge_group commit's siblings. [OPUS-4.8]
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # This workflow RUN's id — unique to THIS gate run. Every check-run's
          # details_url embeds the run id of the workflow run that produced it
          # (…/actions/runs/<RUN_ID>/job/<JOB_ID>), so we self-exclude by exact
          # run id rather than by the job NAME. A name match ("gate") is fragile:
          # it would also drop any FUTURE sibling job literally named `gate` in any
          # workflow, undermining the "add/rename jobs freely" goal. The run id is
          # ours alone, so the exclusion is exact and collision-proof (anchored to
          # "/runs/<id>(/|$)" in the script). [OPUS-4.8]
          SELF_RUN_ID: ${{ github.run_id }}
          # [FABLE-5] Draft-tier CI: the tier THIS run evaluates is decided by its
          # own trigger payload — pull_request + draft == true => draft tier. The
          # script re-checks the PR's LIVE draft state (PR_NUMBER) at conclusion
          # time and refuses a draft-tier success on a now-ready PR ("stale
          # draft-tier run, full run pending"). All three are empty off the PR
          # path (push/merge_group), which the script reads as full tier.
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci_summary_gate.py
