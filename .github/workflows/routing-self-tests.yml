permissions:
  contents: read

concurrency:
  group: routing-self-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Routing contract self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate routing schema and resolver/planner contracts
        run: |
          set -euo pipefail
          python3 scripts/routing-validate.py --self-test
          python3 scripts/routing-validate.py
          python3 scripts/route-resolve.py --self-test
          # [OPUS-5] ready-issues.py was in the `paths:` filter above but its --self-test was
          # NEVER invoked here, so its assertions were dead in this repo's CI and first ran
          # inside the registry's dispatch tick — where a failure breaks EVERY target at once.
          python3 scripts/ready-issues.py --self-test
          python3 scripts/dispatch-plan.py --self-test
          python3 scripts/batch-merge.py --self-test
          python3 scripts/tests/test_readiness_visibility.py
          # [OPUS-5] a deprecated model must not reappear in ANY routing position — the routing
          # table, a .claude/settings.json agent hook, a workflow JS dispatch site, or agent
          # frontmatter. This suite also pins its OWN wiring in this workflow structurally
          # (parsed YAML, not substrings), so `if: false` on the job or the step reds it.
          python3 scripts/tests/test_no_deprecated_models.py
          # [OPUS-5] sq-sgu1.2: the harness-workflow dispatch contract — every producing stage
          # of every `.claude/workflows/*.js` carries a defined, closed schema (the
          # schema-guard trap of research/fable-work-plan.md §6.3), every script still parses,
          # and each is discoverable per the durability contract. Structural only: it reads the
          # scripts, never runs or writes them (that surface is maintainer-applied).
          python3 scripts/tests/test_workflow_dispatch_contract.py
          # [OPUS-5] reg#677: the PR `area:` deriver + its YAML seam. The suite is
          # invoked HERE and that invocation is itself pinned by
          # test_pr_area_labels.py::TestSelfTestIsActuallyInvoked — a suite nobody
          # runs cannot go red.
          python3 scripts/pr-area-labels.py --self-test
          python3 scripts/tests/test_pr_area_labels.py
          # [OPUS-5] #4145: the front-door renderer. --self-test validates the SHIPPED
          # orchestration/start-here.toml (a malformed curated file must fail on ITS PR, not at the
          # next scheduled refresh of the maintainer's front door); the suite pins the drop /
          # fail-closed / truncation rules and refresh-start-here.yml's own wiring.
          # [OPUS-5] sparq#5098: no `--self-test` anywhere under scripts/ may reach a live
          # write. Static (AST) — it never imports or runs the files it scans. The suite also
          # pins its OWN wiring here structurally, so `if: false` on this job or this step reds it.
          python3 scripts/tests/test_selftest_never_writes.py
          python3 scripts/render-start-here.py --self-test
          python3 scripts/tests/test_start_here_render.py

      # [OPUS-5] The bd->issues migration family, previously ungated on a PR (see the `paths:`
      # note above). All are hermetic: stdlib only, no gh/network/token. `bd-to-issues.py
      # --self-test` carries the migration TRUST-BOUNDARY assertions (_writer_logins permission
      # contract + the migration_owned author check), which is precisely the surface that must
      # fail on the PR that weakens it rather than at the next bulk `--apply`.
      - name: Validate the bd->issues migration and autoclose contracts
        run: |
          set -euo pipefail
          python3 scripts/bd-to-issues.py --self-test
          python3 scripts/ci-close-merged-beads.py --self-test
          # [OPUS-5] #5886: the bd<->GitHub dependency-graph AUDIT tool, recovered here from the
          # unmerged branch that authored it. It is the only producer in the tree of the
          # `missing_active` / `spurious` / `cycles_bd_open` figures that #3817's Verification
          # section names, so a native-blocker discrepancy surfaced by `ready-issues.py` (whose
          # `open_blocker_count` unions the native and marker channels) now has something to run.
          # Its --self-test is hermetic by CONSTRUCTION, not by stubbing: the suite reaches only
          # bd_blocker_edges / find_cycles / bd_id_map, none of which reach the `run()` subprocess
          # seam. It pins the ORIENTATION contract this family shares — the export record
          # {issue_id: X, depends_on_id: Y} means X is BLOCKED BY Y. Verified by mutation:
          # inverting that orientation, narrowing BLOCKER_TYPES back to ("blocks",) (the
          # row-dropping bug in its module docstring), or dropping the marker-provenance check
          # each turns this command red.
          python3 scripts/audit-issue-deps.py --self-test
