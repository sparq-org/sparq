      # wire value) must run that assertion. Without this entry the contract file would be
      # the one input to the gate that can change without the gate running — which is the
      # silent-invisibility class it exists to close.
      - "orchestration/registry-contract.toml"
      - "scripts/routing-validate.py"
      - "scripts/route-resolve.py"
      - "scripts/dispatch-plan.py"
      - "scripts/ready-issues.py"
      # [OPUS-5] PR #4925 review — THE INPUTS THE PARTITION GUARD READS FROM THE TREE.
      # `ready-issues.py`'s `workspace_roots()` derives the `area:` partition algebra from the
      # workspace manifest plus the crate directory listing, and REFUSES to plan when the two
      # disagree. Neither input was in this filter, so the one file that can turn the guard into
      # a hard PLAN stop — root `Cargo.toml` — could change with the guard's own tests never
      # running, merge green, and stop dispatch for BOTH target repositories on the next tick.
      # `crates/*/Cargo.toml` (not `crates/**`) is deliberate: what matters here is the SET of
      # crate partition roots, which changes exactly when a crate manifest is added, removed or
      # renamed. `crates/**` would fire this lane on essentially every Rust PR in a 67-crate
      # workspace for no additional coverage of that set.
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      # [OPUS-5] the bd->issues migration pair. Their --self-tests were DEAD in this repo's
      # PR CI: bd-to-issues.py's was invoked by no workflow at all, and
      # ci-close-merged-beads.py's ran only POST-merge inside bead-autoclose.yml
      # (pull_request_target: [closed], ref: main), i.e. after the change it would have
      # caught was already on main. They also share a marker regex that must not drift
      # ("keep in sync with scripts/ci-close-merged-beads.py _MARKER_RE"), so a change to
      # either must re-run BOTH here.
      - "scripts/bd-to-issues.py"
      - "scripts/ci-close-merged-beads.py"
      # batch-merge.py imports ci_select.classify_change (#3433 class-partitioned
      # batching) — run its hermetic self-test on the PR that could break either side.
      - "scripts/batch-merge.py"
      - "scripts/ci_select.py"
      # [OPUS-5] the readiness VISIBILITY suite — pins the occupancy-attribution,
      # in-progress-review and local/orchestrator-parity contracts, and pins this
      # workflow's own run block to the scripts it must invoke.
      - "scripts/tests/test_readiness_visibility.py"
      # [OPUS-5] the model-DEPRECATION guard (maintainer directive 2026-07-26: fable + opus-4.8
      # retired in favour of opus5; docs writing off haiku/sonnet onto sol). It is cross-surface
      # — a model is selected in FOUR places, not just the routing table — so each guarded
      # surface is its own trigger. Without these entries a PR could reintroduce a retired model
      # in settings.json or a workflow JS dispatch site without ever running this gate.
      - "scripts/tests/test_no_deprecated_models.py"
      - ".claude/settings.json"
      # [OPUS-5] sq-sgu1.2: EVERY harness workflow script, not only the one carrying the
      # canonical TIER table. test_no_deprecated_models.py::TestWorkflowJsDispatch scans them
      # ALL for `agent({model: ...})` dispatch values, and test_workflow_dispatch_contract.py
      # pins the schema-on-every-producing-stage / parse / durability contracts over the same
      # set — so an edit to any of them must run this gate. Without these entries the guards
      # scan files their own trigger cannot see, which is how a workflow dispatch site changes
      # without the gate that guards it ever running.
      #
      # PR #4967 review: this is a DIRECTORY glob, not an enumeration of the files that happen to
      # exist today. An enumeration cannot cover a workflow that does not exist yet — a newly
      # added fifth script matches no filter, this lane never runs, and it merges unlinked,
      # unschema'd or unparseable. Nor can the suite's own "every workflow is a path trigger"
      # assertion catch that, since it only runs when this lane does.
      - ".claude/workflows/*.js"
      # Retained alongside the glob (redundant for CI, load-bearing for a guard):
      # test_no_deprecated_models.py::test_routing_surfaces_are_path_triggers asserts this exact
      # literal is a trigger on both events.
      - ".claude/workflows/fable-architect-drain.js"
      - "scripts/tests/test_workflow_dispatch_contract.py"
      # [OPUS-5] the LABELS -> MODEL CHAIN surfaces (review of PR #4211). The `area:gui` carve-out
      # is decided in route-resolve.py from labels written by these two files, so the end-to-end
