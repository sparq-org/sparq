# [OPUS-4.8] sq-40y0 — deploy the sparq feature-showcase site (site/) to GitHub Pages.
#
# WHAT THIS PUBLISHES: the Next.js static export served ROOT-RELATIVE (basePath '') at the custom domain
# https://sparq.jeswr.org/ (org-migration cutover, sq-uj38w),
# PLUS the existing benchmark dashboard preserved at /dev/, PLUS the DISTINCT
# operational GUI frontend (gui/app) hosted at /app/, PLUS the mdBook guide at /guide/
# ([OPUS-5] issue #5022 — see "THE mdBOOK GUIDE AT /guide/" below). The dashboard tree
# (`dev/`) lives on the `benchmark-data` branch (written by bench.yml); this workflow
# fetches that tree and OVERLAYS it into the export's `out/dev/` before upload, so a
# single Pages artifact serves the showcase root, the unchanged dashboard at
# /dev/bench/, AND the live "Try the GUI" workbench at /app/.
#
# THE /app/ GUI (sq-vnd0i, maintainer's Option B): the marketing site's `/try` route
# stays the lightweight in-browser SPARQL REPL playground; the live operational GUI is a
# SEPARATE destination built from gui/app (a distinct Next.js workbench, NOT the site) and
# overlaid at out/app/ — the site's "App" nav slot (wired in #1004) points there. Same single
# Pages deploy; no Pages-API/source change (build_type is already 'workflow').
#
# HOW /dev/bench IS PRESERVED (traced):
#   1. Pages is served at https://sparq.jeswr.org/ from this workflow
#      (build_type: workflow — the "GitHub Actions" source; the earlier "Deploy from a
#      branch" legacy source has been retired). The benchmark dashboard formerly served
#      from the `benchmark-data` branch root (a root index.html redirect + a dev/ tree:
#      dev/bench/{index.html,dashboard.js,dashboard.css,data.js,...}) is now carried into
#      THIS workflow's artifact via the overlay step below, so /dev/bench/ keeps
#      working under the single Actions-built artifact.
#   2. This workflow does NOT touch the `benchmark-data` branch — bench.yml keeps
#      writing data.js + dev/bench/* there exactly as before. We only READ it.
#   3. After `next build` writes the showcase to out/ (with its OWN root index.html),
#      we `git archive` the `benchmark-data` branch's `dev/` directory into `out/dev/`.
#      The showcase root replaces the old redirect; the dashboard is carried forward
#      verbatim, so https://sparq.jeswr.org/dev/bench/ keeps working.
#   4. `out/.nojekyll` disables Jekyll so `_next/` (underscore-prefixed) assets serve.
#
# PAGES SOURCE (DONE — no longer needs:user): the repo's Pages source is already set to
# "GitHub Actions" (sq-vbq9 resolved; `gh api repos/sparq-org/sparq/pages` reports
# build_type: workflow), so this workflow's deploy step IS the live publisher — the site
# at https://sparq.jeswr.org/ is served from the artifact below, not from any branch
# root. No repo-settings action is outstanding for this workflow. (The alternative —
# committing out/ onto benchmark-data — was rejected: it couples site source to the data
# branch and races bench.yml's root index.html seed.)
#
# THE mdBOOK GUIDE AT /guide/ ([OPUS-5] issue #5022 — the product decision, now MADE):
# Pages has ONE deploy slot and this workflow owns the / root, so the mdBook guide
# (sq-w9sr/sq-h0tr) could not simply grow its own deploy job — a second `deploy-pages`
# would race this one last-writer-wins. Of the three options in
# research/docs-site-single-sourcing-anti-drift.md §7, (a) is chosen: the guide is built
# HERE and overlaid into THIS artifact at out/guide/, exactly like the dev/bench*
# dashboards and the /app GUI. One producer, one deploy slot, no race, and no live URL
# moves (the showcase keeps /, the dashboards keep /dev/bench*, the GUI keeps /app/).
# (b) guide-at-root and (c) two deploy workflows are rejected there with reasons.
#
# docs.yml keeps its build-VALIDATE role: it runs on PRs that touch the guide or any
# source it embeds, and still ships NO deploy job. Both lanes build through the SAME
# scripts/build-guide.sh and pin the SAME mdbook version, so what PRs validate is what
# ships; scripts/check-guide-publish-wiring.py gates that end-to-end wiring (mdbook-pin
# parity, shared builder, overlay dir ↔ book.toml `site-url` ↔ this job's smoke check).

name: pages

on:
  push:
    # [OPUS-4.8] sq-gdhy — rebuild on TWO sources so the paper factory's live numbers
    # stay current. (1) `main`: the site source itself changes (pages, papers, the
    # COMMITTED site/src/data/benchmarks.generated.json). (2) `benchmark-data`: bench.yml
    # pushes a fresh benchmark point THERE (not to main), and the paper/showcase numbers
    # are synced FROM that branch at build time (site/scripts/sync-benchmarks.mjs reads
    # origin/benchmark-data:dev/bench/data.js). Before this, a new benchmark point only
    # reached the published papers on the NEXT unrelated main push — the data-branch
    # change alone did not re-publish. A benchmark-data-triggered run still builds the
    # `main` site source (the benchmark-data branch is an orphan dashboard branch with no
    # site/), so it rebuilds main's site against the freshly-pushed data.
    #
    # NO double-fire: bench.yml writes benchmark-data in TWO separate pushes — (a) the
    # github-action-benchmark data.js push (the one carrying the new numbers; NO [skip ci],
    # so it triggers this rebuild) and (b) the "Seed Pages dashboard" push, whose commit
    # message carries [skip ci] (so it never re-triggers). The `concurrency: pages` group
    # below already serialises any overlapping main+benchmark-data runs into one live deploy.
    branches: [main, benchmark-data]
  workflow_dispatch:

# Least-privilege (Scorecard TokenPermissions): read by default; the deploy job
# opts into the Pages/OIDC writes it needs.
permissions:
  contents: read

# Never cancel an in-flight Pages deploy; queue instead so a half-uploaded artifact
# can't leave the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Gate the publish to the two first-party branches CI writes (PRs build nothing here).
    # [OPUS-4.8] sq-gdhy — `benchmark-data` joins `main` so a fresh benchmark point
    # re-publishes the paper factory; both are CI-written branches, never PR refs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/benchmark-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # [OPUS-4.8] sq-gdhy — ALWAYS build the `main` site source, even when this run was
          # triggered by a benchmark-data push: the benchmark-data branch is an orphan
          # dashboard branch (dev/ + a root redirect, NO site/), so checking it out would
          # have nothing to build. fetch-depth:0 still pulls origin/benchmark-data so the
          # overlay + sync-benchmarks steps read its freshly-pushed dev/bench/data.js.
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [FABLE-5] CI-economy (2026-07-18 directive 2b): this wasm lane compiles
          # the same sparq-wasm dependency stack as the other js/pages/gui/site wasm
          # lanes — ONE shared dependency cache across them keeps demand inside the
          # 10 GB Actions-cache budget (sq-3sbrr doctrine: save on push-to-main
          # only, so PR runs are restore-only and never churn the shared budget).
          shared-key: site-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # [FABLE-5] PR #3511 review finding 5: redundant second cargo cache REMOVED —
      # the Swatinem/rust-cache above (shared-key: site-wasm) already caches
      # ~/.cargo/registry + ~/.cargo/git + target/ across the js/pages/gui/site wasm
      # lanes, restore-only off main. The former PR-scoped `actions/cache`
      # (pages-wasm-…-hashFiles(Cargo.lock)) covered the same paths and only churned
      # the shared 10 GB Actions-cache budget with a duplicate PR-scoped copy.

      # [OPUS-5] #5776 — prebuilt, SHA-pinned, exactly-versioned wasm-pack (sq-khm3f):
      # a `cargo install` here recompiles it from crates.io and flakes on a registry blip.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0

      # Build the lean wasm bundle (crates/sparq-wasm → js/wasm) that the live REPL loads.
      # [OPUS-4.8] sq-jpki.1 — repo-root npm workspaces: `js/` is now a workspace member and the
      # per-member lock was dropped; this `npm ci` (run in js/) installs the js member's closure
      # FROM the repo-root `package-lock.json`. wasm-pack is already on PATH (installed above), so
      # js/'s `prepare` git-pin build is satisfied. `npm run build:wasm` then (re)builds the lean
      # bundle explicitly, exactly as before — the export tree this produces is unchanged.
      - name: Build sparq wasm bundle
        working-directory: js
        run: |
          npm ci
          npm run build:wasm

      # [OPUS-4.8] sq-0po6 — build the tier-b "W-reason" bundle (crates/sparq-reason-wasm,
      # with --features explain) that drives the live /surface/inference page. Its
      # wasm-pack output stays in the crate's pkg/; the site's prebuild sync-wasm step
      # copies it into public/wasm/reason/. Separate from the lean bundle so the landing
      # page stays light (the page lazy-loads it on first interaction).
      - name: Build W-reason wasm bundle
        working-directory: js
        run: npm run build:reason-wasm

      # [OPUS-4.8] sq-11zy — build the tier-b "W-rsp" bundle (crates/sparq-rsp-wasm, the
      # windowed RSP-QL stream processor) that drives the live /surface/streaming-rsp page.
      # Its wasm-pack output stays in the crate's pkg/; the site's prebuild sync-wasm step
      # copies it into public/wasm/rsp/. Separate from the lean bundle so the landing page
      # stays light (the page lazy-loads it on first interaction).
      - name: Build W-rsp wasm bundle
        working-directory: js
        run: npm run build:rsp-wasm

      # [OPUS-4.8] sq-xoxu — build the tier-b "W-text" bundle (crates/sparq-text-wasm, the
      # BM25 inverted index + `text:` magic predicates) that drives the live
      # /surface/full-text page. Its wasm-pack output stays in the crate's pkg/; the site's
      # prebuild sync-wasm step copies it into public/wasm/text/. Separate from the lean
      # bundle so the landing page stays light (the page lazy-loads it on first interaction).
      - name: Build W-text wasm bundle
        working-directory: js
        run: npm run build:text-wasm

      # [OPUS-4.8] sq-gum8 — install the Typst CLI so the paper-factory build step
      # (site/scripts/build-papers.mjs, run by `prebuild`) can compile site/papers/*.typ
      # into the downloadable PDFs + the in-site HTML renders. Pinned to a release tag +
      # SHA-256-verified so the toolchain is reproducible. (ubuntu-latest is x86_64.)
      - name: Install Typst CLI
        run: |
          set -euo pipefail
          TYPST_VERSION=v0.15.0
          TYPST_SHA256=59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
          url="https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -sSfL -o /tmp/typst.tar.xz "$url"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xf /tmp/typst.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          cp /tmp/typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      # [OPUS-4.8] sq-jpki.1 — repo-root npm workspaces: `site/` is a workspace member; this
      # `npm ci` (run in site/) installs the site member's dependency closure FROM the repo-root
      # `package-lock.json` (no per-member lock anymore). It does NOT re-run js/'s wasm `prepare`
      # (a member-dir `npm ci` installs only that member's closure), so the wasm bundle built in
      # the step above is preserved. `npm run build` then runs prebuild (sync js/wasm →
      # site/public/wasm + build papers) and `next build` → out/ with basePath /sparq, exactly as
      # before — the migration changes only WHERE deps resolve from, not the produced out/ tree.
      - name: Build static site
        working-directory: site
        # [OPUS-4.8] sq-uj38w — org-migration Pages cutover (atomic flip). The site now serves at the
        # ROOT of the custom domain https://sparq.jeswr.org/ (custom domain set via site/public/CNAME
        # → out/CNAME below), so the Pages build must emit ROOT-RELATIVE assets (/_next/… not
        # /sparq/_next/…). NEXT_PUBLIC_BASE_PATH='' selects basePath '' in site/next.config.ts (the SAME
        # switch the Tauri build uses). basePath and the custom domain MUST flip together in THIS one
        # deploy — changing only one would break every asset/route URL.
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          npm ci
          npm run build   # prebuild copies js/wasm → site/public/wasm + builds papers, then next build → out/ (root-relative, basePath '')

      # [OPUS-4.8] sq-vnd0i — build the DISTINCT operational GUI frontend (gui/app) as its hosted
      # "Try the GUI live" web target and OVERLAY it at /app/ on the SAME Pages artifact.
      #
      # The maintainer picked Option B (bead sq-vnd0i): /try stays the lightweight in-browser
      # SPARQL REPL playground (the site's `/try` route, unchanged); the live operational GUI is a
      # SEPARATE destination hosted at https://sparq.jeswr.org/app/ — a sub-path of THIS
      # single GitHub-Actions Pages deploy (the site's "App" nav slot, wired in #1004). This step
      # makes that route real: until now `site/src/app/app/page.tsx` was an honest PLACEHOLDER
      # promising the hosted app "will live here at /app/"; this overlay delivers it.
      #
      # The GUI frontend embeds the in-tab WASM engine, so it consumes the SAME lean
      # `--features shacl,jsonld` bundle already built into `js/wasm/` above; its `prebuild`
      # `sync-wasm` copies that bundle into `gui/app/public/wasm/` before `next build`. `build:web`
      # leaves NEXT_PUBLIC_BASE_PATH unset, so `gui/app/next.config.ts` defaults basePath +
      # assetPrefix to `/app` (every `_next/*` chunk URL is baked as `/app/...`), and
      # the GUI passes the same `/app` prefix to the @sparq/client wasm loader, so the
      # runtime engine fetch is `/app/wasm/...` — exactly where the overlay places it. (Pre-cutover
      # sq-uj38w this sub-path was /sparq/app; the site now serves at the custom-domain ROOT so it
      # collapsed to /app.)
      #
      # `npm install` at the repo root resolves the gui/app workspace member's deps from the
      # repo-root package-lock (mirrors gui.yml's gui-app job); it does NOT touch the wasm bundle.
      - name: Install gui/app workspace dependencies
        run: npm install
      - name: Build the operational GUI frontend (hosted web target)
        working-directory: gui/app
        run: npm run build:web   # presync check + prebuild sync-wasm (js/wasm → public/wasm), then next build → out/ (basePath /app)

      # [OPUS-4.8] sq-d8or — anti-drift: link-check the BUILT site HTML before publish.
      # The docs-quality `internal-links` job (sq-5fd1) lychee-checks the repo MARKDOWN;
      # this extends that scope to the static-export HTML the Pages site actually serves —
      # catching renamed routes / stale cross-links / dangling #anchors that markdown linting
      # cannot see. lychee runs --offline (deterministic, no network) over site/out, remapping
      # the /sparq GitHub-Pages base path to the export root. Runs BEFORE the dev/ overlay so
      # it checks only THIS site's source (the overlaid benchmark dashboard is excluded by the
      # script anyway). The remap + teeth live in a shared, self-tested script
      # (scripts/check-site-links.sh + scripts/tests/test_check_site_links.sh, run in
      # docs-quality's ci-scripts job) so the logic is pinned and reusable locally. A broken
      # internal link FAILS the build → no broken deploy. lychee is installed via the same
      # SHA-pinned taiki-e/install-action this repo already trusts (cf. docs-quality typos);
      # 0.23.0 is the version lycheeverse/lychee-action@v2.8.0 ships, so behaviour matches the
      # markdown gate.
      - name: Install lychee
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: lychee@0.23.0
      - name: Link-check the static-export HTML (lychee --offline)
        run: bash scripts/check-site-links.sh site/out

      # ---- Build the mdBook guide for the /guide/ mount ----
      # [OPUS-5] issue #5022 — the guide's publish half. docs.yml validates the same guide on
      # PRs but deliberately ships no deploy job (one Pages slot, owned here); this is where it
      # actually reaches the web. The mdbook version below MUST equal docs.yml's pin — the two
      # lanes are only equivalent if they build with the same renderer, and
      # scripts/check-guide-publish-wiring.py fails the build if they diverge.
      - name: Install mdbook (pinned)
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: mdbook@0.4.40
      # Shared with docs.yml so the validate lane and the publish lane cannot drift. The script
      # carries the load-bearing detail: mdBook exits 0 on a broken {{#include}}/anchor
      # (rust-lang/mdBook#1094), so it greps the build log for [ERROR] — without that, an anchor
      # rename in README.md/SKILL.md would PUBLISH a guide full of raw include directives, green.
      - name: Build the mdBook guide
        run: bash scripts/build-guide.sh book

      # ---- Preserve the existing benchmark dashboard(s) at /dev/ ----
      # [OPUS-4.8] sq-zngy — fold ALL `dev/bench*` subtrees (not just dev/bench).
      # bench.yml writes benchmark-data:dev/bench (benchmark-data-dir-path: dev/bench);
      # bench-ec2.yml writes benchmark-data:dev/bench-ec2 (benchmark-data-dir-path:
      # dev/bench-ec2) — a SECOND live dashboard dir on the SAME benchmark-data branch.
      # The `git archive origin/benchmark-data dev` below already carries the ENTIRE
      # dev/ tree verbatim (so any dev/bench* subtree that exists on the branch lands in
      # out/dev/ — the EC2 dashboard does NOT 404 after the Pages-source cutover). The
      # per-subtree assertion that follows makes that GLOB explicit + regression-proof:
      # every dev/bench* on the branch MUST appear in the assembled artifact, so a future
      # narrowing of the archive scope (e.g. back to just `dev/bench`) fails the build.
      - name: Overlay benchmark dashboard(s) (dev/bench*) from benchmark-data
        working-directory: site
        run: |
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet origin/benchmark-data >/dev/null; then
            echo "Overlaying dev/ (all dev/bench* subtrees) from origin/benchmark-data into out/dev/"
            mkdir -p out/dev
            # Extract the WHOLE dev/ subtree of benchmark-data straight into out/dev/.
            # This carries every dev/bench* dashboard dir (dev/bench, dev/bench-ec2, …).
            git -C "$GITHUB_WORKSPACE" archive origin/benchmark-data dev \
              | tar -x --strip-components=1 -C out/dev
            # GLOB-FOLD ASSERTION: every dev/bench* subtree that exists on the branch must
            # have been folded into the artifact. Catches a regressed/narrowed archive scope.
            missing=0
            while IFS= read -r sub; do
              [ -n "$sub" ] || continue
              if [ -d "out/dev/${sub#dev/}" ]; then
                echo "OK: folded benchmark-data:${sub} -> out/dev/${sub#dev/}"
              else
                echo "::error::benchmark-data:${sub} exists on the branch but is MISSING from the Pages artifact (overlay regression)"
                missing=1
              fi
            done < <(git -C "$GITHUB_WORKSPACE" ls-tree -d --name-only origin/benchmark-data dev/ \
                       | grep -E '^dev/bench' || true)
            [ "$missing" -eq 0 ] || { echo "::error::one or more dev/bench* dashboards were not folded into out/dev/"; exit 1; }
          else
            echo "::warning::origin/benchmark-data not found — dashboard NOT overlaid this run."
          fi
          # Static-export hygiene: disable Jekyll so _next/ assets are served.
          touch out/.nojekyll

      # ---- Overlay the operational GUI frontend at /app/ ----
      # [OPUS-4.8] sq-vnd0i — place the gui/app hosted web export INTO out/app/, mirroring the
      # dev/bench overlay above (a sub-tree of the SAME single Pages artifact). The GUI's
      # static export (basePath /app) writes its index.html at the export ROOT with assets
      # baked as /app/_next/... and /app/wasm/... , so serving it at /app/
      # means copying the WHOLE export tree (index.html, _next/, wasm/, 404.html) into out/app/.
      # This step runs AFTER the lychee link-check (which checks only the SITE's own HTML) and
      # DELIBERATELY OVERWRITES the site's /app placeholder marketing card (site/src/app/app/) —
      # the real hosted GUI replaces the "coming soon" placeholder at the SAME route. We rsync the
      # GUI tree on top of out/app/ (rather than rm+mv) so the placeholder's _next assets cannot
      # leave orphans. .nojekyll already touched above covers the GUI's _next/ underscore assets.
      - name: Overlay operational GUI frontend (out/app/)
        working-directory: site
        run: |
          set -euo pipefail
          gui_out="$GITHUB_WORKSPACE/gui/app/out"
          if [ ! -f "$gui_out/index.html" ]; then
            echo "::error::gui/app web export missing ($gui_out/index.html) — the GUI build step did not produce out/"
            exit 1
          fi
          echo "Overlaying gui/app hosted web export -> out/app/ (replaces the /app placeholder)"
          mkdir -p out/app
          # Mirror the GUI export over the placeholder; --delete clears the stale placeholder
          # tree (its index.html + any chunk it referenced) so only the real GUI remains.
          rsync -a --delete "$gui_out"/ out/app/
          # OVERLAY ASSERTION: the engine asset + the app entry MUST land where the baked URLs
          # (/app/...) expect them, or the hosted GUI would 404 its own engine/chunks.
          for f in out/app/index.html out/app/wasm/sparq_wasm_bg.wasm; do
            if [ -f "$f" ]; then
              echo "OK present: ${f#out/} ($(wc -c < "$f") bytes)"
            else
              echo "::error::expected GUI artifact MISSING after overlay: ${f#out/}"
              exit 1
            fi
          done
          # Sanity: the GUI index must reference the /app asset prefix (catches a basePath
          # regression that would silently break every asset/chunk URL once hosted).
          if grep -q '/app/_next/' out/app/index.html; then
            echo "OK: out/app/index.html references the /app asset prefix"
          else
            echo "::error::out/app/index.html does NOT reference /app/_next/ — basePath regression (the GUI would 404 its chunks when hosted)"
            exit 1
          fi
          echo "OK: operational GUI overlaid at out/app/" >> "$GITHUB_STEP_SUMMARY"

      # ---- Overlay the mdBook guide at /guide/ ----
      # [OPUS-5] issue #5022 — place the rendered guide (book/book) into out/guide/, mirroring
      # the dev/bench* and /app overlays: another sub-tree of the SAME single Pages artifact, so
      # there is still exactly ONE producer for the one Pages deploy slot.
      #
      # Runs AFTER the lychee link-check, which checks only the SITE's own export. The guide is a
      # separate first-party render with its own link shape (mdBook resolves chapter links
      # relatively, and the `link-fixup` preprocessor rewrites the {{#include}}d repo-relative
      # links to absolute github.com URLs, which lychee --offline cannot resolve anyway); its
      # broken-include gate is the [ERROR] grep in scripts/build-guide.sh, not lychee.
      #
      # UNLIKE the /app overlay there is NO placeholder route to replace here — the site export
      # has no /guide route — so an out/guide that ALREADY exists means the site grew one and
      # this step would silently clobber it. That is a hard failure, not a merge.
      - name: Overlay mdBook guide (out/guide/)
        working-directory: site
        run: |
          set -euo pipefail
          guide_out="$GITHUB_WORKSPACE/book/book"
          if [ ! -f "$guide_out/index.html" ]; then
            echo "::error::mdBook render missing ($guide_out/index.html) — the guide build step did not produce book/book/"
            exit 1
          fi
          if [ -e out/guide ]; then
            echo "::error::out/guide already exists BEFORE the guide overlay — the site export now has its own /guide route, which this overlay would silently clobber. Pick a different mount or drop the site route (issue #5022)."
            exit 1
          fi
          echo "Overlaying mdBook render -> out/guide/"
          mkdir -p out/guide
          # Plain `cp -a` (not the /app overlay's `rsync -a --delete`): that overlay mirrors
          # ONTO a pre-existing placeholder tree and needs --delete to clear its orphans. Here
          # the guard above has already proven out/guide did not exist, so there is nothing to
          # delete and a copy is the whole operation.
          cp -a "$guide_out/." out/guide/
          # MOUNT ASSERTION: mdBook stamps book.toml's `site-url` into the guide's OWN 404.html
          # as <base href="...">. GitHub Pages serves that directory-level 404 for /guide/<typo>,
          # so if the baked base href ever stops matching the sub-path we overlay to, every asset
          # on that page resolves against the wrong root. Assert the two agree here, at the point
          # where the mount is actually chosen.
          if grep -q '<base href="/guide/">' out/guide/404.html; then
            echo "OK: guide 404.html carries <base href=\"/guide/\"> matching the overlay mount"
          else
            echo "::error::out/guide/404.html does not carry <base href=\"/guide/\"> — book.toml's [output.html] site-url has drifted from the /guide/ mount, so the guide's 404 page would 404 its own assets"
            exit 1
          fi
          # NOTE (measured): a second "no raw {{#include}} survived into the HTML" scan was tried
          # here and REMOVED — it false-positives on the guide's own legitimate prose, which
          # discusses the single-sourcing mechanism by name (book/src comments and the README
          # `features-core` anchor both write `{{#include}}` in running text). The broken-include
          # guard is the `[ERROR]` log grep in scripts/build-guide.sh, which runs before this step
          # and whose teeth are pinned in scripts/tests/test_build_guide.sh.
          echo "OK: mdBook guide overlaid at out/guide/" >> "$GITHUB_STEP_SUMMARY"

      # [OPUS-4.8] sq-zngy — ARTIFACT-LEVEL smoke check (NOT a live-URL check).
      # This step asserts the ASSEMBLED Pages output dir (site/out, the exact tree handed to
      # upload-pages-artifact below) rather than probing the live https://sparq.jeswr.org/dev/...
      # URL: the artifact check is deterministic + decoupled from deploy/propagation timing
      # (the live URL lags this run by the deploy + CDN flush), and it catches the dev/bench*
      # reconciliation regression at build time, BEFORE upload. It verifies the artifact
      # CONTENTS, NOT that the site is being served. (Pages source is already build_type:
      # workflow, so this artifact IS what goes live.)
      - name: Smoke-check assembled Pages artifact (dev/bench* dashboards)
        working-directory: site
        run: |
          set -euo pipefail
          fail=0
          # [OPUS-4.8] sq-uj38w — org-migration Pages cutover: the published root MUST carry a CNAME
          # file (= `sparq.jeswr.org`) so this deploy sets the custom domain. Next copies site/public/
          # into the export root, so out/CNAME appears from site/public/CNAME. If it is missing or wrong,
          # the atomic flip would publish a root-relative build WITHOUT the custom domain — hard fail
          # rather than deploy a half-flipped site.
          if [ -f out/CNAME ] && grep -qx 'sparq.jeswr.org' out/CNAME; then
            echo "OK: out/CNAME present and = sparq.jeswr.org (custom domain will be set on deploy)"
          else
            echo "::error::out/CNAME missing or not exactly 'sparq.jeswr.org' — custom-domain flip would not take effect"; fail=1
          fi
          # Core dashboard (dev/bench) MUST always be present — these are hard requirements.
          #   present:            dev/bench/index.html, dev/bench/dashboard.js
          #   present + NON-EMPTY: dev/bench/data.js (the benchmark series; empty = broken overlay)
          for f in out/dev/bench/index.html out/dev/bench/dashboard.js; do
            if [ -f "$f" ]; then echo "OK present: ${f#out/}"; else echo "::error::missing required artifact file: ${f#out/}"; fail=1; fi
          done
          if [ -s out/dev/bench/data.js ]; then
            echo "OK present + non-empty: dev/bench/data.js ($(wc -c < out/dev/bench/data.js) bytes)"
          else
            echo "::error::dev/bench/data.js is missing or EMPTY in the assembled artifact"; fail=1
          fi
          # EC2 dashboard (dev/bench-ec2): assert presence-in-artifact IFF it exists on the
          # benchmark-data branch. bench-ec2.yml is not live until AWS_BENCH_ROLE_ARN is set AND a
          # maintainer dispatches it ([OPUS-5] #3784 retired its crons with the descoped OIDC role), so
          # dev/bench-ec2 may not exist on the branch yet — hard-failing on its absence would
          # brick every deploy and regress sq-iigf. But once the EC2 lane HAS pushed, a missing
          # out/dev/bench-ec2/index.html means the overlay dropped a subtree → hard fail.
          if git -C "$GITHUB_WORKSPACE" ls-tree -d --name-only origin/benchmark-data dev/bench-ec2 2>/dev/null | grep -q .; then
            if [ -f out/dev/bench-ec2/index.html ]; then
              echo "OK present: dev/bench-ec2/index.html (EC2 dashboard folded)"
            else
              echo "::error::dev/bench-ec2 exists on benchmark-data but dev/bench-ec2/index.html is MISSING from the artifact"; fail=1
            fi
          else
            echo "::warning::dev/bench-ec2 not yet present on benchmark-data (bench-ec2.yml has not pushed) — skipping its artifact assertion this run"
          fi
          # [OPUS-5] issue #5022 — the mdBook guide at /guide/. These are HARD requirements: the
          # guide is now a published surface, and an artifact that reaches deploy without it
          # would 404 the guide silently. index.html is the mount's entry point; 404.html is the
          # directory-level 404 GitHub Pages serves under /guide/; css/general.css proves the
          # html backend's asset tree came across (an entry point with no theme assets renders
          # as unstyled text). Deliberately NOT asserting searchindex.json: it exists only while
          # `[output.html.search]` is enabled, so it would turn an unrelated book.toml toggle
          # into a failed deploy.
          for f in out/guide/index.html out/guide/404.html out/guide/css/general.css; do
            if [ -f "$f" ]; then echo "OK present: ${f#out/}"; else echo "::error::missing required guide artifact file: ${f#out/}"; fail=1; fi
          done
          # The entry point must be the mdBook render, not a stray file that happens to sit at
          # that path (e.g. a half-overlaid tree, or a future site route colliding with /guide).
          if grep -q 'Book generated using mdBook' out/guide/index.html 2>/dev/null; then
            echo "OK: out/guide/index.html is an mdBook render"
          else
            echo "::error::out/guide/index.html is not an mdBook render — the guide overlay did not land"; fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "::error::Pages artifact smoke check failed — see errors above"; exit 1; }
          echo "OK: Pages artifact smoke check passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    # [OPUS-4.8] sq-gdhy — mirror the build gate: deploy for either CI-written branch.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/benchmark-data'
    runs-on: ubuntu-latest
    # Pages deployment requires these two writes; everything else stays read-only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
