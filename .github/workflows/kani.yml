# kani — Kani bounded model-checking proof of the `.spqv` + mmap-dict on-disk-format VALIDATORS
# (beads sq-hkud / sq-ueuk, epic sq-toze; addresses memsafety gap MS-G4). [OPUS-4.8] authored
# while Fable unavailable — re-review when Fable returns. Per-crate/per-harness split + timeouts
# + step summary added under sq-otpxg (see RUNNER / STRUCTURE below).
#
# WHY (the MS-G4 gap, from compliance/memsafety/gap-register.md): the unsafe mmap on-disk
# validators are covered by Miri (UB on the pure-Rust sites), the deterministic corruption
# oracle (MS-7), the fuzz lane (MS-9, libFuzzer corpus) and the standalone ASan lane (MS-G3,
# asan.yml). ALL FOUR are EXECUTION-based: they run the validator on SPECIFIC inputs (the
# hand-built corpus, plus whatever libFuzzer reaches). None of them PROVES the validator is
# panic-/OOB-free for EVERY hostile input. MS-G4 asks whether a bounded formal proof closes
# that residue. It does, for the `.spqv` validator: Kani model-checks
# `VectorStore::open_from_bytes` (the pure, mmap-free, FFI-free entry into the SAME
# `open_validated` header/length/bounds logic the mmap'd `open` runs) over EVERY byte buffer
# up to a small bound, proving it never panics / never reads out of bounds / never hits UB.
# This is a COMPLEMENT, not a replacement: Kani's bound is small (model checking is
# exponential), so fuzz/oracle/ASan still carry the unbounded + UB coverage; Kani adds the
# "no input in the bounded domain was missed" guarantee the corpus cannot give.
#
# WHAT IT PROVES — the `#[cfg(kani)]` harnesses in crates/sparq-vectors/src/store.rs:
#   • open_from_bytes_never_panics       : for ALL buffers up to HEADER_LEN+32 bytes,
#                                          open_from_bytes returns cleanly (Ok or Err),
#                                          never panics / OOB / UB.
#   • open_validated_v2_tail_never_panics: same, with the magic + version-2 tag fixed so the
#                                          budget targets the checked size-arithmetic and the
#                                          index-validation loop.
# `open_from_bytes` is the in-memory twin of the mmap'd `open`; both call the private
# `open_validated`, so proving the in-memory path proves the B5 validator without Kani having
# to model `mmap` / file I/O / FFI (which it cannot).
#
# AND — the `#[cfg(kani)]` / `#[cfg(all(kani, feature = "mmap"))]` harnesses in
# crates/sparq-core/src/dict.rs:
#   • inline_id_round_trip / inline_id_out_of_domain_is_none / id_partition_disjoint : pure
#                                                 integer id-encoding + partition invariants
#                                                 (fast — no loops/heap; no `mmap` needed).
#   • validate_dict_bytes_never_panics          : for ALL four byte regions + term count up to
#                                                 the harness bounds, the mmap dict validator
#                                                 returns cleanly (Ok or Err), never panics /
#                                                 OOB / UB.
#   • validate_dict_bytes_sized_tail_never_panics: same, with the array LENGTHS pinned correct
#                                                  for `len` so the budget targets the record-
#                                                  parse + component-id + kind + hashid-range
#                                                  tail.
# `validate_dict_bytes` is the mmap-FREE seam (bead sq-ueuk) the mmap'd `MappedDict::validate`
# now delegates to — a `memmap2::Mmap` derefs to the `&[u8]` it takes — so proving the seam
# proves the dict B5 validator without Kani having to model `mmap` / file I/O / FFI. The two
# `validate_dict_bytes_*` harnesses are built only under the `mmap` feature, so the sparq-core
# matrix entry passes `--features mmap`.
#
# HISTORY (honest scope, now closed): the dict validator USED to have no mmap-free entry point
# (it was reachable only through `Dict::open_mmap`, which needs a live `memmap2::Mmap` that
# Kani cannot model — the same reason Miri cannot; see miri.yml). Bead sq-ueuk lifted the
# header/length/bounds/record logic onto a plain `&[u8]` (`validate_dict_bytes`), so the dict
# validator is now proven here alongside the `.spqv` validator.
#
# RUNNER / STRUCTURE (bead sq-otpxg — why per-crate + per-harness + timeouts):
# The single-job form of this lane FAILED every scheduled run from 2026-06-22 onward with
# "runner lost communication" — CBMC is memory-hungry, a standard GitHub runner has ~7 GB RAM,
# and the two slow validator harnesses exhausted it mid-solve, killing the whole runner AND its
# check-run silently (the lane is informational, so nobody noticed for ~12 days). The fix is
# entirely CI-side (no harness-source change — those are owned this tick by bead sq-og8u8):
#   1. SPLIT per crate into a matrix, `fail-fast: false`. Each crate proof set runs on its OWN
#      fresh ~7 GB runner in parallel, so one crate's memory pressure cannot starve the other,
#      and one crate's death cannot hide the other's results.
#   2. Invoke cargo-kani PER HARNESS (`--harness <name>`) inside a per-invocation `timeout`
#      ceiling (env `KANI_HARNESS_TIMEOUT`). A single runaway/OOM-prone proof is cut with a
#      clean TIMEOUT record — the loop reaps the solver (anti-OOM invariant) and moves on to
#      the next harness — instead of being allowed to consume all RAM and kill the runner. So
#      one slow harness can no longer silently take down the whole job.
#   3. Every harness's PASS / FAIL / TIMEOUT (+ wall time, + a log tail on non-pass) is written
#      to `$GITHUB_STEP_SUMMARY` and mirrored as `::warning::` / `::error::` annotations, so a
#      failure is VISIBLE on the run page and silent-death cannot recur.
# A genuine counterexample (reachable panic/OOB/UB) ALWAYS ends the job red (honest). A TIMEOUT
# reds the job too, EXCEPT for a suite marked `debt: true` (the two mmap-validator totality suites
# whose bounding is tracked by sq-j3u6o): those exceed the 20m per-harness CBMC budget EVERY night,
# so a pure timeout there is recorded LOUDLY (step summary + `::warning::`) but is NON-FATAL —
# otherwise the whole `kani` workflow can never conclude `success` and the nightly formal-lane
# alarm (formal-alarm.yml) fires forever on pre-existing, already-tracked solver-budget debt while
# the 3 HEALTHY suites (25 substrate order-law proofs + 5 dict id-partition proofs + 6 engine
# reducer proofs) DO verify green. Flip `debt` off the instant sq-j3u6o bounds those harnesses so
# they gate normally again. No larger GitHub-hosted runner class or self-hosted runner is available
# to this repo (`gh api /repos/sparq-org/sparq/actions/runners` == 0; every other workflow uses
# `ubuntu-latest`), so option "beefier runner" is not currently reachable — recorded in the PR.
#
# ADDING A SUITE ([FABLE-5] sq-63ups — the Phase-1 suites are wired in): append ONE entry to
# the `matrix.suite` list below — `{ name, crate, features, harnesses }`. `harnesses` is the
# space-separated list of `#[kani::proof]` fn names in that crate. Nothing else changes: the
# per-harness timeout loop + summary apply uniformly to every suite. This matrix is
# DRIFT-CHECKED: ci/formal-verification.toml is the manifest of every proof suite (name /
# crate / features / harnesses / the source paths each suite proves), and the gating
# `fv-manifest` job (.github/workflows/formal-verification.yml, scripts/check-fv-manifest.py)
# REDs any PR on which this matrix, that manifest and the source `#[kani::proof]` inventory
# disagree — so a new harness can no longer silently run in no lane. The same manifest drives
# the change-coupled PR selector (scripts/fv_select.py): PRs touching a suite's `proves`
# paths run that suite's proofs as a GATING check; this nightly lane stays the full-matrix
# backstop.
#
# HOW (the documented Kani flow — https://model-checking.github.io/kani/install-guide.html):
#   cargo install --locked kani-verifier              (the cargo-kani driver from crates.io)
#   cargo kani setup                                  (downloads the matching CBMC + Kani)
#   cargo kani -p <crate> [--features …] --harness H  (one bounded proof)
# Kani injects the `kani` cfg + the `kani` crate itself during model checking, so the harness
# needs no dependency entry; under a normal build the `#[cfg(kani)]` module is stripped (the
# `kani` cfg is registered in sparq-vectors/Cargo.toml AND sparq-core/Cargo.toml [lints.rust]
# so `-D warnings` is happy).
#
# UNTESTED-HERE (proof soundness): the harness BODIES were written against Kani's documented API
# and are validated on the first CI run — if a run surfaces an unwind-bound or API mismatch, fix
# it in the harness source (sq-og8u8); the proof OBLIGATION is correct regardless. The workflow
# MECHANICS (per-harness `--harness` selection, timeout classification, summary) were reproduced
# locally against Kani 0.67 on a high-RAM box (which does NOT reproduce the ~7 GB OOM, but does
# confirm the commands + loop are correct).
#
# TRIGGER (deliberately OFF the per-PR critical path — like miri.yml / asan.yml / the nightly
# fuzz tier): Kani installs CBMC and does exponential symbolic exploration, so a cold run is
# many minutes. This is a NIGHTLY formal-assurance safety net, not a per-PR tax.
#   • schedule (nightly) — the standing bounded-proof safety net over the validators.
#   • workflow_dispatch  — on demand (used to smoke-test this lane on a branch).
# There is intentionally NO pull_request / merge_group / push trigger, so this workflow creates
# NO check-run on a PR head or merge-queue ref — the required `ci-summary / gate` aggregator
# (which POLLS sibling check-runs on the head commit) therefore never discovers it and never
# waits on it. This lane is INFORMATIONAL / NON-BLOCKING, exactly the nightly-safety-net posture
# of miri.yml + asan.yml + the nightly fuzz tier. (Each matrix job is ALSO belt-and-braces named
# "…, informational" so that even if the lane were ever wired onto a PR ref it would be excluded
# from the gate by its .github/advisory-registry.json declaration — #3773.)
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening); the trailing
# `# vX.Y.Z` comment is what Dependabot follows to bump the pin. Pins + the pinned nightly
# date match miri.yml / asan.yml / fuzz.yml so a toolchain bump moves them together.
name: kani

on:
  workflow_dispatch:
  # Nightly safety net at 06:11 UTC — offset from ci.yml (03:17), fuzz/zk-toolchain (04:23),
  # miri (05:11) and asan (05:41) so the heavy nightly lanes do not contend for one runner.
  schedule:
    - cron: "11 6 * * *"

# Least-privilege: this lane only reads the repo + runs the model checker.
permissions:
  contents: read

concurrency:
  group: kani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Per-harness wall-clock ceiling. A single runaway/OOM-prone proof is cut here with a clean
  # TIMEOUT record (and its solver reaped) instead of being allowed to exhaust the ~7 GB runner
  # and kill it silently. Tunable in one place; `timeout(1)` duration syntax (e.g. 20m, 1200s).
  KANI_HARNESS_TIMEOUT: "20m"
  # [OPUS-5] sq-ko0jt — SUITE-LEVEL budget, and why a PER-HARNESS ceiling alone is not enough.
  # The per-harness ceiling bounds ONE proof; it does NOT bound a SUITE. The compare ORDER-law
  # suite carries 26 harnesses, so its worst case is 26 × 20m = 520m against a `timeout-minutes:
  # 90` job backstop — and a backstop hit is a job CANCELLATION: the loop below never reaches its
  # summary or its verdict, and the run concludes `cancelled`, not `failure`. That is EXACTLY the
  # no-verdict failure mode this epic exists to abolish (miri.yml was cancelled at its ceiling 22
  # consecutive nights and nothing alarmed — see miri.yml's DEAD-LANE POST-MORTEM). Raising the
  # backstop cannot fix it: 520m exceeds GitHub's 6-hour hosted-runner maximum outright.
  # So the LOOP is made self-bounding instead. It clamps each harness's timeout to what is LEFT
  # of this budget and, once the budget is gone, records the remaining harnesses BY NAME as
  # `NOT RUN` and reds the job. The suite therefore always reaches a recorded, attributable
  # verdict; the job can no longer be cancelled out from under it.
  # Sized as: the 90m job backstop − a ~15m allowance for checkout/toolchain/cache + the cold
  # `cargo install --locked kani-verifier` + `cargo kani setup` − reserve for the summary.
  # The `KANI_STEP_BUDGET + 15m <= timeout-minutes` relation is PINNED by rule D5 in
  # scripts/check-fv-manifest.py, so a future backstop edit cannot silently reopen the hole.
  KANI_STEP_BUDGET: "70m"

jobs:
  kani:
    name: kani ${{ matrix.suite.name }} (bounded proofs, informational)
    runs-on: ubuntu-latest
    # Backstop only — the real control is the per-harness KANI_HARNESS_TIMEOUT above. Generous
    # so `cargo kani setup` (cold CBMC download) + per-harness codegen + the timeouts fit with
    # margin; a hung harness is cut by its own timeout long before this fires.
    timeout-minutes: 90
    strategy:
      # One crate's OOM/timeout must NOT cancel the other crate's proofs.
      fail-fast: false
      # [OPUS-5] issue #6349 — HOSTED-RUNNER RESERVATION. Every suite in the matrix still
      # runs (the suite list is unchanged, and D3 in scripts/check-fv-manifest.py still pins
      # it against ci/formal-verification.toml); at most 2 suites are ADMITTED to a hosted
      # runner at a time. This lane's proofs are long-lived and it overlaps the miri window
      # whenever either run is delayed, so in the PR-throughput incident that filed #6349 the
      # two scheduled safety lanes together held most of the account's standard-runner
      # admissions while PR-head checks queued. Each suite keeps its own 90-minute backstop,
      # its per-harness KANI_HARNESS_TIMEOUT and its KANI_STEP_BUDGET, so verdict semantics
      # are untouched; only the ADMISSION rate changes (worst case 3 waves x 90 min = 4.5 h,
      # well inside the nightly cycle). The per-workflow and combined miri+kani ceilings are
      # machine-checked by scripts/tests/test_nightly_runner_reservation.py.
      max-parallel: 2
      matrix:
        # ADD A SUITE = ONE ENTRY (see header). harnesses = space-separated `#[kani::proof]`
        # fn names in that crate; features = extra cargo features the harnesses need.
        suite:
          - name: "sparq-vectors (.spqv validator)"
            crate: sparq-vectors
            features: ""
            # [FABLE-5] KNOWN-TIMEOUT DEBT (bounding tracked by sq-j3u6o): both totality
            # harnesses exceed the 20m per-harness CBMC budget on this ~7 GB runner and TIMEOUT
            # every night. `debt: true` makes a pure TIMEOUT NON-FATAL for this suite (recorded
            # LOUDLY in the step summary + a ::warning:: annotation, so the debt stays visible
            # and under standing pressure) so a healthy night is not dragged red forever — while
            # a REAL counterexample / build error (a Kani FAIL, exit ∉ {124,137}) STILL reds the
            # job, so the no-verdict alarm still fires on a genuine proof regression. See the
            # DEBT-TIER rationale block in the proof step below.
            debt: true
            harnesses: >-
              open_from_bytes_never_panics
              open_validated_v2_tail_never_panics
          # [FABLE-5] sq-63ups: the former single sparq-core entry is SPLIT so the five
          # fast id-partition/domain harnesses (all pass in seconds) report an honest
          # GREEN job instead of being dragged red every night by the two mmap-validator
          # totality harnesses, which exceed the per-harness CBMC budget on this runner
          # class (sq-og8u8). The split also adds the two PR #1536 domain self-checks
          # (domain_id_partition_regions_are_all_nonempty,
          # domain_dict_validator_accepts_the_empty_dict) that were present in source but
          # absent from this list — they previously ran in NO CI lane.
          - name: "sparq-core (dict id partition + domain self-checks)"
            crate: sparq-core
            features: "--features mmap"
            harnesses: >-
              inline_id_round_trip
              inline_id_out_of_domain_is_none
              id_partition_disjoint
              domain_id_partition_regions_are_all_nonempty
              domain_dict_validator_accepts_the_empty_dict
          - name: "sparq-core (dict mmap validator totality)"
            crate: sparq-core
            features: "--features mmap"
            # [FABLE-5] KNOWN-TIMEOUT DEBT (bounding tracked by sq-j3u6o) — same class as the
            # .spqv validator suite above: both harnesses exceed the 20m per-harness CBMC budget
            # and TIMEOUT every night. `debt: true` => a pure TIMEOUT is non-fatal (loud warning
            # only); a real Kani FAIL still reds the job so a genuine proof regression is caught.
            debt: true
            harnesses: >-
              validate_dict_bytes_never_panics
              validate_dict_bytes_sized_tail_never_panics
          # [FABLE-5] sq-63ups: the two Phase-1 suites (sq-sqtk2.3 / sq-sqtk2.4) that ran
          # in no CI lane since merge. Local evidence (61 GB aarch64 work box, Kani 0.67,
          # suites run concurrently so wall times are upper bounds): every reducer harness
          # PASSes (slowest ~10 min), every compare harness PASSes (most in seconds).
          - name: "sparq-engine (vectorized reducer kernels)"
            crate: sparq-engine
            features: "--features vectorized"
            harnesses: >-
              reduce_sum_equals_reference_fold
              reduce_count_equals_reference
              reduce_min_id_equals_reference
              reduce_max_id_equals_reference
              narrow_sum_to_i64_iff_in_range
              domain_reducer_slice_is_adversarial_and_survives_the_bound
          - name: "sparq-substrate (compare ORDER laws)"
            crate: sparq-substrate
            features: "--features compare"
            harnesses: >-
              domain_exhibits_the_2p53_collapse
              reflexivity_numeric_literals_incl_nan
              reflexivity_nonnumeric_scalars
              reflexivity_triple_terms
              antisymmetry_numeric_pairs_incl_nan
              antisymmetry_numeric_vs_nonnumeric_incl_nan
              antisymmetry_nonnumeric_scalar_pairs
              antisymmetry_triple_vs_scalar
              antisymmetry_triple_pairs
              within_class_totality_literals_incl_nan
              within_class_totality_nonliterals
              transitivity_exact_int_literals_incl_2p53_collapse
              transitivity_nonliteral_scalars
              transitivity_int_with_nonliteral_scalars
              transitivity_double_literals
              transitivity_mixed_numeric_collapse_free_range
              domain_cf_numeric_is_collapse_free_with_signed_zero_pair
              transitivity_string_literals
              transitivity_strict_typed_literals
              transitivity_mixed_literal_kinds_incl_nan
              transitivity_triple_terms_recursive
              exact_int_order_agreement_incl_2p53_collapse
              domain_x2_doubles_are_exact
              witness_mixed_tier_collapse_now_exact
              witness_numeric_vs_string_now_ranked_by_kind
              witness_nan_now_totalised_first
          # [FABLE-5] sq-39kps: domain-coverage self-check for the wac-oracle POST-Slug
          # `.acl` escalation corpus — pins that the static CORPUS genuinely contains a
          # surviving escalation (exact-image asserts + a kani::cover! witness), so a
          # future re-scope cannot empty the interesting inputs vacuously. Proof cone is
          # the corpus file itself (static data + pure classifier fns); solves in seconds.
          - name: "sparq-wac-oracle (.acl escalation corpus domain coverage)"
            crate: sparq-wac-oracle
            features: ""
            harnesses: >-
              domain_corpus_exhibits_a_surviving_escalation
    # [OPUS-5] PINNED-TOOLCHAIN ESCAPE — REQUIRED here, not belt-and-braces. The repo root
    # carries a `rust-toolchain.toml` pinning STABLE, and rustup resolves that file
    # (precedence 4) ABOVE the `rustup default <toolchain>` that `dtolnay/rust-toolchain`
    # performs (precedence 5). Unlike the miri/asan/fuzz lanes, NOTHING in this job uses
    # `cargo +<toolchain>`: `cargo install --locked kani-verifier`, `cargo kani setup` and
    # every `cargo kani --harness` invocation are plain cargo calls, so without this env
    # var they would all silently move from the declared nightly onto pinned stable —
    # changing which compiler builds the driver and which host toolchain Kani's codegen
    # sits on. `RUSTUP_TOOLCHAIN` is precedence 2 and beats the file, preserving exactly
    # the toolchain this lane resolved to before the pin existed. Keep in sync with the
    # `toolchain:` input below.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-06-11
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Kani pins its own internal toolchain via `cargo kani setup`, but it still needs a host
      # Rust toolchain to build the cargo-kani driver. Pin the same nightly date as the other
      # nightly lanes so a toolchain bump moves them together. (Kani tracks a recent stable/
      # nightly; if it rejects this exact nightly on the first run, bump to Kani's documented
      # supported toolchain — recorded as the UNTESTED-HERE caveat in the workflow header.)
      - name: Install Rust (nightly, pinned)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly via toolchain input
        with:
          toolchain: nightly-2026-06-11
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Kani uses a distinct instrumented target tree; key the cache per crate so the two
          # matrix jobs do not clobber each other and neither is confused with the stable
          # workspace build in ci.yml or the miri/asan sysroots.
          key: kani-${{ matrix.suite.crate }}
      # Install the cargo-kani driver from crates.io (--locked for a reproducible resolve),
      # then fetch the matching CBMC + Kani backend. `cargo install` is itself SHA-resolved
      # against the crates.io index + the workspace lockfile semantics; no extra third-party
      # action to pin here. If a future Kani release changes the setup flow, the header's
      # install-guide link is the source of truth.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # Per-harness bounded proofs with a wall-clock timeout each, and a $GITHUB_STEP_SUMMARY
      # table so every harness's PASS / FAIL / TIMEOUT is visible even if a later harness is
      # cut. A FAIL (counterexample/build error) or a TIMEOUT ends the job red — honestly — but
      # only AFTER every harness result has been recorded, so silent-death cannot recur.
      - name: Kani bounded proofs (per-harness, timeout, summary)
        env:
          SUITE_NAME: ${{ matrix.suite.name }}
          SUITE_CRATE: ${{ matrix.suite.crate }}
          SUITE_FEATURES: ${{ matrix.suite.features }}
          SUITE_HARNESSES: ${{ matrix.suite.harnesses }}
          # "true" for a KNOWN-TIMEOUT-DEBT suite (the two mmap-validator totality suites whose
          # bounding is tracked by sq-j3u6o): a pure TIMEOUT is recorded LOUDLY but is NON-FATAL
          # for the job. A real Kani FAIL (counterexample/build error) stays fatal regardless.
          SUITE_DEBT: ${{ matrix.suite.debt && 'true' || 'false' }}
        run: |
          set -u
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          tmo="${KANI_HARNESS_TIMEOUT:-20m}"
          budget="${KANI_STEP_BUDGET:-70m}"
          # `timeout(1)` duration syntax -> seconds (h/m/s suffix; bare number = seconds).
          to_seconds() {
            case "$1" in
              *h) echo $(( ${1%h} * 3600 )) ;;
              *m) echo $(( ${1%m} * 60 )) ;;
              *s) echo "${1%s}" ;;
              *)  echo "$1" ;;
            esac
          }
          tmo_s=$(to_seconds "$tmo")
          budget_s=$(to_seconds "$budget")
          step_start=$(date +%s)
          {
            echo "### 🤖 Kani bounded-proof results — ${SUITE_NAME}"
            echo ""
            echo "Runner \`ubuntu-latest\` (~7 GB). Each harness runs as its own \`cargo kani --harness\`"
            echo "invocation under a \`${tmo}\` wall-clock ceiling; a runaway/OOM-prone proof is cut with a"
            echo "clean **TIMEOUT** (solver reaped) rather than silently killing the runner."
            echo ""
            echo "The whole suite is additionally bounded by a \`${budget}\` step budget, so a suite with"
            echo "many harnesses always reaches this verdict instead of the job being CANCELLED at its"
            echo "backstop with nothing recorded. Harnesses left unrun by an exhausted budget are listed"
            echo "**NOT RUN** below and red the job."
            echo ""
            echo "| Harness | Result | Wall time |"
            echo "| --- | --- | --- |"
          } >> "$summary"

          had_fail=0
          had_timeout=0
          had_unrun=0
          for h in $SUITE_HARNESSES; do
            # STEP-BUDGET GUARD: never START a harness we cannot record a verdict for, and never
            # let the accumulated suite wall-clock reach the job backstop (a cancellation erases
            # this whole summary). <=60s left is not enough for even a trivial proof's codegen.
            left=$(( budget_s - ($(date +%s) - step_start) ))
            if [ "$left" -le 60 ]; then
              had_unrun=1
              echo "::error title=Kani harness NOT RUN::${SUITE_CRATE}::${h} never ran — the ${budget} step budget was exhausted by earlier harnesses in this suite. Re-bound or split the suite (see the step summary)."
              echo "| \`${h}\` | ⏭️ NOT RUN (\`${budget}\` step budget exhausted) | — |" >> "$summary"
              continue
            fi
            # Clamp this harness to whatever is left, so it is CUT with a recorded verdict
            # rather than running past the budget and taking the job's backstop with it.
            this_tmo=$tmo_s
            if [ "$left" -lt "$this_tmo" ]; then
              this_tmo=$left
            fi
            log="kani-${SUITE_CRATE}-${h}.log"
            start=$(date +%s)
            # shellcheck disable=SC2086  # SUITE_FEATURES is an intentional word-split arg list.
            # `&& ec=0 || ec=$?` — capture exit code without triggering `set -e` (bash -e {0}).
            # Plain `cmd; ec=$?` would cause bash to abort the script on the first non-zero exit
            # (timeout returns 124, cargo-kani returns non-zero on proof failure) BEFORE ec=$? runs.
            # The `&&`/`||` list is `-e`-exempt; $? inside `|| ec=$?` is the exit of the left side.
            timeout -k 30s "${this_tmo}s" cargo kani -p "$SUITE_CRATE" $SUITE_FEATURES --harness "$h" \
              > "$log" 2>&1 && ec=0 || ec=$?
            # Anti-OOM invariant: guarantee the memory-hungry solver is gone before the next
            # harness starts (on a timeout the CBMC child can be orphaned when cargo-kani is
            # SIGKILLed). This job runs nothing but Kani, so any cbmc process is ours.
            pkill -9 -x cbmc 2>/dev/null || true
            end=$(date +%s)
            dur=$((end - start))
            wall=$(printf '%dm%02ds' $((dur / 60)) $((dur % 60)))

            case "$ec" in
              0)
                res="✅ PASS"
                ;;
              124 | 137)
                # A CUT (clamped run) and a TIMEOUT (full budget spent) are different findings:
                # a TIMEOUT says "this harness needs more than ${tmo}" — known, bead-tracked debt
                # for a `debt: true` suite. A CUT says "the SUITE ran out of step budget", which is
                # a missing verdict, so it is fatal for every suite (see the exit rules below).
                if [ "$this_tmo" -lt "$tmo_s" ]; then
                  res="⏱️ CUT (only ${this_tmo}s of the \`${budget}\` step budget left)"
                  had_unrun=1
                  echo "::error title=Kani harness cut by the step budget::${SUITE_CRATE}::${h} was cut after ${this_tmo}s — earlier harnesses in this suite consumed the ${budget} step budget, so this proof has NO verdict. Re-bound or split the suite."
                else
                  res="⏱️ TIMEOUT (>${tmo})"
                  had_timeout=1
                  echo "::warning title=Kani timeout::${SUITE_CRATE}::${h} exceeded ${tmo} — recorded as TIMEOUT (see step summary). Bounding is tracked by sq-j3u6o."
                fi
                ;;
              *)
                res="❌ FAIL (exit ${ec})"
                had_fail=1
                echo "::error title=Kani proof failed::${SUITE_CRATE}::${h} failed (exit ${ec}) — a reachable panic/OOB/UB counterexample or a build error (see step summary)."
                ;;
            esac
            echo "| \`${h}\` | ${res} | ${wall} |" >> "$summary"

            if [ "$ec" -ne 0 ]; then
              {
                echo ""
                echo "<details><summary>Log tail — <code>${h}</code> (${res})</summary>"
                echo ""
                echo '```'
                tail -n 40 "$log" 2>/dev/null || true
                echo '```'
                echo ""
                echo "</details>"
              } >> "$summary"
            fi
          done

          {
            echo ""
            if [ "$had_fail" -eq 1 ]; then
              echo "**Overall: ❌ FAIL** — at least one harness surfaced a counterexample/error above; investigate it."
            elif [ "$had_unrun" -eq 1 ]; then
              echo "**Overall: ❌ NO VERDICT for part of this suite** — the \`${budget}\` step budget ran out before every harness had been proved, so the harnesses marked **NOT RUN** / **CUT** above carry NO result. This is fatal even for a \`debt\` suite: an unrecorded proof is the failure mode this lane exists to make impossible. Re-bound the slow harnesses or split the suite across matrix entries — do NOT simply raise the budget past the job's \`timeout-minutes\` backstop (rule D5 in scripts/check-fv-manifest.py reds that)."
            elif [ "$had_timeout" -eq 1 ] && [ "$SUITE_DEBT" = "true" ]; then
              echo "**Overall: ⏱️ TIMEOUT (known debt, non-fatal)** — every harness that finished passed; the totality harness(es) exceeded the \`${tmo}\` budget as expected. This is the KNOWN, BEAD-TRACKED debt suite: bounding is tracked by **sq-j3u6o**, so a pure timeout does NOT red the job (a real counterexample still would). The healthy suites determine tonight's lane verdict."
            elif [ "$had_timeout" -eq 1 ]; then
              echo "**Overall: ⏱️ TIMEOUT** — every harness that finished passed, but one or more exceeded the \`${tmo}\` budget. Bounding/pruning those is tracked by **sq-j3u6o**."
            else
              echo "**Overall: ✅ PASS** — all harnesses verified within budget."
            fi
          } >> "$summary"

          # A real Kani FAIL (counterexample / build error) ALWAYS reds the job — that is a
          # genuine proof regression the no-verdict alarm must catch. A TIMEOUT reds the job too
          # (honest) UNLESS this is the KNOWN-TIMEOUT-DEBT suite (SUITE_DEBT=true, sq-j3u6o): for
          # those, a pure timeout is recorded LOUDLY above (warning annotation + step summary) but
          # is NON-FATAL, so a normal night — healthy suites green, debt suites timing out as
          # expected — lets the WORKFLOW conclude `success` and produce a real verdict for the
          # nightly formal-lane alarm, instead of being dragged red forever on pre-existing,
          # already-tracked solver-budget debt. Every result is recorded before this exits.
          if [ "$had_fail" -eq 1 ]; then
            exit 1
          fi
          # A missing verdict is NEVER excused by the debt tier. `debt: true` tolerates a proof
          # that is KNOWN to need more than ${tmo} (recorded, bead-tracked); it does not tolerate
          # a proof nobody has an answer for. In practice the two debt suites carry two harnesses
          # each (2 × 20m, far inside the budget), so this can only fire on a suite that has
          # genuinely outgrown the runner — which must be loud, not absorbed.
          if [ "$had_unrun" -eq 1 ]; then
            exit 1
          fi
          if [ "$had_timeout" -eq 1 ] && [ "$SUITE_DEBT" != "true" ]; then
            exit 1
          fi
