name: Python bindings

# Build + test of the `sparq` Python package (crates/sparq-py, T21): maturin builds the
# abi3 wheel, pip installs it, pytest runs the round-trip suite. The release wheels matrix
# (manylinux / macOS / Windows via maturin-action) is a follow-up — see docs/release.md
# "Python wheels".
#
# THESE GATE (not informational). Both jobs (`maturin build + pytest` and the opt-in
# `maturin build (arrow) + pytest`) carry NO `advisory`/`informational` token, so the
# `ci-summary / gate` aggregator (.github/workflows/ci-summary.yml — it excludes only
# only the check names DECLARED in .github/advisory-registry.json — #3773) treats them as HARD
# required gates whenever they RUN on a PR.
#
# WHY a `pull_request` trigger ([OPUS-4.8] sq-5jjei, gh-910): python.yml USED to trigger
# on `push: branches:[main]` + `workflow_dispatch` ONLY, so the `arrow` functional lane
# (the `Graph.query_arrow -> pyarrow.Table` round-trip in tests/test_arrow.py) — and the
# lean wheel test too — only went green/red AFTER merge to main, never at PR time. The
# `pull_request` trigger below validates both BEFORE merge, exactly as js.yml does for the
# `js` gate (sq-5lof). The feature-matrix `opt-in sparq-py (arrow …)` leg already gates the
# cargo build+clippy of the `arrow` feature; this lane adds the FUNCTIONAL pytest cover a
# cargo leg cannot reproduce (it needs a maturin-built wheel + pyarrow).
#
# SCOPE: PRs that touch the Python-binding surfaces (paths below) — a docs-only or
# unrelated-crate PR matches none, so neither job runs and the required `ci-summary / gate`
# simply never waits on them (cross-workflow `needs:` is impossible — see js.yml/gui.yml).
# This keeps the maturin build off unrelated PRs. NOT a `merge_group` lane (ci-summary.yml
# never cross-workflow-needs python.yml), matching js.yml/gui.yml. The unfiltered
# `push: branches:[main]` trigger is KEPT for post-merge cover on every main push.
on:
  pull_request:
    # [FABLE-5] Draft-tier CI: + ready_for_review so the un-draft moment re-runs
    # this gate-feeding lane (docs/branch-protection.md §Draft-tier CI).
    types: [opened, synchronize, reopened, ready_for_review]
    # Every input the jobs read: the crate (Rust binding source + Cargo.toml + tests +
    # pyproject), the workspace manifests/lock the maturin build resolves from, the
    # sparq-arrow crate the `arrow` feature compiles in, the hash-pinned build/arrow
    # requirement sets the pip installs verify against, and this workflow file.
    paths:
      - "crates/sparq-py/**"
      - "crates/sparq-arrow/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/requirements/python-build.txt"
      - ".github/requirements/python-arrow.txt"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: maturin build + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # sq-3sbrr save-if discipline: SAVE only from main — a `refs/pull/<n>/merge`-scoped
          # save is restorable by that one PR alone while still consuming the shared 10 GB
          # budget. RESTORE is untouched, and the unfiltered `push: branches:[main]` trigger
          # (kept for post-merge cover — see the header) re-seeds this key on every main push.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install maturin + pytest
        # [OPUS-4.8] HASH-pinned (Scorecard PinnedDependenciesID): a `==` version pin still
        # trusts whatever PyPI serves, so --require-hashes verifies every artifact's sha256
        # — including the full transitive closure — against .github/requirements/python-build.txt
        # before use. See that file's header to bump versions / regenerate the hash set.
        run: pip install --require-hashes -r .github/requirements/python-build.txt
      - name: Build wheel (abi3, python-release profile — unwinding panics)
        run: maturin build --manifest-path crates/sparq-py/Cargo.toml --profile python-release --out dist
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Run tests
        # [OPUS-4.8] Runs the full pytest suite incl. the new result-parity + panic-surface
        # tests (test_parity.py). Deselect the `bench` marker (bench_py.py timed FFI-overhead
        # micro-bench): it's quiet-box-sensitive + advisory, so it must not gate on a noisy
        # GitHub runner. The python-release profile above is the unwinding build the
        # panic-surface test needs. (sq-f9tu / sq-th1u)
        # NOTE: this lean wheel is built WITHOUT `--features arrow` and WITHOUT pyarrow, so
        # test_arrow.py auto-skips here; the dedicated `arrow` job below exercises that path.
        run: pytest crates/sparq-py/tests -q -m "not bench"

  arrow:
    # [OPUS-4.8] sq-lt1ml (gh-910): the opt-in Arrow export lane. Builds the wheel WITH
    # `--features arrow` (the `Graph.query_arrow -> pyarrow.Table` surface), installs
    # pyarrow (the consumer side of the Arrow C Data Interface), and runs the arrow-only
    # pytest. Kept a SEPARATE job so the lean (no-arrow) job above stays pyarrow-free and
    # the default wheel's test run is unaffected.
    name: maturin build (arrow) + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # sq-3sbrr save-if discipline: SAVE only from main — a `refs/pull/<n>/merge`-scoped
          # save is restorable by that one PR alone while still consuming the shared 10 GB
          # budget. RESTORE is untouched, and the unfiltered `push: branches:[main]` trigger
          # (kept for post-merge cover — see the header) re-seeds this key on every main push.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install maturin + pytest
        run: pip install --require-hashes -r .github/requirements/python-build.txt
      - name: Install pyarrow (Arrow C Data Interface consumer)
        # HASH-pinned (Scorecard PinnedDependenciesID), same discipline as python-build.txt.
        run: pip install --require-hashes -r .github/requirements/python-arrow.txt
      - name: Build wheel with the arrow feature (python-release profile — unwinding panics)
        run: maturin build --manifest-path crates/sparq-py/Cargo.toml --features arrow --profile python-release --out dist
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Run Arrow-export tests
        # test_arrow.py is the REAL round-trip: SELECT -> Graph.query_arrow -> pyarrow.Table,
        # asserting the term-struct columns, unbound -> null struct slot, and query_json parity.
        run: pytest crates/sparq-py/tests/test_arrow.py -q
