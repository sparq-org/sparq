# Hosted PR previews, part 2 of 2: PUBLISH the previews and link them from the PR.
#
# Runs after each site-preview build (workflow_run, so it executes main's code with the
# Pages token, never the PR's). It takes the live site from the latest pages.yml deploy
# (its `github-pages` artifact), rebuilds preview/ from the open same-repository PRs'
# preview artifacts (scripts/site-preview-overlay.sh, the same step pages.yml runs), and
# redeploys. A rebuild on every deploy also drops the previews of closed PRs.
#
# Then it upserts one comment per previewed PR with the link, plus direct links to any spec
# or paper the PR changes.
#
# Fork PRs get a build (site-preview.yml) but never a hosted preview: their artifact is
# PR-authored HTML and JS, and it would be served from the project's domain.

name: site-preview-deploy

on:
  workflow_run:
    workflows: [site-preview]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Not the `pages` group: queuing here must never replace a pending main deploy. A newer
# pending run supersedes an older one, which is fine because every run publishes every
# open preview.
concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      manifests: ${{ steps.manifests.outputs.json }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Starting from the newest deployed site while a main deploy is still building would
      # roll the live site back when this run deploys after it, so let it land first.
      - name: Wait for any in-flight pages deploy
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            busy=0
            for status in queued in_progress; do
              n="$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=$status&per_page=1" --jq .total_count)"
              busy=$((busy + n))
            done
            [ "$busy" -eq 0 ] && exit 0
            echo "pages.yml still running; waiting"
            sleep 30
          done
          echo "::error::pages.yml has been running for 45 minutes; not deploying over it"
          exit 1

      - name: Fetch the live site (latest github-pages artifact from main)
        run: |
          set -euo pipefail
          repo_id="$(gh api "repos/$REPO" --jq .id)"
          art="$(gh api "repos/$REPO/actions/artifacts?name=github-pages&per_page=50" --jq "
            [.artifacts[] | select(.expired | not)
              | select(.workflow_run.head_repository_id == $repo_id)
              | select(.workflow_run.head_branch == \"main\" or .workflow_run.head_branch == \"benchmark-data\")]
            | sort_by(.created_at) | last | .id // empty")"
          if [ -z "$art" ]; then
            echo "::error::no unexpired github-pages artifact from main; run pages.yml first"
            exit 1
          fi
          gh api "repos/$REPO/actions/artifacts/$art/zip" > "$RUNNER_TEMP/pages.zip"
          unzip -q "$RUNNER_TEMP/pages.zip" -d "$RUNNER_TEMP/pages"
          mkdir -p site-out
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C site-out
          test -f site-out/index.html

      - name: Overlay PR previews (preview/pr-N/)
        run: bash scripts/site-preview-overlay.sh site-out

      - name: Collect preview manifests
        id: manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(site-out/preview/pr-*/_preview.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "json=[]" >> "$GITHUB_OUTPUT"
          else
            echo "json=$(jq -c -s . "${files[@]}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out
          retention-days: 30

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  comment:
    needs: [assemble, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      MANIFESTS: ${{ needs.assemble.outputs.manifests }}
    steps:
      - name: Link each preview from its PR
        run: |
          set -euo pipefail
          marker='<!-- site-preview -->'
          base="${PAGE_URL%/}"
          # Manifests come from same-repository PR builds; still accept only the expected shapes.
          jq -c '.[] | select((.pr | type) == "number" and (.sha | test("^[0-9a-f]{40}$")))' <<<"$MANIFESTS" |
          while read -r m; do
            pr="$(jq -r .pr <<<"$m")"
            sha="$(jq -r .sha <<<"$m")"
            url="$base/preview/pr-$pr/"
            {
              echo "$marker"
              echo "**Site preview** for ${sha:0:7}: $url"
              for kind in specs papers; do
                jq -r --arg k "$kind" '.[$k][]? | select(test("^[a-z0-9-]+$"))' <<<"$m" | while read -r slug; do
                  echo "- Changed ${kind%s}: $url$kind/$slug/"
                done
              done
              echo
              echo "Rebuilt on every push to this PR; removed after the PR closes."
            } > body.md
            existing="$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
            if [ -z "$existing" ]; then
              gh api "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
            elif ! gh api "repos/$REPO/issues/comments/$existing" --jq .body | grep -q "for ${sha:0:7}:"; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
            fi
          done
