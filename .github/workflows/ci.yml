        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy the gated harness surface (service-loopback feature ON)
        # The REAL gate for the feature-gated code: -D warnings over all targets with the
        # feature ON (the default `cargo clippy` never compiles this module/test).
        run: cargo clippy -p sparq-conformance --all-targets --features service-loopback -- -D warnings
      - name: Run the in-process SERVICE-federation smoke test (feature ON)
        # Drives the REAL end-to-end federated path (loopback sparq-server <- engine ureq
        # transport) + asserts the fail-closed SSRF egress scoping. Hermetic; no test data.
        run: cargo test -p sparq-conformance --features service-loopback --test service_loopback -- --nocapture
      # [OPUS-4.8] sq-ddpgx (epic sq-my8wd) — the W3C sparql11/service EVALUATION ratchet
      # built on the harness above (the `service` feature forwards to `service-loopback`).
      # Needs the pinned W3C rdf-tests data; clippy the lane, then run it + enforce the floor.
      - name: Clippy the service-evaluation lane (service feature ON)
        run: cargo clippy -p sparq-conformance --all-targets --features service -- -D warnings
      - name: Fetch W3C SPARQL test suites (pinned)
        run: ./scripts/fetch-conformance.sh
      - name: Run sparql11/service evaluation lane (service feature ON) + enforce floor
        # Stands up REAL in-process loopback endpoints per qt:serviceData block and drives each
        # federated SERVICE query end-to-end through the engine's REAL ureq transport, comparing
        # to the .srx oracle. The runner asserts the pinned SERVICE_EVAL_FLOOR in-process AND
        # prints a `TOTAL service <pass> <fail> <skip> (floor N)` line re-grepped here.
        # `--nocapture` so the TOTAL line reaches stdout. Positional grep fields.
        run: |
          set -o pipefail
          cargo test -p sparq-conformance --features service --test service_eval_suite -- --nocapture \
            | tee service-eval-conformance.out
          if ! grep -qE '^TOTAL service ' service-eval-conformance.out; then
            echo "::error::sparql11/service lane produced no 'TOTAL service' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          PASS=$(grep -E '^TOTAL service ' service-eval-conformance.out | awk '{print $3}' | head -1)
          FLOOR=5
          echo "sparql11/service evaluation pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::service evaluation regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      # [OPUS-4.8] sq-jaj38 (epic sq-my8wd) — the W3C SPARQL 1.1 PROTOCOL (HTTP layer) ratchet
      # built on the SAME loopback harness (the `http-protocol` feature forwards to
      # `service-loopback`). HERMETIC — needs NO fetched W3C data: it stands up the real
      # `sparq_server::serve` over an in-memory fixture and drives RAW HTTP at the bound port,
      # exercising the SPARQL Protocol request/response contract (GET/POST query+update, the
      # QUERY method, dataset overrides, SRJ/SRX/CSV/TSV negotiation, 200/400/405/415).
      - name: Clippy the SPARQL-Protocol lane (http-protocol feature ON)
        run: cargo clippy -p sparq-conformance --all-targets --features http-protocol -- -D warnings
      - name: Run SPARQL 1.1 Protocol (HTTP) lane (http-protocol feature ON) + enforce floor
        # Drives RAW HTTP at the in-process loopback server (no fetched data). The runner asserts
        # the pinned HTTP_PROTOCOL_FLOOR in-process AND prints a `TOTAL http-protocol <pass> <fail>
        # <div> (floor N)` line re-grepped here. `--nocapture` so the TOTAL line reaches stdout.
        run: |
          set -o pipefail
          cargo test -p sparq-conformance --features http-protocol --test http_protocol_suite -- --nocapture \
            | tee http-protocol-conformance.out
          if ! grep -qE '^TOTAL http-protocol ' http-protocol-conformance.out; then
            echo "::error::SPARQL-Protocol lane produced no 'TOTAL http-protocol' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          PASS=$(grep -E '^TOTAL http-protocol ' http-protocol-conformance.out | awk '{print $3}' | head -1)
          # [OPUS-4.8] sq-406acc: raised 20→21 when the present-but-unsatisfiable Accept 406
          # (Oxigraph parity, w3c/sparql-protocol#40) flipped from a divergence to a genuine PASS.
          FLOOR=21
          echo "SPARQL 1.1 Protocol (HTTP) pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::SPARQL-Protocol lane regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      # [OPUS-4.8] sq-1uuxz (epic sq-my8wd) — the SPARQL 1.1 SERVICE-DESCRIPTION + GRAPH-STORE
      # PROTOCOL ratchet built on the SAME loopback harness (the `federation-descriptors` feature
      # forwards to `service-loopback` AND turns on `sparq-server/federation-descriptors`).
      # HERMETIC — needs NO fetched W3C data: it stands up the real `sparq_server::serve` (with the
      # federation-descriptors flag ON) over an in-memory fixture and drives RAW HTTP at the bound
      # port, asserting (A) the GET /sparql (no query) Service Description advertises exactly what
      # the server genuinely implements (no over-advertising) and (B) a GET/PUT/POST/DELETE Graph
      # Store Protocol round-trip verifying store state after each op.
      - name: Clippy the SD/GSP lane (federation-descriptors feature ON)
        run: cargo clippy -p sparq-conformance --all-targets --features federation-descriptors -- -D warnings
      - name: Run SD + Graph Store Protocol lane (federation-descriptors feature ON) + enforce floor
        # Drives RAW HTTP at the in-process loopback server (no fetched data). The runner asserts the
        # pinned SD_GSP_FLOOR in-process AND prints a `TOTAL sd-gsp <pass> <fail> <div> (floor N)`
        # line re-grepped here. `--nocapture` so the TOTAL line reaches stdout.
        run: |
          set -o pipefail
          cargo test -p sparq-conformance --features federation-descriptors --test sd_gsp_suite -- --nocapture \
            | tee sd-gsp-conformance.out
          if ! grep -qE '^TOTAL sd-gsp ' sd-gsp-conformance.out; then
            echo "::error::SD/GSP lane produced no 'TOTAL sd-gsp' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          PASS=$(grep -E '^TOTAL sd-gsp ' sd-gsp-conformance.out | awk '{print $3}' | head -1)
          FLOOR=39
          echo "SD + Graph Store Protocol pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::SD/GSP lane regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      # [OPUS-4.8] sq-ro6if (PSS #1415/#1478) — PUBLISH the served-surface conformance as a
      # MACHINE-READABLE per-build artifact. The `served-conformance-report` binary re-runs the
      # SAME two served-surface lanes above (sq-jaj38 http-protocol + sq-1uuxz SD/GSP) in-process
      # and serialises their per-assertion outcomes + counts + provenance to JSON, pulling each
      # suite's ratchet floor from the central scoreboard registry so the report can never drift
      # from the enforcer. It is FAIL-CLOSED: it exits non-zero (failing this step) if a lane
      # produced zero assertions (the vacuous-artifact class), has any genuine failure, or
      # regressed below its floor — so a bad report can never be uploaded. NO new conformance
      # tests; publication only. Requires BOTH served-surface features, so clippy the combined
      # build first (the -D-warnings gate: the single-feature clippy steps above never compile the
      # emitter's both-features module).
      - name: Clippy the served-conformance report emitter (both served-surface features ON)
        run: cargo clippy -p sparq-conformance --all-targets --features http-protocol,federation-descriptors -- -D warnings
      - name: Emit served-surface conformance report (JSON, fail-closed)
        env:
          SPARQ_CONFORMANCE_COMMIT: ${{ github.sha }}
          SPARQ_CONFORMANCE_VERSION: ${{ github.ref_name }}
          SPARQ_CONFORMANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Debug (no --release): reuses the both-features artifacts the clippy step above already
          # compiled; the report is a quick in-process run, so optimisation buys nothing here.
          cargo run -p sparq-conformance \
            --features http-protocol,federation-descriptors \
            --bin served-conformance-report -- --out served-conformance.json 2>&1 \
            | tee served-conformance.log
          {
            echo "### Served-surface SPARQL 1.1 Protocol conformance report"
            grep -E 'pass /' served-conformance.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload served-surface conformance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: served-conformance-report
          path: served-conformance.json
          if-no-files-found: error

  inference-conformance:
    # Inference/reasoning conformance RATCHET: RDF Semantics (rdf-mt), OWL 2 RL
    # (W3C OWL WG test cases), the w3c/N3 community-group suite, and
    # sparql11/entailment — run against sparq-reason — PLUS the W3C rdf-turtle
    # suite run through the sparq Turtle parser (parse_to_triples, the B4
    # rejection oracle) — all by the sparq-inference-conformance binary. Current
    # snapshot (2026-06): rdf-mt 48/48; OWL 2 RL 78 pass + 13 documented
    # divergences / 0 fail; N3 1464 pass + 4 divergences / 0 fail;
    # sparql11/entailment 47 pass / 0 fail; W3C rdf-turtle 313 pass / 0 fail —
    # overall 1950 pass + 17 documented divergences = 1967, 0 fail (100.0% of
    # run). Every divergence carries its rationale in the report;
    # research/inference-completeness-audit.md is the per-gap map. This job
    # GATES exactly like the SPARQL ratchet above: a drop below the count is a
    # conformance regression and fails CI. Never lower the ratchet.
    name: Inference conformance (ratchet >= 1967 pass+divergence)
    # [FABLE-5] sq-fmx4u.3: runs `-p sparq-conformance` (inference bin + d-entail/
    # rif-core suites) — skip only when ENFORCED selection proves it unaffected.
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-conformance"'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # [OPUS-5] #4935 — AVAILABILITY DECOUPLING for the only two corpora in this
      # GATING lane that come from a non-GitHub third party: the OWL 2 test-case
      # export (an Internet Archive snapshot, fetched over plain http://) and the
      # W3C RIF WG Core_v1.22 archive. Both are FIXED, sha256-pinned exports, yet
      # they were re-downloaded live on every run — so a bad few minutes at
      # web.archive.org concluded this leg `failure` with nothing measured, which
      # ci-summary correctly fail-fasts on, ejecting unrelated PRs from the merge
      # queue (merge group e5c2e01c, 2026-07-28: six 30s connect timeouts, no
      # assertion failed, PR #4925 ejected). Restoring them from the Actions cache
      # makes the network a CACHE-MISS-ONLY path: fetch-inference-suites.sh
      # short-circuits on the pinned digest (`fetch_pinned_file` / the RIF stamp),
      # so a hit performs zero network I/O. The ratchet is untouched — a genuine
      # regression still reds, because the corpus arriving from cache vs. network
      # is invisible to the runner. Key hashes the fetch script, so ANY pin change
      # busts it (over-busting on an unrelated comment edit only costs one cold
      # fetch). Pinned by scripts/tests/test_inference_corpus_cache.py.
      - name: Restore the pinned OWL 2 / RIF corpora
        id: inference-corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/w3c/owl2
            tests/w3c/rif-core
          key: inference-corpus-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-inference-suites.sh') }}
      - name: Fetch inference test suites (pinned)
        # On a cache hit this fetches only the two github.com clones (rdf-tests,
        # N3); the OWL/RIF steps report "already present (sha256 ok)".
        run: ./scripts/fetch-inference-suites.sh
      # Save from main-scoped runs only — repo cache-save doctrine (sq-3sbrr /
      # sq-6vshe.15): an entry written from a PR or `gh-readonly-queue/` ref is
      # scoped to that ref, which is deleted on merge/ejection, so it is pure
      # unreachable churn against the shared 10 GB budget. PRs and merge groups
      # RESTORE main's entry — which is exactly where the hit that protects the
      # queue comes from. Skipped on a hit: cache entries are immutable.
      - name: Save the pinned OWL 2 / RIF corpora (main-scoped runs)
        if: github.ref == 'refs/heads/main' && steps.inference-corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/w3c/owl2
            tests/w3c/rif-core
          key: inference-corpus-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-inference-suites.sh') }}
      - name: Run inference suites
        # [OPUS-4.8] sq-shacl-flake (generalized from #1236): STEP-LEVEL transient
        # self-heal. This `cargo run` WRITES inference-conformance-report.md as a side
        # effect; a transient crates.io download hiccup aborts the build BEFORE the
        # report is written, leaving it missing/empty, and the "Enforce ratchet" step
        # then greps an absent report → PASS='' → TOTAL=0 and mis-reports a phantom
        # "inference conformance regressed below the ratchet (0 < 1967)". Re-running
        # lets such a transient self-heal. A GENUINE regression still produces a real
        # report and trips the floor honestly — the ratchet is never weakened. Not
        # piped, so the run's own exit code ($?) is authoritative (no PIPESTATUS).
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::Inference conformance — attempt $attempt/$MAX_ATTEMPTS"
            rc=0
            cargo run --profile release-fast -p sparq-conformance --bin sparq-inference-conformance || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "Inference conformance suites completed on attempt $attempt"
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Inference conformance run failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient. A real regression produces a report and trips the ratchet floor below; a 'curl failed'/download error is an infra flake, not a conformance change."
              exit "$rc"
            fi
            echo "::warning::Inference conformance attempt $attempt failed (exit $rc) — retrying once (sq-shacl-flake transient self-heal: most often a transient crates.io download hiccup before the report was written)."
            attempt=$((attempt + 1))
          done
      - name: Summarize
        run: cat inference-conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1967
          # [OPUS-4.8] sq-shacl-flake (generalized from #1236): distinguish "report
          # never produced" (an infra/build flake aborted the run before the report was
          # written) from a GENUINE regression, so a missing/empty report is never
          # mis-reported as "inference conformance regressed below the ratchet
          # (0 < 1967)". With the step-level retry above this should not happen, but if
          # it does we fail with an HONEST, distinct diagnostic.
          if [ ! -s inference-conformance-report.md ] || ! grep -qE '^## Overall \(all inference suites\)' inference-conformance-report.md; then
            echo "::error::Inference conformance report is missing/empty — the run produced no '## Overall (all inference suites)' section. This is an INFRA/build failure (e.g. a transient crates.io download aborting the run), NOT a conformance regression. Re-run the job; inspect the 'Run inference suites' step output above."
            exit 1
          fi
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> out-of-scope — ...**
          # (suite subtotals use the same shape, so parse the line after the
          # final "## Overall (all inference suites)")
          OVERALL=$(grep -A2 '^## Overall (all inference suites)' inference-conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::inference conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Run D-entailment lane (d-entail feature ON) + enforce floor
        # [OPUS-4.8] sq-e5atd (epic sq-pbz04) — the OPT-IN D-entailment (datatype /
        # value-space) ratchet. SEPARATE from the binary ratchet above so the default
        # inference binary stays byte-for-byte unchanged (the D-only sparql11/entailment
        # tests remain OutOfScope there). This crate-test runs those tests through the
        # real `sparq_reason::Profile::D` materializer and prints a `TOTAL d-entail`
        # line; the floor (D_ENTAIL_FLOOR, mirrored in scoreboard::SUITES) is asserted
        # in-runner AND re-grepped here. `--nocapture` so the TOTAL line reaches stdout.
        run: |
          set -uo pipefail
          cargo test -p sparq-conformance --features d-entail --test d_entail_suite -- --nocapture \
            | tee d-entail-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::D-entailment lane test failed (exit $rc)"; exit "$rc"; }
          if ! grep -qE '^TOTAL d-entail ' d-entail-conformance.out; then
            echo "::error::D-entailment lane produced no 'TOTAL d-entail' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          FLOOR=1
          PASS=$(grep -E '^TOTAL d-entail ' d-entail-conformance.out | awk '{print $3}' | head -1)
          echo "D-entailment pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::D-entailment regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      - name: Run RIF WG Core conformance lane (rif-wg-core feature ON) + enforce floor
        # [FABLE-5] sq-pbz04.5.5 (epic sq-pbz04.5) — the OPT-IN W3C RIF WG test-suite
        # CONFORMANCE arm, Core subset. SEPARATE from the binary ratchet above and from the
        # sparq-EXTENSION rif-core expressivity lane below: this drives the REAL W3C RIF WG
        # test cases (the pinned Core_v1.22 archive fetched by the fetch step above) end-to-end
        # through the real RIF/XML import -> validate -> closure -> conclusion oracle, and
        # prints a `TOTAL rif-wg-core <pass> <fail> <skip>` line; the floor (RIF_WG_CORE_FLOOR,
        # mirrored in scoreboard::SUITES) is asserted in-runner AND re-grepped here. An
        # HONEST-denominator standards lane — the printed skip taxonomy is the honesty — and
        # NET-vacuity-guarded (an un-importable premise is a SKIP, never a vacuous pass).
        # `--nocapture` so the TOTAL line reaches stdout.
        run: |
          set -uo pipefail
          cargo test -p sparq-conformance --features rif-wg-core --test rif_wg_core_suite -- --nocapture \
            | tee rif-wg-core-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::RIF WG Core lane test failed (exit $rc)"; exit "$rc"; }
          if ! grep -qE '^TOTAL rif-wg-core ' rif-wg-core-conformance.out; then
            echo "::error::RIF WG Core lane produced no 'TOTAL rif-wg-core' line — infra/build issue (or the fetched Core_v1.22 archive is absent), not a conformance change. Re-run the job."
            exit 1
          fi
          FLOOR=0
          PASS=$(grep -E '^TOTAL rif-wg-core ' rif-wg-core-conformance.out | awk '{print $3}' | head -1)
          echo "RIF WG Core pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::RIF WG Core regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      - name: Run RIF-Core expressivity lane (rif-core feature ON) + enforce floor
        # [OPUS-4.8] sq-rh4gu (epic sq-pbz04) — the OPT-IN RIF-Core (monotone Horn)
        # expressivity ratchet. SEPARATE from the binary ratchet above so the default
        # inference binary stays byte-for-byte unchanged. This crate-test drives the
        # RIF-Core feature axes through the real `sparq_reason::rif::Document::closure`
        # / `validate` path and prints a `RIF-Core expressivity assertions N` line; the
        # floor (RIF_CORE_FLOOR, mirrored in scoreboard::SUITES) is asserted in-runner
        # AND re-grepped here. HONESTLY a sparq-EXTENSION ratchet over the RIF-Core
        # subset — NOT the normative W3C SPARQL-RIF conformance suite. `--nocapture` so
        # the assertions line reaches stdout. No fetched fixtures (self-asserting).
        run: |
          set -uo pipefail
          cargo test -p sparq-conformance --features rif-core --test rif_core_suite -- --nocapture \
            | tee rif-core-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::RIF-Core lane test failed (exit $rc)"; exit "$rc"; }
          if ! grep -qE '^RIF-Core expressivity assertions ' rif-core-conformance.out; then
            echo "::error::RIF-Core lane produced no 'RIF-Core expressivity assertions' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          FLOOR=47
          ASSERTS=$(grep -E '^RIF-Core expressivity assertions ' rif-core-conformance.out | awk '{print $4}' | head -1)
          echo "RIF-Core expressivity assertions: ${ASSERTS:-unknown} (floor: $FLOOR)"
          [ -n "$ASSERTS" ] && [ "$ASSERTS" -ge "$FLOOR" ] || { echo "::error::RIF-Core expressivity regressed below the ratchet ($ASSERTS < $FLOOR)"; exit 1; }
      - name: Run OWL 2 EL classification lane (el-suite feature ON) + enforce floor
        # [SONNET-4.6] sq-pbz04.2.4 (epic sq-pbz04) — the OPT-IN OWL 2 EL classification
        # EXPRESSIVITY ratchet. SEPARATE from the binary ratchet above so the default
        # inference binary stays byte-for-byte unchanged. This crate-test drives each W3C
        # OWL 2 EL (test:EL ∧ test:RDF-BASED, Approved) test case through the real
        # `sparq_reason_el::classify_graph` classifier + the shared bnode-homomorphism
        # entailment check and prints an `OWL 2 EL ratchet pass N of M (floor F)` line; the
        # floor (EL_SUITE_FLOOR, mirrored in scoreboard::SUITES) is asserted in-runner AND
        # re-grepped here. HONESTLY a sparq-EXTENSION ratchet over the EL fragment the
        # classifier implements — NOT a full OWL 2 EL conformance claim (CR7–CR9 concrete
        # domains + ABox inconsistency are deferred; 28 audited divergences reported
        # separately, never summed in). `--nocapture` so the ratchet line reaches stdout.
        run: |
          set -uo pipefail
          # [FABLE-5] sq-wy3i6: `el-suite-par` ADDS the parallel-saturation differential
          # (classify_graph_par at 1/2/8 threads must reproduce the sequential closure on
          # every selected W3C EL case). Floor accounting is unchanged — the ratchet still
          # runs on the sequential engine; a par divergence panics the case, turning the lane red.
          cargo test -p sparq-conformance --features el-suite,el-suite-par --test el_suite -- --nocapture \
            | tee el-suite-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::OWL 2 EL lane test failed (exit $rc)"; exit "$rc"; }
          if ! grep -qE '^OWL 2 EL ratchet pass ' el-suite-conformance.out; then
            echo "::error::OWL 2 EL lane produced no 'OWL 2 EL ratchet pass' line — infra/build issue, not a conformance change. Re-run the job."
            exit 1
          fi
          # [SONNET-4.6] Read EL_SUITE_FLOOR from source so the CI step cannot drift
          # from the in-runner const (Fix 4 — Copilot thread).
          FLOOR=$(grep -E '^\s+pub const EL_SUITE_FLOOR\s*:\s*usize\s*=' \
            crates/sparq-conformance/tests/el_suite.rs \
            | grep -oE '[0-9]+' | head -1)
          if [ -z "$FLOOR" ]; then
            echo "::error::Could not parse EL_SUITE_FLOOR from el_suite.rs — check the const declaration"
            exit 1
          fi
          PASS=$(grep -E '^OWL 2 EL ratchet pass ' el-suite-conformance.out | awk '{print $6}' | head -1)
          echo "OWL 2 EL classification pass: ${PASS:-unknown} (floor: $FLOOR)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$FLOOR" ] || { echo "::error::OWL 2 EL classification regressed below the ratchet ($PASS < $FLOOR)"; exit 1; }
      - name: Run OWL 2 QL lanes (ql-experimental feature ON) + enforce the pinned floor
        # [FABLE-5] sq-pbz04.3.4 (epic sq-pbz04.3) — the OPT-IN OWL 2 QL lanes.
        # SEPARATE from the binary ratchet above so the default inference binary stays
        # byte-for-byte unchanged (every QL row remains OutOfScope there). Runs the
        # THREE ql-experimental suites: (a) ql_entailment_floor — the PINNED NAMED-CASE
        # floor of the six-condition-sound pr:QL subset (exact set equality asserted
        # in-runner: a regressing pinned case AND an unpinned newly-eligible case both
        # fail; QL_ENTAILMENT_FLOOR mirrored in scoreboard::SUITES); (b) ql_dllite_suite
        # — the sq-qo1a9 DL-Lite_R certain-answer oracle ratchet (QL_DLLITE_FLOOR),
        # previously wired into NO CI lane (a discovered gap this step also closes);
        # (c) ql_experimental_arm — the taxonomy/no-binary-graduation invariants.
        # The pinned floor is asserted in-runner AND re-grepped here, read from source
        # so this step cannot drift from the in-runner const. HONESTLY sparq-EXTENSION
        # ratchets — NOT an OWL 2 QL / entailment-regime conformance claim.
        # `--nocapture` so the ratchet lines reach stdout.
        run: |
          set -uo pipefail
          cargo test -p sparq-conformance --features ql-experimental --test ql_entailment_floor --test ql_dllite_suite --test ql_experimental_arm -- --nocapture \
            | tee ql-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::OWL 2 QL lane tests failed (exit $rc)"; exit "$rc"; }
          if ! grep -qE '^QL entailment graduated floor ' ql-conformance.out; then
            echo "::error::QL lane produced no 'QL entailment graduated floor' line — the pinned-floor runner self-skipped or did not run. This job fetches the fixtures, so that is an infra issue, not a conformance change."
            exit 1
          fi
          FLOOR=$(grep -E '^\s+pub const QL_ENTAILMENT_FLOOR\s*:\s*usize\s*=' \
            crates/sparq-conformance/tests/ql_entailment_floor.rs \
            | grep -oE '[0-9]+' | head -1)
          if [ -z "$FLOOR" ]; then
            echo "::error::Could not parse QL_ENTAILMENT_FLOOR from ql_entailment_floor.rs — check the const declaration"
            exit 1
          fi
          GRADUATED=$(grep -E '^QL entailment graduated floor ' ql-conformance.out | awk '{print $5}' | head -1)
          echo "OWL 2 QL entailment graduated subset: ${GRADUATED:-unknown} (pinned floor: $FLOOR)"
          [ -n "$GRADUATED" ] && [ "$GRADUATED" -ge "$FLOOR" ] || { echo "::error::OWL 2 QL graduated subset regressed below the pinned floor ($GRADUATED < $FLOOR)"; exit 1; }
          if ! grep -qE '^QL DL-Lite_R sound-and-complete ' ql-conformance.out; then
            echo "::error::QL lane produced no 'QL DL-Lite_R sound-and-complete' line — the sq-qo1a9 oracle ratchet did not run."
            exit 1
          fi
      - name: Run OWL 2 Direct-Semantics arm (dl-direct feature ON) + enforce the pinned floors
        # [FABLE-5] sq-pbz04.4.5 (epic sq-pbz04.4) — the OPT-IN OWL 2 DIRECT-SEMANTICS
        # arm. SEPARATE from the binary ratchet above so the default inference binary
        # stays byte-for-byte unchanged. Drives the DIRECT-sanctioned arm of the OWL WG
        # export through the REAL sparq-reason-dl pipeline: the L2 syntactic profile
        # checker (vs the export's POSITIVE test:profile tags ONLY — the explicit-negative
        # direction was measured and not adopted, runner module docs) and the L4 fragment-dispatch
        # DirectChecker (consistency / inconsistency / positive- / negative-entailment)
        # under a PINNED deterministic count budget. TRI-STATE accounting — an
        # ABSTENTION IS NEVER A PASS — with the two floors EXACT-pinned in-runner
        # (`==`, not `>=`, so abstention-inflation and regression BOTH fail) and
        # re-grepped here from source so this step cannot drift from the in-runner
        # consts. HONESTLY sparq-EXTENSION ratchets over the SCOPED FRAGMENT the
        # layered checker implements — NOT full OWL 2 DL, never summed into a
        # conformance number. `--nocapture` so the ratchet lines reach stdout.
        # [SONNET-4.6] sq-25q5q: run this lane optimized. The sparq-reason-dl L4
        # tableau does a per-rule-application O(nodes×labels) rescan (a pre-existing
        # property found during sq-pbz04.4.5), so the DEBUG test-RUNTIME dominated the
        # whole inference-conformance job (~9 min of an ~11 min job in CI history vs
        # seconds for every sibling lane). Optimized codegen collapses that runtime; the one-
        # time optimized compile of sparq-reason-dl + the dl_suite harness is amortized
        # by the Swatinem release cache (the `Run inference suites` step above already
        # warms the release-fast profile via `cargo run --profile release-fast`). COVERAGE IS UNCHANGED:
        # same test target, same `dl-direct` feature, same EXACT `==` pins (68 profile /
        # 184 direct) asserted in-runner and re-grepped from source — only the codegen
        # optimization level changes, never the assertions or the fail-closed behavior.
        run: |
          set -uo pipefail
          cargo test --profile release-fast -p sparq-conformance --features dl-direct --test dl_suite -- --nocapture \
            | tee dl-direct-conformance.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::OWL 2 Direct-Semantics arm test failed (exit $rc)"; exit "$rc"; }
          for lane in "profile-identification" "direct"; do
            if ! grep -qE "^OWL 2 DL ${lane} ratchet pass " dl-direct-conformance.out; then
              echo "::error::DL arm produced no 'OWL 2 DL ${lane} ratchet pass' line — the runner self-skipped or did not run. This job fetches the fixtures, so that is an infra issue, not a conformance change."
              exit 1
            fi
          done
          PROFILE_FLOOR=$(grep -E '^\s+pub const DL_PROFILE_FLOOR\s*:\s*usize\s*=' \
            crates/sparq-conformance/tests/dl_suite.rs | grep -oE '[0-9]+' | head -1)
          DIRECT_FLOOR=$(grep -E '^\s+pub const DL_DIRECT_FLOOR\s*:\s*usize\s*=' \
            crates/sparq-conformance/tests/dl_suite.rs | grep -oE '[0-9]+' | head -1)
          if [ -z "$PROFILE_FLOOR" ] || [ -z "$DIRECT_FLOOR" ]; then
            echo "::error::Could not parse DL_PROFILE_FLOOR / DL_DIRECT_FLOOR from dl_suite.rs — check the const declarations"
            exit 1
          fi
          PROFILE_PASS=$(grep -E '^OWL 2 DL profile-identification ratchet pass ' dl-direct-conformance.out | awk '{print $7}' | head -1)
          DIRECT_PASS=$(grep -E '^OWL 2 DL direct ratchet pass ' dl-direct-conformance.out | awk '{print $7}' | head -1)
          echo "OWL 2 DL profile-identification pass: ${PROFILE_PASS:-unknown} (pinned: $PROFILE_FLOOR); direct pass: ${DIRECT_PASS:-unknown} (pinned: $DIRECT_FLOOR)"
          [ -n "$PROFILE_PASS" ] && [ "$PROFILE_PASS" -ge "$PROFILE_FLOOR" ] || { echo "::error::OWL 2 DL profile-identification regressed below the pinned floor ($PROFILE_PASS < $PROFILE_FLOOR)"; exit 1; }
          [ -n "$DIRECT_PASS" ] && [ "$DIRECT_PASS" -ge "$DIRECT_FLOOR" ] || { echo "::error::OWL 2 DL direct lane regressed below the pinned floor ($DIRECT_PASS < $DIRECT_FLOOR)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: inference-conformance-report
          path: inference-conformance-report.md

  coverage-floors:
    # [OPUS-4.8] sq-p0hcd: the FAST, NO-COMPILE coverage gates, split out of the old
    # single `coverage` job so they run ONCE (not per shard) and FAIL FAST — before the
    # ~15 min instrumented shard builds — on a ratchet-direction violation or a shard-
    # partition drift. Three cheap source-only checks:
    #   - test-PRESENCE gate: per-crate #[test]-count FLOOR (bench/coverage-presence.json),
    #     catches a whole crate losing its tests (which a line-% ratchet can miss, e.g. the
    #     subprocess-driven sparq-cli at ~0%).
    #   - coverage-floor MONOTONICITY gate (sq-neq8): FAIL if this branch LOWERS/DROPS any
    #     crate's floor vs origin/main — the ratchet only RISES.
    #   - shard-partition guard (sq-p0hcd): FAIL if SHARD_GROUPS no longer partitions
    #     PER_COMMIT_CRATES exactly, so a crate added to the per-commit set can never be
    #     silently dropped from every shard (which would leave it un-gated).
    # The heavy per-crate line-% MEASUREMENT moved to the `coverage-measure` MATRIX below.
    name: coverage floors (presence + monotonicity + shard-partition, no compile)
    needs: changes
    # Same trigger envelope as the old job: never on the nightly schedule (the heavy tier
    # is coverage-nightly), skip a doc-only PR. push/merge_group force rust_changed=true.
    if: github.event_name != 'schedule' && needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    # [SONNET-4.6] sq-6vshe.17: `issues: read` is what the ratchet-ADVANCE pause step needs
    # to probe for an open post-merge coverage alarm. Least privilege — this job never
    # writes anything (the alarm is FILED by `coverage-demoted-filer`, which owns the write
    # scope), and the probe fails OPEN if the read is unavailable.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test-presence gate (fast, no compile)
        run: python3 scripts/coverage-presence.py --check
      - name: Shard-partition guard (fast, no compile)
        # FAIL if the per-commit MATRIX shard groups drift from PER_COMMIT_CRATES (missing/
        # extra/overlapping crate) — a missing crate would be measured by NO shard and thus
        # SILENTLY UN-GATED. Reproduced locally: bash scripts/coverage.sh --check-shards.
        run: ./scripts/coverage.sh --check-shards
      - name: Coverage-floor MONOTONICITY gate (ratchet only rises, fast, no compile)
        # [OPUS-4.8] sq-neq8: FAIL if THIS branch LOWERS/DROPS any crate's coverage floor
        # vs origin/main. --check-robust only compares measured-vs-floor, so a floor
        # DECREASE in a PR is otherwise invisible — exactly how #661 (sq-cafc) silently
        # re-seeded sparq-serve 92->83 (caught by a human, not CI). Mirrors the conformance
        # ratchet's only-rises enforcement. A deliberate, reviewed regression must add
        # --allow-lower to this command in the PR (and a reviewer must approve it).
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 scripts/coverage-gate.py --check-monotonic --base-ref origin/main
      - name: Ratchet-ADVANCE pause while post-merge coverage is RED (sq-6vshe.17) [SONNET-4.6]
        # [SONNET-4.6] sq-6vshe.17: the second half of the demotion protocol. Because the
        # coverage MEASUREMENT is demoted off merge_group, `main` is an enforcement point;
        # while its coverage is RED (an open `[demoted-lane] lane=coverage-ratchet-main`
        # issue, filed by `coverage-demoted-filer`), RAISING a floor is unverifiable
        # book-keeping — the measured numbers a raise cites are exactly the numbers in
        # doubt. So a branch that RAISES a floor is blocked until that alarm closes.
        #
        # Deliberately narrow + non-blocking by default:
        #   * only a RAISE of an existing floor blocks; a new crate row, an unchanged
        #     floor, and the RECOVERY path (a governed lowering under --allow-lower) never
        #     do — see coverage-gate.py floor_advances();
        #   * the alarm probe FAILS OPEN (no gh / no token / API error => PASS), so an
        #     unavailable GitHub API can never red this fast gating job;
        #   * `issues: read` is the only permission it needs.
        # Unit-tested (pure seam + injected probe): coverage-gate.py --self-test.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coverage-gate.py --check-advance-allowed --base-ref origin/main

  coverage-measure:
    # [OPUS-4.8] PER-CRATE line-coverage RATCHET (sq-hbg7), now SHARDED for merge-queue
    # throughput (sq-p0hcd). Mirrors the conformance-ratchet idiom: a checked-in per-crate
    # FLOOR (bench/coverage-floor.json) that may only RISE.
    #
    # WHY PER-CRATE, NOT `cargo llvm-cov --workspace`: a single whole-workspace
    # instrumented run does NOT finish in a bounded window. So scripts/coverage.sh
    # measures PER-CRATE, with these audit-discovered quirks (no silent caps —
    # research/coverage-and-benchmark-plan.md §2.2/§2.3):
    #   - sparq-core measured with --features mmap,dict-spill,rdfxml (else those surfaces 0%);
    #   - W3C fixtures fetched FIRST (SHACL/reason-explain/EYE/rdf-turtle suites SKIP when
    #     fixtures are absent -> misleadingly-low + flaky number);
    #   - the two sparq-vectors *_recall_at_10_vs_brute_force_on_50k tests (HNSW + DiskANN,
    #     50k vecs each) are EXCLUDED here (measured >10 min under instrumentation) and run
    #     in `coverage-nightly` instead;
    #   - sparq-cli / sparq-conformance / sparq-gpu have floor 0 (subprocess artifact /
    #     test-driver / device-gated) — guarded by the presence gate.
    # sparq-py is excluded (pyo3/maturin, not an llvm-cov target).
    #
    # WHY SHARDED (sq-p0hcd): the old single job measured ALL per-commit crates in ONE
    # SERIAL loop = ~28 min wall-clock on the merge-queue critical path (2026-07-02 profile,
    # run 28624093902: the `Measure + enforce` step alone was 1691s, the per-crate loop
    # 1676s, DOMINATED by sparq-engine 668s ≈ 40%, then core 210s / vectors 167s / solid
    # 165s / server 114s). scripts/coverage.sh SHARD_GROUPS LPT-bin-packs the crates by that
    # measured time into balanced shards that measure CONCURRENTLY here. Each shard runs the
    # IDENTICAL coverage.sh + `--check-robust`, so the ratchet semantics are unchanged: a
    # shard whose crate is below floor FAILS -> the ci-summary gate FAILS. A crate outside a
    # shard's subset is reported MISSING by --check-robust (non-fatal for that shard — it is
    # gated by the shard that DOES measure it). The `coverage-floors` shard-partition guard
    # proves every per-commit crate is measured by exactly one place.
    #
    # [FABLE-5] sq-piapk: sparq-engine (the old shard-1 ~668s wall-clock FLOOR) is NO LONGER
    # in this matrix — it moved to the dedicated cross-runner SPLIT pipeline below
    # (coverage-engine-{archive,run,merge}). A compile-vs-test profile found the engine shard
    # is ~97% TEST-EXECUTION-bound (instrumented compile ~16-26s; the pole is the test run),
    # so the lever is splitting the TEST EXECUTION across runners (nextest --partition) and
    # MERGING each partition's .profraw into one coverage-identical report — NOT a per-shard
    # rebuild. This matrix therefore drops to the 3 remaining (non-engine) shards; engine is
    # gated identically by the merge job's `coverage-gate.py --check`.
    name: coverage ratchet (shard ${{ matrix.shard }}/3)
    # [OPUS-4.8] sq-fmx4u.6 (design §5.2, phase 2): coverage is a function of
    # compiled code + tests, so its SELECTION exception is a single narrow one — skip
    # only when the affected closure is PROVABLY EMPTY (every changed path SAFE-listed /
    # non-crate, so mode=selected AND affected==[]). Any NON-empty closure keeps it
    # running, because a dependency change can shift executed lines in dependents.
    # [SONNET-4.6] (This comment used to say "ALWAYS-RUN with ONE exception". Two
    # EVENT-level demotions have since been layered on top of the selection rule —
    # draft-tier CI and the sq-6vshe.17 merge_group demotion, both documented below —
    # so the "always-run" framing is scoped to the SELECTION axis only.)
    # Same fail-closed guard shape build-archive uses: `mode != 'selected'` (full/
    # shadow/empty output) => RUN, and `affected != '[]'` => RUN; both false (the
    # SAFE-only case) => skip (the shard reports `skipped`, which the `coverage`
    # aggregator counts as satisfied). This references only github/needs contexts —
    # no `matrix.*` — so it is safe as a job-level `if:` on this matrix job. The
    # nightly full coverage backstop is `coverage-nightly` (schedule), unaffected.
    # [FABLE-5] Draft-tier CI: coverage is SKIPPED on draft PR heads entirely (the
    # instrumented rebuild is one of the heaviest lanes; the ready_for_review
    # full-tier run re-measures it, and a draft-tier gate can never admit a PR —
    # docs/branch-protection.md §Draft-tier CI). The guard is fail-open off the PR
    # path: any non-pull_request event (push) satisfies the first disjunct => RUN.
    #
    # [SONNET-4.6] sq-6vshe.17 (research/ci-mergequeue-speedup-2026-07.md §3.4a):
    # the coverage MEASUREMENT is DEMOTED off the merge_group blocking path. MEASURED
    # MOTIVE: these instrumented shards (448-785 s each) are the merge-group entry
    # POLE whenever change-based selection skips the test shards. WHY it is designable
    # at all: coverage is a RATCHET, not a correctness test — a floor regression that
    # slips through a queued BATCH is detectable and RECOVERABLE post-merge, unlike a
    # functional bug. Enforcement topology after this change:
    #   * pull_request  — UNCHANGED, and the PRIMARY gate (every PR still measures).
    #   * merge_group   — the measure legs are skipped (this guard). `coverage-floors`
    #                     (fast, no-compile: presence + monotonicity + shard-partition)
    #                     STILL RUNS here, so a batch can never LOWER a committed floor.
    #   * push-to-main  — UNCHANGED and now load-bearing: the post-merge measurement is
    #                     the enforcement point for the batch-stacking case. It is
    #                     EXEMPT from any future push-run skip (sq-6vshe.14) — pinned by
    #                     scripts/tests/test_ci_select_wiring.py so the exemption cannot
    #                     be silently dropped when that lever lands.
    #   * a main red    — auto-files a P1 bead + deduped issue via the demotion protocol
    #                     (`coverage-demoted-filer` below) AND pauses further ratchet
    #                     ADVANCES until green (`coverage-floors`
    #                     --check-advance-allowed).
    # RESIDUAL RISK, stated honestly: two PRs each individually >= floor can merge to a
    # combined tree < floor. Rare, caught ~15 min later on main, recoverable by
    # revert/fix-forward — and no committed floor is ever silently lowered.
    # The skipped legs report `skipped`, which the `coverage` aggregator counts as
    # satisfied, so the ci-summary gate still sees ONE terminal coverage check on the
    # merge_group ref — never an expected-but-missing one.
    needs: [changes, coverage-floors, select]
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' || needs.select.outputs.affected != '[]')
    runs-on: ubuntu-latest
    # [SONNET-4.6] sq-6vshe.11: RE-DELIVER the workflow-level lld link flag to this job.
    # cargo-llvm-cov sets RUSTFLAGS/CARGO_ENCODED_RUSTFLAGS to inject -C instrument-coverage,
    # and cargo's rustflags sources are first-match-wins, so the workflow-level
    # CARGO_TARGET_<triple>_RUSTFLAGS is DROPPED here (see the env: block at the top of this
    # file for the measurement). Setting RUSTFLAGS at job level puts the flag on the source
    # cargo-llvm-cov actually reads and extends, so the instrumented links — the heaviest in
    # CI — should go through lld like every other native job (the append behaviour is
    # documented, not measured here; see the env: block's note). Host-only job, so the
    # per-target scoping the workflow-level var provided (wasm32 on wasm-ld) is not needed.
    # VALUE MUST STAY IDENTICAL across all four cargo-llvm-cov jobs; enforced by
    # scripts/check-coverage-rustflags.py.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false   # one failing shard must NOT cancel the others (want all verdicts)
      matrix:
        shard: [1, 2, 3]   # [FABLE-5] sq-piapk: was [1,2,3,4]; engine (old shard 1) split out
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] sq-czlh: reclaim ~20-30 GB of pre-installed SDKs/toolchains BEFORE the
      # instrumented build. cargo-llvm-cov compiles the workspace per-crate with coverage
      # instrumentation AND writes a `.profraw` per test, on a runner that starts with only
      # ~14 GB free on `/` — the same `No space left on device` profile sq-c76x fixed in the
      # load-aware test lane. Same in-repo, SHA-pin-free, best-effort step (absent paths
      # no-op). See scripts/ci-free-disk.sh.
      - name: Free runner disk before build + instrumented test
        run: ./scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      # [OPUS-5] REQUIRED once the root `rust-toolchain.toml` pin exists. The action
      # above installs `llvm-tools-preview` onto the toolchain IT manages (`stable`)
      # and then calls `rustup default` — precedence 5, which the toolchain file
      # (precedence 4) outranks. So cargo here resolves to the PINNED toolchain, on
      # which the component would be absent, and `cargo llvm-cov` fails with the
      # llvm-tools missing rather than measuring anything. This adds the component to
      # the ACTIVE (pinned) toolchain. Idempotent, and a no-op if it is already there.
      - name: Ensure llvm-tools-preview on the pinned toolchain
        run: rustup component add llvm-tools-preview
      # [OPUS-5] sq-h2gz6 / [SONNET-4.6] sq-aemq7 (both beads reached this independently;
      # the shared key is named `coverage-measure` after the job): ONE shared dep cache
      # for ALL shards (was `key: coverage-shard-${{ matrix.shard }}`, i.e. one cache per
      # matrix leg — 4 of them before sq-piapk split the engine shard out, 3 now).
      #
      # The per-shard key's premise was "each shard builds a DIFFERENT crate subset
      # (different instrumented objects), so keying by shard keeps them from clobbering
      # one another". That premise is about sparq's OWN crates — and rust-cache never
      # stores those: it deletes workspace-member artifacts from the target dir before
      # saving, so what a shard actually persists is the EXTERNAL dependency closure,
      # compiled from the same Cargo.lock with the same llvm-cov instrumentation flags
      # in every shard. Near-identical caches, one budget slot each. `shared-key` is
      # documented as replacing the automatic job-id-derived key, so the matrix legs land
      # on one entry instead of one per leg.
      #
      # Collapsing them frees ~2 slots of the shared 10 GB Actions-cache budget (the
      # sq-3sbrr / #1395 finding: budget pressure is what LRU-evicts the warm entries
      # and makes the heavy jobs restore cold).
      #
      # HONEST RESIDUAL, since the shards are NOT identical builds: coverage.sh selects
      # per-crate `--features` (sparq-core mmap,dict-spill,rdfxml; sparq-reason datalog; …),
      # so each shard's dep closure is a different subset and per-shard feature
      # unification can make one shard's dep set a superset of another's. rust-cache skips
      # saving on an exact key hit, so one shard's closure wins the entry and the others
      # get a PARTIAL restore and still compile their extra deps cold. That is a smaller
      # compile win than three warm caches would give, traded deliberately for the
      # cache-budget headroom these beads are about — and it is still strictly better than
      # the cold rebuild an evicted key forces, with no stale-artifact risk (fingerprints
      # + the key already embed Cargo.lock, the rustc version and the Cargo.toml hashes).
      #
      # NOT affected: the shard PARTITION is chosen by the COVERAGE_SHARD env var below,
      # which coverage.sh maps to SHARD_GROUPS[n-1]. Nothing reads the cache key, so which
      # crates each shard measures is unchanged by this.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # REPLACES the former per-shard `key: coverage-shard-<n>` for the reason
          # spelled out in the note above this step — the two are mutually exclusive,
          # since a per-shard `key:` would re-split the one entry back into three.
          shared-key: coverage-measure
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Full rationale on the
          # `build-archive` cache step above; pinned by
          # scripts/tests/test_mergequeue_cache_posture.py. Saving on main only also
          # removes the concurrent-save race the per-shard key was working around: on
          # main the shards still run together, but a duplicate-key save is a benign
          # no-op (the cache API rejects the second writer), not a clobber.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        # [OPUS-4.8] sq-tool-pin: taiki-e/install-action picks the tool from its @<tool> ref;
        # SHA-pinning (our code-scanning=0 policy) drops that ref, so an explicit `with: tool:`
        # is MANDATORY — without it install-action installs NOTHING and `cargo llvm-cov` ENOENTs.
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Compute coverage cone (ENFORCE mode, sq-3dr4t) [SONNET-4.6]
        # [SONNET-4.6] sq-3dr4t (flips sq-6vshe.8's shadow mode): computes the reverse-dep
        # closure of the PR diff (reusing ci_select.py's diff classifier and fail-safe rules
        # via shared import — NOT a diverging copy) and now ENFORCES it: `cone-crates.txt`
        # becomes COVERAGE_CONE for the measure step below, which intersects this shard's
        # crate group with it. A crate outside the cone is NOT measured — neither it nor any
        # of its transitive deps changed, so its per-crate floor verdict from main's last
        # full run still holds (the SAME soundness argument ci_select.py already makes for
        # skipping its tests). Its floor stays enforced on main by the nightly full run.
        #
        # THE CONE IS THE `select` JOB'S OUTPUT, NOT AN IN-JOB DIFF. This job checks out at
        # the `actions/checkout` DEFAULT (shallow) depth and does NOT set `fetch-depth: 0`
        # (ci-select.yml does, explicitly so its three-dot diff resolves), so
        # `git diff base...head` cannot resolve the base here and would fail-safe to
        # mode=full every time, making the flip a no-op. `select` already
        # ran the SAME ci_select.select() on a full-history checkout, so its `affected`
        # closure IS the cone; we consume it instead of recomputing it (also avoids a
        # second full clone × 3 shards). This job already `needs: select`.
        #
        # FAIL-SAFE: an EMPTY cone-crates.txt means "no filter", i.e. measure the whole
        # shard exactly as before the flip. Narrowing happens ONLY for an explicit
        # mode=selected. Every §4.1 full-run trigger (Cargo.lock, root Cargo.toml,
        # .github/, scripts/, an unowned path — which includes bench/coverage-floor.json,
        # so a floor edit can never ride in unmeasured), the `ci-full` label, the
        # CI_SELECT_MODE=shadow rollback, a non-PR event, and every internal error all
        # resolve to mode=full ⇒ empty file. No failure mode can NARROW measurement.
        env:
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_AFFECTED: ${{ needs.select.outputs.affected }}
          # Recorded in cone.json for provenance (which base the inherited verdicts came
          # from); NOT used to compute the cone — see above.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Pre-create the file EMPTY, and reset it to empty on any failure, so a partial
          # write or an import error degrades to a full shard measurement rather than a
          # silently narrowed one. The `||` also keeps this step gate-neutral.
          : > cone-crates.txt
          python3 scripts/cone_coverage.py \
            --mode compute-cone --enforce \
            --select-mode "${SELECT_MODE:-}" \
            --select-affected "${SELECT_AFFECTED:-[]}" \
            --base "${BASE:-}" --head "${HEAD:-}" \
            --crates-output cone-crates.txt \
            --output cone.json || : > cone-crates.txt
          # Collapse to the single space-separated line coverage.sh reads. Empty (or
          # whitespace-only) => coverage.sh applies no filter and measures the whole shard.
          echo "COVERAGE_CONE=$(tr '\n' ' ' < cone-crates.txt)" >> "$GITHUB_ENV"
      - name: Measure + enforce per-crate coverage (shard ${{ matrix.shard }}, max-remeasure gate)
        # [OPUS-4.8] sq-x4jy: ROBUST per-crate MAX-REMEASURE gate. Measure this shard's crate
        # subset once (COVERAGE_SHARD selects SHARD_GROUPS[shard-1]), then --check-robust
        # re-measures ONLY this shard's crates that are below floor (up to K=3 total
        # measurements each) and keeps the per-crate MAX, failing only if a crate is STILL
        # below floor after K independent reads.
        #
        # WHY the robust gate: llvm-cov only ever UNDERCOUNTS (an aborted test / un-merged
        # .profraw LOSES coverage, never adds it), so the true coverage is the MAX across
        # independent measurements. It never ACCEPTS a low number — a genuine drop is
        # reproducible and fails ALL K measurements; a transient undercount recovers on a
        # re-measure. coverage.sh still serialises each binary's tests (--test-threads=1) to
        # minimise the profraw-merge race at the source; this gate is the principled backstop.
        #
        # [SONNET-4.6] sq-3dr4t: COVERAGE_CONE comes from the previous step via $GITHUB_ENV
        # and INTERSECTS this shard's group — so the crates measured here are
        # SHARD_GROUPS[shard-1] ∩ cone, and the rest inherit their main floor verdict. It is
        # empty (⇒ no filter, whole shard measured) on every fail-safe path. The robust
        # re-measure loop is unaffected: it passes COVERAGE_CRATES, which bypasses the filter.
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          ./scripts/coverage.sh
          python3 scripts/coverage-gate.py --check-robust target/coverage/coverage-summary.json
      - name: Cone coverage report (sq-6vshe.8 / sq-3dr4t) [SONNET-4.6]
        # [SONNET-4.6] Post-step. Renders the cone against what the shard actually measured:
        # crates IN the cone are labeled "cone-measured" with their line%; crates the
        # enforced filter SKIPPED (from the summary's `cone.inherited` block) are labeled
        # "inherited (unchanged cone): PASS", so the skip is auditable rather than an
        # unexplained gap. Reporting only — it never fails the shard (coverage-gate.py is
        # the sole gate). NB under enforce the outside-cone crates are not measured, so
        # divergence detection is structurally unavailable and the report says so instead
        # of implying the empty divergence list proves the cone sound.
        if: always() && hashFiles('cone.json') != '' && hashFiles('target/coverage/coverage-summary.json') != ''
        run: |
          python3 scripts/cone_coverage.py \
            --mode report \
            --cone cone.json \
            --coverage-summary target/coverage/coverage-summary.json \
            --divergence-log coverage-cone-divergence-shard-${{ matrix.shard }}.json \
            --summary-file "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage summary (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary-shard-${{ matrix.shard }}
          path: target/coverage/coverage-summary.json

  # ============================================================================
  # [FABLE-5] sq-piapk: sparq-engine CROSS-RUNNER COVERAGE SPLIT
  # (partitioned test-exec across runners + identity-preserving .profraw merge).
  #
  # WHY: after the 4-way per-commit coverage matrix (sq-p0hcd), the ONE remaining
  # wall-clock floor was the sparq-engine shard measured ALONE (~668s ≈ 40% of the
  # coverage job — the merge-queue's slow sibling). A compile-vs-test profile of
  # that shard (this bead) found it ~97% TEST-EXECUTION-bound (instrumented compile
  # ~16-26s; the pole is the serial instrumented test run). So the lever is to
  # SPLIT the TEST EXECUTION across N runners — each running a nextest test-level
  # PARTITION and emitting its own .profraw — then MERGE the .profraw into ONE
  # `cargo llvm-cov report -p sparq-engine`. That merged report is over the FULL
  # instrumented object set with the UNION of every partition's executed lines, so
  # it is COVERAGE-IDENTICAL to the un-split shard (same covered, same denominator)
  # — the floor is enforced exactly as before, just on a lower wall-clock.
  #
  # NO SHARED BUILD ARCHIVE: the instrumented engine binaries are BIT-FOR-BIT
  # reproducible across runners (same pinned toolchain + same features + same source
  # => identical coverage-counter hashes), so a .profraw from one runner's compile
  # merges CLEANLY against the merge job's independently-compiled objects (measured:
  # same-compile == cross-compile, md5-identical binaries, zero hash-mismatch
  # warnings). The instrumented compile is cheap (~16-26s + warm dep cache), so each
  # runner compiling its own objects is far simpler + more robust than the fragile
  # cargo-llvm-cov `--archive-file` transport (whose 0.8.7 object layout does NOT
  # match where `report` reads objects). Each run/merge job passes ONE pinned
  # toolchain and the SAME job-level RUSTFLAGS (sq-6vshe.11 — no per-runner
  # variation), keeping the binaries reproducible.
  #
  # Two jobs (both driven by scripts/coverage-engine-shard.sh):
  #   coverage-engine-run   : matrix[part 1..N] — compile + run a nextest test-level
  #                           PARTITION (--no-report), upload its .profraw.
  #   coverage-engine-merge : compile the objects (build-objects), download every
  #                           partition's .profraw, `report -p sparq-engine` over the
  #                           union, then `coverage-gate.py --check` (SAME ratchet floor).
  #
  # The `coverage` aggregator (below) folds both into its needs + result loop, so the
  # ci-summary `gate` still sees ONE "coverage ratchet + test-presence gate (per-crate)"
  # verdict. Both job NAMEs are generic (no crate token the selection-alarm tokenizer
  # would mis-implicate) and carry NO "advisory"/"informational" word, so they GATE.
  # ============================================================================
  coverage-engine-run:
    # Compile the instrumented engine test binaries + run ONE nextest test-level partition,
    # upload its .profraw. Same trigger envelope + path-filter guard as coverage-measure
    # (skip a doc-only / provably-empty-affected PR -> the merge skips via needs, and the
    # aggregator counts `skipped` as satisfied). N=3 partitions: nextest hash-partitions
    # INDIVIDUAL tests, so the two >400s lib-target monster tests land on DIFFERENT runners
    # (a per-binary split would not balance).
    name: coverage engine run (partition ${{ matrix.part }}/3)
    # [FABLE-5] Draft-tier CI: skipped on draft PR heads, same rationale + guard
    # shape as coverage-measure above (fail-open off the PR path).
    # [SONNET-4.6] sq-6vshe.17: DEMOTED off merge_group with the same guard + the same
    # recoverable-ratchet argument as coverage-measure above (this partitioned engine
    # measurement is the other half of the instrumented pole). `coverage-engine-merge`
    # needs `coverage-engine-run.result == 'success'`, so it skips with these — and the
    # `coverage` aggregator counts both `skipped` results as satisfied.
    needs: [changes, coverage-floors, select]
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' || needs.select.outputs.affected != '[]')
    runs-on: ubuntu-latest
    # [SONNET-4.6] sq-6vshe.11: re-deliver the lld link flag (see coverage-measure above and
    # the env: block at the top of this file). EXTRA constraint here: the cross-runner
    # .profraw merge requires the run partitions and coverage-engine-merge to compile with
    # IDENTICAL inputs, so this value and coverage-engine-merge's MUST match exactly.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false   # one partition failing must not cancel the others (want all profraw)
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free runner disk before instrumented build
        run: ./scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      # [OPUS-5] REQUIRED once the root `rust-toolchain.toml` pin exists. The action
      # above installs `llvm-tools-preview` onto the toolchain IT manages (`stable`)
      # and then calls `rustup default` — precedence 5, which the toolchain file
      # (precedence 4) outranks. So cargo here resolves to the PINNED toolchain, on
      # which the component would be absent, and `cargo llvm-cov` fails with the
      # llvm-tools missing rather than measuring anything. This adds the component to
      # the ACTIVE (pinned) toolchain. Idempotent, and a no-op if it is already there.
      - name: Ensure llvm-tools-preview on the pinned toolchain
        run: rustup component add llvm-tools-preview
      # ONE dep cache shared by every partition AND by coverage-engine-merge below: all
      # four compile the SAME instrumented sparq-engine (nextest partitions test
      # EXECUTION, not the build) with RUSTFLAGS that check-coverage-rustflags.py already
      # forces to be identical, so their external dep closures are identical too.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # [OPUS-5] #5231: this was `key: coverage-engine-run-${{ matrix.part }}`, with
          # coverage-engine-merge carrying `key: coverage-engine-run-1` and a comment
          # claiming it reused part 1's cache. It did not. rust-cache composes `key:` with
          # the GITHUB_JOB-derived segment and uses `shared-key:` INSTEAD of it (the same
          # property the coverage-measure step above relies on), so the two resolved to
          # `…-coverage-engine-run-1-coverage-engine-run` and
          # `…-coverage-engine-run-1-coverage-engine-merge` — different keys AND different
          # restore-key prefixes, i.e. no reuse and a cold dep compile in the merge job.
          # A single `shared-key` is what actually shares the entry.
          #
          # The concurrent-save race the per-part key used to dodge is already gone: with
          # save-if above, saving happens on main only, where a duplicate-key save is a
          # benign no-op (the cache API rejects the second writer), not a clobber — the
          # coverage-measure note above makes the same argument. And unlike that step this
          # collapse has NO partial-restore residual, because the coverage-measure shards
          # measure different crates with different `--features` whereas these partitions
          # do not: same crate, same features, same closure.
          shared-key: coverage-engine
      - name: Install cargo-llvm-cov + nextest
        # [OPUS-4.8] sq-tool-pin: explicit `with: tool:` is MANDATORY when SHA-pinning
        # install-action (the @<tool> ref is dropped by the pin). Both tools are needed:
        # llvm-cov for instrumentation, nextest for the partitioning.
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov,nextest
      - name: Fetch W3C fixtures (engine tests need them)
        # Mirror coverage.sh's fixture fetch: some engine tests reference the pinned SPARQL
        # fixtures; fetch idempotently so no engine test SKIPS for absence (which would drop
        # its lines from the merged number). Best-effort — a fetch WARN is non-fatal.
        run: |
          ./scripts/fetch-conformance.sh      || echo "WARN: SPARQL fixture fetch failed"
      - name: Compile + run partition ${{ matrix.part }}/3 (--no-report, emit .profraw)
        run: ./scripts/coverage-engine-shard.sh run ${{ matrix.part }} 3
      - name: Upload partition ${{ matrix.part }} .profraw
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-engine-profraw-${{ matrix.part }}
          # [FABLE-5] sq-piapk: the native llvm-cov path emits .profraw under
          # target/llvm-cov-target/ (per LLVM_PROFILE_FILE). `**` catches any nested subdir.
          path: target/llvm-cov-target/**/*.profraw
          retention-days: 1
          if-no-files-found: error   # a partition that emitted NO profraw is a hard failure

  coverage-engine-merge:
    # Compile the instrumented engine objects (build-objects; bit-reproducible with the run
    # partitions' compiles), download EVERY partition's .profraw, merge them into one
    # `cargo llvm-cov report -p sparq-engine`, and enforce the SAME per-crate ratchet floor
    # via coverage-gate.py --check. This merged report is coverage-IDENTICAL to the un-split
    # single-shard number (same covered lines, same denominator), so the floor is unchanged.
    name: coverage engine merge + ratchet (per-crate)
    needs: coverage-engine-run
    # Require the runs to SUCCEED so a merged FALSE-LOW never masks a partition failure: a
    # failed partition reds coverage-engine-run (the aggregator treats that as a gate failure)
    # and this merge skips. When the runs skipped (doc-only PR), this skips too (via needs)
    # and the aggregator counts `skipped` as satisfied.
    if: needs.coverage-engine-run.result == 'success'
    runs-on: ubuntu-latest
    # [SONNET-4.6] sq-6vshe.11: MUST be byte-identical to coverage-engine-run's RUSTFLAGS —
    # this job recompiles the instrumented objects the downloaded partition .profraw are
    # merged against, and that merge is only valid when both compiles saw the same inputs.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free runner disk before instrumented build
        run: ./scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      # [OPUS-5] REQUIRED once the root `rust-toolchain.toml` pin exists. The action
      # above installs `llvm-tools-preview` onto the toolchain IT manages (`stable`)
      # and then calls `rustup default` — precedence 5, which the toolchain file
      # (precedence 4) outranks. So cargo here resolves to the PINNED toolchain, on
      # which the component would be absent, and `cargo llvm-cov` fails with the
      # llvm-tools missing rather than measuring anything. This adds the component to
      # the ACTIVE (pinned) toolchain. Idempotent, and a no-op if it is already there.
      - name: Ensure llvm-tools-preview on the pinned toolchain
        run: rustup component add llvm-tools-preview
      # Reuse the run partitions' dep cache to warm this job's object compile. The
      # `shared-key` MUST stay byte-identical to coverage-engine-run's — that identity is
      # the whole mechanism, and it is pinned by
      # scripts/tests/test_mergequeue_cache_posture.py::TestCoverageEngineCacheIsShared.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # [OPUS-5] #5231 — see the long note on coverage-engine-run's cache step above
          # for why this is `shared-key` and not the former `key: coverage-engine-run-1`.
          shared-key: coverage-engine
      - name: Install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov,nextest
      - name: Build instrumented engine objects (for `report`, no test run)
        # `cargo llvm-cov report` maps counters -> lines using the instrumented object files.
        # build-objects compiles them WITHOUT running any test (--no-run: no profraw) — the
        # SAME bit-reproducible binaries the run partitions compiled, so the downloaded
        # partition .profraw merge cleanly against them. Native llvm-cov target layout, no
        # archive extraction.
        run: ./scripts/coverage-engine-shard.sh build-objects
      - name: Download all partition .profraw
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-engine-profraw-*   # every partition's profraw artifact
          path: engine-profraw
          # [FABLE-5] sq-piapk: NO `merge-multiple: true`. The profraw filename pattern
          # `<prefix>-%p-%m.profraw` (LLVM_PROFILE_FILE) is NOT unique ACROSS RUNNERS —
          # PIDs (%p) and the counter-signature hash (%m) collide between the three
          # independently-scheduled partition runners. Under `merge-multiple` (flatten
          # into one dir) those same-BASENAME-but-DIFFERENT-CONTENT files silently
          # OVERWRITE each other on download, DROPPING one partition's distinct coverage
          # counters — an undercount that fails the ratchet floor with a false regression
          # (measured: 833 uploaded -> 782 after flatten = 51 counter files lost). Instead
          # keep each artifact in its OWN subdir (engine-profraw/coverage-engine-profraw-<k>/)
          # so all 833 survive; the restore step below re-namespaces them per partition.
      - name: Restore .profraw into the llvm-cov target dir
        # [FABLE-5] sq-piapk: coverage-engine-shard.sh report merges every *.profraw found
        # recursively under target/, and `cargo llvm-cov report` reads counters from
        # CARGO_LLVM_COV_TARGET_DIR/llvm-cov-target (where build-objects put the instrumented
        # binaries + where a native run emits profraw). Move the downloaded partition profraw
        # THERE so report merges them against those objects. Resolve the dir via show-env
        # (CARGO_LLVM_COV_TARGET_DIR) so it tracks the tool's own layout rather than hard-coding.
        #
        # RE-NAMESPACE PER PARTITION (sq-piapk root fix): because cross-runner profraw
        # basenames collide (see the download note), we must NOT `mv` them into one flat dir
        # under their original names — that would re-introduce the very overwrite we avoided by
        # dropping merge-multiple. Prefix each file with its source artifact-subdir name
        # (coverage-engine-profraw-<k>) so every one of the 833 lands with a UNIQUE name and
        # `report` merges the FULL union of all partitions' counters (coverage-identical to the
        # un-split single-shard run). Assert the restored count equals the downloaded count so a
        # future re-introduced collision fails LOUDLY instead of silently undercounting.
        run: |
          set -euo pipefail
          td="$(cargo llvm-cov show-env 2>/dev/null | sed -n 's/^CARGO_LLVM_COV_TARGET_DIR=\(.*\)$/\1/p')"
          [ -n "$td" ] || td="$PWD/target"
          pd="$td/llvm-cov-target"
          mkdir -p "$pd"
          n=$(find engine-profraw -name '*.profraw' 2>/dev/null | wc -l)
          echo "downloaded $n .profraw file(s) across all partitions -> $pd"
          [ "$n" -ge 1 ] || { echo "::error::no partition .profraw downloaded"; exit 1; }
          # Move each file to "<partition-subdir>__<original-basename>" so cross-runner
          # basename collisions cannot overwrite. The subdir (relative to engine-profraw) is
          # the artifact name coverage-engine-profraw-<k>, guaranteeing per-partition uniqueness.
          moved=0
          while IFS= read -r f; do
            rel="${f#engine-profraw/}"            # e.g. coverage-engine-profraw-2/sparq-...profraw
            tag="${rel%%/*}"                       # coverage-engine-profraw-2
            base="$(basename "$f")"
            mv "$f" "$pd/${tag}__${base}"
            moved=$((moved + 1))
          done < <(find engine-profraw -name '*.profraw')
          restored=$(find "$pd" -maxdepth 1 -name '*.profraw' | wc -l)
          echo "restored $moved profraw into $pd (unique-named); dir now holds $restored"
          # Identity guard: every downloaded profraw must survive the move. A mismatch means a
          # collision re-appeared (e.g. someone re-added merge-multiple) -> fail rather than
          # emit a false-low coverage number.
          [ "$moved" -eq "$n" ] || { echo "::error::restored $moved != downloaded $n profraw — collision/loss"; exit 1; }
      - name: Merge .profraw -> coverage-identical engine report
        run: ./scripts/coverage-engine-shard.sh report target/coverage/coverage-summary.json
      - name: Enforce the sparq-engine ratchet floor (--check)
        # --check (NOT --check-robust): the merged report IS the full-suite measurement over
        # the union of all partitions, so there is nothing to "re-measure ONLY sub-floor
        # crates" — and --check-robust's re-measure path would shell coverage.sh to rebuild
        # + re-run the WHOLE engine (defeating the split). A partition that under-emitted
        # profraw already fails coverage-engine-run (its `if-no-files-found: error` / nextest
        # exit), so the merged number cannot be a silent transient undercount here.
        run: python3 scripts/coverage-gate.py --check target/coverage/coverage-summary.json
      - name: Upload merged engine coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary-engine
          path: target/coverage/coverage-summary.json

  coverage:
    # [OPUS-4.8] sq-p0hcd: single AGGREGATED pass/fail for the sharded coverage gate,
    # keeping the EXACT original required-check NAME so any tooling / branch-protection
    # reference to it stays valid (the ci-summary `gate` is the only ruleset-required
    # check and discovers all siblings dynamically, but this preserves the clean, stable
    # name and gives reviewers ONE coverage verdict instead of five checks). `if: always()`
    # so it always produces a terminal check-run (never "expected but missing"); it fails
    # iff a needed gating job concluded non-green (failure/cancelled), and passes when they
    # succeeded or were skipped (doc-only PR).
    name: coverage ratchet + test-presence gate (per-crate)
    # [FABLE-5] sq-piapk: the sparq-engine cross-runner split (run + merge) folds into this
    # single verdict alongside the non-engine shard matrix, so the ci-summary `gate` still
    # sees ONE coverage check. A skipped engine job (doc-only PR) counts as satisfied.
    # [FABLE-5] Draft-tier CI: on a draft PR head the measure/engine jobs above are
    # skipped, so this aggregate is skipped too (reporting `skipped`, which the
    # gate treats as satisfied under a green selection) rather than emitting a
    # vacuous green `coverage` success over zero measurements.
    needs: [coverage-floors, coverage-measure, coverage-engine-run, coverage-engine-merge]
    # [FABLE-5] label-trigger guard: always() bypasses the skipped-needs propagation,
    # so this verdict job must carry the guard explicitly or it would still run (as a
    # trivially-green no-op) on every non-`ci-full` label flip. Skipped is equally
    # satisfied by the gate (the commit's select runs stay green) and saves the slot.
    # [FABLE-5] Draft-tier CI: AND-composed with the label guard (both survive) — the
    # measure/engine jobs above are skipped on a draft PR head, so this aggregate is
    # skipped too (`skipped` ≠ vacuous green) rather than reporting over zero
    # measurements. A non-`ci-full` label flip stays a no-op regardless of draft
    # state; a draft head stays coverage-skipped regardless of label events.
    if: >-
      always() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
       github.event.label.name == 'ci-full') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate coverage floor + shard results
        env:
          EVENT: ${{ github.event_name }}
        run: |
          floors='${{ needs.coverage-floors.result }}'
          measure='${{ needs.coverage-measure.result }}'
          eng_run='${{ needs.coverage-engine-run.result }}'
          eng_merge='${{ needs.coverage-engine-merge.result }}'
          echo "coverage-floors=$floors  coverage-measure(matrix)=$measure"
          echo "engine-split: run=$eng_run merge=$eng_merge"
          rc=0
          for r in "$floors" "$measure" "$eng_run" "$eng_merge"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::coverage gate FAILED — a needed job concluded '$r'"; rc=1 ;;
            esac
          done
          if [ "$rc" -eq 0 ]; then
            echo "### coverage ratchet + test-presence gate: PASS" >> "$GITHUB_STEP_SUMMARY"
            # [SONNET-4.6] sq-6vshe.17: say plainly WHAT passed on the merge_group ref, so a
            # reviewer reading a green merge-queue coverage check never reads it as "the
            # per-crate line-% was re-measured on the merged tree". It was not: only the
            # fast no-compile floor gates ran here (presence + monotonicity + shard
            # partition). The MEASUREMENT ran on the PR head and runs again on push-to-main.
            if [ "$EVENT" = "merge_group" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> NOTE (sq-6vshe.17): on the \`merge_group\` ref this verdict covers the" \
                   "fast no-compile FLOOR gates only (test-presence, floor monotonicity," \
                   "shard-partition). The instrumented per-crate line-% MEASUREMENT is" \
                   "demoted off the queue's blocking path — it gated the PR head and" \
                   "re-runs on push-to-main, where a red auto-files a P1 and pauses further" \
                   "ratchet advances." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$rc"

  # [SONNET-4.6] sq-6vshe.17 (research/ci-mergequeue-speedup-2026-07.md §3.4a) — the
  # DEMOTED-LANE SAFETY NET for the coverage MEASUREMENT demoted off merge_group.
  # The measure legs' FULL FORM runs at PR level AND on push-to-main. This tiny job is
  # the "cannot silently rot" backstop the demotion protocol mandates (the same shape as
  # `heavy-recall-demoted-filer` above): if a coverage MEASURE leg FAILS on the canonical
  # push-to-main build — the batch-stacking regression a merge_group run no longer catches
  # — it auto-files a P1 bead + a deduped GitHub issue naming the lane + run, via
  # scripts/ci-file-demoted-lane-failure.py. That issue is ALSO what the `coverage-floors`
  # ratchet-ADVANCE pause reads, so a red main both tracks the finding to closure and stops
  # the ratchet from advancing on numbers that are in doubt.
  # It files ONLY when a DEMOTED leg failed: a `coverage-floors` red on main is a normal
  # red main build (those gates never left the queue), not a demoted-lane finding.
  # SEPARATE job so the write scope stays off the coverage matrix — least privilege,
  # matching the heavy-recall / fuzz / differential filer precedent.
  coverage-demoted-filer:
    name: coverage demoted-lane safety-net (push-to-main)
    # Only the aggregate verdict is needed — it already folds in every measure leg, and an
    # unused `needs` edge would just add a false dependency.
    needs: [coverage]
    # push-to-main only, and only when the coverage aggregate did not succeed. `always()`
    # so this runs despite the failed `needs`; the body then confirms a DEMOTED leg was the
    # culprit.
    if: >-
      always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.coverage.result != 'success' && needs.coverage.result != 'skipped'
    runs-on: ubuntu-latest
    # Scoped write: append the bead + best-effort push (contents), file/comment the issue
    # (issues), read this run's job list to detect which leg failed (actions).
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect a failed DEMOTED coverage measure leg in this run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # List THIS workflow-run's jobs and find a FAILED leg whose measurement is the
          # part demoted off merge_group. The regex matches EXACTLY the three demoted job
          # names — "coverage ratchet (shard N/3)", "coverage engine run (partition N/3)",
          # "coverage engine merge + ratchet (per-crate)" — and NOT the still-queued
          # "coverage floors (…)", the "coverage ratchet + test-presence gate (per-crate)"
          # aggregate, or the nightly "coverage (nightly, …)" tier. Pinned by
          # scripts/tests/test_ci_select_wiring.py against the live job names.
          failed="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | select(.name | test("^coverage (ratchet \\(shard |engine )")) | .name' \
            | head -n1 || true)"
          if [ -z "$failed" ]; then
            echo "No DEMOTED coverage measure leg failed in this run (a coverage-floors red is a normal red main build) — nothing to file."
            echo "file=false" >> "$GITHUB_OUTPUT"
          else
            echo "Failed demoted coverage leg detected: $failed"
            echo "file=true" >> "$GITHUB_OUTPUT"
            echo "leg_name=$failed" >> "$GITHUB_OUTPUT"
          fi
      - name: File the demoted-lane P1 bead + issue
        if: steps.detect.outputs.file == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LEG_NAME: ${{ steps.detect.outputs.leg_name }}
        run: |
          set -euo pipefail
          # Self-test the filer first (hermetic; no gh, no writes) so a script regression
          # is caught here, not silently.
          python3 scripts/ci-file-demoted-lane-failure.py --self-test
          # --lane MUST stay coverage-ratchet-main: coverage-gate.py COVERAGE_ALARM_LANE
          # reads back the SAME token to decide whether to pause ratchet advances. The
          # wiring test pins the two together.
          python3 scripts/ci-file-demoted-lane-failure.py \
            --lane "coverage-ratchet-main" \
            --bead-prefix "cv" \
            --full-form "instrumented per-crate coverage measurement on push-to-main ($LEG_NAME)" \
            --per-pr-form "runs at PR level; demoted off merge_group (sq-6vshe.17) — the merge queue keeps the fast no-compile floor gates only" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Commit + push the auto-filed bead (best-effort)
        if: steps.detect.outputs.file == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          if git diff --quiet -- .beads/issues.jsonl; then
            echo "no bead appended (dedupe hit) — nothing to push."
            exit 0
          fi
          git config user.name "sparq-ci[bot]"
          git config user.email "sparq-ci@users.noreply.github.com"
          git add .beads/issues.jsonl
          git commit -m "chore(ci): auto-file demoted coverage-measure lane failure (sq-6vshe.17). [SONNET-4.6]"
          push_rc=0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || push_rc=$?
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=demoted-lane bead push declined::Could not push the auto-filed bead to protected main (git push exit ${push_rc}; likely GH013 ruleset rejection). The GitHub issue filed in the previous step is the durable record; the orchestrator beads it on the next issue sweep."
          else
            echo "pushed the demoted-lane bead to main."
          fi

  nightly-gate:
    # [OPUS-4.8] Freshness gate for ALL nightly (schedule-triggered) jobs: run them
    # only if HEAD changed since the last nightly run — so the heavy nightly tier does
    # not re-run on an unchanged repo. Compares github.sha to the head_sha of the most
    # recent COMPLETED schedule-triggered run of this workflow (ci.yml). A manual
    # workflow_dispatch always passes; if the lookup fails or no prior nightly exists,
    # we FAIL-OPEN (run) so a transient API error never silently disables the nightly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      fresh: ${{ steps.gate.outputs.fresh }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — running nightly"; exit 0
          fi
          CUR='${{ github.sha }}'
          PREV=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=1" \
                   --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          echo "current HEAD=$CUR ; last nightly HEAD=${PREV:-<none>}"
          if [ -z "$PREV" ] || [ "$PREV" != "$CUR" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "new commit(s) since last nightly — running"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "no new commit since last nightly ($PREV) — skipping"
          fi

  coverage-nightly:
    # [OPUS-4.8] NIGHTLY heavy-coverage tier (sq-hbg7). Runs the FULL per-crate
    # set INCLUDING the sparq-vectors 50k recall/diskann accuracy tests that the
    # per-commit `coverage` job skips (those run >10 min for that one crate under
    # llvm-cov instrumentation — too slow for per-commit, hence this split).
    #
    # [OPUS-4.8] sq-bjct: this tier ALSO merges the W3C SPARQL + inference conformance
    # BINARIES (sparq-conformance / sparq-inference-conformance — they run as `cargo
    # run`, NOT `cargo test`) into the sparq-core / sparq-engine llvm-cov reports
    # (scripts/coverage.sh measure_merged, auto-enabled for tier!=per-commit). Those two
    # crates are gated here on their HIGHER `nightly_floor` (bench/coverage-floor.json),
    # while the per-commit `coverage` job still gates the cheaper test-only `floor`. The
    # gate driver reads the summary's `tier` and applies nightly_floor automatically.
    # Triggered by the `schedule:` cron (or manual dispatch), and only when the
    # nightly-gate says HEAD changed since the last nightly.
    name: coverage (nightly, full incl. heavy vectors)
    needs: nightly-gate
    if: needs.nightly-gate.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    # [SONNET-4.6] sq-6vshe.11: re-deliver the lld link flag past cargo-llvm-cov's
    # RUSTFLAGS (see coverage-measure above and the env: block at the top of this file).
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] sq-czlh: reclaim ~20-30 GB of pre-installed SDKs/toolchains BEFORE the
      # FULL-tier instrumented build. This nightly job adds the heavy sparq-vectors 50k
      # recall/diskann tests on top of the per-crate llvm-cov instrumentation + per-test
      # `.profraw`, so it is the most disk-hungry coverage run — and the runner still starts
      # with only ~14 GB free on `/` (the `No space left on device` profile sq-c76x fixed in
      # the load-aware test lane). Same in-repo, SHA-pin-free, best-effort step (absent paths
      # no-op). See scripts/ci-free-disk.sh.
      - name: Free runner disk before build + instrumented test
        run: ./scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      # [OPUS-5] REQUIRED once the root `rust-toolchain.toml` pin exists. The action
      # above installs `llvm-tools-preview` onto the toolchain IT manages (`stable`)
      # and then calls `rustup default` — precedence 5, which the toolchain file
      # (precedence 4) outranks. So cargo here resolves to the PINNED toolchain, on
      # which the component would be absent, and `cargo llvm-cov` fails with the
      # llvm-tools missing rather than measuring anything. This adds the component to
      # the ACTIVE (pinned) toolchain. Idempotent, and a no-op if it is already there.
      - name: Ensure llvm-tools-preview on the pinned toolchain
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        # [OPUS-4.8] sq-tool-pin: explicit `with: tool:` is MANDATORY when SHA-pinning
        # install-action — the @<tool> ref is dropped by the SHA pin, so without this the
        # tool is silently NOT installed and `cargo llvm-cov` ENOENTs (see per-commit job).
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Test-presence gate
        run: python3 scripts/coverage-presence.py --check
      - name: Measure + enforce per-crate coverage (FULL tier, max-remeasure gate)
        # [OPUS-4.8] sq-x4jy: same ROBUST per-crate MAX-REMEASURE gate as the per-commit
        # `coverage` job (re-measure ONLY sub-floor crates, keep the per-crate MAX, fail
        # only if still below floor after K=3). COVERAGE_TIER=nightly is exported for BOTH
        # the initial measure AND the targeted re-measures (--check-robust shells
        # coverage.sh with the inherited environment, so the nightly re-measures use the
        # SAME full test set — incl. the heavy sparq-vectors 50k tests). Comfortably within
        # the 60-min nightly budget (re-measures touch only the offending crates).
        env:
          COVERAGE_TIER: nightly
        run: |
          set -o pipefail
          ./scripts/coverage.sh
          python3 scripts/coverage-gate.py --check-robust target/coverage/coverage-summary.json
      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary-nightly
          path: target/coverage/coverage-summary.json

  mutants-nightly-advisory:
    # [OPUS-4.8] NIGHTLY MUTATION-TESTING RATCHET (sq-8kt3, epic sq-qcnn). The test-QUALITY
    # companion to the coverage ratchet: line coverage proves a line RAN, mutation testing
    # proves a test would NOTICE if that line's behaviour changed (it catches vacuous /
    # assertion-light tests that 100% line coverage hides). cargo-mutants rebuilds + reruns
    # the suite ONCE PER MUTANT, so it is FAR too slow for per-commit — like coverage-nightly
    # it is schedule + workflow_dispatch only, behind the same nightly-gate freshness check,
    # and is NEVER on the per-PR required `ci-summary` path (that would blow the PR budget).
    #
    # ADVISORY (non-gating) FOR NOW — this job is DECLARED in .github/advisory-registry.json,
    # which is what makes the ci-summary aggregator exclude it from the gating set (#3773: the
    # "advisory" name token alone no longer does): even a `failure` here cannot block a merge. This is
    # the deliberate bootstrap idiom (mirroring how `geiger` started, and how the coverage
    # ratchet seeded its floor before gating): we seed bench/mutants-baseline.json across the
    # workspace over the first few nightly runs, then PROMOTE to gating by DELETING the registry
    # entry + flipping the step to fail on a regression, once broadly seeded.
    # Until then `continue-on-error: true` keeps the run green while it seeds.
    #
    # SEEDED SO FAR (honest): the crates listed in bench/mutants-baseline.json carry a real
    # committed ceiling from an actual cargo-mutants run — sparq-canon, sparq-parse (original
    # local run), sparq-algos + sparq-substrate (sq-ep3f / sq-qcnn.3), and sparq-introspect +
    # sparq-prov (sq-52su, seeded from the mutants-outcomes-nightly artifact of the 2026-06-30
    # scheduled run — counts reproduced identically across four independent nightly artifacts,
    # so they are complete, not truncated). Every OTHER crate in CRATES below is measured +
    # reported here and gets its ceiling seeded on its first nightly run (download that crate's
    # mutants-outcomes-nightly-<crate> artifact, run scripts/mutants-gate.py --seed on the
    # outcomes.json, commit — sq-ep3f). The baseline's absence of a crate is NOT a claim that
    # it has zero surviving mutants — it just has not been measured yet.
    #
    # WHY STILL ADVISORY — two blockers to promotion, both HONEST (sq-52su):
    #   1. SEEDING IS INCOMPLETE (but the MECHANISM is now fixed — sq-qcnn.11). Previously this
    #      job shared the workflow concurrency group (ci-CI-refs/heads/main, cancel-in-progress:
    #      true) with push/merge_group runs on the SAME ref (main), so a push to main while the
    #      nightly ran CANCELLED it — every scheduled run to date was cancelled after ~5-6
    #      crates, and the later crates (sparq-engine … sparq-policy) were NEVER measured. FIXED
    #      HERE: schedule/dispatch runs now take a PER-RUN workflow concurrency group (top of
    #      this file) so push-to-main can no longer cancel them, AND the crates are SHARDED
    #      across a fail-fast:false matrix so each completes in its own budget. The next FULL
    #      nightly seeds the ~20 remaining crates (per-crate artifacts above → --seed → commit,
    #      reviewed). Promotion (sq-qcnn.27) waits on that seeded baseline existing.
    #      [SONNET-4.6] sq-has2g: seeding a SUB-SHARDED crate additionally needed a
    #      scripts/mutants-gate.py fix — n shards of one crate all report the same package, and
    #      measured_rows() was last-write-wins, so --seed over the n artifacts would have
    #      committed a ceiling ~1/n of the true surviving count. It now SUMS them (the shards
    #      partition the mutant set) and records `shards: n`. This is why sparq-reason is still
    #      unseeded despite being sharded since sq-qcnn.28 — seed it from all 3 artifacts at once.
    #   2. TWO SEEDED CEILINGS ARE STALE. The sparq-canon/sparq-parse ceilings (9 / 14) were
    #      seeded when those crates were small; the current nightly measures ~98 / ~32 surviving
    #      mutants, so `--check` against real outcomes FAILS them today. That is a genuine
    #      test-QUALITY gap (their tests must be strengthened) — NOT something to paper over by
    #      raising the ceiling. Promoting to gating now would turn the required `gate` red on
    #      main. So this leg stays advisory (continue-on-error + "advisory" name token) until
    #      both blockers clear.
    name: mutation ratchet (cargo-mutants, advisory)
    needs: nightly-gate
    if: needs.nightly-gate.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    # [OPUS-4.8] sq-qcnn.11: ONE crate PER MATRIX SHARD so the FULL eligible crate set is
    # measured every nightly. The old single serial job walked all crates on ONE runner and
    # (once the concurrency cancel was fixed) would still hit the whole-job timeout on the
    # heavy crates before reaching the tail — so the later crates (engine … policy) were never
    # measured. Sharded, each crate gets its OWN per-crate budget in parallel; a slow crate can
    # no longer starve or truncate the rest.
    # [SONNET-4.6] sq-qcnn.28: per-crate timeout via matrix.timeout_minutes (defaults 120min).
    # Heavy crates (solid, zk-compose, vectors, server, mpc) override to 360min via include
    # entries. sparq-reason is sub-sharded 3×(--shard k/3) so each shard fits in 120min
    # instead of one ~6h monolith.
    # [SONNET-4.6] sq-has2g: sparq-engine is sub-sharded 24×(--shard k/24) at 360min each — it
    # has the largest generated mutant set in the workspace and a high per-mutant test cost, and
    # the single 360min job it used to be never finished, which is why it is still unseeded. See
    # the sparq-engine SUB-SHARDS include block for the sizing rationale.
    timeout-minutes: ${{ fromJSON(matrix.timeout_minutes || '120') }}
    continue-on-error: true # advisory while the baseline seeds; remove when promoted to gating
    strategy:
      # fail-fast MUST be false: one crate's failure/timeout must NOT cancel the sibling
      # shards (that would re-create the "only the first few crates measured" bug). max-parallel
      # bounds concurrent runners so the nightly does not inflate CI cost unboundedly — 51 jobs
      # (24 whole-crate + 3 sparq-reason shards + 24 sparq-engine shards) once a day, at most 8
      # runners at a time; wall-clock is non-critical for a nightly and the staggered waves warm
      # the shared rust-cache for later waves.
      # [SONNET-4.6] sq-has2g COST NOTE, stated plainly: sub-sharding sparq-engine 1->24 is a
      # real increase in nightly runner cost — a whole-crate engine sweep is many runner-hours of
      # SERIAL work, and that work has to happen SOMEWHERE to measure the crate at all. Today's
      # single job simply burns its entire budget every night and produces nothing usable, which
      # is strictly worse. Sharding does not create the cost; it makes the run finish, and the
      # 360min cap bills only the time actually used.
      # The lever for REDUCING it is shrinking the per-mutant test cost (cargo-mutants -j, or
      # nextest, or scoping each mutant's test set) — not fewer shards. A `--timeout` shortcut
      # is NOT acceptable: mutants-gate.py counts Timeout as CAUGHT, so capping per-mutant
      # runtime would silently reclassify real survivors as kills and understate the ceiling.
      # If that cost is judged too high, the honest response is to make the sweep cheaper or to
      # run it less often than nightly — not to keep a job that cannot finish.
      fail-fast: false
      max-parallel: 8
      matrix:
        crate:
          - sparq-canon
          - sparq-parse
          - sparq-introspect
          - sparq-prov
          - sparq-algos
          - sparq-core
          # sparq-engine is NOT listed here — it is sub-sharded into 24 include entries below
          # (--shard 1/24 … 24/24). [SONNET-4.6] sq-has2g
          # sparq-reason is NOT listed here — it is sub-sharded into 3 include entries below
          # (--shard 1/3, 2/3, 3/3) so 3230 mutants fit in 3×120min instead of one ~6h job.
          # [SONNET-4.6] sq-qcnn.28
          - sparq-shacl
          - sparq-geo
          - sparq-text
          - sparq-hdt
          - sparq-rsp
          - sparq-sim
          - sparq-solid
          - sparq-nlq
          - sparq-mpc
          - sparq-serve
          - sparq-server
          - sparq-zk
          - sparq-zk-compose
          - sparq-vectors
          - sparq-fedplan
          - sparq-fedclient
          - sparq-policy
          - sparq-substrate
        include:
          # [OPUS-4.8] sq-qcnn.3 / sparq-core QUIRK: two crates whose correctness surface is
          # DEFAULT-OFF are measured WITH their representative features (else cargo-mutants sees
          # an empty crate + generates zero mutants). `include` MERGES `features` into the
          # matching base combination without creating a new one (features is not a base key),
          # mirroring scripts/coverage.sh's measure() PER-CRATE QUIRKS.
          - crate: sparq-core
            features: mmap,dict-spill
            timeout_minutes: 360
          - crate: sparq-substrate
            features: numeric,join,compare,rows
          - crate: sparq-sim
            features: multi-hop,explain,sketch
          # [OPUS-4.8] sq-qcnn.14: sparq-canon QUIRK — the `rdf12-triple-terms` feature
          # gates rdf12.rs (the NON-STANDARD RDF-1.2 triple-term profile). Without it,
          # cargo-mutants mutates rdf12.rs but the tests never compile that module, so all
          # rdf12.rs mutations are trivially "missed" (not CAUGHT but also not from a test
          # gap — just non-compiled code). Enabling the feature exposes the full crate
          # surface (lib.rs + rdf12.rs) to mutation, making the ceiling honest.
          - crate: sparq-canon
            features: rdf12-triple-terms
          # [SONNET-4.6] sq-qcnn.39: sparq-prov QUIRK — the `reason` feature gates
          # src/reason.rs + tests/reason_prov.rs (PROV-O lineage for reasoner
          # materialization). Without it, cargo-mutants mutates reason.rs but the
          # tests never compile, so all mutations there trivially "miss" — not a
          # test gap, just non-compiled code. Adding the feature makes the ceiling
          # honest and matches scripts/coverage.sh's PER-CRATE QUIRKS.
          - crate: sparq-prov
            features: reason
          # [SONNET-4.6] sq-3dyje.7: sparq-fedplan QUIRK — the ENTIRE crate surface is
          # `#[cfg(feature = "fedplan")]`-gated (empty crate by default), and every
          # `#[cfg(test)]` block and test file is gated the same way. Without the
          # features, cargo-mutants generates 534 mutants from the source but builds +
          # tests an EMPTY crate, so ALL of them trivially "survived" — the committed
          # 0-caught/534-survived baseline was this feature-OFF ARTIFACT, NOT a
          # missing-assertion gap. Same class as the sparq-canon/sparq-prov/sparq-fedclient
          # quirks above; matches scripts/coverage.sh's PER-CRATE QUIRKS feature set.
          - crate: sparq-fedplan
            features: fedplan,adaptive-replan
          # [FABLE-5] sq-3dyje.6: sparq-fedclient QUIRK — the ENTIRE crate surface is
          # `#[cfg(feature = "fedclient")]`-gated (empty crate by default, mirroring
          # sparq-fedplan), and every test file is gated the same way. Without the
          # features, cargo-mutants generated 553 mutants from the source but built +
          # tested an EMPTY crate, so ALL of them trivially "survived" — the committed
          # 0-caught/553-survived baseline was this artifact, NOT a missing-assertion
          # gap (the crate's inline + integration suites pin exact values and kill the
          # bulk of the set once compiled). Same class as the sparq-canon/sparq-prov
          # quirks above; matches scripts/coverage.sh's PER-CRATE QUIRKS feature set.
          - crate: sparq-fedclient
            features: fedclient,fedclient-adaptive
          # [SONNET-4.6] sq-qcnn.28: HEAVY-CRATE TIMEOUT OVERRIDES.
          # Run 28776460517 (2026-07-06): sparq-engine, sparq-solid, sparq-zk-compose,
          # sparq-vectors all cancelled at the old 120min ceiling. Raise to 360min.
          # sparq-server + sparq-mpc were killed by runner shutdown at 108min/57min; 360min
          # gives them enough headroom and eliminates the race with the job-level timeout.
          # [SONNET-4.6] sq-has2g: sparq-engine no longer has an entry HERE — raising it to
          # 360min was not enough (it still never finished), so it moved to the SUB-SHARDS
          # block below, where each of its shards carries the 360min override.
          - crate: sparq-solid
            timeout_minutes: 360
          - crate: sparq-zk-compose
            timeout_minutes: 360
          - crate: sparq-vectors
            timeout_minutes: 360
          # [SONNET-4.6] sq-qcnn.41: sparq-server QUIRK — measure it FEATURE-ON, so the ceiling
          # it is about to be seeded with is honest. cargo-mutants generates mutants from the
          # SOURCE (it walks `mod` items regardless of the `#[cfg]` on them), but a
          # default-feature build never COMPILES the gated modules, so every mutant inside one
          # is trivially "missed" — non-compiled code, NOT a test gap. Same class as the
          # sparq-canon / sparq-prov quirks above, and the same artifact that forced this
          # baseline to re-measure sparq-fedplan (committed 0-caught/534-survived) and
          # sparq-fedclient (0/553). It matters MORE here than for either of those: ceilings
          # only ever FALL (`--seed` will not raise one without `--allow-higher` + review), so
          # an inflated FIRST seed is sticky — hence this lands BEFORE the crate is baselined.
          # SCALE (structural counts from the tree, reproduce with grep + wc): the
          # `#[cfg(feature = …)] mod` items the DEFAULT build leaves out are solid_authz 2647,
          # tpf 1333, descriptors 1145, access_audit 614, streams 592, n3_patch 497,
          # templates 373, audit 294 = 7495 of 25702 src lines (~29%), and src/http.rs carries
          # a further 301 `cfg(feature = …)` sites naming a default-OFF feature.
          # THE SET = the LEG-PROVEN subset: every feature named below already has a
          # `test: true` leg in .github/feature-matrix.d/sparq-server.yml, so its suite is
          # known-green on this runner image. That matters because cargo-mutants runs an
          # UNMUTATED baseline first and aborts the whole sweep if it fails — a feature set
          # nobody has ever executed could cost the crate its run.
          # DELIBERATELY OUT, each with a reason. The ceiling therefore still carries
          # trivially-surviving mutants from these, and must be re-tightened as they gain legs:
          #   • shacl / backup / n3-patch — NO CI executor runs their suites (shacl + backup
          #     are explicit entries in scripts/check-feature-test-execution.allowlist.json).
          #     They COMPILE (the gating workspace `--all-features` clippy proves that much),
          #     but "compiles" is not "passes", and this lane cannot risk the baseline run.
          #   • http2 / http3 — transport plumbing (TLS / a second UDP listener) with few
          #     mutable lines, whose socket + TLS test cost every mutant would then pay.
          #   • zlib-ng — a flate2 backend swap; no leg, and no sparq-server code of its own.
          #   • test-seams — a TEST seam, not product surface.
          # COST, stated plainly: a feature-ON sweep compiles and runs strictly more per mutant
          # than today's feature-OFF one, and this crate has no seedable run on record (the last
          # one noted above was killed by runner shutdown). No timing is guessed here — RE-TUNE
          # this entry from the first run that completes (raise timeout_minutes, or move it to the
          # SUB-SHARDS idiom below), using that run's own timings as the evidence of record.
          - crate: sparq-server
            features: audit-log,access-audit,change-stream,federation-descriptors,solid-authz,odrl-authz,solid-authz-trust,templates,tpf,brtpf,query-registry,facets,complete,service,time-travel,geo,terse,response-compression
            timeout_minutes: 360
          - crate: sparq-mpc
            timeout_minutes: 360
          # [SONNET-4.6] sq-qcnn.28: sparq-reason SUB-SHARDS.
          # 3230 mutants at ~13s each with 2 workers needs ~350min — over the 360min hard cap.
          # Split into 3 shards of ~1077 mutants each; each fits in ~120min with the runner's
          # 2 concurrent workers. cargo-mutants --shard k/n divides the full mutant list into
          # n equal slices and processes only slice k. Since sparq-reason is unseeded, the
          # ratchet --check reports "UNSEEDED" for each shard (exit 0) — no ceiling conflict.
          # The 3 artifact uploads use per-shard suffixes set by GITHUB_OUTPUT in the run step.
          - crate: sparq-reason
            shard: "1/3"
          - crate: sparq-reason
            shard: "2/3"
          - crate: sparq-reason
            shard: "3/3"
          # [SONNET-4.6] sq-has2g: sparq-engine SUB-SHARDS — seed the LARGEST crate.
          # sparq-engine has been in this matrix (one job, 360min) since sq-qcnn.28 and is
          # STILL absent from bench/mutants-baseline.json: the single job has never finished
          # inside its budget, so it has never produced a COMPLETE outcomes.json to seed from.
          #
          # SIZING RATIONALE — deliberately QUALITATIVE. Local/session-box timings are not
          # canonical and would stale as the crate, the toolchain and the runner image change,
          # so no measured seconds/hours are recorded here. Reproduce the inputs yourself:
          # `cargo mutants -p <crate> --list | wc -l` for the mutant set, and any completed
          # nightly shard's own outcomes.json for the per-mutant cost.
          #   • sparq-engine has the LARGEST generated mutant set in the workspace.
          #   • cargo-mutants runs mutants SERIALLY — `--jobs` defaults to 1 and this lane does
          #     not pass -j — so shard wall-clock is (mutants / shards) x the per-mutant test
          #     cost, plus one build/baseline per shard. (The sq-qcnn.28 sparq-reason note above
          #     assumes "2 concurrent workers"; that is not what the tool does by default, which
          #     is likely why sparq-reason is ALSO still unseeded. Tracked separately.)
          #   • a SURVIVING mutant costs several times a caught one (a survivor runs the suite
          #     to completion; a kill exits as soon as a test fails), so the per-mutant mean
          #     depends on the crate's caught ratio — which is UNKNOWN for sparq-engine until a
          #     full sweep lands, and must therefore be assumed pessimistic.
          # 24 is an OPERATIONAL INITIAL VALUE, not a measurement: it is the split that keeps a
          # shard inside the 360min cap under that pessimistic assumption. A shard that overruns
          # is cancelled and yields nothing — the exact failure that has kept this crate
          # unseeded — while 360min is a CAP, not a reservation, so a shard that finishes early
          # bills only what it used. Over-sharding therefore costs just the per-shard build
          # overhead; under-sharding costs the entire run.
          # RE-TUNE from the first nightly that completes — that run's own timings are the
          # evidence of record: raise the split if shards still cancel, lower it to reclaim the
          # per-shard build overhead if they finish far under the cap.
          #
          # Engine is unseeded, so --check reports "UNSEEDED" per shard (exit 0).
          # SEEDING (sq-has2g): pass ALL 24 mutants-outcomes-nightly-sparq-engine-shard-*
          # artifacts to ONE `scripts/mutants-gate.py --seed` — the shards partition the mutant
          # set, so the whole-crate figure is their SUM and --seed aggregates them (recording
          # `shards: 24`). Seeding from a subset would commit a ceiling a fraction of the truth,
          # so --seed ENFORCES the set rather than trusting the operator: it reads each
          # artifact's `-shard-k-n` identity out of its path and REFUSES a missing, repeated
          # (the same slice downloaded twice) or mixed-denominator shard set. --seed ALSO
          # refuses any shard whose outcomes.json is truncated against its mutants.json, so a
          # cancelled shard cannot silently shorten the count — that check is independent, since
          # each shard of a 23-of-24 subset is individually complete against its own plan — and
          # refuses outright when a shard ships no readable mutants.json at all, so an artifact
          # with NO completeness evidence can never pass for a whole run
          # (--allow-unverified-completeness is the explicit, deliberate override).
          - crate: sparq-engine
            shard: "1/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "2/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "3/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "4/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "5/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "6/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "7/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "8/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "9/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "10/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "11/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "12/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "13/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "14/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "15/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "16/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "17/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "18/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "19/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "20/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "21/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "22/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "23/24"
            timeout_minutes: 360
          - crate: sparq-engine
            shard: "24/24"
            timeout_minutes: 360
    concurrency:
      # [OPUS-4.8] sq-qcnn.11: per-crate + per-ref concurrency key ("its own concurrency keys")
      # with cancel-in-progress:false so an overlapping run (e.g. a manual workflow_dispatch
      # while the scheduled nightly runs) queues this crate's shard rather than cancelling it —
      # belt-and-braces on top of the per-run WORKFLOW-level group that already stops
      # push-to-main from cancelling the nightly.
      # [SONNET-4.6] sq-qcnn.28: include matrix.shard (empty for most crates) so sub-sharded
      # sparq-reason entries get distinct concurrency slots.
      group: mutants-${{ github.ref }}-${{ matrix.crate }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Free runner disk before mutation build
        # cargo-mutants builds the workspace many times (one rebuild per mutant); reclaim
        # space first like coverage-nightly. Best-effort, no-ops on absent paths.
        run: ./scripts/ci-free-disk.sh
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-mutants
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # cargo-mutants
        with:
          tool: cargo-mutants@25.3.1
      - name: Run cargo-mutants for this crate + ratchet against the baseline
        # [OPUS-4.8] sq-qcnn.11: measure exactly THIS shard's crate (--package). The static
        # exclusions (presence-gated / non-host crates) live in .cargo/mutants.toml.
        # matrix.features carries the per-crate whole-surface feature set for every crate whose
        # measured surface is DEFAULT-OFF (sparq-core, sparq-substrate, sparq-sim, sparq-canon,
        # sparq-prov, sparq-fedplan, sparq-fedclient, sparq-server — see the QUIRK comments on
        # each include entry) — passed via env (not inline ${{ }}) to keep it out of the
        # shell-injection surface. A per-crate failure is tolerated (continue-on-error) while
        # seeding — the gate verdict is --check.
        # [SONNET-4.6] sq-qcnn.28: continue-on-error:true at STEP level (in addition to job
        # level) so that a runner shutdown mid-cargo-mutants does not mark the job as failure:
        # the artifact upload (if: always()) still runs, and the job exits success even when the
        # runner receives a shutdown signal. The ratchet regression is still reported in the step
        # summary; only the JOB conclusion changes from failure to success.
        id: run_mutants
        continue-on-error: true
        env:
          CRATE: ${{ matrix.crate }}
          FEATURES: ${{ matrix.features }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # [SONNET-4.6] sq-qcnn.28: sub-shard support. SHARD is empty for most crates;
          # for sparq-reason it is "1/3", "2/3", or "3/3". The shard suffix maps "/" to "-"
          # for use in file paths and artifact names ("1/3" -> "shard-1-3").
          shard_args=()
          artifact_suffix=""
          if [ -n "$SHARD" ]; then
            shard_args=(--shard "$SHARD")
            artifact_suffix="-shard-${SHARD//\//-}"
          fi
          echo "artifact_suffix=${artifact_suffix}" >> "$GITHUB_OUTPUT"
          output_dir="target/mutants/${CRATE}${artifact_suffix}"
          mkdir -p "$output_dir"
          feat=()
          [ -n "$FEATURES" ] && feat=(--features "$FEATURES")
          echo "::group::cargo-mutants $CRATE ${feat[*]}${SHARD:+ --shard $SHARD}"
          cargo mutants -p "$CRATE" "${feat[@]}" "${shard_args[@]}" -o "$output_dir" \
            || echo "WARN: cargo-mutants $CRATE did not complete cleanly (advisory)"
          echo "::endgroup::"
          # Run the ratchet --check on THIS crate's outcomes. --check NEVER fails on an
          # UNSEEDED crate (it reports it for the next --seed); it exits 1 only if a SEEDED
          # crate now has MORE survivors than its committed ceiling. While advisory
          # (continue-on-error) that regression is REPORTED but does not block; promotion to
          # gating (sq-qcnn.27) drops continue-on-error + this job's "advisory" name token.
          OUTCOMES=$(find "$output_dir" -name outcomes.json)
          echo "outcomes: ${OUTCOMES:-<none>}"
          if [ -n "$OUTCOMES" ]; then
            # shellcheck disable=SC2086 # intentional word-split: each path is a separate arg
            python3 scripts/mutants-gate.py --check $OUTCOMES \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no outcomes produced for $CRATE${SHARD:+ shard=$SHARD} — nothing to check" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation outcomes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # [OPUS-4.8] sq-qcnn.11: per-crate artifact name — upload-artifact v4+ REJECTS two
          # matrix jobs uploading the SAME artifact name. Seeding an unseeded crate: download
          # its mutants-outcomes-nightly-<crate> artifact + run scripts/mutants-gate.py --seed
          # on the outcomes.json, then commit bench/mutants-baseline.json (reviewed).
          # [SONNET-4.6] sq-qcnn.28: per-shard artifact suffix injected via GITHUB_OUTPUT
          # (artifact_suffix is empty for non-sharded crates, "-shard-1-3" etc for sparq-reason).
          # [SONNET-4.6] sq-has2g: ALSO upload mutants.json — the full PLANNED mutant list for
          # this run (shard-aware). cargo-mutants writes outcomes.json incrementally, so a job
          # killed at its timeout leaves a well-formed but PARTIAL artifact that looks exactly
          # like a complete run of a smaller crate; scripts/mutants-gate.py compares the two
          # and REFUSES to --seed a ceiling from a truncated run. Truncation is the most likely
          # way a dishonest ceiling gets committed for the heavy crates, so --seed also FAILS
          # CLOSED when this file is absent or unreadable: it cannot then establish completeness
          # either way, and an artifact with no evidence must not seed a ceiling. Keep both files
          # in mutants.out/ so the seeding command can point at the downloaded directory
          # unchanged.
          name: mutants-outcomes-nightly-${{ matrix.crate }}${{ steps.run_mutants.outputs.artifact_suffix }}
          path: |
            target/mutants/${{ matrix.crate }}${{ steps.run_mutants.outputs.artifact_suffix }}/mutants.out/outcomes.json
            target/mutants/${{ matrix.crate }}${{ steps.run_mutants.outputs.artifact_suffix }}/mutants.out/mutants.json

  unsafe-register:
    # [OPUS-4.8] sq-toze.6 / cert gap GX-5: GATING `unsafe`-count RATCHET. This is the
    # promotion the `geiger` job's own comment anticipated ("Promote to a gate later
    # only with a checked-in unsafe-count ratchet"). It counts the first-party `unsafe`
    # sites per crate (a hermetic, build-free source scan that strips comments/strings)
    # and FAILS if any crate rose above its committed snapshot in bench/unsafe-snapshot.json
    # without a corresponding compliance/memsafety/unsafe-register.md update + re-seed.
    # Unlike `geiger` this name contains NO "advisory"/"informational" token, so the
    # ci-summary aggregator treats it as a REQUIRED gating check (sq-wjth). No cargo
    # build / cargo-geiger needed: geiger cannot run the virtual workspace manifest and
    # is too heavy/flaky for a gating lane (hence its `|| true`); the deterministic
    # scan is what we actually ratchet. Python-only ⇒ seconds, no toolchain.
    name: unsafe-register (count ratchet)
    # [FABLE-5] label-trigger guard (see the pull_request trigger note): a root job
    # with no needs — guard it directly so a non-`ci-full` label flip skips it too.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      github.event.label.name == 'ci-full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Ratchet first-party unsafe count against the snapshot
        # Fails CI if a crate's live `unsafe` count exceeds bench/unsafe-snapshot.json.
        # The fix is always: add a row to compliance/memsafety/unsafe-register.md + a
        # `// SAFETY:` comment in source, then `scripts/unsafe-gate.py --seed`.
        run: python3 scripts/unsafe-gate.py --check

  geiger:
    # [OPUS-4.8] sq-emay: INFORMATIONAL `unsafe`-usage report (cargo-geiger). Pure
    # visibility — surfaces the ~40 unsafe sites concentrated in sparq-core (mmap, the
    # zero-copy dictionary, SIMD) so a PR that ADDS unsafe is visible in the run summary
    # without blocking. Non-gating by design: every step is `continue-on-error: true`
    # (cargo-geiger fails the run on some dependency-graph shapes, and we never want this
    # report to break CI).
    #
    # [OPUS-4.8] sq-4plh: the "promote to a gate later only with a checked-in unsafe-count
    # ratchet (mirroring the coverage/conformance idiom)" follow-up this comment used to
    # anticipate IS NOW DONE — see the `unsafe-register (count ratchet)` job above
    # (sq-toze.6 / cert gap GX-5, PR #217): it ratchets the first-party `unsafe` count per
    # crate against the checked-in floor in `bench/unsafe-snapshot.json` (the
    # `bench/coverage-floor.json` analogue) and FAILS a PR that adds an unsafe site without
    # a `compliance/memsafety/unsafe-register.md` row + re-seed. That job — not this one —
    # is the gate; this `geiger` job stays informational (cargo-geiger is too heavy/flaky
    # for a per-PR gating lane), so the two are complementary: GATE via the source-scan
    # ratchet, VISIBILITY via cargo-geiger.
    name: unsafe report (cargo-geiger, informational)
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-geiger
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-geiger
        continue-on-error: true
      - name: Report unsafe usage (sparq-core, where the unsafe lives)
        # [OPUS-4.8] sq-wjth: cargo-geiger CANNOT run against the workspace's VIRTUAL
        # root manifest — `cargo geiger --workspace` deterministically errors with
        # "manifest path `Cargo.toml` is a virtual manifest, but this command requires
        # running against an actual package" (geiger, unlike cargo, demands a real
        # package + its dep tree). So target a REAL package via --manifest-path:
        # sparq-core, which by this job's own comment holds the unsafe of interest
        # (mmap, the zero-copy dictionary, SIMD) and pulls the rest of the workspace
        # in as path-deps, so the report still covers what matters. `--all-features`
        # is intentionally omitted (it would drag in device/heavy optional deps; the
        # default set already covers sparq-core's unsafe). The `|| true` makes the step
        # conclude SUCCESS even if geiger errors on some other dep-graph shape — this
        # report is informational and must never break CI. (The ci-summary gate also
        # treats this "…, informational" check as non-gating regardless — sq-wjth.)
        run: cargo geiger --manifest-path crates/sparq-core/Cargo.toml >> "$GITHUB_STEP_SUMMARY" || true
        continue-on-error: true

  docker-smoke:
    # [OPUS-4.8] sq-n6rv: build the release container EXACTLY as release.yml ships it, then
    # `docker run` it and prove over the network that it serves. This is the gate that makes
    # a container which exits immediately on `docker run` un-shippable: sq-n6rv was precisely
    # that (the fail-closed bind posture refused the ENTRYPOINT's 0.0.0.0 bind, so every
    # released image died on boot) and NO test caught it because nothing ever ran the image.
    # PR-triggered, so `ci-summary` auto-discovers and gates it; release.yml re-runs the same
    # script against the tag's image before push. Builds with the SAME Dockerfile + buildx the
    # release job uses, so the artifact under test matches the one that ships.
    name: docker image smoke (run + curl /health + query)
    # [OPUS-4.8] The image bakes the compiled sparq-server binary, so a Rust change can
    # change what ships; gate on rust_changed. (A pure Dockerfile/entrypoint change also
    # touches no `*.rs`, but the release.yml re-runs this script against the tag image
    # before push, so a doc-only PR skipping it here is safe — the canonical push to main
    # force-runs it, and any Dockerfile-affecting PR should accompany a build change.)
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true' || needs.changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (load into the local daemon)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Single-arch, loaded into the runner's docker daemon so `docker run` can use it.
          load: true
          push: false
          tags: sparq-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (docker run + /health + ASK query)
        run: scripts/docker-smoke.sh sparq-server:smoke 3030
