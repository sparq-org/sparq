          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::OGC GeoSPARQL query-rewrite conformance — attempt $attempt/$MAX_ATTEMPTS"
            rc=0
            cargo test -p sparq-geo --features geosparql_rewrite --test ogc_query_rewrite_ratchet -- --nocapture \
              | tee geo-query-rewrite.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "OGC GeoSPARQL query-rewrite suite passed on attempt $attempt"
              break
            fi
