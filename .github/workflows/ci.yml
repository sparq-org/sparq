          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run sparq-text BM25 differential oracle
        # The runner asserts its own floor (TEXT_ORACLE_FLOOR) + per-hit score
        # equality; capture the output so the grep gate below re-checks the count.
        # [OPUS-4.8] sq-shacl-flake (generalized from #1236): STEP-LEVEL transient
        # self-heal. A transient crates.io download hiccup aborts `cargo test` BEFORE
        # any test runs, leaving text-oracle.out empty; a single-shot invocation then
        # let the ratchet step below mis-report that empty output as a phantom
        # "regressed below the floor". Re-running lets such a transient self-heal. A
        # GENUINE regression fails the runner's own assert on every attempt and still
        # reds the job — the floor is never weakened. `rc` is captured from
        # PIPESTATUS[0] (cargo, not tee).
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::sparq-text BM25 differential oracle — attempt $attempt/$MAX_ATTEMPTS"
            rc=0
