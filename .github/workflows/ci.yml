name: CI

# Correctness gate (roadmap G1). Build + test the whole workspace on every push to main and every
# PR — the regression safety net the "no regressions in functionality" constraint requires.
# clippy now GATES with -D warnings (the workspace is warning-clean). rustfmt runs informationally
# until the one-time `cargo fmt --all` reformat lands (deferred behind the in-flight branches —
# see rustfmt.toml); flip it to a hard gate once that reformat merges. Heavy benchmarks live in
# bench.yml / bench-ec2.yml, NOT here.
on:
  push:
    branches: [main]
  # [FABLE-5] sq-fmx4u.5: react to labeled/unlabeled too so toggling the `ci-full`
  # label re-evaluates the change-based selection (ci-select.yml maps the label to
  # `--full`). The default types (opened/synchronize/reopened) are listed explicitly
  # so adding the label events does NOT drop `synchronize` (the push-to-PR trigger).
  # [FABLE-5] LABEL-TRIGGER GUARD: only the `ci-full` toggle may start real work off
  # these label events. The autonomous review pipeline flips review:*/status:* labels
  # several times per round on ~20 open PRs, and before this guard EVERY flip
  # restarted this whole workflow on an unchanged head SHA (measured 2026-07-17: one
  # PR head accumulated 4 generations / 12 concurrency-cancelled runs with zero
  # pushes), and the cancelled `select` check-runs left on that SHA then REDdened the
  # required ci-summary gate ("the selection pre-job must conclude success", e.g.
  # PR #2530). The guard is a job-level `if:` on the root jobs (`changes`,
  # `unsafe-register`, and the always()-composed `coverage` verdict job): a
  # labeled/unlabeled pull_request event whose label is not `ci-full` skips them, and
  # the whole needs:-graph skips with them — a cheap no-op run instead of a restart.
  # The `select` pre-job is the DELIBERATE exception: it stays unconditional (no
  # if/needs — pinned by scripts/tests/test_ci_select_wiring.py) and just runs to a
  # cheap SUCCESS, because scripts/ci_summary_gate.py REDs outright on any
  # "change-based test selection" check-run whose conclusion is not `success` — a
  # SKIPPED select would poison the gate exactly like a cancelled one. Skipped
  # non-select jobs are safe: the gate counts `skipped` as satisfied while the
  # commit's select runs are all green. Label events also get a PER-RUN concurrency
  # group (below), so a flip can never concurrency-cancel an in-flight run on the
  # same head SHA — those same-SHA cancellations were the actual gate poison.
  # [FABLE-5] Draft-tier CI: + ready_for_review, so the un-draft moment re-runs the
  # whole matrix at FULL tier on the same head SHA (coverage + heavy shards run
  # again) and the fresh check-runs supersede the draft-tier ones — see
  # docs/branch-protection.md §Draft-tier CI. The label-trigger guard above and the
  # draft-tier guards below are independent and AND-compose on each affected job:
  # a non-`ci-full` label flip stays a no-op regardless of draft state, and a draft
  # head stays tier-reduced regardless of label events.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # [OPUS-4.8] Merge queue: re-run the identical PR check-set on the queue's
  # merge_group ref so the required ci-summary gate finds the same siblings it finds
  # on a PR. The per-commit `coverage` job (if: event_name != 'schedule') runs here;
  # the nightly tier (if: event_name == 'schedule' || 'workflow_dispatch') stays off.
  merge_group:
  workflow_dispatch: # [OPUS-4.8] manual trigger forces the nightly tier regardless of the freshness gate
  # [OPUS-4.8] Nightly schedule drives the heavy coverage tier (sq-hbg7): the
  # `coverage-nightly` job runs the sparq-vectors 50k recall/diskann accuracy
  # tests under llvm-cov instrumentation, which a per-commit job cannot afford
  # (measured >10 min for that ONE crate under instrumentation — see the job
  # comment + bench/coverage-floor.json). 03:17 UTC daily.
  # [FABLE-5] sq-fmx4u.5: this scheduled run is ALSO the change-based-selection
  # FULL-MATRIX BACKSTOP (design §6.1) — a `schedule` event carries no PR diff so
  # the `select` pre-job resolves to mode=full and the whole matrix runs, so nothing
  # a PR selection-skipped can silently rot. The `selection-backstop` job below
  # asserts that mode=full invariant fail-loud.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # [OPUS-4.8] sq-qcnn.11: scheduled/dispatch NIGHTLY runs get a PER-RUN concurrency group
  # (keyed on github.run_id) and are NEVER auto-cancelled. Root bug (sq-52su close-note): a
  # scheduled nightly runs on `refs/heads/main`, the SAME ref a push-to-main run uses, so
  # both shared the group `ci-CI-refs/heads/main` and `cancel-in-progress: true` let the
  # next push CANCEL the long-running nightly (the cargo-mutants sweep) after ~5-6 crates —
  # leaving ~20 crates with no mutation signal. Giving schedule/workflow_dispatch a unique
  # per-run group (and cancel-in-progress: false) means push-to-main can no longer cancel
  # them. PR / push / merge_group runs keep the per-ref group + cancel-in-progress so a
  # superseded build still auto-cancels to save CI minutes (unchanged behaviour for them —
  # they resolve to the constant `-shared` suffix).
  # [FABLE-5] label-trigger guard: labeled/unlabeled pull_request events ALSO get a
  # per-run group. A label-flip run entering the shared per-ref group would cancel the
  # in-flight real run on the SAME head SHA (cancellation happens at run level, before
  # job `if:` guards evaluate), leaving cancelled check-runs that RED the ci-summary
  # gate. Isolated, a non-`ci-full` flip is a guarded no-op run and a `ci-full` toggle
  # runs the full matrix WITHOUT killing the superseded selected run mid-flight (both
  # conclude green; the gate aggregates the union). Non-label PR/push/merge_group runs
  # keep the shared group + cancel-in-progress exactly as before.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action))) && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # [OPUS-4.8] sq-shacl-flake: harden EVERY job against transient crates.io
  # registry download hiccups. A `curl failed` mid-download of a single crate
  # (observed: `download of al/lo/allocator-api2 failed`) aborts the build and,
  # in the SHACL conformance job, then mis-reported as a phantom "conformance
  # regressed below the ratchet" that jammed the merge queue. Raising cargo's
  # network retry well above the default (3) lets these transients self-heal at
  # the cargo layer before they ever sink a job. A genuine fetch failure (crate
  # truly absent) still exhausts the retries and fails honestly.
  CARGO_NET_RETRY: "10"
  # [SONNET-4.6] sq-6vshe.1: CI build-profile speedup applied to all native Linux Rust jobs.
  # CARGO_INCREMENTAL=0: incremental compilation is pure overhead on cold-cache one-shot CI
  # builds (no .incremental/ artifacts survive across jobs).
  # CARGO_PROFILE_DEV_DEBUG=line-tables-only: keeps file:line backtraces (RUST_BACKTRACE=1
  # above still works) while dropping bulky DWARF variable-info sections — cuts both
  # debuginfo-emission time and link time on the dev profile. Sufficient for line-coverage
  # tracking (cargo-llvm-cov uses LLVM coverage counters, not DWARF; llvm-cov adds its own
  # -C instrument-coverage rustflag which coexists cleanly with this setting).
  # CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld": routes ALL
  # native x86_64 link steps through lld (LLVM's fast linker). The per-target env var scopes
  # this to the HOST triple only — wasm32-unknown-unknown builds use wasm-ld and are
  # unaffected (proc macros and build scripts that compile for the host DO benefit).
  # lld is chosen over mold because: (a) Rust 1.86+ already ships rust-lld and uses it as
  # the default for x86_64-unknown-linux-gnu (the -B<sysroot>/gcc-ld path provides it);
  # (b) lld-18 is pre-installed on ubuntu-24.04 runners; (c) no per-job apt install step is
  # needed — tests that spawn cargo as a subprocess (e.g. crate-doc guard tests) inherit
  # this flag safely. Bench/release/dist profiles are NOT changed (bench.yml, build-matrix.yml).
  #
  # [SONNET-4.6] sq-6vshe.11 — THE THIRD LEG DOES NOT REACH EVERY JOB. Audit result of
  # "does the sq-6vshe.1 trio reach the coverage lane?", measured, not assumed:
  #   * CARGO_INCREMENTAL=0            — REACHES it (a plain cargo env var, no competition).
  #   * CARGO_PROFILE_DEV_DEBUG        — REACHES it. Verified by running `cargo test --no-run
  #     -v` with the var set: rustc is invoked with `-C debuginfo=line-tables-only`. Cargo's
  #     `test` profile inherits `dev`, and a config/env profile key overrides the manifest,
  #     so instrumented TEST binaries do get the thin-debuginfo build.
  #   * CARGO_TARGET_<triple>_RUSTFLAGS — DOES **NOT** reach any job that also sets
  #     `RUSTFLAGS`/`CARGO_ENCODED_RUSTFLAGS`. Cargo's four rustflags sources are
  #     FIRST-MATCH-WINS, never merged: `CARGO_ENCODED_RUSTFLAGS` > `RUSTFLAGS` >
  #     `target.<triple>.rustflags` (which is what this var is) > `build.rustflags`.
  #     Verified directly: with only the per-target var set, rustc gets its flags; with
  #     `RUSTFLAGS` ALSO set, the per-target var is dropped entirely and only `RUSTFLAGS`
  #     survives. cargo-llvm-cov sets exactly those variables to inject `-C
  #     instrument-coverage` — this repo already depends on that: scripts/
  #     coverage-engine-shard.sh `build-objects` runs `eval "$(cargo llvm-cov show-env
  #     --export-prefix)"` precisely to import "RUSTC_WRAPPER + coverage RUSTFLAGS" into its
  #     shell. So every coverage job was silently linking with the DEFAULT linker while
  #     every sibling job used lld.
  # Fix: the coverage jobs below set `RUSTFLAGS` themselves, which is the source
  # cargo-llvm-cov reads and extends rather than one it shadows. NOT VERIFIED IN-SANDBOX:
  # cargo-llvm-cov is not installed on the authoring box, so "it appends to an existing
  # RUSTFLAGS instead of replacing it" is its documented behaviour, not something measured
  # here — confirm on the first CI run by checking a coverage job's compile line. The
  # failure mode is benign either way: if it replaced RUSTFLAGS, this change is a no-op
  # (status quo, still no lld) rather than a regression. They must all use the IDENTICAL
  # value (the engine split's cross-runner .profraw merge requires identical compile
  # inputs); `scripts/check-coverage-rustflags.py` enforces presence AND sameness.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  # [OPUS-4.8] merge-throughput: path-filtered gate. Compute whether THIS change
  # touches Rust at all, so a doc-only / compliance / CI-markdown / site PR can skip the
  # ~15-minute Rust test matrix while the required `ci-summary / gate` still resolves
  # SUCCESS for it. CORRECTNESS CONTRACT (the heavy jobs below `if:` on this):
  #   • rust_changed == 'true'  -> every heavy job runs EXACTLY as before. A Rust PR can
  #     never merge without the full matrix.
  #   • rust_changed == 'false' -> the heavy jobs are `skipped`; the ci-summary aggregator
  #     (ci-summary.yml) already treats a `skipped` conclusion as NON-failing
  #     (`conclusion != "success" and != "skipped" and != "neutral"` is the only thing it
  #     fails on), so the gate goes green fast. Fast doc/lint siblings (docs-quality, etc.)
  #     still run and still gate.
  # SAFE-BY-DEFAULT: rust_changed is forced 'true' on `push` to main (the canonical
  # build), `schedule`, and `workflow_dispatch` — the full matrix ALWAYS runs there. On
  # `pull_request` only a diff that is purely non-Rust skips. The Rust path set is broad on
  # purpose: any `*.rs`, any `Cargo.toml`, `Cargo.lock`, the `rust-toolchain*` pin, OR this
  # workflow file itself (so editing a Rust job here re-runs that job). If the diff cannot
  # be computed for any reason, the filter's absence of a match defaults to NOT skipping
  # only because we hard-force 'true' off the PR/merge_group path — we never silently skip.
  #
  # [FABLE-5] MERGE-GROUP CHANGE-CLASS GATE (path-aware CI; extends #3420/#3421 to this
  # rust_changed layer). merge_group used to hard-force rust_changed=true, so even a
  # docs-only/orchestration-only queued batch (the observed #2533 class) paid the
  # rust_changed-only lanes (lint / msrv / geiger / docker-smoke / coverage-floors) on
  # every enqueue — the select-conjunct lanes already skip via the batch-diff selection
  # (ci-select.yml passes merge_group.base_sha/head_sha). The decide step below now
  # resolves the SAME batch diff (the #3421 fetch pattern) and classifies it with
  # `scripts/ci_select.py --classify-only` — the IDENTICAL `classify_change()` path the
  # `select` pre-job runs on this event, so the two layers cannot disagree on a resolved
  # diff (no duplicated path lists; ci_select.py stays the single source of truth).
  # A class on ci_select.py `_INERT_CLASSES` => rust_changed=false + docker_changed=false.
  # SOUNDNESS: an inert class means every changed path is on an AUDITED inert surface —
  # the orchestration/deploy allowlists (whose script/workflow entries the inertness tests
  # in scripts/tests/test_ci_select.py pin by grepping the Rust-CI workflows) or an
  # ownership-map `safe = true` verdict (re-verified every run by scripts/ci_audit_inputs.py,
  # which FAILS the moment a crate reads a safe-listed path). THAT is the load-bearing
  # proof, not the dorny `rust`/`docker` filters, which are a coarser extension-level
  # proxy: an audited-inert tree may legitimately hold a `.rs`/`Cargo.toml` those filters
  # would flag — research/hardware/wgpu-spike (no CI lane builds it) and
  # site/test/fixtures/policy-evaluator (built only by site-e2e.yml, a workflow this
  # gate does not touch) — while no lane gated here compiles either. Same trust model as
  # the PR-level gate otherwise: a pure function of the authoritative diff. Any OTHER
  # class, an unresolvable SHA pair, or ANY classifier error => true/true (fail-safe =
  # full run, cost never soundness).
  # [OPUS-5] sq-g25hr widened `_INERT_CLASSES` from {docs-only, orchestration-only} to
  # also cover `deploy-only` (deploy/** + the deploy lint workflows) and `inert-mixed`
  # (a diff confined to inert surfaces that SPANS more than one of them — previously
  # collapsed into `mixed` and therefore paid the full suite). Nothing about the trust
  # model changed: the class is still computed from the authoritative queued diff, so
  # one crates/** path taints the batch back to `mixed` => the wildcard arm => full run. Gate accounting: the skipped legs report `skipped` and the required
  # ci-summary gate attributes them to the (green, same-diff) `select` pre-job —
  # attributed skips, never missing legs (scripts/ci_summary_gate.py, sq-fmx4u.3).
  # NOT gated by-class here: vectorized-feature-off.yml stays FULL on merge groups on
  # purpose — the feature-OFF wasm byte-drift class only manifests on merged bundles
  # (the documented #3421 unsound-skip exception).
  changes:
    name: detect rust changes
    # [FABLE-5] label-trigger guard (see the pull_request trigger note): a
    # labeled/unlabeled event for any label other than `ci-full` must not restart the
    # matrix on an unchanged head SHA — skipping this root job skips every
    # needs:-dependent below it. All other events pass the first two disjuncts.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      github.event.label.name == 'ci-full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_changed: ${{ steps.decide.outputs.rust_changed }}
      # [OPUS-4.8] docker_changed is true when the SHIPPED image's inputs change but no
      # Rust did (a Dockerfile/entrypoint/smoke-script edit). docker-smoke gates on
      # rust_changed OR docker_changed so a Dockerfile-only PR (the sq-n6rv class of bug —
      # the bind posture/entrypoint) still gets the image smoke even though the matrix skips.
      docker_changed: ${{ steps.decide.outputs.docker_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Only run the path filter on pull_request: merge_group gets the batch-diff
      # change-class gate in the decide step below (dorny's push/merge_group base-diff is
      # unreliable; the merge_group event payload's base_sha/head_sha pair is not), and
      # every other event force-runs the full matrix, so the filter is irrelevant there.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
              # [OPUS-4.8] sq-spfg: the checked-in coverage/mutation FLOOR files are ratchet
              # inputs the `coverage` job's --check-monotonic gate validates. Without these,
              # a PR that lowers ONLY a floor (no .rs/Cargo/ci.yml change) sets
              # rust_changed=false, SKIPS the coverage job, and bypasses the monotonicity
              # gate at the PR level (merge_group force-true still catches it in the queue,
              # but the PR-level gate should fire too). List them so a floor-only PR runs the
              # gate that guards exactly those files. mutants-baseline.json is included
              # defensively for when the advisory mutation ratchet is promoted to gating.
              - 'bench/coverage-floor.json'
              - 'bench/coverage-presence.json'
              - 'bench/mutants-baseline.json'
            docker:
              - 'Dockerfile'
              - '**/Dockerfile'
              # [OPUS-4.8] sq-5f1s4 — `.dockerignore` shapes the `context: .` build the
              # docker-smoke job runs (it decides what `COPY . .` includes). A
              # `.dockerignore`-only PR that breaks the build context would otherwise set
              # docker_changed=false and skip the smoke at PR time (the gui.yml/#1081
              # blind-spot class). container-scan.yml already lists it; match that here.
              - '.dockerignore'
              - 'scripts/docker-smoke.sh'
              - '.github/workflows/ci.yml'
      - name: Decide rust_changed (safe-by-default off the PR path)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "rust_changed=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "docker_changed=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
            echo "pull_request -> paths-filter says rust=${{ steps.filter.outputs.rust }} docker=${{ steps.filter.outputs.docker }}"
          elif [ "${EVENT_NAME}" = "merge_group" ]; then
            # [FABLE-5] MERGE-GROUP CHANGE-CLASS GATE (see the job header note): diff the
            # queued batch (base_sha...head_sha, the #3421 fetch pattern) and classify it
            # via scripts/ci_select.py --classify-only — the same classify_change() the
            # `select` pre-job runs on this event. docs-only/orchestration-only batch =>
            # skip the rust_changed/docker_changed lanes; ANY other class, an unknown
            # token, an unresolvable SHA pair, or a classifier error => full (fail-safe).
            rust=true
            docker=true
            ok=true
            # --depth=2147483647 (git's INFINITE_DEPTH; --unshallow that is also
            # valid on a complete repo): this job's checkout is depth-1, and the
            # classifier's three-dot diff needs the merge-base — a shallow SHA
            # fetch leaves both commits PRESENT (the cat-file guards pass) but
            # unconnected, so `git diff base...head` dies with "no merge base"
            # and the fail-safe would silently force class=engine on EVERY
            # batch, reducing this whole gate to a no-op. Same rationale as
            # ci-select.yml's fetch-depth: 0 checkout.
            git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" "${MG_HEAD_SHA}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" 2>/dev/null \
              || ok=false
            git cat-file -e "${MG_BASE_SHA}^{commit}" 2>/dev/null || ok=false
            git cat-file -e "${MG_HEAD_SHA}^{commit}" 2>/dev/null || ok=false
            if [ "${ok}" = "true" ]; then
              cls="$(python3 scripts/ci_select.py --classify-only --event merge_group \
                       --base "${MG_BASE_SHA}" --head "${MG_HEAD_SHA}")" || cls=engine
              # [OPUS-5] sq-g25hr: the arm lists ci_select.py `_INERT_CLASSES` verbatim
              # (pinned by scripts/tests/test_ci_select_wiring.py so the two cannot drift).
              # deploy-only = deploy/** + the deploy lint workflows; inert-mixed = a diff
              # confined to inert surfaces that SPANS more than one of them (the observed
              # cloud-deploy batch: manifests + their READMEs + deploy-*.yml);
              # [OPUS-5] #5249: map-safe = every path resolves to an ownership-map
              # `safe = true` verdict (today site/** + ci/formal-verification.toml).
              case "${cls}" in
                docs-only|orchestration-only|deploy-only|map-safe|inert-mixed) rust=false; docker=false ;;
                *) rust=true; docker=true ;;
              esac
            else
              echo "::warning::could not resolve merge_group base/head SHAs for the batch diff — running the full matrix (fail-safe)."
            fi
            echo "rust_changed=${rust}" >> "$GITHUB_OUTPUT"
            echo "docker_changed=${docker}" >> "$GITHUB_OUTPUT"
            echo "merge_group -> change_class=${cls:-<unresolved>} rust_changed=${rust} docker_changed=${docker}"
          else
            # push / schedule / workflow_dispatch -> always run the full matrix.
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "docker_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME} -> forcing rust_changed=true + docker_changed=true (full matrix)"
          fi

  # [FABLE-5] sq-fmx4u.3: change-based test-selection pre-job (reusable — see the
  # doctrine in .github/workflows/ci-select.yml). Computes the affected crate
  # closure once per run; the wide per-crate lanes below guard on it with the
  # fail-closed disjunction  `mode != 'selected' || contains(affected, '"<crate>"')`
  # (empty/missing outputs => RUN), and the cross-crate bulk test shards NARROW
  # (never skip) via the filterset output. UNCONDITIONAL (no needs/if): the
  # ci-summary gate REQUIRES every selection check-run to conclude success before
  # any skipped sibling counts as satisfied, so this job must exist and be green
  # on every run — including doc-only PRs where `changes` skips the Rust matrix,
  # AND the label-trigger-guard no-op runs (a guarded/skipped select would conclude
  # `skipped` ≠ `success` and RED the gate on the whole head SHA; its cheap success
  # IS the no-op — do NOT add the guard here).
  # Relationship to `changes` (dorny paths-filter) is layered, both directions
  # preserved: rust_changed==false skips a lane regardless of selection (the
  # existing doc-PR fast path), and selection can only skip WITHIN
  # rust_changed==true. [FABLE-5] sq-fmx4u.5: ENFORCE is now the DEFAULT — a
  # not-affected crate's wide lane is actually skipped. Overrides: the `ci-full`
  # PR label forces mode=full; CI_SELECT_MODE=shadow is the report-only rollback
  # escape hatch (see ci-select.yml). Fail-safe unchanged (§4.1 triggers => full).
  select:
    name: select
    uses: ./.github/workflows/ci-select.yml
    permissions:
      contents: read

  # [FABLE-5] sq-fmx4u.5 (design §6.1): the nightly FULL-MATRIX BACKSTOP guard. The
  # scheduled (cron) run + a manual workflow_dispatch drive the whole test matrix
  # with the selector in mode=full — a non-PR event carries no diff, so the `select`
  # job returns full and NOTHING is narrowed/skipped. That is what stops anything a
  # PR selection-skipped from silently rotting: a regression in a crate that looked
  # unaffected on some PR still fails the nightly gate. This job makes that invariant
  # OBSERVABLE and fail-loud: if a future change ever let a scheduled/dispatch run
  # resolve to a NARROWED (mode=selected) selection, it REDs here rather than quietly
  # running a partial nightly. It runs ONLY on the backstop events; on
  # pull_request/push/merge_group it is `skipped` (which ci-summary counts as
  # satisfied — no per-leg name is individually required, bead sq-fmx4u.4). Reading
  # the select mode in a STEP (not the job `if:`) keeps the always-run-on-backstop
  # trigger decoupled from the selection outputs.
  selection-backstop:
    name: nightly selection backstop (full-matrix guard)
    needs: select
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert the scheduled/dispatch run uses the FULL matrix (no selection narrowing)
        env:
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$SELECT_MODE" != "full" ]; then
            echo "::error::nightly selection backstop: expected select mode=full on a '$EVENT' run, got '${SELECT_MODE:-<empty>}'. Change-based selection must NEVER narrow the scheduled full-matrix backstop (design §6.1) — a non-PR event carries no diff and must resolve to full."
            exit 1
          fi
          echo "nightly selection backstop OK ($EVENT): select mode=full — the whole matrix runs, so nothing a PR selection-skipped can silently rot."

  # [OPUS-4.8] BUILD-ONCE for the sharded test suite (sq-vyxy folded in). The old
  # design had every shard run `cargo build --workspace --all-targets` itself — the
  # 131s build FLOOR that rust-cache makes cheap for *deps* but cannot remove for
  # sparq's OWN crates (they recompile per runner). This job builds the workspace
  # test binaries exactly ONCE via `cargo nextest archive`, packages them into a
  # self-contained `nextest.tar.zst`, and uploads it as an artifact; each `test`
  # shard below DOWNLOADS that archive and runs `cargo nextest run --archive-file …`
  # with NO rebuild. So the 131s build is paid once (here), not N times, and the
  # longest test shard is just its test-exec time (~108s diskann) instead of
  # 131+108. Doctests — which nextest neither archives nor runs — are executed HERE,
  # once, off the warm build this job already has (was a guarded shard-1 step before).
  build-archive:
    name: build + archive test binaries (+ doctests once)
    # [FABLE-5] sq-fmx4u.3: the workspace archive runs whenever the affected
    # closure is NON-EMPTY (design §5.2) — the bulk shards it feeds are narrowed,
    # not skipped, so they need the archive for any non-empty selection. Only a
    # provably-empty closure (every changed path SAFE-listed/non-crate) skips it;
    # the shards then skip too via `needs`. Fail-closed: an empty/missing `mode`
    # or `affected` output satisfies a disjunct => RUN.
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' || needs.select.outputs.affected != '[]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] sq-c76x: reclaim ~20-30 GB of pre-installed SDKs/toolchains BEFORE the
      # build + `nextest archive` write. The stock ubuntu-latest runner ships ~14 GB free
      # on `/`; the archive (.tar.zst of every workspace test binary) plus the warm
      # `target/` were exhausting it (`No space left on device`). In-repo shell, no
      # third-party action to SHA-pin. Best-effort + guarded — absent paths no-op. See
      # scripts/ci-free-disk.sh.
      - name: Free runner disk before build + archive
        run: ./scripts/ci-free-disk.sh
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-4.8] Dep cache for THIS build-once job. The `test` shards no longer
          # restore a rust-cache entry at all — they download the prebuilt
          # `nextest.tar.zst` artifact and run it with `--archive-file`, so there is no
          # shared cache key with them (the earlier per-shard build that did share this
          # key is removed). A stable `shared-key` is still worth keeping so this job's
          # dep cache is the one every branch's run restores.
          shared-key: "test-workspace"
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE. THIS IS THE CANONICAL NOTE; every other rust-cache step in this
          # file carries the same `save-if` and points back here. All three beads reached
          # the same posture from different ends (sq-h2gz6 and sq-aemq7 as follow-ups to
          # sq-3sbrr / #1395, which did this for the feature-matrix legs; sq-6vshe.15 as
          # lever 2 of the CI structural-speedup program) — this note is their union.
          #
          # RESTORE is unconditional — PR heads and `gh-readonly-queue/*` entries both
          # branch off main and read main's entry, which is where the dep-cache hit
          # comes from. SAVE happens on push-to-main ONLY, for two reasons:
          #   1. A save from a merge-queue entry is DEAD ON ARRIVAL. Actions cache
          #      scoping makes an entry written from `refs/heads/gh-readonly-queue/<base>/
          #      pr-<N>-<sha>` visible to that ref alone, and GitHub deletes that ref the
          #      moment the entry merges or is ejected — nothing can ever restore it. The
          #      save is pure post-step wall-clock on the queue's critical path.
          #   2. Branch-scoped saves churn the repo's shared 10 GB Actions-cache budget,
          #      which GitHub LRU-evicts against, so those write-only copies push the
          #      WARM main-scoped entries out and the heavy jobs (coverage, conformance,
          #      mutants) restore COLD and pay the dependency-compile floor from scratch.
          #      Caching was present but self-defeating: a branch-scoped entry is
          #      unreadable from main and from every sibling PR anyway, so each PR run
          #      was paying to make the next run colder. This is sq-3sbrr's doctrine,
          #      already applied to feature-matrix.yml and the wasm lanes; this file's
          #      cache steps (plus the one in vectorized-feature-off.yml) were the gap
          #      left on the queue path.
          #
          # WHY main-only is safe rather than a permanent cold start, twice over:
          #   - SEEDING: EVERY key here still has a seeder.
          #     - the per-commit jobs are seeded by the post-merge push-to-main run — the
          #       `changes` job forces rust_changed=true on any non-PR/non-merge_group
          #       event (`ci_select.py` treats `push` as mode=full), so `push` runs the
          #       full matrix;
          #     - `coverage-nightly` / `mutants-nightly-advisory` never run on push (they
          #       hang off `nightly-gate`, which is schedule/workflow_dispatch only), and
          #       are seeded by the 03:17 UTC cron — a scheduled run's ref IS
          #       refs/heads/main, so save-if holds there too.
          #     No job is left permanently cold by this.
          #   - CONTENT: rust-cache stores the DEPENDENCY build only (it cleans
          #     workspace-crate artifacts out of `target/` before saving), and deps are
          #     pinned by the committed Cargo.lock, so main's dep cache is the same
          #     closure the PR would build for itself.
          #
          # COST: a PR that changes `Cargo.lock` re-resolves/rebuilds deps on each push
          # instead of once (a PR that merely ADDS a dep just compiles that dep cold).
          # Accepted — that PR class is rare, and it is exactly the class whose
          # branch-scoped save was evicting main's entry for everyone else.
          # COUPLING (read before landing sq-6vshe.14): main-scope freshness now depends
          # ENTIRELY on push-to-main runs. .14 skips queue-validated push legs and must
          # keep its promised cache-primer leg, or these caches go stale.
          # The posture is pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # [OPUS-4.8] sq-x4jy: cargo-nextest is the test runner — each test in its OWN
      # process (a stray abort can't take the whole binary down), a never-executed
      # BINARY reported as a DETERMINISTIC failure, and retries = 2 (now set by
      # .config/nextest.toml [profile.ci], selected on the run side — registry#563
      # item 2) lets a residual transient binary race self-heal. SHA-pinned install
      # action (a pin already vetted elsewhere in this workflow).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: nextest
      # [OPUS-4.8] Build + ARCHIVE the whole workspace test set once. `--all-targets`
      # mirrors the old `cargo build --workspace --all-targets` (unit + integration +
      # bin test targets), so the archived set == what the un-sharded run built. The
      # .tar.zst is self-contained (binaries + the metadata nextest needs to run them
      # on another runner with `--archive-file`), so the shards never recompile.
      #
      # [OPUS-4.8] The archive runs `--features approx-ann,filtered-ann,vec-predicate`
      # (#363, LOAD-BEARING): sparq-vectors' heavy recall/over-fetch/vec-predicate tests are
      # MODULE-gated (`#![cfg(feature = ...)]`) and MUST run in this sharded lane — without
      # these the gated binaries compile EMPTY and the heavy-hnsw shard's exact filter matches
      # ZERO tests (nextest exit 4). These three are the ONLY opt-in features carried here.
      # GUARD (sq-vya1): the archive carries NO OTHER opt-in features (we deliberately avoid
      # `--all-features` — cross-crate conflicts + heavy/native/network deps would not even
      # resolve; see feature-matrix.yml's SCOPE). Any test behind a DEFAULT-OFF feature OTHER
      # than those three compiles EMPTY here and runs SILENTLY-zero in the shards — its coverage
      # is the JOB OF feature-matrix.yml (per-leg `cargo test -p <crate> --features <set>`,
      # gated by ci-summary). When you add/feature-gate a test: a sparq-vectors recall/vec test
      # rides these archive features; ANYTHING ELSE must be wired into a feature-matrix.yml leg
      # (read that file's GUARD block). Prove a suite is reached: `cargo nextest list -p <crate>
      # --features <set>` must SHOW its test names.
      - name: Build + archive test binaries (nextest archive)
        run: cargo nextest archive --workspace --all-targets --features approx-ann,filtered-ann,vec-predicate --archive-file nextest.tar.zst
      # [OPUS-4.8] Upload the archive immediately after the build, BEFORE doctests, so
      # the shards' input artifact is produced even if the doctest step later fails.
      - name: Upload nextest archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 1
          if-no-files-found: error
          # [SONNET-4.6] sq-6vshe.15 lever 1 — ARTIFACT DIET. upload-artifact wraps its
          # payload in a zip at DEFLATE level 6 by default. `nextest.tar.zst` is ALREADY
          # zstd-compressed, so that pass re-compresses incompressible bytes: it burns CPU
          # on this job — which sits on the merge-queue critical path, with every test
          # shard blocked on the artifact via `needs:` — for a size delta that on
          # already-compressed input is ~0 (DEFLATE cannot find redundancy zstd removed).
          # `0` = store, i.e. zip the file without re-compressing it. NOT a content change:
          # the archive bytes the shards download are identical, only the zip container's
          # compression method differs, so the nextest test set is unchanged by
          # construction (and any drift would still fail LOUD — a shard's exact `-E` filter
          # matching zero tests is nextest exit 4, not a silent pass).
          compression-level: 0
      # [OPUS-4.8] Doctests run ONCE here (nextest neither executes nor archives them,
      # and --partition does not apply to them), off the warm archive build for ~12s at
      # ZERO extra build cost — the whole point of build-once (sq-vyxy). Tradeoff (raised
      # in #159 review): the shards `need: build-archive`, so a doctest failure here reds
      # this job and SKIPS the shards, costing the cross-shard "full failure picture" for
      # that run. We accept it deliberately: the only alternatives are (a) a separate
      # doctest job, which re-pays the ~131s workspace build this PR exists to amortise,
      # or (b) `if: always()` on the shards to decouple them, which muddies the gate
      # (shards then must distinguish "build failed, no artifact" from "doctests failed,
      # artifact present"). A doctest failure is rare and itself a hard, independent
      # blocking signal; archive-then-doctest above at least guarantees the artifact
      # exists. Re-open this if doctest flakiness ever makes the masked picture costly.
      # [OPUS-4.8] (#363) SAME feature set as the archive build above so the opt-in
      # sparq-vectors doc examples (the approx-ann/filtered-ann/vec-predicate-gated `///`
      # blocks) are compiled/run here too, not silently dropped.
      - name: Doctests (nextest does not run these; run once, off the warm build)
        run: cargo test --workspace --features approx-ann,filtered-ann,vec-predicate --doc

  test:
    # [OPUS-4.8] LOAD-AWARE sharded test matrix (merge-queue-drain speed — @jeswr).
    # The test-time distribution is SEVERELY skewed, so a runtime-BLIND
    # `--partition count:K/N` (the prior design) wastes the parallelism: it splits by
    # test COUNT, and MEASURED two tests dominate — sparq-vectors'
    #   diskann_recall_at_10_vs_brute_force_on_50k  ≈ 108.7s
    #   hnsw_recall_at_10_vs_brute_force_on_50k     ≈  61.2s
    # = ~170s, ~43% of the ~392s total; the OTHER ~1827 tests are ≈0.01s each
    # (~222s combined). A count split can land BOTH heavies on one shard, making that
    # shard ~225s of test-exec while its siblings finish in ~55s — the shards do NOT
    # finish together and the 4-way split saves almost nothing.
    #
    # FIX — ISOLATE THE HEAVY TAIL, then evenly count-partition the uniform rest:
    #   • shard `heavy-diskann`: ONLY the 108.7s diskann recall test.
    #   • shard `heavy-hnsw`:    ONLY the 61.2s hnsw recall test (split APART from
    #     diskann — piling them together would recreate the ~170s long pole).
    #   • shards `bulk 1/3 … 3/3`: everything that is NOT a known-heavy test,
    #     `--partition count:K/3` over that filtered set — the ~222s uniform
    #     remainder split evenly 3 ways (~74s each).
    # Every test lands in exactly ONE shard: the two heavy filters + their negation
    # over the bulk are a PARTITION of the suite (proof: heavy-diskann ∪ heavy-hnsw =
    # the 2 heavies; bulk = `not (heavy)` = the other 1827; count:1/3+2/3+3/3 over the
    # bulk == the whole bulk, disjoint). COVERAGE IS UNCHANGED — no test dropped, the
    # suite is just distributed by LOAD, not count. Doctests run once in build-archive.
    #
    # ESTIMATED per-shard test-exec (build is paid once in build-archive, NOT here):
    #   heavy-diskann ≈ 108.7s  (the long pole; everything else finishes under it)
    #   heavy-hnsw    ≈  61.2s
    #   bulk 1..3/3   ≈  74s each
    # so the longest shard ≈ the 108.7s diskann FLOOR — exactly the target. The build
    # job (~131s) runs first, so wall-clock ≈ 131s + ~109s, but with FAR less compute
    # than the prior 5×(131s build) and with the shards genuinely finishing together.
    #
    # GENERALISING (so a NEW heavy test cannot silently re-skew this): the known-heavy
    # set is the single `HEAVY` filterset env below. To add one: `| test(=its_name)` in
    # HEAVY and, if it is comparable to the existing heavies, its own matrix shard; the
    # bulk filter is the negation of HEAVY, so it stays correct automatically. This is
    # the pragmatic known-heavy-list + count-partition-the-rest design — deliberately
    # NOT a timing database (over-engineered for a 2-heavy tail).
    #
    # [OPUS-5] sq-6vshe.7 phase 4 (#5563) — WHO NOTICES. This upkeep used to depend on a
    # human spotting a `SLOW [> Ns]` marker in a shard log, which is not a mechanism: a
    # newly-slow test just rejoins a bulk shard and re-skews the split, and the only
    # symptom is a slower merge queue that nobody attributes back to this env. That read
    # is now MEASURED weekly by `.github/workflows/heavy-set-alarm.yml` +
    # scripts/heavy_set_alarm.py, which times every test via nextest's libtest-json-plus
    # stream and files an issue when HEAVY stops matching the measured heavy set — a test
    # above the floor that HEAVY does not name, an atom left behind by a rename (whose
    # shard then silently runs ZERO tests, since `test(=NAME)` is an exact match), or a
    # declared heavy that got fast and is now wasting a shard. It is ADVISORY and reads
    # this env; it never edits it, so the list below stays hand-owned.
    #
    # fail-fast: false so one shard's failure does not cancel the others (we want the
    # full failure picture across the suite, not just the first shard to break).
    name: test (load-aware shard ${{ matrix.name }})
    # [OPUS-4.8] needs BOTH: build-archive (artifact) AND changes (the path filter). With
    # build-archive `if:`-skipped on a doc-only PR, this job is skipped too (a needed job
    # was skipped) — exactly the intent. Keep the explicit `changes` need + `if:` so the
    # skip is driven by the filter, not an incidental artifact-missing failure.
    # [FABLE-5] sq-fmx4u.3: + `select` for the change-based narrowing below. An
    # empty-affected selection skips build-archive, which skips every shard here
    # via `needs` — no shard ever runs against a missing archive.
    needs: [changes, build-archive, select]
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    env:
      # [OPUS-4.8] THE single source of truth for the known-heavy tests. `test(=NAME)`
      # is an EXACT-match nextest filterset atom (the leading `=` avoids substring
      # matches). Add future SLOW-flagged heavies here as `| test(=name)` — the bulk
      # shards (which run `not ( $HEAVY )`) then exclude them automatically.
      HEAVY: "test(=diskann_recall_at_10_vs_brute_force_on_50k) | test(=hnsw_recall_at_10_vs_brute_force_on_50k)"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dedicated shard for the 108.7s diskann recall test (the long pole).
          # [OPUS-4.8] sq-c76x: rayon_threads=1 makes the recall metric BIT-DETERMINISTIC.
          # The data/query gen + HNSW level-RNG are already seeded, but the HNSW graph is
          # built rayon-PARALLEL inside instant-distance (ann.rs build), so thread
          # scheduling perturbs neighbour selection and HNSW recall varied run-to-run
          # (MEASURED 0.9980<->1.0000 across runs; ~5pt above the 0.95 floor — safe, but
          # not reproducible). Pinning ONE rayon thread removes that scheduling variance
          # (MEASURED: HNSW becomes bit-identical) at ZERO cost here — these are accuracy
          # gates, not throughput benches, and run alone on their shard. DiskANN is already
          # bit-identical (MEASURED 0.9660 every run); pinning it too is harmless + uniform.
          # Floors are UNCHANGED (HNSW >= 0.95, DiskANN >= 0.90) — this removes variance, it
          # does not move the bar. Only the heavy shards set this; the bulk shards keep
          # default parallelism (their ~1827 tiny tests want the threads).
          # [FABLE-5] sq-fmx4u.3: `crate` marks a shard that exercises exactly ONE
          # crate's tests (both heavies live in crates/sparq-vectors/tests/). When
          # selection is ENFORCED (mode == 'selected') and that crate is not in the
          # affected closure, the run step below exits 0 without running the shard
          # ("skipped by selection"). This cannot be a job-level `if:` — the
          # `matrix` context is NOT available there (GitHub contexts-availability:
          # jobs.<job_id>.if sees only github/needs/vars/inputs; a matrix reference
          # silently evaluates EMPTY, which would skip every leg unconditionally) —
          # so the guard lives in the step, where `matrix` is available. `crate: ""`
          # on the bulk shards = cross-crate: NEVER skipped, only narrowed.
          - name: heavy-diskann
            filter: "test(=diskann_recall_at_10_vs_brute_force_on_50k)"
            rayon_threads: "1"
            crate: "sparq-vectors"
          # Dedicated shard for the 61.2s hnsw recall test — SPLIT from diskann.
          - name: heavy-hnsw
            filter: "test(=hnsw_recall_at_10_vs_brute_force_on_50k)"
            rayon_threads: "1"
            crate: "sparq-vectors"
          # The uniform remainder (~222s), evenly count-partitioned 3 ways.
          - name: bulk 1/3
            partition: "count:1/3"
            crate: ""
          - name: bulk 2/3
            partition: "count:2/3"
            crate: ""
          - name: bulk 3/3
            partition: "count:3/3"
            crate: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] sq-c76x: reclaim ~20-30 GB BEFORE downloading/extracting the nextest
      # archive and running the shard. This is the PRIMARY site of the `No space left on
      # device` bulk-shard failures: the bulk shards `--extract-to .` the archived
      # `target/` INTO the checkout (to rebuild the baked CARGO_BIN_EXE path — see the run
      # step below) and write per-test diagnostics, on a runner that starts with only
      # ~14 GB free. Same in-repo, SHA-pin-free, best-effort step as build-archive.
      - name: Free runner disk before download + test
        run: ./scripts/ci-free-disk.sh
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: nextest
      - name: Download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
      # [OPUS-4.8] No build step: each shard RUNS the pre-built archive
      # (--archive-file) and skips the 131s rebuild. `--workspace-remap .` points the
      # archived (build-time) source paths at THIS runner's checkout (same commit), so
      # tests that read fixtures relative to the workspace root resolve correctly.
      #   • heavy shards: `-E "$HEAVY ∧ <that one test>"` — i.e. exactly that test.
      #   • bulk shards:  `-E "not ( $HEAVY )"` + `--partition count:K/3` — the
      #     uniform remainder, split evenly. Filter is applied FIRST, then the count
      #     partition runs over the filtered (not-heavy) set, so the three bulk shards
      #     cover every non-heavy test exactly once.
      # retries = 2 preserved per shard via `--profile ci` (.config/nextest.toml —
      # transient binary-race self-heal, sq-x4jy; moved off the inline flag by
      # registry#563 item 2 so the retry policy has one home).
      #
      # [OPUS-4.8] `--extract-to . --extract-overwrite` is LOAD-BEARING — it is the fix
      # for the bulk-shard failures #159 originally shipped with. WHY: sparq-cli's
      # integration tests (crates/sparq-cli/tests/cli_contract.rs) SPAWN the `sparq-cli`
      # binary via the COMPILE-TIME macro `env!("CARGO_BIN_EXE_sparq-cli")`. `env!` bakes
      # the build machine's ABSOLUTE path (`<workspace>/target/debug/sparq-cli`) into the
      # test binary at `nextest archive` time; it does NOT read the env var at runtime, so
      # nextest's runtime CARGO_BIN_EXE override (the relocatable `NEXTEST_BIN_EXE_*` form
      # the test would have to opt into) can't help. By DEFAULT nextest extracts the
      # archive to a TEMP dir, so on the test runner that baked absolute path does not
      # exist -> `spawning sparq-cli: NotFound` and the bulk shards die immediately (the
      # heavy shards passed only because the recall tests spawn no binary). GitHub-hosted
      # runners check BOTH jobs out to the SAME absolute path (/home/runner/work/<r>/<r>),
      # so extracting the archive's `target/` INTO this checkout (CWD == workspace root)
      # reconstructs `<workspace>/target/debug/sparq-cli` at exactly the baked path, and
      # the spawn resolves. `--extract-overwrite` is required because the checkout already
      # holds the source tree (+ the downloaded nextest.tar.zst). Reproduced + fix verified
      # locally (nextest 0.9.137): clean checkout + extract-to . -> all 4 CLI-spawn tests
      # PASS; without it they reproduce the exact NotFound panic. (Touching ONLY this
      # run-step keeps it on the build-once archive path — sq-vyxy stays closed.)
      # [OPUS-4.8] sq-c76x: TWO retry layers, each fixing a DIFFERENT failure class —
      #   1. `retries = 2` (kept, count unchanged — now sourced from
      #      .config/nextest.toml [profile.ci] via `--profile ci`, registry#563 item 2):
      #      nextest's PER-TEST retry. A single flaky test process re-runs in-place; the
      #      test passes iff any attempt passes, and a retried-then-passing test is
      #      reported FLAKY in the log + end-of-run summary (final-status-level =
      #      "flaky"), so retries never silently mask a flaky test. This is the
      #      residual-variance / transient-binary-race self-heal (sq-x4jy).
      #   2. The `for attempt` STEP-LEVEL retry below (new): re-invokes the WHOLE
      #      `cargo nextest run` up to MAX_ATTEMPTS times. This catches failures that a
      #      per-test retry CANNOT — a transient archive-extraction error, residual disk
      #      pressure on the first attempt, or a runner hiccup that fails the invocation
      #      before/around the test run. Without it, ONE such transient sinks the whole
      #      shard, the ci-summary gate then concludes failure, and an otherwise-mergeable
      #      PR is blocked (the exact merge-train stall this bead fixes). With it, a single
      #      transient self-heals on the retry. A GENUINE failure still fails every attempt
      #      and correctly reds the shard (and the gate) — the floor is never weakened.
      # The matrix branch (heavy vs bulk) only changes the nextest ARGS; the retry wrapper
      # is identical for both, so we build the arg list once then loop.
      - name: Test (nextest, shard ${{ matrix.name }})
        # [OPUS-4.8] sq-c76x: pin rayon to one thread ONLY on the heavy recall shards
        # (matrix.rayon_threads is "1" there, empty on the bulk shards) so the HNSW
        # parallel-build recall metric is reproducible — see the matrix comment. An empty
        # value leaves RAYON_NUM_THREADS unset, so the bulk shards keep default parallelism.
        env:
          RAYON_NUM_THREADS: ${{ matrix.rayon_threads }}
          # [FABLE-5] sq-fmx4u.3: selection inputs, passed via env (not inline
          # `${{ }}` in the script) so the shell sees literal values — no
          # template-injection surface, and shellcheck-friendly.
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_AFFECTED: ${{ needs.select.outputs.affected }}
          SELECT_FILTERSET: ${{ needs.select.outputs.filterset }}
          SHARD_CRATE: ${{ matrix.crate }}
          # [OPUS-4.8] sq-6vshe.6 (heavy-lane placement, round 2): the two heavy
          # recall shards are DEMOTED off the merge_group ref (see the demotion guard
          # below). `matrix.filter` is non-empty ONLY on those two heavy shards, so this
          # env is the shard-kind discriminator the run script reads (it is empty on the
          # bulk shards). Passed via env — no inline `${{ }}` in the shell body.
          SHARD_FILTER: ${{ matrix.filter }}
          # [FABLE-5] Draft-tier CI: "true" only on a DRAFT pull_request head — the
          # heavy recall shards are ALSO demoted there (see the draft-tier guard
          # below); every other event/state evaluates "false" and changes nothing.
          IS_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          # [OPUS-4.8] sq-6vshe.6 (research/ci-structural-speedup.md §7, round 2):
          # DEMOTE the two heavy sparq-vectors recall shards (heavy-diskann/heavy-hnsw)
          # off the merge_group ref. WHY it is SAFE (per-leg cross-PR-interaction
          # analysis): each heavy shard runs exactly ONE deterministic, self-contained,
          # single-crate accuracy gate ({diskann,hnsw}_recall_at_10_vs_brute_force_on_50k
          # in crates/sparq-vectors/tests/, fixed seeds, `approx-ann` feature). Its
          # outcome is a pure function of sparq-vectors' ANN impl + its pinned
          # instant-distance dep — NOTHING else in the workspace. A squash-merge group
          # re-running it on the combined tree reproduces the identical result each PR
          # already gated, so it carries no cross-PR-interaction signal (unlike the bulk
          # workspace-unification build+test, which stays). FULL FORM is UNCHANGED: the
          # heavy shards still run at PR level AND on push-to-main (both force
          # rust_changed=true and neither hits this guard), so the recall floors gate
          # every PR + the canonical main build exactly as before. A post-merge
          # regression is caught by the push-to-main heavy run (this same job on the
          # `push` event) + the dedicated `heavy-recall-demoted-filer` job below, which
          # auto-files a P1 bead + GitHub issue if a heavy shard fails on main. This ONLY
          # affects the merge_group ref, and reports `success` (exit 0) so the ci-summary gate is
          # satisfied (the poller discovers whatever check-runs exist; an absent-by-design
          # sub-result never hangs it). Mirrors the selection skip idiom directly below.
          if [ "${{ github.event_name }}" = "merge_group" ] && [ -n "$SHARD_FILTER" ]; then
            echo "heavy shard '${{ matrix.name }}' DEMOTED off merge_group (sq-6vshe.6):"
            echo "  deterministic single-crate recall gate — no cross-PR interaction;"
            echo "  full form runs at PR level + push-to-main. Reporting success."
            exit 0
          fi
          # [FABLE-5] Draft-tier CI: ALSO demote the heavy recall shards on DRAFT
          # pull_request heads (docs/branch-protection.md §Draft-tier CI). Safe for
          # the same reason as the merge_group demotion above — deterministic
          # single-crate gates — plus the draft-tier invariant: un-drafting fires
          # ready_for_review, which re-runs this job at FULL tier on the same head
          # SHA, and a draft-tier gate result can never admit a PR to the merge
          # queue (scripts/ci_summary_gate.py refuses it). Bulk shards are NEVER
          # demoted (SHARD_FILTER is empty there); non-draft PRs and push-to-main
          # keep the full form.
          if [ "$IS_DRAFT_PR" = "true" ] && [ -n "$SHARD_FILTER" ]; then
            echo "heavy shard '${{ matrix.name }}' DEMOTED on this DRAFT head (draft-tier CI):"
            echo "  the full form re-runs at ready_for_review + push-to-main; a draft-tier"
            echo "  gate result can never admit a PR to the merge queue. Reporting success."
            exit 0
          fi
          # [FABLE-5] sq-fmx4u.3 (design §5.2): single-crate shard skip guard.
          # FAIL-CLOSED: only the exact mode 'selected' AND a non-empty SHARD_CRATE
          # AND a definite non-membership ('"<crate>"' absent from the affected
          # JSON — the quote delimiters prevent substring-crate collisions) can
          # skip; empty/missing selection outputs always fall through to a run.
          if [ "$SELECT_MODE" = "selected" ] && [ -n "$SHARD_CRATE" ]; then
            case "$SELECT_AFFECTED" in
              *"\"$SHARD_CRATE\""*) : ;;  # in the affected closure -> run the shard
              *)
                echo "shard '${{ matrix.name }}' SKIPPED by change-based selection:"
                echo "  $SHARD_CRATE is not in the affected closure $SELECT_AFFECTED"
                exit 0
                ;;
            esac
          fi
          common=(--archive-file nextest.tar.zst --workspace-remap . \
                  --extract-to . --extract-overwrite --profile ci)
          if [ -n "${{ matrix.filter }}" ]; then
            # Dedicated heavy shard: intersect HEAVY with this shard's single test so
            # the shard's set is provably a SUBSET of HEAVY (belt-and-braces: if the
            # test is ever renamed in only one place, the shard runs empty rather than
            # silently re-including it in bulk).
            args=("${common[@]}" -E '( ${{ env.HEAVY }} ) & ( ${{ matrix.filter }} )')
          elif [ "$SELECT_MODE" = "selected" ] && [ -n "$SELECT_FILTERSET" ]; then
            # [FABLE-5] sq-fmx4u.3: bulk shard under ENFORCED selection — NARROW
            # (never skip) the cross-crate partition to the affected closure
            # (design §5.2): intersect the not-heavy set with the package()
            # filterset. The count partition applies AFTER filtering, so the three
            # bulk shards still partition the narrowed set exactly. A package()
            # naming no archived package fails loud (nextest errors), so a stale
            # filterset cannot silently select nothing; --no-tests=pass is needed
            # because a legitimately-narrowed shard CAN match zero tests (e.g. an
            # affected crate whose only tests are heavy/feature-gated) — full and
            # shadow runs keep the strict no-tests-is-an-error behaviour.
            args=("${common[@]}" --no-tests=pass --partition ${{ matrix.partition }} \
                  -E "( not ( $HEAVY ) ) & ( $SELECT_FILTERSET )")
          else
            # Bulk shard: everything that is NOT a known-heavy test, count-partitioned.
            args=("${common[@]}" --partition ${{ matrix.partition }} -E 'not ( ${{ env.HEAVY }} )')
          fi
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::nextest shard '${{ matrix.name }}' — attempt $attempt/$MAX_ATTEMPTS"
            # Capture the exit code EXPLICITLY. `cargo … || rc=$?` is `set -e`-safe (the
            # `||` makes the failure non-fatal) AND captures nextest's REAL exit code —
            # unlike `if cargo …; then`, where `$?` after the `if` is the `if` statement's
            # own status (always 0) and a genuine failure would silently exit 0, wrongly
            # passing the gate. `rc` is reset to 0 each attempt before the run.
            rc=0
            cargo nextest run "${args[@]}" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "shard '${{ matrix.name }}' passed on attempt $attempt"
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::shard '${{ matrix.name }}' failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient."
              exit "$rc"
            fi
            echo "::warning::shard '${{ matrix.name }}' attempt $attempt failed (exit $rc) — reclaiming disk and retrying once (sq-c76x transient self-heal)."
            # Reclaim disk again in case the first attempt was a `No space left` race
            # that left partial extraction/diagnostics behind; the script is best-effort.
            ./scripts/ci-free-disk.sh || true
            attempt=$((attempt + 1))
          done

  # [OPUS-4.8] sq-6vshe.6 (research/ci-structural-speedup.md §7, round 2) — the
  # DEMOTED-LANE SAFETY NET for the two heavy recall shards demoted off merge_group.
  # The heavy shards' FULL FORM runs at PR level AND on push-to-main (in `test` above).
  # This tiny job is the "cannot silently rot" backstop mandated by the demotion
  # protocol (§7): if a heavy recall shard FAILS on the canonical push-to-main build —
  # the exact regression a merge_group run no longer catches — it auto-files a P1 bead +
  # a deduped GitHub issue naming the lane + run, via scripts/ci-file-demoted-lane-
  # failure.py (the generic filer the fuzz demotion already uses). It runs ONLY on
  # push-to-main failure, and files ONLY when a job named `test (load-aware shard heavy-…)`
  # is the one that failed (a bulk-shard failure is a normal red main build, not a
  # demoted-lane finding). It is a SEPARATE job so the write scope stays off the 5-shard
  # `test` matrix — least-privilege, matching the fuzz/differential filer precedent.
  heavy-recall-demoted-filer:
    name: heavy-recall demoted-lane safety-net (push-to-main)
    needs: [changes, test]
    # push-to-main only, and only when `test` did not succeed. `always()` so this runs
    # despite the failed `needs`; the body then confirms a HEAVY shard was the culprit.
    if: >-
      always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result != 'success' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    # Scoped write: append the bead + best-effort push (contents), file/comment the issue
    # (issues), read this run's job list to detect which shard failed (actions).
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect a failed heavy recall shard in this run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # List THIS workflow-run's jobs and find a FAILED heavy shard by name. The
          # heavy shards are the only jobs named "test (load-aware shard heavy-…)".
          failed="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | select(.name | test("test \\(load-aware shard heavy-")) | .name' \
            | head -n1 || true)"
          if [ -z "$failed" ]; then
            echo "No heavy recall shard failed in this run (only bulk/other legs) — nothing to file."
            echo "file=false" >> "$GITHUB_OUTPUT"
          else
            echo "Failed heavy shard detected: $failed"
            echo "file=true" >> "$GITHUB_OUTPUT"
            echo "shard_name=$failed" >> "$GITHUB_OUTPUT"
          fi
      - name: File the demoted-lane P1 bead + issue
        if: steps.detect.outputs.file == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHARD_NAME: ${{ steps.detect.outputs.shard_name }}
        run: |
          set -euo pipefail
          # Self-test the filer first (hermetic; no gh, no writes) so a script regression
          # is caught here, not silently.
          python3 scripts/ci-file-demoted-lane-failure.py --self-test
          python3 scripts/ci-file-demoted-lane-failure.py \
            --lane "heavy-recall-vectors" \
            --bead-prefix "hr" \
            --full-form "sparq-vectors heavy recall shards on push-to-main ($SHARD_NAME)" \
            --per-pr-form "runs at PR level; demoted off merge_group (sq-6vshe.6)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Commit + push the auto-filed bead (best-effort)
        if: steps.detect.outputs.file == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          if git diff --quiet -- .beads/issues.jsonl; then
            echo "no bead appended (dedupe hit) — nothing to push."
            exit 0
          fi
          git config user.name "sparq-ci[bot]"
          git config user.email "sparq-ci@users.noreply.github.com"
          git add .beads/issues.jsonl
          git commit -m "chore(ci): auto-file demoted heavy-recall lane failure (sq-6vshe.6). [OPUS-4.8]"
          push_rc=0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || push_rc=$?
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=demoted-lane bead push declined::Could not push the auto-filed bead to protected main (git push exit ${push_rc}; likely GH013 ruleset rejection). The GitHub issue filed in the previous step is the durable record; the orchestrator beads it on the next issue sweep."
          else
            echo "pushed the demoted-lane bead to main."
          fi

  wasm:
    name: wasm build (sparq-wasm + sparq-reason-wasm + sparq-rsp-wasm + sparq-text-wasm + sparq-shacl-wasm + sparq-solid)
    # [OPUS-4.8] sq-fmx4u.6 (design §5.2, phase 2): scope the wasm bundle build by
    # the crate closure it exercises. The job builds every browser bundle it names
    # (sparq-wasm/-reason-wasm/-rsp-wasm/-text-wasm/-shacl-wasm + sparq-introspect +
    # sparq-solid); it is affected iff any of those is in the affected reverse-dep
    # closure (single source of truth: `_LANE_SEEDS["wasm"]` in scripts/ci_select.py,
    # pinned by scripts/tests/test_ci_select_wiring.py). Non-matrix job => the
    # job-level `if:` can read needs.select.outputs. FAIL-CLOSED: the existing
    # rust_changed path-filter still gates first, then the `mode != 'selected'`
    # disjunct means an empty/missing selection output RUNS the lane; a
    # selection-skipped job reports `skipped` (= gate-satisfied, no per-leg name is
    # required — bead sq-fmx4u.4). Schedule/push carry no PR diff => mode=full =>
    # the lane runs (nightly full-matrix backstop, design §6.1).
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-wasm"') ||
       contains(needs.select.outputs.affected, '"sparq-reason-wasm"') ||
       contains(needs.select.outputs.affected, '"sparq-rsp-wasm"') ||
       contains(needs.select.outputs.affected, '"sparq-text-wasm"') ||
       contains(needs.select.outputs.affected, '"sparq-shacl-wasm"') ||
       contains(needs.select.outputs.affected, '"sparq-introspect"') ||
       contains(needs.select.outputs.affected, '"sparq-solid"') ||
       contains(needs.select.outputs.affected, '"sparq-vectors"'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build sparq-wasm for the browser target
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown
      # [OPUS-4.8] sq-yqi1 (#162): also build WITH the opt-in `shacl` feature so the
      # SHACL `Store::validate(...)` binding (and its wasm32 sparq-shacl/sparq-engine
      # graph) is gate-protected — it must keep compiling to wasm.
      - name: Build sparq-wasm for the browser target (shacl feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features shacl
      # [OPUS-4.8] sq-085p follow-up: clippy AGAINST the wasm32 target (the target is
      # already installed for this job). The native `lint` job's `clippy --all-targets`
      # compiles sparq-wasm for the HOST triple, so it never sees wasm32-cfg'd code paths
      # and misses wasm-target-only lints — e.g. the `needless_update` just fixed. -D
      # warnings makes those a hard failure here, where the native clippy can't reach them.
      - name: clippy (wasm32 target, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      # [OPUS-4.8] sq-yqi1 (#162): clippy the shacl-feature surface on wasm32 too.
      - name: clippy (wasm32 target, shacl feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features shacl -- -D warnings
      # [OPUS-4.8] sq-dvyi: also build + clippy WITH the opt-in `jsonld` feature (the
      # site REPL's JSON-LD upload/URL path) so the oxjsonld-linked surface is
      # gate-protected on wasm32. The DEFAULT bundle stays JSON-LD-free (perf floor).
      # The site builds `shacl,jsonld` together, so the combined feature set is built too.
      - name: Build sparq-wasm for the browser target (jsonld feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features jsonld
      - name: Build sparq-wasm for the browser target (shacl + jsonld, the site bundle)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features shacl,jsonld
      - name: clippy (wasm32 target, jsonld feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features jsonld -- -D warnings
      # [SONNET-4.6] sq-yz27r (#3251): also build + clippy WITH the opt-in
      # `jsonld-contexts` feature (the `Store::loadJsonLdWithContexts` binding, which
      # installs an oxjsonld LoadDocumentCallback over a host-supplied context map so a
      # VC naming its `@context` by URL parses in-tab). It links `oxjsonld` DIRECTLY
      # rather than only through sparq-core, so the wasm32 build of that surface needs
      # its own gate step. NOT in the published bundle (build:wasm) yet; the DEFAULT
      # bundle stays byte-identical (module is fully cfg'd out).
      - name: Build sparq-wasm for the browser target (jsonld-contexts feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features jsonld-contexts
      - name: clippy (wasm32 target, jsonld-contexts feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features jsonld-contexts -- -D warnings
      # [FABLE-5] sq-586sh: also build + clippy WITH the opt-in `policy` feature (the
      # sparq-policy ODRL-evaluator wasm32 probe, #890 ask A) so the wasm32 compat this
      # probe established is gate-protected. NOT in the published bundle (build:wasm) —
      # the full JS API awaits a maintainer public-contract decision. The DEFAULT
      # bundle stays policy-free (perf floor byte-identical).
      - name: Build sparq-wasm for the browser target (policy feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features policy
      - name: clippy (wasm32 target, policy feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features policy -- -D warnings
      # [FABLE-5] sq-ixc3.19: also build + clippy WITH the opt-in `explain-json` feature
      # (the structured `Store::explainPlanJson` / `explainPlanAnalyzeJson` plan-tree
      # bindings the GUI plan explorer renders) so the surface is gate-protected. IN the
      # published bundle (js `build:wasm` enables it); the DEFAULT bundle stays
      # plan-tree-free (perf floor byte-identical — module declared at end-of-file).
      - name: Build sparq-wasm for the browser target (explain-json feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features explain-json
      - name: clippy (wasm32 target, explain-json feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features explain-json -- -D warnings
      # [SONNET-4.6] #3546: also build + clippy WITH the opt-in `native-ttl` feature (the
      # sparq-core native byte-level Turtle parser sq-3ul2n.11/#2752 routes the wasm SERIAL
      # Turtle load path through). IN the published bundle (js `build:wasm` enables it).
      # This leg checks `native-ttl` STANDALONE, exactly like the per-feature legs above;
      # the shipped COMBINATION is compiled by the published-bundle leg below. The DEFAULT
      # bundle stays on oxttl (perf floor byte-identical).
      - name: Build sparq-wasm for the browser target (native-ttl feature)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features native-ttl
      - name: clippy (wasm32 target, native-ttl feature, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features native-ttl -- -D warnings
      # [SONNET-4.6] #3546: the PUBLISHED bundle's feature COMBINATION. The legs above
      # compile each opt-in feature standalone (plus the two-feature `shacl,jsonld` site
      # bundle), so a feature INTERACTION across the wider shipped set is invisible to
      # them. That set IS built elsewhere — `npm run build:wasm` in gui.yml and
      # nightly-full-sweep.yml — but gui.yml is path-scoped to gui/**, packages/
      # sparq-client/**, site/**, js/** and package-lock.json, so a RUST-only PR that
      # breaks the combination goes green here and is caught post-merge by the nightly at
      # best. This leg closes that PR-time hole. The list is READ from js/package.json's
      # `build:wasm` script — the single source of truth for what is shipped — rather than
      # duplicated here, so adding a feature to the published bundle can never silently
      # escape this gate. The DEFAULT (lean) bundle is untouched: this is an additional
      # feature state, not a change to the perf-gate baseline.
      - name: Resolve the published wasm feature list (js/package.json build:wasm)
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import re
          import sys

          script = json.load(open("js/package.json"))["scripts"]["build:wasm"]
          match = re.search(r"--features\s+(\S+)", script)
          if match is None:
              sys.exit("js/package.json build:wasm carries no --features list")
          print("PUBLISHED_WASM_FEATURES=" + match.group(1))
          PY
      - name: Build sparq-wasm for the browser target (published bundle features)
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown --features "$PUBLISHED_WASM_FEATURES"
      - name: clippy (wasm32 target, published bundle features, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets --features "$PUBLISHED_WASM_FEATURES" -- -D warnings
      # [OPUS-4.8] sq-6qw3 (W-reason): the tier-b forward-chaining inference bundle. Build +
      # clippy it on wasm32 in BOTH feature states (default + the opt-in `why()` proof-tree
      # `explain` feature) so the reason bundle is gate-protected exactly like sparq-wasm.
      - name: Build sparq-reason-wasm for the browser target
        run: cargo build -p sparq-reason-wasm --target wasm32-unknown-unknown
      - name: Build sparq-reason-wasm for the browser target (explain feature)
        run: cargo build -p sparq-reason-wasm --target wasm32-unknown-unknown --features explain
      - name: clippy (wasm32 target, sparq-reason-wasm, deny warnings)
        run: cargo clippy -p sparq-reason-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: clippy (wasm32 target, sparq-reason-wasm, explain feature, deny warnings)
        run: cargo clippy -p sparq-reason-wasm --target wasm32-unknown-unknown --all-targets --features explain -- -D warnings
      # [OPUS-4.8] sq-nzcb (W-rsp): the tier-b windowed RSP-QL stream bundle. Build + clippy
      # it on wasm32 so the streaming bundle is gate-protected exactly like the others. It
      # has no opt-in features (a single default state), so one build + one clippy suffice.
      - name: Build sparq-rsp-wasm for the browser target
        run: cargo build -p sparq-rsp-wasm --target wasm32-unknown-unknown
      - name: clippy (wasm32 target, sparq-rsp-wasm, deny warnings)
        run: cargo clippy -p sparq-rsp-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      # [OPUS-4.8] sq-jbe6 (W-text): the tier-b BM25 full-text bundle. Build + clippy it on
      # wasm32 so the text bundle (sparq-text `engine` feature + the `text:` magic-predicate
      # rewrite + sparq-engine) is gate-protected exactly like the other wasm bundles. It has
      # a single feature state (no opt-in features), so one build + one clippy invocation.
      - name: Build sparq-text-wasm for the browser target
        run: cargo build -p sparq-text-wasm --target wasm32-unknown-unknown
      - name: clippy (wasm32 target, sparq-text-wasm, deny warnings)
        run: cargo clippy -p sparq-text-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      # [OPUS-4.8] sq-lfmf (W-shacl): the tier-b SHACL validation bundle. Build + clippy it
      # on wasm32 in EVERY feature state (default SHACL Core + SHACL-SPARQL, the opt-in
      # `shacl-af` sh:rule feature, the opt-in `stateful` pre-parsed-handle feature, and the
      # combined `shacl-af`+`stateful` state via --all-features) so the SHACL bundle
      # (sparq-shacl + its no-default-features sparq-engine/sparq-core wasm32 graph,
      # carrying the pure-Rust `sh:pattern` regex) is gate-protected exactly like the other
      # wasm bundles.
      - name: Build sparq-shacl-wasm for the browser target
        run: cargo build -p sparq-shacl-wasm --target wasm32-unknown-unknown
      - name: Build sparq-shacl-wasm for the browser target (shacl-af feature)
        run: cargo build -p sparq-shacl-wasm --target wasm32-unknown-unknown --features shacl-af
      # [FABLE-5] sq-01xlp: the opt-in `stateful` (pre-parsed ParsedGraph handle) state.
      - name: Build sparq-shacl-wasm for the browser target (stateful feature)
        run: cargo build -p sparq-shacl-wasm --target wasm32-unknown-unknown --features stateful
      # [FABLE-5] sq-01xlp: the combined state (`shacl-af`+`stateful` — both opt-in features
      # can be enabled together, and stateful validation inherits sh:rule behaviour).
      - name: Build sparq-shacl-wasm for the browser target (all features)
        run: cargo build -p sparq-shacl-wasm --target wasm32-unknown-unknown --all-features
      - name: clippy (wasm32 target, sparq-shacl-wasm, deny warnings)
        run: cargo clippy -p sparq-shacl-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: clippy (wasm32 target, sparq-shacl-wasm, shacl-af feature, deny warnings)
        run: cargo clippy -p sparq-shacl-wasm --target wasm32-unknown-unknown --all-targets --features shacl-af -- -D warnings
      - name: clippy (wasm32 target, sparq-shacl-wasm, stateful feature, deny warnings)
        run: cargo clippy -p sparq-shacl-wasm --target wasm32-unknown-unknown --all-targets --features stateful -- -D warnings
      - name: clippy (wasm32 target, sparq-shacl-wasm, all features, deny warnings)
        run: cargo clippy -p sparq-shacl-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings
      - name: Guard the wasm dependency graph (no native-only deps)
        # [OPUS-4.8] sq-9qz6: enforce the "flate2/zstd/rayon/sparq-parse must never
        # enter the wasm graph" invariant (was comment-only) — fails if a native-only
        # dep leaks into a wasm bundle's wasm32 graph (bundle bloat / broken browser build).
        # [OPUS-4.8] sq-yqi1: guard runs against the DEFAULT graph (SHACL is opt-in, so
        # the default bundle stays SHACL-free); the shacl-feature graph is verified clean
        # locally and the wasm32 build above proves it links.
        # [OPUS-4.8] sq-6qw3: the guard now also scans sparq-reason-wasm's default graph
        # (regex is allowed there — it's pure-Rust + wasm-portable, not a native-only dep).
        # [OPUS-4.8] sq-nzcb: and sparq-rsp-wasm's default graph (among the leanest —
        # no regex; sparq-rsp + its engine/core are no-default-features).
        # [OPUS-4.8] sq-jbe6: it now also scans sparq-text-wasm (unicode-segmentation is
        # pure-Rust + wasm-portable; the guard catches any native-only dep leaking in).
        # [OPUS-4.8] sq-lfmf: and sparq-shacl-wasm (regex is allowed there — pure-Rust +
        # wasm-portable, the sh:pattern constraint; the guard catches native-only leaks).
        run: ./scripts/wasm-deps-guard.sh
      # [OPUS-4.8] Headless wasm tests of the REAL #[wasm_bindgen] exports
      # (crates/sparq-wasm/tests/web.rs). `cargo build --target wasm32` above never
      # RUNS the exported API (JsError/serialisation across the JS boundary), so the
      # web.rs #[wasm_bindgen_test]s run via wasm-pack in the Node executor — closing
      # exactly that gap. Verified locally: 20 passed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # [OPUS-5] #5771: this pin must stay EQUAL to the one the `js` lane
      # (.github/workflows/js.yml) builds + packs the @sparq-org/sparq wasm artifact with.
      # It was v0.13.1 here while js.yml pinned v0.15.0, so any wasm-pack/wasm-bindgen
      # behaviour change between those releases was exercised only in that BUILD lane
      # and never here — in the lane that actually RUNS the headless suites. Unified on
      # js.yml's v0.15.0. The equality (not the value) is enforced by
      # scripts/tests/test_js_wasm_pack_install.py::WasmPackVersionUnified, so bump
      # BOTH lanes together or that test reds.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0
      - name: Headless wasm tests (wasm-pack test --node)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node
      # [OPUS-4.8] sq-yqi1 (#162): run the headless wasm tests WITH the shacl feature
      # so the real exported `Store::validate(...)` binding is exercised in a genuine
      # wasm runtime (conforming + violating reports + the JsError parse-error arm).
      - name: Headless wasm tests (wasm-pack test --node, shacl feature)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node --features shacl
      # [OPUS-4.8] sq-dvyi: run the headless wasm tests WITH the jsonld feature so the
      # real exported `Store::load`/`loadDataset` JSON-LD path (folded + `@graph` named
      # graph queryable) is exercised in a genuine wasm runtime — the site REPL's path.
      - name: Headless wasm tests (wasm-pack test --node, jsonld feature)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node --features jsonld
      # [SONNET-4.6] sq-yz27r (#3251): run them WITH `jsonld-contexts` so the real
      # exported `Store::loadJsonLdWithContexts` is driven in a genuine wasm runtime —
      # the `js_sys::Array` `[[url, documentText], …]` argument-reading path and the
      # `JsError` fail-closed arm are wasm-bindgen imports the native tests cannot reach.
      - name: Headless wasm tests (wasm-pack test --node, jsonld-contexts feature)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node --features jsonld-contexts
      # [OPUS-4.8] sq-6qw3 (W-reason): drive the REAL #[wasm_bindgen] Reasoner exports
      # (crates/sparq-reason-wasm/tests/web.rs) in a genuine wasm runtime, in BOTH feature
      # states — the default suite, then with the opt-in `explain` feature so the `why()`
      # proof-tree binding is exercised across the JS boundary too.
      - name: Headless wasm tests (sparq-reason-wasm, wasm-pack test --node)
        working-directory: crates/sparq-reason-wasm
        run: wasm-pack test --node
      - name: Headless wasm tests (sparq-reason-wasm, wasm-pack test --node, explain feature)
        working-directory: crates/sparq-reason-wasm
        run: wasm-pack test --node --features explain
      # [FABLE-5] sq-ixc3.19: run the headless wasm tests WITH the explain-json feature
      # so the real exported `Store::explainPlanJson` / `explainPlanAnalyzeJson` bindings
      # (the structured plan tree the GUI plan explorer renders — including the wasm32
      # `nanos: 0` no-monotonic-clock caveat + the JsError arms) are exercised in a
      # genuine wasm runtime.
      - name: Headless wasm tests (wasm-pack test --node, explain-json feature)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node --features explain-json
      # [OPUS-4.8] sq-nzcb (W-rsp): drive the REAL #[wasm_bindgen] Rsp exports
      # (crates/sparq-rsp-wasm/tests/web.rs) in a genuine wasm runtime — windowed continuous
      # SELECT + SPARQL-1.1-JSON serialisation across the JS boundary, which `cargo build
      # --target wasm32` above never RUNS. Single feature state (the bundle has no features).
      - name: Headless wasm tests (sparq-rsp-wasm, wasm-pack test --node)
        working-directory: crates/sparq-rsp-wasm
        run: wasm-pack test --node
      # [OPUS-4.8] sq-jbe6 (W-text): drive the REAL #[wasm_bindgen] TextSearch exports
      # (crates/sparq-text-wasm/tests/web.rs) in a genuine wasm runtime — the index build +
      # `text:` rewrite + SPARQL-JSON serialisation across the JS boundary, which a
      # `cargo build --target wasm32` never runs.
      - name: Headless wasm tests (sparq-text-wasm, wasm-pack test --node)
        working-directory: crates/sparq-text-wasm
        run: wasm-pack test --node
      # [OPUS-4.8] sq-lfmf (W-shacl): drive the REAL #[wasm_bindgen] Validator exports
      # (crates/sparq-shacl-wasm/tests/web.rs) in a genuine wasm runtime — SHACL validation +
      # the JSON / Turtle / text report serialisation across the JS boundary, which a
      # `cargo build --target wasm32` above never RUNS. Every feature state: default, the
      # opt-in `shacl-af` (sh:rule) feature, the opt-in `stateful` feature, then the
      # combined `shacl-af`+`stateful` state (--all-features).
      - name: Headless wasm tests (sparq-shacl-wasm, wasm-pack test --node)
        working-directory: crates/sparq-shacl-wasm
        run: wasm-pack test --node
      - name: Headless wasm tests (sparq-shacl-wasm, wasm-pack test --node, shacl-af feature)
        working-directory: crates/sparq-shacl-wasm
        run: wasm-pack test --node --features shacl-af
      # [FABLE-5] sq-01xlp: drive the opt-in pre-parsed `ParsedGraph` exports (incl. the
      # JsError-returning `parse` the native suite cannot run) in a real wasm runtime.
      - name: Headless wasm tests (sparq-shacl-wasm, wasm-pack test --node, stateful feature)
        working-directory: crates/sparq-shacl-wasm
        run: wasm-pack test --node --features stateful
      - name: Headless wasm tests (sparq-shacl-wasm, wasm-pack test --node, all features)
        working-directory: crates/sparq-shacl-wasm
        run: wasm-pack test --node --all-features
      # [OPUS-4.8] sq-aq5: sparq-introspect wasm-safety. The crate is pure sorted scans over
      # sparq-core's public read API (no threads, no syscalls, no wall clock) so it is a
      # tier-b browser surface for in-tab schema cards. It is NOT a #[wasm_bindgen] BUNDLE
      # crate (a plain library, rlib-only), so there is no `cargo build -p` browser-bundle
      # step — instead the headless `tests/wasm.rs` build+RUN below is the smoke gate: it
      # compiles the whole introspection pipeline (build + to_json + to_text_summary +
      # to_void(_with_cs) + characteristic_set_ids) to wasm32 AND runs it in a genuine wasm
      # runtime. On wasm the crate takes sparq-core without default features (drops native-only
      # rayon `parallel`, which introspect never uses). clippy on wasm32 first, deny warnings —
      # the native lint job compiles for the HOST triple and never sees wasm32-cfg'd paths.
      - name: clippy (wasm32 target, sparq-introspect, deny warnings)
        run: cargo clippy -p sparq-introspect --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Headless wasm tests (sparq-introspect, wasm-pack test --node)
        working-directory: crates/sparq-introspect
        run: wasm-pack test --node
      # Bundle-size MEASUREMENT (informational, not a gated baseline — introspect is not a
      # shipped bundle in any wasm graph; the bead asked to verify the size is trivial, not to
      # ratchet it). Reports the release wasm32 byte size of the introspect test image to the
      # job summary so a future bloat is visible in the log.
      - name: Measure sparq-introspect wasm bundle size (informational)
        run: ./scripts/introspect-wasm-size.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # [OPUS-4.8] sq-7agop: the opt-in Solid access-control layer compiles to wasm32 AND
      # now RUNS there. `materialize_wac`/`materialize_acp` previously called
      # `std::time::Instant::now()` unconditionally (for the informational `stats.millis`),
      # which PANICS on wasm32-unknown-unknown (no monotonic clock) — the crate compiled
      # but TRAPPED at runtime. The timing is now cfg-gated off on wasm32 (reports `0.0`).
      # clippy on the wasm32 target first (the native lint job compiles for the HOST triple
      # and never sees wasm32-cfg'd paths), then the headless `wasm-pack test --node` smoke
      # (crates/sparq-solid/tests/wasm_materialize.rs) drives the REAL materialize path in a
      # genuine wasm runtime so the trap can never silently regress — `cargo build --target
      # wasm32` alone never RUNS materialize. The crate's transitive oxrdf→rand→getrandom
      # uses the wasm_js backend selected by .cargo/config.toml.
      - name: clippy (wasm32 target, sparq-solid, deny warnings)
        run: cargo clippy -p sparq-solid --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Headless wasm tests (sparq-solid materialize, wasm-pack test --node)
        run: wasm-pack test --node crates/sparq-solid
      # [FABLE-5] sq-98c: sparq-vectors wasm-safety — memmap2 is target-gated out of wasm32
      # builds (`[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`), so the crate must
      # keep compiling to wasm32 with the default features and its wasm graph must stay
      # memmap2-free (the bead's acceptance criterion, asserted below with `cargo tree`).
      # `open_from_bytes` (`.spqv` AND `.spqg`) is the filesystem-less read path there. clippy
      # is LIB-ONLY (no --all-targets): the dev-deps pull sparq-core's `mmap` feature, whose
      # wasm32 lint surface is out of this lane's scope — the crate's own wasm-cfg'd code is
      # fully covered by the lib check.
      - name: Build sparq-vectors for the wasm32 target
        run: cargo build -p sparq-vectors --target wasm32-unknown-unknown
      - name: Assert memmap2 is absent from the sparq-vectors wasm32 graph
        run: |
          if cargo tree -p sparq-vectors --target wasm32-unknown-unknown -e normal | grep -q memmap2; then
            echo "::error::memmap2 leaked into the sparq-vectors wasm32 dependency graph"
            exit 1
          fi
      - name: clippy (wasm32 target, sparq-vectors, deny warnings)
        run: cargo clippy -p sparq-vectors --target wasm32-unknown-unknown -- -D warnings

  # NOTE: sparq-py's pytest suite (incl. the new test_parity.py result-parity +
  # panic-surface tests) is run by the dedicated `python.yml` workflow ("Python
  # bindings"), which builds with the correct --profile python-release (unwinding
  # panics — needed by the panic-surface test). No duplicate job here. [OPUS-4.8]

  lint:
    # [OPUS-4.8] sq-wjth: the display name must NOT contain the words "informational"
    # or "advisory" — the ci-summary gate treats any check whose NAME contains either
    # (case-insensitive) as NON-GATING. clippy here GATES (it's the `-D warnings` hard
    # gate); only the fmt step is non-blocking. So name it "fmt (non-blocking)" to keep
    # the meaning while staying out of the advisory exclusion set. (The collision: the
    # former name "clippy (gate) + fmt (informational)" was wrongly matched by that rule
    # and would have stopped the clippy gate from gating — verified by hand-tracing the
    # jq filter against every check name.)
    name: clippy (gate) + fmt (non-blocking)
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable, rustfmt+clippy)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # GATES: the whole workspace (sparq-py included) is clippy-clean under -D warnings.
      # A new warning — from new code or a Rust-stable bump that adds a lint — fails CI.
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # [OPUS-4.8] sq-4sbk: clippy -D warnings, WORKSPACE-WIDE, with `--all-features` — the
      # clippy sibling of the two-state rustdoc gate below. The default-features clippy above
      # NEVER compiles code inside default-OFF `#[cfg(feature = "…")]` modules (result-cache,
      # txn, vectorized, service, fedplan, fedclient, odrl-bridge, …), so a clippy lint inside
      # an opt-in feature module slips the central gate and only surfaces — if at all — via a
      # feature-matrix.yml leg that happens to enable that exact feature (the legs there clippy
      # per-crate `-p <crate> --features <set>`). This workspace-wide `--all-features` pass
      # catches such lints centrally AND the cross-crate feature-unification interactions that a
      # per-crate `-p` leg structurally cannot see (a default-feature edit that only mis-lints
      # once the unified all-features build turns another crate's feature on). VERIFIED SOUND on
      # main before being made gating (sq-4sbk crux check): the workspace has NO `compile_error!`
      # mutual-exclusion guard and NO `not(feature=…)` *compile-time* assert that breaks under
      # unification — `cargo clippy --workspace --all-targets --all-features -- -D warnings`
      # compiles every opt-in crate (sparq-hdt/-gpu/-py/-fedplan-mpc included) and is CLEAN.
      # The network features (`live`/`embeddings`) only COMPILE reqwest here; no socket is
      # opened (clippy does not run tests), so they are safe in this lint-only pass. Cost: the
      # lint job already builds the workspace twice over (default clippy + two rustdoc passes);
      # this adds only the off-by-default feature code on a warm target dir — a modest increment,
      # not a second full build (the bulk of the dependency + first-party graph is already
      # compiled by the default-features clippy above).
      - name: clippy (deny warnings, workspace — all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # [OPUS-4.8] sq-8gsv: rustdoc -D warnings, WORKSPACE-WIDE. A broken/private intra-doc
      # link (e.g. a public item linking to a crate-private const/fn, or an unresolved
      # `[`Foo`]` that renders as literal text) is a rustdoc warning — NOT a clippy/build
      # warning — so it slips past every other gate here and mis-renders the published docs.
      # This was previously scoped to sparq-solid (sq-z1rm) and sparq-mpc (sq-h1w2) only,
      # because the rest of the workspace carried ~174 pre-existing intra-doc-link warnings
      # across ~20 crates. sq-8gsv cleared that backlog, so the gate now covers the WHOLE
      # doc surface: any new public item that links to a private/unresolved one fails CI.
      # Two feature states cover the feature-gated doc surface (e.g. sparq-solid's
      # `odrl-bridge`/`count-enforcement` modules, sparq-mpc's `insecure-test-rng`,
      # sparq-prov's `reason` bridge): default features, then `--all-features`.
      - name: rustdoc (deny warnings, workspace — default features)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: rustdoc (deny warnings, workspace — all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      # [OPUS-4.8] sq-hqmm: invoke the standalone bench/dict (dict-baseline) selftest from a CI
      # lane. bench/dict carries its OWN `[workspace]` table (the same isolation pattern as
      # bench/parse and bench/serve), so the `cargo clippy --workspace` + the workspace nextest
      # archive above NEVER reach it — its structural invariants (every dictionary term classified
      # exactly once, `Dict::into_blob` preserving the term count, positive footprints) live ONLY in
      # its `selftest` subcommand and were unchecked by any lane. This step clippy-gates the crate
      # (under -D warnings, since the workspace clippy can't) and runs `dict-baseline selftest` so a
      # harness regression (a composition miscount, an into_blob that drops terms) fails CI. It is
      # in-process + dataset-free + makes no wall-clock claim, so it is deterministic in CI (the
      # README documents `selftest` as the CI-runnable check; this is the lane that runs it). It is a
      # SEPARATE workspace (own target dir), so sparq-core compiles once more here in debug — but the
      # registry/git deps come warm from rust-cache, and a debug build keeps the added cost small.
      - name: bench/dict standalone selftest (clippy + invariant checks)
        run: |
          cargo clippy --manifest-path bench/dict/Cargo.toml --all-targets -- -D warnings
          cargo run --manifest-path bench/dict/Cargo.toml -- selftest
      # Informational until the deferred `cargo fmt --all` reformat lands (see rustfmt.toml).
      # The formatter VERSION is pinned by rust-toolchain.toml (channel + the `rustfmt`
      # component), so this check is reproducible in a local checkout even while it is
      # non-blocking — issue #2360 reported the opposite, a workspace-wide failure on
      # unchanged files under an ambient rustfmt. Echo the version so any future
      # disagreement between this log and a contributor's box names its own cause.
      - name: rustfmt (informational)
        run: |
          cargo fmt --version
          cargo fmt --all --check
        continue-on-error: true

  msrv:
    # [OPUS-4.8] sq-ucwf: ENFORCE the declared MSRV. The workspace pins
    # `rust-version = "1.88"` in the root Cargo.toml ([workspace.package]); without a
    # job that actually compiles on that toolchain the floor is just documentation — a
    # new use of a >floor stdlib/lang feature would silently raise the real MSRV. This
    # builds the whole workspace on the pinned floor toolchain so the declared floor is a
    # checked invariant, GATING.
    #
    # [OPUS-4.8] (sq-qmth) Floor BUMPED 1.85 -> 1.88. Upstream-driven, verified
    # empirically (cargo +1.87/+1.88 check, this exact --exclude scope): on 1.87 the
    # resolver rejects ONLY `geo@0.33.1 requires rustc 1.88` (a transitive dep of
    # sparq-geo); the released oxigraph parser stack (oxrdf/oxttl/oxrdfio/spargebra/…)
    # needs 1.87; on 1.88 the whole MSRV-scope workspace builds clean. So 1.88 is the
    # true minimal floor — not an over-bump. Keep this pin == root rust-version.
    #
    # Two crates are excluded, each for a concrete reason:
    #   - sparq-py: pyo3/maturin extension module (excluded from native jobs throughout
    #     this workflow; built by python.yml with the correct profile).
    #   - sparq-hdt: declares its own `rust-version = "1.87"` for the wrapped `hdt` crate
    #     (see crates/sparq-hdt/Cargo.toml). Now AT/BELOW the 1.88 floor, so its
    #     exclusion is no longer load-bearing, but kept to decouple sparq-hdt from the
    #     workspace-floor pin.
    # If the root MSRV is bumped, update the `@1.88` toolchain pin below to match.
    name: MSRV check (Rust 1.88, declared floor)
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Clear the workflow-level -fuse-ld=lld for THIS job only: the floor
      # toolchain (1.88) does not supply rustc's ld.lld shim path the way the
      # current preinstalled stable does, and the runner image ships no lld —
      # so on 1.88 the flag dies deterministically ("collect2: cannot find
      # 'ld'", 3/3 on this PR once the gate stopped being vacuous). Plain GNU
      # ld is fine here: this lane is `cargo check` (only build scripts and
      # proc-macros link) and its meaning is the VERSION floor, not link speed.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
      # [OPUS-5] KEEPS THIS GATE NON-VACUOUS UNDER THE ROOT `rust-toolchain.toml`
      # PIN. rustup resolves the toolchain file (precedence 4) ABOVE `rustup
      # default` (precedence 5), so the `rustup default 1.88` below — which was
      # the whole fix for the vacuity described in the step comment — would be
      # SILENTLY OVERRIDDEN by the root pin and this lane would go back to
      # compiling on pinned stable, i.e. vacuous again in exactly the way PR
      # #3511 finding 4 called out. `RUSTUP_TOOLCHAIN` is precedence 2, so it
      # beats the file; setting it at JOB level (rather than `cargo +1.88` at
      # one call site) makes every cargo/rustc in the job — including anything
      # nested — use the floor, and makes `rustup show active-toolchain` print
      # "overridden by environment variable RUSTUP_TOOLCHAIN" so the log states
      # which compiler actually ran. Keep this == the pin below == root
      # Cargo.toml `rust-version`.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (pinned MSRV toolchain 1.88)
        # [FABLE-5] PR #3511 review finding 4: this gate was VACUOUS — the
        # pre-existing step was the SHA-pinned action with a trailing `# 1.88`
        # comment but NO `toolchain:` input (the action's default is `stable`),
        # so the "MSRV check" had been compiling on LATEST STABLE all along; the
        # first CI-economy pass preserved that broken behaviour. FIXED: install
        # the declared floor toolchain and check ON it, so the floor is a checked
        # invariant again (this lane's entire meaning IS the version — it is the
        # one stable-family lane that must never ride the runner image's rolling
        # preinstalled stable). `--profile minimal` = rustc+cargo only; no clippy
        # or docs run on the floor toolchain. COMPILER POLICY, explicit: every
        # other stable lane deliberately uses the image's preinstalled stable
        # (rolling; may briefly lag a fresh release during runner-image rollout —
        # an accepted CI-economy tradeoff, see the `lint` job's note), while THIS
        # lane pins the exact floor. Keep the pin == root Cargo.toml
        # rust-version (sq-qmth).
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the declared MSRV
        # [SONNET-4.6] Test targets must compile at the declared floor too; they can
        # otherwise hide newer temporary-lifetime-extension behavior from this gate.
        #
        # [OPUS-5] NON-VACUITY ASSERTION, deliberately in the SAME `run:` block as the
        # compile it guards. This lane's entire meaning is the VERSION, so "which
        # compiler ran" must be a CHECKED fact, not a logged one. Before this, the only
        # thing standing between the gate and silent vacuity was the job-level
        # `RUSTUP_TOOLCHAIN` above: delete that one line and the root
        # `rust-toolchain.toml` (precedence 4) outranks the `rustup default 1.88`
        # (precedence 5) in the step above, the lane compiles the workspace on pinned
        # stable, `rustup show active-toolchain` dutifully PRINTS the wrong answer, and
        # CI stays GREEN — re-arming exactly the vacuity PR #3511 finding 4 fixed.
        #
        # Two design choices, both load-bearing:
        #  * The floor is DERIVED from the root `Cargo.toml` `rust-version` rather than
        #    hardcoded a fourth time, so this also gates the "keep this == root
        #    rust-version" invariant that three comments in this job ask humans to
        #    maintain by hand and nothing enforced. Drift in EITHER direction reds.
        #  * `cargo` is asserted as well as `rustc`: `cargo check` is what actually
        #    resolves the `rust-version` floor, and asserting only `rustc` would miss a
        #    split resolution between the two proxies.
        # Fail-closed throughout: an unreadable/renamed `rust-version`, a missing
        # toolchain, or a `--version` that does not parse all exit non-zero.
        # Same-block placement means no `if:`/step boundary can skip the assertion
        # while still running the compile.
        run: |
          floor="$(sed -n 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$floor" ]; then
            echo "::error::could not read [workspace.package] rust-version from the root Cargo.toml"
            exit 1
          fi
          echo "declared MSRV floor (root Cargo.toml rust-version) = $floor"
          for tool in rustc cargo; do
            ver="$("$tool" --version)" || { echo "::error::$tool --version failed"; exit 1; }
            echo "$tool --version -> $ver"
            case "$ver" in
              "$tool $floor."*|"$tool $floor "*) ;;
              *)
                echo "::error::MSRV gate is NOT on the declared floor $floor — $tool reports '$ver'. This lane must compile ON the floor toolchain or it proves nothing; check the job-level RUSTUP_TOOLCHAIN and the root rust-toolchain.toml pin."
                exit 1
                ;;
            esac
          done
          cargo check --workspace --all-targets --exclude sparq-py --exclude sparq-hdt

  conformance:
    # W3C SPARQL conformance RATCHET (roadmap T13/38). The full 1229-test scope is at
    # 1225 pass + 4 documented divergences / 0 fail / 0 skip — 1229/1229. The 4
    # divergences are expected-results files that are provably wrong against the spec
    # and their own approved siblings (rendered distinctly in the report with full
    # rationale; rdf-tests issues drafted in docs/upstream-proposals.md). The six
    # former parser-posture failures are fixed in the vendored spargebra
    # (vendor/spargebra/SPARQ-PATCHES.md; upstream PRs drafted). This job GATES: a
    # drop below the ratchet count is a conformance regression and fails CI. Never
    # lower the ratchet.
    name: W3C SPARQL conformance (ratchet >= 1229 pass+divergence)
    # [FABLE-5] sq-fmx4u.3: this lane runs `-p sparq-conformance` bins; skip only
    # when ENFORCED selection proves sparq-conformance unaffected (fail-closed:
    # empty/missing outputs or shadow/full mode => run).
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-conformance"'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch W3C test suites (pinned)
        run: ./scripts/fetch-conformance.sh
      - name: Run conformance suites
        # [OPUS-4.8] --bin is REQUIRED: the crate now ships three binaries
        # (sparq-conformance + sparq-inference-conformance + the consolidated
        # sparq-conformance-scoreboard), so a bare `cargo run -p sparq-conformance`
        # is ambiguous and exits 101.
        # [OPUS-4.8] sq-shacl-flake (generalized from #1236): STEP-LEVEL transient
        # self-heal. This `cargo run` WRITES conformance-report.md as a side effect;
        # a transient crates.io download hiccup (`curl failed` mid-fetch) aborts the
        # build BEFORE the report is written, leaving it missing/empty. The separate
        # "Enforce ratchet" step then greps an absent report → PASS='' → TOTAL=0 and
        # mis-reports a phantom "conformance regressed below the ratchet (0 < 1229)"
        # that jammed the merge queue (this exact mode hit #1242). Re-running lets such
        # a transient self-heal. A GENUINE regression still produces a real report and
        # trips the floor honestly in the enforce step — the ratchet is never weakened.
        # Not piped, so the run's own exit code ($?) is authoritative (no PIPESTATUS).
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::W3C SPARQL conformance — attempt $attempt/$MAX_ATTEMPTS"
            rc=0
            cargo run --profile release-fast -p sparq-conformance --bin sparq-conformance || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "W3C SPARQL conformance suites completed on attempt $attempt"
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::W3C SPARQL conformance run failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient. A real regression produces a report and trips the ratchet floor below; a 'curl failed'/download error is an infra flake, not a conformance change."
              exit "$rc"
            fi
            echo "::warning::W3C SPARQL conformance attempt $attempt failed (exit $rc) — retrying once (sq-shacl-flake transient self-heal: most often a transient crates.io download hiccup before the report was written)."
            attempt=$((attempt + 1))
          done
      - name: NT/NQ/TriG syntax ratchets + parser differential gate (sq-tonhr.2)
        # [FABLE-5] sq-tonhr.2 (epic sq-tonhr): the W3C rdf-n-triples / rdf-n-quads /
        # rdf-trig syntax-suite ratchets (floors recorded in the central scoreboard,
        # rise-only) + the candidate-vs-incumbent parser differential gate over the
        # suites' actions and the committed fuzz seed corpus (exact adjudicated
        # divergence set — bead sq-w64x5 — so a new divergence OR silent drift fails).
        # EXPLICIT here (not only in the workspace test shards) because these tests
        # self-skip without the pinned w3c/rdf-tests clone this job just fetched —
        # this is where they run against the real data.
        run: |
          cargo test --profile release-fast -p sparq-conformance \
            --test rdf_line_syntax_ratchet --test parser_differential -- --nocapture
      - name: Consolidated conformance scoreboard (all suites + floors)
        # [OPUS-4.8] sq-ncvq.16: surface the ONE central index of every conformance
        # ratchet across crates (SPARQL + inference + SHACL + GeoSPARQL) at the top
        # of the primary conformance job's summary, then the detailed SPARQL report.
        run: |
          cargo run --profile release-fast -p sparq-conformance --bin sparq-conformance-scoreboard
          cat conformance-scoreboard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize
        run: cat conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1229
          # [OPUS-4.8] sq-shacl-flake (generalized from #1236): distinguish "report
          # never produced" (an infra/build flake aborted the run before
          # conformance-report.md was written) from a GENUINE regression, so a
          # missing/empty report is never mis-reported as "conformance regressed below
          # the ratchet (0 < 1229)" — the exact phantom that jammed the queue (#1242).
          # With the step-level retry above this should not happen, but if it does we
          # fail with an HONEST, distinct diagnostic instead of a false regression.
          if [ ! -s conformance-report.md ] || ! grep -qE '^## Overall' conformance-report.md; then
            echo "::error::SPARQL conformance report is missing/empty — the run produced no '## Overall' section. This is an INFRA/build failure (e.g. a transient crates.io download aborting the run), NOT a conformance regression. Re-run the job; inspect the 'Run conformance suites' step output above."
            exit 1
          fi
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> skip — ...**
          # (group subtotals use the same shape, so parse the line after "## Overall")
          OVERALL=$(grep -A2 '^## Overall' conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-report
          path: conformance-report.md

  shacl-conformance:
    # [OPUS-4.8] W3C SHACL conformance RATCHET (sq-qap0, sq-6glcr). The data-shapes
    # sht:Validate suites run as `cargo test` (the runners live in
    # crates/sparq-shacl/tests/w3c_core.rs + w3c_sparql.rs, each carrying its own
    # pinned pass-count floor); the normal `cargo test --workspace` job runs
    # OFFLINE and the runners self-SKIP when the fixtures are absent, so this
    # dedicated job fetches the pinned suite first (mirroring the fetch-then-run
    # split of the SPARQL/inference jobs above), then runs the runners with
    # --nocapture and re-checks the scoreboard floor here. The runner's internal
    # `assert!(pass >= BASELINE_PASS)` is the primary gate; the grep below is the
    # same `>= N` belt-and-braces check the conformance jobs use. Never lower the
    # ratchet (raise BASELINE_PASS / SHACL_SPARQL_FLOOR as coverage grows).
    #
    # [OPUS-4.8] sq-6glcr: this job ALSO gates the FULL vendored SHACL **1.2**
    # suite (shacl12-test-suite/tests), not just the 1.0/1.1 data-shapes core/node
    # slice. The full core manifest tree (w3c_core_full_shacl12 — complex / misc /
    # node / path / property / targets / validation-reports), the 1.2 SPARQL suite
    # (w3c_sparql_shacl12, including the 7 `mf:result sht:Failure` rejection
    # entries), and the node-expr suites (w3c_node_expr{,_constraints}) each carry
    # their own ratchet floor and run in BOTH feature states (default + shacl-af).
    # See research/shacl12-conformance-gap.md for the per-category gap map.
    name: W3C SHACL conformance (ratchet — core >= 98, sparql >= 5; full 1.2 ratchets in-runner)
    # [FABLE-5] sq-fmx4u.3: this lane runs only `cargo test -p sparq-shacl`; skip
    # when ENFORCED selection proves sparq-shacl unaffected (fail-closed guard).
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-shacl"'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch W3C SHACL test suite (pinned)
        run: ./crates/sparq-shacl/fetch-shacl-tests.sh
      - name: Run SHACL core + SHACL-SPARQL suites
        # The runners assert their own pinned floors; capture the scoreboards so
        # the grep gate below can re-check the pass counts.
        # [OPUS-4.8] sq-shacl-flake: STEP-LEVEL transient self-heal (mirrors the
        # sq-c76x retry idiom on the main nextest job). A transient crates.io
        # download hiccup (`curl failed` mid-fetch) aborts `cargo test` BEFORE
        # any test runs, leaving shacl-conformance.out empty; the previous
        # single-shot invocation then let the ratchet step below mis-report that
        # empty scoreboard as a phantom "conformance regressed below the ratchet"
        # (`? < 98`) that jammed the merge queue across unrelated PRs. Re-running
        # the whole invocation lets such a transient self-heal. A GENUINE
        # conformance regression fails the runner's own `assert!(pass >= floor)`
        # on every attempt and still correctly reds the job — the floor is never
        # weakened. `rc` is captured explicitly (set -e-safe) so a real failure
        # surfaces rather than silently exiting 0.
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::SHACL conformance — attempt $attempt/$MAX_ATTEMPTS"
            rc=0
            # `tee` would mask cargo's exit code via the pipe, so capture it from
            # PIPESTATUS[0] (cargo), not the pipeline's last command (tee).
            cargo test -p sparq-shacl --test w3c_core --test w3c_sparql -- --nocapture \
              | tee shacl-conformance.out
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "SHACL conformance suites passed on attempt $attempt"
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::SHACL conformance run failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient. Inspect the cargo/test output above (a real conformance regression trips the runner's own assert!(pass >= floor); a 'curl failed'/download error is an infra flake, not a conformance change)."
              exit "$rc"
            fi
            echo "::warning::SHACL conformance attempt $attempt failed (exit $rc) — retrying once (sq-shacl-flake transient self-heal: most often a transient crates.io download hiccup before any test ran)."
            attempt=$((attempt + 1))
          done
      - name: Run FULL W3C SHACL 1.2 suites (core / sparql / node-expr, both feature states)
        # [OPUS-4.8] sq-6glcr: gate the FULL vendored SHACL 1.2 tree. Each runner
        # carries its own pinned ratchet floor (pass must not drop, gap must not
        # grow) and self-SKIPs when the fixtures are absent, so this step is the
        # primary gate for the 1.2 surface; the scoreboards are captured for the
        # artifact. Run in BOTH feature states — default (SHACL Core + SHACL-SPARQL)
        # and shacl-af (sh:rule / sh:expression / sh:nodeByExpression) — so the
        # feature-gated entries (e.g. nodeByExpression-001, the node-expr suites)
        # are gated too. A genuine regression trips a runner's own
        # `assert!(pass >= floor)` / `assert!(gap <= ceiling)`. The w3c_node_expr*
        # runners are themselves `#[cfg(feature = "shacl-af")]`, so they only
        # produce a scoreboard in the shacl-af pass (compiled out by default).
        run: |
          set -uo pipefail
          SHACL12_TESTS="--test w3c_core_full_shacl12 --test w3c_sparql_shacl12 --test w3c_node_expr --test w3c_node_expr_constraints"
          echo "::group::SHACL 1.2 — default features"
          cargo test -p sparq-shacl $SHACL12_TESTS -- --nocapture \
            | tee -a shacl-conformance.out
          rc_default=${PIPESTATUS[0]}
          echo "::endgroup::"
          echo "::group::SHACL 1.2 — shacl-af feature"
          cargo test -p sparq-shacl --features shacl-af $SHACL12_TESTS -- --nocapture \
            | tee -a shacl-conformance.out
          rc_af=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$rc_default" -ne 0 ] || [ "$rc_af" -ne 0 ]; then
            echo "::error::FULL SHACL 1.2 suite regressed (default rc=$rc_default, shacl-af rc=$rc_af) — a runner's pinned ratchet floor/ceiling tripped. Inspect the per-category scoreboard above; see research/shacl12-conformance-gap.md. The floors are never weakened — closing a gap moves a FAIL to PASS and bumps the floor in the same commit."
            exit 1
          fi
      - name: Enforce ratchet (pass counts must not regress)
        run: |
          CORE_FLOOR=98
          SPARQL_FLOOR=5
          # [OPUS-4.8] sq-shacl-flake: distinguish "scoreboard never produced"
          # (the test step did not emit a TOTAL line — e.g. an infra/compile
          # flake) from a GENUINE pass-count regression, so an empty scoreboard
          # is never mis-reported as "conformance regressed below the ratchet"
          # (the phantom `? < 98` that jammed the queue). With the step-level
          # retry above this should not happen, but if it does we fail with an
          # HONEST, distinct diagnostic instead of a false regression claim.
          if ! grep -qE '^TOTAL ' shacl-conformance.out; then
            echo "::error::SHACL conformance scoreboard is missing/empty — the test step produced no 'TOTAL' line. This is an INFRA/build failure (e.g. a transient crates.io download), NOT a conformance regression. Re-run the job; inspect the 'Run SHACL core + SHACL-SPARQL suites' step output above."
            exit 1
          fi
          # core runner prints: "TOTAL  <pass> <fail> <skip>"
          CORE_PASS=$(grep -E '^TOTAL ' shacl-conformance.out | awk '{print $2}' | head -1)
          # sparql runner prints: "pass <n> / fail <m> / skip <k>"
          SPARQL_PASS=$(grep -oE 'pass [0-9]+ / fail' shacl-conformance.out | grep -oE '[0-9]+' | head -1)
          echo "SHACL core pass: ${CORE_PASS:-unknown} (floor $CORE_FLOOR); SHACL-SPARQL pass: ${SPARQL_PASS:-unknown} (floor $SPARQL_FLOOR)"
          [ -n "$CORE_PASS" ] && [ "$CORE_PASS" -ge "$CORE_FLOOR" ] || { echo "::error::SHACL core regressed below the ratchet (${CORE_PASS:-?} < $CORE_FLOOR)"; exit 1; }
          [ -n "$SPARQL_PASS" ] && [ "$SPARQL_PASS" -ge "$SPARQL_FLOOR" ] || { echo "::error::SHACL-SPARQL regressed below the ratchet (${SPARQL_PASS:-?} < $SPARQL_FLOOR)"; exit 1; }
      - name: Upload scoreboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shacl-conformance
          path: shacl-conformance.out

  geo-conformance:
    # [OPUS-4.8] sq-ncvq.16 — OGC GeoSPARQL conformance RATCHET, promoted to a
    # DEDICATED gating job so it is surfaced in the central conformance scoreboard
    # alongside SPARQL / inference / SHACL (it formerly ran only inside the generic
    # `cargo test --workspace` shards, invisible as a conformance check). The
    # ratchet itself is the in-source corpus in
    # crates/sparq-geo/tests/ogc_compliance_ratchet.rs (NOT fixture-gated — no fetch
    # needed): the runner asserts `fail == 0` AND a pass-count FLOOR
    # (OGC_RATCHET_FLOOR) that may only RISE. This job runs that runner with
    # --nocapture and re-checks the printed `pass N / fail M (floor F)` line as the
