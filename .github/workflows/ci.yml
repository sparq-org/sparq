              echo "::error::OGC GeoSPARQL query-rewrite run failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient. A real regression trips the runner's own assert!(pass >= floor)/fail==0."
              exit "$rc"
            fi
            echo "::warning::OGC GeoSPARQL query-rewrite attempt $attempt failed (exit $rc) — retrying once (sq-shacl-flake transient self-heal)."
            attempt=$((attempt + 1))
          done
      - name: Enforce ratchet (query-rewrite pass count must not regress)
        run: |
          GEO_QR_FLOOR=38
          if ! grep -qE 'pass [0-9]+ / fail' geo-query-rewrite.out; then
            echo "::error::OGC GeoSPARQL query-rewrite scoreboard is missing/empty — the test step produced no 'pass N / fail M' line. This is an INFRA/build failure, NOT a conformance regression. Re-run the job."
            exit 1
          fi
          GEO_QR_PASS=$(grep -oE 'pass [0-9]+ / fail' geo-query-rewrite.out | grep -oE '[0-9]+' | head -1)
          echo "OGC GeoSPARQL query-rewrite pass: ${GEO_QR_PASS:-unknown} (floor $GEO_QR_FLOOR)"
          [ -n "$GEO_QR_PASS" ] && [ "$GEO_QR_PASS" -ge "$GEO_QR_FLOOR" ] || { echo "::error::OGC GeoSPARQL query-rewrite regressed below the ratchet (${GEO_QR_PASS:-?} < $GEO_QR_FLOOR)"; exit 1; }
      - name: Emit consolidated conformance scoreboard
        # [OPUS-4.8] sq-ncvq.16: render the ONE central scoreboard index (all suites
        # + floors across crates) into this job's step summary, so the GeoSPARQL job
        # surfaces where it sits in the whole conformance picture.
        run: |
