          TEXT_ASSERTIONS=$(grep -oE 'text-search differential oracle assertions [0-9]+' text-oracle.out | grep -oE '[0-9]+' | head -1)
          echo "sparq-text BM25 differential oracle assertions: ${TEXT_ASSERTIONS:-unknown} (floor $TEXT_ORACLE_FLOOR)"
          [ -n "$TEXT_ASSERTIONS" ] && [ "$TEXT_ASSERTIONS" -ge "$TEXT_ORACLE_FLOOR" ] || { echo "::error::sparq-text BM25 differential oracle regressed below the floor (${TEXT_ASSERTIONS:-?} < $TEXT_ORACLE_FLOOR)"; exit 1; }
      - name: Emit consolidated conformance scoreboard
        # Render the ONE central scoreboard index (all suites + floors across crates,
        # including this EXTENSION row) into this job's step summary, so it surfaces
        # where the text oracle sits in the whole picture.
        run: |
          cargo run --profile release-fast -p sparq-conformance --bin sparq-conformance-scoreboard
          cat conformance-scoreboard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scoreboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
