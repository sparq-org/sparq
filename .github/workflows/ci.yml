              echo "::error::sparq-text BM25 differential oracle failed after $attempt attempt(s) (exit $rc) — genuine failure, not a single transient. A real scoring regression trips the runner's own assert!(assertions >= floor) or a per-hit bit-exact score mismatch; a 'curl failed'/download error is an infra flake, not a scoring change."
