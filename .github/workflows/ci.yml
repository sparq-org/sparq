          # infra/compile flake left the .out with no assertions line) from a GENUINE
          # regression, so an empty output is never mis-reported as "regressed below
          # the floor".
          if ! grep -qE 'text-search differential oracle assertions [0-9]+ \(floor [0-9]+\)' text-oracle.out; then
            echo "::error::sparq-text BM25 oracle output is missing/empty — the test step produced no 'text-search differential oracle assertions N (floor F)' line. This is an INFRA/build failure (e.g. a transient crates.io download), NOT a scoring regression. Re-run the job; inspect the 'Run sparq-text BM25 differential oracle' step output above."
            exit 1
          fi
