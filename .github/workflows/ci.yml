          # (`pub const FLOOR: usize = N;`) instead of hard-coded here. That kills
          # the #1463 floor-DRIFT class structurally: the runner's `assert!`, the
          # `scoreboard::SUITES` `ratchet_floor`, AND this belt-and-braces grep gate
          # now all read the SAME number, so this gate can never disagree with the
          # runner (a lowered lib const lowers ALL three at once, and the runner's
          # own `assert!(pass >= FLOOR)` still reds the job). The helper greps the
          # first `const FLOOR: usize = N;` out of a floor module.
          floor_of() {
