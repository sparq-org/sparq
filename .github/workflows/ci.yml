    # scoreboard bin — skip only when ENFORCED selection proves BOTH unaffected.
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-geo"') ||
       contains(needs.select.outputs.affected, '"sparq-conformance"'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-5] sq-h2gz6 + [SONNET-4.6] sq-6vshe.15 lever 2 / sq-aemq7 — CACHE-SAVE
          # DISCIPLINE: restore always, save on push-to-main only. Rationale + the
          # seeder argument are on the `build-archive` cache step above (the canonical
          # note); pinned by scripts/tests/test_mergequeue_cache_posture.py.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run OGC GeoSPARQL topology compliance ratchet
        # The runner asserts its own floor (OGC_RATCHET_FLOOR) + fail==0; capture the
        # scoreboard so the grep gate below re-checks the pass count.
        # [OPUS-4.8] sq-shacl-flake (generalized from #1236): STEP-LEVEL transient
        # self-heal. A transient crates.io download hiccup (`curl failed` mid-fetch)
        # aborts `cargo test` BEFORE any test runs, leaving geo-conformance.out empty;
        # a single-shot invocation then let the ratchet step below mis-report that
        # empty scoreboard as a phantom "regressed below the ratchet". Re-running the
        # whole invocation lets such a transient self-heal. A GENUINE regression fails
        # the runner's own `assert!(pass >= floor)`/`fail == 0` on every attempt and
        # still correctly reds the job — the floor is never weakened. `rc` is captured
        # from PIPESTATUS[0] (cargo, not tee) so a real failure surfaces.
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=2
          attempt=1
          while true; do
            echo "::group::OGC GeoSPARQL conformance — attempt $attempt/$MAX_ATTEMPTS"
