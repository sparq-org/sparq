# [GPT-6] zkp-10.1: detached guest compilation and genuine local proofs.
name: zk-exact-evaluator

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "zk/sparql-evaluator/**"
      - "crates/sparq-core/**"
      - "crates/sparq-engine/**"
      - "crates/sparq-substrate/**"
      - "vendor/spargebra/**"
      - "Cargo.toml"
      - "rust-toolchain*"
      - ".github/workflows/zk-exact-evaluator.yml"
  push:
    branches: [main]
    paths:
      - "zk/sparql-evaluator/**"
      - "crates/sparq-core/**"
      - "crates/sparq-engine/**"
      - "crates/sparq-substrate/**"
      - "vendor/spargebra/**"
      - "Cargo.toml"
      - "rust-toolchain*"
      - ".github/workflows/zk-exact-evaluator.yml"

permissions:
  contents: read

concurrency:
  group: zk-exact-evaluator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RISC0_BUILD_LOCKED: 1

jobs:
  exact-evaluator:
    name: real exact-dataset guest and proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install checksum-pinned RISC Zero binaries and guest Rust
        # Official release-asset SHA256 digests, pinned with the exact SDK version.
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/sparq-risc0-3.0.6"
          mkdir -p "$tool_root/bin" "$tool_root/home/toolchains/v1.97.0-rust-x86_64-unknown-linux-gnu"
          curl --fail --location --retry 3 https://github.com/risc0/risc0/releases/download/v3.0.6/cargo-risczero-x86_64-unknown-linux-gnu.tgz -o "$tool_root/cli.tgz"
          curl --fail --location --retry 3 https://github.com/risc0/rust/releases/download/r0.1.97.0/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz -o "$tool_root/rust.tar.gz"
          echo "615d961bfb81d318db5071d7548389c850e324ac7f421c075176daf26082a60a  $tool_root/cli.tgz" | sha256sum --check --strict
          echo "100b597d605b706bec94e1d32bfaaf5851df8d75173f986d4b56a3e90916be53  $tool_root/rust.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_root/cli.tgz" -C "$tool_root/bin"
          tar -xzf "$tool_root/rust.tar.gz" -C "$tool_root/home/toolchains/v1.97.0-rust-x86_64-unknown-linux-gnu"
          printf '[default_versions]\nrust = "1.97.0"\n' > "$tool_root/home/settings.toml"
          "$tool_root/bin/r0vm" --version
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          echo "RISC0_HOME=$tool_root/home" >> "$GITHUB_ENV"
          echo "RISC0_SERVER_PATH=$tool_root/bin/r0vm" >> "$GITHUB_ENV"

      - name: Activate pinned host Rust
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: zk-exact-evaluator-risc0-3.0.6-rust-1.97.0
          workspaces: zk/sparql-evaluator
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Native semantic and admission regressions
        run: cargo test --locked --manifest-path zk/sparql-evaluator/Cargo.toml -p sparq-proved-evaluator-model --features evaluate

      - name: Actual guest execution and real proof tamper tests
        # No ignored-test shortcut, mock mode, or missing-tool success.
        run: cargo test --locked --manifest-path zk/sparql-evaluator/Cargo.toml -p sparq-proved-evaluator -- --nocapture --test-threads=1

      - name: Scoped detached-workspace lint
        run: cargo clippy --locked --manifest-path zk/sparql-evaluator/Cargo.toml --workspace --all-targets --features sparq-proved-evaluator-model/evaluate -- -D warnings
