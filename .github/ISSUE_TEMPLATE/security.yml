# [OPUS-4.8] Governance: security-redirect issue form (bead sq-rau7). Redirects to private disclosure.
name: Security vulnerability
description: Please do NOT report security issues here — use private disclosure.
title: "[do-not-use] report security issues privately — see SECURITY.md"
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        # ⚠️ Do not report security vulnerabilities in a public issue.

        Public issues are visible to everyone, which would disclose the vulnerability
        before a fix exists. **Please close this form and report privately instead.**

        ## How to report privately

        1. **GitHub Security Advisories (preferred):**
           [Report a vulnerability](https://github.com/sparq-org/sparq/security/advisories/new)
           — keeps the report and fix coordination private.
        2. **Email:** jesse@jeswr.org with subject `[sparq security] <short summary>`.

        See [SECURITY.md](https://github.com/sparq-org/sparq/blob/main/SECURITY.md) for the
        full policy, response expectations, and supported versions.

        ## Already-known limitations (no report needed)

        The `sparq-zk*` and `sparq-mpc` crates are **research scaffolds with no security
        guarantee** — the v1 ZK verifier is not sound (see
        [research/zk-soundness-audit.md](https://github.com/sparq-org/sparq/blob/main/research/zk-soundness-audit.md))
        and MPC cryptography is deferred. These gaps are documented; you do not need to
        report them. Reports of *new* failure classes, or of a gap in a part we claim is
        sound, are very welcome — through the private channels above.
  - type: checkboxes
    id: acknowledge
    attributes:
      label: Acknowledgement
      options:
        - label: I understand I should report security vulnerabilities privately (GitHub Security Advisories or jesse@jeswr.org), not in this public issue.
          required: true
