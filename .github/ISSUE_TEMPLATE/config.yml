# [OPUS-4.8] Governance: issue-template chooser config (bead sq-rau7).
# Disable blank issues so reporters pick a template (and so security reports are
# routed to private disclosure rather than an unstructured public issue).
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/sparq-org/sparq/security/advisories/new
    about: Do NOT file security issues publicly. Report privately via GitHub Security Advisories (or email jesse@jeswr.org). See SECURITY.md.
  - name: Security policy (SECURITY.md)
    url: https://github.com/sparq-org/sparq/blob/main/SECURITY.md
    about: How to report vulnerabilities, response expectations, and the no-guarantee caveats for the sparq-zk*/sparq-mpc research scaffolds.
  - name: Contributing guide
    url: https://github.com/sparq-org/sparq/blob/main/CONTRIBUTING.md
    about: How to work on sparq — the build/test/lint/ratchet gate and conventions (points to AGENTS.md).
