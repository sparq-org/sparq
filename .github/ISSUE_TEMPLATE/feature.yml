# Governance: feature-request issue form (bead sq-rau7).
name: Feature request
description: Suggest a new capability or an improvement to sparq.
title: "[feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! sparq is an experimental, pre-1.0 research engine, so
        the API is unstable and not every request will fit the roadmap — but we read them all.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like sparq to do? Sketch the API/CLI/HTTP shape if you have one in mind.
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Affected surface / crate
      description: Where would this live? e.g. sparq-engine, sparq-cli, sparq-server, a binding, a capability crate.
      placeholder: sparq-cli
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one is preferable.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, related specs (W3C SPARQL/SHACL/RDF), or use cases.
    validations:
      required: false
